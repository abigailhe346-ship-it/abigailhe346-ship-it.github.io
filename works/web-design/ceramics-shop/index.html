<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>土与釉 Tsuchi & Glaze — 手作陶艺所</title>
<style>
:root{
  --paper:#EFE8DD; --card:#F4EEE4; --ink:#3B352E; --clay:#A96A4A; --celadon:#87937F;
  --line:rgba(59,53,46,.22); --fade:rgba(59,53,46,.55);
  --serif:Didot,"Bodoni MT",Georgia,"Songti SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC",sans-serif;
  --mono:"SF Mono",Menlo,monospace;
  --ease:cubic-bezier(.22,.9,.24,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:14px 26px;background:rgba(239,232,221,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  font:10px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.top .sig{line-height:1.7;text-align:center}
.top .sig b{font-weight:700}
.basket{display:flex;align-items:center;gap:9px;border:1px solid var(--ink);padding:8px 14px;transition:.25s;position:relative}
.basket:hover{background:var(--ink);color:var(--paper)}
.basket .n{font:700 11px var(--mono);color:var(--clay);transition:.25s}
.basket:hover .n{color:var(--paper)}
.basket.pop{animation:pop .45s var(--ease)}
@keyframes pop{40%{transform:scale(1.12) rotate(-2deg)}}
.top .back:hover{opacity:.55}
@media(max-width:720px){.top{padding:11px 14px}.top .sig div{display:none}}

/* ---------- hero ---------- */
.hero{position:relative;max-width:1240px;margin:0 auto;padding:80px 26px 60px;display:grid;grid-template-columns:1fr auto;gap:36px;align-items:end}
.hero .kick{font:10px var(--mono);letter-spacing:.3em;color:var(--clay);text-transform:uppercase;margin-bottom:20px}
.hero h1{font:400 clamp(46px,7.5vw,104px)/1.02 var(--serif);letter-spacing:.01em}
.hero h1 em{font-style:italic;color:var(--celadon)}
.hero p{max-width:360px;font-size:13px;line-height:2;color:var(--fade);margin-top:24px}
.vtext{writing-mode:vertical-rl;font:400 15px/2.6 var(--serif);letter-spacing:.5em;color:var(--clay);
  border-left:1px solid var(--line);padding-left:20px;height:320px}
@media(max-width:720px){.hero{grid-template-columns:1fr;padding:48px 18px 36px}.vtext{display:none}}

/* ---------- filter ---------- */
.filter{max-width:1240px;margin:0 auto;padding:0 26px 30px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filter .lbl{font:9px var(--mono);letter-spacing:.26em;text-transform:uppercase;color:var(--fade);margin-right:10px}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:99px;padding:8px 15px 8px 10px;
  font:11px var(--sans);letter-spacing:.04em;transition:.3s var(--ease)}
.chip .sw{width:14px;height:14px;border-radius:50%;border:1px solid rgba(59,53,46,.35);flex:none}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.on .sw{border-color:rgba(255,255,255,.5)}
.count{margin-left:auto;font:10px var(--mono);letter-spacing:.14em;color:var(--fade)}
@media(max-width:720px){.filter{padding:0 16px 22px}.count{width:100%;margin:6px 0 0}}

/* ---------- grid ---------- */
.grid{max-width:1240px;margin:0 auto;padding:0 26px 100px;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
@media(max-width:720px){.grid{padding:0 16px 70px}}
.item{position:relative;background:var(--card);border:1px solid var(--line);cursor:pointer;overflow:hidden;
  opacity:0;transform:translateY(20px);transition:opacity .55s var(--ease),transform .55s var(--ease),box-shadow .4s var(--ease)}
.item.show{opacity:1;transform:none}
.item.gone{display:none}
.item:hover{box-shadow:0 26px 50px -24px rgba(59,53,46,.4)}
.stage{height:280px;display:grid;place-items:center;position:relative;overflow:hidden}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 42%,rgba(255,255,255,.55),transparent 70%)}
.stage svg{height:230px;width:auto;transition:transform .7s var(--ease);position:relative}
.item:hover .stage svg{transform:rotate(-3.5deg) translateY(-6px) scale(1.04)}
.item .kanji{position:absolute;top:14px;left:16px;writing-mode:vertical-rl;font:400 13px/1 var(--serif);letter-spacing:.3em;color:var(--fade)}
.info{border-top:1px solid var(--line);padding:15px 18px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.info h3{font:400 19px/1.2 var(--serif)}
.info .sub{font:italic 10.5px var(--serif);color:var(--celadon);margin-top:4px}
.info .price{font:12px var(--mono);color:var(--clay);white-space:nowrap}
.item .gz{position:absolute;top:12px;right:12px;font:9px var(--mono);letter-spacing:.14em;color:var(--fade);
  border:1px solid var(--line);padding:4px 9px;background:rgba(244,238,228,.7)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:4vmin;
  background:rgba(59,53,46,.42);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
.modal.open{opacity:1;pointer-events:auto}
.box{width:min(860px,100%);max-height:92vh;overflow:auto;background:var(--card);border:1px solid var(--line);
  box-shadow:0 44px 90px -30px rgba(40,34,28,.55);transform:translateY(24px);transition:transform .45s var(--ease);position:relative}
.modal.open .box{transform:none}
.cols{display:grid;grid-template-columns:1fr 1fr}
.cols .left{padding:44px 30px;display:grid;place-items:center;border-right:1px solid var(--line);position:relative;min-height:420px}
.cols .left::before{content:"";position:absolute;inset:0;background:radial-gradient(62% 52% at 50% 44%,rgba(255,255,255,.6),transparent 72%)}
.cols .left svg{height:min(400px,50vh);width:auto;position:relative;animation:breathe 5s var(--ease) infinite}
@keyframes breathe{50%{transform:translateY(-7px) rotate(-1.2deg)}}
.cols .right{padding:36px 32px 26px;display:flex;flex-direction:column}
.kick{font:9px var(--mono);letter-spacing:.3em;color:var(--clay);text-transform:uppercase}
.cols h2{font:400 38px/1.05 var(--serif);margin:12px 0 3px}
.cols .sub{font:italic 13px var(--serif);color:var(--celadon);margin-bottom:18px}
.row{display:flex;justify-content:space-between;font:11px var(--mono);letter-spacing:.06em;color:var(--fade);padding:9px 0;border-top:1px dashed var(--line)}
.row b{color:var(--ink);font-weight:400}
.tale{margin:16px 0;font-size:12.5px;line-height:2.05;color:var(--ink)}
.buyrow{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:14px;padding-top:16px;border-top:1px solid var(--line)}
.buyrow .p{font:400 22px var(--serif)}
.buyrow .p small{font:10px var(--mono);color:var(--fade);display:block;letter-spacing:.12em;margin-top:2px}
.buy{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--paper);padding:13px 24px;
  font:10px var(--mono);letter-spacing:.22em;text-transform:uppercase;transition:.3s}
.buy:hover{background:var(--clay)}
.buy.done{background:var(--celadon)}
.x{position:absolute;top:10px;right:12px;font:20px var(--mono);color:var(--fade);padding:8px;z-index:2}
.x:hover{color:var(--clay)}
@media(max-width:720px){.cols{grid-template-columns:1fr}.cols .left{border-right:none;border-bottom:1px solid var(--line);min-height:300px}}

footer{border-top:1px solid var(--line);padding:24px 26px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  font:9px var(--mono);letter-spacing:.16em;color:var(--fade);text-transform:uppercase}
</style>
</head>
<body>

<header class="top">
  <a class="back" href="../../../index.html#work">← 返回总目</a>
  <div class="sig"><b>№ 08 · TSUCHI &amp; GLAZE</b><div>土与釉 — 手作陶艺所 · 一窑一会</div></div>
  <button class="basket" id="basket">匣 <span class="n" id="basketN">0</span></button>
</header>

<section class="hero">
  <div>
    <div class="kick">HAND-BUILT · WOOD-FIRED · 九件在库</div>
    <h1>一窑<em>一会</em>。</h1>
    <p>每只器物都过了火，也过了手。釉色是窑里长出来的，没有完全一样的第二只。看中就收入匣中——下一窑，是下一窑的事。</p>
  </div>
  <div class="vtext">土は語り、釉は歌う<br>丙午年 春窑</div>
</section>

<div class="filter" id="filter">
  <span class="lbl">按釉色拣选</span>
  <span class="count" id="count"></span>
</div>

<main class="grid" id="grid"></main>

<div class="modal" id="modal">
  <div class="box" role="dialog" aria-modal="true">
    <button class="x" id="closeX" aria-label="关闭">×</button>
    <div class="cols" id="cols"></div>
  </div>
</div>

<footer>
  <span>TSUCHI &amp; GLAZE · № 08 / WEB DESIGN</span>
  <span>器物图形均为内联 SVG 手绘，无照片，无外链</span>
  <span>窑火不熄</span>
</footer>

<script>
/* ---------------- glazes ---------------- */
const GLAZES={
 all:{cn:"全部",sw:"linear-gradient(135deg,#E9E2D3 33%,#A9B8A4 33% 66%,#8C4A32 66%)"},
 bai:{cn:"白釉",base:"#E9E2D3",shade:"#CFC4AE",speck:"#B4A487"},
 qing:{cn:"青釉",base:"#A9B8A4",shade:"#7E9079",speck:"#93A78D"},
 tetsu:{cn:"铁釉",base:"#8C4A32",shade:"#5C2E1E",speck:"#B07855"},
 kuro:{cn:"黑釉",base:"#3D3831",shade:"#211E1A",speck:"#5E564B"},
 yohen:{cn:"窑变",base:"#7E8B97",shade:"#4A5763",speck:"#AEBCC8"}
};

/* ---------------- vessels: path templates (viewBox 0 0 200 200) ---------------- */
const VESSELS={
 bowl:{body:"M44 84 C44 138 68 160 100 160 C132 160 156 138 156 84 Z",rim:"M44 84 A56 9 0 0 1 156 84",foot:"M86 160 L114 160 L110 168 L90 168 Z",hl:"M58 96 C60 118 68 136 82 146"},
 katakuchi:{body:"M46 92 C46 142 70 162 100 162 C130 162 154 142 154 92 L146 84 C146 84 60 84 54 84 Z",rim:"M54 84 C40 80 38 70 34 64 C44 66 52 74 56 84 M56 84 A44 8 0 0 1 146 84",foot:"M88 162 L112 162 L109 169 L91 169 Z",hl:"M60 100 C62 122 70 138 82 148"},
 hanaire:{body:"M84 40 C84 52 76 58 72 70 C66 88 64 120 72 142 C78 158 88 164 100 164 C112 164 122 158 128 142 C136 120 134 88 128 70 C124 58 116 52 116 40 Z",rim:"M84 40 A16 5 0 0 1 116 40",foot:"",hl:"M82 74 C76 96 76 124 84 144"},
 guinomi:{body:"M64 96 C64 132 78 150 100 150 C122 150 136 132 136 96 Z",rim:"M64 96 A36 7 0 0 1 136 96",foot:"M88 150 L112 150 L109 157 L91 157 Z",hl:"M74 106 C75 122 80 134 88 141"},
 plate:{body:"M28 118 C28 132 60 144 100 144 C140 144 172 132 172 118 L172 112 C172 126 140 136 100 136 C60 136 28 126 28 112 Z",rim:"M28 112 A72 12 0 0 1 172 112",foot:"M84 143 L116 143 L112 149 L88 149 Z",hl:"M48 116 A56 9 0 0 1 110 105"},
 pot:{body:"M64 88 C58 116 66 146 100 150 C134 146 142 116 136 88 C134 78 124 72 100 72 C76 72 66 78 64 88 Z",rim:"M82 72 L80 62 A20 6 0 0 1 120 62 L118 72",foot:"M88 150 L112 150 L110 156 L90 156 Z",hl:"M74 96 C72 112 76 128 86 138",extra:"M64 96 C48 92 42 84 44 74 C52 78 60 84 64 90 Z M136 88 C152 82 158 92 152 104 C148 112 140 114 136 110"},
 mizusashi:{body:"M62 82 L62 146 C62 158 78 164 100 164 C122 164 138 158 138 146 L138 82 Z",rim:"M62 82 A38 7 0 0 1 138 82",foot:"M86 164 L114 164 L111 170 L89 170 Z",hl:"M72 94 L72 142",extra:"M70 74 L70 68 A30 8 0 0 1 130 68 L130 74 M96 62 L96 56 L104 56 L104 62"},
 ichirin:{body:"M93 32 C93 44 90 50 88 60 C84 80 76 92 74 112 C72 138 84 158 100 158 C116 158 128 138 126 112 C124 92 116 80 112 60 C110 50 107 44 107 32 Z",rim:"M93 32 A7 3 0 0 1 107 32",foot:"",hl:"M86 96 C82 112 82 134 90 148"},
 kensui:{body:"M52 78 L52 132 C52 152 74 162 100 162 C126 162 148 152 148 132 L148 78 Z",rim:"M52 78 A48 8 0 0 1 148 78",foot:"M86 162 L114 162 L111 169 L89 169 Z",hl:"M62 92 L62 130"}
};

/* ---------------- products ---------------- */
const ITEMS=[
 {id:"TG-01",cn:"白茶碗",jp:"しろ ちゃわん",shape:"bowl",glaze:"bai",price:420,size:"径 12.5 × 高 7.8 cm",temp:"1240°C 还原焰",tale:"碗心积釉处有一圈极淡的月白，是窑位偏左的记号。捧在手里比看上去轻，适合初冬的第一碗薄茶。"},
 {id:"TG-02",cn:"青釉片口",jp:"かたくち",shape:"katakuchi",glaze:"qing",price:560,size:"径 15 × 高 8.5 cm",temp:"1280°C 还原焰",tale:"注口是拉坯后捏出来的，倾水成线。可作冷酒器，也有人拿它盛夏初的青梅。"},
 {id:"TG-03",cn:"铁釉花入",jp:"てつ はないれ",shape:"hanaire",glaze:"tetsu",price:880,size:"径 9 × 高 21 cm",temp:"1260°C 氧化焰",tale:"铁釉在高温里会往下走半寸，肩上的火色因此不匀——窑主说这叫「火走过的证据」。插一枝枯莲最好。"},
 {id:"TG-04",cn:"黑釉ぐい呑",jp:"ぐいのみ",shape:"guinomi",glaze:"kuro",price:320,size:"径 6.5 × 高 5.5 cm",temp:"1230°C 还原焰",tale:"一口的大小。黑釉里掺了本地的铁砂，灯下看有细碎的银星。适合度数不高的夜晚。"},
 {id:"TG-05",cn:"窑变平盘",jp:"ようへん ひらざら",shape:"plate",glaze:"yohen",price:640,size:"径 21 × 高 2.5 cm",temp:"1300°C 窑变",tale:"蓝灰里流出一道意外的紫，每一只的走向都不同。装素色的食物——豆腐、白身鱼、或者什么都先不装。"},
 {id:"TG-06",cn:"白釉注壶",jp:"ちゅうこ",shape:"pot",glaze:"bai",price:980,size:"径 11 × 高 12 cm",temp:"1240°C 还原焰",tale:"壶嘴修了七遍才出水顺畅。把手是后接的细藤形陶条，握上去有一节指节的温度。"},
 {id:"TG-07",cn:"青釉水指",jp:"みずさし",shape:"mizusashi",glaze:"qing",price:760,size:"径 13 × 高 14 cm",temp:"1280°C 还原焰",tale:"茶席上储清水的罐子，盖子与罐身同窑烧成，所以严丝合缝。不开茶会的人，拿它装盐也很好。"},
 {id:"TG-08",cn:"铁釉一轮插",jp:"いちりんざし",shape:"ichirin",glaze:"tetsu",price:540,size:"径 7 × 高 19 cm",temp:"1260°C 氧化焰",tale:"只插一枝。瓶颈细，花茎自己会站直。摆在窗台，下午四点的光会把影子拉成另一件器物。"},
 {id:"TG-09",cn:"黑釉建水",jp:"けんすい",shape:"kensui",glaze:"kuro",price:680,size:"径 14 × 高 11 cm",temp:"1230°C 还原焰",tale:"本是茶席上接废水的角色，做得却最沉静。也有人拿它当花器——器物自己并不在意名分。"}
];

/* deterministic dots */
function rng(seed){let s=seed*7919+13;return()=>{s=(s*9301+49297)%233280;return s/233280}}
let gid=0;
function vesselSVG(item,big){
  const v=VESSELS[item.shape],g=GLAZES[item.glaze],r=rng(item.id.charCodeAt(3)*31+item.id.charCodeAt(4));
  const id="g"+(gid++);
  let speck="";
  for(let i=0;i<26;i++){const x=45+r()*110,y=40+r()*120,rad=.6+r()*1.3;
    speck+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rad.toFixed(1)}" fill="${g.speck}" opacity="${(.25+r()*.4).toFixed(2)}"/>`}
  let streaks="";
  if(item.glaze==="yohen")for(let i=0;i<5;i++){const x=60+r()*80;
    streaks+=`<path d="M${x} 70 q ${r()*16-8} 40 ${r()*20-10} 84" stroke="#C9A8B8" stroke-width="${1+r()*2}" fill="none" opacity=".4"/>`}
  return `<svg viewBox="0 0 200 200" role="img" aria-label="${item.cn}">
   <defs>
     <linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">
       <stop offset="0" stop-color="${g.base}"/><stop offset="1" stop-color="${g.shade}"/>
     </linearGradient>
   </defs>
   <ellipse cx="100" cy="172" rx="46" ry="6" fill="rgba(59,53,46,.18)"/>
   <path d="${v.body}" fill="url(#${id})" stroke="${g.shade}" stroke-width="1.2"/>
   ${v.foot?`<path d="${v.foot}" fill="${g.shade}"/>`:""}
   ${v.extra?`<path d="${v.extra}" fill="url(#${id})" stroke="${g.shade}" stroke-width="1.2"/>`:""}
   <path d="${v.rim}" fill="none" stroke="${g.shade}" stroke-width="1.6"/>
   <path d="${v.hl}" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="3" stroke-linecap="round" opacity=".6"/>
   <g clip-path="url(#c${id})">${speck}${streaks}</g>
   <clipPath id="c${id}"><path d="${v.body}"/></clipPath>
  </svg>`;
}

/* ---------------- grid ---------------- */
const grid=document.getElementById("grid"),count=document.getElementById("count");
grid.innerHTML=ITEMS.map((it,i)=>`
 <article class="item" data-glaze="${it.glaze}" data-id="${it.id}" tabindex="0" role="button" aria-label="细看${it.cn}">
   <div class="stage"><span class="kanji">${["土","釉","火","手","窑","寂","器","光","水"][i]}</span>${vesselSVG(it)}</div>
   <span class="gz">${GLAZES[it.glaze].cn}</span>
   <div class="info"><div><h3>${it.cn}</h3><div class="sub">${it.jp}</div></div><span class="price">¥${it.price}</span></div>
 </article>`).join("");
const cards=[...grid.children];
requestAnimationFrame(()=>cards.forEach((c,i)=>setTimeout(()=>c.classList.add("show"),60*i)));

/* ---------------- glaze filter ---------------- */
const filter=document.getElementById("filter");
Object.entries(GLAZES).forEach(([k,g],i)=>{
  const b=document.createElement("button");b.className="chip"+(k==="all"?" on":"");b.dataset.k=k;
  const sw=k==="all"?`background:${g.sw}`:`background:linear-gradient(135deg,${g.base},${g.shade})`;
  b.innerHTML=`<span class="sw" style="${sw}"></span>${g.cn}`;
  filter.insertBefore(b,count);
});
function updateCount(){const n=cards.filter(c=>!c.classList.contains("gone")).length;count.textContent=`${n} / ${ITEMS.length} 件在库`}
updateCount();
filter.addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;
  filter.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b));
  let shown=0;
  cards.forEach(c=>{
    const ok=b.dataset.k==="all"||c.dataset.glaze===b.dataset.k;
    c.classList.toggle("gone",!ok);
    if(ok){c.classList.remove("show");setTimeout(()=>c.classList.add("show"),40+shown*50);shown++}
  });
  updateCount();
});

/* ---------------- modal + basket ---------------- */
const modal=document.getElementById("modal"),cols=document.getElementById("cols"),basket=document.getElementById("basket");
let basketN=0;const inBasket=new Set();
function openItem(id){
  const it=ITEMS.find(x=>x.id===id),g=GLAZES[it.glaze];
  cols.innerHTML=`
   <div class="left">${vesselSVG(it,true)}</div>
   <div class="right">
     <div class="kick">${it.id} · ${g.cn} · 仅此一件</div>
     <h2>${it.cn}</h2><div class="sub">${it.jp}</div>
     <div class="row"><span>尺寸</span><b>${it.size}</b></div>
     <div class="row"><span>烧成</span><b>${it.temp}</b></div>
     <div class="row"><span>釉色</span><b>${g.cn}</b></div>
     <div class="row"><span>作者</span><b>窑主手签 · 底款在足内</b></div>
     <p class="tale">${it.tale}</p>
     <div class="buyrow">
       <div class="p">¥${it.price}<small>含桐箱与作者手记</small></div>
       <button class="buy${inBasket.has(id)?" done":""}" id="buyB">${inBasket.has(id)?"已在匣中 ✓ 再点取出":"收入匣中"}</button>
     </div>
   </div>`;
  modal.classList.add("open");document.body.style.overflow="hidden";
  document.getElementById("buyB").onclick=()=>{
    if(inBasket.has(id))inBasket.delete(id);else inBasket.add(id);
    basketN=inBasket.length;
    document.getElementById("basketN").textContent=basketN;
    basket.classList.remove("pop");void basket.offsetWidth;basket.classList.add("pop");
    openItem(id);
  };
}
function closeModal(){modal.classList.remove("open");document.body.style.overflow=""}
grid.addEventListener("click",e=>{const c=e.target.closest(".item");if(c)openItem(c.dataset.id)});
grid.addEventListener("keydown",e=>{if(e.key==="Enter"){const c=e.target.closest(".item");if(c)openItem(c.dataset.id)}});
document.getElementById("closeX").onclick=closeModal;
modal.addEventListener("click",e=>{if(e.target===modal)closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
basket.onclick=()=>{
  if(!inBasket.size){basket.classList.remove("pop");void basket.offsetWidth;basket.classList.add("pop");return}
  const names=ITEMS.filter(i=>inBasket.has(i.id)).map(i=>i.cn).join("、");
  const total=ITEMS.filter(i=>inBasket.has(i.id)).reduce((s,i)=>s+i.price,0);
  cols.innerHTML=`<div class="right" style="grid-column:1/-1;padding:44px 40px">
    <div class="kick">你的匣 · ${inBasket.size} 件</div>
    <h2 style="margin:14px 0 18px">${names}</h2>
    <div class="row"><span>合计</span><b>¥${total}</b></div>
    <p class="tale">匣中器物会为你保留到本窑售罄。结账一事，这个页面就不管了——它只管喜欢。</p>
    <div class="buyrow"><div class="p">¥${total}<small>桐箱另计，心意免费</small></div>
    <button class="buy" id="clearB">清空匣</button></div></div>`;
  modal.classList.add("open");document.body.style.overflow="hidden";
  document.getElementById("clearB").onclick=()=>{inBasket.clear();basketN=0;document.getElementById("basketN").textContent=0;closeModal()};
};
</script>
</body>
</html>
