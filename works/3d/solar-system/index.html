<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orrery — 太阳系仪 No.05</title>
<style>
  :root{
    --bg:#070b1a;
    --panel:#0c1226;
    --line:#24304f;
    --brass:#d4a94e;
    --ivory:#ece7d9;
    --dim:#5d6a8f;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);}
  body{font-family:"SF Mono",Menlo,"Courier New",monospace;color:var(--ivory);
       -webkit-font-smoothing:antialiased;}
  #stage{position:fixed;inset:0;cursor:grab;}
  #stage:active{cursor:grabbing;}
  #stage canvas{display:block;width:100%;height:100%;}

  .plate{position:fixed;top:24px;left:26px;z-index:10;pointer-events:none;}
  .plate .no{font-size:10px;letter-spacing:.4em;color:var(--brass);}
  .plate h1{font-family:Didot,"Bodoni MT",Georgia,"Songti SC",serif;
            font-size:24px;font-weight:400;letter-spacing:.14em;margin-top:6px;}
  .plate .sub{font-size:10px;letter-spacing:.3em;color:var(--dim);margin-top:5px;}
  .plate .rule{width:64px;height:1px;background:linear-gradient(90deg,var(--brass),transparent);margin-top:10px;}

  .readout{position:fixed;top:26px;right:26px;z-index:10;text-align:right;pointer-events:none;
           font-size:10px;letter-spacing:.22em;color:var(--dim);line-height:2.0;}
  .readout b{color:var(--brass);font-weight:400;}
  .readout .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--brass);
                margin-right:8px;vertical-align:1px;animation:pulse 2.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  .hint{position:fixed;left:26px;bottom:24px;z-index:10;pointer-events:none;
        font-size:10px;letter-spacing:.26em;color:var(--dim);line-height:2.1;}
  .hint em{font-style:normal;color:var(--ivory);}

  /* planet labels */
  .plabel{position:fixed;z-index:8;pointer-events:none;transform:translate(-50%,-140%);
          font-family:Didot,"Bodoni MT",Georgia,"Songti SC",serif;
          font-size:11px;letter-spacing:.22em;color:var(--ivory);opacity:.75;
          text-shadow:0 0 8px rgba(7,11,26,.9);transition:opacity .3s;white-space:nowrap;}
  .plabel small{display:block;font-family:"SF Mono",Menlo,monospace;font-size:8px;
                letter-spacing:.3em;color:var(--dim);text-align:center;margin-top:1px;}
  .plabel.hidden{opacity:0;}

  /* info panel */
  .info{position:fixed;right:26px;top:50%;transform:translateY(-50%) translateX(20px);z-index:11;
        width:250px;background:linear-gradient(180deg,rgba(12,18,38,.92),rgba(7,11,26,.95));
        border:1px solid var(--line);backdrop-filter:blur(8px);padding:20px;
        box-shadow:0 24px 60px rgba(0,0,0,.5);opacity:0;pointer-events:none;
        transition:opacity .35s cubic-bezier(.2,.7,.3,1),transform .35s cubic-bezier(.2,.7,.3,1);}
  .info.show{opacity:1;transform:translateY(-50%) translateX(0);pointer-events:auto;}
  .info::before,.info::after{content:"";position:absolute;width:10px;height:10px;border:1px solid var(--brass);}
  .info::before{top:-4px;left:-4px;border-right:none;border-bottom:none;}
  .info::after{bottom:-4px;right:-4px;border-left:none;border-top:none;}
  .info .cn{font-family:Didot,"Bodoni MT",Georgia,"Songti SC",serif;font-size:24px;letter-spacing:.2em;}
  .info .en{font-size:9px;letter-spacing:.34em;color:var(--brass);margin:5px 0 13px;}
  .info dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;
           font-size:10px;letter-spacing:.12em;margin-bottom:13px;}
  .info dt{color:var(--dim);letter-spacing:.26em;}
  .info dd{text-align:right;color:var(--ivory);}
  .info .verse{font-family:Didot,"Songti SC",serif;font-size:12px;line-height:1.9;
               color:var(--dim);border-top:1px solid var(--line);padding-top:11px;}
  .info .close{position:absolute;top:10px;right:12px;cursor:pointer;color:var(--dim);
               font-size:12px;letter-spacing:.1em;transition:color .2s;}
  .info .close:hover{color:var(--brass);}

  .console{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:10;
           display:flex;align-items:stretch;
           background:linear-gradient(180deg,rgba(12,18,38,.88),rgba(7,11,26,.92));
           border:1px solid var(--line);backdrop-filter:blur(8px);
           box-shadow:0 0 0 1px rgba(0,0,0,.5),0 20px 60px rgba(0,0,0,.6);
           max-width:min(900px,calc(100vw - 28px));}
  .console::before,.console::after{content:"";position:absolute;width:10px;height:10px;
           border:1px solid var(--brass);opacity:.85;}
  .console::before{top:-4px;left:-4px;border-right:none;border-bottom:none;}
  .console::after{bottom:-4px;right:-4px;border-left:none;border-top:none;}
  .cell{padding:13px 18px;border-right:1px solid var(--line);display:flex;
        flex-direction:column;justify-content:center;gap:9px;min-width:0;}
  .cell:last-child{border-right:none;}
  .label{font-size:9px;letter-spacing:.32em;color:var(--dim);white-space:nowrap;}

  .btn{appearance:none;border:1px solid var(--brass);background:transparent;color:var(--brass);
       font-family:inherit;font-size:10px;letter-spacing:.28em;padding:11px 15px 10px;cursor:pointer;
       text-transform:uppercase;transition:background .2s cubic-bezier(.2,.7,.3,1),color .2s;}
  .btn:hover{background:var(--brass);color:#070b1a;}
  .btn.ghost{border-color:var(--line);color:var(--ivory);}
  .btn.ghost:hover{background:var(--ivory);color:#070b1a;border-color:var(--ivory);}
  .btn.ghost.off{opacity:.45;}
  .btn:active{transform:translateY(1px);}
  .btnrow{display:flex;gap:9px;flex-wrap:wrap;}

  .slider{display:flex;align-items:center;gap:11px;min-width:170px;}
  input[type=range]{-webkit-appearance:none;appearance:none;width:130px;height:1px;
       background:var(--line);outline:none;cursor:pointer;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
       width:11px;height:15px;background:var(--brass);border:none;cursor:ew-resize;
       box-shadow:0 0 10px rgba(212,169,78,.5);}
  input[type=range]::-moz-range-thumb{width:11px;height:15px;background:var(--brass);
       border:none;cursor:ew-resize;}
  .sval{font-size:10px;color:var(--brass);letter-spacing:.08em;width:38px;text-align:right;}

  .vignette{position:fixed;inset:0;z-index:5;pointer-events:none;
            background:radial-gradient(ellipse at center,transparent 55%,rgba(3,5,12,.55) 100%);}

  @media (max-width:820px){
    .console{flex-wrap:wrap;bottom:12px;}
    .cell{padding:10px 13px;border-right:none;border-top:1px solid var(--line);flex:1 1 42%;}
    .cell:first-child{border-top:none;}
    .hint{display:none;}
    .info{right:12px;left:12px;width:auto;}
    .plate h1{font-size:19px;}
  }
</style>
</head>
<body>
<div id="stage"></div>
<div class="vignette"></div>
<div id="labels"></div>

<div class="plate">
  <div class="no">No.05 — THREE.JS / ORRERY</div>
  <h1>Orrery</h1>
  <div class="sub">太阳系仪 · 黄铜环上的行星巡礼</div>
  <div class="rule"></div>
</div>

<div class="readout">
  <span class="dot"></span>ORRERY RUNNING<br>
  FOCUS <b id="rFocus">全景 OVERVIEW</b><br>
  SPEED <b id="rSpeed">×1.0</b><br>
  FPS <b id="rFps">—</b>
</div>

<div class="hint">
  <em>拖拽</em> 环视 · <em>滚轮</em> 推近拉远<br>
  <em>点击行星</em> 靠近观察 · <em>ESC</em> 回到全景
</div>

<div class="info" id="info">
  <div class="close" id="infoClose">✕</div>
  <div class="cn" id="iCn">地球</div>
  <div class="en" id="iEn">EARTH</div>
  <dl>
    <dt>距日</dt><dd id="iDist">—</dd>
    <dt>公转</dt><dd id="iPeriod">—</dd>
    <dt>自转</dt><dd id="iDay">—</dd>
  </dl>
  <div class="verse" id="iVerse"></div>
</div>

<div class="console">
  <div class="cell">
    <div class="label">时间流速 TIME</div>
    <div class="slider">
      <input type="range" id="sSpeed" min="0" max="80" step="1" value="16">
      <span class="sval" id="vSpeed">×1.0</span>
    </div>
  </div>
  <div class="cell">
    <div class="label">星体 SELECT</div>
    <div class="btnrow" id="planetBtns"></div>
  </div>
  <div class="cell">
    <div class="btnrow">
      <button class="btn ghost" id="btnOrbits">轨道</button>
      <button class="btn ghost" id="btnLabels">名称</button>
      <button class="btn" id="btnReset">全景</button>
    </div>
  </div>
</div>

<script src="../../../vendor/three.min.js"></script>
<script>
(function(){
  "use strict";

  /* ================= data ================= */
  var PLANETS = [
    { cn:"水星", en:"MERCURY", r:0.32, orbit:4.2,  colors:["#9a8f80","#6e655a"], dist:"5,790 万 km", period:"88 天",  day:"58.6 天", verse:"离火最近的一颗，背面却结着冰。" },
    { cn:"金星", en:"VENUS",   r:0.52, orbit:5.9,  colors:["#e0c489","#c39a5c"], dist:"1.08 亿 km", period:"225 天", day:"243 天",  verse:"最亮的晨星，一天比一年更长。" },
    { cn:"地球", en:"EARTH",   r:0.56, orbit:7.8,  colors:["#1a4d8f","#2e7d4f","#e8e4d8"], dist:"1.50 亿 km", period:"365 天", day:"23.9 小时", verse:"目前已知唯一，把光写成诗的地方。", moon:true },
    { cn:"火星", en:"MARS",    r:0.42, orbit:9.7,  colors:["#c1572f","#8f3a1e"], dist:"2.28 亿 km", period:"687 天", day:"24.6 小时", verse:"锈色的荒漠，等下一批远客。" },
    { cn:"木星", en:"JUPITER", r:1.45, orbit:13.8, colors:["#d8b48a","#a97c50","#e8dcc8","#8f6240"], dist:"7.79 亿 km", period:"11.9 年", day:"9.9 小时", verse:"一场刮了三百年的风暴，仍在转。", bands:true, spot:true },
    { cn:"土星", en:"SATURN",  r:1.2,  orbit:17.6, colors:["#e0cfa0","#c4ab74"], dist:"14.3 亿 km", period:"29.5 年", day:"10.7 小时", verse:"把一圈碎冰，戴成了戒指。", ring:true },
    { cn:"天王星", en:"URANUS", r:0.88, orbit:21.6, colors:["#9fd4d8","#6fb0b8"], dist:"28.7 亿 km", period:"84 年",  day:"17.2 小时", verse:"躺着自转的冰巨人，一身青雾。" },
    { cn:"海王星", en:"NEPTUNE", r:0.84, orbit:25.2, colors:["#2f5fc8","#1c3a86"], dist:"45.0 亿 km", period:"164.8 年", day:"16.1 小时", verse:"笔尖上算出来的深蓝边疆。" }
  ];

  var state = { speed:1.0, focus:-1, showOrbits:true, showLabels:true };

  /* ================= renderer ================= */
  var stage = document.getElementById("stage");
  var renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x070b1a, 1);
  stage.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(48, window.innerWidth/window.innerHeight, 0.1, 600);

  scene.add(new THREE.AmbientLight(0x334, 1.1));
  var sunLight = new THREE.PointLight(0xfff0d0, 1.6, 0, 2);
  scene.add(sunLight);

  /* ================= procedural textures ================= */
  function planetTexture(p){
    var c = document.createElement("canvas");
    c.width = 256; c.height = 128;
    var x = c.getContext("2d");
    if (p.bands){
      var n = p.colors.length;
      for (var i = 0; i < 14; i++){
        x.fillStyle = p.colors[i % n];
        var y0 = (i / 14) * 128 + (Math.random() - 0.5) * 6;
        x.fillRect(0, y0, 256, 128 / 14 + 8);
      }
      if (p.spot){
        x.fillStyle = "#c8552e";
        x.beginPath(); x.ellipse(178, 82, 22, 11, 0, 0, 6.2832); x.fill();
        x.fillStyle = "rgba(200,85,46,.5)";
        x.beginPath(); x.ellipse(178, 82, 30, 16, 0, 0, 6.2832); x.fill();
      }
    } else {
      x.fillStyle = p.colors[0]; x.fillRect(0, 0, 256, 128);
      var rnd = 200;
      while (rnd--){
        x.fillStyle = p.colors[(Math.random() * p.colors.length) | 0];
        x.globalAlpha = 0.25 + Math.random() * 0.45;
        x.beginPath();
        x.ellipse(Math.random() * 256, Math.random() * 128,
                  6 + Math.random() * 26, 3 + Math.random() * 9, 0, 0, 6.2832);
        x.fill();
      }
      x.globalAlpha = 1;
      /* subtle terminator-friendly polar shading */
      var g = x.createLinearGradient(0, 0, 0, 128);
      g.addColorStop(0, "rgba(0,0,0,.28)"); g.addColorStop(0.25, "rgba(0,0,0,0)");
      g.addColorStop(0.75, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.28)");
      x.fillStyle = g; x.fillRect(0, 0, 256, 128);
    }
    var t = new THREE.CanvasTexture(c);
    return t;
  }

  function glowTexture(){
    var c = document.createElement("canvas");
    c.width = c.height = 128;
    var x = c.getContext("2d");
    var g = x.createRadialGradient(64, 64, 4, 64, 64, 64);
    g.addColorStop(0, "rgba(255,220,150,1)");
    g.addColorStop(0.25, "rgba(255,180,90,.45)");
    g.addColorStop(1, "rgba(255,150,60,0)");
    x.fillStyle = g; x.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  }

  /* ================= sun ================= */
  var sun = new THREE.Mesh(
    new THREE.SphereGeometry(1.7, 48, 32),
    new THREE.MeshBasicMaterial({ color:0xffd27a })
  );
  scene.add(sun);
  var glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTexture(), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true
  }));
  glow.scale.set(9, 9, 1);
  scene.add(glow);

  /* ================= planets ================= */
  var orbitGroup = new THREE.Group();
  scene.add(orbitGroup);
  var labelBox = document.getElementById("labels");

  PLANETS.forEach(function(p, i){
    p.angle = Math.random() * Math.PI * 2;
    p.speed = 0.9 / Math.pow(p.orbit, 1.2);

    var mat = new THREE.MeshStandardMaterial({
      map: planetTexture(p), roughness: 0.85, metalness: 0.05
    });
    p.mesh = new THREE.Mesh(new THREE.SphereGeometry(p.r, 36, 24), mat);
    p.mesh.userData.index = i;
    p.spin = 0.4 + Math.random() * 0.5;
    scene.add(p.mesh);

    if (p.ring){
      var rc = document.createElement("canvas");
      rc.width = 128; rc.height = 4;
      var rx = rc.getContext("2d");
      for (var s = 0; s < 128; s++){
        rx.fillStyle = "rgba(224,207,160," + (0.15 + 0.75 * Math.abs(Math.sin(s * 0.9))) + ")";
        rx.fillRect(s, 0, 1, 4);
      }
      var ring = new THREE.Mesh(
        new THREE.RingGeometry(p.r * 1.5, p.r * 2.4, 64),
        new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(rc),
          side: THREE.DoubleSide, transparent: true, depthWrite: false })
      );
      ring.rotation.x = -Math.PI / 2 + 0.28;
      p.mesh.add(ring);
    }
    if (p.moon){
      p.moonMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.15, 20, 14),
        new THREE.MeshStandardMaterial({ color:0xb9b4a8, roughness:0.95 })
      );
      scene.add(p.moonMesh);
    }

    /* brass orbit ring */
    var pts = [];
    for (var k = 0; k <= 128; k++){
      var a = k / 128 * Math.PI * 2;
      pts.push(new THREE.Vector3(Math.cos(a) * p.orbit, 0, Math.sin(a) * p.orbit));
    }
    var line = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({ color:0xd4a94e, transparent: true, opacity: 0.32 })
    );
    orbitGroup.add(line);

    /* html label */
    var lb = document.createElement("div");
    lb.className = "plabel";
    lb.innerHTML = p.cn + "<small>" + p.en + "</small>";
    labelBox.appendChild(lb);
    p.label = lb;
  });

  /* background stars */
  (function(){
    var n = 2000, arr = new Float32Array(n * 3);
    for (var i = 0; i < n; i++){
      var th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
      var rr = 140 + Math.random() * 160;
      arr[i*3]   = rr * Math.sin(ph) * Math.cos(th);
      arr[i*3+1] = rr * Math.cos(ph);
      arr[i*3+2] = rr * Math.sin(ph) * Math.sin(th);
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(arr, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({
      color: 0x9aa4cf, size: 0.7, transparent: true, opacity: 0.6, depthWrite: false })));
  })();

  /* ================= camera rig ================= */
  var orbit = { theta:0.7, phi:1.05, radius:34, tTheta:0.7, tPhi:1.05, tRadius:34 };
  var target = new THREE.Vector3(0, 0, 0);
  var targetGoal = new THREE.Vector3(0, 0, 0);
  var tmpV = new THREE.Vector3();

  /* ================= interaction ================= */
  var ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  var dragging = false, moved = 0, px = 0, py = 0;
  stage.addEventListener("pointerdown", function(e){
    dragging = true; moved = 0; px = e.clientX; py = e.clientY;
  });
  stage.addEventListener("pointermove", function(e){
    if (!dragging) return;
    var dx = e.clientX - px, dy = e.clientY - py;
    moved += Math.abs(dx) + Math.abs(dy);
    orbit.tTheta -= dx * 0.005;
    orbit.tPhi = Math.max(0.2, Math.min(Math.PI - 0.35, orbit.tPhi - dy * 0.004));
    px = e.clientX; py = e.clientY;
  });
  stage.addEventListener("pointerup", function(e){
    dragging = false;
    if (moved < 6){
      ndc.x = (e.clientX / window.innerWidth) * 2 - 1;
      ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;
      ray.setFromCamera(ndc, camera);
      var meshes = PLANETS.map(function(p){ return p.mesh; }).concat([sun]);
      var hits = ray.intersectObjects(meshes, true);
      if (hits.length){
        var m = hits[0].object;
        while (m && m.userData.index === undefined) m = m.parent;
        if (m) focusPlanet(m.userData.index);
      }
    }
  });
  stage.addEventListener("wheel", function(e){
    e.preventDefault();
    orbit.tRadius *= (1 + e.deltaY * 0.0009);
    orbit.tRadius = Math.max(3, Math.min(90, orbit.tRadius));
  }, { passive: false });

  function focusPlanet(i){
    state.focus = i;
    var p = PLANETS[i];
    orbit.tRadius = Math.max(p.r * 5.5, 2.6);
    document.getElementById("rFocus").textContent = p.cn + " " + p.en;
    document.getElementById("iCn").textContent = p.cn;
    document.getElementById("iEn").textContent = p.en;
    document.getElementById("iDist").textContent = p.dist;
    document.getElementById("iPeriod").textContent = p.period;
    document.getElementById("iDay").textContent = p.day;
    document.getElementById("iVerse").textContent = p.verse;
    document.getElementById("info").classList.add("show");
  }
  function resetView(){
    state.focus = -1;
    orbit.tRadius = 34; orbit.tPhi = 1.05;
    document.getElementById("rFocus").textContent = "全景 OVERVIEW";
    document.getElementById("info").classList.remove("show");
  }
  document.getElementById("btnReset").addEventListener("click", resetView);
  document.getElementById("infoClose").addEventListener("click", resetView);
  window.addEventListener("keydown", function(e){ if (e.key === "Escape") resetView(); });

  /* planet quick-select buttons */
  var pb = document.getElementById("planetBtns");
  PLANETS.forEach(function(p, i){
    var b = document.createElement("button");
    b.className = "btn ghost";
    b.style.padding = "7px 9px 6px";
    b.style.fontSize = "9px";
    b.textContent = p.cn;
    b.addEventListener("click", function(){ focusPlanet(i); });
    pb.appendChild(b);
  });

  /* toggles + speed */
  var btnOrbits = document.getElementById("btnOrbits");
  btnOrbits.addEventListener("click", function(){
    state.showOrbits = !state.showOrbits;
    orbitGroup.visible = state.showOrbits;
    btnOrbits.classList.toggle("off", !state.showOrbits);
  });
  var btnLabels = document.getElementById("btnLabels");
  btnLabels.addEventListener("click", function(){
    state.showLabels = !state.showLabels;
    btnLabels.classList.toggle("off", !state.showLabels);
  });
  var sSpeed = document.getElementById("sSpeed");
  sSpeed.addEventListener("input", function(){
    state.speed = parseFloat(sSpeed.value) / 16;
    var txt = "×" + state.speed.toFixed(1);
    document.getElementById("vSpeed").textContent = txt;
    document.getElementById("rSpeed").textContent = txt;
  });

  window.addEventListener("resize", function(){
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  /* ================= loop ================= */
  var clock = new THREE.Clock();
  var simT = 0, frames = 0, fpsT = 0;

  function tick(){
    requestAnimationFrame(tick);
    var dt = Math.min(clock.getDelta(), 0.05);
    var t = clock.elapsedTime;
    simT += dt * state.speed;

    sun.rotation.y = t * 0.05;
    glow.material.opacity = 0.9 + Math.sin(t * 2.2) * 0.1;

    PLANETS.forEach(function(p){
      p.angle = p.speed * simT + p.orbit;  /* deterministic phase from orbit radius */
      p.mesh.position.set(Math.cos(p.angle) * p.orbit, 0, Math.sin(p.angle) * p.orbit);
      p.mesh.rotation.y += dt * p.spin * (0.3 + state.speed);
      if (p.moonMesh){
        var ma = simT * 2.4;
        p.moonMesh.position.set(
          p.mesh.position.x + Math.cos(ma) * 1.05, 0.12,
          p.mesh.position.z + Math.sin(ma) * 1.05);
      }
    });

    /* camera focus */
    if (state.focus >= 0) targetGoal.copy(PLANETS[state.focus].mesh.position);
    else targetGoal.set(0, 0, 0);
    target.lerp(targetGoal, 0.06);

    orbit.theta  += (orbit.tTheta  - orbit.theta)  * 0.07;
    orbit.phi    += (orbit.tPhi    - orbit.phi)    * 0.07;
    orbit.radius += (orbit.tRadius - orbit.radius) * 0.07;
    camera.position.set(
      target.x + orbit.radius * Math.sin(orbit.phi) * Math.sin(orbit.theta),
      target.y + orbit.radius * Math.cos(orbit.phi),
      target.z + orbit.radius * Math.sin(orbit.phi) * Math.cos(orbit.theta)
    );
    camera.lookAt(target);

    /* labels */
    PLANETS.forEach(function(p, i){
      if (!state.showLabels || (state.focus >= 0 && state.focus !== i)){
        p.label.classList.add("hidden");
        return;
      }
      tmpV.copy(p.mesh.position).project(camera);
      if (tmpV.z > 1){ p.label.classList.add("hidden"); return; }
      p.label.classList.remove("hidden");
      p.label.style.left = ((tmpV.x * 0.5 + 0.5) * window.innerWidth) + "px";
      p.label.style.top  = ((-tmpV.y * 0.5 + 0.5) * window.innerHeight) + "px";
    });

    renderer.render(scene, camera);

    frames++; fpsT += dt;
    if (fpsT >= 0.5){
      document.getElementById("rFps").textContent = Math.round(frames / fpsT);
      frames = 0; fpsT = 0;
    }
  }

  tick();
})();
</script>
</body>
</html>
