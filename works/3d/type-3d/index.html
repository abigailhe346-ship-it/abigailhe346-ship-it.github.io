<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letterpress 3D — 三维字体雕塑 No.04</title>
<style>
  :root{
    --bg:#f4f1ea;
    --panel:#faf7f0;
    --line:#ddd6c6;
    --ink:#17151a;
    --red:#d93a2b;
    --dim:#8f8776;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);}
  body{font-family:"SF Mono",Menlo,"Courier New",monospace;color:var(--ink);
       -webkit-font-smoothing:antialiased;}
  #stage{position:fixed;inset:0;cursor:grab;}
  #stage:active{cursor:grabbing;}
  #stage canvas{display:block;width:100%;height:100%;}

  .plate{position:fixed;top:26px;left:30px;z-index:10;pointer-events:none;}
  .plate .no{font-size:10px;letter-spacing:.4em;color:var(--red);}
  .plate h1{font-family:Didot,"Bodoni MT",Georgia,"Songti SC",serif;
            font-size:26px;font-weight:400;letter-spacing:.14em;margin-top:7px;}
  .plate .sub{font-size:10px;letter-spacing:.3em;color:var(--dim);margin-top:6px;}
  .plate .rule{width:64px;height:1px;background:linear-gradient(90deg,var(--red),transparent);margin-top:11px;}

  .readout{position:fixed;top:28px;right:30px;z-index:10;text-align:right;pointer-events:none;
           font-size:10px;letter-spacing:.24em;color:var(--dim);line-height:2.1;}
  .readout b{color:var(--ink);font-weight:400;}
  .readout .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--red);
                margin-right:8px;vertical-align:1px;animation:pulse 2.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  .hint{position:fixed;left:30px;bottom:26px;z-index:10;pointer-events:none;
        font-size:10px;letter-spacing:.26em;color:var(--dim);line-height:2.2;}
  .hint em{font-style:normal;color:var(--ink);}

  .console{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:10;
           display:flex;align-items:stretch;
           background:linear-gradient(180deg,rgba(250,247,240,.92),rgba(244,241,234,.95));
           border:1px solid var(--line);backdrop-filter:blur(8px);
           box-shadow:0 24px 60px rgba(23,21,26,.12);
           max-width:min(940px,calc(100vw - 28px));}
  .console::before,.console::after{content:"";position:absolute;width:10px;height:10px;
           border:1px solid var(--red);}
  .console::before{top:-4px;left:-4px;border-right:none;border-bottom:none;}
  .console::after{bottom:-4px;right:-4px;border-left:none;border-top:none;}
  .cell{padding:13px 18px;border-right:1px solid var(--line);display:flex;
        flex-direction:column;justify-content:center;gap:9px;min-width:0;}
  .cell:last-child{border-right:none;}
  .label{font-size:9px;letter-spacing:.32em;color:var(--dim);white-space:nowrap;}

  .tinput{appearance:none;border:none;border-bottom:1px solid var(--ink);background:transparent;
          font-family:Didot,"Bodoni MT",Georgia,"Songti SC",serif;font-size:20px;color:var(--ink);
          letter-spacing:.14em;width:180px;padding:2px 2px 5px;outline:none;text-transform:uppercase;}
  .tinput::placeholder{color:var(--dim);}

  .btn{appearance:none;border:1px solid var(--ink);background:transparent;color:var(--ink);
       font-family:inherit;font-size:10px;letter-spacing:.28em;padding:11px 15px 10px;cursor:pointer;
       text-transform:uppercase;transition:background .2s cubic-bezier(.2,.7,.3,1),color .2s;}
  .btn:hover{background:var(--ink);color:var(--bg);}
  .btn.red{border-color:var(--red);color:var(--red);}
  .btn.red:hover{background:var(--red);color:#fff;}
  .btn:active{transform:translateY(1px);}
  .btnrow{display:flex;gap:9px;}

  .slider{display:flex;align-items:center;gap:11px;min-width:150px;}
  input[type=range]{-webkit-appearance:none;appearance:none;width:110px;height:1px;
       background:var(--line);outline:none;cursor:pointer;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
       width:11px;height:15px;background:var(--red);border:none;cursor:ew-resize;}
  input[type=range]::-moz-range-thumb{width:11px;height:15px;background:var(--red);
       border:none;cursor:ew-resize;}
  .sval{font-size:10px;color:var(--red);letter-spacing:.08em;width:34px;text-align:right;}

  @media (max-width:820px){
    .console{flex-wrap:wrap;bottom:12px;}
    .cell{padding:10px 13px;border-right:none;border-top:1px solid var(--line);flex:1 1 42%;}
    .cell:first-child{border-top:none;}
    .hint{display:none;}
    .tinput{width:130px;font-size:16px;}
    .plate h1{font-size:20px;}
  }
</style>
</head>
<body>
<div id="stage"></div>

<div class="plate">
  <div class="no">No.04 — THREE.JS / INSTANCED TYPE</div>
  <h1>Letterpress 3D</h1>
  <div class="sub">三维字体雕塑 · 把字打进纸里</div>
  <div class="rule"></div>
</div>

<div class="readout">
  <span class="dot"></span>SCULPTING<br>
  GLYPH <b id="rGlyph">—</b><br>
  BLOCKS <b id="rBlocks">—</b><br>
  FPS <b id="rFps">—</b>
</div>

<div class="hint">
  <em>拖拽</em> 环视雕塑 · <em>滚轮</em> 推近<br>
  <em>点击雕塑</em> 将其击碎 — 字会自己回来
</div>

<div class="console">
  <div class="cell">
    <div class="label">字句 / TEXT</div>
    <input class="tinput" id="tInput" maxlength="8" value="MONO" spellcheck="false">
  </div>
  <div class="cell">
    <div class="label">深度 DEPTH</div>
    <div class="slider">
      <input type="range" id="sDepth" min="20" max="160" step="5" value="80">
      <span class="sval" id="vDepth">.80</span>
    </div>
  </div>
  <div class="cell">
    <div class="label">波幅 WAVE</div>
    <div class="slider">
      <input type="range" id="sWave" min="0" max="100" step="5" value="25">
      <span class="sval" id="vWave">.25</span>
    </div>
  </div>
  <div class="cell">
    <div class="label">粒度 GRAIN</div>
    <div class="slider">
      <input type="range" id="sGrain" min="4" max="10" step="1" value="6">
      <span class="sval" id="vGrain">6</span>
    </div>
  </div>
  <div class="cell">
    <div class="btnrow">
      <button class="btn red" id="btnBuild">重塑</button>
      <button class="btn" id="btnWord">随机词句</button>
    </div>
  </div>
</div>

<script src="../../../vendor/three.min.js"></script>
<script>
(function(){
  "use strict";

  var WORDS = ["MONO", "SERIF", "FORM", "刻字", "引力", "TYPE", "N°7", "光", "GRID", "字"];
  var state = { text:"MONO", depth:0.8, wave:0.25, grain:6 };

  /* ================= renderer ================= */
  var stage = document.getElementById("stage");
  var renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf4f1ea);
  var camera = new THREE.PerspectiveCamera(38, window.innerWidth/window.innerHeight, 0.1, 200);

  var orbit = { theta:0.5, phi:1.25, radius:16, tTheta:0.5, tPhi:1.25, tRadius:16 };

  /* ================= lights ================= */
  scene.add(new THREE.HemisphereLight(0xffffff, 0xcfc4ae, 0.9));
  var key = new THREE.DirectionalLight(0xffffff, 0.9);
  key.position.set(6, 9, 7);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.left = key.shadow.camera.bottom = -12;
  key.shadow.camera.right = key.shadow.camera.top = 12;
  key.shadow.radius = 4;
  scene.add(key);
  var rim = new THREE.DirectionalLight(0xffe9d0, 0.3);
  rim.position.set(-6, 4, -7);
  scene.add(rim);

  /* ground shadow catcher */
  var ground = new THREE.Mesh(
    new THREE.PlaneGeometry(60, 60),
    new THREE.ShadowMaterial({ opacity: 0.14 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -3.4;
  ground.receiveShadow = true;
  scene.add(ground);

  /* red plinth ring */
  var ring = new THREE.Mesh(
    new THREE.TorusGeometry(4.6, 0.035, 12, 128),
    new THREE.MeshStandardMaterial({ color:0xd93a2b, roughness:0.5 })
  );
  ring.rotation.x = Math.PI / 2;
  ring.position.y = -3.38;
  scene.add(ring);

  /* ================= sculpture ================= */
  var MAXI = 6000;
  var cellPx = 0.02;   /* world units per sample pixel, set by sample() */
  var boxGeo = new THREE.BoxGeometry(1, 1, 1);
  var inkMat = new THREE.MeshStandardMaterial({ color:0x1b191f, roughness:0.62, metalness:0.08 });
  var mesh = new THREE.InstancedMesh(boxGeo, inkMat, MAXI);
  mesh.castShadow = true;
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  scene.add(mesh);

  var cols = [];        /* {x,y,delay,phase, ox,oy,oz, vx,vy,vz} */
  var birth = 0;
  var dummy = new THREE.Object3D();
  var bounds = { w:0, h:0 };

  function sample(text){
    var cv = document.createElement("canvas");
    cv.width = 1024; cv.height = 300;
    var x = cv.getContext("2d");
    x.fillStyle = "#000";
    x.font = "700 210px -apple-system, 'Helvetica Neue', 'PingFang SC', sans-serif";
    x.textAlign = "center";
    x.textBaseline = "middle";
    x.fillText(text, 512, 158);
    var img = x.getImageData(0, 0, 1024, 300).data;

    var s = state.grain;
    var list = [], minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    for (var gy = 0; gy < 300; gy += s){
      for (var gx = 0; gx < 1024; gx += s){
        if (img[(gy * 1024 + gx) * 4 + 3] > 110){
          list.push({ gx: gx, gy: gy });
          if (gx < minX) minX = gx; if (gx > maxX) maxX = gx;
          if (gy < minY) minY = gy; if (gy > maxY) maxY = gy;
        }
      }
    }
    cellPx = 9.2 / Math.max(maxX - minX, 22 * s);   /* world units per pixel */
    var cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    cols = [];
    for (var i = 0; i < Math.min(list.length, MAXI); i++){
      var p = list[i];
      cols.push({
        x: (p.gx - cx) * cellPx,
        y: -(p.gy - cy) * cellPx,
        delay: Math.hypot(p.gx - cx, p.gy - cy) / 300 * 0.9,
        phase: (p.gx * 0.021 + p.gy * 0.013),
        ox:0, oy:0, oz:0, vx:0, vy:0, vz:0
      });
    }
    mesh.count = cols.length;
    birth = performance.now() / 1000;
    document.getElementById("rBlocks").textContent = cols.length;
    document.getElementById("rGlyph").textContent = text;
    bounds.w = (maxX - minX) * cellPx; bounds.h = (maxY - minY) * cellPx;
    /* frame camera a bit */
    orbit.tRadius = Math.max(11, Math.min(22, bounds.w * 1.25 + 6));
  }

  /* ================= interactions ================= */
  var dragging = false, moved = 0, px = 0, py = 0;
  stage.addEventListener("pointerdown", function(e){
    dragging = true; moved = 0; px = e.clientX; py = e.clientY;
  });
  stage.addEventListener("pointermove", function(e){
    if (!dragging) return;
    var dx = e.clientX - px, dy = e.clientY - py;
    moved += Math.abs(dx) + Math.abs(dy);
    orbit.tTheta -= dx * 0.006;
    orbit.tPhi = Math.max(0.35, Math.min(Math.PI - 0.5, orbit.tPhi - dy * 0.004));
    px = e.clientX; py = e.clientY;
  });
  stage.addEventListener("pointerup", function(){
    dragging = false;
    if (moved < 6) shatter();   /* click (not drag) = shatter */
  });
  stage.addEventListener("wheel", function(e){
    e.preventDefault();
    orbit.tRadius *= (1 + e.deltaY * 0.0009);
    orbit.tRadius = Math.max(7, Math.min(30, orbit.tRadius));
  }, { passive: false });

  function shatter(){
    for (var i = 0; i < cols.length; i++){
      var c = cols[i];
      var a = Math.random() * Math.PI * 2;
      var sp = 3.5 + Math.random() * 5.5;
      c.vx += Math.cos(a) * sp;
      c.vy += (Math.random() - 0.2) * sp;
      c.vz += Math.sin(a) * sp * 0.8;
    }
  }

  /* ================= controls ================= */
  var tInput = document.getElementById("tInput");
  document.getElementById("btnBuild").addEventListener("click", function(){
    var v = tInput.value.trim() || "MONO";
    state.text = v.toUpperCase();
    sample(state.text);
  });
  tInput.addEventListener("keydown", function(e){
    if (e.key === "Enter") document.getElementById("btnBuild").click();
  });
  document.getElementById("btnWord").addEventListener("click", function(){
    var w = WORDS[(Math.random() * WORDS.length) | 0];
    tInput.value = w;
    state.text = w.toUpperCase();
    sample(state.text);
  });
  function bind(id, vid, fmt, apply){
    var s = document.getElementById(id), v = document.getElementById(vid);
    s.addEventListener("input", function(){
      var x = parseFloat(s.value);
      apply(x); v.textContent = fmt(x);
    });
  }
  bind("sDepth", "vDepth", function(x){ return (x/100).toFixed(2).slice(1); }, function(x){ state.depth = x/100; });
  bind("sWave",  "vWave",  function(x){ return (x/100).toFixed(2).slice(1); }, function(x){ state.wave = x/100; });
  bind("sGrain", "vGrain", function(x){ return x|0; }, function(x){ state.grain = x|0; sample(state.text); });

  window.addEventListener("resize", function(){
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  /* ================= loop ================= */
  var frames = 0, fpsT = 0, lastT = performance.now() / 1000;

  function tick(){
    requestAnimationFrame(tick);
    var now = performance.now() / 1000;
    var dt = Math.min(now - lastT, 0.05);
    lastT = now;
    var t = now;

    var n = cols.length;
    for (var i = 0; i < n; i++){
      var c = cols[i];
      /* spring back after shatter */
      var k = 26, damp = 5.5;
      c.vx += (-k * c.ox - damp * c.vx) * dt;
      c.vy += (-k * c.oy - damp * c.vy) * dt;
      c.vz += (-k * c.oz - damp * c.vz) * dt;
      c.ox += c.vx * dt; c.oy += c.vy * dt; c.oz += c.vz * dt;

      /* build-in ease */
      var g = Math.max(0, Math.min(1, (t - birth - c.delay) / 0.7));
      g = 1 - Math.pow(1 - g, 3);
      var wave = 1 + state.wave * Math.sin(t * 1.8 + c.phase * 6);
      var d = Math.max(state.depth * 2.2 * wave * g, 0.001);

      dummy.position.set(c.x + c.ox, c.y + c.oy, c.oz);
      dummy.scale.set(1, 1, 1);
      dummy.scale.x = dummy.scale.y = state.grain * cellPx * 0.92;
      dummy.scale.z = d;
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
    }
    mesh.instanceMatrix.needsUpdate = true;

    /* camera */
    orbit.theta += (orbit.tTheta - orbit.theta) * 0.07;
    orbit.phi   += (orbit.tPhi   - orbit.phi)   * 0.07;
    orbit.radius+= (orbit.tRadius- orbit.radius)* 0.08;
    if (!dragging) orbit.tTheta += dt * 0.06;   /* gentle idle drift */
    camera.position.set(
      orbit.radius * Math.sin(orbit.phi) * Math.sin(orbit.theta),
      orbit.radius * Math.cos(orbit.phi),
      orbit.radius * Math.sin(orbit.phi) * Math.cos(orbit.theta)
    );
    camera.lookAt(0, -0.4, 0);

    ring.rotation.z = t * 0.1;
    renderer.render(scene, camera);

    frames++; fpsT += dt;
    if (fpsT >= 0.5){
      document.getElementById("rFps").textContent = Math.round(frames / fpsT);
      frames = 0; fpsT = 0;
    }
  }

  sample(state.text);
  tick();
})();
</script>
</body>
</html>
