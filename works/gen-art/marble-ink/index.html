<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marble Ink — 大理石湿拓画模拟</title>
<style>
  :root{
    --paper:#f3ecdc;
    --ink:#201d19;
    --vermilion:#c1442e;
    --line:rgba(32,29,25,.18);
    --serif:Didot,"Bodoni MT",Georgia,"Songti SC",serif;
    --sans:-apple-system,"Helvetica Neue","PingFang SC",sans-serif;
    --mono:"SF Mono",Menlo,monospace;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--sans)}
  #stage{position:fixed;inset:0;display:block;cursor:cell;touch-action:none}
  header{position:fixed;top:0;left:0;right:0;padding:28px 36px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
  .mark .no{font-family:var(--mono);font-size:10px;letter-spacing:.35em;color:var(--vermilion)}
  .mark h1{font-family:var(--serif);font-weight:400;font-size:clamp(22px,3vw,34px);letter-spacing:.02em;line-height:1;margin:6px 0}
  .mark .sub{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:rgba(32,29,25,.5)}
  .meta{font-family:var(--mono);font-size:10px;line-height:1.9;color:rgba(32,29,25,.45);text-align:right}
  .meta b{color:var(--vermilion);font-weight:400}

  .panel{position:fixed;left:36px;bottom:32px;z-index:6;width:280px;max-height:calc(100vh - 150px);overflow-y:auto;padding:22px;background:rgba(243,236,220,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);transition:transform .6s var(--ease),opacity .6s var(--ease)}
  .panel.hidden{transform:translateY(24px);opacity:0;pointer-events:none}
  .panel h2{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:rgba(32,29,25,.55);margin-bottom:12px}
  .inks{display:flex;gap:8px;margin-bottom:16px}
  .ink{flex:1;height:30px;border:1px solid var(--line);cursor:pointer;position:relative;transition:transform .3s var(--ease)}
  .ink:hover{transform:translateY(-2px)}
  .ink.on::after{content:"";position:absolute;inset:-4px;border:1px solid var(--vermilion)}
  .ctl{margin-bottom:13px}
  .ctl label{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:rgba(32,29,25,.66);margin-bottom:7px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:1px;background:rgba(32,29,25,.3)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:9px;height:9px;margin-top:-4px;background:var(--paper);border:1px solid var(--vermilion);transform:rotate(45deg);transition:background .25s var(--ease)}
  input[type=range]::-webkit-slider-thumb:hover{background:var(--vermilion)}
  input[type=range]::-moz-range-track{height:1px;background:rgba(32,29,25,.3)}
  input[type=range]::-moz-range-thumb{width:9px;height:9px;border:none;background:var(--vermilion);border-radius:0;transform:rotate(45deg)}
  .row{display:flex;gap:8px;margin-top:16px}
  button{flex:1;font-family:var(--sans);font-size:10px;letter-spacing:.18em;text-transform:uppercase;padding:11px 0;background:transparent;color:var(--ink);border:1px solid rgba(32,29,25,.35);cursor:pointer;transition:all .3s var(--ease)}
  button:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  button.accent{border-color:var(--vermilion);color:var(--vermilion)}
  button.accent:hover{background:var(--vermilion);color:var(--paper)}
  .hint{position:fixed;right:36px;bottom:32px;z-index:5;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:rgba(32,29,25,.42);text-align:right;line-height:2;pointer-events:none}
  .hint em{font-style:normal;color:rgba(32,29,25,.72)}
  #panelToggle{position:fixed;left:36px;bottom:32px;z-index:7;width:38px;height:38px;display:none;align-items:center;justify-content:center;border:1px solid rgba(32,29,25,.35);padding:0;flex:none}
  #panelToggle svg{width:14px;height:14px;stroke:var(--ink);stroke-width:1.5;fill:none}
  .panel.hidden ~ #panelToggle{display:flex}
  #toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:8;font-family:var(--mono);font-size:11px;letter-spacing:.4em;color:var(--ink);opacity:0;transition:opacity .5s var(--ease);pointer-events:none;background:rgba(243,236,220,.85);padding:14px 26px;border:1px solid var(--line)}
  #toast.show{opacity:1}
  @media (max-width:640px){
    header{padding:20px}.meta{display:none}
    .panel{left:16px;right:16px;bottom:16px;width:auto}
    #panelToggle{left:16px;bottom:16px}
    .hint{display:none}
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<header>
  <div class="mark">
    <span class="no">GEN-ART · N°03</span>
    <h1>Marble Ink</h1>
    <span class="sub">大理石湿拓画模拟 · Ebru</span>
  </div>
  <div class="meta">墨浮于水,梳过成纹<br>点击滴墨 · 拖拽划梳</div>
</header>

<div class="panel" id="panel">
  <h2>墨色 Pigments</h2>
  <div class="inks" id="inks"></div>
  <div class="ctl"><label><span>墨滴 drop size</span><output id="oDrop">26</output></label><input type="range" id="pDrop" min="8" max="70" step="1" value="26"></div>
  <div class="ctl"><label><span>梳幅 comb width</span><output id="oComb">0.50</output></label><input type="range" id="pComb" min="0.15" max="1" step="0.01" value="0.5"></div>
  <div class="row">
    <button class="accent" id="btnAuto">随机再生</button>
    <button id="btnClear">清水</button>
    <button id="btnSave">存图</button>
  </div>
</div>
<button id="panelToggle" aria-label="open panel"><svg viewBox="0 0 24 24"><path d="M4 8h16M4 16h10"/></svg></button>
<div id="toast">水 面 作 画 中</div>

<div class="hint"><em>按住不动</em> — 墨滴晕开变大<br>按 <em>1–5</em> 换色 · <em>R</em> 再生 · <em>S</em> 存图</div>

<script>
(function(){
  "use strict";
  var canvas=document.getElementById('stage'),ctx=canvas.getContext('2d');
  var W=0,H=0,DPR=1;
  var paint=document.createElement('canvas'),pctx=paint.getContext('2d');
  var paper=document.createElement('canvas'),ppctx=paper.getContext('2d');
  var temp=document.createElement('canvas'),tctx=temp.getContext('2d');

  var INKS=[
    {name:"松烟",c:"#221f1b"},
    {name:"靛青",c:"#274060"},
    {name:"朱砂",c:"#c1442e"},
    {name:"赭石",c:"#c08a2d"},
    {name:"黛绿",c:"#2e6e63"}
  ];
  var inkIdx=2,dropSize=26,combW=0.5;
  var drops=[];         /* spreading drops queue */
  var queue=[];         /* auto-generation action queue */
  var autoMode=false;

  function makePaper(){
    paper.width=W*DPR;paper.height=H*DPR;
    ppctx.setTransform(DPR,0,0,DPR,0,0);
    ppctx.fillStyle='#f3ecdc';ppctx.fillRect(0,0,W,H);
    /* speckles */
    for(var i=0;i<W*H/380;i++){
      var x=Math.random()*W,y=Math.random()*H,a=Math.random();
      ppctx.fillStyle=a<0.5?'rgba(120,100,70,0.05)':'rgba(255,255,250,0.08)';
      ppctx.fillRect(x,y,1.2,1.2);
    }
    /* fibres */
    ppctx.strokeStyle='rgba(140,120,90,0.05)';ppctx.lineWidth=0.6;
    for(var f=0;f<90;f++){
      var fx=Math.random()*W,fy=Math.random()*H,ang=Math.random()*Math.PI,len=8+Math.random()*26;
      ppctx.beginPath();ppctx.moveTo(fx,fy);
      ppctx.quadraticCurveTo(fx+Math.cos(ang)*len*0.5,fy+Math.sin(ang)*len*0.5+(Math.random()-0.5)*4,fx+Math.cos(ang)*len,fy+Math.sin(ang)*len);
      ppctx.stroke();
    }
  }
  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    var oldW=W,oldH=H;
    W=window.innerWidth;H=window.innerHeight;
    canvas.width=W*DPR;canvas.height=H*DPR;
    canvas.style.width=W+'px';canvas.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    var np=document.createElement('canvas');
    np.width=W*DPR;np.height=H*DPR;
    var nctx=np.getContext('2d');
    nctx.drawImage(paint,(W-oldW)/2*DPR,(H-oldH)/2*DPR);
    paint.width=W*DPR;paint.height=H*DPR;
    pctx.setTransform(1,0,0,1,0,0);
    pctx.drawImage(np,0,0);
    temp.width=W*DPR;temp.height=H*DPR;
    makePaper();
  }
  window.addEventListener('resize',resize);

  /* ---------------- ink drop ---------------- */
  function addDrop(x,y,r,color,dur){
    drops.push({x:x*DPR,y:y*DPR,r:2*DPR,target:r*DPR,color:color,t:0,dur:dur||0.7});
  }
  function stamp(d){
    /* organic blob: core + petals */
    var g=pctx.createRadialGradient(d.x,d.y,d.r*0.2,d.x,d.y,d.r);
    g.addColorStop(0,d.color);
    g.addColorStop(0.85,d.color);
    g.addColorStop(1,'rgba(0,0,0,0)');
    pctx.fillStyle=g;
    pctx.beginPath();pctx.arc(d.x,d.y,d.r,0,Math.PI*2);pctx.fill();
    for(var i=0;i<5;i++){
      var a=Math.random()*Math.PI*2,dist=d.r*(0.55+Math.random()*0.4);
      var pr=d.r*(0.2+Math.random()*0.25);
      pctx.beginPath();
      pctx.arc(d.x+Math.cos(a)*dist,d.y+Math.sin(a)*dist,pr,0,Math.PI*2);
      pctx.fill();
    }
  }

  /* ---------------- comb / pull ---------------- */
  function comb(x0,y0,x1,y1){
    var dx=(x1-x0)*DPR,dy=(y1-y0)*DPR;
    if(Math.abs(dx)<0.5&&Math.abs(dy)<0.5)return;
    var sigma=(30+combW*160)*DPR;
    tctx.setTransform(1,0,0,1,0,0);
    tctx.clearRect(0,0,temp.width,temp.height);
    tctx.drawImage(paint,0,0);
    pctx.clearRect(0,0,paint.width,paint.height);
    var strip=2*DPR;
    if(Math.abs(dx)>=Math.abs(dy)){
      var py=(y0+y1)/2*DPR;
      var yA=Math.max(0,py-sigma*3),yB=Math.min(paint.height,py+sigma*3);
      pctx.drawImage(temp,0,0,paint.width,yA,0,0,paint.width,yA);
      pctx.drawImage(temp,0,yB,paint.width,paint.height-yB,0,yB,paint.width,paint.height-yB);
      for(var y=yA;y<yB;y+=strip){
        var dist=y+strip/2-py;
        var k=Math.exp(-(dist*dist)/(sigma*sigma));
        pctx.drawImage(temp,0,y,paint.width,strip,dx*k,y,paint.width,strip);
      }
    }else{
      var px=(x0+x1)/2*DPR;
      var xA=Math.max(0,px-sigma*3),xB=Math.min(paint.width,px+sigma*3);
      pctx.drawImage(temp,0,0,xA,paint.height,0,0,xA,paint.height);
      pctx.drawImage(temp,xB,0,paint.width-xB,paint.height,xB,0,paint.width-xB,paint.height);
      for(var x=xA;x<xB;x+=strip){
        var dist2=x+strip/2-px;
        var k2=Math.exp(-(dist2*dist2)/(sigma*sigma));
        pctx.drawImage(temp,x,0,strip,paint.height,x,dy*k2,strip,paint.height);
      }
    }
  }

  /* ---------------- auto generation (nonpareil) ---------------- */
  function buildAuto(){
    queue.length=0;drops.length=0;
    pctx.clearRect(0,0,paint.width,paint.height);
    var cxp=W/2,cyp=H/2;
    var base=Math.min(W,H);
    /* concentric rings of drops */
    var rings=7+Math.floor(Math.random()*3);
    for(var r=0;r<rings;r++){
      var rad=base*0.045*(r+1);
      var n=6+r*5;
      for(var i=0;i<n;i++){
        var a=i/n*Math.PI*2+r*0.6;
        var ci=Math.floor(Math.random()*INKS.length);
        queue.push({type:'drop',x:cxp+Math.cos(a)*rad+(Math.random()-0.5)*8,
                    y:cyp+Math.sin(a)*rad+(Math.random()-0.5)*8,
                    r:(dropSize*(0.5+Math.random()*0.6)),c:INKS[ci].c});
      }
    }
    /* horizontal combs, alternating direction */
    var sweeps=5+Math.floor(Math.random()*3);
    for(var sIdx=0;sIdx<sweeps;sIdx++){
      var yy=H*(0.12+0.76*sIdx/(sweeps-1));
      var dir=sIdx%2===0?1:-1;
      queue.push({type:'comb',x0:dir>0?-40:W+40,y0:yy,x1:dir>0?W+40:-40,y1:yy,dur:0.55});
    }
    /* vertical combs */
    var vs=3+Math.floor(Math.random()*3);
    for(var v=0;v<vs;v++){
      var xx=W*(0.15+0.7*v/(vs-1||1));
      var dir2=v%2===0?1:-1;
      queue.push({type:'comb',x0:xx,y0:dir2>0?-40:H+40,x1:xx,y1:dir2>0?H+40:-40,dur:0.45});
    }
    /* final swirl-ish diagonal pull */
    queue.push({type:'comb',x0:W*0.2,y0:H*0.2,x1:W*0.8,y1:H*0.8,dur:0.8});
    autoMode=true;
    toast(true);
  }
  var toastEl=document.getElementById('toast');
  function toast(on){toastEl.classList.toggle('show',!!on);}

  /* ---------------- main loop ---------------- */
  var last=performance.now(),curComb=null,combT=0;
  function loop(now){
    var dt=Math.min(0.05,(now-last)/1000);last=now;
    /* process drops */
    for(var i=drops.length-1;i>=0;i--){
      var d=drops[i];
      d.t=Math.min(1,d.t+dt/d.dur);
      var e=1-Math.pow(1-d.t,3);
      var newR=2*DPR+(d.target-2*DPR)*e;
      var grown=newR-d.r;
      if(grown>0.3){
        d.r=newR;stamp(d);
      }
      if(d.t>=1)drops.splice(i,1);
    }
    /* process auto queue */
    if(autoMode){
      if(!curComb){
        var next=queue.shift();
        if(!next){autoMode=false;toast(false);}
        else if(next.type==='drop'){addDrop(next.x,next.y,next.r,next.c,0.9);}
        else{curComb=next;combT=0;curComb.lx=next.x0;curComb.ly=next.y0;}
      }else{
        combT=Math.min(1,combT+dt/curComb.dur);
        var ee=combT<0.5?2*combT*combT:1-Math.pow(-2*combT+2,2)/2;
        var nx=curComb.x0+(curComb.x1-curComb.x0)*ee;
        var ny=curComb.y0+(curComb.y1-curComb.y0)*ee;
        comb(curComb.lx,curComb.ly,nx,ny);
        curComb.lx=nx;curComb.ly=ny;
        if(combT>=1)curComb=null;
      }
    }
    /* composite */
    ctx.clearRect(0,0,W,H);
    ctx.drawImage(paper,0,0,W,H);
    ctx.drawImage(paint,0,0,paint.width,paint.height,0,0,W,H);
    /* vignette */
    var vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.75);
    vg.addColorStop(0,'rgba(60,45,25,0)');
    vg.addColorStop(1,'rgba(60,45,25,0.14)');
    ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
    requestAnimationFrame(loop);
  }

  /* ---------------- pointer ---------------- */
  var pDown=null,dragging=false,growTimer=null;
  function ptr(e){
    var t=e.touches&&e.touches.length?e.touches[0]:e;
    return {x:t.clientX,y:t.clientY};
  }
  function down(e){
    if(autoMode)return;
    var p=ptr(e);pDown={x:p.x,y:p.y,lx:p.x,ly:p.y};dragging=false;
    addDrop(p.x,p.y,dropSize*0.6,INKS[inkIdx].c,0.5);
    growTimer=setInterval(function(){
      if(!dragging)addDrop(pDown.x,pDown.y,dropSize*(0.5+Math.random()*0.4),INKS[inkIdx].c,0.8);
    },240);
    e.preventDefault();
  }
  function move(e){
    if(!pDown||autoMode)return;
    var p=ptr(e);
    var dist=Math.hypot(p.x-pDown.x,p.y-pDown.y);
    if(dist>7)dragging=true;
    if(dragging){
      comb(pDown.lx,pDown.ly,p.x,p.y);
      pDown.lx=p.x;pDown.ly=p.y;
    }
    e.preventDefault();
  }
  function up(){
    if(growTimer){clearInterval(growTimer);growTimer=null;}
    pDown=null;dragging=false;
  }
  canvas.addEventListener('mousedown',down);
  window.addEventListener('mousemove',move);
  window.addEventListener('mouseup',up);
  canvas.addEventListener('touchstart',down,{passive:false});
  canvas.addEventListener('touchmove',move,{passive:false});
  window.addEventListener('touchend',up);

  /* ---------------- UI ---------------- */
  var inksEl=document.getElementById('inks');
  INKS.forEach(function(ik,i){
    var d=document.createElement('div');d.className='ink'+(i===inkIdx?' on':'');
    d.style.background=ik.c;d.title=ik.name;
    d.addEventListener('click',function(){setInk(i);});
    inksEl.appendChild(d);
  });
  function setInk(i){
    inkIdx=i;
    inksEl.querySelectorAll('.ink').forEach(function(x,j){x.classList.toggle('on',j===i);});
  }
  document.getElementById('pDrop').addEventListener('input',function(){
    dropSize=parseFloat(this.value);document.getElementById('oDrop').textContent=dropSize;
  });
  document.getElementById('pComb').addEventListener('input',function(){
    combW=parseFloat(this.value);document.getElementById('oComb').textContent=combW.toFixed(2);
  });
  document.getElementById('btnAuto').addEventListener('click',buildAuto);
  document.getElementById('btnClear').addEventListener('click',function(){
    queue.length=0;curComb=null;autoMode=false;toast(false);drops.length=0;
    pctx.clearRect(0,0,paint.width,paint.height);
  });
  document.getElementById('btnSave').addEventListener('click',save);
  function save(){
    var out=document.createElement('canvas');
    out.width=W*DPR;out.height=H*DPR;
    var oc=out.getContext('2d');
    oc.drawImage(paper,0,0);
    oc.drawImage(paint,0,0);
    var a=document.createElement('a');
    a.download='marble-ink-'+Date.now()+'.png';
    a.href=out.toDataURL('image/png');
    a.click();
  }
  var panel=document.getElementById('panel');
  document.getElementById('panelToggle').addEventListener('click',function(){panel.classList.remove('hidden');});
  window.addEventListener('keydown',function(e){
    var k=e.key.toLowerCase();
    if(k>='1'&&k<='5')setInk(parseInt(k,10)-1);
    else if(k==='r')buildAuto();
    else if(k==='s')save();
    else if(k==='h')panel.classList.toggle('hidden');
  });

  resize();
  buildAuto(); /* 首屏即作画 */
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
