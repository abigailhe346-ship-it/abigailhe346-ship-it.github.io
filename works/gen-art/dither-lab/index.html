<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DITHER LAB — 抖动像素化转换器</title>
<style>
  :root{
    --paper:#f4f1ea; --panel:#ebe7dd; --line:#d5cfc0;
    --ink:#16150f; --dim:#8a8474;
    --acc:#ff4d00;
    --mono:"SF Mono",Menlo,Consolas,monospace;
    --serif:Didot,"Bodoni MT",Georgia,"Songti SC",serif;
    --sans:-apple-system,"Helvetica Neue","PingFang SC",sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  ::selection{background:var(--acc);color:#fff}

  header{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:22px 28px 0;gap:16px;flex-wrap:wrap;
  }
  .sig{display:flex;align-items:baseline;gap:14px}
  .sig h1{
    font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:.04em;
  }
  .sig h1 em{font-style:italic;color:var(--acc)}
  .sig .no{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.14em}
  .sig .no b{color:var(--acc);font-weight:400}
  header p.tag{font-size:12px;color:var(--dim);letter-spacing:.06em}
  .rule{margin:14px 28px 0;border-top:1px solid var(--ink);position:relative}
  .rule::after{content:"";position:absolute;left:0;top:1px;width:100%;border-top:1px solid var(--line)}

  main{
    display:grid;grid-template-columns:1fr 300px;gap:24px;
    padding:24px 28px 40px;max-width:1440px;margin:0 auto;
  }
  @media (max-width:960px){main{grid-template-columns:1fr}}
  main>*,.stage,canvas{min-width:0}

  .stage{
    position:relative;background:#fff;border:1px solid var(--ink);
    box-shadow:6px 6px 0 rgba(22,21,15,.12);
    overflow:hidden;min-height:300px;display:flex;
  }
  .stage canvas{display:block;width:100%;height:auto;cursor:crosshair}
  .stamp{
    position:absolute;right:12px;top:10px;font-family:var(--mono);font-size:10px;
    letter-spacing:.18em;color:var(--ink);border:1px solid var(--ink);
    padding:4px 8px;background:rgba(244,241,234,.85);pointer-events:none;
    text-transform:uppercase;
  }
  .hint{
    position:absolute;left:12px;bottom:10px;font-family:var(--mono);font-size:10px;
    letter-spacing:.14em;color:rgba(22,21,15,.55);pointer-events:none;text-transform:uppercase;
  }
  .compare-tag{
    position:absolute;left:50%;top:12px;transform:translateX(-50%);
    font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:#fff;
    background:var(--acc);padding:4px 10px;opacity:0;transition:opacity .2s var(--ease);
    pointer-events:none;text-transform:uppercase;
  }
  .stage.comparing .compare-tag{opacity:1}

  .dock{
    background:var(--panel);border:1px solid var(--ink);
    padding:20px;display:flex;flex-direction:column;gap:18px;
    align-self:start;position:sticky;top:20px;
  }
  @media (max-width:960px){.dock{position:static}}
  .dock h2{
    font-family:var(--mono);font-size:11px;font-weight:400;color:var(--dim);
    letter-spacing:.22em;text-transform:uppercase;
    border-bottom:1px solid var(--line);padding-bottom:12px;
  }
  .ctl{display:flex;flex-direction:column;gap:8px}
  .ctl .lab{
    display:flex;justify-content:space-between;font-family:var(--mono);
    font-size:11px;letter-spacing:.1em;
  }
  .ctl .lab output{color:var(--acc)}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--ink)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:16px;height:16px;margin-top:-7px;
    background:var(--paper);border:2px solid var(--ink);border-radius:50%;
    transition:background .2s var(--ease),transform .2s var(--ease);
  }
  input[type=range]:hover::-webkit-slider-thumb{background:var(--acc);border-color:var(--acc)}
  input[type=range]::-moz-range-track{height:2px;background:var(--ink)}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;background:var(--paper);border:2px solid var(--ink);border-radius:50%}

  .seg{display:flex;flex-wrap:wrap;border:1px solid var(--ink)}
  .seg button{
    flex:1 1 50%;background:transparent;border:0;color:var(--dim);
    font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
    padding:10px 4px;cursor:pointer;transition:all .25s var(--ease);
  }
  .seg button:nth-child(2n){border-left:1px solid var(--ink)}
  .seg button:nth-child(n+3){border-top:1px solid var(--ink)}
  .seg button.on{background:var(--ink);color:var(--paper);font-weight:700}
  .seg button:not(.on):hover{color:var(--ink);background:rgba(22,21,15,.06)}

  .swatches{display:flex;gap:10px}
  .sw{
    flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--ink);
    padding:8px 10px;cursor:pointer;background:transparent;
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink);
    transition:all .25s var(--ease);
  }
  .sw:hover{background:rgba(22,21,15,.06)}
  .sw i{
    width:18px;height:18px;border:1px solid var(--ink);flex:none;display:block;
  }
  .sw input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}

  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{
    font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    padding:12px 8px;cursor:pointer;border:1px solid var(--ink);
    background:transparent;color:var(--ink);transition:all .25s var(--ease);
    display:flex;align-items:center;justify-content:center;gap:8px;user-select:none;
  }
  .btn svg{width:12px;height:12px;flex:none}
  .btn:hover{background:var(--ink);color:var(--paper);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
  .btn.primary:hover{background:#e64400;color:#fff}
  .btn.wide{grid-column:1/-1}

  footer{
    padding:0 28px 28px;font-family:var(--mono);font-size:10px;color:var(--dim);
    letter-spacing:.12em;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
</style>
</head>
<body>

<header>
  <div class="sig">
    <h1>Dither <em>Lab</em></h1>
    <span class="no">N°<b>02</b> — GEN-ART / 抖动像素化转换器</span>
  </div>
  <p class="tag">连续色调，两种油墨。Floyd–Steinberg · Bayer · Atkinson · Halftone</p>
</header>
<div class="rule"></div>

<main>
  <section class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="stamp" id="stamp">FLOYD–STEINBERG · 4PX</div>
    <div class="compare-tag">ORIGINAL / 原图</div>
    <div class="hint">HOLD TO COMPARE — 按住查看原图</div>
  </section>

  <aside class="dock">
    <h2>Print Settings</h2>

    <div class="ctl">
      <div class="lab"><span>抖动算法 ALGORITHM</span></div>
      <div class="seg" id="segAlgo">
        <button data-v="fs" class="on">Floyd–Steinberg</button>
        <button data-v="bayer">Bayer 8×8</button>
        <button data-v="atkinson">Atkinson</button>
        <button data-v="halftone">Halftone 网屏</button>
      </div>
    </div>

    <div class="ctl">
      <div class="lab"><span>像素粒度 PIXEL SIZE</span><output id="oPx">4</output></div>
      <input type="range" id="rPx" min="1" max="12" value="4">
    </div>

    <div class="ctl">
      <div class="lab"><span>对比度 CONTRAST</span><output id="oCt">10</output></div>
      <input type="range" id="rCt" min="-50" max="80" value="10">
    </div>

    <div class="ctl">
      <div class="lab"><span>油墨 INKS</span></div>
      <div class="swatches">
        <label class="sw"><i id="swInk" style="background:#16150f"></i>墨色<input type="color" id="cInk" value="#16150f"></label>
        <label class="sw"><i id="swPaper" style="background:#f4f1ea"></i>纸色<input type="color" id="cPaper" value="#f4f1ea"></label>
      </div>
    </div>

    <div class="btns">
      <button class="btn primary" id="bScene">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
        随机场景
      </button>
      <button class="btn" id="bDl">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        下载 PNG
      </button>
    </div>
  </aside>
</main>

<footer>
  <span>DITHER LAB — one scene, two inks, four algorithms</span>
  <span>图源由代码实时生成 · 无任何外部图片</span>
</footer>

<script>
"use strict";
/* ============================================================
   DITHER LAB — 抖动像素化转换器
   场景：程序化生成的山湖日出（连续色调，适合抖动）
   管线：降采样 → 灰度+对比度 → 抖动量化 → 双油墨映射 → 放大
   ============================================================ */

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
const stamp = document.getElementById('stamp');

const DPR = Math.min(window.devicePixelRatio || 1, 2);
const ASPECT = 3 / 2;
let W = 0, H = 0;

const S = {
  algo: 'fs',
  px: 4,
  contrast: 10,
  ink: '#16150f',
  paper: '#f4f1ea',
  seed: Math.random() * 1e9,
  comparing: false
};

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ============================================================
   1) SCENE GENERATOR — sunrise over a mountain lake
   ============================================================ */
const srcCv = document.createElement('canvas');

function generateScene(){
  const c = srcCv.getContext('2d');
  const R = mulberry32(S.seed);
  const w = srcCv.width, h = srcCv.height;

  // sky: light top → warm glow near horizon
  const sky = c.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#c3d2df');
  sky.addColorStop(.5, '#e6d9ba');
  sky.addColorStop(.72, '#f6ecd2');
  c.fillStyle = sky; c.fillRect(0, 0, w, h);

  const horizon = h * (.58 + R() * .1);

  // sun with soft halo
  const sunX = w * (.25 + R() * .5), sunY = horizon - h * (.08 + R() * .12);
  const sunR = h * (.11 + R() * .05);
  const halo = c.createRadialGradient(sunX, sunY, sunR * .2, sunX, sunY, sunR * 4);
  halo.addColorStop(0, 'rgba(255,246,220,.95)');
  halo.addColorStop(.25, 'rgba(255,230,180,.45)');
  halo.addColorStop(1, 'rgba(255,230,180,0)');
  c.fillStyle = halo;
  c.fillRect(0, 0, w, h);
  c.beginPath(); c.arc(sunX, sunY, sunR, 0, Math.PI * 2);
  c.fillStyle = '#fff6e0'; c.fill();

  // clouds: soft horizontal ellipses
  for (let i = 0; i < 7; i++){
    const cy = R() * horizon * .8, cw = (60 + R() * 200) * DPR, chh = (6 + R() * 14) * DPR;
    const g = c.createRadialGradient(0, 0, 0, 0, 0, cw / 2);
    g.addColorStop(0, `rgba(255,255,255,${.25 + R() * .3})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    c.save();
    c.translate(R() * w, cy);
    c.scale(1, chh / (cw / 2));
    c.fillStyle = g;
    c.beginPath(); c.arc(0, 0, cw / 2, 0, Math.PI * 2); c.fill();
    c.restore();
  }

  // mountain ridges, 4 layers, atmospheric perspective
  const ridges = ['#cfc8b8', '#aaa294', '#837c70', '#5b584f'];
  for (let L = 0; L < 4; L++){
    const base = horizon - h * .02 + L * h * .012;
    const amp = h * (.16 - L * .03);
    const f1 = .0015 + R() * .002, f2 = .004 + R() * .004;
    const p1 = R() * 10, p2 = R() * 10;
    c.beginPath();
    c.moveTo(0, base);
    for (let x = 0; x <= w; x += 4){
      const y = base - amp * (0.55 + 0.45 * Math.sin(x * f1 + p1)) * (0.6 + 0.4 * Math.sin(x * f2 + p2));
      c.lineTo(x, y);
    }
    c.lineTo(w, base + h * .05); c.lineTo(0, base + h * .05); c.closePath();
    c.fillStyle = ridges[L];
    c.fill();
  }

  // lake: mirror gradient + sun reflection band
  const lake = c.createLinearGradient(0, horizon, 0, h);
  lake.addColorStop(0, '#eee0bd');
  lake.addColorStop(.3, '#b8af9c');
  lake.addColorStop(1, '#6b6862');
  c.fillStyle = lake; c.fillRect(0, horizon, w, h - horizon);

  // sun reflection shimmer
  const bandW = sunR * 1.1;
  const refl = c.createLinearGradient(0, horizon, 0, h);
  refl.addColorStop(0, 'rgba(255,240,200,.75)');
  refl.addColorStop(1, 'rgba(255,240,200,.05)');
  c.fillStyle = refl;
  c.fillRect(sunX - bandW / 2, horizon, bandW, h - horizon);
  // horizontal ripple lines
  c.strokeStyle = 'rgba(30,28,24,.18)';
  for (let i = 0; i < 40; i++){
    const t = R(), yy = horizon + (h - horizon) * t * t;
    c.lineWidth = (0.5 + t * 1.5) * DPR;
    c.beginPath();
    c.moveTo(R() * w, yy);
    c.lineTo(R() * w, yy + (R() - .5) * 2);
    c.stroke();
  }

  // birds
  c.strokeStyle = 'rgba(30,28,24,.7)';
  c.lineWidth = 1.4 * DPR;
  const bn = 2 + (R() * 4 | 0);
  for (let i = 0; i < bn; i++){
    const bx = R() * w, by = R() * horizon * .5, bs = (4 + R() * 6) * DPR;
    c.beginPath();
    c.moveTo(bx - bs, by);
    c.quadraticCurveTo(bx - bs * .4, by - bs * .7, bx, by);
    c.quadraticCurveTo(bx + bs * .4, by - bs * .7, bx + bs, by);
    c.stroke();
  }

  // film grain — dither loves micro-texture
  const gd = c.getImageData(0, 0, w, h);
  const dd = gd.data;
  for (let i = 0; i < dd.length; i += 4){
    const n = (Math.random() - .5) * 12;
    dd[i] += n; dd[i+1] += n; dd[i+2] += n;
  }
  c.putImageData(gd, 0, 0);
}

/* ============================================================
   2) DITHERING ENGINE
   ============================================================ */
const smallCv = document.createElement('canvas');

// neutral mono noise pattern for print grain
const grainPattern = (() => {
  const n = document.createElement('canvas');
  n.width = 64; n.height = 64;
  const nc = n.getContext('2d');
  const im = nc.createImageData(64, 64);
  for (let i = 0; i < im.data.length; i += 4){
    im.data[i] = im.data[i+1] = im.data[i+2] = Math.random() < .5 ? 0 : 255;
    im.data[i+3] = 255;
  }
  nc.putImageData(im, 0, 0);
  return ctx.createPattern(n, 'repeat');
})();

const BAYER8 = [
  [ 0,32, 8,40, 2,34,10,42],[48,16,56,24,50,18,58,26],
  [12,44, 4,36,14,46, 6,38],[60,28,52,20,62,30,54,22],
  [ 3,35,11,43, 1,33, 9,41],[51,19,59,27,49,17,57,25],
  [15,47, 7,39,13,45, 5,37],[63,31,55,23,61,29,53,21]
];
const CLUSTER4 = [
  [12, 5, 6,13],[ 4, 0, 1, 7],[11, 3, 2, 8],[15,10, 9,14]
];

function hexRGB(hex){
  const n = parseInt(hex.slice(1), 16);
  return [n >> 16 & 255, n >> 8 & 255, n & 255];
}

let renderQueued = false;
function requestRender(){
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; ditherRender(); });
}

function ditherRender(){
  const ps = S.px * DPR;
  const sw = Math.max(2, Math.round(W / ps));
  const sh = Math.max(2, Math.round(H / ps));
  smallCv.width = sw; smallCv.height = sh;
  const sc = smallCv.getContext('2d', { willReadFrequently: true });

  // downsample
  sc.imageSmoothingEnabled = true;
  sc.drawImage(srcCv, 0, 0, sw, sh);

  const img = sc.getImageData(0, 0, sw, sh);
  const d = img.data;

  // grayscale + contrast curve
  const ct = S.contrast / 100;
  const gray = new Float32Array(sw * sh);
  for (let i = 0, p = 0; i < d.length; i += 4, p++){
    let g = d[i] * .299 + d[i+1] * .587 + d[i+2] * .114;
    g = (g - 128) * (1 + ct * 2.2) + 128;
    gray[p] = g;
  }

  // quantize to binary per algorithm
  const bit = new Uint8Array(sw * sh);

  if (S.algo === 'fs' || S.algo === 'atkinson'){
    const g = gray; // mutate with error diffusion
    const atkinson = S.algo === 'atkinson';
    for (let y = 0; y < sh; y++){
      const ltr = !atkinson && (y % 2 === 1); // serpentine for FS
      for (let xi = 0; xi < sw; xi++){
        const x = ltr ? sw - 1 - xi : xi;
        const p = y * sw + x;
        const old = g[p];
        const nv = old < 128 ? 0 : 255;
        bit[p] = nv ? 1 : 0;
        const err = old - nv;
        const spread = (xx, yy, wgt) => {
          if (xx < 0 || xx >= sw || yy >= sh) return;
          g[yy * sw + xx] += atkinson ? err / 8 : err * wgt / 16;
        };
        if (atkinson){
          spread(x+1, y); spread(x+2, y);
          spread(x-1, y+1); spread(x, y+1); spread(x+1, y+1);
          spread(x, y+2);
        } else if (ltr){
          spread(x-1, y, 7); spread(x+1, y+1, 3); spread(x, y+1, 5); spread(x-1, y+1, 1);
        } else {
          spread(x+1, y, 7); spread(x-1, y+1, 3); spread(x, y+1, 5); spread(x+1, y+1, 1);
        }
      }
    }
  } else if (S.algo === 'bayer'){
    for (let y = 0; y < sh; y++){
      for (let x = 0; x < sw; x++){
        const p = y * sw + x;
        const thr = (BAYER8[y & 7][x & 7] + .5) / 64 * 255;
        bit[p] = gray[p] > thr ? 1 : 0;
      }
    }
  } else { // halftone clustered dot
    for (let y = 0; y < sh; y++){
      for (let x = 0; x < sw; x++){
        const p = y * sw + x;
        const thr = (CLUSTER4[y & 3][x & 3] + .5) / 16 * 255;
        bit[p] = gray[p] > thr ? 1 : 0;
      }
    }
  }

  // map to inks
  const inkC = hexRGB(S.ink), papC = hexRGB(S.paper);
  for (let i = 0, p = 0; i < d.length; i += 4, p++){
    const cc = bit[p] ? papC : inkC;
    d[i] = cc[0]; d[i+1] = cc[1]; d[i+2] = cc[2]; d[i+3] = 255;
  }
  sc.putImageData(img, 0, 0);

  // upscale, hard pixels
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(smallCv, 0, 0, W, H);

  // subtle neutral grain overlay (keeps two-ink purity)
  ctx.save();
  ctx.globalAlpha = .06;
  ctx.fillStyle = grainPattern;
  ctx.translate(-(Math.random() * 64 | 0), -(Math.random() * 64 | 0));
  ctx.fillRect(0, 0, W + 64, H + 64);
  ctx.restore();

  stamp.textContent =
    ({fs:'FLOYD–STEINBERG', bayer:'BAYER 8×8', atkinson:'ATKINSON', halftone:'HALFTONE'})[S.algo]
    + ' · ' + S.px + 'PX';
}

function drawOriginal(){
  ctx.imageSmoothingEnabled = true;
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(srcCv, 0, 0, W, H);
}

/* ============================================================
   3) SIZING
   ============================================================ */
function resize(){
  const cw = Math.min(stage.clientWidth, 1200);
  W = Math.round(cw * DPR);
  H = Math.round(W / ASPECT);
  cv.width = W; cv.height = H;
  srcCv.width = W; srcCv.height = H;
  generateScene();
  ditherRender();
}

/* ============================================================
   4) INTERACTIONS
   ============================================================ */
const $ = id => document.getElementById(id);

$('rPx').addEventListener('input', e => {
  S.px = +e.target.value; $('oPx').textContent = e.target.value; requestRender();
});
$('rCt').addEventListener('input', e => {
  S.contrast = +e.target.value; $('oCt').textContent = e.target.value; requestRender();
});

$('segAlgo').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  for (const x of $('segAlgo').children) x.classList.toggle('on', x === b);
  S.algo = b.dataset.v;
  requestRender();
});

$('cInk').addEventListener('input', e => {
  S.ink = e.target.value; $('swInk').style.background = e.target.value; requestRender();
});
$('cPaper').addEventListener('input', e => {
  S.paper = e.target.value; $('swPaper').style.background = e.target.value; requestRender();
});

$('bScene').addEventListener('click', () => {
  S.seed = Math.random() * 1e9;
  generateScene();
  requestRender();
});

$('bDl').addEventListener('click', () => {
  // export clean dithered output (no comparison state)
  const wasComparing = S.comparing;
  if (wasComparing) ditherRender();
  const a = document.createElement('a');
  a.download = 'dither-lab.png';
  a.href = cv.toDataURL('image/png');
  a.click();
  if (wasComparing) drawOriginal();
});

// hold-to-compare
function startCompare(e){
  if (e.type === 'pointerdown' && e.target !== cv) return;
  S.comparing = true; stage.classList.add('comparing'); drawOriginal();
}
function endCompare(){
  if (!S.comparing) return;
  S.comparing = false; stage.classList.remove('comparing'); ditherRender();
}
cv.addEventListener('pointerdown', startCompare);
window.addEventListener('pointerup', endCompare);
window.addEventListener('pointercancel', endCompare);

let rsTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(rsTimer);
  rsTimer = setTimeout(resize, 150);
});

/* ---------- boot ---------- */
resize();
</script>
</body>
</html>
