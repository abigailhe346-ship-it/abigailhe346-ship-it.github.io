<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLOW FIELD — 墨川流场</title>
<style>
  :root{
    --paper:#f2ecdd; --panel:#ece4d0; --line:#d3c8a8;
    --ink:#22231f; --dim:#8d8468;
    --indigo:#31547a; --shu:#b0492f; --ochre:#9a5b3c;
    --mono:"SF Mono",Menlo,Consolas,monospace;
    --serif:Didot,"Bodoni MT",Georgia,"Songti SC",serif;
    --sans:-apple-system,"Helvetica Neue","PingFang SC",sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  ::selection{background:var(--indigo);color:#fff}

  header{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:22px 28px 0;gap:16px;flex-wrap:wrap;
  }
  .sig{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .sig h1{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:.04em}
  .sig h1 em{font-style:italic;color:var(--indigo)}
  .sig .no{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.14em}
  .sig .no b{color:var(--shu);font-weight:400}
  header p.tag{font-size:12px;color:var(--dim);letter-spacing:.06em;max-width:400px;text-align:right;line-height:1.7}
  .rule{margin:14px 28px 0;border-top:1px solid var(--ink);position:relative}
  .rule::after{content:"";position:absolute;left:0;top:2px;width:100%;border-top:1px solid var(--line)}

  main{
    display:grid;grid-template-columns:284px minmax(0,1fr);gap:24px;
    padding:24px 28px 40px;max-width:1440px;margin:0 auto;
  }
  @media (max-width:960px){main{grid-template-columns:1fr}}

  .dock{
    background:var(--panel);border:1px solid var(--ink);
    padding:20px;display:flex;flex-direction:column;gap:18px;
    align-self:start;position:sticky;top:20px;
  }
  @media (max-width:960px){.dock{position:static}}
  .dock h2{
    font-family:var(--mono);font-size:11px;font-weight:400;color:var(--dim);
    letter-spacing:.22em;text-transform:uppercase;
    border-bottom:1px solid var(--line);padding-bottom:12px;
    display:flex;justify-content:space-between;
  }
  .dock h2 span{color:var(--shu)}
  .ctl{display:flex;flex-direction:column;gap:8px}
  .ctl label{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:12px;letter-spacing:.04em;
  }
  .ctl label output{font-family:var(--mono);font-size:11px;color:var(--indigo)}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--ink)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:13px;height:13px;margin-top:-6px;
    background:var(--paper);border:1px solid var(--ink);border-radius:50%;
    box-shadow:2px 2px 0 var(--shu);transition:transform .15s var(--ease);
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.25)}
  input[type=range]::-moz-range-track{height:1px;background:var(--ink)}
  input[type=range]::-moz-range-thumb{
    width:13px;height:13px;background:var(--paper);border:1px solid var(--ink);
    border-radius:50%;box-shadow:2px 2px 0 var(--shu);
  }

  .inks{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
  .inks button{
    appearance:none;height:36px;border:1px solid var(--ink);cursor:pointer;
    position:relative;transition:transform .15s var(--ease);
    display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px;
  }
  .inks button:hover{transform:translateY(-2px)}
  .inks button span{
    font-size:10px;letter-spacing:.05em;line-height:1;
    background:rgba(242,236,221,.85);padding:1px 3px;border:1px solid rgba(34,35,31,.35);
  }
  .inks button.on::after{
    content:"";position:absolute;inset:3px;border:1px solid var(--paper);
    outline:1px solid var(--ink);pointer-events:none;
  }

  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:16px;border-top:1px solid var(--line)}
  .btn{
    appearance:none;border:1px solid var(--ink);background:transparent;color:var(--ink);
    padding:11px 8px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;
    cursor:pointer;text-transform:uppercase;position:relative;overflow:hidden;
    transition:color .18s var(--ease);
  }
  .btn::before{
    content:"";position:absolute;inset:0;background:var(--ink);
    transform:translateY(101%);transition:transform .22s var(--ease);z-index:0;
  }
  .btn:hover::before{transform:translateY(0)}
  .btn:hover{color:var(--paper)}
  .btn span{position:relative;z-index:1}
  .btn.prime{background:var(--indigo);border-color:var(--indigo);color:#fff}
  .btn.prime::before{background:var(--ink)}

  .stage{
    position:relative;background:#f6f0e2;border:1px solid var(--ink);
    box-shadow:8px 8px 0 rgba(34,35,31,.10);overflow:hidden;
  }
  .stage canvas{display:block;width:100%;height:auto;cursor:crosshair;touch-action:none}
  .vtitle{
    position:absolute;left:14px;top:16px;writing-mode:vertical-rl;
    font-family:var(--serif);font-size:20px;letter-spacing:.42em;color:var(--ink);
    pointer-events:none;opacity:.82;
  }
  .vtitle small{
    font-family:var(--mono);font-size:9px;letter-spacing:.3em;color:var(--dim);
    margin-top:10px;
  }
  .hanko{
    position:absolute;right:16px;top:16px;width:34px;height:34px;
    background:var(--shu);color:#f6f0e2;display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-size:15px;letter-spacing:0;line-height:1;
    writing-mode:vertical-rl;pointer-events:none;
    box-shadow:2px 2px 0 rgba(34,35,31,.18);
  }
  .hint{
    position:absolute;left:14px;bottom:12px;font-family:var(--mono);font-size:10px;
    letter-spacing:.14em;color:rgba(34,35,31,.5);pointer-events:none;text-transform:uppercase;
  }
  .count{
    position:absolute;right:16px;bottom:12px;font-family:var(--mono);font-size:10px;
    letter-spacing:.16em;color:rgba(34,35,31,.55);pointer-events:none;text-transform:uppercase;
  }

  footer{
    padding:0 28px 26px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
    font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;
  }
  @media (max-width:640px){
    header{padding:18px 18px 0}
    header p.tag{text-align:left;max-width:100%}
    .rule{margin:12px 18px 0}
    main{padding:18px 18px 32px}
    footer{padding:0 18px 22px}
    .vtitle{font-size:16px}
  }
</style>
</head>
<body>

<header>
  <div class="sig">
    <h1>Flow <em>Field</em></h1>
    <span class="no">N°<b>15</b> — GEN-ART / 墨川流场 · Particle Ink</span>
  </div>
  <p class="tag">千支毛笔顺流而行,墨在看不见的河床上积出山与水。</p>
</header>
<div class="rule"></div>

<main>
  <aside class="dock">
    <h2>笔房 — Brush Room <span>流</span></h2>

    <div class="ctl">
      <label>墨色 · Ink</label>
      <div class="inks" id="inks">
        <button data-ink="sumi" class="on" style="background:#22231f"><span>墨</span></button>
        <button data-ink="indigo" style="background:#31547a"><span>青</span></button>
        <button data-ink="ochre" style="background:#9a5b3c"><span>赭</span></button>
        <button data-ink="shu" style="background:#b0492f"><span>朱</span></button>
        <button data-ink="water" style="background:#f6f0e2"><span>水</span></button>
      </div>
    </div>

    <div class="ctl">
      <label>流速 · Current<output id="oSpeed">1.6</output></label>
      <input type="range" id="rSpeed" min="4" max="32" step="1" value="16">
    </div>
    <div class="ctl">
      <label>卷曲 · Curl<output id="oCurl">2.2</output></label>
      <input type="range" id="rCurl" min="8" max="40" step="1" value="22">
    </div>
    <div class="ctl">
      <label>笔数 · Brushes<output id="oCount">420</output></label>
      <input type="range" id="rCount" min="80" max="900" step="10" value="420">
    </div>

    <div class="actions">
      <button class="btn" id="btnRandom"><span>随机再生</span></button>
      <button class="btn prime" id="btnSave"><span>下载 PNG</span></button>
    </div>
  </aside>

  <div class="stage" id="stage">
    <canvas id="cv" width="1400" height="1000"></canvas>
    <div class="vtitle">流れの墨<small>FLOW FIELD</small></div>
    <div class="hanko">流墨</div>
    <div class="hint">移动搅流 · 点按落笔 — Stir / Drop</div>
    <div class="count" id="count">0 笔</div>
  </div>
</main>

<footer>
  <span>Flow Field — 墨川流场</span>
  <span>Curl Noise · MMXXVI</span>
</footer>

<script>
(function(){
  "use strict";

  var W = 1400, H = 1000;
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = W*DPR; cv.height = H*DPR;

  /* ---------- seeded rng ---------- */
  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* ---------- 2D gradient noise ---------- */
  function makeNoise(seed){
    var rng = mulberry32(seed);
    var perm = new Uint8Array(512);
    var p = [];
    for (var i=0;i<256;i++) p[i]=i;
    for (var j=255;j>0;j--){
      var k = Math.floor(rng()*(j+1));
      var tmp = p[j]; p[j]=p[k]; p[k]=tmp;
    }
    for (var m=0;m<512;m++) perm[m]=p[m&255];
    function fade(t){ return t*t*t*(t*(t*6-15)+10); }
    function grad(h,x,y){
      switch(h&7){
        case 0: return  x+y; case 1: return  x-y;
        case 2: return -x+y; case 3: return -x-y;
        case 4: return  x;   case 5: return -x;
        case 6: return  y;   default:return -y;
      }
    }
    return function(x,y){
      var X = Math.floor(x), Y = Math.floor(y);
      var xf = x-X, yf = y-Y;
      X &= 255; Y &= 255;
      var aa = perm[perm[X]+Y], ab = perm[perm[X]+Y+1];
      var ba = perm[perm[X+1]+Y], bb = perm[perm[X+1]+Y+1];
      var u = fade(xf), v = fade(yf);
      var x1 = grad(aa,xf,yf)   + u*(grad(ba,xf-1,yf)  -grad(aa,xf,yf));
      var x2 = grad(ab,xf,yf-1) + u*(grad(bb,xf-1,yf-1)-grad(ab,xf,yf-1));
      return x1 + v*(x2-x1); /* roughly -1..1 */
    };
  }

  /* ---------- palette ---------- */
  var INKS = {
    sumi:   { r:34,  g:35,  b:31,  a:0.085 },
    indigo: { r:49,  g:84,  b:122, a:0.075 },
    ochre:  { r:154, g:91,  b:60,  a:0.070 },
    shu:    { r:176, g:73,  b:47,  a:0.070 }
  };
  var INK_KEYS = ["sumi","indigo","ochre","shu"];

  var state = {
    ink: "sumi",
    speed: 1.6,
    curl: 2.2,
    brushes: 420,
    seed: 1
  };

  /* ---------- canvases ---------- */
  var paperC = document.createElement("canvas");
  var inkC = document.createElement("canvas");
  paperC.width = W; paperC.height = H;
  inkC.width = W; inkC.height = H;
  var pctx = paperC.getContext("2d");
  var ictx = inkC.getContext("2d");

  function makePaper(rng){
    pctx.fillStyle = "#f6f0e2";
    pctx.fillRect(0,0,W,H);
    var img = pctx.getImageData(0,0,W,H);
    var d = img.data;
    for (var i=0;i<d.length;i+=4){
      var n = (rng()-0.5)*10;
      d[i]   = Math.max(0,Math.min(255, d[i]+n));
      d[i+1] = Math.max(0,Math.min(255, d[i+1]+n));
      d[i+2] = Math.max(0,Math.min(255, d[i+2]+n*0.9));
    }
    pctx.putImageData(img,0,0);
    pctx.strokeStyle = "rgba(34,35,31,.04)";
    pctx.lineWidth = 1;
    for (var f=0; f<150; f++){
      var x=rng()*W, y=rng()*H, a=rng()*6.28, l=12+rng()*46;
      pctx.beginPath();
      pctx.moveTo(x,y);
      pctx.quadraticCurveTo(x+Math.cos(a)*l*0.5, y+Math.sin(a)*l*0.5+(rng()-0.5)*8,
                            x+Math.cos(a)*l, y+Math.sin(a)*l);
      pctx.stroke();
    }
    var g = pctx.createRadialGradient(W/2,H/2,H*0.32, W/2,H/2,H*0.9);
    g.addColorStop(0,"rgba(120,100,60,0)");
    g.addColorStop(1,"rgba(120,100,60,.12)");
    pctx.fillStyle = g;
    pctx.fillRect(0,0,W,H);
  }

  /* ---------- flow field & brushes ---------- */
  var noise = makeNoise(1);
  var noise2 = makeNoise(7);
  var parts = [];
  var clusters = [];
  var strokeCount = 0;

  function fieldAngle(x,y){
    var cs = 0.0016;
    var n = noise(x*cs, y*cs) + 0.45*noise2(x*cs*2.6, y*cs*2.6);
    return n * Math.PI * state.curl;
  }

  function spawnNear(p){
    if (clusters.length && Math.random() < 0.82){
      var c = clusters[Math.floor(Math.random()*clusters.length)];
      var a = Math.random()*Math.PI*2, r = Math.pow(Math.random(),0.5)*c.r;
      p.x = c.x + Math.cos(a)*r;
      p.y = c.y + Math.sin(a)*r*0.72;
    } else {
      p.x = Math.random()*W;
      p.y = Math.random()*H;
    }
    if (p.x<0) p.x=0; if (p.x>W) p.x=W;
    if (p.y<0) p.y=0; if (p.y>H) p.y=H;
    p.px = p.x; p.py = p.y;
  }

  function newBrush(x, y, inkKey){
    var p = {
      x: x===undefined?0:x, y: y===undefined?0:y,
      px: 0, py: 0,
      life: 0,
      maxLife: 90 + Math.random()*160,
      ink: inkKey || INK_KEYS[Math.floor(Math.random()*INK_KEYS.length)],
      w: 0.7 + Math.random()*1.6
    };
    if (x===undefined) spawnNear(p); else { p.px=x; p.py=y; }
    return p;
  }

  function rebuild(){
    parts = [];
    for (var i=0;i<state.brushes;i++) parts.push(newBrush());
  }

  var mouse = { x:-9999, y:-9999, vx:0, vy:0, active:false };

  function step(){
    var sp = state.speed;
    ictx.lineCap = "round";
    for (var i=0;i<parts.length;i++){
      var p = parts[i];
      var ang = fieldAngle(p.x, p.y);
      var vx = Math.cos(ang)*sp, vy = Math.sin(ang)*sp;

      /* mouse stir: tangential swirl around cursor */
      if (mouse.active){
        var dx = p.x-mouse.x, dy = p.y-mouse.y;
        var d2 = dx*dx+dy*dy, R = 150;
        if (d2 < R*R && d2 > 1){
          var d = Math.sqrt(d2);
          var f = (1-d/R)*4.2;
          vx += (-dy/d)*f + mouse.vx*0.12*(1-d/R);
          vy += ( dx/d)*f + mouse.vy*0.12*(1-d/R);
        }
      }

      p.px = p.x; p.py = p.y;
      p.x += vx; p.y += vy;
      p.life++;

      var t = p.life/p.maxLife;
      var taper = Math.pow(Math.sin(Math.PI*Math.min(1,t)), 0.9);
      var lw = p.w * (0.35 + 2.1*taper);
      var ink = INKS[p.ink];

      /* dry-brush: occasionally skip a segment */
      if (Math.random() > 0.06){
        if (p.ink === "water"){
          ictx.save();
          ictx.globalCompositeOperation = "destination-out";
          ictx.strokeStyle = "rgba(0,0,0,0.05)";
          ictx.lineWidth = lw*3.2;
          ictx.beginPath(); ictx.moveTo(p.px,p.py); ictx.lineTo(p.x,p.y); ictx.stroke();
          ictx.restore();
        } else {
          ictx.strokeStyle = "rgba("+ink.r+","+ink.g+","+ink.b+","+ink.a+")";
          ictx.lineWidth = lw;
          ictx.beginPath(); ictx.moveTo(p.px,p.py); ictx.lineTo(p.x,p.y); ictx.stroke();
        }
      }

      if (p.life >= p.maxLife || p.x<-20 || p.x>W+20 || p.y<-20 || p.y>H+20){
        var keep = p.ink;
        var np = newBrush(undefined, undefined, Math.random()<0.85?keep:undefined);
        parts[i] = np;
        strokeCount++;
        if (strokeCount % 40 === 0) updateCount();
      }
    }
  }

  function render(){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.drawImage(paperC, 0, 0, W, H);
    ctx.save();
    ctx.globalCompositeOperation = "multiply";
    ctx.drawImage(inkC, 0, 0, W, H);
    ctx.restore();
  }

  var running = true;
  function frame(){
    if (running){
      for (var s=0;s<2;s++) step();
      render();
    }
    requestAnimationFrame(frame);
  }

  /* ---------- pointer ---------- */
  var lastMX = 0, lastMY = 0;
  function toLocal(e){
    var r = cv.getBoundingClientRect();
    return { x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H };
  }
  cv.addEventListener("pointermove", function(e){
    var p = toLocal(e);
    mouse.vx = p.x-lastMX; mouse.vy = p.y-lastMY;
    mouse.x = p.x; mouse.y = p.y; mouse.active = true;
    lastMX = p.x; lastMY = p.y;
  });
  cv.addEventListener("pointerleave", function(){ mouse.active = false; mouse.x=-9999; });
  cv.addEventListener("pointerdown", function(e){
    var p = toLocal(e);
    for (var i=0;i<26;i++){
      var a = Math.random()*Math.PI*2, r = Math.random()*26;
      var b = newBrush(p.x+Math.cos(a)*r, p.y+Math.sin(a)*r,
                       Math.random()<0.75 ? state.ink : undefined);
      if (parts.length >= state.brushes+400) parts.shift();
      parts.push(b);
    }
    strokeCount += 26;
    updateCount();
  });

  /* ---------- controls ---------- */
  document.getElementById("inks").addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    document.querySelectorAll("#inks button").forEach(function(x){x.classList.remove("on");});
    b.classList.add("on");
    state.ink = b.dataset.ink;
  });
  document.getElementById("rSpeed").addEventListener("input", function(){
    state.speed = parseFloat(this.value)/10;
    document.getElementById("oSpeed").textContent = state.speed.toFixed(1);
  });
  document.getElementById("rCurl").addEventListener("input", function(){
    state.curl = parseFloat(this.value)/10;
    document.getElementById("oCurl").textContent = state.curl.toFixed(1);
  });
  document.getElementById("rCount").addEventListener("input", function(){
    state.brushes = parseInt(this.value,10);
    document.getElementById("oCount").textContent = state.brushes;
    rebuild();
  });

  function updateCount(){
    document.getElementById("count").textContent = strokeCount+" 笔";
  }

  /* ---------- regenerate ---------- */
  function compose(){
    state.seed = Math.floor(Math.random()*1e9);
    var rng = mulberry32(state.seed);
    noise = makeNoise(state.seed);
    noise2 = makeNoise(state.seed+101);
    makePaper(rng);
    ictx.setTransform(1,0,0,1,0,0);
    ictx.clearRect(0,0,W,H);
    strokeCount = 0;

    /* ribbon clusters where brushes are born */
    clusters = [];
    var nC = 2 + Math.floor(rng()*3);
    for (var i=0;i<nC;i++){
      clusters.push({
        x: W*(0.18+rng()*0.64),
        y: H*(0.2+rng()*0.6),
        r: 60+rng()*150
      });
    }
    rebuild();
    /* pre-run so the first screen is already a composed painting */
    for (var s=0;s<300;s++) step();
    render();
    updateCount();
  }
  document.getElementById("btnRandom").addEventListener("click", compose);

  /* ---------- download ---------- */
  document.getElementById("btnSave").addEventListener("click", function(){
    var out = document.createElement("canvas");
    out.width = cv.width; out.height = cv.height;
    var octx = out.getContext("2d");
    octx.drawImage(paperC, 0, 0, out.width, out.height);
    octx.globalCompositeOperation = "multiply";
    octx.drawImage(inkC, 0, 0, out.width, out.height);
    var a = document.createElement("a");
    a.download = "flow-field-"+Date.now()+".png";
    a.href = out.toDataURL("image/png");
    a.click();
  });

  /* ---------- boot ---------- */
  compose();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
