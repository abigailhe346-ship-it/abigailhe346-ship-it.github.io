<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topo Drift — 晨雾测绘所 · Atelier MIRA</title>
<style>
  :root{
    /* 家族① 晨雾 Brume Matinale —— 冷，≈7500K，全系列最低对比 */
    --mist:#E8E6DF; --lilac:#C9CDD6; --ridge:#9AA7B8; --shade:#6E7B8C; --sand:#D8CBB8;
    --paper:#E6E4DC; --panel:#ECEAE2; --line:#C6C8BE;
    --ink:#4A5260; --dim:#98A0AA;
    --mono:"SF Mono",Menlo,Consolas,monospace;
    --serif:Didot,"Bodoni MT",Georgia,"Songti SC",serif;
    --sans:-apple-system,"Helvetica Neue","PingFang SC",sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--paper)}
  body{color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  ::selection{background:var(--ridge);color:var(--mist)}

  header{
    display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;
    padding:20px clamp(18px,4vw,44px) 14px;
  }
  .brand{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  .back{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-decoration:none;transition:color .4s var(--ease)}
  .back:hover{color:var(--ink)}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(26px,3.4vw,40px);letter-spacing:-.01em;line-height:1}
  h1 em{font-style:italic;color:var(--shade)}
  .epig{font-family:var(--serif);font-style:italic;font-size:14.5px;color:#828DA0;max-width:340px;line-height:1.5}
  .idx{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}

  .stage-wrap{padding:0 clamp(18px,4vw,44px) 26px}
  .stage{
    position:relative;height:min(76vh,720px);min-height:430px;border-radius:3px;overflow:hidden;
    background:var(--mist);box-shadow:0 1px 0 var(--line),0 18px 50px -30px rgba(110,123,140,.5);
    cursor:crosshair;
  }
  canvas{display:block;width:100%;height:100%}

  .etudes{position:absolute;top:14px;left:14px;right:64px;display:flex;gap:8px;flex-wrap:wrap;z-index:4;transition:opacity .5s var(--ease)}
  .etudes button{
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink);
    background:rgba(232,230,223,.72);border:1px solid rgba(74,82,96,.28);border-radius:2px;
    padding:7px 12px;cursor:pointer;backdrop-filter:blur(3px);
    transition:all .45s var(--ease);
  }
  .etudes button:hover{background:rgba(232,230,223,.95);transform:translateY(-1px)}
  .etudes button.on{background:var(--shade);color:var(--mist);border-color:var(--shade)}

  .sndbtn{
    position:absolute;top:14px;right:14px;z-index:4;width:34px;height:34px;border-radius:2px;
    border:1px solid rgba(74,82,96,.28);background:rgba(232,230,223,.72);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .45s var(--ease);
  }
  .sndbtn:hover{background:rgba(232,230,223,.95)}
  .sndbtn svg{width:17px;height:17px;stroke:var(--ink);fill:none;stroke-width:1.5;stroke-linecap:round}
  .sndbtn .waves{opacity:0;transition:opacity .4s}
  .sndbtn.on .waves{opacity:1}
  .sndbtn.on .slash{opacity:0}
  .sndbtn .slash{transition:opacity .4s}

  .readout{
    position:absolute;right:14px;bottom:52px;z-index:4;
    font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink);
    background:rgba(232,230,223,.8);border:1px solid rgba(74,82,96,.3);border-radius:2px;
    padding:5px 9px;pointer-events:none;white-space:nowrap;opacity:.8;
  }

  .sig{
    position:absolute;left:14px;bottom:52px;z-index:4;display:flex;align-items:center;gap:9px;
    opacity:.68;cursor:default;user-select:none;
  }
  .sig svg{width:20px;height:13px}
  .sig span{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink)}

  .note{
    position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);z-index:5;
    font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink);
    background:rgba(236,234,226,.92);border:1px solid var(--line);border-radius:2px;
    padding:12px 20px;opacity:0;pointer-events:none;transition:all .8s var(--ease);
    max-width:82%;text-align:center;
  }
  .note.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .lume{
    position:absolute;left:0;right:0;bottom:0;z-index:4;height:40px;
    display:flex;align-items:center;gap:12px;padding:0 16px;
    background:linear-gradient(to top,rgba(232,230,223,.9),rgba(232,230,223,0));
    transition:opacity .5s var(--ease);
  }
  .lume .lab{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--dim);white-space:nowrap}
  .lume .track{position:relative;flex:1;height:22px;cursor:ew-resize;touch-action:none}
  .lume .track::before{
    content:"";position:absolute;left:0;right:0;top:50%;height:2px;transform:translateY(-50%);
    background:linear-gradient(90deg,#9AA7B8,#C9CDD6,#E8E6DF,#F4E3C2,#E8B96F,#8E7BA8,#4E4A6B);
    border-radius:1px;opacity:.65;
  }
  .lume .thumb{
    position:absolute;top:50%;width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#F4E3C2,#D98E4A);
    border:1.5px solid rgba(74,82,96,.5);transform:translate(-50%,-50%);
    box-shadow:0 2px 8px rgba(74,82,96,.3);pointer-events:none;
    transition:box-shadow .4s;
  }
  .lume .heure{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink);min-width:52px;text-align:right}
  .hideme .etudes,.hideme .lume,.hideme .sig,.hideme .readout{opacity:0;pointer-events:none}

  footer{padding:0 clamp(18px,4vw,44px) 30px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
  footer p{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  @media (max-width:640px){
    .stage{height:66vh;min-height:400px}
    .epig{max-width:100%}
    .sig{bottom:56px}
    .readout{display:none}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <a class="back" href="../../../index.html#work">← Archive</a>
    <h1>Topo <em>Drift</em></h1>
  </div>
  <p class="epig">「这张地图拒绝装订：山在雾里，慢慢改道。」</p>
  <span class="idx">Gen-Art · N°10</span>
</header>

<div class="stage-wrap">
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>

    <div class="etudes" id="etudes">
      <button data-m="clair" class="on">晴 · Clair</button>
      <button data-m="brume">雾 · Brume</button>
      <button data-m="vent">风 · Vent</button>
      <button data-m="__regen">再生 ↻</button>
      <button data-m="__save">PNG ↓</button>
    </div>

    <button class="sndbtn" id="snd" aria-label="声景开关" title="声景（默认关闭）">
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="waves" d="M16.5 8.5c1.6 1.8 1.6 5.2 0 7M19 6.5c2.6 3 2.6 8 0 11"/><path class="slash" d="M17 9l5 6M22 9l-5 6"/></svg>
    </button>

    <div class="sig" id="sig">
      <svg viewBox="0 0 64 40" fill="#4A5260" aria-hidden="true">
        <path d="M32 20 C 26 12, 14 6, 4 8 C 12 12, 18 18, 24 21
                 C 14 20, 6 22, 2 28 C 10 26, 18 26, 25 26
                 C 27 30, 30 34, 34 36 C 33 32, 33 28, 34 25
                 C 42 22, 52 16, 62 4 C 54 10, 44 16, 36 19
                 C 35 17, 33 17, 32 20 Z"/>
      </svg>
      <span>Atelier MIRA · N°010 · Brume Matinale</span>
    </div>

    <div class="readout" id="readout">ELEV ---- M · --°--′N ---°--′E</div>
    <div class="note" id="note">十月四日，雾。同一座山测了三次，三次的海拔都不一样——雾替它撒谎。</div>

    <div class="lume">
      <span class="lab">光 · HEURE</span>
      <div class="track" id="lume"><div class="thumb" id="thumb"></div></div>
      <span class="heure" id="heureOut">—</span>
    </div>
  </div>
</div>

<footer>
  <p>雾散见山 · 移开晨雾靠光标，拖动时间轴看一天</p>
  <p id="stats">Canvas 2D · marching squares · fBM-4 · ——</p>
</footer>

<script>
(function(){
"use strict";
/* ---------- palette: Brume Matinale 晨雾（冷 ≈7500K，低对比） ---------- */
const PAL={
  mist:[232,230,223], lilac:[201,205,214], ridge:[154,167,184],
  shade:[110,123,140], sand:[216,203,184]
};
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const stage=document.getElementById('stage');
let W=0,H=0,DPR=1;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- heure 时间系统（签名） ---------- */
let heure=new Date().getHours()+new Date().getMinutes()/60;
const hash=location.hash.match(/h=([\d.]+)/);if(hash)heure=parseFloat(hash[1])%24;
const KEYS=[
  [0,  [78,74,107],.30,[142,123,168],.05,.20],
  [5,  [154,167,184],.22,[216,203,184],.10,.45],
  [8,  [201,205,214],.08,[232,230,223],.06,.75],
  [12, [232,230,223],.04,[244,240,228],.05,1.0],
  [16, [201,205,214],.08,[244,227,194],.08,.86],
  [18.5,[217,142,74],.16,[232,185,111],.18,.62],
  [20.5,[110,123,140],.26,[201,166,180],.08,.34],
  [24, [78,74,107],.30,[142,123,168],.05,.20]
];
function lightAt(h){
  h=((h%24)+24)%24;
  let i=0;while(i<KEYS.length-2&&KEYS[i+1][0]<h)i++;
  const a=KEYS[i],b=KEYS[i+1],t=Math.min(1,Math.max(0,(h-a[0])/(b[0]-a[0]||1)));
  const L=(x,y)=>x+(y-x)*t, mix3=(u,v)=>[L(u[0],v[0]),L(u[1],v[1]),L(u[2],v[2])];
  return {tint:mix3(a[1],b[1]),tintA:L(a[2],b[2]),warm:mix3(a[3],b[3]),warmA:L(a[4],b[4]),light:L(a[5],b[5])};
}
/* 雾量随一天变化：清晨最浓，正午散去，傍晚回流 */
function fogAt(h){
  h=((h%24)+24)%24;
  if(h<4.5)return .85;
  if(h<7)return 1.0;
  if(h<11)return 1.0-(h-7)/4*.85;   // 7→11 雾散（wow 区间）
  if(h<17)return .15;
  if(h<21)return .15+(h-17)/4*.55;
  return .7;
}

/* ---------- seeded 3D value noise（沿用原引擎） ---------- */
function makeNoise(seed){
  const rand=mulberry32(seed), p=new Uint8Array(512);
  const perm=new Uint8Array(256);
  for(let i=0;i<256;i++)perm[i]=i;
  for(let i=255;i>0;i--){const j=Math.floor(rand()*(i+1));const t=perm[i];perm[i]=perm[j];perm[j]=t;}
  for(let i=0;i<512;i++)p[i]=perm[i&255];
  const vals=new Float32Array(512);
  for(let i=0;i<512;i++)vals[i]=rand();
  function fade(t){return t*t*t*(t*(t*6-15)+10)}
  function n3(x,y,z){
    const X=Math.floor(x),Y=Math.floor(y),Z=Math.floor(z);
    const xf=x-X,yf=y-Y,zf=z-Z;
    const u=fade(xf),v=fade(yf),w=fade(zf);
    function h(i,j,k){return vals[p[(p[(p[i&255]+j)&255]+k)&255]]}
    const x1=h(X,Y,Z)+(h(X+1,Y,Z)-h(X,Y,Z))*u;
    const x2=h(X,Y+1,Z)+(h(X+1,Y+1,Z)-h(X,Y+1,Z))*u;
    const x3=h(X,Y,Z+1)+(h(X+1,Y,Z+1)-h(X,Y,Z+1))*u;
    const x4=h(X,Y+1,Z+1)+(h(X+1,Y+1,Z+1)-h(X,Y+1,Z+1))*u;
    const y1=x1+(x2-x1)*v, y2=x3+(x4-x3)*v;
    return y1+(y2-y1)*w;
  }
  return function fbm(x,y,z){
    let a=0,amp=.5,f=1;
    for(let o=0;o<4;o++){a+=amp*n3(x*f,y*f,z*f);amp*=.5;f*=2.1;}
    return a;
  };
}

/* ---------- 晕渲色带（Brume 家族内） ---------- */
function ramp(stops,n){
  const out=[];
  for(let k=0;k<n;k++){
    const t=k/(n-1)*(stops.length-1), i=Math.min(stops.length-2,Math.floor(t)), f=t-i;
    const a=stops[i],b=stops[i+1];
    out.push([Math.round(a[0]+(b[0]-a[0])*f),Math.round(a[1]+(b[1]-a[1])*f),Math.round(a[2]+(b[2]-a[2])*f)]);
  }
  return out;
}
const SEA_C=[201,205,214], BATHY=[154,167,184];
const LAND=ramp([[216,203,184],[220,214,198],[201,205,214],[178,187,199],[154,167,184],[130,144,160]],24);
const SEA=0.42;

/* ---------- state ---------- */
let seed=Math.floor(Math.random()*1e9);
let noise=makeNoise(seed);
let mode="clair"; // clair / brume / vent
const GW=150, GH=100;
const grid=new Float32Array((GW+1)*(GH+1));
let peaks=[];
let tDrift=Math.random()*100;
let baseLat,baseLon,surveyNo;
let mapR={x:0,y:0,w:0,h:0};

function metaFromSeed(){
  const r=mulberry32(seed+3);
  baseLat=28+Math.floor(r()*24); baseLon=102+Math.floor(r()*22);
  surveyNo=1000+Math.floor(r()*9000);
}
function computeGrid(t){
  const s=3.2, ox=(seed%1000)/1000*40, oy=(seed%777)/777*40;
  for(let j=0;j<=GH;j++){
    for(let i=0;i<=GW;i++){
      const u=i/GW, v=j/GH;
      let e=noise(u*s+ox,v*s*0.94+oy,t);
      e=Math.pow(e,1.25);
      const dx=u-.5, dy=v-.5, d=Math.sqrt(dx*dx*2.4+dy*dy*2.4);
      e=e*1.06-Math.max(0,d-.52)*.55;
      grid[j*(GW+1)+i]=e;
    }
  }
}
function findPeaks(){
  peaks=[];
  for(let j=2;j<GH-2;j++){
    for(let i=2;i<GW-2;i++){
      const h=grid[j*(GW+1)+i];
      if(h<0.68)continue;
      let ok=true;
      for(let dj=-2;dj<=2&&ok;dj++)for(let di=-2;di<=2;di++){
        if(grid[(j+dj)*(GW+1)+i+di]>h){ok=false;break}
      }
      if(ok)peaks.push({i:i,j:j,h:h});
    }
  }
  peaks.sort((a,b)=>b.h-a.h);
  const keep=[];
  for(const p of peaks){
    if(keep.length>=4)break;
    if(keep.every(k=>(k.i-p.i)*(k.i-p.i)+(k.j-p.j)*(k.j-p.j)>400))keep.push(p);
  }
  peaks=keep;
}

/* ---------- marching squares（沿用原引擎） ---------- */
function contourPath(g,level){
  const cw=mapR.w/GW, ch=mapR.h/GH;
  const sx=i=>mapR.x+i*cw, sy=j=>mapR.y+j*ch;
  g.beginPath();
  for(let j=0;j<GH;j++){
    for(let i=0;i<GW;i++){
      const a=grid[j*(GW+1)+i], b=grid[j*(GW+1)+i+1],
            c=grid[(j+1)*(GW+1)+i+1], d=grid[(j+1)*(GW+1)+i];
      const idx=(a>level?8:0)|(b>level?4:0)|(c>level?2:0)|(d>level?1:0);
      if(idx===0||idx===15)continue;
      function pt(edge){
        if(edge===0){const f=(level-a)/(b-a);return[sx(i)+f*cw,sy(j)]}
        if(edge===1){const f2=(level-b)/(c-b);return[sx(i+1),sy(j)+f2*ch]}
        if(edge===2){const f3=(level-d)/(c-d);return[sx(i)+f3*cw,sy(j+1)]}
        const f4=(level-a)/(d-a);return[sx(i),sy(j)+f4*ch];
      }
      function seg(e1,e2){const p1=pt(e1),p2=pt(e2);g.moveTo(p1[0],p1[1]);g.lineTo(p2[0],p2[1])}
      const center=(a+b+c+d)/4;
      switch(idx){
        case 1: seg(3,2);break;
        case 2: seg(2,1);break;
        case 3: seg(3,1);break;
        case 4: seg(0,1);break;
        case 5: if(center>level){seg(3,0);seg(2,1)}else{seg(3,2);seg(0,1)}break;
        case 6: seg(0,2);break;
        case 7: seg(3,0);break;
        case 8: seg(0,3);break;
        case 9: seg(0,2);break;
        case 10: if(center>level){seg(0,1);seg(3,2)}else{seg(0,3);seg(2,1)}break;
        case 11: seg(0,1);break;
        case 12: seg(3,1);break;
        case 13: seg(2,1);break;
        case 14: seg(3,2);break;
      }
    }
  }
}

/* ---------- 纸纹 + 颗粒 ---------- */
let paperC=null;
function makePaper(){
  paperC=document.createElement('canvas');paperC.width=Math.max(2,W*DPR/2);paperC.height=Math.max(2,H*DPR/2);
  const p=paperC.getContext('2d');p.scale(DPR/2,DPR/2);
  const r=mulberry32(81);
  for(let i=0;i<4200;i++){
    p.fillStyle=`rgba(${r()<.5?'74,82,96':'255,253,248'},${(.02+r()*.04).toFixed(3)})`;
    p.fillRect(r()*W,r()*H,1+r()*1.6,1+r()*1.2);
  }
  p.strokeStyle='rgba(120,124,132,.05)';p.lineWidth=.6;
  for(let i=0;i<70;i++){
    p.beginPath();const x=r()*W,y=r()*H,a=r()*Math.PI;
    p.moveTo(x,y);p.lineTo(x+Math.cos(a)*(20+r()*70),y+Math.sin(a)*(20+r()*70));p.stroke();
  }
}
const grainC=document.createElement('canvas');grainC.width=grainC.height=128;
function makeGrain(){
  const g=grainC.getContext('2d');const im=g.createImageData(128,128);
  for(let i=0;i<im.data.length;i+=4){const v=110+Math.random()*40;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=14}
  g.putImageData(im,0,0);
}
makeGrain();setInterval(makeGrain,83);

/* ---------- 指针：拨雾（L1.4 hover 吹散，半径随停留扩大） ---------- */
let px=-999,py=-999,ptx=-999,pty=-999,dwell=0,lastMove=0;
let gusts=[];
stage.addEventListener('pointermove',e=>{
  const r=stage.getBoundingClientRect();ptx=e.clientX-r.left;pty=e.clientY-r.top;
  lastMove=performance.now();
});
stage.addEventListener('pointerleave',()=>{ptx=-999;pty=-999;dwell=0});
stage.addEventListener('pointerdown',e=>{
  const r=stage.getBoundingClientRect();
  gusts.push({x:e.clientX-r.left,y:e.clientY-r.top,r:0,a:1});
  if(sound.on)sound.whoosh();
});

/* ---------- 声景（L5，默认 OFF） ---------- */
const sound={on:false,ctx:null,master:null,
  init(){ if(this.ctx)return;
    const C=this.ctx=new (window.AudioContext||window.webkitAudioContext)();
    const M=this.master=C.createGain();M.gain.value=0;M.connect(C.destination);
    const len=2*C.sampleRate,buf=C.createBuffer(1,len,C.sampleRate),d=buf.getChannelData(0);
    let l=0;for(let i=0;i<len;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.2}
    const src=C.createBufferSource();src.buffer=buf;src.loop=true;
    const bp=C.createBiquadFilter();bp.type='bandpass';bp.frequency.value=460;bp.Q.value=1;
    const wg=C.createGain();wg.gain.value=.14;src.connect(bp);bp.connect(wg);wg.connect(M);src.start();
    this.wind=bp;
    this.scheduleBird();
  },
  scheduleBird(){ if(!this.ctx)return;
    setTimeout(()=>{ if(this.on)this.chirp(); this.scheduleBird(); },2500+Math.random()*7000);
  },
  chirp(){ const C=this.ctx,t=C.currentTime;
    const o=C.createOscillator(),m=C.createOscillator(),mg=C.createGain(),g=C.createGain();
    o.frequency.setValueAtTime(2400+Math.random()*300,t);
    o.frequency.exponentialRampToValueAtTime(3200,t+.08);
    m.frequency.value=30+Math.random()*40;mg.gain.value=200+Math.random()*300;
    m.connect(mg);mg.connect(o.frequency);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.026,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.12);
    o.connect(g);g.connect(this.master);o.start(t);m.start(t);o.stop(t+.14);m.stop(t+.14);
  },
  whoosh(){ const C=this.ctx;if(!C)return;const t=C.currentTime;
    this.wind.frequency.cancelScheduledValues(t);
    this.wind.frequency.setValueAtTime(this.wind.frequency.value,t);
    this.wind.frequency.linearRampToValueAtTime(900,t+.2);
    this.wind.frequency.exponentialRampToValueAtTime(420,t+1.5);
  },
  toggle(){ this.on=!this.on;
    if(this.on){this.init();this.ctx.resume();const t=this.ctx.currentTime;
      this.master.gain.cancelScheduledValues(t);this.master.gain.setValueAtTime(0,t);
      this.master.gain.linearRampToValueAtTime(1,t+1.5);}
    else if(this.ctx){const t=this.ctx.currentTime;
      this.master.gain.cancelScheduledValues(t);this.master.gain.linearRampToValueAtTime(0,t+.6);}
    localStorage.setItem('mira-sound',this.on?'1':'0');
    document.getElementById('snd').classList.toggle('on',this.on);
  }
};
document.getElementById('snd').addEventListener('click',e=>{e.stopPropagation();sound.toggle()});
if(localStorage.getItem('mira-sound')==='1'){
  const arm=()=>{sound.toggle();removeEventListener('pointerdown',arm)};addEventListener('pointerdown',arm);}

/* ---------- lume 时间轴 ---------- */
const lume=document.getElementById('lume'),thumb=document.getElementById('thumb'),heureOut=document.getElementById('heureOut');
let lumeDrag=false;
function lumeSet(e){const r=lume.getBoundingClientRect();
  heure=Math.min(24,Math.max(0,(e.clientX-r.left)/r.width*24));
  history.replaceState(null,'',`#h=${heure.toFixed(1)}`);}
lume.addEventListener('pointerdown',e=>{lumeDrag=true;lume.setPointerCapture(e.pointerId);lumeSet(e);e.stopPropagation()});
lume.addEventListener('pointermove',e=>{if(lumeDrag)lumeSet(e)});
lume.addEventListener('pointerup',()=>lumeDrag=false);

/* ---------- études：天气 ---------- */
document.getElementById('etudes').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const m=b.dataset.m;
  if(m==='__regen'){regen(true);return}
  if(m==='__save'){download();return}
  mode=m;
  document.querySelectorAll('.etudes button[data-m]').forEach(x=>{
    if(!x.dataset.m.startsWith('__'))x.classList.toggle('on',x.dataset.m===m)});
});
function regen(newSeed){
  if(newSeed){seed=Math.floor(Math.random()*1e9);noise=makeNoise(seed);metaFromSeed();}
  computeGrid(tDrift);findPeaks();
  document.getElementById('stats').textContent=
    "Canvas 2D · marching squares · fBM-4 · SURVEY №"+surveyNo;
}
function download(){
  const a=document.createElement('a');
  a.download="topo-drift-"+surveyNo+".png";
  a.href=cv.toDataURL("image/png");a.click();
}

/* ---------- 高程读数 ---------- */
function toMeters(h){return Math.round(h*3600)}
stage.addEventListener('pointermove',e=>{
  const r=stage.getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top;
  const gx=(x-mapR.x)/mapR.w*GW, gy=(y-mapR.y)/mapR.h*GH;
  const el=document.getElementById('readout');
  if(gx<0||gy<0||gx>GW||gy>GH){el.textContent="ELEV ---- M · --°--′N ---°--′E";return}
  const i=Math.min(GW-1,Math.floor(gx)), j=Math.min(GH-1,Math.floor(gy));
  const fx=gx-i, fy=gy-j;
  const h00=grid[j*(GW+1)+i], h10=grid[j*(GW+1)+i+1], h01=grid[(j+1)*(GW+1)+i], h11=grid[(j+1)*(GW+1)+i+1];
  const hv=h00*(1-fx)*(1-fy)+h10*fx*(1-fy)+h01*(1-fx)*fy+h11*fx*fy;
  const m=toMeters(hv);
  const lat=baseLat+gy/GH*8, lon=baseLon+gx/GW*12;
  const laD=Math.floor(lat), laM=Math.floor((lat-laD)*60);
  const loD=Math.floor(lon), loM=Math.floor((lon-loD)*60);
  el.textContent=(hv<SEA?"DEPTH ":"ELEV ")+("    "+m).slice(-4)+" M · "+laD+"°"+("0"+laM).slice(-2)+"′N "+loD+"°"+("0"+loM).slice(-2)+"′E";
});

/* ---------- 隐藏题记（落款连点 3 次） ---------- */
let sigClicks=0,sigTimer=null;
document.getElementById('sig').addEventListener('click',()=>{
  sigClicks++;clearTimeout(sigTimer);sigTimer=setTimeout(()=>sigClicks=0,900);
  if(sigClicks>=3){sigClicks=0;const n=document.getElementById('note');
    n.classList.add('show');setTimeout(()=>n.classList.remove('show'),5200);}
});

/* ---------- H 键收起 / R 再生 / 1-3 天气 ---------- */
addEventListener('keydown',e=>{
  if(e.key==='h'||e.key==='H')stage.classList.toggle('hideme');
  if(e.key==='r'||e.key==='R')regen(true);
  const map={'1':'clair','2':'brume','3':'vent'};
  if(map[e.key]){mode=map[e.key];
    document.querySelectorAll('.etudes button[data-m]').forEach(x=>{
      if(!x.dataset.m.startsWith('__'))x.classList.toggle('on',x.dataset.m===mode)});}
});

/* ---------- resize ---------- */
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=stage.clientWidth;H=stage.clientHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  const m=Math.max(26,W*.04);
  mapR={x:m+10,y:m+10,w:W-m*2-20,h:H-m*2-20};
  makePaper();
}
addEventListener('resize',resize);

/* ---------- 主循环 ---------- */
let t=0;
function frame(){
  t+=.016;
  // 地形漂移（风模式更快）
  tDrift+=mode==='vent'?.004:.0016;
  computeGrid(tDrift);findPeaks();
  // 指针阻尼 + 停留吹雾
  if(ptx>-100){
    px+=(ptx-px)*.1;py+=(pty-py)*.1;
    if(performance.now()-lastMove<3000)dwell=Math.min(1,dwell+.004);
    else dwell=Math.max(0,dwell-.01);
  }
  const L=lightAt(heure);
  const fogBase=mode==='brume'?Math.max(.75,fogAt(heure)):mode==='vent'?fogAt(heure)*.5:fogAt(heure);

  ctx.fillStyle=`rgb(${PAL.mist})`;ctx.fillRect(0,0,W,H);

  // 晕渲
  const cw=mapR.w/GW, ch=mapR.h/GH;
  for(let j=0;j<GH;j++){
    for(let i=0;i<GW;i++){
      const v=(grid[j*(GW+1)+i]+grid[j*(GW+1)+i+1]+grid[(j+1)*(GW+1)+i]+grid[(j+1)*(GW+1)+i+1])/4;
      if(v<SEA){ctx.fillStyle=`rgb(${SEA_C})`}
      else{
        const t2=Math.min(.999,(v-SEA)/(1-SEA));
        ctx.fillStyle=`rgb(${LAND[Math.floor(t2*24)]})`;
      }
      ctx.fillRect(mapR.x+i*cw,mapR.y+j*ch,cw+.6,ch+.6);
    }
  }
  // 碎色罩层：让色块有笔触（hatch）
  ctx.lineCap='round';
  const hr=mulberry32(5000+((t*2)|0));
  for(let k=0;k<700;k++){
    const i=(hr()*GW)|0, j=(hr()*GH)|0;
    const v=grid[j*(GW+1)+i];
    const x=mapR.x+i*cw+cw*.5, y=mapR.y+j*ch+ch*.5;
    const c=v<SEA?SEA_C:LAND[Math.min(23,Math.floor((v-SEA)/(1-SEA)*24))];
    const dk=hr()<.5;
    ctx.strokeStyle=`rgba(${Math.max(0,c[0]-14)},${Math.max(0,c[1]-14)},${Math.max(0,c[2]-12)},${(.10+hr()*.1).toFixed(2)})`;
    ctx.lineWidth=.8+hr();
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+3+hr()*6,y-1-hr()*2);ctx.stroke();
  }
  // 等高线
  const dh=.06;
  ctx.lineCap='round';
  let k=0;
  for(let level=SEA-dh;level>0.06;level-=dh){
    contourPath(ctx,level);
    ctx.strokeStyle=`rgba(${BATHY},.5)`;ctx.lineWidth=.7;ctx.stroke();
  }
  for(let level=SEA;level<0.98;level+=dh,k++){
    const isIndex=(k%5===4);
    contourPath(ctx,level);
    ctx.strokeStyle=isIndex?`rgba(${PAL.shade},.9)`:`rgba(${PAL.shade},.55)`;
    ctx.lineWidth=isIndex?1.5:.7;
    ctx.stroke();
  }
  contourPath(ctx,SEA);
  ctx.strokeStyle=`rgba(${PAL.shade},.9)`;ctx.lineWidth=1.3;ctx.stroke();

  // 雾：低地积雾，随 heure 浓淡（wow：拖时间轴看雾散山现）
  const fr=mulberry32(9000+((t*3)|0));
  const liftR=(40+dwell*90); // hover 吹散半径
  for(let k2=0;k2<2800;k2++){
    const i=(fr()*GW)|0, j=(fr()*GH)|0;
    const v=grid[j*(GW+1)+i];
    if(v>SEA+.3)continue; // 雾只积在低地与海面
    const depth=Math.max(0,1-(v-SEA)/.3);
    const drift=noise(i*.06+t*.35,j*.06,3.3);
    const dens=Math.min(1,depth*.7+ (v<SEA?.35:0))*fogBase*(0.5+drift*.9);
    if(dens<.12)continue;
    const x=mapR.x+i*cw+fr()*cw, y=mapR.y+j*ch+fr()*ch;
    // hover 拨雾 / 点击阵风
    let hole=0;
    if(px>-100){
      const d=Math.hypot(x-px,y-py);
      if(d<liftR)hole=Math.max(hole,(1-d/liftR)*.9);
    }
    for(const gs of gusts){
      const d=Math.hypot(x-gs.x,y-gs.y);
      if(Math.abs(d-gs.r)<40)hole=Math.max(hole,gs.a);
    }
    const a=Math.max(0,dens-hole)*(.45+fr()*.35);
    if(a<.03)continue;
    ctx.strokeStyle=`rgba(${PAL.mist[0]},${PAL.mist[1]},${PAL.mist[2]},${Math.min(.85,a).toFixed(2)})`;
    ctx.lineWidth=2.5+fr()*4;
    const len=10+fr()*26;
    ctx.beginPath();ctx.moveTo(x-len/2,y);ctx.lineTo(x+len/2,y+(fr()-.5)*3);ctx.stroke();
  }

  // 峰标
  ctx.font="700 11px 'SF Mono',Menlo,monospace";
  ctx.textAlign="left";
  for(const p of peaks){
    const x=mapR.x+p.i*cw, y=mapR.y+p.j*ch;
    ctx.fillStyle=`rgba(${PAL.shade},.9)`;
    ctx.beginPath();ctx.moveTo(x,y-7);ctx.lineTo(x-6,y+4);ctx.lineTo(x+6,y+4);ctx.closePath();ctx.fill();
    const label=toMeters(p.h)+"m";
    const tw=ctx.measureText(label).width;
    ctx.fillStyle="rgba(232,230,223,.85)";
    ctx.fillRect(x+9,y-9,tw+6,14);
    ctx.strokeStyle=`rgba(${PAL.shade},.6)`;ctx.lineWidth=.6;
    ctx.strokeRect(x+9,y-9,tw+6,14);
    ctx.fillStyle=`rgba(${PAL.shade},.9)`;
    ctx.fillText(label,x+12,y+2);
  }

  // 图廓：经纬刻度 + 图签 + 指北针（Brume 色系）
  ctx.strokeStyle=`rgba(${PAL.shade},.8)`;ctx.lineWidth=1.2;
  ctx.strokeRect(mapR.x,mapR.y,mapR.w,mapR.h);
  ctx.lineWidth=.5;
  ctx.strokeRect(mapR.x-4,mapR.y-4,mapR.w+8,mapR.h+8);
  ctx.fillStyle=`rgba(${PAL.shade},.9)`;
  ctx.font="400 9px 'SF Mono',Menlo,monospace";ctx.textAlign="center";
  for(let i=1;i<6;i++){
    const x=mapR.x+mapR.w*i/6;
    ctx.beginPath();ctx.moveTo(x,mapR.y);ctx.lineTo(x,mapR.y+5);ctx.moveTo(x,mapR.y+mapR.h-5);ctx.lineTo(x,mapR.y+mapR.h);ctx.stroke();
    ctx.fillText((baseLon+i*2)+"°E",x,mapR.y-8);
  }
  // 图签
  ctx.textAlign="left";
  ctx.fillStyle="rgba(232,230,223,.92)";
  ctx.fillRect(mapR.x+12,mapR.y+12,212,54);
  ctx.strokeStyle=`rgba(${PAL.shade},.7)`;ctx.lineWidth=.8;
  ctx.strokeRect(mapR.x+12,mapR.y+12,212,54);
  ctx.fillStyle=`rgba(${PAL.shade},.95)`;
  ctx.font="700 12px 'SF Mono',Menlo,monospace";
  ctx.fillText("TOPO DRIFT · 晨雾",mapR.x+22,mapR.y+31);
  ctx.font="400 9.5px 'SF Mono',Menlo,monospace";
  ctx.fillText("SURVEY №"+surveyNo+" · 1:250000",mapR.x+22,mapR.y+46);
  ctx.fillText("BRUME MATINALE · fBM-4",mapR.x+22,mapR.y+58);

  // 光：全局色温 + 暮光暖带（晨雾家族低对比，弱化处理）
  ctx.globalCompositeOperation='multiply';
  ctx.fillStyle=`rgba(${L.tint[0]|0},${L.tint[1]|0},${L.tint[2]|0},${(L.tintA*.55).toFixed(3)})`;
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='overlay';
  if(L.warmA>.03){
    const sunX=W*(heure<12?.24:.78),sunY=H*.16;
    const g=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,Math.max(W,H)*.7);
    g.addColorStop(0,`rgba(${L.warm[0]|0},${L.warm[1]|0},${L.warm[2]|0},${(L.warmA*1.3).toFixed(3)})`);
    g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
  ctx.globalCompositeOperation='source-over';
  const dark=(1-L.light)*.24;
  if(dark>.02){ctx.fillStyle=`rgba(74,82,96,${dark.toFixed(3)})`;ctx.fillRect(0,0,W,H)}

  // 纸纹 + 颗粒
  ctx.globalCompositeOperation='multiply';ctx.globalAlpha=.85;
  ctx.drawImage(paperC,0,0,W,H);
  ctx.globalCompositeOperation='overlay';ctx.globalAlpha=.05;
  ctx.drawImage(grainC,0,0,W,H);
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';

  for(const gs of gusts){gs.r+=4;gs.a*=.92}
  gusts=gusts.filter(g=>g.a>.04);

  thumb.style.left=(heure/24*100)+'%';
  const hh=Math.floor(heure),mm=Math.floor((heure-hh)*60);
  heureOut.textContent=`H ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;

  requestAnimationFrame(frame);
}
metaFromSeed();computeGrid(tDrift);findPeaks();
resize();regen(false);
requestAnimationFrame(frame);
})();
</script>
