<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MARBLE LAB — 墨流研所</title>
<style>
  :root{
    --paper:#f2ecdd; --panel:#ece4d0; --line:#d3c8a8;
    --ink:#20211f; --dim:#8d8468;
    --indigo:#1e3a5c; --shu:#b73e2c; --gold:#b98a2f;
    --mono:"SF Mono",Menlo,Consolas,monospace;
    --serif:Didot,"Bodoni MT",Georgia,"Songti SC",serif;
    --sans:-apple-system,"Helvetica Neue","PingFang SC",sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  ::selection{background:var(--indigo);color:#fff}

  header{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:22px 28px 0;gap:16px;flex-wrap:wrap;
  }
  .sig{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .sig h1{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:.04em}
  .sig h1 em{font-style:italic;color:var(--indigo)}
  .sig .no{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.14em}
  .sig .no b{color:var(--shu);font-weight:400}
  header p.tag{font-size:12px;color:var(--dim);letter-spacing:.06em;max-width:400px;text-align:right;line-height:1.7}
  .rule{margin:14px 28px 0;border-top:1px solid var(--ink);position:relative}
  .rule::after{content:"";position:absolute;left:0;top:2px;width:100%;border-top:1px solid var(--line)}

  main{
    display:grid;grid-template-columns:284px minmax(0,1fr);gap:24px;
    padding:24px 28px 40px;max-width:1440px;margin:0 auto;
  }
  @media (max-width:960px){main{grid-template-columns:1fr}}

  .dock{
    background:var(--panel);border:1px solid var(--ink);
    padding:20px;display:flex;flex-direction:column;gap:18px;
    align-self:start;position:sticky;top:20px;
  }
  @media (max-width:960px){.dock{position:static}}
  .dock h2{
    font-family:var(--mono);font-size:11px;font-weight:400;color:var(--dim);
    letter-spacing:.22em;text-transform:uppercase;
    border-bottom:1px solid var(--line);padding-bottom:12px;
    display:flex;justify-content:space-between;
  }
  .dock h2 span{color:var(--shu)}
  .ctl{display:flex;flex-direction:column;gap:8px}
  .ctl label{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:12px;letter-spacing:.04em;
  }
  .ctl label output{font-family:var(--mono);font-size:11px;color:var(--indigo)}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--ink)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:13px;height:13px;margin-top:-6px;
    background:var(--paper);border:1px solid var(--ink);border-radius:50%;
    box-shadow:2px 2px 0 var(--shu);transition:transform .15s var(--ease);
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.25)}
  input[type=range]::-moz-range-track{height:1px;background:var(--ink)}
  input[type=range]::-moz-range-thumb{
    width:13px;height:13px;background:var(--paper);border:1px solid var(--ink);
    border-radius:50%;box-shadow:2px 2px 0 var(--shu);
  }

  .inks{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
  .inks button{
    appearance:none;height:36px;border:1px solid var(--ink);cursor:pointer;
    position:relative;transition:transform .15s var(--ease);
    display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px;
  }
  .inks button:hover{transform:translateY(-2px)}
  .inks button span{
    font-size:10px;letter-spacing:.05em;line-height:1;
    background:rgba(242,236,221,.85);padding:1px 3px;border:1px solid rgba(32,33,31,.35);
  }
  .inks button.on::after{
    content:"";position:absolute;inset:3px;border:1px solid var(--paper);
    outline:1px solid var(--ink);pointer-events:none;
  }

  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:16px;border-top:1px solid var(--line)}
  .btn{
    appearance:none;border:1px solid var(--ink);background:transparent;color:var(--ink);
    padding:11px 8px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;
    cursor:pointer;text-transform:uppercase;position:relative;overflow:hidden;
    transition:color .18s var(--ease);
  }
  .btn::before{
    content:"";position:absolute;inset:0;background:var(--ink);
    transform:translateY(101%);transition:transform .22s var(--ease);z-index:0;
  }
  .btn:hover::before{transform:translateY(0)}
  .btn:hover{color:var(--paper)}
  .btn span{position:relative;z-index:1}
  .btn.prime{background:var(--indigo);border-color:var(--indigo);color:#fff}
  .btn.prime::before{background:var(--ink)}

  .stage{
    position:relative;background:#f6f0e2;border:1px solid var(--ink);
    box-shadow:8px 8px 0 rgba(32,33,31,.10);overflow:hidden;
  }
  .stage canvas{display:block;width:100%;height:auto;cursor:crosshair;touch-action:none}
  .vtitle{
    position:absolute;left:14px;top:16px;writing-mode:vertical-rl;
    font-family:var(--serif);font-size:20px;letter-spacing:.42em;color:var(--ink);
    pointer-events:none;opacity:.82;
  }
  .vtitle small{
    font-family:var(--mono);font-size:9px;letter-spacing:.3em;color:var(--dim);
    margin-top:10px;
  }
  .hanko{
    position:absolute;right:16px;top:16px;width:34px;height:34px;
    background:var(--shu);color:#f6f0e2;display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-size:15px;letter-spacing:0;line-height:1;
    writing-mode:vertical-rl;pointer-events:none;
    box-shadow:2px 2px 0 rgba(32,33,31,.18);
  }
  .hint{
    position:absolute;left:14px;bottom:12px;font-family:var(--mono);font-size:10px;
    letter-spacing:.14em;color:rgba(32,33,31,.5);pointer-events:none;text-transform:uppercase;
  }
  .count{
    position:absolute;right:16px;bottom:12px;font-family:var(--mono);font-size:10px;
    letter-spacing:.16em;color:rgba(32,33,31,.55);pointer-events:none;text-transform:uppercase;
  }

  footer{
    padding:0 28px 26px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
    font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;
  }
  @media (max-width:640px){
    header{padding:18px 18px 0}
    header p.tag{text-align:left;max-width:100%}
    .rule{margin:12px 18px 0}
    main{padding:18px 18px 32px}
    footer{padding:0 18px 22px}
    .vtitle{font-size:16px}
  }
</style>
</head>
<body>

<header>
  <div class="sig">
    <h1>Marble <em>Lab</em></h1>
    <span class="no">N°<b>08</b> — GEN-ART / 墨流研所 · Suminagashi</span>
  </div>
  <p class="tag">墨浮于水,一触即纹。十二世纪的水面画,在一枚画布上重新展开。</p>
</header>
<div class="rule"></div>

<main>
  <aside class="dock">
    <h2>水盘 — Water Tray <span>墨</span></h2>

    <div class="ctl">
      <label>墨 · Ink</label>
      <div class="inks" id="inks">
        <button data-ink="sumi" class="on" style="background:#20211f"><span>墨</span></button>
        <button data-ink="indigo" style="background:#1e3a5c"><span>青</span></button>
        <button data-ink="shu" style="background:#b73e2c"><span>朱</span></button>
        <button data-ink="gold" style="background:#b98a2f"><span>金</span></button>
        <button data-ink="clear" style="background:#f6f0e2"><span>皂</span></button>
      </div>
    </div>

    <div class="ctl">
      <label>墨滴半径 · Drop<output id="oDrop">34 px</output></label>
      <input type="range" id="rDrop" min="12" max="80" step="1" value="34">
    </div>
    <div class="ctl">
      <label>梳拉强度 · Pull<output id="oPull">0.60</output></label>
      <input type="range" id="rPull" min="10" max="100" step="1" value="60">
    </div>
    <div class="ctl">
      <label>水面漂移 · Drift<output id="oDrift">0.30</output></label>
      <input type="range" id="rDrift" min="0" max="100" step="1" value="30">
    </div>

    <div class="actions">
      <button class="btn" id="btnRandom"><span>随机再生</span></button>
      <button class="btn prime" id="btnSave"><span>下载 PNG</span></button>
    </div>
  </aside>

  <div class="stage" id="stage">
    <canvas id="cv" width="1200" height="900"></canvas>
    <div class="vtitle">墨流れ<small>SUMINAGASHI</small></div>
    <div class="hanko">墨流</div>
    <div class="hint">点按滴墨 · 拖曳梳流 — Drop / Comb</div>
    <div class="count" id="count">0 DROPS</div>
  </div>
</main>

<footer>
  <span>Marble Lab — 墨流研所</span>
  <span>Floating Ink · MMXXVI</span>
</footer>

<script>
(function(){
  "use strict";

  var W = 1200, H = 900;
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = W*DPR; cv.height = H*DPR;

  var INKS = {
    sumi:   "#20211f",
    indigo: "#1e3a5c",
    shu:    "#b73e2c",
    gold:   "#b98a2f",
    clear:  "#f6f0e2"
  };
  var INK_KEYS = ["sumi","indigo","shu","gold"];

  var state = {
    ink: "sumi",
    drop: 34,
    pull: 0.6,
    drift: 0.3
  };

  var discs = [];   // {pts:Float32Array(x,y interleaved), color, alpha}
  var SEG = 110;

  /* ---------- paper texture ---------- */
  var paper = document.createElement("canvas");
  paper.width = W; paper.height = H;
  (function makePaper(){
    var p = paper.getContext("2d");
    p.fillStyle = "#f6f0e2";
    p.fillRect(0,0,W,H);
    var img = p.getImageData(0,0,W,H);
    var d = img.data;
    for (var i=0;i<d.length;i+=4){
      var n = (Math.random()-0.5)*11;
      d[i]   = Math.max(0,Math.min(255, d[i]+n));
      d[i+1] = Math.max(0,Math.min(255, d[i+1]+n));
      d[i+2] = Math.max(0,Math.min(255, d[i+2]+n*0.9));
    }
    p.putImageData(img,0,0);
    /* fibers */
    p.strokeStyle = "rgba(32,33,31,.045)";
    p.lineWidth = 1;
    for (var f=0; f<130; f++){
      var x=Math.random()*W, y=Math.random()*H, a=Math.random()*6.28, l=12+Math.random()*46;
      p.beginPath();
      p.moveTo(x,y);
      p.quadraticCurveTo(x+Math.cos(a)*l*0.5, y+Math.sin(a)*l*0.5 + (Math.random()-0.5)*8,
                         x+Math.cos(a)*l, y+Math.sin(a)*l);
      p.stroke();
    }
    /* vignette */
    var g = p.createRadialGradient(W/2,H/2,H*0.36, W/2,H/2,H*0.85);
    g.addColorStop(0,"rgba(120,100,60,0)");
    g.addColorStop(1,"rgba(120,100,60,.12)");
    p.fillStyle = g;
    p.fillRect(0,0,W,H);
  })();

  /* ---------- marbling physics ---------- */
  function addDisc(cx, cy, r, color, alpha){
    var pts = new Float32Array(SEG*2);
    for (var i=0;i<SEG;i++){
      var a = i/SEG * Math.PI*2;
      pts[i*2]   = cx + Math.cos(a)*r;
      pts[i*2+1] = cy + Math.sin(a)*r;
    }
    discs.push({ pts: pts, color: color, alpha: alpha===undefined?0.94:alpha });
    if (discs.length > 140) discs.splice(0, discs.length-140);
  }

  /* classic ink-drop deformation: d' = sqrt(d^2 + r^2) radially */
  function deformDrop(cx, cy, r){
    var r2 = r*r;
    for (var k=0; k<discs.length; k++){
      var pts = discs[k].pts;
      for (var i=0;i<pts.length;i+=2){
        var dx = pts[i]-cx, dy = pts[i+1]-cy;
        var d = Math.sqrt(dx*dx+dy*dy);
        if (d < 0.001) d = 0.001;
        var nd = Math.sqrt(d*d + r2);
        var s = nd/d;
        pts[i]   = cx + dx*s;
        pts[i+1] = cy + dy*s;
      }
    }
  }

  function drop(cx, cy, r, inkKey){
    deformDrop(cx, cy, r);
    var alpha = inkKey==="clear" ? 0.97 : 0.88 + Math.random()*0.07;
    addDisc(cx, cy, r, INKS[inkKey], alpha);
    updateCount();
  }

  /* comb / stir: drag segment displaces nearby vertices */
  function stir(x0,y0,x1,y1,strength,sigma){
    var mx = x1-x0, my = y1-y0;
    var sig2 = 2*sigma*sigma;
    var len2 = mx*mx+my*my;
    for (var k=0; k<discs.length; k++){
      var pts = discs[k].pts;
      for (var i=0;i<pts.length;i+=2){
        var px = pts[i]-x0, py = pts[i+1]-y0;
        /* distance to segment */
        var t = len2>0 ? (px*mx+py*my)/len2 : 0;
        t = Math.max(0, Math.min(1, t));
        var qx = px - mx*t, qy = py - my*t;
        var d2 = qx*qx+qy*qy;
        var w = Math.exp(-d2/sig2) * strength;
        if (w > 0.002){
          pts[i]   += mx*w;
          pts[i+1] += my*w;
        }
      }
    }
  }

  /* ---------- render ---------- */
  function render(){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.drawImage(paper, 0, 0, W, H);
    for (var k=0; k<discs.length; k++){
      var disc = discs[k];
      var pts = disc.pts;
      ctx.beginPath();
      /* smooth closed curve through vertices */
      var n = pts.length/2;
      var x0 = (pts[0]+pts[(n-1)*2])/2, y0 = (pts[1]+pts[(n-1)*2+1])/2;
      ctx.moveTo(x0,y0);
      for (var i=0;i<n;i++){
        var j = (i+1)%n;
        var xc = (pts[i*2]+pts[j*2])/2, yc = (pts[i*2+1]+pts[j*2+1])/2;
        ctx.quadraticCurveTo(pts[i*2], pts[i*2+1], xc, yc);
      }
      ctx.closePath();
      ctx.globalAlpha = disc.alpha;
      ctx.fillStyle = disc.color;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- ambient drift ---------- */
  var last = performance.now();
  function frame(now){
    var dt = Math.min(0.05,(now-last)/1000); last = now;
    if (state.drift > 0.001 && discs.length){
      var t = now/1000;
      var amp = state.drift * 14 * dt;
      for (var k=0; k<discs.length; k++){
        var pts = discs[k].pts;
        for (var i=0;i<pts.length;i+=2){
          var x=pts[i], y=pts[i+1];
          pts[i]   += Math.sin(y*0.011 + t*0.6 + k)*amp;
          pts[i+1] += Math.cos(x*0.009 + t*0.5 + k*1.7)*amp;
        }
      }
    }
    render();
    requestAnimationFrame(frame);
  }

  /* ---------- pointer ---------- */
  var dragging = false, moved = false, lx=0, ly=0;
  function toLocal(e){
    var r = cv.getBoundingClientRect();
    return { x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H };
  }
  cv.addEventListener("pointerdown", function(e){
    var p = toLocal(e);
    dragging = true; moved = false;
    lx = p.x; ly = p.y;
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener("pointermove", function(e){
    if (!dragging) return;
    var p = toLocal(e);
    var dx = p.x-lx, dy = p.y-ly;
    if (Math.abs(dx)+Math.abs(dy) > 4) moved = true;
    if (moved){
      stir(lx, ly, p.x, p.y, state.pull*0.55, 46);
      lx = p.x; ly = p.y;
    }
  });
  cv.addEventListener("pointerup", function(e){
    if (!dragging) return;
    dragging = false;
    var p = toLocal(e);
    if (!moved) drop(p.x, p.y, state.drop, state.ink);
  });

  /* ---------- controls ---------- */
  document.getElementById("inks").addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    document.querySelectorAll("#inks button").forEach(function(x){x.classList.remove("on");});
    b.classList.add("on");
    state.ink = b.dataset.ink;
  });
  document.getElementById("rDrop").addEventListener("input", function(){
    state.drop = parseFloat(this.value);
    document.getElementById("oDrop").textContent = state.drop+" px";
  });
  document.getElementById("rPull").addEventListener("input", function(){
    state.pull = parseFloat(this.value)/100;
    document.getElementById("oPull").textContent = state.pull.toFixed(2);
  });
  document.getElementById("rDrift").addEventListener("input", function(){
    state.drift = parseFloat(this.value)/100;
    document.getElementById("oDrift").textContent = state.drift.toFixed(2);
  });

  function updateCount(){
    var n = discs.length;
    document.getElementById("count").textContent = n+" DROP"+(n===1?"":"S");
  }

  /* ---------- auto composition (random regenerate) ---------- */
  function compose(){
    discs = [];
    var SETS = [
      ["sumi","indigo"], ["sumi","shu"], ["indigo","gold"],
      ["sumi","indigo","gold"], ["indigo","shu"], ["sumi","gold"]
    ];
    var set = SETS[Math.floor(Math.random()*SETS.length)];
    var cx = W*(0.38+Math.random()*0.24);
    var cy = H*(0.38+Math.random()*0.24);
    /* concentric rings — thin, always alternating */
    var rings = 9 + Math.floor(Math.random()*5);
    var r = 8;
    for (var j=0;j<rings;j++){
      var ox = cx + (Math.random()-0.5)*18;
      var oy = cy + (Math.random()-0.5)*18;
      drop(ox, oy, r, set[j%set.length]);
      r += 9 + Math.random()*9;
    }
    /* combing passes — short strokes, gentle pull */
    var passes = 2 + Math.floor(Math.random()*2);
    for (var c=0;c<passes;c++){
      var horizontal = Math.random()<0.6;
      var lines = 3 + Math.floor(Math.random()*3);
      for (var l=0;l<lines;l++){
        var dir = l%2===0 ? 1 : -1;
        var len = (180+Math.random()*160)*dir;
        var st = 0.5+Math.random()*0.28;
        var sg = 30+Math.random()*26;
        if (horizontal){
          var sx = W*(0.14+Math.random()*0.6);
          var yy = H*(0.18+0.64*Math.random());
          stir(sx, yy, sx+len, yy+(Math.random()-0.5)*50, st, sg);
        } else {
          var sy = H*(0.14+Math.random()*0.6);
          var xx = W*(0.16+0.68*Math.random());
          stir(xx, sy, xx+(Math.random()-0.5)*50, sy+len, st, sg);
        }
      }
    }
    /* small accent eyes near the heart */
    var eyes = 2 + Math.floor(Math.random()*3);
    for (var e=0;e<eyes;e++){
      drop(cx+(Math.random()-0.5)*200, cy+(Math.random()-0.5)*160,
           5+Math.random()*9, set[Math.floor(Math.random()*set.length)]);
    }
    /* sometimes open a window of bare paper */
    if (Math.random()<0.35){
      drop(cx+(Math.random()-0.5)*240, cy+(Math.random()-0.5)*180,
           12+Math.random()*20, "clear");
    }
    updateCount();
  }
  document.getElementById("btnRandom").addEventListener("click", compose);

  document.getElementById("btnSave").addEventListener("click", function(){
    var a = document.createElement("a");
    a.download = "suminagashi-"+Date.now()+".png";
    a.href = cv.toDataURL("image/png");
    a.click();
  });

  /* ---------- boot ---------- */
  compose();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
