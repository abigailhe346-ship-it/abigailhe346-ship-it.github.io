<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbit Seal — 日晷印鉴局 · Atelier MIRA</title>
<style>
  :root{
    --paper:#F4E3C2; --panel:#EFDDB4; --line:#D9C493;
    --ink:#6B4A2E; --dim:#A98F66;
    --gold:#E8B96F; --amber:#D98E4A; --ochre:#A85B3C; --shadow:#5E6E7E;
    --mono:"SF Mono",Menlo,Consolas,monospace;
    --serif:Didot,"Bodoni MT",Georgia,"Songti SC",serif;
    --sans:-apple-system,"Helvetica Neue","PingFang SC",sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--paper)}
  body{color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  ::selection{background:var(--ochre);color:var(--paper)}

  header{
    display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;
    padding:20px clamp(18px,4vw,44px) 14px;
  }
  .brand{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  .back{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-decoration:none;transition:color .4s var(--ease)}
  .back:hover{color:var(--ink)}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(26px,3.4vw,40px);letter-spacing:-.01em;line-height:1}
  h1 em{font-style:italic;color:var(--ochre)}
  .epig{font-family:var(--serif);font-style:italic;font-size:14.5px;color:#8A6B45;max-width:340px;line-height:1.5}
  .idx{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}

  .stage-wrap{padding:0 clamp(18px,4vw,44px) 26px}
  .stage{
    position:relative;height:min(76vh,720px);min-height:430px;border-radius:3px;overflow:hidden;
    background:var(--paper);box-shadow:0 1px 0 var(--line),0 18px 50px -30px rgba(168,91,60,.5);
    cursor:grab;
  }
  .stage:active{cursor:grabbing}
  canvas{display:block;width:100%;height:100%}

  .etudes{position:absolute;top:14px;left:14px;display:flex;gap:8px;flex-wrap:wrap;z-index:4;transition:opacity .5s var(--ease)}
  .etudes button{
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink);
    background:rgba(244,227,194,.75);border:1px solid rgba(107,74,46,.3);border-radius:2px;
    padding:7px 12px;cursor:pointer;backdrop-filter:blur(3px);transition:all .45s var(--ease);
  }
  .etudes button:hover{background:rgba(244,227,194,.95);transform:translateY(-1px)}
  .etudes button.on{background:var(--ochre);color:var(--paper);border-color:var(--ochre)}

  .sndbtn{
    position:absolute;top:14px;right:14px;z-index:4;width:34px;height:34px;border-radius:2px;
    border:1px solid rgba(107,74,46,.3);background:rgba(244,227,194,.75);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .45s var(--ease);
  }
  .sndbtn:hover{background:rgba(244,227,194,.95)}
  .sndbtn svg{width:17px;height:17px;stroke:var(--ink);fill:none;stroke-width:1.5;stroke-linecap:round}
  .sndbtn .waves{opacity:0;transition:opacity .4s}
  .sndbtn.on .waves{opacity:1}
  .sndbtn.on .slash{opacity:0}
  .sndbtn .slash{transition:opacity .4s}

  .sig{position:absolute;left:14px;bottom:52px;z-index:4;display:flex;align-items:center;gap:9px;opacity:.68;user-select:none}
  .sig svg{width:20px;height:13px}
  .sig span{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink)}

  .note{
    position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);z-index:5;
    font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink);
    background:rgba(239,221,180,.94);border:1px solid var(--line);border-radius:2px;
    padding:12px 20px;opacity:0;pointer-events:none;transition:all .8s var(--ease);
    max-width:82%;text-align:center;
  }
  .note.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .hint{
    position:absolute;right:16px;bottom:52px;z-index:4;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--ink);opacity:.5;
    transition:opacity 1.2s var(--ease);pointer-events:none;
  }
  .hint.gone{opacity:0}

  .lume{
    position:absolute;left:0;right:0;bottom:0;z-index:4;height:40px;
    display:flex;align-items:center;gap:12px;padding:0 16px;
    background:linear-gradient(to top,rgba(244,227,194,.92),rgba(244,227,194,0));
    transition:opacity .5s var(--ease);
  }
  .lume .lab{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--dim);white-space:nowrap}
  .lume .track{position:relative;flex:1;height:22px;cursor:ew-resize;touch-action:none}
  .lume .track::before{
    content:"";position:absolute;left:0;right:0;top:50%;height:2px;transform:translateY(-50%);
    background:linear-gradient(90deg,#9AA7B8,#C9CDD6,#F4E3C2,#F4E3C2,#E8B96F,#8E7BA8,#4E4A6B);
    border-radius:1px;opacity:.65;
  }
  .lume .thumb{
    position:absolute;top:50%;width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#F4E3C2,#D98E4A);
    border:1.5px solid rgba(107,74,46,.5);transform:translate(-50%,-50%);
    box-shadow:0 2px 8px rgba(107,74,46,.3);pointer-events:none;
  }
  .lume .heure{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink);min-width:52px;text-align:right}
  .hideme .etudes,.hideme .lume,.hideme .sig,.hideme .hint{opacity:0;pointer-events:none}

  .mseal{width:36px;height:36px;flex:none;align-self:center}
  .brand{align-items:center}
  .deck{position:absolute;top:56px;right:14px;z-index:4;width:182px;padding:11px 12px 12px;background:rgba(244,227,194,.78);border:1px solid rgba(107,74,46,.3);border-radius:2px;backdrop-filter:blur(3px);display:flex;flex-direction:column;gap:9px;transition:opacity .5s var(--ease)}
  .deck .dh{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:var(--dim);display:flex;justify-content:space-between}
  .deck .dh b{color:#A85B3C;font-weight:400}
  .dctl label{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--ink)}
  .dctl output{color:#A85B3C}
  .dctl input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;background:transparent;cursor:pointer;margin-top:2px}
  .dctl input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--ink)}
  .dctl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:10px;height:10px;margin-top:-4.5px;background:var(--paper);border:1px solid var(--ink);border-radius:50%;box-shadow:1.5px 1.5px 0 #A85B3C}
  .dctl input[type=range]::-moz-range-track{height:1px;background:var(--ink)}
  .dctl input[type=range]::-moz-range-thumb{width:10px;height:10px;background:var(--paper);border:1px solid var(--ink);border-radius:50%}
  .dseg{display:grid;grid-template-columns:1fr 1fr;border:1px solid rgba(107,74,46,.45);border-radius:2px;overflow:hidden}
  .dseg button{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--ink);background:transparent;border:0;padding:6px 2px;cursor:pointer;transition:all .4s var(--ease)}
  .dseg button.on{background:#A85B3C;color:var(--paper)}
  .dbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .dbtns button{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--ink);background:rgba(244,227,194,.6);border:1px solid rgba(107,74,46,.4);border-radius:2px;padding:6px 2px;cursor:pointer;transition:all .4s var(--ease)}
  .dbtns button:hover{background:#A85B3C;color:var(--paper);border-color:#A85B3C}
  .inspector{position:absolute;z-index:5;pointer-events:none;opacity:0;transform:translate(14px,-50%);font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--ink);background:rgba(244,227,194,.92);border:1px solid rgba(107,74,46,.45);border-radius:2px;padding:5px 8px;white-space:nowrap;transition:opacity .3s var(--ease)}
  .inspector.on{opacity:1}
  .inspector b{color:#A85B3C;font-weight:400}
  .hideme .deck{opacity:0;pointer-events:none}
  @media (max-width:640px){.deck{display:none}.inspector{display:none}}
  footer{padding:0 clamp(18px,4vw,44px) 30px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
  footer p{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  @media (max-width:640px){
    .stage{height:66vh;min-height:400px}
    .epig{max-width:100%}
    .hint{display:none}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg class="mseal" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true">
      <circle cx="48" cy="48" r="45" fill="none" stroke="#A85B3C" stroke-width="1.4"/>
      <circle cx="48" cy="48" r="38.5" fill="none" stroke="#A85B3C" stroke-width=".7" opacity=".55"/>
      <path id="sealArcO" d="M48,48 m-32.5,0 a32.5,32.5 0 1,1 65,0 a32.5,32.5 0 1,1 -65,0" fill="none"/>
      <text font-family="SF Mono,Menlo,monospace" font-size="8.4" letter-spacing="1.6" fill="#A85B3C">
        <textPath xlink:href="#sealArcO" href="#sealArcO" startOffset="0" textLength="203" lengthAdjust="spacingAndGlyphs">ATELIER MIRA · ATELIER MIRA · </textPath>
      </text>
      <path d="M31 64 C30 54,31 42,34 33 C38.5 41,43 51,48 57.5 C53 51,57.5 41,62 33 C65 42,66 54,65 64"
            fill="none" stroke="#A85B3C" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M33 63 C32.5 55,33 45,35.5 37" fill="none" stroke="#A85B3C" stroke-width="1.1" stroke-linecap="round" opacity=".45"/>
    </svg>
    <a class="back" href="../../../index.html#work">← Archive</a>
    <h1>Orbit <em>Seal</em></h1>
  </div>
  <p class="epig">光线在下午四点开始变得值得原谅。</p>
  <span class="idx">ÉTUDE <b style="color:#A85B3C;font-weight:400">N°14/100</b> · 日晷印鉴局 · GEN-ART</span>
</header>

<div class="stage-wrap">
  <div class="stage" id="stage">
    <canvas id="seal"></canvas>

    <div class="etudes" id="etudes">
      <button data-h="8">晨光</button>
      <button data-h="12.5">正午</button>
      <button data-h="18">暮金</button>
    </div>

    <button class="sndbtn" id="snd" aria-label="声景开关" title="声景（默认关闭）">
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="waves" d="M16.5 8.5c1.6 1.8 1.6 5.2 0 7M19 6.5c2.6 3 2.6 8 0 11"/><path class="slash" d="M17 9l5 6M22 9l-5 6"/></svg>
    </button>

    <div class="sig" id="sig">
      <svg viewBox="0 0 64 40" fill="#A85B3C" aria-hidden="true">
        <path d="M32 20 C 26 12, 14 6, 4 8 C 12 12, 18 18, 24 21
                 C 14 20, 6 22, 2 28 C 10 26, 18 26, 25 26
                 C 27 30, 30 34, 34 36 C 33 32, 33 28, 34 25
                 C 42 22, 52 16, 62 4 C 54 10, 44 16, 36 19
                 C 35 17, 33 17, 32 20 Z"/>
      </svg>
      <span>Atelier MIRA · N°014 · Heure Dorée</span>
    </div>

    <div class="hint" id="hint">转动字环 · 按下印心，留一方印</div>
    <div class="note" id="note">十月三日，晴。暮金只有二十分钟，印鉴局全年只为这二十分钟加班。</div>

    <div class="deck" id="deck">
      <div class="dh">画室台 · STUDIO <b id="deckSeed">1003</b></div>
      <div class="dctl"><label>星芒 · Rays<output id="oRays">24</output></label><input type="range" id="rRays" min="12" max="36" step="1" value="24"></div>
      <div class="dctl"><label>字环 · Type<output id="oType">1.00×</output></label><input type="range" id="rType" min="70" max="130" value="100"></div>
      <div class="dctl"><label>影长 · Shadow<output id="oShad">1.00×</output></label><input type="range" id="rShad" min="0" max="160" value="100"></div>
      <div class="dseg" id="segSeal">
        <button data-sm="gnomon" class="on">日晷</button>
        <button data-sm="laurel">月桂</button>
      </div>
      <div class="dbtns"><button id="btnRegen">再生</button><button id="btnShare">链接</button></div>
      <div class="dbtns"><button id="btnSave" style="grid-column:1/-1">下载 PNG</button></div>
    </div>
    <div class="inspector" id="insp">—</div>

    <div class="lume">
      <span class="lab">光 · HEURE</span>
      <div class="track" id="lume"><div class="thumb" id="thumb"></div></div>
      <span class="heure" id="heureOut">—</span>
    </div>
  </div>
</div>

<footer>
  <p>影子不是黑色的，是蓝色的地方在休息</p>
  <p id="colo">Canvas 2D · engraved orbit · seed 1003 · Painted with code, plein air</p>
</footer>

<script>
(function(){
"use strict";
/* ---------- palette: Heure Dorée 金色时刻（≈3200K；阴影走蓝紫，禁黑） ---------- */
const PAL={
  paper:[244,227,194], gold:[232,185,111], amber:[217,142,74],
  ochre:[168,91,60], shadow:[94,110,126]
};
const cvs=document.getElementById('seal'),ctx=cvs.getContext('2d');
const stage=document.getElementById('stage');
let W=0,H=0,DPR=1;
let seed=1003;
const seedM=location.hash.match(/seed=([0-9A-Fa-f]{1,6})/);if(seedM)seed=parseInt(seedM[1],16);
let seed0=seed;
function seedHex(){return seed0.toString(16).toUpperCase().padStart(4,"0")}
function srand(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646}

/* ---------- heure 时间系统 ---------- */
let heure=new Date().getHours()+new Date().getMinutes()/60;
const hh=location.hash.match(/h=([\d.]+)/);if(hh)heure=parseFloat(hh[1])%24;
const KEYS=[ // h, tint, tintA, warm, warmA, light
  [0,  [78,74,107],.3,[142,123,168],.05,.16],
  [5,  [154,167,184],.2,[216,203,184],.08,.42],
  [8,  [222,205,180],.08,[244,227,194],.08,.72],
  [12, [244,233,204],.03,[250,240,214],.07,1.0],
  [16, [240,212,160],.08,[248,225,176],.12,.9],
  [18, [217,142,74],.16,[232,185,111],.24,.66],
  [19.5,[168,120,90],.22,[201,150,120],.12,.42],
  [21, [110,110,140],.26,[142,123,168],.07,.26],
  [24, [78,74,107],.3,[142,123,168],.05,.16]
];
function lightAt(h){
  h=((h%24)+24)%24;let i=0;while(i<KEYS.length-2&&KEYS[i+1][0]<h)i++;
  const a=KEYS[i],b=KEYS[i+1],t=Math.min(1,Math.max(0,(h-a[0])/(b[0]-a[0]||1)));
  const L=(x,y)=>x+(y-x)*t,mix3=(u,v)=>[L(u[0],v[0]),L(u[1],v[1]),L(u[2],v[2])];
  return {tint:mix3(a[1],b[1]),tintA:L(a[2],b[2]),warm:mix3(a[3],b[3]),warmA:L(a[4],b[4]),light:L(a[5],b[5])};
}
/* 日晷：影长与影向随 heure 自洽（晨长西指，暮长东指，夜无影） */
function sunShadow(){
  const day=(heure-6)/12; // 6h→0, 12h→.5, 18h→1
  if(day<0||day>1)return {len:0,ang:0,night:true};
  const alt=Math.sin(day*Math.PI); // 太阳高度角
  return {len:((1-alt)*1.6+.12)*studio.shadowK, ang:(day-.5)*Math.PI*.94, night:false};
}

/* ---------- 纸纹 & 颗粒 ---------- */
let paperC=null;
function makePaper(){
  seed=seed0;   /* 纸纹从种子出发,可复现 */
  paperC=document.createElement('canvas');paperC.width=Math.max(2,W*DPR/2);paperC.height=Math.max(2,H*DPR/2);
  const p=paperC.getContext('2d');p.scale(DPR/2,DPR/2);
  for(let i=0;i<4500;i++){
    p.fillStyle=`rgba(${srand()<.5?'107,74,46':'255,250,235'},${(.02+srand()*.04).toFixed(3)})`;
    p.fillRect(srand()*W,srand()*H,1+srand()*1.6,1+srand()*1.2);
  }
  p.strokeStyle='rgba(146,110,70,.06)';p.lineWidth=.6;
  for(let i=0;i<70;i++){p.beginPath();const x=srand()*W,y=srand()*H,a=srand()*Math.PI;
    p.moveTo(x,y);p.lineTo(x+Math.cos(a)*(20+srand()*70),y+Math.sin(a)*(20+srand()*70));p.stroke();}
}
let grainC=document.createElement('canvas');grainC.width=grainC.height=128;
function makeGrain(){
  const g=grainC.getContext('2d'),im=g.createImageData(128,128);
  for(let i=0;i<im.data.length;i+=4){const v=110+Math.random()*40;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=12}
  g.putImageData(im,0,0);
}
makeGrain();setInterval(makeGrain,83);

/* ---------- 印鉴几何 ---------- */
let CX=0,CY=0,R=0; // 印鉴中心（偏心：画面左下三分点）
function layout(){CX=W*.42;CY=H*.52;R=Math.min(W,H)*.30}
const studio={rays:24,typeK:1,shadowK:1};
let sealMode=(location.hash.match(/m=(\w+)/)||[])[1]||'gnomon';
let ringAng=0,ringVel=.003; // 字环：惯性旋转（L1.2）
const RING_TEXT="ATELIER MIRA · HEURE DORÉE · BUREAU DU SCEAU · ";
let press=0; // 压印动画 0..1
let stamps=[]; // 留下的印 {x,y,r,rot,dots,alpha}
function stampDots(r){
  const d=[];
  for(let k=0;k<Math.round(r*7);k++){ // 外环锯齿边
    const a=srand()*Math.PI*2,rr=r*(.86+srand()*.16);
    d.push({x:Math.cos(a)*rr,y:Math.sin(a)*rr,r:1+srand()*1.8,a:.5+srand()*.4,c:PAL.ochre});
  }
  for(let k=0;k<Math.round(r*2.4);k++){ // 内圈
    const a=srand()*Math.PI*2,rr=r*(.55+srand()*.1);
    d.push({x:Math.cos(a)*rr,y:Math.sin(a)*rr,r:.9+srand()*1.2,a:.5+srand()*.35,c:PAL.ochre});
  }
  for(let k=0;k<Math.round(r*1.1);k++){ // 星芒心
    const a=(k%8)/8*Math.PI*2,rr=srand()*r*.34;
    d.push({x:Math.cos(a)*rr*1.6,y:Math.sin(a)*rr*1.6,r:.8+srand()*1.1,a:.45+srand()*.4,c:PAL.amber});
  }
  return d;
}
function pressSeal(x,y){
  press=1;
  const r=26+Math.random()*14;
  // 找一处不妨碍主印的空位
  let sx,sy,tries=0;
  do{sx=W*(.12+Math.random()*.66);sy=H*(.14+Math.random()*.52);tries++}
  while(tries<20&&Math.hypot(sx-CX,sy-CY)<R*1.5);
  stamps.push({x:sx,y:sy,r,rot:Math.random()*9,dots:stampDots(r),born:performance.now()-4000*Math.random()-800});
  if(stamps.length>7)stamps.shift();
  document.getElementById('hint').classList.add('gone');
  if(sound.on)sound.thump();
}

/* ---------- 指针：转环 + 压印 ---------- */
let dragging=false,lastA=0;
function ptrA(e){const r=stage.getBoundingClientRect();
  return Math.atan2(e.clientY-r.top-CY,e.clientX-r.left-CX)}
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('button')||e.target.closest('.lume')||e.target.closest('.sig'))return;
  const r=stage.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  const d=Math.hypot(x-CX,y-CY);
  if(d<R*.42)pressSeal(x,y); // 印心：压印
  else{dragging=true;lastA=ptrA(e)}
});
stage.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const a=ptrA(e);let da=a-lastA;
  if(da>Math.PI)da-=Math.PI*2;if(da<-Math.PI)da+=Math.PI*2;
  ringAng+=da;ringVel=ringVel*.6+da*.4;lastA=a;
});
addEventListener('pointerup',()=>dragging=false);

/* ---------- 声景（L5）：风 + 暮金钢琴音簇 + 压印闷响 ---------- */
const sound={on:false,ctx:null,master:null,
  init(){if(this.ctx)return;
    const C=this.ctx=new (window.AudioContext||window.webkitAudioContext)();
    const M=this.master=C.createGain();M.gain.value=0;M.connect(C.destination);
    const len=2*C.sampleRate,buf=C.createBuffer(1,len,C.sampleRate),d=buf.getChannelData(0);
    let l=0;for(let i=0;i<len;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3}
    const src=C.createBufferSource();src.buffer=buf;src.loop=true;
    const bp=C.createBiquadFilter();bp.type='bandpass';bp.frequency.value=500;bp.Q.value=.9;
    const g=C.createGain();g.gain.value=.1;src.connect(bp);bp.connect(g);g.connect(M);src.start();
  },
  cluster(){const C=this.ctx;if(!C)return;const t0=C.currentTime;
    // 宫调五声：C D E G A
    const scale=[261.6,293.7,329.6,392,440];
    const n=2+Math.round(Math.random());
    for(let k=0;k<n;k++){
      const f=scale[(Math.random()*scale.length)|0]*(Math.random()<.3?2:1);
      const t=t0+k*.14;
      const o=C.createOscillator(),o2=C.createOscillator(),g=C.createGain();
      o.frequency.value=f;o2.frequency.value=f*1.004;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+.03);
      g.gain.exponentialRampToValueAtTime(.0001,t+4+Math.random()*2);
      o.connect(g);o2.connect(g);g.connect(this.master);
      o.start(t);o2.start(t);o.stop(t+6.5);o2.stop(t+6.5);
    }
  },
  thump(){const C=this.ctx;if(!C)return;const t=C.currentTime;
    const o=C.createOscillator(),g=C.createGain();
    o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(60,t+.08);
    g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.0001,t+.12);
    o.connect(g);g.connect(this.master);o.start(t);o.stop(t+.14)},
  toggle(){this.on=!this.on;
    if(this.on){this.init();this.ctx.resume();const t=this.ctx.currentTime;
      this.master.gain.cancelScheduledValues(t);this.master.gain.setValueAtTime(0,t);
      this.master.gain.linearRampToValueAtTime(1,t+1.5);}
    else if(this.ctx){const t=this.ctx.currentTime;
      this.master.gain.cancelScheduledValues(t);this.master.gain.linearRampToValueAtTime(0,t+.6);}
    localStorage.setItem('mira-sound',this.on?'1':'0');
    document.getElementById('snd').classList.toggle('on',this.on);}
};
document.getElementById('snd').addEventListener('click',e=>{e.stopPropagation();sound.toggle()});

/* ---------- 检视签 inspector:悬停读数 ---------- */
const insp=document.getElementById('insp');
let inX=-999,inY=-999;
stage.addEventListener('pointermove',e=>{
  const r=stage.getBoundingClientRect();inX=e.clientX-r.left;inY=e.clientY-r.top;
});
stage.addEventListener('pointerleave',()=>{inX=-999;inY=-999;insp.classList.remove('on')});
function updateInspector(){
  const d=Math.hypot(inX-CX,inY-CY);
  if(inX<-100||d>R*1.35){insp.classList.remove('on');return}
  const sh2=sunShadow();
  insp.classList.add('on');
  insp.style.left=inX+"px";insp.style.top=inY+"px";
  const deg=((ringAng*180/Math.PI)%360+360)%360;
  const h3=Math.floor(heure),m3=Math.floor((heure-h3)*60);
  insp.innerHTML="环角 <b>"+deg.toFixed(1)+"°</b> · 影长 <b>"+(sh2.night?"无夜":sh2.len.toFixed(2))+"</b> · H "+
    String(h3).padStart(2,"0")+":"+String(m3).padStart(2,"0");
}

/* ---------- resize ---------- */
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=stage.clientWidth;H=stage.clientHeight;
  cvs.width=W*DPR;cvs.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  layout();makePaper();
}
addEventListener('resize',resize);resize();
pressSeal(CX,CY);pressSeal(CX,CY); // 案头已有两方旧印

syncHash();

/* ---------- 碎色刀法：雕版弧笔触 ---------- */
function engArc(cx,cy,r,a0,a1,col,alpha,n,jitR){
  for(let i=0;i<n;i++){
    const a=a0+(a1-a0)*i/n,rr=r+(Math.random()-.5)*jitR;
    const j=(Math.random()-.5)*14;
    ctx.strokeStyle=`rgba(${col[0]+j|0},${col[1]+j|0},${col[2]+j|0},${(alpha*(0.75+Math.random()*.25)).toFixed(2)})`;
    ctx.lineWidth=1.1+Math.random()*1.2;
    const da=(a1-a0)/n*(0.5+Math.random()*.8);
    ctx.beginPath();ctx.arc(cx,cy,rr,a,a+da);ctx.stroke();
  }
}

/* ---------- 主循环 ---------- */
let t=0,goldRung=false;
function frame(){
  t+=.008;
  if(!dragging){ringAng+=ringVel;ringVel*=.965;if(Math.abs(ringVel)<.003)ringVel+= (0.003-ringVel)*.01}
  press*=.9;
  const L=lightAt(heure),sh=sunShadow();

  // 暮金到达：钢琴音簇（一次）
  const isGold=heure>=17&&heure<=19.2;
  if(isGold&&!goldRung){goldRung=true;if(sound.on)sound.cluster()}
  if(!isGold)goldRung=false;

  ctx.fillStyle=`rgb(${PAL.paper})`;ctx.fillRect(0,0,W,H);

  const pressK=1-press*.06;

  // --- 主印的长影（蓝色地方在休息；晨影西指，暮影东指） ---
  if(!sh.night){
    const day=(heure-6)/12;
    const sx=-Math.cos(day*Math.PI)*sh.len*R*.9;
    const sy=Math.sin(day*Math.PI)*sh.len*R*.34+R*.12;
    ctx.save();ctx.translate(CX+sx,CY+sy);ctx.scale(1+sh.len*.5,.34+sh.len*.1);
    const sg=ctx.createRadialGradient(0,0,0,0,0,R*1.05);
    sg.addColorStop(0,`rgba(${PAL.shadow},.30)`);sg.addColorStop(1,`rgba(${PAL.shadow},0)`);
    ctx.fillStyle=sg;ctx.beginPath();ctx.arc(0,0,R*1.05,0,7);ctx.fill();ctx.restore();
  }

  // --- 留下的印（印泥碎色，越旧越淡） ---
  for(const st of stamps){
    const age=(performance.now()-st.born)/1000;
    const fade=Math.min(1,age/ .8)*(0.92-stamps.indexOf(st)*0.07);
    ctx.save();ctx.translate(st.x,st.y);ctx.rotate(st.rot);
    for(const d of st.dots){
      ctx.fillStyle=`rgba(${d.c[0]|0},${d.c[1]|0},${d.c[2]|0},${(d.a*fade).toFixed(2)})`;
      ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,7);ctx.fill();
    }
    ctx.restore();
  }

  ctx.save();ctx.translate(CX,CY);ctx.scale(pressK,pressK);

  // --- 外环：雕版双圈 ---
  engArc(0,0,R,0,Math.PI*2,PAL.amber,.8,140,3);
  engArc(0,0,R*.92,0,Math.PI*2,PAL.gold,.7,120,2.4);

  // --- 字环（自转 + 可拖拽惯性） ---
  ctx.save();ctx.rotate(ringAng);
  ctx.font=`${Math.round(R*.085*studio.typeK)}px Didot,'Bodoni MT',Georgia,serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  const rr=R*.82,step=Math.PI*2/RING_TEXT.length;
  for(let i=0;i<RING_TEXT.length;i++){
    ctx.save();ctx.rotate(i*step);ctx.translate(0,-rr);
    const j=(Math.random()-.5)*12;
    ctx.fillStyle=`rgba(${PAL.ochre[0]+j|0},${PAL.ochre[1]+j|0},${PAL.ochre[2]+j|0},.88)`;
    ctx.fillText(RING_TEXT[i],0,0);ctx.restore();
  }
  ctx.restore();

  // --- 星芒：放射雕版笔触（日晷）/ 月桂环（构成模式） ---
  const rays=studio.rays;
  if(sealMode==='gnomon'){
    for(let i=0;i<rays;i++){
      const a=i/rays*Math.PI*2+ringAng*.3;
      const r0=R*.3,r1=R*(.56+((i*7)%5)*.02);
      const n=7;
      for(let k=0;k<n;k++){
        const u=k/n,rx=r0+(r1-r0)*u;
        const j=(Math.random()-.5)*16;
        const col=i%2?PAL.amber:PAL.gold;
        ctx.strokeStyle=`rgba(${col[0]+j|0},${col[1]+j|0},${col[2]+j|0},${(.5+Math.random()*.35).toFixed(2)})`;
        ctx.lineWidth=1+Math.random()*.9;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*rx,Math.sin(a)*rx);
        ctx.lineTo(Math.cos(a)*(rx+(r1-r0)/n*.7),Math.sin(a)*(rx+(r1-r0)/n*.7));
        ctx.stroke();
      }
    }
  }else{
    /* 月桂:两圈叶弧,叶间点莓,随字环微微回转 */
    for(let ring=0;ring<2;ring++){
      const rl=R*(.38+ring*.14),leaves=rays+ring*4;
      for(let i=0;i<leaves;i++){
        const a=i/leaves*Math.PI*2+ringAng*.3+ring*.17;
        const lx=Math.cos(a)*rl,ly=Math.sin(a)*rl;
        const la=a+Math.PI/2+(i%2?0.42:-0.42);
        const j=(Math.random()-.5)*14;
        const col=i%3===2?PAL.amber:PAL.gold;
        ctx.strokeStyle=`rgba(${col[0]+j|0},${col[1]+j|0},${col[2]+j|0},${(.68+Math.random()*.28).toFixed(2)})`;
        ctx.lineWidth=1.3+Math.random()*1.1;ctx.lineCap='round';
        const ll=R*.075;
        ctx.beginPath();
        ctx.moveTo(lx,ly);
        ctx.quadraticCurveTo(lx+Math.cos(la)*ll*.6-Math.cos(a)*ll*.22,
                             ly+Math.sin(la)*ll*.6-Math.sin(a)*ll*.22,
                             lx+Math.cos(la)*ll,ly+Math.sin(la)*ll);
        ctx.stroke();
        if(i%4===0){
          ctx.fillStyle=`rgba(${PAL.ochre[0]|0},${PAL.ochre[1]|0},${PAL.ochre[2]|0},.6)`;
          ctx.beginPath();ctx.arc(Math.cos(a)*(rl+R*.045),Math.sin(a)*(rl+R*.045),1.6,0,7);ctx.fill();
        }
      }
    }
  }
  engArc(0,0,R*.3,0,Math.PI*2,PAL.amber,.75,70,2);

  // --- 内盘：碎色蜜光 ---
  for(let k=0;k<260;k++){
    const a=Math.random()*Math.PI*2,rr=Math.sqrt(Math.random())*R*.26;
    const c=Math.random()<.6?PAL.gold:PAL.paper;
    const j=(Math.random()-.5)*12;
    ctx.fillStyle=`rgba(${c[0]+j|0},${c[1]+j|0},${c[2]+j|0},.55)`;
    ctx.beginPath();ctx.arc(Math.cos(a)*rr,Math.sin(a)*rr,1.2+Math.random()*1.8,0,7);ctx.fill();
  }

  // --- 日晷针（gnomon）与针影 ---
  if(!sh.night){
    const day=(heure-6)/12;
    const gx=-Math.cos(day*Math.PI)*sh.len*R*.5;
    const gy=Math.sin(day*Math.PI)*sh.len*R*.2+R*.04;
    ctx.strokeStyle=`rgba(${PAL.shadow},.55)`;ctx.lineWidth=3.4;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(gx,gy);ctx.stroke();
  }
  ctx.fillStyle=`rgb(${PAL.ochre})`;
  ctx.beginPath();ctx.moveTo(0,-R*.1);ctx.lineTo(R*.035,R*.03);ctx.lineTo(-R*.035,R*.03);ctx.closePath();ctx.fill();
  // 压印环（按下时的圆波）
  if(press>.05){
    ctx.strokeStyle=`rgba(${PAL.ochre},${(press*.6).toFixed(2)})`;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,R*(1.06+(1-press)*.14),0,7);ctx.stroke();
  }
  ctx.restore();

  // --- 光：色温 + 暮金光斑 + 有色的暗 ---
  ctx.globalCompositeOperation='multiply';
  ctx.fillStyle=`rgba(${L.tint[0]|0},${L.tint[1]|0},${L.tint[2]|0},${(L.tintA*.5).toFixed(3)})`;
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='overlay';
  if(L.warmA>.03){
    const g=ctx.createRadialGradient(W*.3,H*.18,0,W*.3,H*.18,Math.max(W,H)*.75);
    g.addColorStop(0,`rgba(${L.warm[0]|0},${L.warm[1]|0},${L.warm[2]|0},${(L.warmA+.1).toFixed(3)})`);
    g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
  ctx.globalCompositeOperation='source-over';
  const dark=(1-L.light)*.24;
  if(dark>.02){ctx.fillStyle=`rgba(80,62,60,${dark.toFixed(3)})`;ctx.fillRect(0,0,W,H)}

  // 纸纹 + 颗粒
  ctx.globalCompositeOperation='multiply';ctx.globalAlpha=.88;
  ctx.drawImage(paperC,0,0,W,H);
  ctx.globalCompositeOperation='overlay';ctx.globalAlpha=.05;
  ctx.drawImage(grainC,0,0,W,H);
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';

  updateInspector();
  thumb.style.left=(heure/24*100)+'%';
  const h2=Math.floor(heure),m2=Math.floor((heure-h2)*60);
  heureOut.textContent=`H ${String(h2).padStart(2,'0')}:${String(m2).padStart(2,'0')}`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
