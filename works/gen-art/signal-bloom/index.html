<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal Bloom — 薰衣草田的波形花 · Atelier MIRA</title>
<style>
  :root{
    /* 家族⑤ 薰衣草 Lavande —— 黄昏前一小时，灰调紫，禁止荧光 */
    --wall:#E8E0D0; --far:#D9C7E0; --field:#B9A8C9; --mid:#8E7BA8; --deep:#6B5B85; --dusk:#4E4A6B;
    --paper:#E6DFD2; --panel:#ECE7DB; --line:#CFC6BB;
    --ink:#453F56; --dim:#948C9E;
    --mono:"SF Mono",Menlo,Consolas,monospace;
    --serif:Didot,"Bodoni MT",Georgia,"Songti SC",serif;
    --sans:-apple-system,"Helvetica Neue","PingFang SC",sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--paper)}
  body{color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  ::selection{background:var(--mid);color:var(--wall)}

  header{
    display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;
    padding:20px clamp(18px,4vw,44px) 14px;
  }
  .brand{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  .back{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-decoration:none;transition:color .4s var(--ease)}
  .back:hover{color:var(--ink)}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(26px,3.4vw,40px);letter-spacing:-.01em;line-height:1}
  h1 em{font-style:italic;color:var(--deep)}
  .epig{font-family:var(--serif);font-style:italic;font-size:14.5px;color:#7D7488;max-width:340px;line-height:1.5}
  .idx{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}

  .stage-wrap{padding:0 clamp(18px,4vw,44px) 26px}
  .stage{
    position:relative;height:min(76vh,720px);min-height:430px;border-radius:3px;overflow:hidden;
    background:var(--field);box-shadow:0 1px 0 var(--line),0 18px 50px -30px rgba(78,74,107,.55);
    cursor:crosshair;
  }
  canvas{display:block;width:100%;height:100%}

  .etudes{position:absolute;top:14px;left:14px;right:64px;display:flex;gap:8px;flex-wrap:wrap;z-index:4;transition:opacity .5s var(--ease)}
  .etudes button{
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink);
    background:rgba(232,224,208,.72);border:1px solid rgba(69,63,86,.28);border-radius:2px;
    padding:7px 12px;cursor:pointer;backdrop-filter:blur(3px);
    transition:all .45s var(--ease);display:flex;align-items:center;gap:6px;
  }
  .etudes button:hover{background:rgba(232,224,208,.95);transform:translateY(-1px)}
  .etudes button.on{background:var(--dusk);color:var(--wall);border-color:var(--dusk)}
  .etudes button.on svg{stroke:var(--wall)}
  .etudes svg{width:22px;height:11px;stroke:var(--ink);fill:none;stroke-width:1.4}

  .sndbtn{
    position:absolute;top:14px;right:14px;z-index:4;width:34px;height:34px;border-radius:2px;
    border:1px solid rgba(69,63,86,.28);background:rgba(232,224,208,.72);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .45s var(--ease);
  }
  .sndbtn:hover{background:rgba(232,224,208,.95)}
  .sndbtn svg{width:17px;height:17px;stroke:var(--ink);fill:none;stroke-width:1.5;stroke-linecap:round}
  .sndbtn .waves{opacity:0;transition:opacity .4s}
  .sndbtn.on .waves{opacity:1}
  .sndbtn.on .slash{opacity:0}
  .sndbtn .slash{transition:opacity .4s}

  .sig{
    position:absolute;left:14px;bottom:52px;z-index:4;display:flex;align-items:center;gap:9px;
    opacity:.68;cursor:default;user-select:none;
  }
  .sig svg{width:20px;height:13px}
  .sig span{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink)}

  .note{
    position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);z-index:5;
    font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink);
    background:rgba(236,231,219,.92);border:1px solid var(--line);border-radius:2px;
    padding:12px 20px;opacity:0;pointer-events:none;transition:all .8s var(--ease);
    max-width:82%;text-align:center;
  }
  .note.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .lume{
    position:absolute;left:0;right:0;bottom:0;z-index:4;height:40px;
    display:flex;align-items:center;gap:12px;padding:0 16px;
    background:linear-gradient(to top,rgba(232,224,208,.9),rgba(232,224,208,0));
    transition:opacity .5s var(--ease);
  }
  .lume .lab{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--dim);white-space:nowrap}
  .lume .track{position:relative;flex:1;height:22px;cursor:ew-resize;touch-action:none}
  .lume .track::before{
    content:"";position:absolute;left:0;right:0;top:50%;height:2px;transform:translateY(-50%);
    background:linear-gradient(90deg,#9AA7B8,#C9CDD6,#E8E6DF,#F4E3C2,#E8B96F,#8E7BA8,#4E4A6B);
    border-radius:1px;opacity:.65;
  }
  .lume .thumb{
    position:absolute;top:50%;width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#F4E3C2,#D98E4A);
    border:1.5px solid rgba(69,63,86,.5);transform:translate(-50%,-50%);
    box-shadow:0 2px 8px rgba(69,63,86,.3);pointer-events:none;
    transition:box-shadow .4s;
  }
  .lume .heure{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink);min-width:52px;text-align:right}
  .hideme .etudes,.hideme .lume,.hideme .sig{opacity:0;pointer-events:none}

  /* N°20 标准印章 + 参数台（补强） */
  .seal{width:44px;height:44px;flex:none;align-self:center}
  .seal .ring{fill:none;stroke:var(--deep);stroke-width:1.2}
  .seal .m{fill:none;stroke:var(--deep);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .seal text{fill:var(--deep);font-family:var(--mono);font-size:6.4px;letter-spacing:1.6px}
  .etitle{display:flex;gap:12px;align-items:center}
  .idx b{color:var(--deep);font-weight:400}
  .params{position:absolute;top:56px;left:14px;z-index:4;display:flex;gap:8px;flex-wrap:wrap;transition:opacity .5s var(--ease)}
  .hideme .params{opacity:0;pointer-events:none}
  .param{
    display:flex;align-items:center;gap:8px;padding:6px 10px;
    background:rgba(232,224,208,.72);border:1px solid rgba(69,63,86,.28);border-radius:2px;
    backdrop-filter:blur(3px);
  }
  .param label{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--ink);white-space:nowrap}
  .param output{font-family:var(--mono);font-size:9px;color:var(--deep);min-width:26px;text-align:right}
  .param input[type=range]{-webkit-appearance:none;appearance:none;width:74px;height:14px;background:transparent;cursor:pointer}
  .param input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--ink)}
  .param input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:10px;height:10px;margin-top:-4.5px;border-radius:50%;
    background:var(--deep);border:1px solid rgba(69,63,86,.5);
  }
  .param input[type=range]::-moz-range-track{height:1px;background:var(--ink)}
  .param input[type=range]::-moz-range-thumb{width:9px;height:9px;border-radius:50%;background:var(--deep);border:1px solid rgba(69,63,86,.5)}
  @media (max-width:760px){.params{top:auto;bottom:100px;right:14px}}

  footer{padding:0 clamp(18px,4vw,44px) 30px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
  footer p{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  @media (max-width:640px){
    .stage{height:66vh;min-height:400px}
    .epig{max-width:100%}
    .sig{bottom:56px}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <a class="back" href="../../../index.html#work">← Archive</a>
    <div class="etitle">
      <svg class="seal" viewBox="0 0 58 58" aria-hidden="true">
        <circle class="ring" cx="29" cy="29" r="27"/>
        <circle class="ring" cx="29" cy="29" r="21.5" opacity=".45"/>
        <path id="sealArc" fill="none" d="M29,29 m-24.2,0 a24.2,24.2 0 1,1 48.4,0 a24.2,24.2 0 1,1 -48.4,0"/>
        <text><textPath href="#sealArc">ATELIER MIRA · ATELIER MIRA ·</textPath></text>
        <path class="m" d="M21.5 37.5 L23.2 20.8 L29 31.5 L34.8 20.8 L36.5 37.5"/>
      </svg>
      <h1>Signal <em>Bloom</em></h1>
    </div>
  </div>
  <p class="epig">「把一段波折叠成花。黄昏前一小时，它会自己打开。」</p>
  <span class="idx">Étude <b>N°20</b>/100 · Gen-Art</span>
</header>

<div class="stage-wrap">
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>

    <div class="etudes" id="etudes">
      <button data-m="sine" class="on"><svg viewBox="0 0 34 16"><path d="M1 8 Q5.5 1 9 8 T17 8 T25 8 T33 8"/></svg>正弦</button>
      <button data-m="square"><svg viewBox="0 0 34 16"><path d="M1 12 V4 H9 V12 H17 V4 H25 V12 H33"/></svg>方波</button>
      <button data-m="saw"><svg viewBox="0 0 34 16"><path d="M1 12 L9 4 V12 L17 4 V12 L25 4 V12 L33 4"/></svg>锯齿</button>
      <button data-m="tri"><svg viewBox="0 0 34 16"><path d="M1 12 L5 4 L9 12 L13 4 L17 12 L21 4 L25 12 L29 4 L33 12"/></svg>三角</button>
      <button data-m="noise"><svg viewBox="0 0 34 16"><path d="M1 9 L5 5 L8 11 L12 3 L15 10 L19 6 L22 12 L26 4 L30 9 L33 7"/></svg>噪声</button>
      <button data-m="__regen">再生 ↻</button>
      <button data-m="__save">PNG ↓</button>
      <button data-m="__share">链接 ⤴</button>
    </div>

    <div class="params" id="params">
      <div class="param"><label>瓣 PETALS</label><input type="range" id="pPet" min="3" max="24" value="8" step="1"><output id="pPetO">8</output></div>
      <div class="param"><label>幅 AMP</label><input type="range" id="pAmp" min="10" max="100" value="55" step="1"><output id="pAmpO">0.55</output></div>
      <div class="param"><label>层 LAYERS</label><input type="range" id="pLay" min="6" max="40" value="22" step="1"><output id="pLayO">22</output></div>
    </div>

    <button class="sndbtn" id="snd" aria-label="声景开关" title="声景（默认关闭）">
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="waves" d="M16.5 8.5c1.6 1.8 1.6 5.2 0 7M19 6.5c2.6 3 2.6 8 0 11"/><path class="slash" d="M17 9l5 6M22 9l-5 6"/></svg>
    </button>

    <div class="sig" id="sig">
      <svg viewBox="0 0 64 40" fill="#453F56" aria-hidden="true">
        <path d="M32 20 C 26 12, 14 6, 4 8 C 12 12, 18 18, 24 21
                 C 14 20, 6 22, 2 28 C 10 26, 18 26, 25 26
                 C 27 30, 30 34, 34 36 C 33 32, 33 28, 34 25
                 C 42 22, 52 16, 62 4 C 54 10, 44 16, 36 19
                 C 35 17, 33 17, 32 20 Z"/>
      </svg>
      <span>Atelier MIRA · N°020 · Lavande</span>
    </div>

    <div class="note" id="note">六月末，瓦朗索勒。七点整，整片田的紫色往下沉了一度，像有人把声音的振幅调大了一格。</div>

    <div class="lume">
      <span class="lab">光 · HEURE</span>
      <div class="track" id="lume"><div class="thumb" id="thumb"></div></div>
      <span class="heure" id="heureOut">—</span>
    </div>
  </div>
</div>

<footer>
  <p>波形折成花 · 移动光标拨动相位，点击听一声音簇</p>
  <p id="stats">Canvas 2D · folded waveform · ——</p>
</footer>

<script>
(function(){
"use strict";
/* ---------- palette: Lavande 薰衣草（黄昏前一小时，灰调紫） ---------- */
const PAL={
  wall:[232,224,208], far:[217,199,224], field:[185,168,201],
  mid:[142,123,168], deep:[107,91,133], dusk:[78,74,107]
};
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const stage=document.getElementById('stage');
let W=0,H=0,DPR=1;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- heure 时间系统（签名） ---------- */
let heure=new Date().getHours()+new Date().getMinutes()/60;
const hash=location.hash.match(/h=([\d.]+)/);if(hash)heure=parseFloat(hash[1])%24;
const KEYS=[
  [0,  [78,74,107],.38,[142,123,168],.06,.16],
  [5,  [154,167,184],.26,[217,199,224],.10,.40],
  [8,  [201,205,214],.10,[232,224,208],.06,.72],
  [12, [232,224,208],.04,[244,240,228],.05,1.0],
  [16, [217,199,224],.10,[244,227,194],.10,.86],
  [18.5,[217,142,74],.18,[232,185,111],.22,.62],
  [20.5,[107,91,133],.30,[185,168,201],.10,.32],
  [24, [78,74,107],.38,[142,123,168],.06,.16]
];
function lightAt(h){
  h=((h%24)+24)%24;
  let i=0;while(i<KEYS.length-2&&KEYS[i+1][0]<h)i++;
  const a=KEYS[i],b=KEYS[i+1],t=Math.min(1,Math.max(0,(h-a[0])/(b[0]-a[0]||1)));
  const L=(x,y)=>x+(y-x)*t, mix3=(u,v)=>[L(u[0],v[0]),L(u[1],v[1]),L(u[2],v[2])];
  return {tint:mix3(a[1],b[1]),tintA:L(a[2],b[2]),warm:mix3(a[3],b[3]),warmA:L(a[4],b[4]),light:L(a[5],b[5])};
}
/* 黄昏前一小时：花开因子 */
function duskFactor(h){
  h=((h%24)+24)%24;
  if(h<17||h>20.5)return 0;
  if(h<18.5)return (h-17)/1.5;
  if(h<19.5)return 1;
  return 1-(h-19.5);
}

/* ---------- 波形引擎（沿用原作） ---------- */
function seedFromHash(){
  const m=location.hash.match(/seed=([0-9a-fA-F]{1,4})/);
  return m?parseInt(m[1],16):Math.floor(Math.random()*65536);
}
function seedHex(){return (state.seed%65536).toString(16).toUpperCase().padStart(4,"0")}
function writeHash(){
  const hh=(typeof heure==="number")?heure.toFixed(1):"12.0";
  history.replaceState(null,"","#h="+hh+"&seed="+seedHex());
}
const state={
  wave:"sine", petals:8, amp:.55, layers:22,
  phase:0, phaseBias:0, twist:.35,
  seed:seedFromHash(), noiseTable:[]
};
function buildNoise(){
  const rng=mulberry32(state.seed);
  state.noiseTable=[];
  for(let i=0;i<64;i++)state.noiseTable.push(rng()*2-1);
}
function waveFn(x){
  const T=Math.PI*2;
  switch(state.wave){
    case "sine":return Math.sin(x);
    case "square":return Math.tanh(Math.sin(x)*3.2);
    case "saw":{const t=((x/T)%1+1)%1;return t*2-1}
    case "tri":return (2/Math.PI)*Math.asin(Math.sin(x));
    case "noise":{
      const t=((x/T)%1+1)%1*64;
      const i=Math.floor(t)%64,f=t-Math.floor(t);
      const a=state.noiseTable[i],b=state.noiseTable[(i+1)%64];
      return a+(b-a)*f;
    }
  }
  return 0;
}

/* ---------- 薰衣草田背景（碎色笔触，离屏一次） ---------- */
let bgC=null,horizon=0;
function mix3(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]}
function jit(c,amt,r){const j=(r()-.5)*2*amt;return [c[0]+j*.9,c[1]+j,c[2]+j*1.2]}
function buildBG(){
  const r=mulberry32(state.seed^0x1A7);
  bgC=document.createElement('canvas');bgC.width=W*DPR;bgC.height=H*DPR;
  const g=bgC.getContext('2d');g.scale(DPR,DPR);
  horizon=H*.46;
  g.fillStyle=`rgb(${PAL.wall})`;g.fillRect(0,0,W,H);
  g.lineCap='round';
  /* 天空：石灰墙 → 远紫，地平线处紫意更浓 */
  for(let i=0;i<900;i++){
    const x=r()*W,y=r()*horizon;
    const t=y/horizon;
    const c=jit(mix3(mix3(PAL.wall,PAL.far,.25+t*.3),PAL.far,Math.pow(1-t,1.6)*.6),7,r);
    g.strokeStyle=`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${(.35+r()*.3).toFixed(2)})`;
    g.lineWidth=1.5+r()*2.5;
    const len=6+r()*16;
    g.beginPath();g.moveTo(x,y);g.lineTo(x+len,y+(r()-.5)*3);g.stroke();
  }
  /* 田：一行行薰衣草，向地平线收拢（行结构要看得见） */
  const rows=22;
  for(let ri=0;ri<rows;ri++){
    const t=ri/(rows-1);
    const y=horizon+Math.pow(t,1.5)*(H-horizon)*.99;
    const rowH=(5+Math.pow(t,1.7)*30);
    // 行的颜色：远→近，远紫→花田；隔行加深制造垄沟节奏
    let base=t<.5?mix3(PAL.far,PAL.field,t*2):mix3(PAL.field,PAL.mid,(t-.5)*1.5);
    if(ri%2===1)base=mix3(base,PAL.deep,.28);
    const n=Math.round(110+t*200);
    for(let k=0;k<n;k++){
      const x=r()*W;
      const wob=Math.sin(x*.003+ri*1.7)*(3+t*10);
      const c=jit(base,10,r);
      g.strokeStyle=`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${(.55+r()*.35).toFixed(2)})`;
      g.lineWidth=1.2+r()*1.6+t*1.6;
      const len=4+r()*(5+t*9);
      g.beginPath();
      g.moveTo(x,y+wob+(r()-.5)*rowH*.5);
      g.lineTo(x+len,y+wob+(r()-.5)*rowH*.5-rowH*.55);
      g.stroke();
    }
    // 行间土线（石灰墙的缝隙）
    for(let k=0;k<90;k++){
      const x=r()*W;
      const wob=Math.sin(x*.003+ri*1.7)*(3+t*10);
      const c=jit(PAL.wall,6,r);
      g.strokeStyle=`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${(.3+r()*.25).toFixed(2)})`;
      g.lineWidth=1+t*1.2;
      g.beginPath();g.moveTo(x,y+wob+rowH*.75);g.lineTo(x+7+r()*12,y+wob+rowH*.75);g.stroke();
    }
  }
}

/* ---------- 纸纹 + 颗粒 ---------- */
let paperC=null;
function makePaper(){
  paperC=document.createElement('canvas');paperC.width=Math.max(2,W*DPR/2);paperC.height=Math.max(2,H*DPR/2);
  const p=paperC.getContext('2d');p.scale(DPR/2,DPR/2);
  const r=mulberry32(79);
  for(let i=0;i<4200;i++){
    p.fillStyle=`rgba(${r()<.5?'69,63,86':'255,252,246'},${(.02+r()*.04).toFixed(3)})`;
    p.fillRect(r()*W,r()*H,1+r()*1.6,1+r()*1.2);
  }
}
const grainC=document.createElement('canvas');grainC.width=grainC.height=128;
function makeGrain(){
  const g=grainC.getContext('2d');const im=g.createImageData(128,128);
  for(let i=0;i<im.data.length;i+=4){const v=110+Math.random()*40;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=14}
  g.putImageData(im,0,0);
}
makeGrain();setInterval(makeGrain,83);

/* ---------- 花开脉冲（wow：黄昏前一小时，花自己打开） ---------- */
let bloom=0,bloomV=0,clickPulse=0,chimed=false;

/* ---------- 指针 ---------- */
let targetBias=0;
cv.addEventListener('pointermove',e=>{
  const r=cv.getBoundingClientRect();
  targetBias=((e.clientX-r.left)/r.width-.5)*Math.PI;
});
cv.addEventListener('pointerleave',()=>{targetBias=0});
stage.addEventListener('pointerdown',()=>{
  clickPulse=1;
  if(sound.on)sound.pluck();
});

/* ---------- 声景（L5，默认 OFF）：风 + 五声音簇 ---------- */
const sound={on:false,ctx:null,master:null,
  init(){ if(this.ctx)return;
    const C=this.ctx=new (window.AudioContext||window.webkitAudioContext)();
    const M=this.master=C.createGain();M.gain.value=0;M.connect(C.destination);
    const len=2*C.sampleRate,buf=C.createBuffer(1,len,C.sampleRate),d=buf.getChannelData(0);
    let l=0;for(let i=0;i<len;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.2}
    const src=C.createBufferSource();src.buffer=buf;src.loop=true;
    const bp=C.createBiquadFilter();bp.type='bandpass';bp.frequency.value=480;bp.Q.value=1;
    const wg=C.createGain();wg.gain.value=.12;src.connect(bp);bp.connect(wg);wg.connect(M);src.start();
  },
  note(f,t,dur,vol){
    const C=this.ctx;
    const o=C.createOscillator(),o2=C.createOscillator(),g=C.createGain();
    o.frequency.value=f;o2.frequency.value=f*1.004;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+.03);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);o2.connect(g);g.connect(this.master);
    o.start(t);o2.start(t);o.stop(t+dur+.1);o2.stop(t+dur+.1);
  },
  cluster(){ // 宫调五声：C D E G A
    if(!this.ctx)return;const t=this.ctx.currentTime;
    const scale=[523.25,587.33,659.25,783.99,880.00];
    const n=2+Math.floor(Math.random()*2);
    const pick=scale.slice().sort(()=>Math.random()-.5).slice(0,n);
    pick.forEach((f,i)=>this.note(f,t+i*.14,4.5,.035));
  },
  pluck(){
    if(!this.ctx)return;const t=this.ctx.currentTime;
    const scale=[523.25,587.33,659.25,783.99,880.00];
    this.note(scale[(Math.random()*scale.length)|0],t,3,.04);
  },
  toggle(){ this.on=!this.on;
    if(this.on){this.init();this.ctx.resume();const t=this.ctx.currentTime;
      this.master.gain.cancelScheduledValues(t);this.master.gain.setValueAtTime(0,t);
      this.master.gain.linearRampToValueAtTime(1,t+1.5);}
    else if(this.ctx){const t=this.ctx.currentTime;
      this.master.gain.cancelScheduledValues(t);this.master.gain.linearRampToValueAtTime(0,t+.6);}
    localStorage.setItem('mira-sound',this.on?'1':'0');
    document.getElementById('snd').classList.toggle('on',this.on);
  }
};
document.getElementById('snd').addEventListener('click',e=>{e.stopPropagation();sound.toggle()});
if(localStorage.getItem('mira-sound')==='1'){
  const arm=()=>{sound.toggle();removeEventListener('pointerdown',arm)};addEventListener('pointerdown',arm);}

/* ---------- lume 时间轴 ---------- */
const lume=document.getElementById('lume'),thumb=document.getElementById('thumb'),heureOut=document.getElementById('heureOut');
let lumeDrag=false;
function lumeSet(e){const r=lume.getBoundingClientRect();
  heure=Math.min(24,Math.max(0,(e.clientX-r.left)/r.width*24));
  writeHash();}
lume.addEventListener('pointerdown',e=>{lumeDrag=true;lume.setPointerCapture(e.pointerId);lumeSet(e);e.stopPropagation()});
lume.addEventListener('pointermove',e=>{if(lumeDrag)lumeSet(e)});
lume.addEventListener('pointerup',()=>lumeDrag=false);

/* ---------- études ---------- */
document.getElementById('etudes').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const m=b.dataset.m;
  if(m==='__regen'){regen();return}
  if(m==='__save'){download();return}
  if(m==='__share'){shareLink();return}
  state.wave=m;
  document.querySelectorAll('.etudes button[data-m]').forEach(x=>{
    if(!x.dataset.m.startsWith('__'))x.classList.toggle('on',x.dataset.m===m)});
  stats();
});
function regen(){
  const waves=["sine","square","saw","tri","noise"];
  state.seed=Math.floor(Math.random()*65536);
  buildNoise();buildBG();
  state.wave=waves[(Math.random()*waves.length)|0];
  state.petals=3+((Math.random()*18)|0);
  state.amp=.25+Math.random()*.7;
  state.layers=14+((Math.random()*22)|0);
  state.twist=Math.random()*.9;
  syncParams();
  writeHash();
  document.querySelectorAll('.etudes button[data-m]').forEach(x=>{
    if(!x.dataset.m.startsWith('__'))x.classList.toggle('on',x.dataset.m===state.wave)});
  stats();
}
function shareLink(){
  const url=location.href.split('#')[0]+'#h='+heure.toFixed(1)+'&seed='+seedHex();
  const done=()=>{const n=document.getElementById('note');
    const orig=n.dataset.orig||(n.dataset.orig=n.textContent);
    n.textContent='分享链接已复制 — '+url.split('#')[1];
    n.classList.add('show');
    setTimeout(()=>{n.classList.remove('show');n.textContent=orig},2600);};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done).catch(()=>{prompt('Copy this link',url);done()});
  }else{prompt('Copy this link',url);done()}
}
function download(){
  const a=document.createElement('a');
  a.download="signal-bloom-"+seedHex()+".png";
  a.href=cv.toDataURL("image/png");a.click();
}
/* ---------- 参数台滑杆（补强） ---------- */
function syncParams(){
  document.getElementById('pPet').value=state.petals;
  document.getElementById('pAmp').value=Math.round(state.amp*100);
  document.getElementById('pLay').value=state.layers;
  document.getElementById('pPetO').textContent=state.petals;
  document.getElementById('pAmpO').textContent=state.amp.toFixed(2);
  document.getElementById('pLayO').textContent=state.layers;
}
document.getElementById('pPet').addEventListener('input',e=>{
  state.petals=+e.target.value;document.getElementById('pPetO').textContent=state.petals;stats()});
document.getElementById('pAmp').addEventListener('input',e=>{
  state.amp=+e.target.value/100;document.getElementById('pAmpO').textContent=state.amp.toFixed(2);stats()});
document.getElementById('pLay').addEventListener('input',e=>{
  state.layers=+e.target.value;document.getElementById('pLayO').textContent=state.layers;stats()});
function stats(){
  document.getElementById('stats').textContent=
    "Canvas 2D · "+state.wave.toUpperCase()+" · "+state.petals+" folds · Seed "+seedHex()+
    " · Painted with code, plein air";
}

/* ---------- 隐藏题记（落款连点 3 次） ---------- */
let sigClicks=0,sigTimer=null;
document.getElementById('sig').addEventListener('click',()=>{
  sigClicks++;clearTimeout(sigTimer);sigTimer=setTimeout(()=>sigClicks=0,900);
  if(sigClicks>=3){sigClicks=0;const n=document.getElementById('note');
    n.classList.add('show');setTimeout(()=>n.classList.remove('show'),5200);}
});

/* ---------- H 键收起 / R 再生 / 1-5 波形 / C 链接 / D 存图 ---------- */
addEventListener('keydown',e=>{
  if(e.key==='h'||e.key==='H')stage.classList.toggle('hideme');
  if(e.key==='r'||e.key==='R')regen();
  if(e.key==='c'||e.key==='C')shareLink();
  if(e.key==='d'||e.key==='D')download();
  const waves=["sine","square","saw","tri","noise"];
  const k=parseInt(e.key);
  if(k>=1&&k<=5){
    state.wave=waves[k-1];
    document.querySelectorAll('.etudes button[data-m]').forEach(x=>{
      if(!x.dataset.m.startsWith('__'))x.classList.toggle('on',x.dataset.m===state.wave)});
    stats();
  }
});

/* ---------- resize ---------- */
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=stage.clientWidth;H=stage.clientHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  makePaper();buildBG();
}
addEventListener('resize',resize);

/* ---------- 主循环 ---------- */
let t=0;
function frame(){
  t+=.016;
  state.phase+=.006;
  state.phaseBias+=(targetBias-state.phaseBias)*.06; // 阻尼（L1.1）
  clickPulse*=.93;

  const L=lightAt(heure);
  // 花开：黄昏因子 + 弹簧
  const target=duskFactor(heure);
  bloomV+=(target-bloom)*.03;bloomV*=.94;bloom+=bloomV;
  if(target>.5&&!chimed){chimed=true;if(sound.on)sound.cluster()}
  if(target<.3)chimed=false;
  const open=bloom+clickPulse*.6;

  ctx.drawImage(bgC,0,0,W,H);

  // 花：偏左，浮在田上（点彩笔触的层叠环）
  const cx0=W*.38, cy0=H*.56;
  const R=Math.min(W,H)*.32*(1+open*.15);
  const ph=state.phase+state.phaseBias;
  // 衬底色团：先在花下铺一团深紫碎笔，亮瓣才读得出来（大气色罩）
  for(let k=0;k<420;k++){
    const a=Math.random()*Math.PI*2, rr=Math.pow(Math.random(),.6)*R*1.28;
    const x=cx0+Math.cos(a)*rr, y=cy0+Math.sin(a)*rr*.92;
    const depthK=rr/(R*1.28);
    const base=depthK<.5?mix3(PAL.deep,PAL.mid,depthK*2):mix3(PAL.mid,PAL.field,(depthK-.5)*2);
    const c=jit(base,9,Math.random);
    ctx.fillStyle=`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${(.10+Math.random()*.10).toFixed(2)})`;
    ctx.beginPath();
    ctx.ellipse(x,y,3+Math.random()*5,1.6+Math.random()*2.6,a,0,7);
    ctx.fill();
  }
  const STEPS=96;
  for(let li=0;li<state.layers;li++){
    const lt=(li+1)/state.layers;
    const base=R*lt;
    // 层色：内 石灰墙高光 → 远紫 → 中紫 → 外 深紫描边
    const lc=lt<.3?mix3(PAL.wall,PAL.far,lt/.3)
            :lt<.7?mix3(PAL.far,PAL.mid,(lt-.3)/.4)
            :mix3(PAL.mid,PAL.deep,(lt-.7)/.3);
    for(let k=0;k<STEPS;k++){
      const th=(k/STEPS)*Math.PI*2;
      const w=waveFn(th*state.petals+ph+lt*state.twist*Math.PI*2);
      const r=base*(.68+.32*state.amp*w)+base*.30;
      const x=cx0+Math.cos(th)*r, y=cy0+Math.sin(th)*r*.96;
      const c=jit(lc,9,Math.random);
      const a=.45+lt*.5+open*.1;
      const sz=1.2+lt*2.6+open*.6;
      ctx.fillStyle=`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${Math.min(.92,a).toFixed(2)})`;
      ctx.beginPath();
      ctx.ellipse(x,y,sz,sz*.55,th+Math.PI/2,0,7);
      ctx.fill();
    }
  }
  // 花心：暮影点彩
  for(let k=0;k<44;k++){
    const a=Math.random()*Math.PI*2, rr=Math.random()*R*.1;
    const c=jit(k%3?PAL.dusk:PAL.deep,8,Math.random);
    ctx.fillStyle=`rgba(${c[0]|0},${c[1]|0},${c[2]|0},.85)`;
    ctx.beginPath();ctx.arc(cx0+Math.cos(a)*rr,cy0+Math.sin(a)*rr,1+Math.random()*1.6,0,7);ctx.fill();
  }
  // 花开时的逸散花粉（黄昏光点，灰调不荧光）
  if(open>.15){
    const n=Math.round(open*40);
    for(let k=0;k<n;k++){
      const a=Math.random()*Math.PI*2;
      const rr=R*(1.02+Math.random()*.25*open);
      const x=cx0+Math.cos(a)*rr,y=cy0+Math.sin(a)*rr*.96-Math.sin(t+k)*2;
      ctx.fillStyle=`rgba(232,224,208,${(.3+Math.random()*.4).toFixed(2)})`;
      ctx.beginPath();ctx.arc(x,y,.8+Math.random()*1.2,0,7);ctx.fill();
    }
  }
  // 夜的星（夜不是黑，是紫的深处有光）
  if(L.light<.35){
    const r=mulberry32(7);
    for(let k=0;k<50;k++){
      const x=r()*W,y=r()*horizon*.9;
      const tw=.3+.7*Math.abs(Math.sin(t*1.3+k));
      ctx.fillStyle=`rgba(232,224,208,${(tw*.5*(1-L.light/.35)).toFixed(2)})`;
      ctx.fillRect(x,y,1.2,1.2);
    }
  }

  // 光：全局色温 + 暮光暖带
  ctx.globalCompositeOperation='multiply';
  ctx.fillStyle=`rgba(${L.tint[0]|0},${L.tint[1]|0},${L.tint[2]|0},${(L.tintA*.7).toFixed(3)})`;
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='overlay';
  if(L.warmA>.03){
    const sunX=W*(heure<12?.24:.8),sunY=horizon*.8;
    const g=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,Math.max(W,H)*.7);
    g.addColorStop(0,`rgba(${L.warm[0]|0},${L.warm[1]|0},${L.warm[2]|0},${(L.warmA*1.5).toFixed(3)})`);
    g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
  ctx.globalCompositeOperation='source-over';
  const dark=(1-L.light)*.30;
  if(dark>.02){ctx.fillStyle=`rgba(78,74,107,${dark.toFixed(3)})`;ctx.fillRect(0,0,W,H)}

  // 纸纹 + 颗粒
  ctx.globalCompositeOperation='multiply';ctx.globalAlpha=.85;
  ctx.drawImage(paperC,0,0,W,H);
  ctx.globalCompositeOperation='overlay';ctx.globalAlpha=.05;
  ctx.drawImage(grainC,0,0,W,H);
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';

  thumb.style.left=(heure/24*100)+'%';
  const hh=Math.floor(heure),mm=Math.floor((heure-hh)*60);
  heureOut.textContent=`H ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;

  requestAnimationFrame(frame);
}
buildNoise();resize();syncParams();writeHash();stats();
requestAnimationFrame(frame);
})();
</script>
</body></html>
