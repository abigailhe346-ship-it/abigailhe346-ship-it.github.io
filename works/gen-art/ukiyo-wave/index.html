<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UKIYO WAVE — 浮世浪图</title>
<style>
  :root{
    --paper:#f2ecdd; --panel:#ece4d0; --line:#d3c8a8;
    --ink:#1c2437; --dim:#8d8468;
    --blue:#1f4a7e; --shu:#b84a39; --foam:#f7f2e4;
    --mono:"SF Mono",Menlo,Consolas,monospace;
    --serif:Didot,"Bodoni MT",Georgia,"Songti SC",serif;
    --sans:-apple-system,"Helvetica Neue","PingFang SC",sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  ::selection{background:var(--blue);color:#fff}

  header{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:22px 28px 0;gap:16px;flex-wrap:wrap;
  }
  .sig{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .sig h1{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:.04em}
  .sig h1 em{font-style:italic;color:var(--blue)}
  .sig .no{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.14em}
  .sig .no b{color:var(--shu);font-weight:400}
  header p.tag{font-size:12px;color:var(--dim);letter-spacing:.06em;max-width:400px;text-align:right;line-height:1.7}
  .rule{margin:14px 28px 0;border-top:1px solid var(--ink);position:relative}
  .rule::after{content:"";position:absolute;left:0;top:2px;width:100%;border-top:1px solid var(--line)}

  main{
    display:grid;grid-template-columns:284px minmax(0,1fr);gap:24px;
    padding:24px 28px 40px;max-width:1440px;margin:0 auto;
  }
  @media (max-width:960px){main{grid-template-columns:1fr}}

  .dock{
    background:var(--panel);border:1px solid var(--ink);
    padding:20px;display:flex;flex-direction:column;gap:18px;
    align-self:start;position:sticky;top:20px;
  }
  @media (max-width:960px){.dock{position:static}}
  .dock h2{
    font-family:var(--mono);font-size:11px;font-weight:400;color:var(--dim);
    letter-spacing:.22em;text-transform:uppercase;
    border-bottom:1px solid var(--line);padding-bottom:12px;
    display:flex;justify-content:space-between;
  }
  .dock h2 span{color:var(--shu)}
  .ctl{display:flex;flex-direction:column;gap:8px}
  .ctl label{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:12px;letter-spacing:.04em;
  }
  .ctl label output{font-family:var(--mono);font-size:11px;color:var(--blue)}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--ink)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:13px;height:13px;margin-top:-6px;
    background:var(--paper);border:1px solid var(--ink);border-radius:50%;
    box-shadow:2px 2px 0 var(--shu);transition:transform .15s var(--ease);
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.25)}
  input[type=range]::-moz-range-track{height:1px;background:var(--ink)}
  input[type=range]::-moz-range-thumb{
    width:13px;height:13px;background:var(--paper);border:1px solid var(--ink);
    border-radius:50%;box-shadow:2px 2px 0 var(--shu);
  }

  .themes{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .themes button{
    appearance:none;height:40px;border:1px solid var(--ink);cursor:pointer;
    position:relative;transition:transform .15s var(--ease);
    display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px;
    background:var(--paper);
  }
  .themes button:hover{transform:translateY(-2px)}
  .themes button i{display:flex;gap:2px;margin-bottom:4px}
  .themes button i b{display:block;width:9px;height:9px}
  .themes button span{font-size:10px;letter-spacing:.1em;line-height:1;color:var(--ink)}
  .themes button.on::after{
    content:"";position:absolute;inset:3px;border:1px solid var(--paper);
    outline:1px solid var(--ink);pointer-events:none;
  }

  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:16px;border-top:1px solid var(--line)}
  .btn{
    appearance:none;border:1px solid var(--ink);background:transparent;color:var(--ink);
    padding:11px 8px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;
    cursor:pointer;text-transform:uppercase;position:relative;overflow:hidden;
    transition:color .18s var(--ease);
  }
  .btn::before{
    content:"";position:absolute;inset:0;background:var(--ink);
    transform:translateY(101%);transition:transform .22s var(--ease);z-index:0;
  }
  .btn:hover::before{transform:translateY(0)}
  .btn:hover{color:var(--paper)}
  .btn span{position:relative;z-index:1}
  .btn.prime{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.prime::before{background:var(--ink)}

  .stage{
    position:relative;background:#f0e4c4;border:1px solid var(--ink);
    box-shadow:8px 8px 0 rgba(28,36,55,.12);overflow:hidden;
  }
  .stage canvas{display:block;width:100%;height:auto;cursor:crosshair;touch-action:none}
  .vtitle{
    position:absolute;left:14px;top:16px;writing-mode:vertical-rl;
    font-family:var(--serif);font-size:20px;letter-spacing:.42em;color:var(--ink);
    pointer-events:none;opacity:.85;
  }
  .vtitle small{
    font-family:var(--mono);font-size:9px;letter-spacing:.3em;color:rgba(28,36,55,.6);
    margin-top:10px;
  }
  .hanko{
    position:absolute;right:16px;top:16px;width:34px;height:34px;
    background:var(--shu);color:#f7f2e4;display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-size:15px;letter-spacing:0;line-height:1;
    writing-mode:vertical-rl;pointer-events:none;
    box-shadow:2px 2px 0 rgba(28,36,55,.2);
  }
  .hint{
    position:absolute;left:14px;bottom:12px;font-family:var(--mono);font-size:10px;
    letter-spacing:.14em;color:rgba(28,36,55,.55);pointer-events:none;text-transform:uppercase;
  }
  .count{
    position:absolute;right:16px;bottom:12px;font-family:var(--mono);font-size:10px;
    letter-spacing:.16em;color:rgba(28,36,55,.6);pointer-events:none;text-transform:uppercase;
  }

  footer{
    padding:0 28px 26px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
    font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;
  }
  @media (max-width:640px){
    header{padding:18px 18px 0}
    header p.tag{text-align:left;max-width:100%}
    .rule{margin:12px 18px 0}
    main{padding:18px 18px 32px}
    footer{padding:0 18px 22px}
    .vtitle{font-size:16px}
  }
</style>
</head>
<body>

<header>
  <div class="sig">
    <h1>Ukiyo <em>Wave</em></h1>
    <span class="no">N°<b>18</b> — GEN-ART / 浮世浪图 · Great Wave Press</span>
  </div>
  <p class="tag">普鲁士蓝的浪,鹰爪般的沫。每张都是神奈川沖的一次新出海。</p>
</header>
<div class="rule"></div>

<main>
  <aside class="dock">
    <h2>版元 — Print House <span>浪</span></h2>

    <div class="ctl">
      <label>摺色 · Impression</label>
      <div class="themes" id="themes">
        <button data-theme="aizuri" class="on"><i><b style="background:#1f4a7e"></b><b style="background:#4a7fae"></b><b style="background:#f0e4c4"></b></i><span>藍摺</span></button>
        <button data-theme="yugure"><i><b style="background:#1c3d68"></b><b style="background:#a83c2e"></b><b style="background:#eec295"></b></i><span>夕暮</span></button>
        <button data-theme="sumi"><i><b style="background:#26271f"></b><b style="background:#7c7f72"></b><b style="background:#f1ecdd"></b></i><span>濃墨</span></button>
      </div>
    </div>

    <div class="ctl">
      <label>浪高 · Swell<output id="oSwell">1.00</output></label>
      <input type="range" id="rSwell" min="70" max="130" step="1" value="100">
    </div>
    <div class="ctl">
      <label>泡沫 · Foam<output id="oFoam">0.60</output></label>
      <input type="range" id="rFoam" min="0" max="100" step="1" value="60">
    </div>
    <div class="ctl">
      <label>海风 · Wind<output id="oWind">0.15</output></label>
      <input type="range" id="rWind" min="-50" max="50" step="1" value="15">
    </div>

    <div class="actions">
      <button class="btn" id="btnRandom"><span>随机再生</span></button>
      <button class="btn prime" id="btnSave"><span>下载 PNG</span></button>
    </div>
  </aside>

  <div class="stage" id="stage">
    <canvas id="cv" width="1400" height="900"></canvas>
    <div class="vtitle">神奈川沖浪裏<small>UKIYO WAVE</small></div>
    <div class="hanko">大浪</div>
    <div class="hint">移动起风 · 点按溅沫 — Wind / Splash</div>
    <div class="count" id="count">版 EDITION N°01</div>
  </div>
</main>

<footer>
  <span>Ukiyo Wave — 浮世浪图</span>
  <span>Prussian Blue · MMXXVI</span>
</footer>

<script>
(function(){
  "use strict";

  var W = 1400, H = 900;
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = W*DPR; cv.height = H*DPR;

  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  var THEMES = {
    aizuri: { sky:"#f0e4c4", skyLow:"#e9d7ae", deep:"#14315c", mid:"#1f4a7e", light:"#4a7fae",
              foam:"#f7f2e4", line:"#12233f", sun:"#b84a39", cloud:"#e4d0a2" },
    yugure: { sky:"#eec295", skyLow:"#e2a571", deep:"#122a4a", mid:"#1c3d68", light:"#38608f",
              foam:"#f4e2c8", line:"#0e1f38", sun:"#a83c2e", cloud:"#e0ab7c" },
    sumi:   { sky:"#f1ecdd", skyLow:"#e5ddc6", deep:"#26271f", mid:"#3f423a", light:"#7c7f72",
              foam:"#f6f2e4", line:"#1c1d18", sun:"#b0492f", cloud:"#ded5bc" }
  };

  var state = { theme:"aizuri", swell:1.0, foam:0.6, wind:0.15, seed:1 };
  var scene = null;     /* regenerated layout */
  var edition = 0;
  var foamPts = [];     /* animated spray particles */
  var mouseX = 0.5;

  /* ---------- scene layout ---------- */
  function compose(){
    var rng = mulberry32(state.seed);
    edition++;
    scene = {
      sunX: rng()<0.5 ? W*(0.68+rng()*0.18) : W*(0.14+rng()*0.14),
      sunY: H*(0.16+rng()*0.1),
      sunR: 44+rng()*22,
      fuji: rng()<0.72,
      fujiX: W*(0.6+rng()*0.28),
      fujiS: 60+rng()*36,
      waves: [],       /* mid curling waves */
      boats: [],
      clouds: []
    };
    /* mid waves behind the great one */
    var n = 2+Math.floor(rng()*2);
    for (var i=0;i<n;i++){
      scene.waves.push({
        x: W*(0.52+rng()*0.42),
        y: H*(0.66+rng()*0.2),
        s: 46+rng()*44,
        dir: rng()<0.5?1:-1,
        phase: rng()*6.28
      });
    }
    /* boats */
    var nb = 1+Math.floor(rng()*3);
    for (var b=0;b<nb;b++){
      scene.boats.push({
        x: W*(0.45+rng()*0.45),
        y: H*(0.56+rng()*0.18),
        s: 34+rng()*22,
        tilt: (rng()-0.5)*0.3,
        phase: rng()*6.28,
        rowers: 3+Math.floor(rng()*4)
      });
    }
    /* cloud bands */
    for (var c=0;c<3;c++){
      scene.clouds.push({
        x: rng()*W, y: H*(0.1+rng()*0.24),
        w: 160+rng()*260, h: 10+rng()*10,
        v: 4+rng()*7
      });
    }
    foamPts = [];
    document.getElementById("count").textContent = "版 EDITION N°"+String(edition).padStart(2,"0");
  }

  /* ---------- wave drawing ---------- */
  function claw(g, cx, cy, R, ang, len, wid, bend, T){
    var bx1 = cx+Math.cos(ang-wid)*R,  by1 = cy+Math.sin(ang-wid)*R;
    var bx2 = cx+Math.cos(ang+wid)*R,  by2 = cy+Math.sin(ang+wid)*R;
    var ta = ang - bend;
    var tx = cx+Math.cos(ta)*(R+len),  ty = cy+Math.sin(ta)*(R+len);
    var mx = cx+Math.cos(ang)*(R+len*0.85), my = cy+Math.sin(ang)*(R+len*0.85);
    var qx = cx+Math.cos(ang+bend*0.7)*(R+len*0.22), qy = cy+Math.sin(ang+bend*0.7)*(R+len*0.22);
    g.beginPath();
    g.moveTo(bx1,by1);
    g.quadraticCurveTo(mx,my,tx,ty);
    g.quadraticCurveTo(qx,qy,bx2,by2);
    g.closePath();
    g.fillStyle = T.foam;
    g.fill();
    g.strokeStyle = T.line;
    g.lineWidth = 1.6;
    g.stroke();
  }

  function drawWave(g, cx, baseY, s, lean, phase, t, T, big){
    var h = 3.0*s, w = 5.2*s;
    baseY += Math.sin(t*0.9+phase)*s*0.05;
    var tipX = cx + w*0.14 + lean*s*2.2;
    var tipY = baseY - h;

    /* body */
    g.beginPath();
    g.moveTo(cx - w*0.62, baseY);
    g.bezierCurveTo(cx - w*0.64, baseY - h*0.72, cx - w*0.36, baseY - h*0.95, cx - w*0.06, baseY - h*0.98);
    g.bezierCurveTo(cx + w*0.05, baseY - h*1.0, tipX, tipY, tipX, tipY + h*0.15);
    g.bezierCurveTo(tipX - s*0.16, tipY + h*0.36, cx - w*0.01, baseY - h*0.44, cx + w*0.10, baseY - h*0.2);
    g.bezierCurveTo(cx + w*0.17, baseY - h*0.06, cx + w*0.26, baseY - s*0.05, cx + w*0.36, baseY);
    g.closePath();

    /* woodblock banding inside body */
    g.save();
    g.clip();
    g.fillStyle = T.light;  g.fillRect(cx-w, baseY-h*1.2, w*2.4, h*1.4);
    g.fillStyle = T.mid;    g.fillRect(cx-w, baseY-h*0.62, w*2.4, h);
    g.fillStyle = T.deep;   g.fillRect(cx-w, baseY-h*0.26, w*2.4, h);
    g.restore();

    g.strokeStyle = T.line;
    g.lineWidth = big?3:2.2;
    g.stroke();

    /* crest: white lip crescent + claws */
    var tcx = tipX - s*0.1, tcy = tipY + h*0.17;
    var R = h*0.30, r = h*0.155;
    var a0 = -Math.PI*0.72, a1 = Math.PI*0.62;
    g.beginPath();
    g.arc(tcx, tcy, R, a0, a1, false);
    g.arc(tcx, tcy, r, a1, a0, true);
    g.closePath();
    g.fillStyle = T.foam;
    g.fill();
    g.strokeStyle = T.line;
    g.lineWidth = big?2.4:1.8;
    g.stroke();

    /* claws along the lip, shrinking toward the end */
    var nClaw = Math.round((big?7:5) * (0.5 + state.foam*0.8));
    for (var i=0;i<nClaw;i++){
      var f = i/(nClaw-1);
      var ang = a0 + (a1-a0)*f;
      var len = (big?1:0.7) * s * (0.62 - f*0.34) * (0.7 + state.foam*0.6);
      claw(g, tcx, tcy, R, ang, len, 0.09, 0.55, T);
    }
    /* extra claws down the left face for the great wave */
    if (big){
      var nFace = Math.round(4*(0.5+state.foam*0.8));
      for (var k2=0;k2<nFace;k2++){
        var fy = baseY - h*(0.55 + k2*0.11);
        var fx = cx - w*(0.52 - k2*0.075) + lean*s*0.4;
        g.beginPath();
        g.moveTo(fx, fy);
        g.quadraticCurveTo(fx - s*0.5, fy - s*0.28, fx - s*0.66, fy - s*0.72);
        g.quadraticCurveTo(fx - s*0.3, fy - s*0.5, fx + s*0.06, fy - s*0.34);
        g.closePath();
        g.fillStyle = T.foam;
        g.fill();
        g.strokeStyle = T.line;
        g.lineWidth = 1.6;
        g.stroke();
      }
    }
    return { tipX:tipX, tipY:tipY, s:s };
  }

  /* ---------- scenery ---------- */
  function drawSea(g, T, t){
    var horizon = H*0.42;
    /* stepped sea bands */
    g.fillStyle = T.light; g.fillRect(0, horizon, W, H-horizon);
    g.fillStyle = T.mid;   g.fillRect(0, horizon+(H-horizon)*0.34, W, H);
    g.fillStyle = T.deep;  g.fillRect(0, horizon+(H-horizon)*0.68, W, H);

    /* distant scallop wave rows */
    for (var row=0; row<3; row++){
      var y = horizon + 26 + row*30;
      var rad = 20 + row*9;
      g.strokeStyle = T.line;
      g.lineWidth = 1.4;
      for (var x=-rad; x<W+rad; x+=rad*2){
        var yo = Math.sin(t*1.2 + x*0.02 + row)*3;
        g.beginPath();
        g.arc(x, y+yo+rad*0.35, rad, Math.PI, 0);
        g.stroke();
        /* foam dot on crest */
        if (state.foam > 0.15 && (x/rad)%2===0){
          g.beginPath();
          g.arc(x, y+yo+rad*0.35-rad, 2.2, 0, 6.29);
          g.fillStyle = T.foam;
          g.fill();
        }
      }
    }
  }

  function drawFuji(g, T){
    if (!scene.fuji) return;
    var x = scene.fujiX, s = scene.fujiS, base = H*0.44;
    g.beginPath();
    g.moveTo(x - s*2.2, base);
    g.lineTo(x - s*0.14, base - s*1.5);
    g.lineTo(x + s*0.14, base - s*1.5);
    g.lineTo(x + s*2.2, base);
    g.closePath();
    g.fillStyle = T.mid;
    g.fill();
    g.strokeStyle = T.line;
    g.lineWidth = 1.8;
    g.stroke();
    /* snow cap */
    g.beginPath();
    g.moveTo(x - s*0.5, base - s*1.14);
    g.lineTo(x - s*0.14, base - s*1.5);
    g.lineTo(x + s*0.14, base - s*1.5);
    g.lineTo(x + s*0.5, base - s*1.14);
    for (var i=0;i<4;i++){
      g.lineTo(x + s*(0.5 - (i+0.5)*0.25), base - s*(1.14 + (i%2?0.14:0.02)));
    }
    g.closePath();
    g.fillStyle = T.foam;
    g.fill();
    g.stroke();
  }

  function drawBoat(g, b, T, t){
    var bobY = Math.sin(t*1.1 + b.phase)*5;
    var rot = b.tilt + Math.sin(t*0.9 + b.phase)*0.045;
    g.save();
    g.translate(b.x, b.y + bobY);
    g.rotate(rot);
    g.scale(b.s/40, b.s/40);
    /* hull */
    g.beginPath();
    g.moveTo(-46, 0);
    g.quadraticCurveTo(-30, 14, 0, 15);
    g.quadraticCurveTo(34, 14, 50, -4);
    g.lineTo(40, -1);
    g.quadraticCurveTo(0, 6, -38, -3);
    g.closePath();
    g.fillStyle = T.deep;
    g.fill();
    g.strokeStyle = T.foam;
    g.lineWidth = 2.6;
    g.stroke();
    /* rowers */
    for (var i=0;i<b.rowers;i++){
      var rx = -28 + i*(56/Math.max(1,b.rowers-1));
      g.beginPath();
      g.arc(rx, -5, 3.4, 0, 6.29);
      g.fillStyle = T.foam;
      g.fill();
      g.strokeStyle = T.foam;
      g.lineWidth = 2;
      g.beginPath();
      g.moveTo(rx, -3);
      g.lineTo(rx + 4, 6);
      g.stroke();
    }
    g.restore();
  }

  function spawnSpray(tip, n, spread){
    for (var i=0;i<n;i++){
      var a = -Math.PI/2 + (Math.random()-0.5)*spread;
      var v = 1 + Math.random()*3.4;
      foamPts.push({
        x: tip.tipX + (Math.random()-0.5)*tip.s*0.6,
        y: tip.tipY + Math.random()*tip.s*0.3,
        vx: Math.cos(a)*v + state.wind*1.4,
        vy: Math.sin(a)*v,
        life: 0.7 + Math.random()*0.5,
        s: 1 + Math.random()*2.6
      });
    }
    if (foamPts.length > 340) foamPts.splice(0, foamPts.length-340);
  }

  /* ---------- render ---------- */
  var grainC = document.createElement("canvas");
  grainC.width = W; grainC.height = H;
  (function(){
    var g = grainC.getContext("2d");
    var img = g.createImageData(W,H);
    var d = img.data;
    for (var i=0;i<d.length;i+=4){
      var v = 128;
      d[i]=d[i+1]=d[i+2]=v;
      d[i+3]=Math.random()*13;
    }
    g.putImageData(img,0,0);
  })();

  function render(t){
    var T = THEMES[state.theme];
    ctx.setTransform(DPR,0,0,DPR,0,0);

    /* sky */
    var sg = ctx.createLinearGradient(0,0,0,H*0.5);
    sg.addColorStop(0, T.sky);
    sg.addColorStop(1, T.skyLow);
    ctx.fillStyle = sg;
    ctx.fillRect(0,0,W,H);

    /* sun */
    ctx.beginPath();
    ctx.arc(scene.sunX, scene.sunY, scene.sunR, 0, 6.29);
    ctx.fillStyle = T.sun;
    ctx.fill();
    ctx.strokeStyle = T.line;
    ctx.lineWidth = 2;
    ctx.stroke();

    /* drifting cloud bands */
    ctx.fillStyle = T.cloud;
    for (var c=0;c<scene.clouds.length;c++){
      var cl = scene.clouds[c];
      var cxx = (cl.x + t*cl.v) % (W+400) - 200;
      ctx.beginPath();
      ctx.ellipse(cxx, cl.y, cl.w/2, cl.h, 0, 0, 6.29);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(cxx+cl.w*0.24, cl.y+cl.h*0.9, cl.w*0.34, cl.h*0.7, 0, 0, 6.29);
      ctx.fill();
    }

    drawSea(ctx, T, t);
    drawFuji(ctx, T);

    /* wind lean: slider baseline + mouse influence */
    var lean = state.wind + (mouseX-0.5)*0.5;

    /* mid waves */
    for (var i=0;i<scene.waves.length;i++){
      var wv = scene.waves[i];
      var sc = wv.s * state.swell;
      drawWave(ctx, wv.x, wv.y, sc, lean*wv.dir, wv.phase, t, T, false);
    }

    /* boats ride between waves */
    for (var b=0;b<scene.boats.length;b++) drawBoat(ctx, scene.boats[b], T, t);

    /* the great wave */
    var gs = 96 * state.swell;
    var tip = drawWave(ctx, W*0.36, H*0.9, gs, lean, 0, t, T, true);

    /* spray */
    if (Math.random() < state.foam*0.9) spawnSpray(tip, 2, 1.6);
    ctx.fillStyle = T.foam;
    for (var p=foamPts.length-1;p>=0;p--){
      var f = foamPts[p];
      f.x += f.vx; f.y += f.vy;
      f.vy += 0.07;
      f.life -= 0.012;
      if (f.life<=0 || f.y>H){ foamPts.splice(p,1); continue; }
      ctx.globalAlpha = Math.min(1, f.life*1.6);
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.s, 0, 6.29);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    /* grain */
    ctx.save();
    ctx.globalCompositeOperation = "multiply";
    ctx.drawImage(grainC, 0, 0, W, H);
    ctx.restore();
  }

  var last = performance.now();
  function frame(now){
    render(now/1000);
    last = now;
    requestAnimationFrame(frame);
  }

  /* ---------- pointer ---------- */
  function toLocal(e){
    var r = cv.getBoundingClientRect();
    return { x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H };
  }
  cv.addEventListener("pointermove", function(e){
    var p = toLocal(e);
    mouseX = Math.max(0, Math.min(1, p.x/W));
  });
  cv.addEventListener("pointerdown", function(e){
    var p = toLocal(e);
    spawnSpray({ tipX:p.x, tipY:p.y, s:60 }, 26, 2.4);
  });

  /* ---------- controls ---------- */
  document.getElementById("themes").addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    document.querySelectorAll("#themes button").forEach(function(x){x.classList.remove("on");});
    b.classList.add("on");
    state.theme = b.dataset.theme;
  });
  document.getElementById("rSwell").addEventListener("input", function(){
    state.swell = parseFloat(this.value)/100;
    document.getElementById("oSwell").textContent = state.swell.toFixed(2);
  });
  document.getElementById("rFoam").addEventListener("input", function(){
    state.foam = parseFloat(this.value)/100;
    document.getElementById("oFoam").textContent = state.foam.toFixed(2);
  });
  document.getElementById("rWind").addEventListener("input", function(){
    state.wind = parseFloat(this.value)/100;
    document.getElementById("oWind").textContent = state.wind.toFixed(2);
  });
  document.getElementById("btnRandom").addEventListener("click", function(){
    state.seed = Math.floor(Math.random()*1e9);
    compose();
  });
  document.getElementById("btnSave").addEventListener("click", function(){
    var a = document.createElement("a");
    a.download = "ukiyo-wave-"+String(edition).padStart(2,"0")+".png";
    a.href = cv.toDataURL("image/png");
    a.click();
  });

  /* ---------- boot ---------- */
  state.seed = Math.floor(Math.random()*1e9);
  compose();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
