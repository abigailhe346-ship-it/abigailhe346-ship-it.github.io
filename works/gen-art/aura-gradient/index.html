<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura Gradient — 极光色光晕生成器</title>
<style>
  :root{
    --ink:#e9f2ec;
    --accent:#3ddc97;
    --line:rgba(233,242,236,.16);
    --serif:Didot,"Bodoni MT",Georgia,"Songti SC",serif;
    --sans:-apple-system,"Helvetica Neue","PingFang SC",sans-serif;
    --mono:"SF Mono",Menlo,monospace;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#060b1a;color:var(--ink);font-family:var(--sans)}
  #stage{position:fixed;inset:0;display:block}
  header{position:fixed;top:0;left:0;right:0;padding:28px 36px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
  .mark .no{font-family:var(--mono);font-size:10px;letter-spacing:.35em;color:var(--accent)}
  .mark h1{font-family:var(--serif);font-weight:400;font-size:clamp(22px,3vw,34px);letter-spacing:.02em;line-height:1;margin:6px 0}
  .mark .sub{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:rgba(233,242,236,.5)}
  .meta{font-family:var(--mono);font-size:10px;line-height:1.9;color:rgba(233,242,236,.45);text-align:right}
  .meta b{color:var(--accent);font-weight:400}

  .panel{position:fixed;left:36px;bottom:32px;z-index:6;width:284px;max-height:calc(100vh - 150px);overflow-y:auto;padding:22px;background:rgba(6,11,26,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);transition:transform .6s var(--ease),opacity .6s var(--ease)}
  .panel.hidden{transform:translateY(24px);opacity:0;pointer-events:none}
  .panel h2{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:rgba(233,242,236,.55);margin-bottom:12px}
  .pals{display:flex;gap:8px;margin-bottom:16px}
  .pal{flex:1;height:30px;border:1px solid var(--line);cursor:pointer;position:relative;transition:transform .3s var(--ease)}
  .pal:hover{transform:translateY(-2px)}
  .pal.on::after{content:"";position:absolute;inset:-4px;border:1px solid var(--accent)}
  .ctl{margin-bottom:13px}
  .ctl label{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:rgba(233,242,236,.66);margin-bottom:7px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:1px;background:rgba(233,242,236,.28)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:9px;height:9px;margin-top:-4px;background:#060b1a;border:1px solid var(--accent);transform:rotate(45deg);transition:background .25s var(--ease)}
  input[type=range]::-webkit-slider-thumb:hover{background:var(--accent)}
  input[type=range]::-moz-range-track{height:1px;background:rgba(233,242,236,.28)}
  input[type=range]::-moz-range-thumb{width:9px;height:9px;border:none;background:var(--accent);border-radius:0;transform:rotate(45deg)}
  .row{display:flex;gap:8px;margin-top:15px}
  button{flex:1;font-family:var(--sans);font-size:10px;letter-spacing:.18em;text-transform:uppercase;padding:11px 0;background:transparent;color:var(--ink);border:1px solid rgba(233,242,236,.32);cursor:pointer;transition:all .3s var(--ease)}
  button:hover{background:var(--ink);color:#060b1a;border-color:var(--ink)}
  button.accent{border-color:var(--accent);color:var(--accent)}
  button.accent:hover{background:var(--accent);color:#060b1a}
  .hint{position:fixed;right:36px;bottom:32px;z-index:5;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:rgba(233,242,236,.4);text-align:right;line-height:2;pointer-events:none}
  .hint em{font-style:normal;color:rgba(233,242,236,.7)}
  #panelToggle{position:fixed;left:36px;bottom:32px;z-index:7;width:38px;height:38px;display:none;align-items:center;justify-content:center;border:1px solid rgba(233,242,236,.32);padding:0;flex:none}
  #panelToggle svg{width:14px;height:14px;stroke:var(--ink);stroke-width:1.5;fill:none}
  .panel.hidden ~ #panelToggle{display:flex}
  @media (max-width:640px){
    header{padding:20px}.meta{display:none}
    .panel{left:16px;right:16px;bottom:16px;width:auto}
    #panelToggle{left:16px;bottom:16px}
    .hint{display:none}
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<header>
  <div class="mark">
    <span class="no">GEN-ART · N°05</span>
    <h1>Aura Gradient</h1>
    <span class="sub">极光色光晕生成器 · Polar Light Field</span>
  </div>
  <div class="meta">域扭曲噪声 × 光帘<br>实时着色器渲染</div>
</header>

<div class="panel" id="panel">
  <h2>色带 Spectra</h2>
  <div class="pals" id="pals"></div>
  <div class="ctl"><label><span>流速 flow</span><output id="oSp">0.40</output></label><input type="range" id="pSp" min="0.05" max="1.2" step="0.01" value="0.4"></div>
  <div class="ctl"><label><span>湍流 turbulence</span><output id="oTu">0.55</output></label><input type="range" id="pTu" min="0" max="1.2" step="0.01" value="0.55"></div>
  <div class="ctl"><label><span>光帘 curtains</span><output id="oBa">0.70</output></label><input type="range" id="pBa" min="0" max="1.4" step="0.01" value="0.7"></div>
  <div class="row">
    <button class="accent" id="btnRandom">随机再生</button>
    <button id="btnSave">下载 PNG</button>
  </div>
</div>
<button id="panelToggle" aria-label="open panel"><svg viewBox="0 0 24 24"><path d="M4 8h16M4 16h10"/></svg></button>

<div class="hint">移动鼠标 — <em>手持光源</em><br>按 <em>R</em> 再生 · <em>S</em> 存图 · <em>H</em> 收起面板</div>

<script>
(function(){
  "use strict";
  var canvas=document.getElementById('stage');
  var gl=canvas.getContext('webgl',{antialias:false,preserveDrawingBuffer:false});
  var W=0,H=0,DPR=1;

  var VERT="attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}";
  var FRAG=[
    "precision highp float;",
    "uniform vec2 u_res;uniform float u_time;uniform vec2 u_mouse;",
    "uniform float u_speed,u_turb,u_band,u_seed;",
    "uniform vec3 u_bg,u_c1,u_c2,u_c3;",
    "float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7))+u_seed*17.31)*43758.5453);}",
    "float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);",
    " return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}",
    "float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*noise(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return v;}",
    "void main(){",
    " vec2 uv=gl_FragCoord.xy/u_res;",
    " vec2 p=uv;p.x*=u_res.x/u_res.y;",
    " float t=u_time*(0.15+u_speed*0.5);",
    " vec2 q=vec2(fbm(p*1.5+vec2(0.,t*0.6)),fbm(p*1.5+vec2(5.2,t*0.4)));",
    " vec2 r=vec2(fbm(p*2.1+u_turb*1.8*q+vec2(1.7,9.2)+t*0.3),fbm(p*2.1+u_turb*1.8*q+vec2(8.3,2.8)-t*0.2));",
    " float f=fbm(p*2.0+u_turb*2.2*r);",
    " float curtain=fbm(vec2(p.x*1.1+r.x*u_band*1.6,t*0.5));",
    " float band=smoothstep(0.32,0.9,curtain)*smoothstep(1.1,0.2,uv.y+(q.y-0.5)*0.7);",
    " vec3 col=u_bg;",
    " col=mix(col,u_c1,smoothstep(0.28,0.8,f)*0.85);",
    " col=mix(col,u_c2,band*(0.35+u_band*0.6));",
    " col=mix(col,u_c3,pow(clamp(r.y*f*1.4,0.,1.),2.2)*(0.3+u_band*0.7));",
    " vec2 m=u_mouse;m.x*=u_res.x/u_res.y;",
    " float d=length(p-m);",
    " col+=(u_c2*0.55+u_c3*0.45)*exp(-d*d*5.0)*0.32;",
    " col+=(u_c1*0.4)*exp(-d*d*22.0)*0.25;",
    " float sp=hash(floor(p*vec2(220.,160.)));",
    " col+=vec3(0.9,0.95,1.0)*step(0.9975,sp)*(0.35*(1.0-band*0.7));",
    " col+=(hash(gl_FragCoord.xy+fract(u_time)*61.7)-0.5)*0.028;",
    " col*=1.0-0.38*pow(length(uv-0.5)*1.35,1.6);",
    " gl_FragColor=vec4(col,1.);",
    "}"
  ].join("\n");

  function shader(type,src){
    var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(s));}
    return s;
  }
  var prog=null,U={};
  if(gl){
    prog=gl.createProgram();
    gl.attachShader(prog,shader(gl.VERTEX_SHADER,VERT));
    gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,FRAG));
    gl.linkProgram(prog);gl.useProgram(prog);
    var buf=gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER,buf);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    var loc=gl.getAttribLocation(prog,'a');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    ["u_res","u_time","u_mouse","u_speed","u_turb","u_band","u_seed","u_bg","u_c1","u_c2","u_c3"].forEach(function(n){
      U[n]=gl.getUniformLocation(prog,n);
    });
  }

  /* ---------------- palettes ---------------- */
  var PALS=[
    {name:"极地",bg:"#060b1a",c1:"#2a9d8f",c2:"#3ddc97",c3:"#7b5ea7"},
    {name:"暮霭",bg:"#160d14",c1:"#6d3b5e",c2:"#e76f51",c3:"#f4a261"},
    {name:"霓潮",bg:"#05060a",c1:"#274060",c2:"#3ec1d3",c3:"#ff5d8f"}
  ];
  var palIdx=0,speed=0.4,turb=0.55,band=0.7,seedV=Math.random()*100;
  var mouse={x:0.62,y:0.45,tx:0.62,ty:0.45};

  function hexV(h){return [parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255];}

  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth;H=window.innerHeight;
    canvas.width=W*DPR;canvas.height=H*DPR;
    canvas.style.width=W+'px';canvas.style.height=H+'px';
    if(gl)gl.viewport(0,0,canvas.width,canvas.height);
  }
  window.addEventListener('resize',resize);

  function renderFrame(t){
    if(!gl)return;
    var P=PALS[palIdx];
    gl.uniform2f(U.u_res,canvas.width,canvas.height);
    gl.uniform1f(U.u_time,t);
    gl.uniform2f(U.u_mouse,mouse.tx,1.0-mouse.ty); /* shader applies aspect */
    gl.uniform1f(U.u_speed,speed);
    gl.uniform1f(U.u_turb,turb);
    gl.uniform1f(U.u_band,band);
    gl.uniform1f(U.u_seed,seedV);
    gl.uniform3fv(U.u_bg,hexV(P.bg));
    gl.uniform3fv(U.u_c1,hexV(P.c1));
    gl.uniform3fv(U.u_c2,hexV(P.c2));
    gl.uniform3fv(U.u_c3,hexV(P.c3));
    gl.drawArrays(gl.TRIANGLES,0,3);
  }

  var start=performance.now();
  function loop(now){
    mouse.tx+=(mouse.x-mouse.tx)*0.05;
    mouse.ty+=(mouse.y-mouse.ty)*0.05;
    renderFrame((now-start)/1000);
    requestAnimationFrame(loop);
  }

  /* ---------------- fallback if no WebGL ---------------- */
  if(!gl){
    var c2=canvas.getContext('2d');
    (function fb(){
      var g=c2.createLinearGradient(0,0,W,H);
      g.addColorStop(0,'#060b1a');g.addColorStop(0.5,'#2a9d8f');g.addColorStop(1,'#7b5ea7');
      c2.fillStyle=g;c2.fillRect(0,0,W,H);
    })();
  }

  /* ---------------- UI ---------------- */
  var palsEl=document.getElementById('pals');
  PALS.forEach(function(p,i){
    var d=document.createElement('div');d.className='pal'+(i===palIdx?' on':'');
    d.title=p.name;
    d.style.background='linear-gradient(120deg,'+p.bg+','+p.c1+' 45%,'+p.c2+' 75%,'+p.c3+')';
    d.addEventListener('click',function(){
      palIdx=i;
      palsEl.querySelectorAll('.pal').forEach(function(x,j){x.classList.toggle('on',j===i);});
    });
    palsEl.appendChild(d);
  });
  function bind(id,out,fn){
    var el=document.getElementById(id),o=document.getElementById(out);
    el.addEventListener('input',function(){var v=parseFloat(el.value);fn(v);o.textContent=v.toFixed(2);});
  }
  bind('pSp','oSp',function(v){speed=v;});
  bind('pTu','oTu',function(v){turb=v;});
  bind('pBa','oBa',function(v){band=v;});

  function randomize(){
    seedV=Math.random()*100;
    palIdx=Math.floor(Math.random()*PALS.length);
    turb=0.25+Math.random()*0.75;
    band=0.35+Math.random()*0.85;
    speed=0.15+Math.random()*0.6;
    palsEl.querySelectorAll('.pal').forEach(function(x,j){x.classList.toggle('on',j===palIdx);});
    document.getElementById('pTu').value=turb;document.getElementById('oTu').textContent=turb.toFixed(2);
    document.getElementById('pBa').value=band;document.getElementById('oBa').textContent=band.toFixed(2);
    document.getElementById('pSp').value=speed;document.getElementById('oSp').textContent=speed.toFixed(2);
  }
  function save(){
    renderFrame((performance.now()-start)/1000); /* fresh frame, same task */
    var a=document.createElement('a');
    a.download='aura-gradient-'+Date.now()+'.png';
    a.href=canvas.toDataURL('image/png');
    a.click();
  }
  document.getElementById('btnRandom').addEventListener('click',randomize);
  document.getElementById('btnSave').addEventListener('click',save);
  window.addEventListener('mousemove',function(e){mouse.x=e.clientX/W;mouse.y=e.clientY/H;});
  window.addEventListener('touchmove',function(e){
    if(e.touches.length){mouse.x=e.touches[0].clientX/W;mouse.y=e.touches[0].clientY/H;}
  },{passive:true});
  var panel=document.getElementById('panel');
  document.getElementById('panelToggle').addEventListener('click',function(){panel.classList.remove('hidden');});
  window.addEventListener('keydown',function(e){
    var k=e.key.toLowerCase();
    if(k==='r')randomize();else if(k==='s')save();else if(k==='h')panel.classList.toggle('hidden');
  });

  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
