<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Origami Fold — 折纸几何生成器</title>
<style>
  :root{
    --paper:#F4F1EA; --ink:#26241F; --ink-soft:#8A8577;
    --crimson:#B3402E; --indigo:#2E3A67; --ochre:#C89B4B;
    --panel:rgba(244,241,234,.86);
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--paper);
    font-family:-apple-system,"Helvetica Neue","PingFang SC",sans-serif;color:var(--ink)}
  canvas{position:fixed;inset:0;display:block}

  header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;
    align-items:flex-start;padding:28px 34px;pointer-events:none;z-index:5}
  .brand{display:flex;gap:14px;align-items:baseline}
  .num{font-family:Didot,"Bodoni MT",Georgia,serif;font-style:italic;font-size:15px;color:var(--ink-soft)}
  h1{font-family:Didot,"Bodoni MT",Georgia,serif;font-weight:400;font-size:22px;letter-spacing:.04em}
  h1 em{font-style:normal;font-size:12px;letter-spacing:.34em;color:var(--ink-soft);margin-left:10px;vertical-align:2px}
  .pal{display:flex;gap:8px;padding-top:6px}
  .pal i{width:12px;height:12px;border-radius:50%;border:1px solid rgba(38,36,31,.25)}

  .dock{position:fixed;left:34px;bottom:32px;z-index:6;display:flex;flex-direction:column;gap:14px;
    background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(38,36,31,.14);padding:20px 22px;max-width:308px;
    box-shadow:0 12px 40px rgba(38,36,31,.10);
    animation:rise .9s var(--ease) both .2s}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .row{display:flex;align-items:center;gap:14px}
  label{font-size:10px;letter-spacing:.22em;color:var(--ink-soft);width:74px;flex-shrink:0;text-transform:uppercase}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:2px;background:rgba(38,36,31,.25);outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;background:var(--ink);
    border:none;border-radius:0;transform:rotate(45deg);transition:background .3s var(--ease)}
  input[type=range]::-webkit-slider-thumb:hover{background:var(--crimson)}
  input[type=range]::-moz-range-thumb{width:11px;height:11px;background:var(--ink);border:none;border-radius:0;transform:rotate(45deg)}
  input[type=range]::-moz-range-track{height:2px;background:rgba(38,36,31,.25)}
  .val{font-family:"SF Mono",Menlo,monospace;font-size:11px;width:26px;text-align:right;color:var(--ink-soft)}
  .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
  button{font-family:inherit;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
    padding:10px 16px;background:transparent;border:1px solid rgba(38,36,31,.55);color:var(--ink);
    cursor:pointer;transition:all .35s var(--ease)}
  button:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  button.accent{border-color:var(--crimson);color:var(--crimson)}
  button.accent:hover{background:var(--crimson);color:#fff}
  button.on{background:var(--indigo);border-color:var(--indigo);color:#fff}

  .hint{position:fixed;right:34px;bottom:36px;z-index:5;text-align:right;pointer-events:none;
    font-size:10px;letter-spacing:.18em;color:var(--ink-soft);line-height:2;text-transform:uppercase;
    animation:rise .9s var(--ease) both .35s}
  .hint b{color:var(--ink);font-weight:500}
  @media (max-width:640px){
    header{padding:18px 20px}
    h1{font-size:17px}
    .dock{left:16px;right:16px;bottom:16px;max-width:none;padding:16px}
    .hint{display:none}
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<header>
  <div class="brand">
    <span class="num">N°01</span>
    <h1>Origami Fold<em>折纸几何</em></h1>
  </div>
  <div class="pal">
    <i style="background:#F4F1EA"></i><i style="background:#B3402E"></i><i style="background:#2E3A67"></i><i style="background:#C89B4B"></i>
  </div>
</header>

<div class="dock">
  <div class="row">
    <label>Flaps 折面</label>
    <input type="range" id="density" min="5" max="26" value="13">
    <span class="val" id="densityVal">13</span>
  </div>
  <div class="row">
    <label>Relief 起伏</label>
    <input type="range" id="relief" min="10" max="100" value="55">
    <span class="val" id="reliefVal">55</span>
  </div>
  <div class="btns">
    <button id="btnRandom" class="accent">随机再生</button>
    <button id="btnCrease" class="on">折痕 CP</button>
    <button id="btnSave">下载 PNG</button>
  </div>
</div>

<div class="hint">
  <b>移动鼠标</b> 改变光源方向<br>
  <b>点击画面</b> 触发一次折叠波<br>
  <b>按 C</b> 切换折痕图
</div>

<script>
(function(){
"use strict";
var canvas=document.getElementById('cv'),ctx=canvas.getContext('2d');
var W=0,H=0,DPR=1;

/* ---------- palette : 纸 / 朱 / 靛 / 赭 ---------- */
var PAPER_BASE=[[244,241,234],[240,235,222],[236,232,224]];
var ACCENTS=[[179,64,46],[46,58,103],[200,155,75],[120,42,38],[38,46,80]];

/* ---------- seeded rng ---------- */
var seed=(Math.random()*1e9)|0;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var rnd=mulberry32(seed);

/* ---------- model ---------- */
var tris=[],flaps=[],cols=0,rows=0,gridPts=null;
var density=13,relief=0.55;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  build();
}

function build(){
  rnd=mulberry32(seed);
  tris=[];flaps=[];borderEdges.length=0;
  var s=Math.min(W,H)/(density*0.92);
  cols=Math.ceil(W/s)+2;rows=Math.ceil(H/s)+2;
  var ox=(W-(cols-1)*s)/2,oy=(H-(rows-1)*s)/2;
  gridPts=[];
  var i,j;
  for(j=0;j<rows;j++){var row=[];
    for(i=0;i<cols;i++){
      var jx=(i>0&&i<cols-1)?(rnd()-0.5)*s*0.8:0;
      var jy=(j>0&&j<rows-1)?(rnd()-0.5)*s*0.8:0;
      row.push([ox+i*s+jx,oy+j*s+jy]);
    }
    gridPts.push(row);
  }
  /* triangles: two per quad, alternating diagonal for irregularity */
  var id=0;
  for(j=0;j<rows-1;j++)for(i=0;i<cols-1;i++){
    var a=gridPts[j][i],b=gridPts[j][i+1],c=gridPts[j+1][i],d=gridPts[j+1][i+1];
    if((i+j)%2===0){tris.push({id:id++,p:[a,c,d],cx:0,cy:0,flap:-1,nz:0});
                    tris.push({id:id++,p:[a,d,b],cx:0,cy:0,flap:-1,nz:0});}
    else{tris.push({id:id++,p:[a,c,b],cx:0,cy:0,flap:-1,nz:0});
         tris.push({id:id++,p:[b,c,d],cx:0,cy:0,flap:-1,nz:0});}
  }
  tris.forEach(function(t){t.cx=(t.p[0][0]+t.p[1][0]+t.p[2][0])/3;t.cy=(t.p[0][1]+t.p[1][1]+t.p[2][1])/3;});
  /* adjacency by shared edge midpoint signature */
  var emap={};
  tris.forEach(function(t){t.nb=[];
    for(var e=0;e<3;e++){
      var p1=t.p[e],p2=t.p[(e+1)%3];
      var k=((p1[0]+p2[0])*0.5).toFixed(2)+'_'+((p1[1]+p2[1])*0.5).toFixed(2);
      if(emap[k]!==undefined){t.nb.push(emap[k]);tris[emap[k]].nb.push(t.id);}
      else emap[k]=t.id;
    }
  });
  /* region growing into flaps */
  var nSeeds=Math.max(4,Math.round(density*density/6.5));
  var seeds=[];
  for(i=0;i<nSeeds;i++)seeds.push(tris[(rnd()*tris.length)|0].id);
  /* multi-source dijkstra with random edge cost */
  var dist=new Array(tris.length).fill(Infinity);
  var heap=seeds.map(function(id){dist[id]=0;tris[id].flap=seeds.indexOf(id);return[0,id];});
  while(heap.length){
    heap.sort(function(x,y){return x[0]-y[0];});
    var cur=heap.shift(),d0=cur[0],u=cur[1];
    if(d0>dist[u])continue;
    var tn=tris[u].nb;
    for(var k2=0;k2<tn.length;k2++){
      var v=tn[k2],nd=d0+0.6+rnd()*1.7;
      if(nd<dist[v]){dist[v]=nd;tris[v].flap=tris[u].flap;heap.push([nd,v]);}
    }
  }
  /* flap properties: fold normal, paper color */
  for(i=0;i<nSeeds;i++){
    var accent=rnd()<0.30;
    var col=accent?ACCENTS[(rnd()*ACCENTS.length)|0]:PAPER_BASE[(rnd()*PAPER_BASE.length)|0];
    var ang=rnd()*Math.PI*2,mag=(0.55+rnd()*0.75)*relief;
    flaps.push({
      nx:Math.cos(ang)*mag, ny:Math.sin(ang)*mag, nz:1.5,
      col:col, accent:accent, phase:rnd()*Math.PI*2,
      mountain:[]
    });
  }
  /* border edges between flaps + mountain/valley */
  var seen={};
  tris.forEach(function(t){
    var es=[[t.p[0],t.p[1]],[t.p[1],t.p[2]],[t.p[2],t.p[0]]];
    t.nb.forEach(function(nid){
      var n=tris[nid];
      if(t.flap!==n.flap){
        for(var e=0;e<3;e++){
          var q1=es[e][0],q2=es[e][1];
          var key=Math.min(t.id,n.id)+'_'+Math.max(t.id,n.id)+'_'+e;
          for(var e2=0;e2<3;e2++){
            var r1=n.p[e2],r2=n.p[(e2+1)%3];
            if((q1===r1&&q2===r2)||(q1===r2&&q2===r1)){
              var kk=((q1[0]+q2[0])*0.5).toFixed(2)+'_'+((q1[1]+q2[1])*0.5).toFixed(2);
              if(!seen[kk]){
                seen[kk]=1;
                borderEdges.push({a:q1,b:q2,mv:rnd()<0.5,fa:t.flap,fb:n.flap});
              }
            }
          }
        }
      }
    });
  });
}
var borderEdges=[];

/* ---------- interaction state ---------- */
var mouse={x:0.62,y:0.3},light={x:0.62,y:0.3};
var waves=[]; /* click fold waves */
var showCreases=true;

window.addEventListener('mousemove',function(e){mouse.x=e.clientX/W;mouse.y=e.clientY/H;});
window.addEventListener('touchmove',function(e){if(e.touches[0]){mouse.x=e.touches[0].clientX/W;mouse.y=e.touches[0].clientY/H;}},{passive:true});
canvas.addEventListener('pointerdown',function(e){
  waves.push({x:e.clientX,y:e.clientY,t:performance.now()});
  if(waves.length>4)waves.shift();
});
window.addEventListener('keydown',function(e){
  if(e.key==='c'||e.key==='C')toggleCrease();
});

/* ---------- render ---------- */
function shade(f,fx,fy,t){
  /* wave perturbation */
  var wnx=0,wny=0;
  for(var w=0;w<waves.length;w++){
    var wv=waves[w],age=(t-wv.t)/1000;
    if(age>2.4)continue;
    var dx=fx-wv.x,dy=fy-wv.y,d=Math.sqrt(dx*dx+dy*dy);
    var amp=Math.exp(-age*2.1)*Math.exp(-d/420);
    var ph=d/90-age*7+f.phase;
    wnx+=Math.sin(ph)*amp*0.9;wny+=Math.cos(ph)*amp*0.9;
  }
  var nx=f.nx+wnx,ny=f.ny+wny,nz=f.nz;
  var lx=(light.x-0.5)*2.4,ly=(light.y-0.5)*2.4,lz=1.05;
  var nl=Math.sqrt(nx*nx+ny*ny+nz*nz),ll=Math.sqrt(lx*lx+ly*ly+lz*lz);
  var dot=(nx*lx+ny*ly+nz*lz)/(nl*ll);
  var b=0.24+0.76*Math.max(0,dot);
  b=Math.pow(b,f.accent?0.85:1.35); /* paper stays luminous */
  return b;
}

function frame(t){
  light.x+=(mouse.x-light.x)*0.06;
  light.y+=(mouse.y-light.y)*0.06;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#EDE9DF';ctx.fillRect(0,0,W,H);
  waves=waves.filter(function(w){return t-w.t<2400;});

  var i,tm,f;
  for(i=0;i<tris.length;i++){
    tm=tris[i];f=flaps[tm.flap];
    if(!f)continue;
    var b=shade(f,tm.cx,tm.cy,t);
    /* facet micro-variation */
    b*=0.96+((tm.id*2654435761%97)/97)*0.08;
    var c=f.col;
    var r=Math.min(255,c[0]*b*1.06+18*(1-b));
    var g=Math.min(255,c[1]*b*1.06+16*(1-b));
    var bl=Math.min(255,c[2]*b*1.06+14*(1-b));
    ctx.fillStyle='rgb('+(r|0)+','+(g|0)+','+(bl|0)+')';
    ctx.beginPath();
    ctx.moveTo(tm.p[0][0],tm.p[0][1]);
    ctx.lineTo(tm.p[1][0],tm.p[1][1]);
    ctx.lineTo(tm.p[2][0],tm.p[2][1]);
    ctx.closePath();ctx.fill();
  }
  /* crease shadows at flap borders */
  ctx.lineWidth=1;
  for(i=0;i<borderEdges.length;i++){
    var e=borderEdges[i];
    ctx.strokeStyle='rgba(48,38,28,0.30)';
    ctx.beginPath();ctx.moveTo(e.a[0],e.a[1]);ctx.lineTo(e.b[0],e.b[1]);ctx.stroke();
  }
  /* CP overlay: mountain solid crimson / valley dashed indigo */
  if(showCreases){
    for(i=0;i<borderEdges.length;i++){
      var e2=borderEdges[i];
      ctx.save();
      if(e2.mv){ctx.strokeStyle='rgba(179,64,46,0.85)';ctx.setLineDash([]);ctx.lineWidth=1.6;}
      else{ctx.strokeStyle='rgba(46,58,103,0.85)';ctx.setLineDash([6,5]);ctx.lineWidth=1.3;}
      ctx.beginPath();ctx.moveTo(e2.a[0],e2.a[1]);ctx.lineTo(e2.b[0],e2.b[1]);ctx.stroke();
      ctx.restore();
    }
  }
  /* paper grain vignette */
  var vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.42,W/2,H/2,Math.max(W,H)*0.78);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(74,60,40,0.14)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  requestAnimationFrame(frame);
}

/* ---------- controls ---------- */
var dEl=document.getElementById('density'),dV=document.getElementById('densityVal');
dEl.addEventListener('input',function(){density=+dEl.value;dV.textContent=dEl.value;build();});
var rEl=document.getElementById('relief'),rV=document.getElementById('reliefVal');
rEl.addEventListener('input',function(){relief=+rEl.value/100;rV.textContent=rEl.value;build();});
document.getElementById('btnRandom').addEventListener('click',function(){seed=(Math.random()*1e9)|0;build();});
var bc=document.getElementById('btnCrease');
function toggleCrease(){showCreases=!showCreases;bc.classList.toggle('on',showCreases);}
bc.addEventListener('click',toggleCrease);
document.getElementById('btnSave').addEventListener('click',function(){
  canvas.toBlob(function(b){
    var a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download='origami-fold-'+seed+'.png';a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
  });
});

window.addEventListener('resize',resize);
resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
