<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INK FLOW 墨流 — 生成式水墨山水</title>
<style>
  :root{
    --paper:#f4efe3; --paper-deep:#e9e2d0; --line:#cfc6ae;
    --ink:#232420; --ink-soft:#54554c; --dim:#8b8878;
    --seal:#b03a2e;
    --mono:"SF Mono",Menlo,Consolas,monospace;
    --serif:Didot,"Bodoni MT","Songti SC","STSong",Georgia,serif;
    --sans:-apple-system,"Helvetica Neue","PingFang SC",sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  ::selection{background:var(--seal);color:#fff}

  header{
    display:flex;justify-content:space-between;align-items:flex-end;
    padding:26px 30px 0;gap:20px;flex-wrap:wrap;
  }
  .sig{display:flex;align-items:flex-end;gap:18px}
  .sig h1{
    font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:.06em;
    line-height:1;
  }
  .sig h1 em{font-style:italic;color:var(--seal)}
  .sig .no{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.18em;padding-bottom:3px}
  .sig .no b{color:var(--seal);font-weight:400}
  header p.tag{
    font-size:11px;color:var(--dim);letter-spacing:.14em;text-align:right;
    font-family:var(--mono);text-transform:uppercase;line-height:1.9;
  }
  .rule{margin:16px 30px 0;border-top:1px solid var(--ink);position:relative}
  .rule::after{content:"";position:absolute;left:0;top:2px;width:100%;border-top:1px solid var(--line)}

  main{
    display:grid;grid-template-columns:1fr 290px;gap:26px;
    padding:24px 30px 48px;max-width:1460px;margin:0 auto;
  }
  @media (max-width:960px){main{grid-template-columns:1fr}}

  .stage{
    position:relative;background:#f8f5ec;border:1px solid var(--ink);
    box-shadow:7px 7px 0 rgba(35,36,32,.10);
    overflow:hidden;
  }
  .stage::before{content:"";display:block;padding-top:66.66%}
  .stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
  .stamp{
    position:absolute;right:12px;top:10px;font-family:var(--mono);font-size:10px;
    letter-spacing:.2em;color:var(--ink);border:1px solid var(--ink);
    padding:4px 9px;background:rgba(244,239,227,.85);pointer-events:none;
    text-transform:uppercase;
  }
  .hint{
    position:absolute;left:12px;bottom:10px;font-family:var(--mono);font-size:10px;
    letter-spacing:.16em;color:rgba(35,36,32,.55);pointer-events:none;text-transform:uppercase;
  }

  .dock{
    border:1px solid var(--ink);background:var(--paper-deep);
    padding:22px 20px;display:flex;flex-direction:column;gap:20px;
    align-self:start;position:sticky;top:20px;
  }
  @media (max-width:960px){.dock{position:static}}
  .dock h2{
    font-family:var(--serif);font-size:15px;font-weight:700;letter-spacing:.3em;
    border-bottom:1px solid var(--ink);padding-bottom:12px;
    display:flex;justify-content:space-between;align-items:baseline;
  }
  .dock h2 span{font-family:var(--mono);font-size:9px;font-weight:400;color:var(--dim);letter-spacing:.2em}
  .ctl{display:flex;flex-direction:column;gap:9px}
  .ctl label{
    display:flex;justify-content:space-between;align-items:baseline;
    font-family:var(--serif);font-size:13px;letter-spacing:.22em;
  }
  .ctl label output{font-family:var(--mono);font-size:10px;color:var(--seal);letter-spacing:.08em}

  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--ink)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:11px;height:11px;margin-top:-5px;
    background:var(--seal);border:1px solid var(--ink);border-radius:0;
  }
  input[type=range]::-moz-range-track{height:1px;background:var(--ink)}
  input[type=range]::-moz-range-thumb{width:11px;height:11px;background:var(--seal);border:1px solid var(--ink);border-radius:0}

  .btns{display:flex;flex-direction:column;gap:10px;margin-top:2px}
  button{
    font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;
    padding:12px 14px;border:1px solid var(--ink);background:transparent;color:var(--ink);
    cursor:pointer;transition:all .25s var(--ease);text-align:center;
  }
  button:hover{background:var(--ink);color:var(--paper)}
  button.primary{background:var(--ink);color:var(--paper)}
  button.primary:hover{background:var(--seal);border-color:var(--seal);color:#fff}
  button:active{transform:translateY(1px)}

  .note{
    font-size:11px;line-height:2;color:var(--ink-soft);border-top:1px solid var(--line);
    padding-top:14px;letter-spacing:.04em;
  }
  .note b{font-family:var(--serif);color:var(--seal);font-weight:700}

  footer{
    padding:0 30px 30px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
    font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;
  }
</style>
</head>
<body>

<header>
  <div class="sig">
    <h1>INK FLOW <em>墨流</em></h1>
    <span class="no">N°<b>05</b> — GEN-ART / 生成式水墨山水</span>
  </div>
  <p class="tag">Fractal ridge · ink bleed · negative space<br>分形山脊 × 墨色晕染 × 留白印章</p>
</header>
<div class="rule"></div>

<main>
  <div class="stage">
    <canvas id="c"></canvas>
    <div class="stamp">墨流 · Ink Flow</div>
    <div class="hint">Click to drop ink · 点击落墨</div>
  </div>

  <aside class="dock">
    <h2>画 论<span>COLOPHON</span></h2>
    <div class="ctl">
      <label>山势 <output id="oRidge">64</output></label>
      <input type="range" id="rRidge" min="20" max="100" value="64">
    </div>
    <div class="ctl">
      <label>云雾 <output id="oMist">55</output></label>
      <input type="range" id="rMist" min="0" max="100" value="55">
    </div>
    <div class="ctl">
      <label>晕染 <output id="oBleed">60</output></label>
      <input type="range" id="rBleed" min="0" max="100" value="60">
    </div>
    <div class="btns">
      <button class="primary" id="bRegen">随机再生 · Regenerate</button>
      <button id="bSave">下载 PNG · Download</button>
    </div>
    <p class="note">远山以<b>分形中点位移</b>起笔，墨色沿山脊向下渐淡为留白；近景皴擦点苔，朱砂一方收束全卷。移指针可观层山错位，点击画面可落墨成晕。</p>
  </aside>
</main>

<footer>
  <span>Ink Flow — Generative Shan Shui</span>
  <span>Canvas 2D · Seeded · No external assets</span>
</footer>

<script>
(function(){
"use strict";

/* ---------- seeded rng ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- constants ---------- */
var RW=1680, RH=1120;               // render resolution (3:2 handscroll)
var INK="#232420", PAPER="#f4efe3", SEAL="#b03a2e";
var canvas=document.getElementById("c"), ctx=canvas.getContext("2d");
var W=0,H=0,dpr=1;

var seed=Math.floor(Math.random()*1e9);
var P={ridge:64,mist:55,bleed:60};
var layers=null;        // built offscreen layers
var mists=[];           // animated mist strips
var blots=[];           // click ink blots
var mx=.5,my=.5,tmx=.5,tmy=.5;
var t0=performance.now();
var needBuild=true;

function mkCanvas(w,h){var c=document.createElement("canvas");c.width=w;c.height=h;return c}

/* ---------- fractal ridge: midpoint displacement ---------- */
function ridgePoints(rand,n,amp,rough){
  var pts=new Float32Array(n+1),step=n,d=amp,i;
  pts[0]=(rand()-.35)*amp; pts[n]=(rand()-.35)*amp;
  while(step>1){
    for(i=step/2;i<n;i+=step){
      pts[i]=(pts[i-step/2]+pts[i+step/2])/2+(rand()*2-1)*d;
    }
    d*=rough; step=step/2;
  }
  return pts;
}

/* ---------- one mountain layer ---------- */
function paintMountain(rand,w,h,baseY,amp,alpha,rough,bleed,detail){
  var c=mkCanvas(w,h),g=c.getContext("2d"),n=256,i,x,y;
  var pts=ridgePoints(rand,n,amp,rough);
  var path=function(g2){
    g2.beginPath();
    g2.moveTo(-4,h+4);
    for(i=0;i<=n;i++){
      x=i/n*w; y=baseY+pts[i];
      g2.lineTo(x,y);
    }
    g2.lineTo(w+4,h+4); g2.closePath();
  };
  // soft bleed pass (under)
  if(bleed>0.01){
    var tmp=mkCanvas(w,h),tg=tmp.getContext("2d");
    path(tg);
    var gr=tg.createLinearGradient(0,baseY-amp,0,baseY+amp*1.9);
    gr.addColorStop(0,"rgba(35,36,32,"+(alpha*.9*bleed)+")");
    gr.addColorStop(1,"rgba(35,36,32,0)");
    tg.fillStyle=gr; tg.fill();
    g.save(); g.filter="blur("+(6+bleed*10)+"px)"; g.drawImage(tmp,0,0); g.restore();
  }
  // crisp wash fill
  path(g);
  var grd=g.createLinearGradient(0,baseY-amp,0,baseY+amp*1.75);
  grd.addColorStop(0,"rgba(35,36,32,"+alpha+")");
  grd.addColorStop(.42,"rgba(35,36,32,"+(alpha*.42)+")");
  grd.addColorStop(1,"rgba(35,36,32,0)");
  g.fillStyle=grd; g.fill();
  // ridge line accent
  g.beginPath();
  for(i=0;i<=n;i++){x=i/n*w;y=baseY+pts[i]; i===0?g.moveTo(x,y):g.lineTo(x,y)}
  g.strokeStyle="rgba(35,36,32,"+Math.min(1,alpha*1.05)+")";
  g.lineWidth=detail>0.6?2.2:1.3; g.stroke();
  // texture strokes (cun) + moss dots on nearer layers
  var k=Math.floor(90+detail*320),j,px,py,len,ang;
  g.lineWidth=1;
  for(j=0;j<k;j++){
    i=2+Math.floor(rand()*(n-4));
    px=i/n*w; py=baseY+pts[i];
    var sl=(pts[Math.min(n,i+1)]-pts[Math.max(0,i-1)])/(w/n*2);
    len=(6+rand()*34)*(.4+detail);
    ang=Math.PI/2+sl*1.2+(rand()-.5)*.5;
    g.strokeStyle="rgba(35,36,32,"+((0.04+rand()*.10)*detail+0.02)+")";
    g.beginPath(); g.moveTo(px,py+1);
    g.lineTo(px+Math.cos(ang)*len,py+Math.sin(ang)*len); g.stroke();
  }
  if(detail>0.55){
    for(j=0;j<140*detail;j++){
      i=2+Math.floor(rand()*(n-4));
      px=i/n*w; py=baseY+pts[i]+rand()*10;
      g.fillStyle="rgba(35,36,32,"+(0.10+rand()*.22)+")";
      g.beginPath(); g.arc(px,py,0.8+rand()*1.8,0,7); g.fill();
    }
  }
  return c;
}

/* ---------- scene build ---------- */
function build(){
  var rand=mulberry32(seed);
  var PAD=90, w=RW+PAD*2;
  layers={far:[],near:null,fore:null,paper:null,seal:null,sun:null,water:null};
  mists=[];

  /* paper fibre */
  var pc=mkCanvas(RW,RH),pg=pc.getContext("2d"),i;
  pg.fillStyle="#f7f3e8"; pg.fillRect(0,0,RW,RH);
  for(i=0;i<5200;i++){
    pg.fillStyle="rgba(120,110,86,"+(rand()*.05)+")";
    pg.fillRect(rand()*RW,rand()*RH,1+rand()*1.6,1+rand()*1.2);
  }
  for(i=0;i<60;i++){ // fibres
    pg.strokeStyle="rgba(120,110,86,"+(0.02+rand()*.03)+")";
    pg.lineWidth=.6;
    var fx=rand()*RW,fy=rand()*RH,fa=rand()*Math.PI;
    pg.beginPath(); pg.moveTo(fx,fy);
    pg.quadraticCurveTo(fx+Math.cos(fa)*30,fy+Math.sin(fa)*30,fx+Math.cos(fa)*70,fy+Math.sin(fa)*55);
    pg.stroke();
  }
  layers.paper=pc;

  /* pale sun */
  var sc=mkCanvas(RW,RH),sg=sc.getContext("2d");
  var sunX=RW*(.18+rand()*.64), sunY=RH*(.14+rand()*.13), sunR=26+rand()*20;
  sg.fillStyle="rgba(176,58,46,.34)";
  sg.beginPath(); sg.arc(sunX,sunY,sunR,0,7); sg.fill();
  sg.fillStyle="rgba(176,58,46,.16)";
  sg.beginPath(); sg.arc(sunX,sunY,sunR*1.35,0,7); sg.fill();
  layers.sun=sc;

  /* mountain layers far -> near */
  var rugged=P.ridge/100;
  var defs=[
    {y:.30,amp:.045,a:.16,d:0},
    {y:.40,amp:.065,a:.26,d:.15},
    {y:.50,amp:.085,a:.40,d:.35},
    {y:.61,amp:.110,a:.58,d:.6},
    {y:.72,amp:.135,a:.82,d:1}
  ];
  defs.forEach(function(dfn,idx){
    var amp=RH*dfn.amp*(0.55+rugged*0.9);
    var rough=0.42+rugged*0.24;
    var bleed=P.bleed/100*(idx<2?1.15:0.8);
    layers.far.push(paintMountain(rand,w,RH,RH*dfn.y,amp,dfn.a,rough,bleed,dfn.d));
  });

  /* water: horizontal broken strokes */
  var wc=mkCanvas(w,RH),wg=wc.getContext("2d");
  var wy0=RH*.80,j,x,len,y;
  for(j=0;j<70;j++){
    y=wy0+Math.pow(rand(),1.4)*(RH-wy0-24);
    x=rand()*w;
    len=30+rand()*190;
    wg.strokeStyle="rgba(35,36,32,"+(0.05+rand()*.10)+")";
    wg.lineWidth=.8+rand()*1;
    wg.beginPath(); wg.moveTo(x,y); wg.lineTo(x+len,y+(rand()-.5)*2); wg.stroke();
  }
  // small boat
  var bx=w*(.24+rand()*.5), by=wy0+rand()*(RH-wy0)*.45+10;
  wg.strokeStyle="rgba(35,36,32,.75)"; wg.lineWidth=2.4;
  wg.beginPath(); wg.moveTo(bx-26,by); wg.quadraticCurveTo(bx,by+12,bx+26,by); wg.stroke();
  wg.beginPath(); wg.moveTo(bx,by); wg.lineTo(bx,by-30); wg.stroke();
  wg.fillStyle="rgba(35,36,32,.55)";
  wg.beginPath(); wg.moveTo(bx+2,by-28); wg.lineTo(bx+18,by-4); wg.lineTo(bx+2,by-4); wg.closePath(); wg.fill();
  layers.water=wc;

  /* foreground: pines on nearest ridge + rocks */
  var fc=mkCanvas(w,RH),fg=fc.getContext("2d");
  function pine(px,py,s){
    var r=mulberry32(seed+px*7+py*13);
    fg.strokeStyle="rgba(35,36,32,.9)"; fg.lineWidth=2.6*s;
    fg.beginPath(); fg.moveTo(px,py); fg.lineTo(px+(r()-.5)*6*s,py-34*s); fg.stroke();
    var tiers=3+Math.floor(r()*3),t;
    for(t=0;t<tiers;t++){
      var ty=py-14*s-t*11*s, tw=(tiers-t)*11*s;
      fg.strokeStyle="rgba(35,36,32,"+(.5+r()*.3)+")";
      fg.lineWidth=1.4*s;
      for(var b=-2;b<=2;b++){
        fg.beginPath(); fg.moveTo(px,ty);
        fg.lineTo(px+b*tw/2+(r()-.5)*4*s,ty+6*s+r()*5*s); fg.stroke();
      }
    }
  }
  var trees=3+Math.floor(rand()*4);
  for(i=0;i<trees;i++){
    pine(w*(.06+rand()*.88), RH*(.72+rand()*.05)+(rand()-.5)*20, .8+rand()*1.1);
  }
  for(i=0;i<3;i++){ // rocks
    var rx=w*(.1+rand()*.8), ry=RH*.90+rand()*30, rr=18+rand()*30;
    fg.save(); fg.filter="blur(3px)";
    fg.fillStyle="rgba(35,36,32,.55)";
    fg.beginPath(); fg.ellipse(rx,ry,rr,rr*.5,0,0,7); fg.fill(); fg.restore();
    fg.fillStyle="rgba(35,36,32,.35)";
    fg.beginPath(); fg.ellipse(rx,ry-rr*.18,rr*.8,rr*.3,0,0,7); fg.fill();
  }
  // birds
  for(i=0;i<4+Math.floor(rand()*4);i++){
    var bX=w*(.15+rand()*.7), bY=RH*(.16+rand()*.2), bS=5+rand()*7;
    fg.strokeStyle="rgba(35,36,32,.6)"; fg.lineWidth=1.6;
    fg.beginPath(); fg.moveTo(bX-bS,bY); fg.quadraticCurveTo(bX-bS*.4,bY-bS*.8,bX,bY);
    fg.quadraticCurveTo(bX+bS*.4,bY-bS*.8,bX+bS,bY); fg.stroke();
  }
  layers.fore=fc;

  /* mist strips (animated) */
  var mistAmt=P.mist/100;
  [{y:.34,k:1.15},{y:.47,k:.95},{y:.585,k:.8},{y:.68,k:.6}].forEach(function(m){
    var mc=mkCanvas(w+260,140),mg=mc.getContext("2d");
    var grd=mg.createLinearGradient(0,0,0,140);
    grd.addColorStop(0,"rgba(247,243,232,0)");
    grd.addColorStop(.5,"rgba(247,243,232,"+(.85*mistAmt*m.k)+")");
    grd.addColorStop(1,"rgba(247,243,232,0)");
    mg.fillStyle=grd; mg.fillRect(0,0,w+260,140);
    mists.push({c:mc,y:RH*m.y-70,ph:rand()*6.28,sp:.12+rand()*.2});
  });

  /* inscription + seal */
  var ic=mkCanvas(RW,RH),ig=ic.getContext("2d");
  var phrase=["墨分五色","远山含黛","云水无涯","空山新雨"][Math.floor(rand()*4)];
  ig.fillStyle="rgba(35,36,32,.82)";
  ig.font="600 34px 'Songti SC','STSong',serif";
  ig.textAlign="center";
  var tx=RW-92, ty=64;
  for(i=0;i<phrase.length;i++){ ig.fillText(phrase[i],tx,ty+i*44); }
  ig.font="400 15px 'Songti SC','STSong',serif";
  ig.fillStyle="rgba(35,36,32,.55)";
  var sub="丙午墨戏";
  for(i=0;i<sub.length;i++){ ig.fillText(sub[i],tx-34,ty+18+i*22); }
  // seal
  var sSize=64, sx=tx-sSize/2, sy=ty+phrase.length*44+16;
  ig.save();
  ig.translate(sx+sSize/2,sy+sSize/2); ig.rotate((rand()-.5)*.08); ig.translate(-sSize/2,-sSize/2);
  ig.fillStyle=SEAL;
  ig.fillRect(0,0,sSize,sSize);
  ig.globalCompositeOperation="destination-out";
  for(i=0;i<130;i++){ // distress
    ig.fillStyle="rgba(0,0,0,"+(rand()*.5)+")";
    var ex=rand()<.5?rand()*sSize:(rand()<.5?rand()*6:sSize-rand()*6);
    var ey=rand()<.5?(rand()<.5?rand()*6:sSize-rand()*6):rand()*sSize;
    ig.fillRect(ex,ey,1+rand()*2.4,1+rand()*2.4);
  }
  ig.globalCompositeOperation="source-over";
  ig.fillStyle="#f7f3e8";
  ig.font="700 26px 'Songti SC','STSong',serif";
  ig.fillText("墨",sSize/2,sSize/2-4);
  ig.fillText("流",sSize/2,sSize/2+26);
  ig.restore();
  layers.seal=ic;

  blots=[];
  needBuild=false;
}

/* ---------- composite ---------- */
function drawScene(g,w,h,parallax,time){
  var sx=w/RW, sy=h/RH;
  g.save(); g.scale(sx,sy);
  g.drawImage(layers.paper,0,0);
  g.drawImage(layers.sun,0,0);
  var PAD=90;
  var i,off;
  for(i=0;i<layers.far.length;i++){
    var depth=(i+1)/layers.far.length;
    off=parallax? (mx-.5)*44*depth : 0;
    var offY=parallax? (my-.5)*10*depth : 0;
    g.drawImage(layers.far[i],-PAD+off,offY);
  }
  // animated mist
  mists.forEach(function(m,idx){
    var depth=(idx+1.5)/(mists.length+1);
    var drift=Math.sin(time*m.sp+m.ph)*26;
    var px=parallax? (mx-.5)*40*depth : 0;
    g.drawImage(m.c,-PAD-130+drift+px,m.y);
  });
  off=parallax? (mx-.5)*52 : 0;
  g.drawImage(layers.water,-PAD+off,parallax?(my-.5)*12:0);
  g.drawImage(layers.fore,-PAD+off*1.15,parallax?(my-.5)*14:0);
  // click ink blots
  blots.forEach(function(b){
    var r=b.r;
    var grd=g.createRadialGradient(b.x,b.y,0,b.x,b.y,r);
    grd.addColorStop(0,"rgba(35,36,32,"+b.a+")");
    grd.addColorStop(.7,"rgba(35,36,32,"+(b.a*.5)+")");
    grd.addColorStop(1,"rgba(35,36,32,0)");
    g.fillStyle=grd;
    g.beginPath(); g.arc(b.x,b.y,r,0,7); g.fill();
  });
  g.drawImage(layers.seal,0,0);
  g.restore();
}

/* ---------- main loop ---------- */
function frame(now){
  var time=(now-t0)/1000;
  mx+=(tmx-mx)*.06; my+=(tmy-my)*.06;
  blots.forEach(function(b){ if(b.r<b.max){b.r+=(b.max-b.r)*.05;} });
  drawScene(ctx,W,H,true,time);
  requestAnimationFrame(frame);
}

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  var r=canvas.getBoundingClientRect();
  W=r.width; H=r.height;
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize",resize);

/* ---------- events ---------- */
var stage=canvas.parentElement;
stage.addEventListener("pointermove",function(e){
  var r=stage.getBoundingClientRect();
  tmx=(e.clientX-r.left)/r.width; tmy=(e.clientY-r.top)/r.height;
});
stage.addEventListener("pointerleave",function(){tmx=.5;tmy=.5});
stage.addEventListener("pointerdown",function(e){
  var r=stage.getBoundingClientRect();
  var x=(e.clientX-r.left)/r.width*RW, y=(e.clientY-r.top)/r.height*RH;
  if(blots.length>24)blots.shift();
  blots.push({x:x,y:y,r:2,max:26+Math.random()*70,a:.14+Math.random()*.2});
});

function bindRange(id,out,key){
  var el=document.getElementById(id),o=document.getElementById(out);
  el.addEventListener("input",function(){
    P[key]=+el.value; o.textContent=el.value;
    if(!needBuild){needBuild=true;
      requestAnimationFrame(function(){build()});
    }
  });
}
bindRange("rRidge","oRidge","ridge");
bindRange("rMist","oMist","mist");
bindRange("rBleed","oBleed","bleed");

document.getElementById("bRegen").addEventListener("click",function(){
  seed=Math.floor(Math.random()*1e9);
  build();
});
document.getElementById("bSave").addEventListener("click",function(){
  var ex=mkCanvas(RW,RH),eg=ex.getContext("2d");
  drawScene(eg,RW,RH,false,1.2);
  var a=document.createElement("a");
  a.download="ink-flow-"+seed+".png";
  a.href=ex.toDataURL("image/png");
  a.click();
});

/* ---------- go ---------- */
build(); resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
