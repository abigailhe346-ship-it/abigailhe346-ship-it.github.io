<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noise Couture — 罂粟印花坊 · Atelier MIRA</title>
<style>
  :root{
    --paper:#EDE8D8; --panel:#E7E1CF; --line:#CFC6AC;
    --ink:#4A4636; --dim:#96907C;
    --meadow:#B7C98B; --grass:#7A9A5B; --sky:#8FA3B8;
    --path:#E4D9C2; --earth:#6B5D4F; --poppy:#B43A2E;
    --mono:"SF Mono",Menlo,Consolas,monospace;
    --serif:Didot,"Bodoni MT",Georgia,"Songti SC",serif;
    --sans:-apple-system,"Helvetica Neue","PingFang SC",sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--paper)}
  body{color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  ::selection{background:var(--grass);color:var(--paper)}

  header{
    display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;
    padding:20px clamp(18px,4vw,44px) 14px;
  }
  .brand{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  .back{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-decoration:none;transition:color .4s var(--ease)}
  .back:hover{color:var(--ink)}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(26px,3.4vw,40px);letter-spacing:-.01em;line-height:1}
  h1 em{font-style:italic;color:var(--poppy)}
  .epig{font-family:var(--serif);font-style:italic;font-size:14.5px;color:#7A7257;max-width:340px;line-height:1.5}
  .idx{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}

  .stage-wrap{padding:0 clamp(18px,4vw,44px) 26px}
  .stage{
    position:relative;height:min(76vh,720px);min-height:430px;border-radius:3px;overflow:hidden;
    background:var(--path);box-shadow:0 1px 0 var(--line),0 18px 50px -30px rgba(107,93,79,.55);
    cursor:none;
  }
  canvas{display:block;width:100%;height:100%}

  .etudes{position:absolute;top:14px;left:14px;display:flex;gap:8px;flex-wrap:wrap;z-index:4;transition:opacity .5s var(--ease)}
  .etudes button{
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink);
    background:rgba(237,232,216,.75);border:1px solid rgba(74,70,54,.3);border-radius:2px;
    padding:7px 12px;cursor:pointer;backdrop-filter:blur(3px);transition:all .45s var(--ease);
  }
  .etudes button:hover{background:rgba(237,232,216,.95);transform:translateY(-1px)}
  .etudes button.on{background:var(--grass);color:var(--paper);border-color:var(--grass)}

  .sndbtn{
    position:absolute;top:14px;right:14px;z-index:4;width:34px;height:34px;border-radius:2px;
    border:1px solid rgba(74,70,54,.3);background:rgba(237,232,216,.75);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .45s var(--ease);
  }
  .sndbtn:hover{background:rgba(237,232,216,.95)}
  .sndbtn svg{width:17px;height:17px;stroke:var(--ink);fill:none;stroke-width:1.5;stroke-linecap:round}
  .sndbtn .waves{opacity:0;transition:opacity .4s}
  .sndbtn.on .waves{opacity:1}
  .sndbtn.on .slash{opacity:0}
  .sndbtn .slash{transition:opacity .4s}

  .sig{position:absolute;left:14px;bottom:52px;z-index:4;display:flex;align-items:center;gap:9px;opacity:.68;user-select:none}
  .sig svg{width:20px;height:13px}
  .sig span{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink)}

  .note{
    position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);z-index:5;
    font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink);
    background:rgba(231,225,207,.94);border:1px solid var(--line);border-radius:2px;
    padding:12px 20px;opacity:0;pointer-events:none;transition:all .8s var(--ease);
    max-width:82%;text-align:center;
  }
  .note.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .hint{
    position:absolute;right:16px;bottom:52px;z-index:4;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--ink);opacity:.5;
    transition:opacity 1.2s var(--ease);pointer-events:none;
  }
  .hint.gone{opacity:0}

  .lume{
    position:absolute;left:0;right:0;bottom:0;z-index:4;height:40px;
    display:flex;align-items:center;gap:12px;padding:0 16px;
    background:linear-gradient(to top,rgba(237,232,216,.92),rgba(237,232,216,0));
    transition:opacity .5s var(--ease);
  }
  .lume .lab{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--dim);white-space:nowrap}
  .lume .track{position:relative;flex:1;height:22px;cursor:ew-resize;touch-action:none}
  .lume .track::before{
    content:"";position:absolute;left:0;right:0;top:50%;height:2px;transform:translateY(-50%);
    background:linear-gradient(90deg,#9AA7B8,#C9CDD6,#EDE8D8,#F4E3C2,#E8B96F,#8E7BA8,#4E4A6B);
    border-radius:1px;opacity:.65;
  }
  .lume .thumb{
    position:absolute;top:50%;width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#F4E3C2,#D98E4A);
    border:1.5px solid rgba(74,70,54,.5);transform:translate(-50%,-50%);
    box-shadow:0 2px 8px rgba(74,70,54,.3);pointer-events:none;
  }
  .lume .heure{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink);min-width:52px;text-align:right}
  .hideme .etudes,.hideme .lume,.hideme .sig,.hideme .hint{opacity:0;pointer-events:none}

  .mseal{width:36px;height:36px;flex:none;align-self:center}
  .brand{align-items:center}
  .deck{position:absolute;top:56px;right:14px;z-index:4;width:178px;padding:11px 12px 12px;background:rgba(237,232,216,.78);border:1px solid rgba(107,93,79,.3);border-radius:2px;backdrop-filter:blur(3px);display:flex;flex-direction:column;gap:9px;transition:opacity .5s var(--ease)}
  .deck .dh{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:var(--dim);display:flex;justify-content:space-between}
  .deck .dh b{color:#B43A2E;font-weight:400}
  .dctl label{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--ink)}
  .dctl output{color:#B43A2E}
  .dctl input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;background:transparent;cursor:pointer;margin-top:2px}
  .dctl input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--ink)}
  .dctl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:10px;height:10px;margin-top:-4.5px;background:var(--paper);border:1px solid var(--ink);border-radius:50%;box-shadow:1.5px 1.5px 0 #B43A2E}
  .dctl input[type=range]::-moz-range-track{height:1px;background:var(--ink)}
  .dctl input[type=range]::-moz-range-thumb{width:10px;height:10px;background:var(--paper);border:1px solid var(--ink);border-radius:50%}
  .dbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;border-top:1px solid rgba(107,93,79,.18);padding-top:8px}
  .dbtns button{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--ink);background:rgba(237,232,216,.6);border:1px solid rgba(107,93,79,.4);border-radius:2px;padding:6px 2px;cursor:pointer;transition:all .4s var(--ease)}
  .dbtns button:hover{background:#B43A2E;color:var(--paper);border-color:#B43A2E}
  .loupe{position:absolute;width:132px;height:132px;border-radius:50%;overflow:hidden;pointer-events:none;opacity:0;z-index:6;border:1px solid var(--ink);box-shadow:0 10px 26px rgba(74,66,50,.35),inset 0 0 0 1px rgba(237,232,216,.6);background:#EDE8D8;transform:translate(-50%,-58%);transition:opacity .3s var(--ease)}
  .loupe.on{opacity:1}
  .loupe canvas{display:block;width:100%;height:100%}
  .hideme .deck{opacity:0;pointer-events:none}
  @media (max-width:640px){.deck{display:none}.loupe{display:none}}
  footer{padding:0 clamp(18px,4vw,44px) 30px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
  footer p{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  @media (max-width:640px){
    .stage{height:66vh;min-height:400px;cursor:crosshair}
    .epig{max-width:100%}
    .hint{display:none}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg class="mseal" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true">
      <circle cx="48" cy="48" r="45" fill="none" stroke="#B43A2E" stroke-width="1.4"/>
      <circle cx="48" cy="48" r="38.5" fill="none" stroke="#B43A2E" stroke-width=".7" opacity=".55"/>
      <path id="sealArcN" d="M48,48 m-32.5,0 a32.5,32.5 0 1,1 65,0 a32.5,32.5 0 1,1 -65,0" fill="none"/>
      <text font-family="SF Mono,Menlo,monospace" font-size="8.4" letter-spacing="1.6" fill="#B43A2E">
        <textPath xlink:href="#sealArcN" href="#sealArcN" startOffset="0" textLength="203" lengthAdjust="spacingAndGlyphs">ATELIER MIRA · ATELIER MIRA · </textPath>
      </text>
      <path d="M31 64 C30 54,31 42,34 33 C38.5 41,43 51,48 57.5 C53 51,57.5 41,62 33 C65 42,66 54,65 64"
            fill="none" stroke="#B43A2E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M33 63 C32.5 55,33 45,35.5 37" fill="none" stroke="#B43A2E" stroke-width="1.1" stroke-linecap="round" opacity=".45"/>
    </svg>
    <a class="back" href="../../../index.html#work">← Archive</a>
    <h1>Noise <em>Couture</em></h1>
  </div>
  <p class="epig">四月的风穿过麦田，颜色比麦子先到。</p>
  <span class="idx">ÉTUDE <b style="color:#B43A2E;font-weight:400">N°15/100</b> · 印花制衣间 · GEN-ART</span>
</header>

<div class="stage-wrap">
  <div class="stage" id="stage">
    <canvas id="cloth"></canvas>

    <div class="etudes" id="etudes">
      <button data-m="fleurs">大花</button>
      <button data-m="treillis">细格</button>
      <button data-m="semis">散点</button>
    </div>

    <button class="sndbtn" id="snd" aria-label="声景开关" title="声景（默认关闭）">
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="waves" d="M16.5 8.5c1.6 1.8 1.6 5.2 0 7M19 6.5c2.6 3 2.6 8 0 11"/><path class="slash" d="M17 9l5 6M22 9l-5 6"/></svg>
    </button>

    <div class="sig" id="sig">
      <svg viewBox="0 0 64 40" fill="#6B5D4F" aria-hidden="true">
        <path d="M32 20 C 26 12, 14 6, 4 8 C 12 12, 18 18, 24 21
                 C 14 20, 6 22, 2 28 C 10 26, 18 26, 25 26
                 C 27 30, 30 34, 34 36 C 33 32, 33 28, 34 25
                 C 42 22, 52 16, 62 4 C 54 10, 44 16, 36 19
                 C 35 17, 33 17, 32 20 Z"/>
      </svg>
      <span>Atelier MIRA · N°015 · Champ de Coquelicots</span>
    </div>

    <div class="hint" id="hint">按住拖动，手里是一块印花版</div>
    <div class="note" id="note">四月九日。罂粟只能点着印——一大片红是喧哗，一点点红才是花。</div>

    <div class="deck" id="deck">
      <div class="dh">画室台 · STUDIO <b id="deckSeed">0409</b></div>
      <div class="dctl"><label>花径 · Motif<output id="oMotif">1.00×</output></label><input type="range" id="rMotif" min="60" max="170" value="100"></div>
      <div class="dctl"><label>密度 · Density<output id="oDens">1.00×</output></label><input type="range" id="rDens" min="55" max="170" value="100"></div>
      <div class="dctl"><label>褶影 · Folds<output id="oFold">1.00×</output></label><input type="range" id="rFold" min="0" max="180" value="100"></div>
      <div class="dbtns"><button id="btnRegen">再生</button><button id="btnShare">链接</button></div>
      <div class="dbtns" style="border-top:0;padding-top:0"><button id="btnSave" style="grid-column:1/-1">下载 PNG</button></div>
    </div>
    <div class="loupe" id="loupe"><canvas id="loupeCv" width="264" height="264"></canvas></div>

    <div class="lume">
      <span class="lab">光 · HEURE</span>

      <span class="heure" id="heureOut">—</span>
    </div>
  </div>
</div>

<footer>
  <p>点彩为经，碎色为纬 · 布在印，花在开</p>
  <p id="colo">Canvas 2D · pointillist weave · seed 0409 · Painted with code, plein air</p>
</footer>

<script>
(function(){
"use strict";
/* ---------- palette: Champ de Coquelicots 罂粟田（阿让特伊的夏午，罂粟红 ≤10% 点状） ---------- */
const PAL={
  paper:[237,232,216], meadow:[183,201,139], grass:[122,154,91],
  sky:[143,163,184], path:[228,217,194], earth:[107,93,79], poppy:[180,58,46]
};
const cvs=document.getElementById('cloth'),ctx=cvs.getContext('2d');
const stage=document.getElementById('stage');
let W=0,H=0,DPR=1;
let seed=409;
const seedM=location.hash.match(/seed=([0-9A-Fa-f]{1,6})/);if(seedM)seed=parseInt(seedM[1],16);
let seed0=seed;
function seedHex(){return seed0.toString(16).toUpperCase().padStart(4,"0")}
function syncHash2(){history.replaceState(null,"","#seed="+seedHex()+"&h="+heure.toFixed(1)+"&m="+mode)}
function srand(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646}

/* ---------- heure 时间系统 ---------- */
let heure=new Date().getHours()+new Date().getMinutes()/60;
const hh=location.hash.match(/h=([\d.]+)/);if(hh)heure=parseFloat(hh[1])%24;
const KEYS=[ // h, tint, tintA, warm, warmA, light
  [0,  [78,74,107],.3,[142,123,168],.04,.18],
  [5,  [154,167,184],.22,[216,203,184],.08,.45],
  [8,  [201,205,200],.07,[240,234,214],.06,.75],
  [12, [237,232,216],.03,[248,242,224],.06,1.0],
  [16, [240,222,180],.08,[248,232,196],.1,.88],
  [18.5,[222,152,80],.18,[238,190,112],.2,.62],
  [20.5,[110,120,138],.24,[201,166,160],.08,.34],
  [24, [78,74,107],.3,[142,123,168],.04,.18]
];
function lightAt(h){
  h=((h%24)+24)%24;let i=0;while(i<KEYS.length-2&&KEYS[i+1][0]<h)i++;
  const a=KEYS[i],b=KEYS[i+1],t=Math.min(1,Math.max(0,(h-a[0])/(b[0]-a[0]||1)));
  const L=(x,y)=>x+(y-x)*t,mix3=(u,v)=>[L(u[0],v[0]),L(u[1],v[1]),L(u[2],v[2])];
  return {tint:mix3(a[1],b[1]),tintA:L(a[2],b[2]),warm:mix3(a[3],b[3]),warmA:L(a[4],b[4]),light:L(a[5],b[5])};
}

/* ---------- 布底（离屏一次）：点彩织纹 + 纤维 ---------- */
let clothC=null;
function makeCloth(){
  seed=seed0;   /* 织纹也从种子出发,resize 后可复现 */
  clothC=document.createElement('canvas');clothC.width=Math.max(2,W*DPR/2);clothC.height=Math.max(2,H*DPR/2);
  const p=clothC.getContext('2d');p.scale(DPR/2,DPR/2);
  p.fillStyle=`rgb(${PAL.path})`;p.fillRect(0,0,W,H);
  // 点彩织纹：草绿双色交替细点，眼睛自己混色（divisionism）
  const step=5;
  for(let y=0;y<H;y+=step)for(let x=0;x<W;x+=step){
    const odd=((x/step|0)+(y/step|0))%2;
    const c=odd?PAL.meadow:PAL.grass;
    const j=(srand()-.5)*22;
    p.fillStyle=`rgba(${c[0]+j|0},${c[1]+j|0},${c[2]+j|0},${(.34+srand()*.26).toFixed(2)})`;
    p.fillRect(x+srand()*2,y+srand()*2,2.2,2.2);
  }
  // 纤维
  p.strokeStyle='rgba(107,93,79,.06)';p.lineWidth=.6;
  for(let i=0;i<130;i++){
    p.beginPath();const x=srand()*W,y=srand()*H,a=(srand()-.5)*.5;
    p.moveTo(x,y);p.lineTo(x+Math.cos(a)*(24+srand()*80),y+Math.sin(a)*6);p.stroke();
  }
  // 布边：底部折边
  p.strokeStyle='rgba(107,93,79,.25)';p.lineWidth=1;
  p.beginPath();p.moveTo(0,H-14);p.lineTo(W,H-14);p.stroke();
  for(let x=0;x<W;x+=9){p.beginPath();p.moveTo(x,H-14);p.lineTo(x+3,H-9);p.stroke()}
}

/* ---------- 颗粒 12fps ---------- */
let grainC=document.createElement('canvas');grainC.width=grainC.height=128;
function makeGrain(){
  const g=grainC.getContext('2d'),im=g.createImageData(128,128);
  for(let i=0;i<im.data.length;i+=4){const v=110+Math.random()*40;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=13}
  g.putImageData(im,0,0);
}
makeGrain();setInterval(makeGrain,83);

/* ---------- 印花层（持久离屏） + 待印队列 ---------- */
let printC=document.createElement('canvas'),printX=null;
let queue=[]; // {dots, i, born} dots: 预生成的相对点 [{x,y,c,r,a}]
function motifPoppy(s){
  const dots=[],petals=6;
  for(let pt=0;pt<petals;pt++){
    const a=pt/petals*Math.PI*2+srand()*.4;
    for(let k=0;k<17;k++){
      const rr=(0.2+k/17*.8)*s,aa=a+(srand()-.5)*.62;
      dots.push({x:Math.cos(aa)*rr,y:Math.sin(aa)*rr*.9,
        c:PAL.poppy,r:1.4+srand()*1.8,a:.8+srand()*.15});
    }
  }
  for(let k=0;k<10;k++){ // 花心：泥土
    dots.push({x:(srand()-.5)*s*.34,y:(srand()-.5)*s*.34,c:PAL.earth,r:1.1+srand()*1.4,a:.92});
  }
  return dots;
}
function motifLeaf(s){
  const dots=[],n=9;
  for(let k=0;k<n;k++){
    const rr=k/n*s*1.4;
    dots.push({x:rr,y:-rr*.35,c:srand()<.5?PAL.grass:PAL.meadow,r:1.6+srand()*1.6,a:.9});
    dots.push({x:rr,y:-rr*.35-3-k,c:PAL.grass,r:1.2+srand()*1.2,a:.75});
  }
  return dots;
}
function motifSky(s){
  const dots=[];
  for(let k=0;k<5;k++)dots.push({x:(srand()-.5)*s*1.6,y:(srand()-.5)*s*1.2,c:PAL.sky,r:1.1+srand(),a:.55});
  return dots;
}
function queueMotif(x,y,type,s,delay){
  const src=type==='poppy'?motifPoppy(s):type==='leaf'?motifLeaf(s):motifSky(s);
  // 洗牌让点随机出现（印刷感）
  for(let i=src.length-1;i>0;i--){const j=(srand()*(i+1))|0;[src[i],src[j]]=[src[j],src[i]]}
  queue.push({x,y,rot:(srand()-.5)*.7,dots:src,i:0,born:performance.now()+(delay||0)*16.7});
}

/* ---------- 练习曲：整布重印（即时落版 + 刮刀扫过） ---------- */
let mode='fleurs',sweepX=-1;
const studio={motifK:1,densK:1,foldK:1};
const mhash=location.hash.match(/m=(\w+)/);if(mhash)mode=mhash[1];
function stampAll(x,y,type,s){ // 立即印完整枚（初始布面=已经在印的作品）
  s*=studio.motifK;
  const src=type==='poppy'?motifPoppy(s):type==='leaf'?motifLeaf(s):motifSky(s);
  const rot=(srand()-.5)*.7,cs=Math.cos(rot),sn=Math.sin(rot);
  for(const d of src){
    const dx=x+d.x*cs-d.y*sn,dy=y+d.x*sn+d.y*cs;
    const j=(srand()-.5)*10;
    printX.fillStyle=`rgba(${d.c[0]+j|0},${d.c[1]+j|0},${d.c[2]+j|0},${d.a})`;
    printX.beginPath();printX.arc(dx,dy,d.r,0,7);printX.fill();
  }
}
function reprint(){
  printX.clearRect(0,0,W,H);queue=[];seed=seed0;sweepX=0;
  if(mode==='fleurs'){
    const gx=W/(4.2*studio.densK),gy=H/(3.2*studio.densK);let row=0;
    for(let y=gy*.55;y<H-20;y+=gy,row++)
      for(let x=gx*.5+(row%2?gx*.5:0);x<W-10;x+=gx){
        stampAll(x+(srand()-.5)*30,y+(srand()-.5)*24,'poppy',16+srand()*8);
        if(srand()<.6)stampAll(x+26,y+18,'leaf',10+srand()*6);
        if(srand()<.25)stampAll(x-30,y-16,'sky',8);
      }
  }else if(mode==='treillis'){
    const g=Math.min(W,H)/(7.5*studio.densK);let row=0;
    for(let y=g*.5;y<H-16;y+=g,row++)
      for(let x=g*.5+(row%2?g*.5:0);x<W-8;x+=g){
        stampAll(x,y,'poppy',8.5+srand()*3);
        if((x/g|0)%3===0)stampAll(x+g*.4,y+g*.3,'leaf',6);
      }
  }else{ // semis 散点
    for(let k=0;k<Math.round(26*studio.densK);k++){
      const x=W*(.06+srand()*.88),y=H*(.08+srand()*.8);
      stampAll(x,y,'poppy',9+srand()*9);
      if(srand()<.7)stampAll(x+18,y+12,'leaf',7+srand()*5);
    }
    for(let k=0;k<10;k++)stampAll(W*srand(),H*srand(),'sky',8);
  }
}

/* ---------- 指针：阻尼跟随的印花版（L1） ---------- */
let px=-999,py=-999,ptx=-999,pty=-999,spd=0,spdSm=0,pressing=false,lastStamp=0;
stage.addEventListener('pointermove',e=>{
  const r=stage.getBoundingClientRect();ptx=e.clientX-r.left;pty=e.clientY-r.top;
});
stage.addEventListener('pointerleave',()=>{ptx=-999;pty=-999;pressing=false});
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('button')||e.target.closest('.lume')||e.target.closest('.sig'))return;
  pressing=true;
  const r=stage.getBoundingClientRect();
  stampAll(e.clientX-r.left,e.clientY-r.top,'poppy',13+Math.random()*7);
  document.getElementById('hint').classList.add('gone');
  if(sound.on)sound.thump();
});
stage.addEventListener('pointerup',()=>pressing=false);

/* ---------- 声景（L5）：笔触沙沙 = 噪声以指针速度为门限 + 微风 ---------- */
const sound={on:false,ctx:null,master:null,brushG:null,
  init(){if(this.ctx)return;
    const C=this.ctx=new (window.AudioContext||window.webkitAudioContext)();
    const M=this.master=C.createGain();M.gain.value=0;M.connect(C.destination);
    const len=2*C.sampleRate,buf=C.createBuffer(1,len,C.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    // 风
    const w=C.createBufferSource();w.buffer=buf;w.loop=true;w.playbackRate.value=.5;
    const bp=C.createBiquadFilter();bp.type='bandpass';bp.frequency.value=520;bp.Q.value=.9;
    const wg=C.createGain();wg.gain.value=.08;w.connect(bp);bp.connect(wg);wg.connect(M);w.start();
    // 笔触沙沙：highpass 白噪，门限=指针速度
    const b=C.createBufferSource();b.buffer=buf;b.loop=true;
    const hp=C.createBiquadFilter();hp.type='highpass';hp.frequency.value=1800;
    const bg=C.createGain();bg.gain.value=0;b.connect(hp);hp.connect(bg);bg.connect(M);b.start();
    this.brushG=bg;
  },
  thump(){const C=this.ctx;if(!C)return;const t=C.currentTime;
    const o=C.createOscillator(),g=C.createGain();
    o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(70,t+.07);
    g.gain.setValueAtTime(.09,t);g.gain.exponentialRampToValueAtTime(.0001,t+.1);
    o.connect(g);g.connect(this.master);o.start(t);o.stop(t+.12)},
  toggle(){this.on=!this.on;
    if(this.on){this.init();this.ctx.resume();const t=this.ctx.currentTime;
      this.master.gain.cancelScheduledValues(t);this.master.gain.setValueAtTime(0,t);
      this.master.gain.linearRampToValueAtTime(1,t+1.5);}
    else if(this.ctx){const t=this.ctx.currentTime;
      this.master.gain.cancelScheduledValues(t);this.master.gain.linearRampToValueAtTime(0,t+.6);
      if(this.brushG)this.brushG.gain.value=0;}
    localStorage.setItem('mira-sound',this.on?'1':'0');
    document.getElementById('snd').classList.toggle('on',this.on);}
};
document.getElementById('snd').addEventListener('click',e=>{e.stopPropagation();sound.toggle()});
if(localStorage.getItem('mira-sound')==='1'){const arm=()=>{sound.toggle();removeEventListener('pointerdown',arm)};addEventListener('pointerdown',arm)}

/* ---------- lume ---------- */
const lume=document.getElementById('lume'),thumb=document.getElementById('thumb'),heureOut=document.getElementById('heureOut');
let lumeDrag=false;
function lumeSet(e){const r=lume.getBoundingClientRect();
  heure=Math.min(24,Math.max(0,(e.clientX-r.left)/r.width*24));syncHash()}
lume.addEventListener('pointerdown',e=>{lumeDrag=true;lume.setPointerCapture(e.pointerId);lumeSet(e);e.stopPropagation()});
lume.addEventListener('pointermove',e=>{if(lumeDrag)lumeSet(e)});
lume.addEventListener('pointerup',()=>lumeDrag=false);
function syncHash(){syncHash2()}

document.getElementById('etudes').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  mode=b.dataset.m;
  document.querySelectorAll('.etudes button').forEach(x=>x.classList.toggle('on',x===b));
  reprint();syncHash();
  if(sound.on)sound.thump();
});
document.querySelector(`.etudes button[data-m="${mode}"]`)?.classList.add('on');

/* ---------- 落款三下 · H 键 ---------- */
let sigClicks=0,sigTimer=null;
document.getElementById('sig').addEventListener('click',()=>{
  sigClicks++;clearTimeout(sigTimer);sigTimer=setTimeout(()=>sigClicks=0,900);
  if(sigClicks>=3){sigClicks=0;const n=document.getElementById('note');
    n.classList.add('show');setTimeout(()=>n.classList.remove('show'),5200);}
});
addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||""))return;
  if(e.key==='h'||e.key==='H')stage.classList.toggle('hideme');
  if(e.key==='e'||e.key==='E')document.getElementById('btnSave').click();
  if(e.key==='g'||e.key==='G')document.getElementById('btnRegen').click();
  if(e.key==='m'||e.key==='M'){
    const order=['fleurs','treillis','semis'];
    mode=order[(order.indexOf(mode)+1)%3];
    document.querySelectorAll('.etudes button').forEach(x=>x.classList.toggle('on',x.dataset.m===mode));
    reprint();syncHash();return;
  }
  const map={'1':'fleurs','2':'treillis','3':'semis'};
  if(map[e.key]){mode=map[e.key];
    document.querySelectorAll('.etudes button').forEach(x=>x.classList.toggle('on',x.dataset.m===mode));
    reprint();syncHash();}
});

/* ---------- 画室台 ---------- */
document.getElementById('rMotif').addEventListener('input',function(){
  studio.motifK=this.value/100;
  document.getElementById('oMotif').textContent=studio.motifK.toFixed(2)+"×";reprint();
});
document.getElementById('rDens').addEventListener('input',function(){
  studio.densK=this.value/100;
  document.getElementById('oDens').textContent=studio.densK.toFixed(2)+"×";reprint();
});
document.getElementById('rFold').addEventListener('input',function(){
  studio.foldK=this.value/100;
  document.getElementById('oFold').textContent=studio.foldK.toFixed(2)+"×";
});
document.getElementById('btnRegen').addEventListener('click',function(){
  seed0=Math.floor(Math.random()*65536);
  makeCloth();reprint();
  document.getElementById('deckSeed').textContent=seedHex();
  document.getElementById('colo').textContent="Canvas 2D · pointillist weave · seed "+seedHex()+" · Painted with code, plein air";
  syncHash2();
  if(sound.on)sound.thump();
});
document.getElementById('btnShare').addEventListener('click',function(){
  const url=location.origin+location.pathname+"#seed="+seedHex()+"&h="+heure.toFixed(1)+"&m="+mode;
  const b=this,ok=()=>{b.textContent="已复制";setTimeout(()=>b.textContent="链接",1600)};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(ok,ok);else ok();
});
document.getElementById('btnSave').addEventListener('click',function(){
  const a=document.createElement('a');
  a.download="noise-couture-"+seedHex().toLowerCase()+"-"+mode+".png";
  a.href=cvs.toDataURL("image/png");a.click();
});

/* ---------- 验布镜 loupe ---------- */
const loupe=document.getElementById('loupe'),lctx=document.getElementById('loupeCv').getContext('2d');
let loupeT=null,lx=0,ly=0,lIn=false;
stage.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch')return;
  const r=stage.getBoundingClientRect();lx=e.clientX-r.left;ly=e.clientY-r.top;lIn=true;
  clearTimeout(loupeT);loupeT=setTimeout(()=>loupe.classList.add('on'),240);
});
stage.addEventListener('pointerleave',()=>{lIn=false;clearTimeout(loupeT);loupe.classList.remove('on')});
function updateLoupe(){
  if(!loupe.classList.contains('on')||!lIn)return;
  const r=stage.getBoundingClientRect();
  loupe.style.left=lx+"px";loupe.style.top=ly+"px";
  const zoom=2.4,sw=264/zoom/DPR;
  lctx.clearRect(0,0,264,264);
  lctx.drawImage(cvs,(lx-sw/2)*DPR,(ly-sw/2)*DPR,sw*DPR,sw*DPR,0,0,264,264);
}

/* ---------- resize ---------- */
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=stage.clientWidth;H=stage.clientHeight;
  cvs.width=W*DPR;cvs.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  printC.width=W*DPR;printC.height=H*DPR;
  printX=printC.getContext('2d');printX.setTransform(DPR,0,0,DPR,0,0);
  makeCloth();reprint();
}
addEventListener('resize',resize);resize();
document.getElementById('deckSeed').textContent=seedHex();
document.getElementById('colo').textContent="Canvas 2D · pointillist weave · seed "+seedHex()+" · Painted with code, plein air";
syncHash2();

/* ---------- 主循环 ---------- */
let t=0;
function frame(){
  t+=.008;
  // 印花版阻尼跟随
  if(ptx>-100){
    const nx=px+(ptx-px)*.11,ny=py+(pty-py)*.11;
    spd=Math.hypot(nx-px,ny-py);px=nx;py=ny;
  }else spd=0;
  spdSm=spdSm*.9+spd*.1;
  // 笔触沙沙门限（L5.4）
  if(sound.on&&sound.brushG)
    sound.brushG.gain.value=Math.min(.12,spdSm*.006)*(pressing?1.6:1);
  // 按住拖动 = 手工印花
  if(pressing&&ptx>-100&&spdSm>2.2){
    const now=performance.now();
    if(now-lastStamp>150){
      lastStamp=now;
      const sc=11+Math.min(10,spdSm*.4)+Math.random()*4;
      queueMotif(px+(Math.random()-.5)*14,py+(Math.random()-.5)*14,'poppy',sc,0);
      if(Math.random()<.3)queueMotif(px+20,py+12,'leaf',8,0);
    }
  }
  const L=lightAt(heure);

  // 布底 + 印花层
  ctx.drawImage(clothC,0,0,W,H);
  ctx.drawImage(printC,0,0,W,H);

  // 待印队列：按墙钟进度落点（印刷进行时的表演，截图/低帧率下也不丢进度）
  const nowMs=performance.now();
  for(const m of queue){
    if(nowMs<m.born)continue;
    const target=Math.min(m.dots.length,Math.floor((nowMs-m.born)/5.5));
    const cs=Math.cos(m.rot),sn=Math.sin(m.rot);
    for(;m.i<target;m.i++){
      const d=m.dots[m.i];
      const x=m.x+d.x*cs-d.y*sn,y=m.y+d.x*sn+d.y*cs;
      const j=(Math.random()-.5)*10;
      printX.fillStyle=`rgba(${d.c[0]+j|0},${d.c[1]+j|0},${d.c[2]+j|0},${d.a})`;
      printX.beginPath();printX.arc(x,y,d.r,0,7);printX.fill();
    }
  }
  queue=queue.filter(m=>m.i<m.dots.length||nowMs<m.born);

  // 刮刀扫过（重印/换练习曲时）
  if(sweepX>=0){
    sweepX+=W/38;
    const g=ctx.createLinearGradient(sweepX-90,0,sweepX+10,0);
    g.addColorStop(0,'rgba(255,252,240,0)');
    g.addColorStop(.8,'rgba(255,252,240,.34)');
    g.addColorStop(1,'rgba(255,252,240,0)');
    ctx.fillStyle=g;ctx.fillRect(sweepX-90,0,100,H);
    if(sweepX>W+100)sweepX=-1;
  }

  // 布褶光影：正弦褶皱（阴影带色温：偏蓝的灰，不是黑）
  const foldPh=t*.6;
  for(let x=0;x<W;x+=4){
    const f=Math.sin(x/W*Math.PI*3.2+foldPh)*.5+Math.sin(x/W*Math.PI*7.1-foldPh*.7)*.25;
    if(f<0)ctx.fillStyle=`rgba(110,123,140,${(-f*.14*studio.foldK).toFixed(3)})`;
    else ctx.fillStyle=`rgba(255,252,240,${(f*.10*studio.foldK).toFixed(3)})`;
    ctx.fillRect(x,0,4,H);
  }

  // 印花版（指针幻影）
  if(ptx>-100&&matchMedia('(pointer:fine)').matches){
    ctx.save();ctx.translate(px,py);
    ctx.strokeStyle=`rgba(74,70,54,${pressing?.85:.45})`;
    ctx.lineWidth=1.4;
    const bs=pressing?16:20;
    ctx.strokeRect(-bs,-bs,bs*2,bs*2);
    ctx.fillStyle=`rgba(180,58,46,${pressing?.9:.5})`;
    ctx.beginPath();ctx.arc(0,0,3,0,7);ctx.fill();
    ctx.restore();
  }

  // 光：色温 + 暮金 + 有色的暗
  ctx.globalCompositeOperation='multiply';
  ctx.fillStyle=`rgba(${L.tint[0]|0},${L.tint[1]|0},${L.tint[2]|0},${(L.tintA*.55).toFixed(3)})`;
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='overlay';
  if(L.warmA>.03){
    const g=ctx.createRadialGradient(W*.3,H*.15,0,W*.3,H*.15,Math.max(W,H)*.75);
    g.addColorStop(0,`rgba(${L.warm[0]|0},${L.warm[1]|0},${L.warm[2]|0},${L.warmA.toFixed(3)})`);
    g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
  ctx.globalCompositeOperation='source-over';
  const dark=(1-L.light)*.26;
  if(dark>.02){ctx.fillStyle=`rgba(59,58,44,${dark.toFixed(3)})`;ctx.fillRect(0,0,W,H)}

  // 颗粒
  ctx.globalCompositeOperation='overlay';ctx.globalAlpha=.05;
  ctx.drawImage(grainC,0,0,W,H);
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';

  updateLoupe();
  thumb.style.left=(heure/24*100)+'%';
  const h2=Math.floor(heure),m2=Math.floor((heure-h2)*60);
  heureOut.textContent=`H ${String(h2).padStart(2,'0')}:${String(m2).padStart(2,'0')}`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body></html>
