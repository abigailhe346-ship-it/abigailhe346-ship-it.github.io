<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Type Ribbon — 风中的字 · Atelier MIRA N°034</title>
<!--
  调色板家族：④ 罂粟田 Champ de Coquelicots —— 阿让特伊的夏午。
  #B7C98B 草甸 · #7A9A5B 深草 · #8FA3B8 远天 · #E4D9C2 小径 · #6B5D4F 泥土 · #B43A2E 罂粟红（唯一纯色，≤10%，只点状）
  面积配比：草甸两层 ≈55% · 远天 ≈25% · 小径+泥土 ≈12% · 罂粟红 ≈8%（点彩与个别字）。
-->
<style>
:root{
  --pre:#B7C98B; --herbe:#7A9A5B; --ciel:#8FA3B8; --chemin:#E4D9C2; --terre:#6B5D4F; --pavot:#B43A2E;
  --ink:#3E4634; --uitxt:#3E4634;
  --serif:Didot,"Bodoni MT",Georgia,"Songti SC",serif;
  --mono:"SF Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC",sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ciel);color:var(--ink);font-family:var(--sans);overflow:hidden}
::selection{background:var(--pavot);color:var(--chemin)}
canvas#field{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}

.nameplate{position:fixed;top:26px;left:30px;pointer-events:none;color:var(--uitxt)}
.nameplate .no{font-family:var(--mono);font-size:10px;letter-spacing:.22em;opacity:.66}
.nameplate h1{font-family:var(--serif);font-weight:400;font-size:clamp(24px,3.2vw,38px);letter-spacing:.02em;margin-top:7px;color:var(--uitxt)}
.nameplate h1 em{font-style:italic;color:var(--pavot)}
.nameplate .epig{font-family:var(--serif);font-style:italic;font-size:14.5px;opacity:.78;margin-top:8px;max-width:320px;line-height:1.6}
.nameplate .coord{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;opacity:.45;margin-top:10px}

.colophon{position:fixed;left:30px;bottom:22px;display:flex;align-items:center;gap:9px;pointer-events:auto;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;opacity:.7;cursor:pointer;user-select:none;color:var(--uitxt)}
.colophon:hover{opacity:.85}
.secret{position:fixed;left:30px;bottom:48px;max-width:300px;font-family:var(--serif);font-style:italic;font-size:14px;line-height:1.7;
  color:var(--uitxt);opacity:0;transform:translateY(6px);transition:all .8s var(--ease);pointer-events:none;text-shadow:0 1px 8px rgba(228,217,194,.6)}
.secret.show{opacity:.9;transform:translateY(0)}

.topright{position:fixed;top:26px;right:30px;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.sndbtn{width:34px;height:34px;border:1px solid rgba(62,70,52,.4);background:rgba(228,217,194,.35);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s var(--ease)}
.sndbtn:hover{border-color:var(--terre)}
.sndbtn.on{background:rgba(183,201,139,.4);border-color:var(--terre)}
.sndbtn svg{stroke:var(--uitxt)}
.hintline{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;opacity:.6;text-align:right;line-height:1.9;pointer-events:none;color:var(--uitxt)}

.panel{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:calc(100vw - 28px);
  background:rgba(228,217,194,.6);backdrop-filter:blur(12px);border:1px solid rgba(107,93,79,.3);
  padding:13px 20px 14px;transition:all .5s var(--ease)}
.panel.hidden{transform:translateX(-50%) translateY(14px);opacity:0;pointer-events:none}
.panel.notrans{transition:none}
.panel .prow{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap;justify-content:center}
.ctl{display:flex;flex-direction:column;gap:7px}
.ctl label{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:rgba(62,70,52,.7);display:flex;justify-content:space-between;gap:12px}
.ctl label output{color:var(--pavot)}
input[type=range]{-webkit-appearance:none;appearance:none;width:124px;height:18px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:rgba(107,93,79,.5)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:10px;height:10px;margin-top:-4.5px;background:var(--chemin);border:1px solid var(--terre);border-radius:50%}
input[type=range]::-webkit-slider-thumb:hover{background:var(--pavot);border-color:var(--pavot)}
input[type=range]::-moz-range-track{height:1px;background:rgba(107,93,79,.5)}
input[type=range]::-moz-range-thumb{width:9px;height:9px;background:var(--chemin);border:1px solid var(--terre);border-radius:50%}
input[type=range].timerule::-webkit-slider-runnable-track{height:5px;border-radius:3px;
  background:linear-gradient(90deg,#6B5D4F 0%,#8FA3B8 22%,#E4D9C2 42%,#F0E3C0 50%,#E4D9C2 58%,#B7C98B 74%,#6B5D4F 100%)}
input[type=range].timerule::-moz-range-track{height:5px;border-radius:3px;
  background:linear-gradient(90deg,#6B5D4F 0%,#8FA3B8 22%,#E4D9C2 42%,#F0E3C0 50%,#E4D9C2 58%,#B7C98B 74%,#6B5D4F 100%)}
.etudes{display:flex;gap:6px}
.etudes button,.act{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;padding:8px 12px;
  background:transparent;color:var(--ink);border:1px solid rgba(107,93,79,.45);cursor:pointer;transition:all .25s var(--ease)}
.etudes button:hover,.act:hover{border-color:var(--pavot);color:var(--pavot)}
.etudes button.on{background:rgba(180,58,46,.12);border-color:var(--pavot);color:var(--pavot)}
.paneltab{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);font-family:var(--mono);font-size:9px;letter-spacing:.18em;
  text-transform:uppercase;color:rgba(62,70,52,.6);border:1px solid rgba(107,93,79,.4);background:rgba(228,217,194,.55);
  padding:7px 14px;cursor:pointer;opacity:0;pointer-events:none;transition:all .5s var(--ease)}
.paneltab.show{opacity:1;pointer-events:auto}
.paneltab:hover{color:var(--pavot);border-color:var(--pavot)}

@media(max-width:700px){
  .nameplate{top:18px;left:18px}
  .nameplate .epig{font-size:13px;max-width:230px}
  .topright{top:18px;right:18px}
  .hintline{display:none}
  .colophon{left:18px;bottom:16px;font-size:9px}
  .panel{bottom:14px;padding:11px 12px;width:calc(100vw - 24px);max-height:44vh;overflow-y:auto}
  .panel .prow{gap:10px;justify-content:flex-start}
  input[type=range]{width:82px}
  .etudes button,.act{padding:7px 9px}
  .paneltab{bottom:44px}
}
</style>
</head>
<body>
<canvas id="field"></canvas>

<div class="nameplate">
  <div class="no">N°034 · AI·VIDEO</div>
  <h1>Type <em>Ribbon</em> · 风中的字</h1>
  <div class="epig">字一出口，就被风拿走了。</div>
  <div class="coord">罂粟田 Champ de Coquelicots · 阿让特伊</div>
</div>

<div class="topright">
  <div class="sndbtn" id="sndBtn" title="环境声（默认关闭）" role="button" aria-label="toggle sound">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke-width="1.3" stroke-linecap="round">
      <path d="M2 6.5v3h2.5L8 12.5v-9L4.5 6.5H2z" fill="currentColor" stroke="none" opacity=".85"/>
      <path class="w1" d="M10.5 5.5c1.4 1.4 1.4 3.6 0 5"/>
      <path class="w2" d="M12.5 3.5c2.6 2.6 2.6 6.4 0 9"/>
    </svg>
  </div>
  <div class="hintline">直接打字 · 字会飞进风里<br>退格 · 风把字带走<br>拖动 · 掀起一阵风 · H 收起画具</div>
</div>

<div class="colophon" id="colophon">
  <svg width="22" height="14" viewBox="0 0 64 40" fill="currentColor" aria-hidden="true">
    <path d="M32 20 C 26 12, 14 6, 4 8 C 12 12, 18 18, 24 21
             C 14 20, 6 22, 2 28 C 10 26, 18 26, 25 26
             C 27 30, 30 34, 34 36 C 33 32, 33 28, 34 25
             C 42 22, 52 16, 62 4 C 54 10, 44 16, 36 19
             C 35 17, 33 17, 32 20 Z"/>
  </svg>
  <span>Atelier MIRA · N°034 · 罂粟田 Champ de Coquelicots</span>
</div>
<div class="secret" id="secret">莫奈画这片田的时候，<br>罂粟比颜料先红。</div>

<div class="panel" id="panel">
  <div class="prow">
    <div class="etudes" id="etudes">
      <button data-e="midi" class="on">正午</button><button data-e="soir">晚风</button><button data-e="nuit">将夜</button>
    </div>
    <div class="ctl"><label>风力 Vent <output id="oWind">45%</output></label>
      <input type="range" id="sWind" min="0" max="100" value="45"></div>
    <div class="ctl"><label>字距 Pas <output id="oGap">1.0</output></label>
      <input type="range" id="sGap" min="60" max="180" value="100"></div>
    <div class="ctl"><label>时刻 Heure <output id="oHeure">—</output></label>
      <input type="range" id="sHeure" class="timerule" min="0" max="24" step="0.05" value="12.5"></div>
    <button class="act" id="bNow">此刻</button>
    <button class="act" id="bClear">换一句话</button>
    <button class="act" id="bDown">收下这阵风</button>
  </div>
</div>
<div class="paneltab" id="paneltab">画具 · H</div>

<script>
(function(){
"use strict";
/* ================================================================
   Type Ribbon — 罂粟田上，你的字被风拿走
   heure 时间系统 · 点彩花田 · 绸带字符 · 击键=音簇 · 阵风惯性
   ================================================================ */
var cv=document.getElementById('field'),ctx=cv.getContext('2d');
var bgc=document.createElement('canvas'),bctx=bgc.getContext('2d');
var W=0,H=0,dpr=1,t=0,frameN=0;
function R(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,k){return a+(b-a)*k;}

/* ---------- HSL 工具 ---------- */
function hex2hsl(hex){
  var r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  var mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,h=0,s=0;
  if(mx!==mn){var d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);
    if(mx===r)h=((g-b)/d+(g<b?6:0));else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;}
  return [h,s*100,l*100];
}
function hsl2rgb(h,s,l){
  h=((h%360)+360)%360;s=clamp(s,0,100)/100;l=clamp(l,0,100)/100;
  var c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2,r=0,g=0,b=0;
  if(h<60){r=c;g=x;}else if(h<120){r=x;g=c;}else if(h<180){g=x;b=x;}
  else if(h<240){g=x;b=c;}else if(h<300){r=x;b=c;}else{r=c;b=x;}
  return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)];
}
function hsla(h,s,l,a){var c=hsl2rgb(h,s,l);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function lerpHsl(c1,c2,k){
  var dh=c2[0]-c1[0];if(dh>180)dh-=360;if(dh<-180)dh+=360;
  return [c1[0]+dh*k,lerp(c1[1],c2[1],k),lerp(c1[2],c2[2],k)];
}
var C={pre:hex2hsl('#B7C98B'),herbe:hex2hsl('#7A9A5B'),ciel:hex2hsl('#8FA3B8'),
       chemin:hex2hsl('#E4D9C2'),terre:hex2hsl('#6B5D4F'),pavot:hex2hsl('#B43A2E')};

/* ---------- heure：田上的一天 ---------- */
var heure=(new Date().getHours())+(new Date().getMinutes())/60;
var heureTarget=heure,heureAuto=true;
function lightAt(h){
  var K=[
    [0.0, {sky:[216,12,30],hor:[220,10,38],sun:0.00,shL:0.2,red:0.5}],
    [5.0, {sky:[216,12,30],hor:[220,10,38],sun:0.00,shL:0.2,red:0.5}],
    [7.0, {sky:[206,16,66],hor:[44,20,74], sun:0.35,shL:1.6,red:0.8}],   /* 晨 */
    [10.0,{sky:[205,18,72],hor:[80,16,76], sun:0.80,shL:0.8,red:1.0}],
    [13.0,{sky:[203,20,76],hor:[85,18,78], sun:1.00,shL:0.2,red:1.0}],   /* 正午 */
    [16.5,{sky:[208,18,66],hor:[70,22,70], sun:0.80,shL:1.2,red:1.0}],
    [18.5,{sky:[214,16,52],hor:[40,26,62], sun:0.45,shL:2.6,red:0.9}],   /* 晚风长影 */
    [20.5,{sky:[222,14,36],hor:[260,10,40],sun:0.08,shL:1.2,red:0.6}],
    [22.0,{sky:[218,12,31],hor:[222,10,38],sun:0.00,shL:0.2,red:0.5}],
    [24.0,{sky:[216,12,30],hor:[220,10,38],sun:0.00,shL:0.2,red:0.5}]
  ];
  for(var i=0;i<K.length-1;i++){
    if(h>=K[i][0]&&h<=K[i+1][0]){
      var k=(h-K[i][0])/(K[i+1][0]-K[i][0]);k=k*k*(3-2*k);
      var A=K[i][1],B=K[i+1][1];
      return {sky:lerpHsl(A.sky,B.sky,k),hor:lerpHsl(A.hor,B.hor,k),
              sun:lerp(A.sun,B.sun,k),shL:lerp(A.shL,B.shL,k),red:lerp(A.red,B.red,k)};
    }
  }
  return {sky:K[0][1].sky,hor:K[0][1].hor,sun:0,shL:0.2,red:0.5};
}

/* ---------- 参数与练习曲 ---------- */
var P={wind:0.45,gap:1.0};
var ETUDES={midi:{wind:0.35,h:12.5},soir:{wind:0.7,h:18.2},nuit:{wind:0.25,h:20.5}};
var gust=0,gustVX=0,dragging=false,lastPX=0;

/* ---------- 田（heure 缓存）：远天 / 罂粟点彩 / 小径 ---------- */
var poppies=[],cacheDirty=true;
var seed=Math.random()*999;
function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
function buildPoppies(){
  poppies=[];
  var n=Math.floor(W*H/3600);
  for(var i=0;i<n;i++){
    var y=0.55+Math.pow(rnd(),0.7)*0.43;
    poppies.push({x:rnd(),y:y,s:0.5+(y-0.55)*2.2,ph:rnd()*7});
  }
}
function brokenFill(c,x0,y0,x1,y1,baseHsl,n,ang,ln,a0,a1){
  for(var i=0;i<n;i++){
    var px=x0+Math.random()*(x1-x0),py=y0+Math.random()*(y1-y0);
    var h=baseHsl[0]+R(-8,8),s=baseHsl[1]+R(-6,6),l=baseHsl[2]+R(-5,5);
    c.strokeStyle=hsla(h,s,l,R(a0,a1));
    c.lineWidth=R(1,2.4);
    var a=ang+R(-0.4,0.4),L=R(ln*0.5,ln*1.5);
    c.beginPath();c.moveTo(px,py);c.lineTo(px+Math.cos(a)*L,py+Math.sin(a)*L);c.stroke();
  }
}
function rebuildField(L){
  bgc.width=W*dpr;bgc.height=H*dpr;bctx.setTransform(dpr,0,0,dpr,0,0);
  var horizon=H*0.55;
  /* 天 */
  var g=bctx.createLinearGradient(0,0,0,horizon);
  g.addColorStop(0,hsla(L.sky[0],L.sky[1],L.sky[2],1));
  g.addColorStop(1,hsla(L.hor[0],L.hor[1],L.hor[2],1));
  bctx.fillStyle=g;bctx.fillRect(0,0,W,horizon+2);
  brokenFill(bctx,0,0,W,horizon,L.sky,Math.floor(W*H/3000),0.1,26,0.14,0.3);
  /* 云：碎色团 */
  for(var cl=0;cl<5;cl++){
    var cx=W*(0.1+cl*0.19+((cl*37)%10)*0.008),cy=H*(0.08+((cl*53)%20)*0.01);
    brokenFill(bctx,cx-60,cy-12,cx+60,cy+12,lerpHsl(C.chemin,L.sky,0.3),50,0,18,0.10*(0.3+L.sun*0.7),0.22*(0.3+L.sun*0.7));
  }
  /* 夜星 */
  if(L.sun<0.25){
    var stA=(0.25-L.sun)/0.25;
    for(var st=0;st<160;st++){
      var sx=((st*7919)%1000)/1000*W,sy=((st*104729)%1000)/1000*H*0.5;
      bctx.fillStyle=hsla(C.chemin[0],C.chemin[1]*0.4,86,stA*(0.2+((st*37)%60)/100));
      bctx.fillRect(sx,sy,1.4,1.4);
    }
  }
  /* 远树线（大气透视） */
  var treeCol=lerpHsl(C.herbe,L.hor,0.6);
  for(var tx=0;tx<W;tx+=14){
    var th=H*0.02+Math.sin(tx*0.02+seed)*H*0.012+((tx*131)%17)/17*H*0.008;
    bctx.fillStyle=hsla(treeCol[0]+(((tx*77)%13)-6),treeCol[1],treeCol[2],0.5+((tx*31)%25)/100);
    bctx.fillRect(tx,horizon-th,14,th+2);
  }
  /* 田：两层绿碎色 */
  var fieldL=lerp(0.34,1.05,L.sun);
  var g1=lerpHsl(C.pre,L.hor,0.12),g2=lerpHsl(C.herbe,L.sky,0.1);
  bctx.fillStyle=hsla(g1[0],g1[1],g1[2]*fieldL*0.9,1);
  bctx.fillRect(0,horizon,W,H-horizon);
  brokenFill(bctx,0,horizon,W,H*0.78,g1,Math.floor(W*H/1100),1.35,20,0.16,0.36);
  brokenFill(bctx,0,H*0.72,W,H,g2,Math.floor(W*H/1300),1.45,24,0.16,0.38);
  /* 小径：从右下斜入的 E4D9C2 */
  bctx.beginPath();
  bctx.moveTo(W*0.68,H);bctx.lineTo(W*0.60,horizon);bctx.lineTo(W*0.64,horizon);bctx.lineTo(W*0.86,H);
  bctx.closePath();
  bctx.fillStyle=hsla(C.chemin[0],C.chemin[1],C.chemin[2]*fieldL,0.9);bctx.fill();
  bctx.save();bctx.clip();
  brokenFill(bctx,W*0.58,horizon,W*0.88,H,C.chemin,Math.floor(W*H/2600),1.5,16,0.16,0.34);
  bctx.restore();
  /* 罂粟：唯一的纯色，点状，≤10% */
  for(var i=0;i<poppies.length;i++){
    var p=poppies[i];
    var px=p.x*W,py=p.y*H;
    var sc=p.s*(0.7+L.sun*0.4);
    bctx.fillStyle=hsla(C.pavot[0]+R(-4,4),C.pavot[1]*L.red,C.pavot[2],R(0.55,0.9));
    bctx.beginPath();bctx.arc(px,py,Math.max(1.1,2.8*sc),0,6.29);bctx.fill();
    bctx.fillStyle=hsla(C.pavot[0],C.pavot[1]*L.red,C.pavot[2]-8,R(0.4,0.7));
    bctx.beginPath();bctx.arc(px+R(-1.5,1.5)*sc,py+R(-1.5,1.5)*sc,Math.max(0.6,1.4*sc),0,6.29);bctx.fill();
    bctx.fillStyle=hsla(C.terre[0],C.terre[1],16,0.7);
    bctx.beginPath();bctx.arc(px,py,Math.max(0.4,0.7*sc),0,6.29);bctx.fill();
  }
  cacheDirty=false;
}

/* ---------- 纸纹 ---------- */
var paper=document.createElement('canvas');
function buildPaper(){
  paper.width=Math.max(2,Math.floor(W/2));paper.height=Math.max(2,Math.floor(H/2));
  var p=paper.getContext('2d');
  p.clearRect(0,0,paper.width,paper.height);
  for(var i=0;i<4200;i++){
    p.fillStyle='rgba('+(Math.random()<0.5?'255,255,255':'60,66,50')+','+R(0.02,0.06).toFixed(3)+')';
    p.fillRect(R(0,paper.width),R(0,paper.height),R(0.5,1.8),R(0.5,1.8));
  }
  for(var f=0;f<60;f++){
    p.strokeStyle='rgba(80,86,64,'+R(0.008,0.02).toFixed(3)+')';
    p.lineWidth=R(0.3,0.8);
    var x=R(0,paper.width),y=R(0,paper.height),a=R(0,6.28),Ln=R(20,90);
    p.beginPath();p.moveTo(x,y);p.lineTo(x+Math.cos(a)*Ln,y+Math.sin(a)*Ln);p.stroke();
  }
}

/* ---------- 绸带上的字 ---------- */
var chars=[];
var text0='APRIL WIND 四月的风';
function setText(str){
  chars=[];
  for(var i=0;i<str.length;i++){
    chars.push({ch:str[i],born:-1,ph:R(0,7),red:(i%9===4),enter:1,die:0,dx:0,dy:0});
  }
}
function addChar(ch){
  chars.push({ch:ch,born:t,ph:R(0,7),red:(chars.length%9===4),enter:0,die:0,dx:0,dy:0});
  if(chars.length>42)chars.shift();
}
function removeChar(){
  for(var i=chars.length-1;i>=0;i--){
    if(!chars[i].die){chars[i].die=0.001;chars[i].dy=-2-Math.random()*2;chars[i].dx=R(1,3);return;}
  }
}
function ribbonY(x,tt){
  var amp=(14+P.wind*38+gust*46);
  return H*0.40
    +Math.sin(x*0.0042+tt*(0.7+P.wind))*amp
    +Math.sin(x*0.0016-tt*0.43)*amp*0.6
    +Math.sin(x*0.011+tt*1.7)*amp*0.18;
}
function drawRibbon(L){
  var n=chars.length;
  ctx.textAlign='center';ctx.textBaseline='middle';
  if(n===0){
    ctx.fillStyle=hsla(C.terre[0],C.terre[1],30,0.5);
    ctx.font='italic 15px Georgia,"Songti SC",serif';
    ctx.fillText('打一个字，风就开始了',W/2,H*0.4);
    return;
  }
  var fs=clamp(W/(n*0.85+8),22,60);
  ctx.font='italic 700 '+fs+'px Georgia,"Songti SC",serif';
  var ws=[],sum=0;
  for(var m=0;m<n;m++){var w=Math.max(6,ctx.measureText(chars[m].ch).width);ws.push(w);sum+=w;}
  var gap=fs*0.34*P.gap;
  var totalW=sum+gap*(n-1);
  if(totalW>W-48){var k=(W-48)/totalW;totalW=W-48;gap*=k;for(m=0;m<n;m++)ws[m]*=k;}
  var x0=(W-totalW)/2;
  var acc=x0;
  for(var i=0;i<n;i++){
    var c=chars[i];
    if(c.enter<1)c.enter=Math.min(1,c.enter+0.03);
    if(c.die>0){
      c.die+=0.02;c.dy+=0.12;c.dx*=1.01;
      if(c.die>1.4){chars.splice(i,1);n--;i--;continue;}
    }
    var cx=acc+ws[i]/2+(c.die?c.dx*c.die*40:(1-c.enter)*-30);
    acc+=ws[i]+gap;
    var cy=ribbonY(cx,t+c.ph*0.12)
      +Math.sin(t*2.2+c.ph)*(4+P.wind*9+gust*14)
      +(c.die?c.dy*c.die*60:(1-c.enter)*80);
    /* 布片翻转：scaleY 随相位 */
    var flip=Math.sin(t*1.4+c.ph)*0.35+0.65;
    var tilt=Math.cos(t*1.1+c.ph)*(0.12+P.wind*0.18+gust*0.3);
    var alpha=c.die?Math.max(0,1-c.die*0.7):c.enter;
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(tilt);
    ctx.scale(1,flip);
    ctx.globalAlpha=alpha;
    /* 投影：方向与长度随 heure */
    var shx=(0.5-clamp((heure-6)/12,0,1))*L.shL*10;
    ctx.font='italic 700 '+fs+'px Georgia,"Songti SC",serif';
    ctx.fillStyle=hsla(C.terre[0],20,18,0.28*L.sun);
    ctx.fillText(c.ch,shx,L.shL*4+3);
    /* 字身：昼为泥土深褐，夜为月光小径白；红字恒为罂粟 */
    if(c.red){
      ctx.fillStyle=hsla(C.pavot[0],C.pavot[1]*L.red,lerp(52,C.pavot[2],L.sun),0.95);
    }else{
      var inkCol=lerpHsl([40,14,82],C.terre,clamp(L.sun*1.5,0,1));
      ctx.fillStyle=hsla(inkCol[0],inkCol[1],inkCol[2],0.92);
    }
    ctx.fillText(c.ch,0,0);
    ctx.restore();
  }
}

/* ---------- 花瓣/草籽漂流 ---------- */
var motes=[];
function drawMotes(){
  if(Math.random()<0.05+P.wind*0.1&&motes.length<60){
    motes.push({x:-10,y:R(H*0.3,H*0.8),vx:R(0.6,2)*(0.5+P.wind),vy:R(-0.2,0.2),ph:R(0,7),red:Math.random()<0.25});
  }
  for(var i=motes.length-1;i>=0;i--){
    var m=motes[i];
    m.x+=m.vx*(1+gust*2);m.y+=m.vy+Math.sin(t*2+m.ph)*0.4;
    var c=m.red?C.pavot:C.chemin;
    ctx.fillStyle=hsla(c[0],c[1]*0.8,c[2],0.55);
    ctx.beginPath();ctx.arc(m.x,m.y,m.red?1.6:1.1,0,6.29);ctx.fill();
    if(m.x>W+20)motes.splice(i,1);
  }
}

/* ---------- 声音：风 + 击键音簇（默认 OFF） ---------- */
var AC=null,master=null,windGain=null,soundOn=false;
var PENTA=[261.63,293.66,329.63,392.0,440.0,523.25,587.33];
function initAudio(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=0;master.connect(AC.destination);
  var len=AC.sampleRate*3,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0),last=0;
  for(var i=0;i<len;i++){var w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.2;}
  var src=AC.createBufferSource();src.buffer=buf;src.loop=true;
  var bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=560;bp.Q.value=0.9;
  windGain=AC.createGain();windGain.gain.value=0.05;
  src.connect(bp);bp.connect(windGain);windGain.connect(master);src.start();
}
function pluck(){
  if(!AC||!soundOn)return;
  var now=AC.currentTime;
  var k=2+Math.floor(Math.random()*2);
  var base=Math.floor(Math.random()*4);
  for(var i=0;i<k;i++){
    var f=PENTA[clamp(base+i*2,0,PENTA.length-1)];
    var o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain();
    o.type='sine';o2.type='sine';
    o.frequency.value=f;o2.frequency.value=f*1.004;
    g.gain.setValueAtTime(0.0,now+i*0.03);
    g.gain.linearRampToValueAtTime(0.06,now+i*0.03+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,now+i*0.03+R(3,5));
    o.connect(g);o2.connect(g);g.connect(master);
    o.start(now+i*0.03);o.stop(now+i*0.03+5.2);
    o2.start(now+i*0.03);o2.stop(now+i*0.03+5.2);
  }
}
var sndBtn=document.getElementById('sndBtn');
function setSound(on){
  soundOn=on;sndBtn.classList.toggle('on',on);
  try{localStorage.setItem('atelier-mira-sound',on?'1':'0');}catch(e){}
  if(on&&!AC)initAudio();
  if(AC){if(AC.state==='suspended')AC.resume();
    var now=AC.currentTime;master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(master.gain.value,now);
    master.gain.linearRampToValueAtTime(on?0.8:0,now+(on?1.5:0.4));}
}
sndBtn.addEventListener('click',function(){setSound(!soundOn);});
try{if(localStorage.getItem('atelier-mira-sound')==='1'){
  soundOn=true;sndBtn.classList.add('on');
  var arm=function(){setSound(true);window.removeEventListener('pointerdown',arm);};
  window.addEventListener('pointerdown',arm);}}catch(e){}

/* ---------- 打字即演奏 ---------- */
window.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT')return;
  if(e.key==='h'||e.key==='H'){togglePanel();return;}
  if(e.key==='1'){applyEtude('midi');return;}
  if(e.key==='2'){applyEtude('soir');return;}
  if(e.key==='3'){applyEtude('nuit');return;}
  if(e.key==='Backspace'){removeChar();e.preventDefault();return;}
  if(e.key.length===1){addChar(e.key);pluck();}
});
/* 拖动 = 阵风 */
cv.addEventListener('pointerdown',function(e){dragging=true;lastPX=e.clientX;cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',function(e){
  if(!dragging)return;
  gustVX+=(e.clientX-lastPX)*0.02;lastPX=e.clientX;
});
cv.addEventListener('pointerup',function(){dragging=false;});

/* ---------- 控件 ---------- */
var oWind=document.getElementById('oWind'),oGap=document.getElementById('oGap'),oHeure=document.getElementById('oHeure');
document.getElementById('sWind').addEventListener('input',function(){P.wind=+this.value/100;oWind.textContent=this.value+'%';markCustom();});
document.getElementById('sGap').addEventListener('input',function(){P.gap=+this.value/100;oGap.textContent=P.gap.toFixed(1);markCustom();});
var sHeure=document.getElementById('sHeure');
sHeure.addEventListener('input',function(){heureTarget=+this.value;heureAuto=false;});
document.getElementById('bNow').addEventListener('click',function(){heureAuto=true;});
document.getElementById('bClear').addEventListener('click',function(){
  for(var i=0;i<chars.length;i++){chars[i].die=0.001+i*0.03;chars[i].dy=-2-Math.random()*2;chars[i].dx=R(1,3);}
});
document.getElementById('bDown').addEventListener('click',function(){
  var a=document.createElement('a');a.download='atelier-mira-n034-type-ribbon.png';
  a.href=cv.toDataURL('image/png');a.click();
});
var etudeBtns=document.querySelectorAll('#etudes button');
function markCustom(){etudeBtns.forEach(function(b){b.classList.remove('on');});}
function applyEtude(name){
  var e=ETUDES[name];if(!e)return;
  P.wind=e.wind;heureTarget=e.h;heureAuto=false;
  document.getElementById('sWind').value=e.wind*100;oWind.textContent=Math.round(e.wind*100)+'%';
  etudeBtns.forEach(function(b){b.classList.toggle('on',b.dataset.e===name);});
}
etudeBtns.forEach(function(b){b.addEventListener('click',function(){applyEtude(b.dataset.e);});});

var panel=document.getElementById('panel'),paneltab=document.getElementById('paneltab'),panelHidden=false;
function togglePanel(){
  panelHidden=!panelHidden;
  panel.classList.toggle('hidden',panelHidden);
  paneltab.classList.toggle('show',panelHidden);
}
paneltab.addEventListener('click',togglePanel);

var colClicks=0,colTimer=null;
document.getElementById('colophon').addEventListener('click',function(){
  colClicks++;clearTimeout(colTimer);
  colTimer=setTimeout(function(){colClicks=0;},900);
  if(colClicks>=3){document.getElementById('secret').classList.toggle('show');colClicks=0;}
});

/* ---------- 尺寸 ---------- */
function size(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  [cv,bgc].forEach(function(c){c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);});
  ctx.setTransform(dpr,0,0,dpr,0,0);
  buildPoppies();buildPaper();cacheDirty=true;
}
window.addEventListener('resize',size);

/* ---------- 主循环 ---------- */
var grainTick=0;
function fmtHeure(h){
  var hh=Math.floor(h)%24,mm=Math.floor((h%1)*60);
  return (hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;
}
function frame(){
  t+=0.016;frameN++;
  if(heureAuto)heureTarget=(new Date().getHours())+(new Date().getMinutes())/60;
  var dh=heureTarget-heure;
  if(Math.abs(dh)>0.0005){heure+=dh*0.06;cacheDirty=true;}
  sHeure.value=heure;oHeure.textContent=fmtHeure(heure);
  /* 阵风惯性 */
  gustVX*=0.94;
  gust+=(clamp(Math.abs(gustVX),0,1.4)-gust)*0.08;
  if(AC&&soundOn)windGain.gain.value=0.03+P.wind*0.05+gust*0.1;

  var L=lightAt(((heure%24)+24)%24);
  if(cacheDirty){
    rebuildField(L);
    document.documentElement.style.setProperty('--uitxt',L.sky[2]>56?'#3E4634':'#EFE9DA');
  }

  ctx.clearRect(0,0,W,H);
  ctx.drawImage(bgc,0,0,W,H);
  drawMotes();
  drawRibbon(L);

  /* 全局色温：正午提亮 / 傍晚暖罩 */
  if(L.sun>0.4){
    ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=(L.sun-0.4)*0.2;
    ctx.fillStyle=hsla(46,40,80,1);ctx.fillRect(0,0,W,H);ctx.restore();
  }
  if(heure>17||heure<6){
    ctx.save();ctx.globalCompositeOperation='multiply';ctx.globalAlpha=0.16;
    ctx.fillStyle=hsla(222,16,58,1);ctx.fillRect(0,0,W,H);ctx.restore();
  }

  /* 纸纹 + 颗粒 + 暗角 */
  ctx.save();ctx.globalAlpha=0.4;ctx.globalCompositeOperation='overlay';
  ctx.drawImage(paper,0,0,W,H);ctx.restore();
  grainTick++;
  if(grainTick%5===0){
    ctx.save();ctx.globalAlpha=0.05;
    for(var gN=0;gN<380;gN++){
      ctx.fillStyle=Math.random()<0.5?'#fff':'#3E4634';
      ctx.fillRect(Math.random()*W,Math.random()*H,1.2,1.2);
    }
    ctx.restore();
  }
  var vg=ctx.createRadialGradient(W/2,H*0.44,H*0.3,W/2,H*0.44,W*0.75);
  vg.addColorStop(0,hsla(90,14,26,0));vg.addColorStop(1,hsla(90,14,26,0.3));
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);

  requestAnimationFrame(frame);
}

size();setText(text0);
if(window.innerWidth<700){panel.classList.add('notrans');togglePanel();requestAnimationFrame(function(){panel.classList.remove('notrans');});}
requestAnimationFrame(frame);
})();
</script>
