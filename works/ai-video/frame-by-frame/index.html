<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRAME BY FRAME — 逐帧动画工作台</title>
<style>
  :root{
    --paper:#f6f0e1; --panel:#efe7d3; --line:#d9cfb6;
    --ink:#2b2620; --dim:#8d846e;
    --red:#d04a2c; --blue:#3a6ea5;
    --mono:"SF Mono",Menlo,Consolas,monospace;
    --serif:Didot,"Bodoni MT",Georgia,"Songti SC",serif;
    --sans:-apple-system,"Helvetica Neue","PingFang SC",sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
    background-image:
      radial-gradient(90% 60% at 20% 0%,rgba(208,74,44,.04),transparent 60%),
      repeating-linear-gradient(0deg,transparent 0 3px,rgba(43,38,32,.012) 3px 4px);}
  ::selection{background:var(--red);color:#fff}

  header{display:flex;justify-content:space-between;align-items:baseline;
    padding:22px 28px 0;gap:16px;flex-wrap:wrap}
  .sig{display:flex;align-items:baseline;gap:14px}
  .sig h1{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:.04em}
  .sig h1 em{font-style:italic;color:var(--red)}
  .sig .no{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.16em}
  .sig .no b{color:var(--red);font-weight:400}
  header p.tag{font-size:12px;color:var(--dim);letter-spacing:.05em}
  .rule{margin:14px 28px 0;border-top:1px solid var(--ink);position:relative}
  .rule::after{content:"";position:absolute;left:0;top:1px;width:100%;border-top:1px solid var(--line)}

  main{display:grid;grid-template-columns:1fr 290px;gap:24px;
    padding:24px 28px 44px;max-width:1420px;margin:0 auto}
  @media (max-width:960px){main{grid-template-columns:1fr}}

  .table{position:relative;background:#fbf7ec;border:1px solid var(--ink);
    box-shadow:8px 8px 0 rgba(43,38,32,.10), inset 0 0 60px rgba(43,38,32,.05)}
  .pegbar{height:34px;display:flex;justify-content:center;align-items:center;gap:64px;
    border-bottom:1px dashed var(--line);background:var(--panel)}
  .pegbar .hole{width:13px;height:13px;border-radius:50%;
    background:var(--paper);border:1px solid var(--ink);box-shadow:inset 1px 2px 3px rgba(43,38,32,.35)}
  .pegbar .slot{width:34px;height:11px;border-radius:6px;
    background:var(--paper);border:1px solid var(--ink);box-shadow:inset 1px 2px 3px rgba(43,38,32,.35)}
  .stage{position:relative}
  .stage canvas{display:block;width:100%;height:auto;cursor:crosshair;touch-action:none}
  .fcount{position:absolute;left:12px;top:10px;font-family:var(--mono);font-size:11px;
    letter-spacing:.16em;color:var(--ink);pointer-events:none}
  .fcount b{color:var(--red);font-weight:400}
  .oniontag{position:absolute;right:12px;top:10px;font-family:var(--mono);font-size:10px;
    letter-spacing:.2em;color:var(--red);border:1px solid var(--red);padding:3px 8px;
    opacity:0;transition:opacity .2s var(--ease);pointer-events:none;text-transform:uppercase}
  .table.onion .oniontag{opacity:1}
  .playtag{position:absolute;right:12px;bottom:10px;font-family:var(--mono);font-size:10px;
    letter-spacing:.2em;color:#fff;background:var(--ink);padding:3px 8px;
    opacity:0;transition:opacity .2s var(--ease);pointer-events:none;text-transform:uppercase}
  .table.playing .playtag{opacity:1}

  .stripwrap{margin-top:14px;border:1px solid var(--ink);background:var(--panel);padding:10px 12px}
  .striplabel{display:flex;justify-content:space-between;font-family:var(--mono);
    font-size:10px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin-bottom:8px}
  .strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
  .strip::-webkit-scrollbar{height:6px}
  .strip::-webkit-scrollbar-thumb{background:var(--line)}
  .thumb{flex:0 0 auto;width:86px;border:1px solid var(--line);background:#fbf7ec;
    cursor:pointer;position:relative;transition:all .2s var(--ease)}
  .thumb canvas{display:block;width:100%;height:auto}
  .thumb i{position:absolute;left:3px;top:2px;font-style:normal;font-family:var(--mono);
    font-size:8px;color:var(--dim);letter-spacing:.08em}
  .thumb:hover{border-color:var(--dim)}
  .thumb.cur{border-color:var(--red);box-shadow:3px 3px 0 rgba(208,74,44,.25)}
  .thumb.cur i{color:var(--red)}

  .dock{background:var(--panel);border:1px solid var(--ink);
    padding:20px;display:flex;flex-direction:column;gap:18px;
    align-self:start;position:sticky;top:20px}
  @media (max-width:960px){.dock{position:static}}
  .dock h2{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--dim);
    letter-spacing:.24em;text-transform:uppercase;
    border-bottom:1px solid var(--line);padding-bottom:12px}
  .ctl{display:flex;flex-direction:column;gap:9px}
  .ctl label{display:flex;justify-content:space-between;font-family:var(--mono);
    font-size:10px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase}
  .ctl label output{color:var(--red)}

  .transport{display:grid;grid-template-columns:44px 1fr 44px;gap:8px}
  .btn{appearance:none;border:1px solid var(--ink);background:transparent;color:var(--ink);
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    padding:11px 6px;cursor:pointer;transition:all .22s var(--ease)}
  .btn:hover{background:var(--ink);color:var(--paper)}
  .btn.prime{background:var(--red);border-color:var(--red);color:#fff}
  .btn.prime:hover{background:#e05a3a;border-color:#e05a3a}
  .btn.on{background:var(--ink);color:var(--paper)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

  input[type=range]{appearance:none;-webkit-appearance:none;width:100%;height:2px;
    background:var(--line);outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;
    width:14px;height:14px;background:var(--red);border:2px solid var(--paper);
    border-radius:50%;box-shadow:0 0 0 1px var(--red);transition:transform .2s var(--ease)}
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.25)}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;background:var(--red);
    border:2px solid var(--paper);border-radius:50%;box-shadow:0 0 0 1px var(--red)}

  .keys{font-size:11px;line-height:1.9;color:var(--dim);border-top:1px solid var(--line);padding-top:12px}
  .keys b{font-family:var(--mono);font-weight:400;color:var(--ink);border:1px solid var(--line);
    padding:1px 5px;font-size:9px;letter-spacing:.06em}

  footer{padding:0 28px 26px;font-family:var(--mono);font-size:10px;color:#a89f88;
    letter-spacing:.16em;text-transform:uppercase;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
</style>
</head>
<body>

<header>
  <div class="sig">
    <h1>FRAME <em>by</em> FRAME</h1>
    <span class="no">AI-VIDEO / <b>02</b> — 逐帧动画工作台</span>
  </div>
  <p class="tag">一盏透写台、一支铅笔，把重量画进一颗球的弹跳里。</p>
</header>
<div class="rule"></div>

<main>
  <section>
    <div class="table onion" id="table">
      <div class="pegbar"><i class="hole"></i><i class="slot"></i><i class="hole"></i></div>
      <div class="stage">
        <canvas id="cv"></canvas>
        <span class="fcount" id="fcount">F <b>01</b> / 10</span>
        <span class="oniontag">ONION&nbsp;SKIN</span>
        <span class="playtag">PLAYING</span>
      </div>
    </div>
    <div class="stripwrap">
      <div class="striplabel"><span>FILM&nbsp;STRIP&nbsp;胶片条</span><span id="striplen">10&nbsp;FRAMES</span></div>
      <div class="strip" id="strip"></div>
    </div>
  </section>

  <aside class="dock">
    <h2>Exposure&nbsp;Sheet</h2>

    <div class="ctl">
      <label>走带 TRANSPORT</label>
      <div class="transport">
        <button class="btn" id="bPrev" title="上一格">|&lt;</button>
        <button class="btn prime" id="bPlay">播放</button>
        <button class="btn" id="bNext" title="下一格">&gt;|</button>
      </div>
    </div>

    <div class="ctl">
      <label>帧率 FPS <output id="oFps">8</output></label>
      <input type="range" id="rFps" min="1" max="24" step="1" value="8">
    </div>

    <div class="ctl">
      <label>笔压 PENCIL <output id="oBrush">3</output></label>
      <input type="range" id="rBrush" min="1" max="12" step="1" value="3">
    </div>

    <div class="ctl">
      <label>洋葱皮 ONION <output id="oOnion">前1 后1</output></label>
      <div class="grid2">
        <button class="btn on" id="bOnion">洋葱皮 开</button>
        <button class="btn" id="bDemo">重置示范</button>
      </div>
    </div>

    <div class="ctl">
      <label>律表 FRAMES</label>
      <div class="grid2">
        <button class="btn" id="bAdd">插入帧</button>
        <button class="btn" id="bDup">复制本帧</button>
        <button class="btn" id="bUndo">撤销笔画</button>
        <button class="btn" id="bClear">清空本帧</button>
      </div>
      <button class="btn" id="bDel">删除本帧</button>
    </div>

    <p class="keys"><b>Space</b> 播放/停格 &nbsp; <b>←</b><b>→</b> 逐格步进<br>在透写台上直接拖画；红色是上一帧的残影，蓝色是下一帧。</p>
  </aside>
</main>

<footer>
  <span>FRAME BY FRAME — HAND-DRAWN CEL STUDY</span>
  <span>PENCIL · PAPER · 12-FIELD</span>
</footer>

<script>
(function(){
"use strict";
var table=document.getElementById('table'),cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var strip=document.getElementById('strip');
var fcount=document.getElementById('fcount'),striplen=document.getElementById('striplen');
var TAU=Math.PI*2,ASPECT=4/3;
var W=0,H=0,DPR=1;

var frames=[],cur=0,playing=false,fps=8,brush=3,onion=true;
var drawing=false,stroke=null,acc=0,last=performance.now();

/* ---------- demo animation: bouncing ball, 10 frames, hand-wobbled ---------- */
function demoFrames(){
  var out=[],N=10,i,k;
  function wob(seed){var x=Math.sin(seed*97.31)*43758.55;return x-Math.floor(x);}
  for(i=0;i<N;i++){
    var t=i/N;
    var airH=0.42,baseY=0.80;
    var y=baseY-airH*Math.sin(Math.PI*t);
    var sq=1-0.35*Math.max(0,1-Math.abs(t)*8); /* squash at contact */
    var r=0.055;
    var st=[];
    /* ball outline, slightly irregular like a pencil (y-radius scaled by ASPECT to stay round) */
    var pts=[];
    for(k=0;k<=26;k++){
      var a=k/26*TAU;
      var rr=r*(1+ (wob(i*40+k)-0.5)*0.10);
      pts.push([0.5+Math.cos(a)*rr/Math.sqrt(sq), y+Math.sin(a)*rr*ASPECT*sq]);
    }
    st.push({w:3,pts:pts});
    /* squash&stretch inner line */
    var eye=[];
    for(k=0;k<=10;k++){var a2=Math.PI*0.2+k/10*Math.PI*0.6;eye.push([0.5+Math.cos(a2)*r*0.45/Math.sqrt(sq),y+Math.sin(a2)*r*0.45*ASPECT*sq]);}
    st.push({w:2,pts:eye});
    /* motion ghosts behind fast frames */
    if(t>0.1&&t<0.9){
      var sp=Math.abs(Math.cos(Math.PI*t));
      if(sp>0.55){
        st.push({w:1,pts:[[0.5-r*1.6,y+r*0.2],[0.5-r*2.6,y+r*0.5]]});
        st.push({w:1,pts:[[0.5+r*1.6,y+r*0.2],[0.5+r*2.6,y+r*0.5]]});
      }
    }
    /* ground */
    st.push({w:2,pts:[[0.08,baseY+r*0.95],[0.92,baseY+r*0.95]]});
    /* impact bursts on contact frames */
    if(i===0||i===N-1){
      st.push({w:2,pts:[[0.42,baseY+r*0.6],[0.36,baseY+r*0.2]]});
      st.push({w:2,pts:[[0.58,baseY+r*0.6],[0.64,baseY+r*0.2]]});
    }
    out.push({strokes:st});
  }
  return out;
}

/* ---------- rendering ---------- */
function drawStrokes(c,list,color,alpha,lw,sw,sh){
  c.save();
  c.globalAlpha=alpha;
  c.strokeStyle=color;c.fillStyle=color;
  c.lineCap='round';c.lineJoin='round';
  for(var s=0;s<list.length;s++){
    var st=list[s],pts=st.pts;
    if(pts.length===1){
      c.beginPath();c.arc(pts[0][0]*sw,pts[0][1]*sh,(st.w/2),0,TAU);c.fill();continue;
    }
    c.lineWidth=lw||st.w;
    c.beginPath();
    c.moveTo(pts[0][0]*sw,pts[0][1]*sh);
    for(var p=1;p<pts.length;p++)c.lineTo(pts[p][0]*sw,pts[p][1]*sh);
    c.stroke();
  }
  c.restore();
}

function fieldGuides(){
  ctx.strokeStyle='rgba(43,38,32,.20)';ctx.lineWidth=1;
  var m=Math.min(W,H)*0.055;
  function cross(x,y){
    ctx.beginPath();ctx.moveTo(x-7,y);ctx.lineTo(x+7,y);ctx.moveTo(x,y-7);ctx.lineTo(x,y+7);ctx.stroke();
  }
  cross(m,m);cross(W-m,m);cross(m,H-m);cross(W-m,H-m);
  ctx.strokeRect(m,m,W-2*m,H-2*m);
  ctx.setLineDash([2,5]);
  ctx.strokeStyle='rgba(43,38,32,.12)';
  ctx.strokeRect(m*1.7,m*1.7,W-3.4*m,H-3.4*m);
  ctx.setLineDash([]);
}

function render(){
  ctx.clearRect(0,0,W,H);
  fieldGuides();
  var f=frames[cur];
  if(onion&&!playing){
    var prev=frames[(cur-1+frames.length)%frames.length];
    var next=frames[(cur+1)%frames.length];
    if(frames.length>1){
      drawStrokes(ctx,prev.strokes,'#d04a2c',0.35,null,W,H);
      drawStrokes(ctx,next.strokes,'#3a6ea5',0.35,null,W,H);
    }
  }
  drawStrokes(ctx,f.strokes,'#2b2620',1,null,W,H);
  if(stroke)drawStrokes(ctx,[stroke],'#2b2620',1,null,W,H);
}

/* ---------- thumbnails ---------- */
var thumbs=[];
function buildStrip(){
  strip.innerHTML='';thumbs=[];
  frames.forEach(function(f,i){
    var d=document.createElement('div');d.className='thumb'+(i===cur?' cur':'');
    var c=document.createElement('canvas');
    var tw=86,th=Math.round(86/ASPECT);
    c.width=tw*2;c.height=th*2;
    var tc=c.getContext('2d');
    tc.scale(2,2);
    drawStrokes(tc,f.strokes,'#2b2620',1,Math.max(1,1.2),tw,th);
    var n=document.createElement('i');n.textContent=String(i+1).padStart(2,'0');
    d.appendChild(c);d.appendChild(n);
    d.addEventListener('click',function(){cur=i;stop();sync();});
    strip.appendChild(d);thumbs.push(d);
  });
  striplen.textContent=frames.length+' FRAMES';
  refreshThumbCurrent();
}
function refreshThumbCurrent(){
  thumbs.forEach(function(d,i){d.classList.toggle('cur',i===cur);});
  if(thumbs[cur])thumbs[cur].scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});
}
function updateThumb(i){
  var d=thumbs[i];if(!d)return;
  var c=d.querySelector('canvas'),tc=c.getContext('2d');
  tc.setTransform(1,0,0,1,0,0);tc.clearRect(0,0,c.width,c.height);tc.scale(2,2);
  drawStrokes(tc,frames[i].strokes,'#2b2620',1,Math.max(1,1.2),86,Math.round(86/ASPECT));
}

function sync(){
  fcount.innerHTML='F <b>'+String(cur+1).padStart(2,'0')+'</b> / '+frames.length;
  render();
}

/* ---------- playback ---------- */
function stop(){playing=false;table.classList.remove('playing');bPlay.textContent='播放';}
var bPlay=document.getElementById('bPlay');
function togglePlay(){
  playing=!playing;
  table.classList.toggle('playing',playing);
  bPlay.textContent=playing?'停格':'播放';
  render();
}
function step(d){cur=(cur+d+frames.length)%frames.length;refreshThumbCurrent();sync();}

function tick(now){
  var dt=Math.min((now-last)/1000,0.1);last=now;
  if(playing){
    acc+=dt;
    var stepT=1/fps;
    while(acc>=stepT){acc-=stepT;cur=(cur+1)%frames.length;refreshThumbCurrent();}
    render();
    fcount.innerHTML='F <b>'+String(cur+1).padStart(2,'0')+'</b> / '+frames.length;
  }
  requestAnimationFrame(tick);
}

/* ---------- drawing ---------- */
function toNorm(e){
  var r=cv.getBoundingClientRect();
  var cx=(e.clientX-r.left)/r.width,cy=(e.clientY-r.top)/r.height;
  return [Math.max(0,Math.min(1,cx)),Math.max(0,Math.min(1,cy))];
}
cv.addEventListener('pointerdown',function(e){
  if(playing)stop();
  drawing=true;cv.setPointerCapture(e.pointerId);
  stroke={w:brush,pts:[toNorm(e)]};
  render();
});
cv.addEventListener('pointermove',function(e){
  if(!drawing)return;
  var p=toNorm(e),lastP=stroke.pts[stroke.pts.length-1];
  var dx=(p[0]-lastP[0])*W,dy=(p[1]-lastP[1])*H;
  if(dx*dx+dy*dy>4)stroke.pts.push(p);
  render();
});
function endStroke(){
  if(!drawing)return;drawing=false;
  if(stroke&&stroke.pts.length)frames[cur].strokes.push(stroke);
  stroke=null;updateThumb(cur);render();
}
cv.addEventListener('pointerup',endStroke);
cv.addEventListener('pointercancel',endStroke);

/* ---------- controls ---------- */
bPlay.addEventListener('click',togglePlay);
document.getElementById('bPrev').addEventListener('click',function(){stop();step(-1);});
document.getElementById('bNext').addEventListener('click',function(){stop();step(1);});

var rFps=document.getElementById('rFps'),oFps=document.getElementById('oFps');
rFps.addEventListener('input',function(){fps=+this.value;oFps.textContent=fps;});
var rBrush=document.getElementById('rBrush'),oBrush=document.getElementById('oBrush');
rBrush.addEventListener('input',function(){brush=+this.value;oBrush.textContent=brush;});

var bOnion=document.getElementById('bOnion');
bOnion.addEventListener('click',function(){
  onion=!onion;
  this.classList.toggle('on',onion);
  this.textContent=onion?'洋葱皮 开':'洋葱皮 关';
  table.classList.toggle('onion',onion);
  render();
});
document.getElementById('bDemo').addEventListener('click',function(){
  stop();frames=demoFrames();cur=0;buildStrip();sync();
});
document.getElementById('bAdd').addEventListener('click',function(){
  stop();frames.splice(cur+1,0,{strokes:[]});cur++;buildStrip();sync();
});
document.getElementById('bDup').addEventListener('click',function(){
  stop();
  var copy=JSON.parse(JSON.stringify(frames[cur]));
  frames.splice(cur+1,0,copy);cur++;buildStrip();sync();
});
document.getElementById('bUndo').addEventListener('click',function(){
  frames[cur].strokes.pop();updateThumb(cur);render();
});
document.getElementById('bClear').addEventListener('click',function(){
  frames[cur].strokes=[];updateThumb(cur);render();
});
document.getElementById('bDel').addEventListener('click',function(){
  if(frames.length<=1)return;
  stop();frames.splice(cur,1);cur=Math.min(cur,frames.length-1);buildStrip();sync();
});

window.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT')return;
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  else if(e.key==='ArrowLeft'){stop();step(-1);}
  else if(e.key==='ArrowRight'){stop();step(1);}
});

/* ---------- sizing ---------- */
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  var cw=table.querySelector('.stage').clientWidth;
  W=cw;H=Math.round(cw/ASPECT);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  render();
}
window.addEventListener('resize',resize);

frames=demoFrames();
buildStrip();resize();sync();
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
