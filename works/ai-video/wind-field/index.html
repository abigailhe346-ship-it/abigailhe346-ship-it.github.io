<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wind Field — 林间风 · Atelier MIRA N°036</title>
<!--
  调色板家族：⑦ 林间光 Sous-bois —— 穿过叶隙的光。
  #E8E3CE 光斑 · #B5B98A 亮叶 · #7E8F5E 中绿 · #4E5E42 深叶 · #2F3B2C 林翳（最暗到此）· #D9A85C 金色斑光
  面积配比：光斑纸地 ≈40% · 亮中绿 ≈35% · 深叶林翳 ≈18% · 金斑光 ≤7%（点状）。
-->
<style>
:root{
  --tache:#E8E3CE; --feuille:#B5B98A; --vert:#7E8F5E; --sombre:#4E5E42; --ombre:#2F3B2C; --or:#D9A85C;
  --ink:#33402A;
  --serif:Didot,"Bodoni MT",Georgia,"Songti SC",serif;
  --mono:"SF Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC",sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--tache);color:var(--ink);font-family:var(--sans);overflow:hidden}
::selection{background:var(--or);color:var(--ombre)}
canvas#wood{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}

.nameplate{position:fixed;top:26px;left:30px;pointer-events:none;color:var(--uitxt,#33402A)}
.nameplate .no{font-family:var(--mono);font-size:10px;letter-spacing:.22em;opacity:.66}
.nameplate h1{font-family:var(--serif);font-weight:400;font-size:clamp(24px,3.2vw,38px);letter-spacing:.02em;margin-top:7px}
.nameplate h1 em{font-style:italic;color:var(--or)}
.nameplate .epig{font-family:var(--serif);font-style:italic;font-size:14.5px;opacity:.78;margin-top:8px;max-width:320px;line-height:1.6}
.nameplate .coord{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;opacity:.45;margin-top:10px}

.colophon{position:fixed;left:30px;bottom:22px;display:flex;align-items:center;gap:9px;pointer-events:auto;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;opacity:.68;cursor:pointer;user-select:none;color:var(--uitxt,#33402A)}
.colophon:hover{opacity:.9}
.secret{position:fixed;left:30px;bottom:48px;max-width:300px;font-family:var(--serif);font-style:italic;font-size:14px;line-height:1.7;
  color:var(--uitxt,#33402A);opacity:0;transform:translateY(6px);transition:all .8s var(--ease);pointer-events:none}
.secret.show{opacity:.9;transform:translateY(0)}

.topright{position:fixed;top:26px;right:30px;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.sndbtn{width:34px;height:34px;border:1px solid rgba(51,64,42,.4);background:rgba(232,227,206,.35);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s var(--ease);color:var(--uitxt,#33402A)}
.sndbtn:hover{border-color:var(--vert)}
.sndbtn.on{background:rgba(217,168,92,.25);border-color:var(--or)}
.sndbtn svg{stroke:currentColor}
.hintline{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;opacity:.58;text-align:right;line-height:1.9;pointer-events:none;color:var(--uitxt,#33402A)}

.panel{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:calc(100vw - 28px);
  background:rgba(232,227,206,.62);backdrop-filter:blur(12px);border:1px solid rgba(78,94,66,.3);
  padding:13px 20px 14px;transition:all .5s var(--ease)}
.panel.hidden{transform:translateX(-50%) translateY(14px);opacity:0;pointer-events:none}
.panel.notrans{transition:none}
.panel .prow{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap;justify-content:center}
.ctl{display:flex;flex-direction:column;gap:7px}
.ctl label{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:rgba(51,64,42,.7);display:flex;justify-content:space-between;gap:12px}
.ctl label output{color:#8A6A2E}
input[type=range]{-webkit-appearance:none;appearance:none;width:124px;height:18px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:rgba(78,94,66,.5)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:10px;height:10px;margin-top:-4.5px;background:var(--tache);border:1px solid var(--sombre);border-radius:50%}
input[type=range]::-webkit-slider-thumb:hover{background:var(--or);border-color:var(--or)}
input[type=range]::-moz-range-track{height:1px;background:rgba(78,94,66,.5)}
input[type=range]::-moz-range-thumb{width:9px;height:9px;background:var(--tache);border:1px solid var(--sombre);border-radius:50%}
input[type=range].timerule::-webkit-slider-runnable-track{height:5px;border-radius:3px;
  background:linear-gradient(90deg,#2F3B2C 0%,#4E5E42 16%,#B5B98A 34%,#E8E3CE 46%,#D9A85C 62%,#7E8F5E 80%,#2F3B2C 100%)}
input[type=range].timerule::-moz-range-track{height:5px;border-radius:3px;
  background:linear-gradient(90deg,#2F3B2C 0%,#4E5E42 16%,#B5B98A 34%,#E8E3CE 46%,#D9A85C 62%,#7E8F5E 80%,#2F3B2C 100%)}
.etudes{display:flex;gap:6px}
.etudes button,.act{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;padding:8px 12px;
  background:transparent;color:var(--ink);border:1px solid rgba(78,94,66,.45);cursor:pointer;transition:all .25s var(--ease)}
.etudes button:hover,.act:hover{border-color:#8A6A2E;color:#8A6A2E}
.etudes button.on{background:rgba(217,168,92,.2);border-color:#8A6A2E;color:#8A6A2E}
.paneltab{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);font-family:var(--mono);font-size:9px;letter-spacing:.18em;
  text-transform:uppercase;color:rgba(51,64,42,.6);border:1px solid rgba(78,94,66,.4);background:rgba(232,227,206,.55);
  padding:7px 14px;cursor:pointer;opacity:0;pointer-events:none;transition:all .5s var(--ease)}
.paneltab.show{opacity:1;pointer-events:auto}
.paneltab:hover{color:#8A6A2E;border-color:#8A6A2E}

@media(max-width:700px){
  .nameplate{top:18px;left:18px}
  .nameplate .epig{font-size:13px;max-width:230px}
  .topright{top:18px;right:18px}
  .hintline{display:none}
  .colophon{left:18px;bottom:16px;font-size:9px}
  .panel{bottom:14px;padding:11px 12px;width:calc(100vw - 24px);max-height:44vh;overflow-y:auto}
  .panel .prow{gap:10px;justify-content:flex-start}
  input[type=range]{width:82px}
  .etudes button,.act{padding:7px 9px}
  .paneltab{bottom:44px}
}
</style>
</head>
<body>
<canvas id="wood"></canvas>

<div class="nameplate">
  <div class="no">N°036 · AI·VIDEO</div>
  <h1>Wind <em>Field</em> · 林间风</h1>
  <div class="epig">风没有形状，叶子替它签名。</div>
  <div class="coord">林间光 Sous-bois · 枫丹白露午后</div>
</div>

<div class="topright">
  <div class="sndbtn" id="sndBtn" title="环境声（默认关闭）" role="button" aria-label="toggle sound">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke-width="1.3" stroke-linecap="round">
      <path d="M2 6.5v3h2.5L8 12.5v-9L4.5 6.5H2z" fill="currentColor" stroke="none" opacity=".85"/>
      <path class="w1" d="M10.5 5.5c1.4 1.4 1.4 3.6 0 5"/>
      <path class="w2" d="M12.5 3.5c2.6 2.6 2.6 6.4 0 9"/>
    </svg>
  </div>
  <div class="hintline">拖拽 · 给风一个方向<br>点击 · 一阵湍流<br>等一等 · 燕子会经过 · H 收起画具</div>
</div>

<div class="colophon" id="colophon">
  <svg width="22" height="14" viewBox="0 0 64 40" fill="currentColor" aria-hidden="true">
    <path d="M32 20 C 26 12, 14 6, 4 8 C 12 12, 18 18, 24 21
             C 14 20, 6 22, 2 28 C 10 26, 18 26, 25 26
             C 27 30, 30 34, 34 36 C 33 32, 33 28, 34 25
             C 42 22, 52 16, 62 4 C 54 10, 44 16, 36 19
             C 35 17, 33 17, 32 20 Z"/>
  </svg>
  <span>Atelier MIRA · N°036 · 林间光 Sous-bois</span>
</div>
<div class="secret" id="secret">那只燕子每年都来，<br>从不问路，也从不迟到两天以上。</div>

<div class="panel" id="panel">
  <div class="prow">
    <div class="etudes" id="etudes">
      <button data-e="matin">晨</button><button data-e="midi" class="on">午</button><button data-e="soir">暮</button>
    </div>
    <div class="ctl"><label>湍流 Tourbillon <output id="oTurb">1.6</output></label>
      <input type="range" id="sTurb" min="0" max="40" value="16"></div>
    <div class="ctl"><label>流速 Flux <output id="oSpd">1.4</output></label>
      <input type="range" id="sSpd" min="20" max="300" value="140"></div>
    <div class="ctl"><label>时刻 Heure <output id="oHeure">—</output></label>
      <input type="range" id="sHeure" class="timerule" min="0" max="24" step="0.05" value="12.5"></div>
    <button class="act" id="bNow">此刻</button>
    <button class="act" id="bRegen">换一片林 ↻</button>
    <button class="act" id="bDown">收下这阵风</button>
  </div>
</div>
<div class="paneltab" id="paneltab">画具 · H</div>

<script>
(function(){
"use strict";
/* ================================================================
   Wind Field — 林间光里的风
   heure 时间系统 · 墨迹流场 · 叶隙光束 · 燕子飞渡扰流（L4）
   ================================================================ */
var cv=document.getElementById('wood'),ctx=cv.getContext('2d');
var bgc=document.createElement('canvas'),bctx=bgc.getContext('2d');    /* 林间背景（heure 缓存） */
var trl=document.createElement('canvas'),tctx=trl.getContext('2d');    /* 风痕累积层 */
var W=0,H=0,dpr=1,t=0,frameN=0;
function R(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,k){return a+(b-a)*k;}

/* ---------- HSL 工具 ---------- */
function hex2hsl(hex){
  var r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  var mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,h=0,s=0;
  if(mx!==mn){var d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);
    if(mx===r)h=((g-b)/d+(g<b?6:0));else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;}
  return [h,s*100,l*100];
}
function hsl2rgb(h,s,l){
  h=((h%360)+360)%360;s=clamp(s,0,100)/100;l=clamp(l,0,100)/100;
  var c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2,r=0,g=0,b=0;
  if(h<60){r=c;g=x;}else if(h<120){r=x;g=c;}else if(h<180){g=x;b=x;}
  else if(h<240){g=x;b=c;}else if(h<300){r=x;b=c;}else{r=c;b=x;}
  return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)];
}
function hsla(h,s,l,a){var c=hsl2rgb(h,s,l);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function lerpHsl(c1,c2,k){
  var dh=c2[0]-c1[0];if(dh>180)dh-=360;if(dh<-180)dh+=360;
  return [c1[0]+dh*k,lerp(c1[1],c2[1],k),lerp(c1[2],c2[2],k)];
}
var C={tache:hex2hsl('#E8E3CE'),feuille:hex2hsl('#B5B98A'),vert:hex2hsl('#7E8F5E'),
       sombre:hex2hsl('#4E5E42'),ombre:hex2hsl('#2F3B2C'),or:hex2hsl('#D9A85C')};

/* ---------- heure：林间的一天 ---------- */
var heure=(new Date().getHours())+(new Date().getMinutes())/60;
var heureTarget=heure,heureAuto=true;
function lightAt(h){
  var K=[
    [0.0, {grnd:[100,16,21],leaf:[95,18,25],ray:0.00,rayA:0.0,gold:0.5}],
    [5.0, {grnd:[100,16,21],leaf:[95,18,25],ray:0.00,rayA:0.0,gold:0.5}],
    [7.0, {grnd:[80,20,52],leaf:[85,22,46],ray:0.55,rayA:-0.9,gold:0.9}],   /* 晨：低角度金 */
    [10.0,{grnd:[75,20,66],leaf:[82,22,56],ray:0.35,rayA:-0.35,gold:1.0}],
    [13.0,{grnd:[72,22,72],leaf:[80,24,60],ray:0.22,rayA:0.0,gold:1.0}],    /* 正午顶光 */
    [16.5,{grnd:[76,22,60],leaf:[82,24,50],ray:0.42,rayA:0.5,gold:1.0}],
    [18.5,{grnd:[70,20,44],leaf:[80,22,38],ray:0.75,rayA:0.95,gold:0.9}],   /* 暮：长光束 */
    [20.5,{grnd:[96,18,26],leaf:[95,20,30],ray:0.08,rayA:1.2,gold:0.6}],
    [22.0,{grnd:[100,16,20],leaf:[96,18,25],ray:0.00,rayA:0.0,gold:0.5}],
    [24.0,{grnd:[100,16,21],leaf:[95,18,25],ray:0.00,rayA:0.0,gold:0.5}]
  ];
  for(var i=0;i<K.length-1;i++){
    if(h>=K[i][0]&&h<=K[i+1][0]){
      var k=(h-K[i][0])/(K[i+1][0]-K[i][0]);k=k*k*(3-2*k);
      var A=K[i][1],B=K[i+1][1];
      return {grnd:lerpHsl(A.grnd,B.grnd,k),leaf:lerpHsl(A.leaf,B.leaf,k),
              ray:lerp(A.ray,B.ray,k),rayA:lerp(A.rayA,B.rayA,k),gold:lerp(A.gold,B.gold,k)};
    }
  }
  return {grnd:K[0][1].grnd,leaf:K[0][1].leaf,ray:0,rayA:0,gold:0.5};
}

/* ---------- 参数与练习曲 ---------- */
var P={turb:1.6,speed:1.4};
var ETUDES={matin:{turb:1.1,spd:0.7,h:7.2},midi:{turb:1.6,spd:1.0,h:12.5},soir:{turb:2.4,spd:1.5,h:18.4}};
var wind={ang:0.6,str:0.5},windT={ang:0.6,str:0.5};

/* ---------- 流场（种子化） ---------- */
var seed=Math.random()*999;
function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
function fieldAng(x,y,tt){
  var s=seed*0.013;
  var a=Math.sin(x*0.0038+tt*0.32+s*7.0)+Math.sin(y*0.0046-tt*0.21+s*3.1);
  a+=Math.sin((x+y)*0.0021+tt*0.13+s*11.7)*0.9;
  a+=Math.sin((x-y)*0.0016-tt*0.17+s*5.3)*0.7;
  return a*P.turb;
}

/* ---------- 林间背景：远树干 / 叶冠碎色 / 地面 / 光束 ---------- */
var trunks=[],cacheDirty=true;
function buildTrunks(){
  trunks=[];
  var n=5+Math.floor(rnd()*4);
  for(var i=0;i<n;i++){
    trunks.push({x:rnd(),w:0.014+rnd()*0.03,lean:R(-0.04,0.04),fog:0.3+rnd()*0.55});
  }
}
function brokenFill(c,x0,y0,x1,y1,baseHsl,n,ang,ln,a0,a1){
  for(var i=0;i<n;i++){
    var px=x0+Math.random()*(x1-x0),py=y0+Math.random()*(y1-y0);
    var h=baseHsl[0]+R(-8,8),s=baseHsl[1]+R(-6,6),l=baseHsl[2]+R(-5,5);
    c.strokeStyle=hsla(h,s,l,R(a0,a1));
    c.lineWidth=R(1,2.4);
    var a=ang+R(-0.4,0.4),L=R(ln*0.5,ln*1.5);
    c.beginPath();c.moveTo(px,py);c.lineTo(px+Math.cos(a)*L,py+Math.sin(a)*L);c.stroke();
  }
}
function rebuildWood(L){
  bgc.width=W*dpr;bgc.height=H*dpr;bctx.setTransform(dpr,0,0,dpr,0,0);
  /* 林地底：光斑纸色 */
  bctx.fillStyle=hsla(L.grnd[0],L.grnd[1],L.grnd[2],1);
  bctx.fillRect(0,0,W,H);
  brokenFill(bctx,0,0,W,H,L.grnd,Math.floor(W*H/1600),1.1,26,0.10,0.24);
  /* 叶冠：上部深绿碎色（远→近两层） */
  var leafFar=lerpHsl(L.leaf,L.grnd,0.35);
  brokenFill(bctx,0,0,W,H*0.34,leafFar,Math.floor(W*H/900),1.35,22,0.16,0.36);
  var leafNear=lerpHsl(L.leaf,C.ombre,0.3);
  brokenFill(bctx,0,0,W,H*0.2,leafNear,Math.floor(W*H/1400),1.4,24,0.14,0.32);
  /* 树干：大气透视，越远越向地色收敛 */
  for(var i=0;i<trunks.length;i++){
    var tr=trunks[i];
    var col=lerpHsl(C.ombre,L.grnd,tr.fog);
    var tx=tr.x*W,tw=tr.w*W;
    bctx.save();
    bctx.translate(tx,0);bctx.transform(1,0,tr.lean,1,0,0);
    bctx.fillStyle=hsla(col[0],col[1],col[2],0.88);
    bctx.fillRect(-tw/2,-20,tw,H+40);
    /* 树皮碎色 */
    brokenFill(bctx,-tw/2,0,tw/2,H,col,Math.floor(tw*H/220),1.5708,14,0.14,0.32);
    /* 受光缘 */
    bctx.fillStyle=hsla(C.or[0],C.or[1],C.or[2],0.10+L.ray*0.14);
    bctx.fillRect(tw/2-2,-20,2.5,H+40);
    bctx.restore();
  }
  /* 地面落影碎色 */
  var shade=lerpHsl(L.leaf,C.ombre,0.55);
  brokenFill(bctx,0,H*0.62,W,H,shade,Math.floor(W*H/2000),1.5,20,0.10,0.24);
  /* 叶隙光斑：金色点彩 */
  var spots=Math.floor(26+L.gold*30);
  for(var s2=0;s2<spots;s2++){
    var sx=rnd()*W,sy=H*0.2+rnd()*H*0.75,rad=R(6,30)*(0.6+L.gold*0.6);
    var n2=Math.floor(rad*rad*0.09);
    for(var j=0;j<n2;j++){
      var a=rnd()*6.283,rr=Math.sqrt(rnd())*rad;
      var cc=rnd()<0.6?C.or:C.tache;
      bctx.fillStyle=hsla(cc[0]+R(-6,6),cc[1],cc[2]+R(-4,6),(0.06+(1-rr/rad)*0.3)*(0.35+L.ray*0.65));
      bctx.beginPath();bctx.arc(sx+Math.cos(a)*rr,sy+Math.sin(a)*rr,R(0.8,2.4),0,6.29);bctx.fill();
    }
  }
  /* 光束：晨暮低角度斜射 */
  if(L.ray>0.03){
    bctx.save();
    bctx.globalCompositeOperation='overlay';
    var nR=4;
    for(var r2=0;r2<nR;r2++){
      var bx=W*(0.15+r2*0.22),bw=W*(0.05+rnd()*0.04);
      var slope=Math.tan(L.rayA)*H;
      bctx.beginPath();
      bctx.moveTo(bx,0);bctx.lineTo(bx+bw,0);
      bctx.lineTo(bx+bw+slope,H);bctx.lineTo(bx+slope,H);
      bctx.closePath();
      var rg=bctx.createLinearGradient(0,0,0,H);
      rg.addColorStop(0,hsla(C.or[0],C.or[1]*0.7,72,L.ray*0.30));
      rg.addColorStop(1,hsla(C.or[0],C.or[1]*0.7,72,L.ray*0.06));
      bctx.fillStyle=rg;bctx.fill();
    }
    bctx.restore();
  }
  cacheDirty=false;
}

/* ---------- 纸纹 ---------- */
var paper=document.createElement('canvas');
function buildPaper(){
  paper.width=Math.max(2,Math.floor(W/2));paper.height=Math.max(2,Math.floor(H/2));
  var p=paper.getContext('2d');
  p.clearRect(0,0,paper.width,paper.height);
  for(var i=0;i<4200;i++){
    p.fillStyle='rgba('+(Math.random()<0.5?'255,255,255':'47,59,44')+','+R(0.02,0.06).toFixed(3)+')';
    p.fillRect(R(0,paper.width),R(0,paper.height),R(0.5,1.8),R(0.5,1.8));
  }
  for(var f=0;f<60;f++){
    p.strokeStyle='rgba(60,70,52,'+R(0.008,0.02).toFixed(3)+')';
    p.lineWidth=R(0.3,0.8);
    var x=R(0,paper.width),y=R(0,paper.height),a=R(0,6.28),Ln=R(20,90);
    p.beginPath();p.moveTo(x,y);p.lineTo(x+Math.cos(a)*Ln,y+Math.sin(a)*Ln);p.stroke();
  }
}

/* ---------- 风的粒子：墨迹笔触 ---------- */
var particles=[];
var COUNT=3000;
function spawn(){
  particles=[];
  for(var i=0;i<COUNT;i++){
    particles.push({
      x:Math.random()*W,y:Math.random()*H,px:0,py:0,
      life:Math.random()*180+40,gold:Math.random()<0.08,sd:R(0.6,1.4)
    });
  }
}

/* ---------- 燕子 L'Hirondelle（L4 彩蛋 + 落款同款 path） ---------- */
var SWPATH="M32 20 C 26 12, 14 6, 4 8 C 12 12, 18 18, 24 21 C 14 20, 6 22, 2 28 C 10 26, 18 26, 25 26 C 27 30, 30 34, 34 36 C 33 32, 33 28, 34 25 C 42 22, 52 16, 62 4 C 54 10, 44 16, 36 19 C 35 17, 33 17, 32 20 Z";
var swallowPath=new Path2D(SWPATH);
var swallow=null,swallowClock=R(14,26);
function launchSwallow(){
  var fromLeft=Math.random()<0.5;
  var y0=R(H*0.15,H*0.5),y1=R(H*0.2,H*0.6);
  var x0=fromLeft?-60:W+60,x1=fromLeft?W+60:-60;
  swallow={
    p0:{x:x0,y:y0},p1:{x:lerp(x0,x1,0.33),y:y0+R(-H*0.2,H*0.2)},
    p2:{x:lerp(x0,x1,0.66),y:y1+R(-H*0.2,H*0.2)},p3:{x:x1,y:y1},
    u:0,dur:R(2.6,3.8),flap:R(0,7)
  };
}
function bez(sw,u){
  var v=1-u;
  return {
    x:v*v*v*sw.p0.x+3*v*v*u*sw.p1.x+3*v*u*u*sw.p2.x+u*u*u*sw.p3.x,
    y:v*v*v*sw.p0.y+3*v*v*u*sw.p1.y+3*v*u*u*sw.p2.y+u*u*u*sw.p3.y
  };
}
function drawSwallow(L){
  if(!swallow){
    swallowClock-=0.016;
    if(swallowClock<0){launchSwallow();swallowClock=R(34,70);}
    return;
  }
  swallow.u+=0.016/swallow.dur;
  if(swallow.u>=1){swallow=null;return;}
  var pos=bez(swallow,swallow.u),nxt=bez(swallow,Math.min(1,swallow.u+0.02));
  var ang=Math.atan2(nxt.y-pos.y,nxt.x-pos.x);
  var dirx=Math.cos(ang),diry=Math.sin(ang);
  /* 翼尖扰流：附近粒子被卷入尾涡 */
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    var dx=p.x-pos.x,dy=p.y-pos.y;
    var d2=dx*dx+dy*dy;
    if(d2<8100){
      var d=Math.sqrt(d2)+0.1;
      var f=(1-d/90)*3.2;
      p.x+=dirx*f+(-dy/d)*f*0.8;
      p.y+=diry*f+(dx/d)*f*0.8;
    }
  }
  /* 画燕子：标准 path，扑翼用 scaleY 颤动 */
  ctx.save();
  ctx.translate(pos.x,pos.y);
  ctx.rotate(ang);
  var flap=0.55+0.45*Math.abs(Math.sin(t*14+swallow.flap));
  ctx.scale(1.15,flap*1.15);
  ctx.translate(-32,-20);
  ctx.fillStyle=hsla(C.ombre[0],C.ombre[1],C.ombre[2],0.92);
  ctx.fill(swallowPath);
  ctx.restore();
}

/* ---------- 声音：风 + 鸟鸣（默认 OFF） ---------- */
var AC=null,master=null,windGain=null,bpFilter=null,soundOn=false,birdClock=3;
function initAudio(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=0;master.connect(AC.destination);
  var len=AC.sampleRate*3,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0),last=0;
  for(var i=0;i<len;i++){var w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.2;}
  var src=AC.createBufferSource();src.buffer=buf;src.loop=true;
  bpFilter=AC.createBiquadFilter();bpFilter.type='bandpass';bpFilter.frequency.value=560;bpFilter.Q.value=0.9;
  windGain=AC.createGain();windGain.gain.value=0.05;
  src.connect(bpFilter);bpFilter.connect(windGain);windGain.connect(master);src.start();
}
function chirp(){
  if(!AC||!soundOn)return;
  var now=AC.currentTime,n=1+Math.floor(Math.random()*3);
  for(var i=0;i<n;i++){
    var t0=now+i*R(0.12,0.22);
    var o=AC.createOscillator(),m=AC.createOscillator(),mg=AC.createGain(),g=AC.createGain();
    o.type='sine';m.type='sine';
    var f0=R(2400,3200);
    o.frequency.setValueAtTime(f0,t0);
    o.frequency.exponentialRampToValueAtTime(f0*R(1.1,1.35),t0+0.08);
    m.frequency.value=R(60,140);
    mg.gain.value=f0*R(0.1,0.5);
    m.connect(mg);mg.connect(o.frequency);
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(R(0.01,0.028),t0+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+0.12);
    o.connect(g);g.connect(master);
    o.start(t0);o.stop(t0+0.14);m.start(t0);m.stop(t0+0.14);
  }
}
var sndBtn=document.getElementById('sndBtn');
function setSound(on){
  soundOn=on;sndBtn.classList.toggle('on',on);
  try{localStorage.setItem('atelier-mira-sound',on?'1':'0');}catch(e){}
  if(on&&!AC)initAudio();
  if(AC){if(AC.state==='suspended')AC.resume();
    var now=AC.currentTime;master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(master.gain.value,now);
    master.gain.linearRampToValueAtTime(on?0.8:0,now+(on?1.5:0.4));}
}
sndBtn.addEventListener('click',function(){setSound(!soundOn);});
try{if(localStorage.getItem('atelier-mira-sound')==='1'){
  soundOn=true;sndBtn.classList.add('on');
  var arm=function(){setSound(true);window.removeEventListener('pointerdown',arm);};
  window.addEventListener('pointerdown',arm);}}catch(e){}

/* ---------- 指针：拖拽给风一个方向，点击一阵湍流 ---------- */
var drag=null,hover={x:-100,y:-100},eddies=[];
function evtPos(e){return {x:e.clientX,y:e.clientY};}
cv.addEventListener('pointerdown',function(e){
  drag={o:evtPos(e),c:evtPos(e)};cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',function(e){
  hover=evtPos(e);
  if(drag){
    drag.c=evtPos(e);
    var dx=drag.c.x-drag.o.x,dy=drag.c.y-drag.o.y,len=Math.hypot(dx,dy);
    if(len>6){windT.ang=Math.atan2(dy,dx);windT.str=Math.min(2.4,0.25+len/140);}
  }
});
cv.addEventListener('pointerup',function(){
  if(drag){
    var dx=drag.c.x-drag.o.x,dy=drag.c.y-drag.o.y;
    if(Math.hypot(dx,dy)<=6)eddies.push({x:drag.c.x,y:drag.c.y,a:1});
  }
  drag=null;
});
window.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT')return;
  if(e.key==='h'||e.key==='H')togglePanel();
  if(e.key==='1')applyEtude('matin');if(e.key==='2')applyEtude('midi');if(e.key==='3')applyEtude('soir');
});

/* ---------- 控件 ---------- */
var oTurb=document.getElementById('oTurb'),oSpd=document.getElementById('oSpd'),oHeure=document.getElementById('oHeure');
document.getElementById('sTurb').addEventListener('input',function(){P.turb=+this.value/10;oTurb.textContent=P.turb.toFixed(1);markCustom();});
document.getElementById('sSpd').addEventListener('input',function(){P.speed=+this.value/100;oSpd.textContent=P.speed.toFixed(2);markCustom();});
var sHeure=document.getElementById('sHeure');
sHeure.addEventListener('input',function(){heureTarget=+this.value;heureAuto=false;});
document.getElementById('bNow').addEventListener('click',function(){heureAuto=true;});
document.getElementById('bRegen').addEventListener('click',function(){
  seed=Math.random()*999;buildTrunks();spawn();
  tctx.clearRect(0,0,W,H);cacheDirty=true;
});
document.getElementById('bDown').addEventListener('click',function(){
  var a=document.createElement('a');a.download='atelier-mira-n036-wind-field.png';
  a.href=cv.toDataURL('image/png');a.click();
});
var etudeBtns=document.querySelectorAll('#etudes button');
function markCustom(){etudeBtns.forEach(function(b){b.classList.remove('on');});}
function applyEtude(name){
  var e=ETUDES[name];if(!e)return;
  P.turb=e.turb;P.speed=e.spd;heureTarget=e.h;heureAuto=false;
  document.getElementById('sTurb').value=e.turb*10;document.getElementById('sSpd').value=e.spd*100;
  oTurb.textContent=e.turb.toFixed(1);oSpd.textContent=e.spd.toFixed(2);
  etudeBtns.forEach(function(b){b.classList.toggle('on',b.dataset.e===name);});
}
etudeBtns.forEach(function(b){b.addEventListener('click',function(){applyEtude(b.dataset.e);});});

var panel=document.getElementById('panel'),paneltab=document.getElementById('paneltab'),panelHidden=false;
function togglePanel(){
  panelHidden=!panelHidden;
  panel.classList.toggle('hidden',panelHidden);
  paneltab.classList.toggle('show',panelHidden);
}
paneltab.addEventListener('click',togglePanel);

var colClicks=0,colTimer=null;
document.getElementById('colophon').addEventListener('click',function(){
  colClicks++;clearTimeout(colTimer);
  colTimer=setTimeout(function(){colClicks=0;},900);
  if(colClicks>=3){document.getElementById('secret').classList.toggle('show');colClicks=0;}
});

/* ---------- 尺寸 ---------- */
function size(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  [cv,bgc,trl].forEach(function(c){c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);});
  ctx.setTransform(dpr,0,0,dpr,0,0);
  tctx.setTransform(dpr,0,0,dpr,0,0);
  buildTrunks();buildPaper();cacheDirty=true;
}
window.addEventListener('resize',size);

/* ---------- 风痕步进（frame 与首屏预演共用） ---------- */
function stepWind(L){
  /* 风痕层：旧痕向透明退（露出林间背景） */
  tctx.globalCompositeOperation='destination-out';
  tctx.fillStyle='rgba(0,0,0,0.02)';
  tctx.fillRect(0,0,W,H);
  tctx.globalCompositeOperation='source-over';
  var wx=Math.cos(wind.ang)*wind.str,wy=Math.sin(wind.ang)*wind.str;
  var inkA=0.32+(1-(L.grnd[2]/100))*0.2;
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    p.px=p.x;p.py=p.y;
    var a=fieldAng(p.x,p.y,t);
    var vx=(Math.cos(a)*1.25+wx)*P.speed*p.sd;
    var vy=(Math.sin(a)*1.25+wy)*P.speed*p.sd;
    /* hover 扰动 */
    var hx=p.x-hover.x,hy=p.y-hover.y,hd2=hx*hx+hy*hy;
    if(hd2<10000){var hd=Math.sqrt(hd2)+0.1,f2=(1-hd/100)*1.4;vx+=hx/hd*f2;vy+=hy/hd*f2;}
    /* 湍流涡 */
    for(var e2=0;e2<eddies.length;e2++){
      var ed=eddies[e2];
      var ex=p.x-ed.x,ey=p.y-ed.y,ed2=ex*ex+ey*ey;
      if(ed2<28900){var edd=Math.sqrt(ed2)+0.1,f3=(1-edd/170)*ed.a*4;vx+=(-ey/edd)*f3;vy+=(ex/edd)*f3;}
    }
    p.x+=vx;p.y+=vy;
    p.life--;
    if(p.x<0||p.x>W||p.y<0||p.y>H||p.life<0){
      p.x=Math.random()*W;p.y=Math.random()*H;p.px=p.x;p.py=p.y;
      p.life=Math.random()*180+40;continue;
    }
    if(p.gold){
      tctx.strokeStyle=hsla(C.or[0]+R(-5,5),C.or[1]*L.gold,C.or[2],0.55);
      tctx.lineWidth=1.4;
    }else{
      var inkCol=L.grnd[2]>46?C.ombre:C.feuille;
      var inkL2=L.grnd[2]>46?C.ombre[2]+R(-4,8):C.feuille[2]*0.8+R(-4,8);
      tctx.strokeStyle=hsla(inkCol[0]+R(-6,6),inkCol[1],inkL2,inkA*R(0.6,1));
      tctx.lineWidth=R(0.9,1.7);
    }
    tctx.beginPath();tctx.moveTo(p.px,p.py);tctx.lineTo(p.x,p.y);tctx.stroke();
  }
}

/* ---------- 主循环 ---------- */
var grainTick=0;
function fmtHeure(h){
  var hh=Math.floor(h)%24,mm=Math.floor((h%1)*60);
  return (hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;
}
function frame(){
  t+=0.016;frameN++;
  if(heureAuto)heureTarget=(new Date().getHours())+(new Date().getMinutes())/60;
  var dh=heureTarget-heure;
  if(Math.abs(dh)>0.0005){heure+=dh*0.06;cacheDirty=true;}
  sHeure.value=heure;oHeure.textContent=fmtHeure(heure);
  /* 风向量阻尼跟随（最短角路径） */
  var da=windT.ang-wind.ang;
  while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;
  wind.ang+=da*0.04;
  wind.str+=(windT.str-wind.str)*0.04;
  for(var ei=eddies.length-1;ei>=0;ei--){eddies[ei].a*=0.94;if(eddies[ei].a<0.02)eddies.splice(ei,1);}

  var L=lightAt(((heure%24)+24)%24);
  if(cacheDirty){
    rebuildWood(L);
    document.documentElement.style.setProperty('--uitxt',L.grnd[2]>46?'#33402A':'#E8E3CE');
  }

  stepWind(L);

  ctx.clearRect(0,0,W,H);
  ctx.drawImage(bgc,0,0,W,H);
  ctx.drawImage(trl,0,0,W,H);

  /* 燕子飞渡 */
  drawSwallow(L);

  /* 拖拽风向箭头（金色，作品世界的一部分） */
  if(drag){
    var ddx=drag.c.x-drag.o.x,ddy=drag.c.y-drag.o.y,dlen=Math.hypot(ddx,ddy);
    if(dlen>6){
      var ux=ddx/dlen,uy=ddy/dlen;
      ctx.strokeStyle=hsla(C.or[0],C.or[1],42,0.95);ctx.fillStyle=hsla(C.or[0],C.or[1],42,0.95);
      ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(drag.o.x,drag.o.y);ctx.lineTo(drag.c.x,drag.c.y);ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(drag.c.x,drag.c.y);
      ctx.lineTo(drag.c.x-ux*14-uy*7,drag.c.y-uy*14+ux*7);
      ctx.lineTo(drag.c.x-ux*14+uy*7,drag.c.y-uy*14-ux*7);
      ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.arc(drag.o.x,drag.o.y,4,0,6.29);ctx.fill();
    }
  }

  /* 夜萤 */
  if(L.grnd[2]<26){
    for(var fi=0;fi<26;fi++){
      var fx=((fi*431)%1000)/1000*W+Math.sin(t*0.7+fi)*30;
      var fy=H*0.4+((fi*179)%500)/1000*H+Math.cos(t*0.5+fi*2)*20;
      var gl=Math.max(0,Math.sin(t*1.8+fi*1.3));
      if(gl<0.1)continue;
      ctx.fillStyle=hsla(C.or[0],C.or[1]*0.7,68,gl*0.8);
      ctx.beginPath();ctx.arc(fx,fy,1.8,0,6.29);ctx.fill();
    }
  }

  /* 纸纹 + 颗粒 + 暗角 */
  ctx.save();ctx.globalAlpha=0.4;ctx.globalCompositeOperation='overlay';
  ctx.drawImage(paper,0,0,W,H);ctx.restore();
  grainTick++;
  if(grainTick%5===0){
    ctx.save();ctx.globalAlpha=0.05;
    for(var gN=0;gN<380;gN++){
      ctx.fillStyle=Math.random()<0.5?'#fff':'#2F3B2C';
      ctx.fillRect(Math.random()*W,Math.random()*H,1.2,1.2);
    }
    ctx.restore();
  }
  var vg=ctx.createRadialGradient(W/2,H*0.44,H*0.3,W/2,H*0.44,W*0.75);
  vg.addColorStop(0,hsla(100,18,20,0));vg.addColorStop(1,hsla(100,18,20,0.32));
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);

  /* 声景 */
  if(AC&&soundOn){
    windGain.gain.value=0.03+wind.str*0.03+P.turb*0.008;
    bpFilter.frequency.value=420+wind.str*160+Math.sin(t*0.4)*80;
    birdClock-=0.016;
    if(birdClock<0){chirp();birdClock=R(2,9);}
  }
  requestAnimationFrame(frame);
}

size();spawn();
/* 首屏预演：风已经吹了一会儿 */
(function(){
  var L0=lightAt(((heure%24)+24)%24);
  for(var w=0;w<240;w++){t+=0.016;stepWind(L0);}
})();
if(window.innerWidth<700){panel.classList.add('notrans');togglePanel();requestAnimationFrame(function(){panel.classList.remove('notrans');});}
requestAnimationFrame(frame);
})();
</script>
