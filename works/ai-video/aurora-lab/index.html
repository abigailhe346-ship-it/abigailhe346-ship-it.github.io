<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurora Lab — 极光实验室 · Atelier MIRA N°040</title>
<!--
  调色板家族（自拟，依 BRIEF-v2 §1.1.3）：
  「极夜 Nuit Polaire」— 特罗姆瑟以北的一月，下午两点只剩一线微光。冷，≈9000K。
  #26363C 极夜底 · #3E5A5E 远山海 · #6E8B84 低帘绿 · #8FB89B 氧光绿 · #C9D6C5 星雾 · #D8B98A 地平一线暖（点缀 ≤8%）
  黎明借色 ≤2：#C9CDD6 雾紫灰、#E8E6DF 雾白（晨雾家族）。
-->
<style>
:root{
  --night:#26363C; --sea:#3E5A5E; --low:#6E8B84; --oxy:#8FB89B; --mist:#C9D6C5; --sand:#D8B98A;
  --ink:#1C2B30; --paper-txt:#DCE5DA;
  --serif:Didot,"Bodoni MT",Georgia,"Songti SC",serif;
  --mono:"SF Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC",sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--night);color:var(--paper-txt);font-family:var(--sans);overflow:hidden}
::selection{background:var(--oxy);color:var(--ink)}
a{color:inherit;text-decoration:none}
canvas#sky{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}

.nameplate{position:fixed;top:26px;left:30px;pointer-events:none;text-shadow:0 1px 14px rgba(28,43,48,.55)}
.nameplate .no{font-family:var(--mono);font-size:10px;letter-spacing:.22em;opacity:.72}
.nameplate h1{font-family:var(--serif);font-weight:400;font-size:clamp(24px,3.2vw,38px);letter-spacing:.02em;margin-top:7px;color:#E7EEE3}
.nameplate h1 em{font-style:italic;color:var(--oxy)}
.nameplate .epig{font-family:var(--serif);font-style:italic;font-size:14.5px;opacity:.82;margin-top:8px;max-width:320px;line-height:1.6}
.nameplate .coord{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;opacity:.5;margin-top:10px}

.colophon{position:fixed;left:30px;bottom:22px;display:flex;align-items:center;gap:9px;pointer-events:auto;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;opacity:.66;text-shadow:0 1px 8px rgba(28,43,48,.6);cursor:pointer;user-select:none}
.colophon svg{flex:0 0 auto}
.colophon:hover{opacity:.9}
.secret{position:fixed;left:30px;bottom:48px;max-width:300px;font-family:var(--serif);font-style:italic;font-size:14px;line-height:1.7;
  color:#E7EEE3;opacity:0;transform:translateY(6px);transition:all .8s var(--ease);pointer-events:none;text-shadow:0 1px 10px rgba(28,43,48,.7)}
.secret.show{opacity:.92;transform:translateY(0)}

.topright{position:fixed;top:26px;right:30px;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.sndbtn{width:34px;height:34px;border:1px solid rgba(220,229,218,.4);background:rgba(38,54,60,.35);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s var(--ease)}
.sndbtn:hover{border-color:var(--oxy)}
.sndbtn.on{background:rgba(143,184,155,.2);border-color:var(--oxy)}
.sndbtn svg{stroke:var(--paper-txt)}
.hintline{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;opacity:.55;text-align:right;line-height:1.9;pointer-events:none;text-shadow:0 1px 8px rgba(28,43,48,.6)}

.panel{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:calc(100vw - 28px);
  background:rgba(38,54,60,.62);backdrop-filter:blur(12px);border:1px solid rgba(220,229,218,.22);
  padding:13px 20px 14px;transition:all .5s var(--ease)}
.panel.hidden{transform:translateX(-50%) translateY(14px);opacity:0;pointer-events:none}
.panel.noanim,.paneltab.noanim{transition:none}
.panel .prow{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap;justify-content:center}
.ctl{display:flex;flex-direction:column;gap:7px}
.ctl label{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:rgba(220,229,218,.62);display:flex;justify-content:space-between;gap:12px}
.ctl label output{color:var(--oxy)}
input[type=range]{-webkit-appearance:none;appearance:none;width:124px;height:18px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:rgba(220,229,218,.4)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:10px;height:10px;margin-top:-4.5px;background:var(--night);border:1px solid var(--oxy);border-radius:50%}
input[type=range]::-webkit-slider-thumb:hover{background:var(--oxy)}
input[type=range]::-moz-range-track{height:1px;background:rgba(220,229,218,.4)}
input[type=range]::-moz-range-thumb{width:9px;height:9px;background:var(--night);border:1px solid var(--oxy);border-radius:50%}
input[type=range].timerule::-webkit-slider-runnable-track{height:5px;border-radius:3px;
  background:linear-gradient(90deg,#26363C 0%,#3E5A5E 18%,#C9CDD6 30%,#E8E6DF 45%,#C9CDD6 62%,#3E5A5E 78%,#26363C 100%)}
input[type=range].timerule::-moz-range-track{height:5px;border-radius:3px;
  background:linear-gradient(90deg,#26363C 0%,#3E5A5E 18%,#C9CDD6 30%,#E8E6DF 45%,#C9CDD6 62%,#3E5A5E 78%,#26363C 100%)}
.etudes{display:flex;gap:6px}
.etudes button,.act{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;padding:8px 12px;
  background:transparent;color:var(--paper-txt);border:1px solid rgba(220,229,218,.35);cursor:pointer;transition:all .25s var(--ease)}
.etudes button:hover,.act:hover{border-color:var(--oxy);color:var(--oxy)}
.etudes button.on{background:rgba(143,184,155,.18);border-color:var(--oxy);color:var(--oxy)}
.paneltab{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);font-family:var(--mono);font-size:9px;letter-spacing:.18em;
  text-transform:uppercase;color:rgba(220,229,218,.6);border:1px solid rgba(220,229,218,.3);background:rgba(38,54,60,.5);
  padding:7px 14px;cursor:pointer;opacity:0;pointer-events:none;transition:all .5s var(--ease)}
.paneltab.show{opacity:1;pointer-events:auto}
.paneltab:hover{color:var(--oxy);border-color:var(--oxy)}

@media(max-width:700px){
  .nameplate{top:18px;left:18px}
  .nameplate .epig{font-size:13px;max-width:230px}
  .topright{top:18px;right:18px}
  .hintline{display:none}
  .colophon{left:18px;bottom:16px;font-size:9px}
  .panel{bottom:14px;padding:11px 12px;width:calc(100vw - 24px);max-height:44vh;overflow-y:auto}
  .panel .prow{gap:10px;justify-content:flex-start}
  input[type=range]{width:82px}
  .etudes button,.act{padding:7px 9px}
  .paneltab{bottom:44px}
}
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div class="nameplate">
  <div class="no">N°040 · AI·VIDEO</div>
  <h1>Aurora <em>Lab</em> · 极光实验室</h1>
  <div class="epig">极夜不是黑的——是绿光在天上慢慢呼吸。</div>
  <div class="coord">69.6°N 18.9°E · 合成观测站</div>
</div>

<div class="topright">
  <div class="sndbtn" id="sndBtn" title="环境声（默认关闭）" role="button" aria-label="toggle sound">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke-width="1.3" stroke-linecap="round">
      <path d="M2 6.5v3h2.5L8 12.5v-9L4.5 6.5H2z" fill="currentColor" stroke="none" opacity=".85"/>
      <path class="w1" d="M10.5 5.5c1.4 1.4 1.4 3.6 0 5"/>
      <path class="w2" d="M12.5 3.5c2.6 2.6 2.6 6.4 0 9"/>
    </svg>
  </div>
  <div class="hintline">按住天空 · 时间流动<br>点击 · 激起光波<br>空格长按 · 磁暴 · H 收起画具</div>
</div>

<div class="colophon" id="colophon">
  <svg width="22" height="14" viewBox="0 0 64 40" fill="#C9D6C5" aria-hidden="true">
    <path d="M32 20 C 26 12, 14 6, 4 8 C 12 12, 18 18, 24 21
             C 14 20, 6 22, 2 28 C 10 26, 18 26, 25 26
             C 27 30, 30 34, 34 36 C 33 32, 33 28, 34 25
             C 42 22, 52 16, 62 4 C 54 10, 44 16, 36 19
             C 35 17, 33 17, 32 20 Z"/>
  </svg>
  <span>Atelier MIRA · N°040 · 极夜 Nuit Polaire</span>
</div>
<div class="secret" id="secret">一月在这里，下午两点天就黑了。<br>守站的人说：等绿光亮起来的时候，<br>谁还舍得睡觉。</div>

<div class="panel" id="panel">
  <div class="prow">
    <div class="etudes" id="etudes">
      <button data-e="calme" class="on">静夜</button><button data-e="vent">起风</button><button data-e="orage">磁暴</button>
    </div>
    <div class="ctl"><label>色带 Dérive <output id="oHue">氧绿 557</output></label>
      <input type="range" id="sHue" min="0" max="100" value="30"></div>
    <div class="ctl"><label>地磁 Kp <output id="oKp">4</output></label>
      <input type="range" id="sKp" min="1" max="9" step="1" value="4"></div>
    <div class="ctl"><label>时刻 Heure <output id="oHeure">—</output></label>
      <input type="range" id="sHeure" class="timerule" min="0" max="24" step="0.05" value="22"></div>
    <button class="act" id="bNow">此刻</button>
    <button class="act" id="bRegen">换一夜 ↻</button>
    <button class="act" id="bDown">收下这片天</button>
  </div>
</div>
<div class="paneltab" id="paneltab">画具 · H</div>

<script>
(function(){
"use strict";
/* ================================================================
   Aurora Lab — 极夜写生
   heure 时间系统 · 碎色帘幕 · 磁暴 corona · WebAudio 风与低鸣
   ================================================================ */
var cv=document.getElementById('sky'),ctx=cv.getContext('2d');
var W=0,H=0,dpr=1,t=0,frameN=0;
var seed=Math.random()*999;
function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
function R(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,k){return a+(b-a)*k;}

/* ---------- HSL 工具（canvas 的 fillStyle/addColorStop 不认 hsl() 字符串，统一转 rgb 输出） ---------- */
function hex2hsl(hex){
  var r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  var mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,h=0,s=0;
  if(mx!==mn){var d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);
    if(mx===r)h=((g-b)/d+(g<b?6:0));else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;}
  return [h,s*100,l*100];
}
function hsl2rgb(h,s,l){
  h=((h%360)+360)%360;s=clamp(s,0,100)/100;l=clamp(l,0,100)/100;
  var c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2,r=0,g=0,b=0;
  if(h<60){r=c;g=x;}else if(h<120){r=x;g=c;}else if(h<180){g=c;b=x;}
  else if(h<240){g=x;b=c;}else if(h<300){r=x;b=c;}else{r=c;b=x;}
  return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)];
}
function hsl(h,s,l){var c=hsl2rgb(h,s,l);return 'rgb('+c[0]+','+c[1]+','+c[2]+')';}
function hsla(h,s,l,a){var c=hsl2rgb(h,s,l);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function lerpHsl(c1,c2,k){
  var dh=c2[0]-c1[0];if(dh>180)dh-=360;if(dh<-180)dh+=360;
  return [c1[0]+dh*k,lerp(c1[1],c2[1],k),lerp(c1[2],c2[2],k)];
}
var C={night:hex2hsl('#26363C'),sea:hex2hsl('#3E5A5E'),low:hex2hsl('#6E8B84'),oxy:hex2hsl('#8FB89B'),
       mist:hex2hsl('#C9D6C5'),sand:hex2hsl('#D8B98A')};

/* ---------- heure：一天的光（关键帧插值，HSL 不走 RGB） ---------- */
var heure=(new Date().getHours())+(new Date().getMinutes())/60;
var heureTarget=heure,heureAuto=true;
function lightAt(h){
  var K=[
    [0.0, {top:[218,22,12],hor:[200,18,20],au:1.00,st:1.00,ml:0.10}],
    [4.5, {top:[218,22,12],hor:[200,18,20],au:1.00,st:1.00,ml:0.10}],
    [6.5, {top:[220,16,34],hor:[240,10,60],au:0.28,st:0.35,ml:0.38}],
    [9.0, {top:[215,12,52],hor:[46,20,66], au:0.05,st:0.06,ml:0.72}],
    [12.0,{top:[210,14,58],hor:[46,26,70], au:0.02,st:0.03,ml:0.85}],
    [15.0,{top:[214,13,50],hor:[44,20,64], au:0.05,st:0.08,ml:0.66}],
    [17.5,{top:[222,16,32],hor:[30,22,46], au:0.30,st:0.40,ml:0.36}],
    [20.0,{top:[220,20,16],hor:[205,20,22],au:0.85,st:0.90,ml:0.14}],
    [24.0,{top:[218,22,12],hor:[200,18,20],au:1.00,st:1.00,ml:0.10}]
  ];
  for(var i=0;i<K.length-1;i++){
    if(h>=K[i][0]&&h<=K[i+1][0]){
      var k=(h-K[i][0])/(K[i+1][0]-K[i][0]);k=k*k*(3-2*k);
      var A=K[i][1],B=K[i+1][1];
      return {top:lerpHsl(A.top,B.top,k),hor:lerpHsl(A.hor,B.hor,k),
              au:lerp(A.au,B.au,k),st:lerp(A.st,B.st,k),ml:lerp(A.ml,B.ml,k)};
    }
  }
  return {top:K[0][1].top,hor:K[0][1].hor,au:1,st:1,ml:0.1};
}

/* ---------- 参数 ---------- */
var P={hueDrift:0.30,kp:4,kpCur:4};
var ETUDES={calme:{hue:0.30,kp:3},vent:{hue:0.55,kp:5},orage:{hue:0.30,kp:9}};
var stormT=0;

/* ---------- 指针（阻尼 + 惯性 + 剪切风） ---------- */
var mx=0.5,my=0.45,tmx=0.5,tmy=0.45,shear=0,shearV=0,lastMx=0.5;
var waves=[];
var holdT=0,holding=false,spaceHeld=false;

/* ---------- 场景缓存 ---------- */
var cache=document.createElement('canvas'),cctx=cache.getContext('2d');
var cacheDirty=true;
var stars=[],ridges=[];

function buildStars(){
  stars=[];var n=Math.floor(W*H/5200);
  for(var i=0;i<n;i++)stars.push({x:rnd()*W,y:rnd()*H*0.72,r:rnd(0.4,1.4),ph:rnd(0,6.28),sp:R(0.4,1.8)});
}
function buildRidges(){
  ridges=[];
  var layers=[
    {base:0.80,amp:0.045,fog:0.55},
    {base:0.86,amp:0.060,fog:0.25},
    {base:0.94,amp:0.085,fog:-0.15}
  ];
  for(var l=0;l<layers.length;l++){
    var off=rnd(0,100),pts=[];
    for(var x=0;x<=W;x+=8){
      var y=H*(layers[l].base
        +Math.sin(x*0.004+off)*layers[l].amp
        +Math.sin(x*0.013+off*2.7)*layers[l].amp*0.45
        +Math.sin(x*0.047+off*5.1)*layers[l].amp*0.30
        +Math.sin(x*0.13+off*9.3)*layers[l].amp*0.12);
      pts.push([x,y]);
    }
    ridges.push({pts:pts,layer:layers[l]});
  }
}

function brokenFill(c,x0,y0,x1,y1,baseHsl,n,ang,ln){
  for(var i=0;i<n;i++){
    var x=R(x0,x1),y=R(y0,y1);
    var h=baseHsl[0]+R(-8,8),s=baseHsl[1]+R(-6,6),l=baseHsl[2]+R(-5,5);
    c.strokeStyle=hsla(h,s,l,R(0.28,0.6));
    c.lineWidth=R(1,2.4);
    var a=ang+R(-0.4,0.4),L=R(ln*0.5,ln*1.5);
    c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.cos(a)*L,y+Math.sin(a)*L);c.stroke();
  }
}

function rebuildCache(){
  cache.width=W*dpr;cache.height=H*dpr;cctx.setTransform(dpr,0,0,dpr,0,0);
  var L=lightAt(((heure%24)+24)%24);
  var g=cctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,hsl(L.top[0],L.top[1],L.top[2]));
  g.addColorStop(0.62,hsl(L.hor[0],L.hor[1],L.hor[2]-2));
  g.addColorStop(1,hsl(L.hor[0],L.hor[1],L.hor[2]+1));
  cctx.fillStyle=g;cctx.fillRect(0,0,W,H);
  brokenFill(cctx,0,0,W,H*0.75,L.top,Math.floor(W*H/3800),0.2,26);
  brokenFill(cctx,0,H*0.5,W,H*0.85,L.hor,Math.floor(W*H/6000),0.05,30);
  if(L.ml>0.25){
    var warm=cctx.createLinearGradient(0,H*0.62,0,H*0.85);
    warm.addColorStop(0,hsla(C.sand[0],C.sand[1],C.sand[2],0));
    warm.addColorStop(0.65,hsla(C.sand[0],C.sand[1],C.sand[2],(L.ml-0.25)*0.5));
    warm.addColorStop(1,hsla(C.sand[0],C.sand[1],C.sand[2],0));
    cctx.fillStyle=warm;cctx.fillRect(0,H*0.6,W,H*0.28);
  }
  for(var r=0;r<ridges.length;r++){
    var rd=ridges[r],fog=rd.layer.fog;
    var base=r===0?C.sea:(r===1?C.night:hex2hsl('#1C2B30'));
    var lit=lerpHsl(base,L.hor,fog*0.8);
    var shade=lerpHsl(lit,C.mist,L.ml*0.35*fog);
    cctx.beginPath();cctx.moveTo(0,H);
    for(var i=0;i<rd.pts.length;i++)cctx.lineTo(rd.pts[i][0],rd.pts[i][1]);
    cctx.lineTo(W,H);cctx.closePath();
    cctx.fillStyle=hsl(shade[0],shade[1],shade[2]);cctx.fill();
    cctx.save();cctx.clip();
    var snowCol=lerpHsl(C.mist,L.hor,fog*0.6);
    for(var s=0;s<rd.pts.length;s+=2){
      var p=rd.pts[s];
      if(rnd()<0.75){
        cctx.strokeStyle=hsla(snowCol[0],snowCol[1],snowCol[2]+L.ml*14,R(0.1,0.3)*(0.35+L.ml*0.65));
        cctx.lineWidth=R(0.8,1.8);
        var lx=R(4,14);
        cctx.beginPath();cctx.moveTo(p[0]-lx/2,p[1]+R(0,3));cctx.lineTo(p[0]+lx/2,p[1]+R(-1,3));cctx.stroke();
      }
    }
    brokenFill(cctx,0,H*rd.layer.base-10,W,H,shade,Math.floor(W/6),1.35,18);
    cctx.restore();
  }
  cacheDirty=false;
}

/* ---------- 纸纹 ---------- */
var paper=document.createElement('canvas');
function buildPaper(){
  paper.width=Math.max(2,Math.floor(W/2));paper.height=Math.max(2,Math.floor(H/2));
  var p=paper.getContext('2d');
  p.clearRect(0,0,paper.width,paper.height);
  for(var i=0;i<4200;i++){
    p.fillStyle='rgba('+(rnd()<0.5?'255,255,255':'0,0,0')+','+R(0.02,0.06).toFixed(3)+')';
    p.fillRect(rnd(0,paper.width),rnd(0,paper.height),R(0.5,1.8),R(0.5,1.8));
  }
  for(var f=0;f<60;f++){
    p.strokeStyle='rgba(255,255,255,'+R(0.008,0.02).toFixed(3)+')';
    p.lineWidth=R(0.3,0.8);
    var x=rnd(0,paper.width),y=rnd(0,paper.height),a=rnd(0,6.28),Ln=R(20,90);
    p.beginPath();p.moveTo(x,y);p.lineTo(x+Math.cos(a)*Ln,y+Math.sin(a)*Ln);p.stroke();
  }
}

/* ---------- 极光帘幕 ---------- */
var curtains=[];
function buildCurtains(){
  curtains=[];
  var n=1+Math.round(P.kpCur/3.2);
  for(var i=0;i<n;i++){
    curtains.push({
      base:0.10+rnd(0,0.20),amp:0.04+rnd(0,0.08)+P.kpCur*0.006,
      len:0.15+rnd(0,0.22),
      f1:1+rnd(0,2),f2:2+rnd(0,3),f3:4+rnd(0,4),
      p1:rnd(0,7),p2:rnd(0,7),p3:rnd(0,7),
      sp:0.16+rnd(0,0.5),dh:R(-14,14),depth:n>1?i/(n-1):0
    });
  }
}

function drawAurora(L){
  var au=L.au*(1+stormT*1.6);
  if(au<0.015)return;
  var par=(mx-0.5)*36,parY=(my-0.5)*14;
  var baseHue=lerp(150,196,P.hueDrift);
  for(var c=0;c<curtains.length;c++){
    var cu=curtains[c];
    var depthFog=cu.depth*0.35;
    var step=5;
    for(var x=0;x<=W;x+=step){
      var u=x/W;
      var waveShear=shear*Math.sin(u*3+t*0.7)*18;
      var top=H*(cu.base
        +cu.amp*Math.sin(u*cu.f1*3+t*cu.sp+cu.p1)
        +cu.amp*0.6*Math.sin(u*cu.f2*5-t*cu.sp*1.7+cu.p2)
        +cu.amp*0.35*Math.sin(u*cu.f3*9+t*cu.sp*2.3+cu.p3))
        +par*(0.25+c*0.3)+parY*cu.depth*0.4+waveShear;
      var len=H*cu.len*(0.75+0.25*Math.sin(u*6+t+cu.p3))*(1+stormT*0.7);
      var pulse=0.5+0.5*Math.sin(u*cu.f2*4+t*1.3+cu.p2);
      var hue=baseHue+cu.dh+Math.sin(t*0.1+cu.p1)*10+R(-8,8);
      var sat=lerp(52,30,depthFog),lit=lerp(64,50,depthFog);
      var a=au*pulse;
      var seg=Math.max(3,Math.floor(len/3));
      for(var sg=0;sg<3;sg++){
        var y0=top+sg*seg;
        var fade=(1-sg/3);
        ctx.fillStyle=hsla(hue+sg*10,sat,lit+sg*4,clamp(a*(0.62-sg*0.16),0,0.85)*(0.9-fade*0.25));
        ctx.fillRect(x+R(-1,1),y0,step+R(-1.5,1),seg+1.5);
      }
      if(a>0.06){
        ctx.globalCompositeOperation='lighter';
        ctx.fillStyle=hsla(hue,sat+8,lit+14,a*0.26);
        ctx.fillRect(x,top,step+R(-1,1),R(1.6,3.2));
        ctx.globalCompositeOperation='source-over';
      }
    }
  }
}

/* 磁暴 corona：万籁朝宗，光线向天顶汇聚 */
function drawCorona(L){
  if(stormT<0.02)return;
  var zx=W*(0.3+mx*0.4),zy=H*0.10;
  var au=L.au*stormT;
  ctx.globalCompositeOperation='lighter';
  var rays=64;
  for(var i=0;i<rays;i++){
    var a=(i/rays)*Math.PI*2+t*0.05;
    var noise=Math.sin(i*12.9898+seed)*43758.55;noise-=Math.floor(noise);
    var L2=H*(0.25+noise*0.55)*(0.7+0.3*Math.sin(t*2+i));
    var hue=150+Math.sin(i*0.7+t)*24;
    ctx.strokeStyle=hsla(hue,50,66,au*0.10*(0.4+noise*0.6));
    ctx.lineWidth=1.4+noise*2.4;
    ctx.beginPath();ctx.moveTo(zx,zy);
    ctx.lineTo(zx+Math.cos(a)*L2,zy+Math.sin(a)*L2*1.35);
    ctx.stroke();
  }
  var g=ctx.createRadialGradient(zx,zy,0,zx,zy,H*0.3);
  g.addColorStop(0,hsla(150,45,70,au*0.16));g.addColorStop(1,hsla(150,45,70,0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(zx,zy,H*0.3,0,6.29);ctx.fill();
  ctx.globalCompositeOperation='source-over';
}

function drawWaves(){
  for(var i=waves.length-1;i>=0;i--){
    var w=waves[i];w.r+=4.6;w.a*=0.965;
    ctx.strokeStyle=hsla(150,40,72,w.a*0.4);
    ctx.lineWidth=1.2;
    ctx.beginPath();ctx.arc(w.x,w.y,w.r,0,6.29);ctx.stroke();
    if(w.a<0.02)waves.splice(i,1);
  }
}

/* ---------- 声音：风 + 地磁低鸣（默认 OFF） ---------- */
var AC=null,master=null,windGain=null,droneGain=null,soundOn=false;
function initAudio(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=0;master.connect(AC.destination);
  var len=AC.sampleRate*3,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0),last=0;
  for(var i=0;i<len;i++){var w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.2;}
  var src=AC.createBufferSource();src.buffer=buf;src.loop=true;
  var bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=560;bp.Q.value=0.9;
  windGain=AC.createGain();windGain.gain.value=0.05;
  src.connect(bp);bp.connect(windGain);windGain.connect(master);src.start();
  var o1=AC.createOscillator(),o2=AC.createOscillator();
  o1.frequency.value=54;o2.frequency.value=54.6;o1.type='sine';o2.type='sine';
  droneGain=AC.createGain();droneGain.gain.value=0.0;
  var lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=220;
  o1.connect(lp);o2.connect(lp);lp.connect(droneGain);droneGain.connect(master);
  o1.start();o2.start();
}
var sndBtn=document.getElementById('sndBtn');
function setSound(on){
  soundOn=on;sndBtn.classList.toggle('on',on);
  try{localStorage.setItem('atelier-mira-sound',on?'1':'0');}catch(e){}
  if(on&&!AC)initAudio();
  if(AC){if(AC.state==='suspended')AC.resume();
    var now=AC.currentTime;master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(master.gain.value,now);
    master.gain.linearRampToValueAtTime(on?0.8:0,now+(on?1.5:0.4));}
}
sndBtn.addEventListener('click',function(){setSound(!soundOn);});
try{if(localStorage.getItem('atelier-mira-sound')==='1'){
  soundOn=true;sndBtn.classList.add('on');
  var arm=function(){setSound(true);window.removeEventListener('pointerdown',arm);};
  window.addEventListener('pointerdown',arm);}}catch(e){}

/* ---------- 交互 ---------- */
cv.addEventListener('pointermove',function(e){
  tmx=e.clientX/window.innerWidth;tmy=e.clientY/window.innerHeight;
  shearV+=(tmx-lastMx)*6;lastMx=tmx;
});
cv.addEventListener('pointerdown',function(e){
  holding=true;holdT=0;
  waves.push({x:e.clientX,y:e.clientY,r:0,a:1});
});
window.addEventListener('pointerup',function(){holding=false;});
window.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT')return;
  if(e.code==='Space'){e.preventDefault();spaceHeld=true;}
  if(e.key==='h'||e.key==='H')togglePanel();
  if(e.key==='1')applyEtude('calme');if(e.key==='2')applyEtude('vent');if(e.key==='3')applyEtude('orage');
});
window.addEventListener('keyup',function(e){if(e.code==='Space')spaceHeld=false;});

/* ---------- 控件 ---------- */
var oHue=document.getElementById('oHue'),oKp=document.getElementById('oKp'),oHeure=document.getElementById('oHeure');
var hueNames=[[0,'氧绿 557'],[0.4,'青羽 502'],[0.75,'氮蓝 428'],[1,'紫缘 380']];
function hueName(v){var b=hueNames[0];hueNames.forEach(function(n){if(v>=n[0])b=n;});return b[1];}
document.getElementById('sHue').addEventListener('input',function(){
  P.hueDrift=+this.value/100;oHue.textContent=hueName(P.hueDrift);markCustom();
});
document.getElementById('sKp').addEventListener('input',function(){
  P.kp=+this.value;oKp.textContent=this.value;markCustom();
});
var sHeure=document.getElementById('sHeure');
sHeure.addEventListener('input',function(){heureTarget=+this.value;heureAuto=false;});
document.getElementById('bNow').addEventListener('click',function(){heureAuto=true;});
document.getElementById('bRegen').addEventListener('click',function(){
  seed=Math.random()*999;buildStars();buildRidges();buildCurtains();buildPaper();cacheDirty=true;
});
document.getElementById('bDown').addEventListener('click',function(){
  var a=document.createElement('a');a.download='atelier-mira-n040-aurora.png';
  a.href=cv.toDataURL('image/png');a.click();
});
var etudeBtns=document.querySelectorAll('#etudes button');
function markCustom(){etudeBtns.forEach(function(b){b.classList.remove('on');});}
function applyEtude(name){
  var e=ETUDES[name];if(!e)return;
  P.hueDrift=e.hue;P.kp=e.kp;
  document.getElementById('sHue').value=e.hue*100;
  document.getElementById('sKp').value=e.kp;
  oHue.textContent=hueName(e.hue);oKp.textContent=e.kp;
  etudeBtns.forEach(function(b){b.classList.toggle('on',b.dataset.e===name);});
}
etudeBtns.forEach(function(b){b.addEventListener('click',function(){applyEtude(b.dataset.e);});});

var panel=document.getElementById('panel'),paneltab=document.getElementById('paneltab'),panelHidden=false;
function togglePanel(){
  panelHidden=!panelHidden;
  panel.classList.toggle('hidden',panelHidden);
  paneltab.classList.toggle('show',panelHidden);
}
paneltab.addEventListener('click',togglePanel);

var colClicks=0,colTimer=null;
document.getElementById('colophon').addEventListener('click',function(){
  colClicks++;clearTimeout(colTimer);
  colTimer=setTimeout(function(){colClicks=0;},900);
  if(colClicks>=3){document.getElementById('secret').classList.toggle('show');colClicks=0;}
});

/* ---------- 尺寸 ---------- */
function size(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  buildStars();buildRidges();buildPaper();cacheDirty=true;
}
window.addEventListener('resize',size);

/* ---------- 主循环 ---------- */
var grainTick=0;
function fmtHeure(h){
  var hh=Math.floor(h)%24,mm=Math.floor((h%1)*60);
  return (hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;
}
function frame(){
  t+=0.016;frameN++;
  if(holding){holdT+=0.016;if(holdT>0.35){heureAuto=false;heureTarget=(heureTarget+0.028)%24;}}
  if(heureAuto){heureTarget=(new Date().getHours())+(new Date().getMinutes())/60;}
  var dh=heureTarget-heure;
  if(Math.abs(dh)>0.0005){heure+=dh*0.06;cacheDirty=true;}
  sHeure.value=heure;oHeure.textContent=fmtHeure(heure);
  P.kpCur+=(P.kp-P.kpCur)*0.05;
  if(Math.abs(P.kp-P.kpCur)>0.02&&frameN%30===0)buildCurtains();
  var stormTarget=(P.kpCur>=8.5||spaceHeld)?1:0;
  stormT+=(stormTarget-stormT)*0.03;
  mx+=(tmx-mx)*0.07;my+=(tmy-my)*0.07;
  shearV*=0.94;shear+=shearV;shear*=0.96;
  if(AC&&soundOn){
    windGain.gain.value=0.04+P.kpCur*0.008+stormT*0.05;
    droneGain.gain.value=stormT*0.06+P.kpCur*0.002;
  }

  var L=lightAt(((heure%24)+24)%24);
  if(cacheDirty)rebuildCache();
  ctx.drawImage(cache,0,0,W,H);

  if(L.st>0.02){
    for(var i=0;i<stars.length;i++){
      var s=stars[i];
      var a=(0.3+0.7*Math.abs(Math.sin(t*s.sp+s.ph)))*L.st;
      ctx.fillStyle=hsla(C.mist[0],C.mist[1]*0.5,82,a*0.85);
      ctx.fillRect(s.x,s.y,s.r,s.r);
    }
  }

  drawAurora(L);
  drawCorona(L);
  drawWaves();

  if(L.au>0.03){
    var hg=ctx.createLinearGradient(0,H*0.78,0,H*0.95);
    hg.addColorStop(0,hsla(lerp(150,196,P.hueDrift),45,60,L.au*0.05));
    hg.addColorStop(1,hsla(150,45,60,0));
    ctx.fillStyle=hg;ctx.fillRect(0,H*0.78,W,H*0.17);
  }

  ctx.save();ctx.globalAlpha=0.4;ctx.globalCompositeOperation='overlay';
  ctx.drawImage(paper,0,0,W,H);ctx.restore();

  grainTick++;
  if(grainTick%5===0){
    ctx.save();ctx.globalAlpha=0.05;
    for(var gN=0;gN<400;gN++){
      ctx.fillStyle=Math.random()<0.5?'#fff':'#000';
      ctx.fillRect(Math.random()*W,Math.random()*H,1.2,1.2);
    }
    ctx.restore();
  }

  var vg=ctx.createRadialGradient(W/2,H*0.42,H*0.25,W/2,H*0.42,W*0.75);
  vg.addColorStop(0,hsla(210,25,14,0));vg.addColorStop(1,hsla(210,25,14,0.42));
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);

  requestAnimationFrame(frame);
}

size();buildCurtains();
if(window.innerWidth<700){   /* 窄屏默认收起画具，画面优先 */
  panel.classList.add('noanim');paneltab.classList.add('noanim');
  togglePanel();
  setTimeout(function(){panel.classList.remove('noanim');paneltab.classList.remove('noanim');},60);
}
oHue.textContent=hueName(P.hueDrift);
requestAnimationFrame(frame);
})();
</script>
