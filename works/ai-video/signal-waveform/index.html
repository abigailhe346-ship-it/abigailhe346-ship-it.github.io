<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signal Waveform — 雾中听音 · Atelier MIRA N°030</title>
<!--
  调色板家族：① 晨雾 Brume Matinale —— 冷，≈7500K，全系列最低对比。
  #E8E6DF 雾白 · #C9CDD6 雾紫灰 · #9AA7B8 远山蓝灰 · #6E7B8C 阴影蓝紫 · #D8CBB8 一线暖沙
  面积配比：雾白纸面 ≈62% · 雾紫灰 ≈20% · 蓝灰波形与远山 ≈15% · 暖沙一线 ≈3%。
-->
<style>
:root{
  --brume:#E8E6DF; --gris:#C9CDD6; --mont:#9AA7B8; --ardoise:#6E7B8C; --sable:#D8CBB8;
  --ink:#4A5462; --uitxt:#4A5462;
  --serif:Didot,"Bodoni MT",Georgia,"Songti SC",serif;
  --mono:"SF Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC",sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--brume);color:var(--ink);font-family:var(--sans);overflow:hidden}
::selection{background:var(--mont);color:var(--brume)}
canvas#fog{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}

.nameplate{position:fixed;top:26px;left:30px;pointer-events:none;color:var(--uitxt)}
.nameplate .no{font-family:var(--mono);font-size:10px;letter-spacing:.22em;opacity:.66}
.nameplate h1{font-family:var(--serif);font-weight:400;font-size:clamp(24px,3.2vw,38px);letter-spacing:.02em;margin-top:7px}
.nameplate h1 em{font-style:italic;opacity:.82}
.nameplate .epig{font-family:var(--serif);font-style:italic;font-size:14.5px;opacity:.78;margin-top:8px;max-width:320px;line-height:1.6}
.nameplate .coord{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;opacity:.45;margin-top:10px}

.colophon{position:fixed;left:30px;bottom:22px;display:flex;align-items:center;gap:9px;pointer-events:auto;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;opacity:.72;cursor:pointer;user-select:none;color:var(--uitxt)}
.colophon:hover{opacity:.9}
.secret{position:fixed;left:30px;bottom:48px;max-width:300px;font-family:var(--serif);font-style:italic;font-size:14px;line-height:1.7;
  color:var(--uitxt);opacity:0;transform:translateY(6px);transition:all .8s var(--ease);pointer-events:none}
.secret.show{opacity:.9;transform:translateY(0)}

.topright{position:fixed;top:26px;right:30px;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.sndbtn{width:34px;height:34px;border:1px solid rgba(110,123,140,.45);background:rgba(232,230,223,.35);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s var(--ease);color:var(--uitxt)}
.sndbtn:hover{border-color:var(--ardoise)}
.sndbtn.on{background:rgba(154,167,184,.3);border-color:var(--ardoise)}
.sndbtn svg{stroke:currentColor}
.hintline{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;opacity:.62;text-align:right;line-height:1.9;pointer-events:none;color:var(--uitxt)}

.panel{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:calc(100vw - 28px);
  background:rgba(232,230,223,.62);backdrop-filter:blur(12px);border:1px solid rgba(110,123,140,.3);
  padding:13px 20px 14px;transition:all .5s var(--ease)}
.panel.hidden{transform:translateX(-50%) translateY(14px);opacity:0;pointer-events:none}
.panel.notrans{transition:none}
.panel .prow{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap;justify-content:center}
.ctl{display:flex;flex-direction:column;gap:7px}
.ctl label{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:rgba(74,84,98,.7);display:flex;justify-content:space-between;gap:12px}
.ctl label output{color:var(--ardoise)}
input[type=range]{-webkit-appearance:none;appearance:none;width:124px;height:18px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:rgba(110,123,140,.5)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:10px;height:10px;margin-top:-4.5px;background:var(--brume);border:1px solid var(--ardoise);border-radius:50%}
input[type=range]::-webkit-slider-thumb:hover{background:var(--ardoise)}
input[type=range]::-moz-range-track{height:1px;background:rgba(110,123,140,.5)}
input[type=range]::-moz-range-thumb{width:9px;height:9px;background:var(--brume);border:1px solid var(--ardoise);border-radius:50%}
input[type=range].timerule::-webkit-slider-runnable-track{height:5px;border-radius:3px;
  background:linear-gradient(90deg,#9AA7B8 0%,#C9CDD6 20%,#E8E6DF 42%,#EDE6D6 55%,#D8CBB8 68%,#C9CDD6 84%,#9AA7B8 100%)}
input[type=range].timerule::-moz-range-track{height:5px;border-radius:3px;
  background:linear-gradient(90deg,#9AA7B8 0%,#C9CDD6 20%,#E8E6DF 42%,#EDE6D6 55%,#D8CBB8 68%,#C9CDD6 84%,#9AA7B8 100%)}
.etudes{display:flex;gap:6px}
.etudes button,.act{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;padding:8px 12px;
  background:transparent;color:var(--ink);border:1px solid rgba(110,123,140,.45);cursor:pointer;transition:all .25s var(--ease)}
.etudes button:hover,.act:hover{border-color:var(--ardoise);color:var(--ardoise)}
.etudes button.on{background:rgba(154,167,184,.25);border-color:var(--ardoise);color:var(--ardoise)}
.paneltab{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);font-family:var(--mono);font-size:9px;letter-spacing:.18em;
  text-transform:uppercase;color:rgba(74,84,98,.6);border:1px solid rgba(110,123,140,.4);background:rgba(232,230,223,.55);
  padding:7px 14px;cursor:pointer;opacity:0;pointer-events:none;transition:all .5s var(--ease)}
.paneltab.show{opacity:1;pointer-events:auto}
.paneltab:hover{color:var(--ardoise);border-color:var(--ardoise)}

@media(max-width:700px){
  .nameplate{top:18px;left:18px}
  .nameplate .epig{font-size:13px;max-width:230px}
  .topright{top:18px;right:18px}
  .hintline{display:none}
  .colophon{left:18px;bottom:16px;font-size:9px}
  .panel{bottom:14px;padding:11px 12px;width:calc(100vw - 24px);max-height:44vh;overflow-y:auto}
  .panel .prow{gap:10px;justify-content:flex-start}
  input[type=range]{width:82px}
  .etudes button,.act{padding:7px 9px}
  .paneltab{bottom:44px}
}
</style>
</head>
<body>
<canvas id="fog"></canvas>

<div class="nameplate">
  <div class="no">N°030 · AI·VIDEO</div>
  <h1>Signal <em>Waveform</em> · 雾中听音</h1>
  <div class="epig">雾里最清楚的东西，是声音的形状。</div>
  <div class="coord">晨雾 Brume Matinale · 一台谐振记录仪</div>
</div>

<div class="topright">
  <div class="sndbtn" id="sndBtn" title="所画即所听（默认关闭）" role="button" aria-label="toggle sound">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke-width="1.3" stroke-linecap="round">
      <path d="M2 6.5v3h2.5L8 12.5v-9L4.5 6.5H2z" fill="currentColor" stroke="none" opacity=".85"/>
      <path class="w1" d="M10.5 5.5c1.4 1.4 1.4 3.6 0 5"/>
      <path class="w2" d="M12.5 3.5c2.6 2.6 2.6 6.4 0 9"/>
    </svg>
  </div>
  <div class="hintline">划动 · 扰动波形<br>M 换显示法 · 1-3 练习曲<br>开声 · 你看见的波即你听到的音 · H</div>
</div>

<div class="colophon" id="colophon">
  <svg width="22" height="14" viewBox="0 0 64 40" fill="currentColor" aria-hidden="true">
    <path d="M32 20 C 26 12, 14 6, 4 8 C 12 12, 18 18, 24 21
             C 14 20, 6 22, 2 28 C 10 26, 18 26, 25 26
             C 27 30, 30 34, 34 36 C 33 32, 33 28, 34 25
             C 42 22, 52 16, 62 4 C 54 10, 44 16, 36 19
             C 35 17, 33 17, 32 20 Z"/>
  </svg>
  <span>Atelier MIRA · N°030 · 晨雾 Brume Matinale</span>
</div>
<div class="secret" id="secret">调音师在雾里工作，<br>因为他相信：看得见的，都不算数。</div>

<div class="panel" id="panel">
  <div class="prow">
    <div class="etudes" id="etudes">
      <button data-e="maree" class="on">潮汐</button><button data-e="souffle">呼吸</button><button data-e="essaim">蜂鸣</button>
    </div>
    <div class="ctl"><label>一波 Voix I <output id="oF1">2.40</output></label>
      <input type="range" id="sF1" min="40" max="800" value="240"></div>
    <div class="ctl"><label>二波 Voix II <output id="oF2">0.80</output></label>
      <input type="range" id="sF2" min="40" max="800" value="80"></div>
    <div class="ctl"><label>调制 Mod <output id="oMod">25%</output></label>
      <input type="range" id="sMod" min="0" max="100" value="25"></div>
    <div class="ctl"><label>余晖 Persist <output id="oPers">40%</output></label>
      <input type="range" id="sPers" min="0" max="95" value="40"></div>
    <div class="ctl"><label>时刻 Heure <output id="oHeure">—</output></label>
      <input type="range" id="sHeure" class="timerule" min="0" max="24" step="0.05" value="8"></div>
    <button class="act" id="bMode">显示法 · 双迹</button>
    <button class="act" id="bNow">此刻</button>
    <button class="act" id="bDown">收下这片雾</button>
  </div>
</div>
<div class="paneltab" id="paneltab">画具 · H</div>

<script>
(function(){
"use strict";
/* ================================================================
   Signal Waveform — 晨雾中的谐振记录仪
   所画即所听：波形的频率就是振荡器的频率，利萨茹就是音程。
   heure 时间系统 · 点彩波带 · 余晖渐隐 · WebAudio 双声道
   ================================================================ */
var cv=document.getElementById('fog'),ctx=cv.getContext('2d');
var bgc=document.createElement('canvas'),bctx=bgc.getContext('2d');
var per=document.createElement('canvas'),pctx=per.getContext('2d');
var W=0,H=0,dpr=1,t=0,frameN=0;
function R(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,k){return a+(b-a)*k;}

function hex2hsl(hex){
  var r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  var mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,h=0,s=0;
  if(mx!==mn){var d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);
    if(mx===r)h=((g-b)/d+(g<b?6:0));else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;}
  return [h,s*100,l*100];
}
function hsl2rgb(h,s,l){
  h=((h%360)+360)%360;s=clamp(s,0,100)/100;l=clamp(l,0,100)/100;
  var c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2,r=0,g=0,b=0;
  if(h<60){r=c;g=x;}else if(h<120){r=x;g=c;}else if(h<180){g=x;b=x;}
  else if(h<240){g=x;b=c;}else if(h<300){r=x;b=c;}else{r=c;b=x;}
  return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)];
}
function hsla(h,s,l,a){var c=hsl2rgb(h,s,l);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function lerpHsl(c1,c2,k){
  var dh=c2[0]-c1[0];if(dh>180)dh-=360;if(dh<-180)dh+=360;
  return [c1[0]+dh*k,lerp(c1[1],c2[1],k),lerp(c1[2],c2[2],k)];
}
var C={brume:hex2hsl('#E8E6DF'),gris:hex2hsl('#C9CDD6'),mont:hex2hsl('#9AA7B8'),
       ardoise:hex2hsl('#6E7B8C'),sable:hex2hsl('#D8CBB8')};

var heure=(new Date().getHours())+(new Date().getMinutes())/60;
var heureTarget=heure,heureAuto=true;
function lightAt(h){
  var K=[
    [0.0, {sky:[214,10,60],low:[216,10,52],warm:0.00,dim:0.72}],
    [5.0, {sky:[214,10,60],low:[216,10,52],warm:0.00,dim:0.72}],
    [7.0, {sky:[212,9,78], low:[216,8,70], warm:0.15,dim:0.90}],
    [10.0,{sky:[210,8,86], low:[214,8,78], warm:0.05,dim:1.00}],
    [13.0,{sky:[208,9,88], low:[212,9,80], warm:0.00,dim:1.00}],
    [16.5,{sky:[214,9,80], low:[34,12,74], warm:0.45,dim:0.95}],
    [18.5,{sky:[220,10,66], low:[36,16,62], warm:0.85,dim:0.80}],
    [20.5,{sky:[218,11,56], low:[220,10,48],warm:0.30,dim:0.62}],
    [24.0,{sky:[214,10,60], low:[216,10,52],warm:0.00,dim:0.72}]
  ];
  for(var i=0;i<K.length-1;i++){
    if(h>=K[i][0]&&h<=K[i+1][0]){
      var k=(h-K[i][0])/(K[i+1][0]-K[i][0]);k=k*k*(3-2*k);
      var A=K[i][1],B=K[i+1][1];
      return {sky:lerpHsl(A.sky,B.sky,k),low:lerpHsl(A.low,B.low,k),
              warm:lerp(A.warm,B.warm,k),dim:lerp(A.dim,B.dim,k)};
    }
  }
  return {sky:K[0][1].sky,low:K[0][1].low,warm:0,dim:0.72};
}

var P={f1:2.4,f2:0.8,s1:0,s2:3,mod:.25,persist:.40};
var ETUDES={
  maree:{f1:2.4,f2:0.8,s1:0,s2:3,mod:.25,pers:.40},
  souffle:{f1:1.2,f2:1.2,s1:0,s2:0,mod:.55,pers:.70},
  essaim:{f1:6.4,f2:6.6,s1:2,s2:2,mod:.15,pers:.30}
};
var mode=0,MODES=['双迹','叠加','利萨茹'];
var phase1=0,phase2=0,lfoPh=0;

function basic(i,x){
  var u=x-Math.floor(x);
  if(i===0)return Math.sin(u*6.283185307);
  if(i===1)return u<.5?4*u-1:3-4*u;
  if(i===2)return Math.tanh(3.2*Math.sin(u*6.283185307));
  return 2*u-1;
}
function waveAt(x,s){
  s=clamp(s,0,3);
  var i=Math.min(2,Math.floor(s)),f=s-i;
  return basic(i,x)+(basic(i+1,x)-basic(i,x))*f;
}
function ch1(u){
  var fm=P.mod*Math.sin(lfoPh+u*6.283185307*.5);
  return waveAt(P.f1*u+phase1+fm,P.s1);
}
function ch2(u){return waveAt(P.f2*u+phase2,P.s2);}

var ripples=[];
var mx=-100,my=-100,pmx=-100,pmy=-100,mspeed=0;

var hills=[],cacheDirty=true;
function buildHills(){
  hills=[];
  for(var l=0;l<3;l++){
    var off=R(0,100),pts=[];
    for(var x=0;x<=W;x+=10){
      var y=H*(0.70+l*0.07
        +Math.sin(x*0.0028+off)*0.030
        +Math.sin(x*0.009+off*2.7)*0.016
        +Math.sin(x*0.033+off*5.1)*0.007);
      pts.push([x,y]);
    }
    hills.push(pts);
  }
}
function brokenFill(c,x0,y0,x1,y1,baseHsl,n,ang,ln,a0,a1){
  for(var i=0;i<n;i++){
    var px=x0+Math.random()*(x1-x0),py=y0+Math.random()*(y1-y0);
    var h=baseHsl[0]+R(-8,8),s=baseHsl[1]+R(-6,6),l=baseHsl[2]+R(-4,4);
    c.strokeStyle=hsla(h,s,l,R(a0,a1));
    c.lineWidth=R(1,2.2);
    var a=ang+R(-0.4,0.4),L=R(ln*0.5,ln*1.5);
    c.beginPath();c.moveTo(px,py);c.lineTo(px+Math.cos(a)*L,py+Math.sin(a)*L);c.stroke();
  }
}
function rebuildScene(L){
  bgc.width=W*dpr;bgc.height=H*dpr;bctx.setTransform(dpr,0,0,dpr,0,0);
  var g=bctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,hsla(L.sky[0],L.sky[1],L.sky[2],1));
  g.addColorStop(0.66,hsla(L.low[0],L.low[1],L.low[2],1));
  g.addColorStop(1,hsla(L.sky[0],L.sky[1],L.sky[2]-4,1));
  bctx.fillStyle=g;bctx.fillRect(0,0,W,H);
  brokenFill(bctx,0,0,W,H,L.sky,Math.floor(W*H/2600),0.1,26,0.08,0.2);
  brokenFill(bctx,0,H*0.4,W,H,L.low,Math.floor(W*H/4800),0.03,30,0.07,0.18);
  if(L.warm>0.05){
    var wg=bctx.createLinearGradient(0,H*0.55,0,H*0.78);
    wg.addColorStop(0,hsla(C.sable[0],C.sable[1],C.sable[2],0));
    wg.addColorStop(0.55,hsla(C.sable[0],C.sable[1],C.sable[2],L.warm*0.55));
    wg.addColorStop(1,hsla(C.sable[0],C.sable[1],C.sable[2],0));
    bctx.fillStyle=wg;bctx.fillRect(0,H*0.5,W,H*0.32);
  }
  for(var hl=0;hl<hills.length;hl++){
    var fog=0.85-hl*0.28;
    var col=lerpHsl(hl<2?C.mont:C.ardoise,L.sky,fog*0.75);
    bctx.beginPath();bctx.moveTo(0,H);
    for(var i=0;i<hills[hl].length;i++)bctx.lineTo(hills[hl][i][0],hills[hl][i][1]);
    bctx.lineTo(W,H);bctx.closePath();
    bctx.fillStyle=hsla(col[0],col[1],col[2],0.9);bctx.fill();
    bctx.save();bctx.clip();
    brokenFill(bctx,0,H*0.62,W,H,col,Math.floor(W/1.6),1.1,18,0.10,0.24);
    bctx.restore();
  }
  cacheDirty=false;
}

var paper=document.createElement('canvas');
function buildPaper(){
  paper.width=Math.max(2,Math.floor(W/2));paper.height=Math.max(2,Math.floor(H/2));
  var p=paper.getContext('2d');
  p.clearRect(0,0,paper.width,paper.height);
  for(var i=0;i<4600;i++){
    p.fillStyle='rgba('+(Math.random()<0.5?'255,255,255':'60,70,84')+','+R(0.02,0.06).toFixed(3)+')';
    p.fillRect(R(0,paper.width),R(0,paper.height),R(0.5,1.8),R(0.5,1.8));
  }
  for(var f=0;f<70;f++){
    p.strokeStyle='rgba(90,100,116,'+R(0.008,0.022).toFixed(3)+')';
    p.lineWidth=R(0.3,0.8);
    var x=R(0,paper.width),y=R(0,paper.height),a=R(0,6.28),Ln=R(20,90);
    p.beginPath();p.moveTo(x,y);p.lineTo(x+Math.cos(a)*Ln,y+Math.sin(a)*Ln);p.stroke();
  }
}

function dotTrace(fn,yBase,amp,c1,c2,L){
  var n=Math.floor(W/2.4);
  for(var i=0;i<=n;i++){
    var u=i/n;
    var px=u*W;
    var py=yBase-fn(u)*amp;
    var dx=px-mx,dy=py-my;
    var dd=Math.sqrt(dx*dx+dy*dy);
    if(dd<130&&mspeed>0.4){
      var push=(1-dd/130)*mspeed*0.55;
      py+=(dy>0?1:-1)*push*22;
    }
    for(var rr=0;rr<ripples.length;rr++){
      var rp=ripples[rr];
      var rdx=px-rp.x;
      py+=Math.sin(rdx*0.05)*rp.a*Math.exp(-Math.abs(rdx)*0.012)*18;
    }
    var col=(i%2===0)?c1:c2;
    var jitter=R(-3,3);
    pctx.fillStyle=hsla(col[0]+jitter,col[1],col[2]*L.dim,R(0.45,0.8));
    pctx.beginPath();pctx.arc(px+R(-0.8,0.8),py+R(-0.8,0.8),R(1.1,2.2),0,6.29);pctx.fill();
    if(i%3===0){
      pctx.fillStyle=hsla(col[0],col[1]*0.8,col[2]*L.dim+14,0.5);
      pctx.beginPath();pctx.arc(px,py,R(0.5,1),0,6.29);pctx.fill();
    }
  }
}
function dotXY(L){
  var n=760;
  for(var i=0;i<=n;i++){
    var u=i/n;
    var px=W/2+ch1(u)*W*0.30;
    var py=H*0.44-ch2(u)*H*0.26;
    var dx=px-mx,dy=py-my;
    var dd=Math.sqrt(dx*dx+dy*dy);
    if(dd<120&&mspeed>0.4){
      var push=(1-dd/120)*mspeed*0.4;
      px+=(dx>0?1:-1)*push*16;py+=(dy>0?1:-1)*push*16;
    }
    var col=(i%2===0)?C.ardoise:C.mont;
    pctx.fillStyle=hsla(col[0]+R(-4,4),col[1],col[2]*L.dim,R(0.4,0.72));
    pctx.beginPath();pctx.arc(px+R(-0.7,0.7),py+R(-0.7,0.7),R(1,2),0,6.29);pctx.fill();
    if(i%4===0){
      pctx.fillStyle=hsla(C.ardoise[0],C.ardoise[1],C.ardoise[2]*L.dim+14,0.45);
      pctx.beginPath();pctx.arc(px,py,R(0.5,0.9),0,6.29);pctx.fill();
    }
  }
}

var AC=null,master=null,osc1=null,osc2=null,g1=null,g2=null,soundOn=false;
var OTYPES=['sine','triangle','square','sawtooth'];
function freqOf(f){return 96*Math.pow(2,(f-0.4)/(8-0.4)*2.6);}
function initAudio(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=0;master.connect(AC.destination);
  osc1=AC.createOscillator();osc2=AC.createOscillator();
  g1=AC.createGain();g2=AC.createGain();
  g1.gain.value=0.05;g2.gain.value=0.035;
  var lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;
  osc1.connect(g1);osc2.connect(g2);g1.connect(lp);g2.connect(lp);lp.connect(master);
  osc1.start();osc2.start();
}
function shape2type(s){return OTYPES[Math.round(clamp(s,0,3))];}
var sndBtn=document.getElementById('sndBtn');
function setSound(on){
  soundOn=on;sndBtn.classList.toggle('on',on);
  try{localStorage.setItem('atelier-mira-sound',on?'1':'0');}catch(e){}
  if(on&&!AC)initAudio();
  if(AC){if(AC.state==='suspended')AC.resume();
    var now=AC.currentTime;master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(master.gain.value,now);
    master.gain.linearRampToValueAtTime(on?0.7:0,now+(on?1.5:0.4));}
}
sndBtn.addEventListener('click',function(){setSound(!soundOn);});
try{if(localStorage.getItem('atelier-mira-sound')==='1'){
  soundOn=true;sndBtn.classList.add('on');
  var arm=function(){setSound(true);window.removeEventListener('pointerdown',arm);};
  window.addEventListener('pointerdown',arm);}}catch(e){}

cv.addEventListener('pointermove',function(e){
  pmx=mx;pmy=my;mx=e.clientX;my=e.clientY;
  if(pmx>0)mspeed=lerp(mspeed,Math.hypot(mx-pmx,my-pmy),0.3);
});
cv.addEventListener('pointerdown',function(e){
  ripples.push({x:e.clientX,y:e.clientY,a:1});
  if(ripples.length>6)ripples.shift();
});
window.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT')return;
  if(e.key==='h'||e.key==='H')togglePanel();
  if(e.key==='m'||e.key==='M')cycleMode();
  if(e.key==='1')applyEtude('maree');if(e.key==='2')applyEtude('souffle');if(e.key==='3')applyEtude('essaim');
});

var oF1=document.getElementById('oF1'),oF2=document.getElementById('oF2'),
    oMod=document.getElementById('oMod'),oPers=document.getElementById('oPers'),oHeure=document.getElementById('oHeure');
document.getElementById('sF1').addEventListener('input',function(){P.f1=+this.value/100;oF1.textContent=P.f1.toFixed(2);markCustom();});
document.getElementById('sF2').addEventListener('input',function(){P.f2=+this.value/100;oF2.textContent=P.f2.toFixed(2);markCustom();});
document.getElementById('sMod').addEventListener('input',function(){P.mod=+this.value/100;oMod.textContent=this.value+'%';markCustom();});
document.getElementById('sPers').addEventListener('input',function(){P.persist=+this.value/100;oPers.textContent=this.value+'%';markCustom();});
var sHeure=document.getElementById('sHeure');
sHeure.addEventListener('input',function(){heureTarget=+this.value;heureAuto=false;});
document.getElementById('bNow').addEventListener('click',function(){heureAuto=true;});
var bMode=document.getElementById('bMode');
function cycleMode(){
  mode=(mode+1)%3;
  bMode.textContent='显示法 · '+MODES[mode];
  pctx.clearRect(0,0,W,H);
}
bMode.addEventListener('click',cycleMode);
document.getElementById('bDown').addEventListener('click',function(){
  var out=document.createElement('canvas');
  out.width=W*dpr;out.height=H*dpr;
  var o=out.getContext('2d');o.setTransform(dpr,0,0,dpr,0,0);
  o.drawImage(bgc,0,0,W,H);o.drawImage(per,0,0,W,H);
  var a=document.createElement('a');a.download='atelier-mira-n030-waveform.png';
  a.href=out.toDataURL('image/png');a.click();
});
var etudeBtns=document.querySelectorAll('#etudes button');
function markCustom(){etudeBtns.forEach(function(b){b.classList.remove('on');});}
function applyEtude(name){
  var e=ETUDES[name];if(!e)return;
  P.f1=e.f1;P.f2=e.f2;P.s1=e.s1;P.s2=e.s2;P.mod=e.mod;P.persist=e.pers;
  document.getElementById('sF1').value=e.f1*100;document.getElementById('sF2').value=e.f2*100;
  document.getElementById('sMod').value=e.mod*100;document.getElementById('sPers').value=e.pers*100;
  oF1.textContent=e.f1.toFixed(2);oF2.textContent=e.f2.toFixed(2);
  oMod.textContent=Math.round(e.mod*100)+'%';oPers.textContent=Math.round(e.pers*100)+'%';
  etudeBtns.forEach(function(b){b.classList.toggle('on',b.dataset.e===name);});
}
etudeBtns.forEach(function(b){b.addEventListener('click',function(){applyEtude(b.dataset.e);});});

var panel=document.getElementById('panel'),paneltab=document.getElementById('paneltab'),panelHidden=false;
function togglePanel(){
  panelHidden=!panelHidden;
  panel.classList.toggle('hidden',panelHidden);
  paneltab.classList.toggle('show',panelHidden);
}
paneltab.addEventListener('click',togglePanel);

var colClicks=0,colTimer=null;
document.getElementById('colophon').addEventListener('click',function(){
  colClicks++;clearTimeout(colTimer);
  colTimer=setTimeout(function(){colClicks=0;},900);
  if(colClicks>=3){document.getElementById('secret').classList.toggle('show');colClicks=0;}
});

function size(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  [cv,bgc,per].forEach(function(c){c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);});
  ctx.setTransform(dpr,0,0,dpr,0,0);
  pctx.setTransform(dpr,0,0,dpr,0,0);
  buildHills();buildPaper();cacheDirty=true;
}
window.addEventListener('resize',size);

var grainTick=0;
function fmtHeure(h){
  var hh=Math.floor(h)%24,mm=Math.floor((h%1)*60);
  return (hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;
}
function frame(){
  t+=0.016;frameN++;
  if(heureAuto)heureTarget=(new Date().getHours())+(new Date().getMinutes())/60;
  var dh=heureTarget-heure;
  if(Math.abs(dh)>0.0005){heure+=dh*0.06;cacheDirty=true;}
  sHeure.value=heure;oHeure.textContent=fmtHeure(heure);

  phase1+=0.016*0.7;phase2+=0.016*0.55;lfoPh+=0.016*2.2;
  mspeed*=0.9;
  for(var i=ripples.length-1;i>=0;i--){ripples[i].a*=0.965;if(ripples[i].a<0.02)ripples.splice(i,1);}

  var L=lightAt(((heure%24)+24)%24);
  if(cacheDirty){
    rebuildScene(L);
    document.documentElement.style.setProperty('--uitxt',L.sky[2]>64?'hsl(216,13%,32%)':'hsl(216,13%,90%)');
  }

  pctx.globalCompositeOperation='source-over';
  pctx.fillStyle=hsla(L.sky[0],L.sky[1],L.sky[2],(1-P.persist)*0.18+0.03);
  pctx.fillRect(0,0,W,H);

  if(mode===0){
    dotTrace(ch1,H*0.36,H*0.13,C.ardoise,C.mont,L);
    dotTrace(ch2,H*0.60,H*0.10,C.mont,C.ardoise,L);
  }else if(mode===1){
    dotTrace(function(u){return (ch1(u)+ch2(u))*.62;},H*0.46,H*0.15,C.ardoise,C.mont,L);
  }else{
    dotXY(L);
  }

  ctx.clearRect(0,0,W,H);
  ctx.drawImage(bgc,0,0,W,H);
  ctx.drawImage(per,0,0,W,H);

  if(AC&&soundOn){
    osc1.frequency.value=freqOf(P.f1);
    osc2.frequency.value=freqOf(P.f2);
    osc1.type=shape2type(P.s1);osc2.type=shape2type(P.s2);
    var trem=0.6+0.4*Math.sin(lfoPh);
    g1.gain.value=(mode===2?0.04:0.05)*trem;
    g2.gain.value=(mode===1?0.02:0.035)*trem;
  }

  ctx.save();ctx.globalAlpha=0.45;ctx.globalCompositeOperation='multiply';
  ctx.drawImage(paper,0,0,W,H);ctx.restore();
  grainTick++;
  if(grainTick%5===0){
    ctx.save();ctx.globalAlpha=0.04;
    for(var gN=0;gN<360;gN++){
      ctx.fillStyle=Math.random()<0.5?'#fff':'#4A5462';
      ctx.fillRect(Math.random()*W,Math.random()*H,1.2,1.2);
    }
    ctx.restore();
  }
  var vg=ctx.createRadialGradient(W/2,H*0.44,H*0.3,W/2,H*0.44,W*0.75);
  vg.addColorStop(0,hsla(216,12,40,0));vg.addColorStop(1,hsla(216,12,40,0.30*(1.1-L.dim)));
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);

  requestAnimationFrame(frame);
}

size();
if(window.innerWidth<700){panel.classList.add('notrans');togglePanel();requestAnimationFrame(function(){panel.classList.remove('notrans');});}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
