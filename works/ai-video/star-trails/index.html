<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Star Trails — 星轨 · Atelier MIRA N°027</title>
<!--
  调色板家族：⑤ 薰衣草 Lavande —— 黄昏前一小时，灰调紫。
  #E8E0D0 石灰墙 · #D9C7E0 远紫 · #B9A8C9 花田 · #8E7BA8 中紫 · #6B5B85 深紫 · #4E4A6B 暮影（最暗到此）
  面积配比：暮影夜空 ≈50% · 中深紫山与田 ≈35% · 远紫地平 ≈10% · 石灰墙星光 ≈5%。
-->
<style>
:root{
  --mur:#E8E0D0; --loin:#D9C7E0; --fleur:#B9A8C9; --mid:#8E7BA8; --deep:#6B5B85; --ombre:#4E4A6B;
  --nuit:#3C3854; --ink:#2E2B42;
  --serif:Didot,"Bodoni MT",Georgia,"Songti SC",serif;
  --mono:"SF Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC",sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--nuit);color:var(--mur);font-family:var(--sans);overflow:hidden}
::selection{background:var(--loin);color:var(--ink)}
canvas#sky{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}

.nameplate{position:fixed;top:26px;left:30px;pointer-events:none;text-shadow:0 1px 14px rgba(46,43,66,.55)}
.nameplate .no{font-family:var(--mono);font-size:10px;letter-spacing:.22em;opacity:.72}
.nameplate h1{font-family:var(--serif);font-weight:400;font-size:clamp(24px,3.2vw,38px);letter-spacing:.02em;margin-top:7px;color:var(--mur)}
.nameplate h1 em{font-style:italic;color:var(--loin)}
.nameplate .epig{font-family:var(--serif);font-style:italic;font-size:14.5px;opacity:.82;margin-top:8px;max-width:320px;line-height:1.6}
.nameplate .coord{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;opacity:.5;margin-top:10px}

.colophon{position:fixed;left:30px;bottom:22px;display:flex;align-items:center;gap:9px;pointer-events:auto;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;opacity:.66;text-shadow:0 1px 8px rgba(46,43,66,.6);cursor:pointer;user-select:none}
.colophon:hover{opacity:.9}
.secret{position:fixed;left:30px;bottom:48px;max-width:300px;font-family:var(--serif);font-style:italic;font-size:14px;line-height:1.7;
  color:var(--mur);opacity:0;transform:translateY(6px);transition:all .8s var(--ease);pointer-events:none;text-shadow:0 1px 10px rgba(46,43,66,.7)}
.secret.show{opacity:.92;transform:translateY(0)}

.topright{position:fixed;top:26px;right:30px;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.sndbtn{width:34px;height:34px;border:1px solid rgba(232,224,208,.4);background:rgba(60,56,84,.35);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s var(--ease)}
.sndbtn:hover{border-color:var(--loin)}
.sndbtn.on{background:rgba(217,199,224,.2);border-color:var(--loin)}
.sndbtn svg{stroke:var(--mur)}
.hintline{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;opacity:.55;text-align:right;line-height:1.9;pointer-events:none;text-shadow:0 1px 8px rgba(46,43,66,.6)}

.panel{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:calc(100vw - 28px);
  background:rgba(60,56,84,.6);backdrop-filter:blur(12px);border:1px solid rgba(232,224,208,.22);
  padding:13px 20px 14px;transition:all .5s var(--ease)}
.panel.hidden{transform:translateX(-50%) translateY(14px);opacity:0;pointer-events:none}
.panel.notrans{transition:none}
.panel .prow{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap;justify-content:center}
.ctl{display:flex;flex-direction:column;gap:7px}
.ctl label{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:rgba(232,224,208,.62);display:flex;justify-content:space-between;gap:12px}
.ctl label output{color:var(--loin)}
input[type=range]{-webkit-appearance:none;appearance:none;width:124px;height:18px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:rgba(232,224,208,.4)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:10px;height:10px;margin-top:-4.5px;background:var(--nuit);border:1px solid var(--loin);border-radius:50%}
input[type=range]::-webkit-slider-thumb:hover{background:var(--loin)}
input[type=range]::-moz-range-track{height:1px;background:rgba(232,224,208,.4)}
input[type=range]::-moz-range-thumb{width:9px;height:9px;background:var(--nuit);border:1px solid var(--loin);border-radius:50%}
input[type=range].timerule::-webkit-slider-runnable-track{height:5px;border-radius:3px;
  background:linear-gradient(90deg,#3C3854 0%,#4E4A6B 15%,#6B5B85 26%,#B9A8C9 40%,#E8E0D0 50%,#B9A8C9 60%,#6B5B85 74%,#3C3854 100%)}
input[type=range].timerule::-moz-range-track{height:5px;border-radius:3px;
  background:linear-gradient(90deg,#3C3854 0%,#4E4A6B 15%,#6B5B85 26%,#B9A8C9 40%,#E8E0D0 50%,#B9A8C9 60%,#6B5B85 74%,#3C3854 100%)}
.etudes{display:flex;gap:6px}
.etudes button,.act{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;padding:8px 12px;
  background:transparent;color:var(--mur);border:1px solid rgba(232,224,208,.35);cursor:pointer;transition:all .25s var(--ease)}
.etudes button:hover,.act:hover{border-color:var(--loin);color:var(--loin)}
.etudes button.on{background:rgba(217,199,224,.18);border-color:var(--loin);color:var(--loin)}
.paneltab{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);font-family:var(--mono);font-size:9px;letter-spacing:.18em;
  text-transform:uppercase;color:rgba(232,224,208,.6);border:1px solid rgba(232,224,208,.3);background:rgba(60,56,84,.5);
  padding:7px 14px;cursor:pointer;opacity:0;pointer-events:none;transition:all .5s var(--ease)}
.paneltab.show{opacity:1;pointer-events:auto}
.paneltab:hover{color:var(--loin);border-color:var(--loin)}

@media(max-width:700px){
  .nameplate{top:18px;left:18px}
  .nameplate .epig{font-size:13px;max-width:230px}
  .topright{top:18px;right:18px}
  .hintline{display:none}
  .colophon{left:18px;bottom:16px;font-size:9px}
  .panel{bottom:14px;padding:11px 12px;width:calc(100vw - 24px);max-height:44vh;overflow-y:auto}
  .panel .prow{gap:10px;justify-content:flex-start}
  input[type=range]{width:82px}
  .etudes button,.act{padding:7px 9px}
  .paneltab{bottom:44px}
}
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div class="nameplate">
  <div class="no">N°027 · AI·VIDEO</div>
  <h1>Star <em>Trails</em> · 星轨</h1>
  <div class="epig">星星走得很慢，底片替它们记得。</div>
  <div class="coord">薰衣草 Lavande · 瓦朗索勒高原的一夜</div>
</div>

<div class="topright">
  <div class="sndbtn" id="sndBtn" title="环境声（默认关闭）" role="button" aria-label="toggle sound">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke-width="1.3" stroke-linecap="round">
      <path d="M2 6.5v3h2.5L8 12.5v-9L4.5 6.5H2z" fill="currentColor" stroke="none" opacity=".85"/>
      <path class="w1" d="M10.5 5.5c1.4 1.4 1.4 3.6 0 5"/>
      <path class="w2" d="M12.5 3.5c2.6 2.6 2.6 6.4 0 9"/>
    </svg>
  </div>
  <div class="hintline">拖动时间 · 看暮色沉下去<br>点击天空 · 移动天极<br>R 重曝 · H 收起画具</div>
</div>

<div class="colophon" id="colophon">
  <svg width="22" height="14" viewBox="0 0 64 40" fill="#E8E0D0" aria-hidden="true">
    <path d="M32 20 C 26 12, 14 6, 4 8 C 12 12, 18 18, 24 21
             C 14 20, 6 22, 2 28 C 10 26, 18 26, 25 26
             C 27 30, 30 34, 34 36 C 33 32, 33 28, 34 25
             C 42 22, 52 16, 62 4 C 54 10, 44 16, 36 19
             C 35 17, 33 17, 32 20 Z"/>
  </svg>
  <span>Atelier MIRA · N°027 · 薰衣草 Lavande</span>
</div>
<div class="secret" id="secret">守夜的人说，薰衣草睡着以后，<br>香气会站起来，替它们看星星。</div>

<div class="panel" id="panel">
  <div class="prow">
    <div class="etudes" id="etudes">
      <button data-e="crepuscule" class="on">薄暮</button><button data-e="minuit">子夜</button><button data-e="aube">将晓</button>
    </div>
    <div class="ctl"><label>曝光 Pose <output id="oExpo">120°</output></label>
      <input type="range" id="sExpo" min="20" max="360" step="5" value="120"></div>
    <div class="ctl"><label>星野 Étoiles <output id="oDens">420</output></label>
      <input type="range" id="sDens" min="120" max="900" step="20" value="420"></div>
    <div class="ctl"><label>时刻 Heure <output id="oHeure">—</output></label>
      <input type="range" id="sHeure" class="timerule" min="0" max="24" step="0.05" value="21"></div>
    <button class="act" id="bNow">此刻</button>
    <button class="act" id="bRetake">重曝 R</button>
    <button class="act" id="bDown">收下这张底片</button>
  </div>
</div>
<div class="paneltab" id="paneltab">画具 · H</div>

<script>
(function(){
"use strict";
/* ================================================================
   Star Trails — 薰衣草田上的一张长曝光
   heure 时间系统 · 点彩星空 · 弧光累积 · 显影 wow · 夜风与虫鸣
   ================================================================ */
var cv=document.getElementById('sky'),ctx=cv.getContext('2d');
var bgc=document.createElement('canvas'),bctx=bgc.getContext('2d');   /* 暮光场景（heure 缓存） */
var acc=document.createElement('canvas'),actx=acc.getContext('2d');   /* 底片累积 */
var W=0,H=0,dpr=1,t=0,frameN=0;
function R(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,k){return a+(b-a)*k;}

/* ---------- HSL 工具 ---------- */
function hex2hsl(hex){
  var r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  var mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,h=0,s=0;
  if(mx!==mn){var d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);
    if(mx===r)h=((g-b)/d+(g<b?6:0));else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;}
  return [h,s*100,l*100];
}
function hsl2rgb(h,s,l){
  h=((h%360)+360)%360;s=clamp(s,0,100)/100;l=clamp(l,0,100)/100;
  var c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2,r=0,g=0,b=0;
  if(h<60){r=c;g=x;}else if(h<120){r=x;g=c;}else if(h<180){g=x;b=x;}
  else if(h<240){g=x;b=c;}else if(h<300){r=x;b=c;}else{r=c;b=x;}
  return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)];
}
function hsla(h,s,l,a){var c=hsl2rgb(h,s,l);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function lerpHsl(c1,c2,k){
  var dh=c2[0]-c1[0];if(dh>180)dh-=360;if(dh<-180)dh+=360;
  return [c1[0]+dh*k,lerp(c1[1],c2[1],k),lerp(c1[2],c2[2],k)];
}
var C={mur:hex2hsl('#E8E0D0'),loin:hex2hsl('#D9C7E0'),fleur:hex2hsl('#B9A8C9'),
       mid:hex2hsl('#8E7BA8'),deep:hex2hsl('#6B5B85'),ombre:hex2hsl('#4E4A6B')};

/* ---------- heure：薰衣草田的一天 ----------
   重点是黄昏那一段：光一寸一寸退，星一颗一颗来。 */
var heure=(new Date().getHours())+(new Date().getMinutes())/60;
var heureTarget=heure,heureAuto=true;
function lightAt(h){
  var K=[
    [0.0, {top:[254,20,13],hor:[260,15,19],st:1.00,field:0.08,fire:1.00}],
    [4.0, {top:[254,20,13],hor:[260,15,19],st:1.00,field:0.08,fire:0.80}],
    [5.5, {top:[266,20,42],hor:[288,16,58],st:0.45,field:0.35,fire:0.20}],   /* 将晓 */
    [7.5, {top:[272,16,62],hor:[40,16,74], st:0.06,field:0.75,fire:0.00}],   /* 晨 */
    [12.0,{top:[262,18,72],hor:[280,20,80],st:0.00,field:1.00,fire:0.00}],   /* 午 */
    [17.0,{top:[268,20,60],hor:[290,22,68],st:0.02,field:0.85,fire:0.00}],
    [19.0,{top:[276,24,48],hor:[302,26,58],st:0.18,field:0.55,fire:0.10}],   /* 薄暮 */
    [20.5,{top:[262,24,32],hor:[282,22,40],st:0.65,field:0.25,fire:0.60}],   /* 暮沉 */
    [22.0,{top:[254,21,16],hor:[261,16,23],st:0.95,field:0.10,fire:0.95}],
    [24.0,{top:[254,20,13],hor:[260,15,19],st:1.00,field:0.08,fire:1.00}]
  ];
  for(var i=0;i<K.length-1;i++){
    if(h>=K[i][0]&&h<=K[i+1][0]){
      var k=(h-K[i][0])/(K[i+1][0]-K[i][0]);k=k*k*(3-2*k);
      var A=K[i][1],B=K[i+1][1];
      return {top:lerpHsl(A.top,B.top,k),hor:lerpHsl(A.hor,B.hor,k),
              st:lerp(A.st,B.st,k),field:lerp(A.field,B.field,k),fire:lerp(A.fire,B.fire,k)};
    }
  }
  return {top:K[0][1].top,hor:K[0][1].hor,st:1,field:0.08,fire:1};
}

/* ---------- 参数与练习曲 ---------- */
var P={exposure:120,density:420};
var ETUDES={crepuscule:{h:19.2,expo:90},minuit:{h:0,expo:180},aube:{h:4.6,expo:60}};
var EXPO_SECONDS=14;
var exposed=0,complete=false,plateNo=1,develop=0;   /* develop=显影 bloom 能量 */

/* ---------- 星野 ---------- */
var seed=Math.random()*999;
function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
var stars=[],fireflies=[],pole={x:0.32,y:0.30};
function genField(){
  stars=[];
  var maxR=Math.hypot(Math.max(pole.x,1-pole.x)*W,Math.max(pole.y,1-pole.y)*H)*1.05;
  for(var i=0;i<P.density;i++){
    var rr=Math.pow(rnd(),1.15)*maxR;
    if(rr<10)rr=10+rnd()*12;
    stars.push({ang:R(0,Math.PI*2),rad:rr,mag:Math.pow(rnd(),2.6),tmp:R(-1,1),tw:R(0,7),ts:R(0.5,2)});
  }
  fireflies=[];
  for(i=0;i<26;i++)fireflies.push({x:rnd(),y:0.72+rnd()*0.24,ph:rnd()*7,sp:R(0.3,0.9),r:R(0.8,1.8)});
}
/* 星色：冰紫 ↔ 石灰墙暖白（家族内） */
function starColor(tmp,a){
  var col=tmp<0?C.loin:C.mur;
  var l=col[2]+Math.abs(tmp)*6;
  return hsla(col[0],col[1]*0.7,l,a);
}

/* ---------- 碎色笔触 ---------- */
function brokenFill(c,x0,y0,x1,y1,baseHsl,n,ang,ln,a0,a1){
  for(var i=0;i<n;i++){
    var px=x0+Math.random()*(x1-x0),py=y0+Math.random()*(y1-y0);
    var h=baseHsl[0]+R(-8,8),s=baseHsl[1]+R(-6,6),l=baseHsl[2]+R(-5,5);
    c.strokeStyle=hsla(h,s,l,R(a0,a1));
    c.lineWidth=R(1,2.4);
    var a=ang+R(-0.4,0.4),L=R(ln*0.5,ln*1.5);
    c.beginPath();c.moveTo(px,py);c.lineTo(px+Math.cos(a)*L,py+Math.sin(a)*L);c.stroke();
  }
}

/* ---------- 场景：天空 + 远山 + 薰衣草田（heure 缓存） ---------- */
var hills=[],cacheDirty=true;
function buildHills(){
  hills=[];
  for(var l=0;l<2;l++){
    var off=rnd(0,100),pts=[];
    for(var x=0;x<=W;x+=10){
      var y=H*(0.66+l*0.05
        +Math.sin(x*0.003+off)*0.028
        +Math.sin(x*0.011+off*2.7)*0.014
        +Math.sin(x*0.04+off*5.1)*0.006);
      pts.push([x,y]);
    }
    hills.push(pts);
  }
}
function rebuildScene(L){
  bgc.width=W*dpr;bgc.height=H*dpr;bctx.setTransform(dpr,0,0,dpr,0,0);
  var horizon=H*0.68;
  var g=bctx.createLinearGradient(0,0,0,horizon);
  g.addColorStop(0,hsla(L.top[0],L.top[1],L.top[2],1));
  g.addColorStop(1,hsla(L.hor[0],L.hor[1],L.hor[2],1));
  bctx.fillStyle=g;bctx.fillRect(0,0,W,horizon+2);
  brokenFill(bctx,0,0,W,horizon,L.top,Math.floor(W*H/2400),0.12,26,0.16,0.36);
  brokenFill(bctx,0,horizon*0.5,W,horizon,L.hor,Math.floor(W*H/4200),0.04,30,0.14,0.32);
  /* 银河微光带（点彩，不是涂抹） */
  if(L.st>0.1){
    bctx.save();bctx.translate(W*0.55,H*0.3);bctx.rotate(-0.5);
    for(var i=0;i<620;i++){
      var gx=R(-W,W)*0.55,gy=R(-H,H)*0.13;
      var cc=Math.random()<0.6?C.loin:C.mur;
      bctx.fillStyle=hsla(cc[0],cc[1]*0.6,cc[2],R(0.03,0.10)*L.st);
      bctx.beginPath();bctx.arc(gx,gy,R(0.6,2.2),0,6.29);bctx.fill();
    }
    bctx.restore();
  }
  /* 远山两层：大气透视，向地平线色收敛 */
  for(var hl=0;hl<hills.length;hl++){
    var fog=hl===0?0.6:0.25;
    var base=hl===0?C.mid:C.deep;
    var col=lerpHsl(base,L.hor,fog*0.8);
    var lit=lerpHsl(col,[L.hor[0],L.hor[1],L.hor[2]+8],L.field*0.25);
    bctx.beginPath();bctx.moveTo(0,H);
    for(var i2=0;i2<hills[hl].length;i2++)bctx.lineTo(hills[hl][i2][0],hills[hl][i2][1]);
    bctx.lineTo(W,H);bctx.closePath();
    bctx.fillStyle=hsla(lit[0],lit[1],lit[2],1);bctx.fill();
    bctx.save();bctx.clip();
    brokenFill(bctx,0,H*0.6,W,H,lit,Math.floor(W/4),1.2,18,0.14,0.3);
    bctx.restore();
  }
  /* 近：薰衣草田——透视行，点彩花穗 */
  var vy=horizon+4,vx=W*0.62;   /* 消失点偏右 */
  var fieldBase=lerpHsl(C.ombre,L.hor,0.15+L.field*0.2);
  bctx.fillStyle=hsla(fieldBase[0],fieldBase[1],fieldBase[2]*0.85,1);
  bctx.fillRect(0,horizon,W,H-horizon);
  brokenFill(bctx,0,horizon,W,H,fieldBase,Math.floor(W*H/2000),1.35,20,0.14,0.32);
  var rows=13;
  for(var r2=0;r2<rows;r2++){
    var u=r2/(rows-1);
    var bx=W*(0.02+u*0.96);
    /* 行线：从底边向消失点 */
    var steps=26;
    for(var s2=0;s2<=steps;s2++){
      var k=s2/steps;
      var px=bx+(vx-bx)*k, py=H-4-(H-4-vy)*k;
      var rowW=lerp(W*0.045,2,k);
      /* 花穗点彩：花田紫 + 远紫交替 */
      if(Math.random()<0.85){
        var cc2=Math.random()<0.62?C.fleur:C.mid;
        var bright=lerp(1,0.25,k)*(0.25+L.field*0.75);
        bctx.fillStyle=hsla(cc2[0]+R(-6,6),cc2[1],cc2[2]*bright,R(0.3,0.7));
        for(var dd=0;dd<3;dd++){
          bctx.beginPath();bctx.arc(px+R(-rowW,rowW),py+R(-2.5,2.5),Math.max(0.55,Math.min(4.5,rowW*0.10)),0,6.29);bctx.fill();
        }
      }
    }
  }
  cacheDirty=false;
}

/* ---------- 纸纹 ---------- */
var paper=document.createElement('canvas');
function buildPaper(){
  paper.width=Math.max(2,Math.floor(W/2));paper.height=Math.max(2,Math.floor(H/2));
  var p=paper.getContext('2d');
  p.clearRect(0,0,paper.width,paper.height);
  for(var i=0;i<4200;i++){
    p.fillStyle='rgba('+(Math.random()<0.5?'255,255,255':'0,0,0')+','+R(0.02,0.06).toFixed(3)+')';
    p.fillRect(R(0,paper.width),R(0,paper.height),R(0.5,1.8),R(0.5,1.8));
  }
  for(var f=0;f<60;f++){
    p.strokeStyle='rgba(255,255,255,'+R(0.008,0.02).toFixed(3)+')';
    p.lineWidth=R(0.3,0.8);
    var x=R(0,paper.width),y=R(0,paper.height),a=R(0,6.28),Ln=R(20,90);
    p.beginPath();p.moveTo(x,y);p.lineTo(x+Math.cos(a)*Ln,y+Math.sin(a)*Ln);p.stroke();
  }
}

/* ---------- 底片 ---------- */
function retake(newPlate){
  actx.setTransform(dpr,0,0,dpr,0,0);
  actx.clearRect(0,0,W,H);
  exposed=0;complete=false;develop=0;
  if(newPlate)plateNo++;
  genField();
}
function exposeFrame(dAng,L){
  var px=pole.x*W,py=pole.y*H;
  actx.globalCompositeOperation='lighter';
  actx.lineCap='round';
  var gain=0.25+L.st*0.75;   /* 白天几乎曝不上，夜里弧光生长 */
  for(var i=0;i<stars.length;i++){
    var s=stars[i];
    var a0=s.ang,a1=s.ang+dAng;
    s.ang=a1;
    actx.strokeStyle=starColor(s.tmp,(0.12+s.mag*0.62)*gain);
    actx.lineWidth=0.5+s.mag*2.4;
    actx.beginPath();actx.arc(px,py,s.rad,a0,a1);actx.stroke();
  }
}

/* ---------- 流星 ---------- */
var meteor=null,meteorClock=R(14,30);
function spawnMeteor(){
  var a=R(0,6.28);
  meteor={x:R(W*0.2,W*0.8),y:R(H*0.1,H*0.4),vx:Math.cos(a)*R(6,10),vy:Math.abs(Math.sin(a))*R(2,4)+2,life:1};
}
function drawMeteor(L){
  if(!meteor){
    meteorClock-=0.016;
    if(meteorClock<0&&L.st>0.5){spawnMeteor();meteorClock=R(18,45);}
    return;
  }
  var m=meteor;
  m.x+=m.vx;m.y+=m.vy;m.life-=0.02;
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(var i=0;i<8;i++){
    var k=i/8;
    ctx.fillStyle=starColor(-0.5,m.life*(1-k)*0.8);
    ctx.beginPath();ctx.arc(m.x-m.vx*i*1.6,m.y-m.vy*i*1.6,1.6-k*1.2,0,6.29);ctx.fill();
  }
  ctx.restore();
  if(m.life<=0||m.x>W+40||m.y>H)meteor=null;
}

/* ---------- 萤火虫 ---------- */
function drawFireflies(L){
  if(L.fire<0.05)return;
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(var i=0;i<fireflies.length;i++){
    var f=fireflies[i];
    f.ph+=0.016*f.sp;
    var fx=(f.x+Math.sin(f.ph*0.7)*0.012)*W;
    var fy=(f.y+Math.sin(f.ph)*0.008+Math.cos(f.ph*0.5)*0.005)*H;
    var glow=Math.max(0,Math.sin(f.ph*2.2))*L.fire;
    if(glow<0.05)continue;
    ctx.fillStyle=hsla(C.mur[0],C.mur[1]*0.5,72,glow*0.7);
    ctx.beginPath();ctx.arc(fx,fy,f.r,0,6.29);ctx.fill();
    ctx.fillStyle=hsla(C.mur[0],C.mur[1]*0.4,78,glow*0.16);
    ctx.beginPath();ctx.arc(fx,fy,f.r*3.2,0,6.29);ctx.fill();
  }
  ctx.restore();
}

/* ---------- 声音：夜风 + 虫鸣（默认 OFF） ---------- */
var AC=null,master=null,windGain=null,soundOn=false;
function initAudio(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=0;master.connect(AC.destination);
  var len=AC.sampleRate*3,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0),last=0;
  for(var i=0;i<len;i++){var w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.2;}
  var src=AC.createBufferSource();src.buffer=buf;src.loop=true;
  var bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=380;bp.Q.value=0.8;
  windGain=AC.createGain();windGain.gain.value=0.05;
  src.connect(bp);bp.connect(windGain);windGain.connect(master);src.start();
}
function cricket(){
  if(!AC||!soundOn)return;
  var now=AC.currentTime,n=3+Math.floor(Math.random()*4);
  for(var i=0;i<n;i++){
    var t0=now+i*0.07;
    var src=AC.createBufferSource();
    var bl=AC.sampleRate*0.03,bb=AC.createBuffer(1,bl,AC.sampleRate),dd=bb.getChannelData(0);
    for(var j=0;j<bl;j++)dd[j]=(Math.random()*2-1)*(1-j/bl);
    src.buffer=bb;
    var bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=R(3800,4600);bp.Q.value=9;
    var g=AC.createGain();g.gain.value=R(0.008,0.02);
    src.connect(bp);bp.connect(g);g.connect(master);src.start(t0);
  }
}
var sndBtn=document.getElementById('sndBtn');
function setSound(on){
  soundOn=on;sndBtn.classList.toggle('on',on);
  try{localStorage.setItem('atelier-mira-sound',on?'1':'0');}catch(e){}
  if(on&&!AC)initAudio();
  if(AC){if(AC.state==='suspended')AC.resume();
    var now=AC.currentTime;master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(master.gain.value,now);
    master.gain.linearRampToValueAtTime(on?0.8:0,now+(on?1.5:0.4));}
}
sndBtn.addEventListener('click',function(){setSound(!soundOn);});
try{if(localStorage.getItem('atelier-mira-sound')==='1'){
  soundOn=true;sndBtn.classList.add('on');
  var arm=function(){setSound(true);window.removeEventListener('pointerdown',arm);};
  window.addEventListener('pointerdown',arm);}}catch(e){}

/* ---------- 指针：点击移天极 ---------- */
cv.addEventListener('pointerdown',function(e){
  var nx=e.clientX/window.innerWidth,ny=e.clientY/window.innerHeight;
  if(ny<0.66){pole.x=nx;pole.y=ny;retake(false);}
});
window.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT')return;
  if(e.key==='h'||e.key==='H')togglePanel();
  if(e.key==='r'||e.key==='R')retake(true);
  if(e.key==='1')applyEtude('crepuscule');if(e.key==='2')applyEtude('minuit');if(e.key==='3')applyEtude('aube');
});

/* ---------- 控件 ---------- */
var oExpo=document.getElementById('oExpo'),oDens=document.getElementById('oDens'),oHeure=document.getElementById('oHeure');
document.getElementById('sExpo').addEventListener('input',function(){P.exposure=+this.value;oExpo.textContent=this.value+'°';markCustom();});
document.getElementById('sDens').addEventListener('input',function(){P.density=+this.value;oDens.textContent=this.value;genField();markCustom();});
var sHeure=document.getElementById('sHeure');
sHeure.addEventListener('input',function(){heureTarget=+this.value;heureAuto=false;});
document.getElementById('bNow').addEventListener('click',function(){heureAuto=true;});
document.getElementById('bRetake').addEventListener('click',function(){retake(true);});
document.getElementById('bDown').addEventListener('click',function(){
  var out=document.createElement('canvas');
  out.width=W*dpr;out.height=H*dpr;
  var o=out.getContext('2d');o.setTransform(dpr,0,0,dpr,0,0);
  o.drawImage(bgc,0,0,W,H);o.drawImage(acc,0,0,W,H);
  o.fillStyle='rgba(232,224,208,.7)';o.font='10px Menlo,monospace';
  o.fillText('ATELIER MIRA N°027 — PLAQUE LV-'+String(plateNo).padStart(3,'0'),14,H-14);
  var a=document.createElement('a');a.download='atelier-mira-n027-star-trails.png';
  a.href=out.toDataURL('image/png');a.click();
});
var etudeBtns=document.querySelectorAll('#etudes button');
function markCustom(){etudeBtns.forEach(function(b){b.classList.remove('on');});}
function applyEtude(name){
  var e=ETUDES[name];if(!e)return;
  heureTarget=e.h;heureAuto=false;P.exposure=e.expo;
  document.getElementById('sExpo').value=e.expo;oExpo.textContent=e.expo+'°';
  etudeBtns.forEach(function(b){b.classList.toggle('on',b.dataset.e===name);});
  retake(false);
}
etudeBtns.forEach(function(b){b.addEventListener('click',function(){applyEtude(b.dataset.e);});});

var panel=document.getElementById('panel'),paneltab=document.getElementById('paneltab'),panelHidden=false;
function togglePanel(){
  panelHidden=!panelHidden;
  panel.classList.toggle('hidden',panelHidden);
  paneltab.classList.toggle('show',panelHidden);
}
paneltab.addEventListener('click',togglePanel);

var colClicks=0,colTimer=null;
document.getElementById('colophon').addEventListener('click',function(){
  colClicks++;clearTimeout(colTimer);
  colTimer=setTimeout(function(){colClicks=0;},900);
  if(colClicks>=3){document.getElementById('secret').classList.toggle('show');colClicks=0;}
});

/* ---------- 尺寸 ---------- */
function size(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  [cv,bgc,acc].forEach(function(c){c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);});
  ctx.setTransform(dpr,0,0,dpr,0,0);
  buildHills();buildPaper();retake(false);cacheDirty=true;
}
window.addEventListener('resize',size);

/* ---------- 主循环 ---------- */
var grainTick=0,cricketClock=2;
function fmtHeure(h){
  var hh=Math.floor(h)%24,mm=Math.floor((h%1)*60);
  return (hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;
}
function frame(){
  t+=0.016;frameN++;
  if(heureAuto)heureTarget=(new Date().getHours())+(new Date().getMinutes())/60;
  var dh=heureTarget-heure;
  if(Math.abs(dh)>0.0005){heure+=dh*0.06;cacheDirty=true;}
  sHeure.value=heure;oHeure.textContent=fmtHeure(heure);

  var L=lightAt(((heure%24)+24)%24);
  if(cacheDirty)rebuildScene(L);

  /* 曝光推进 */
  if(!complete){
    var dAng=(P.exposure*Math.PI/180)*(0.016/EXPO_SECONDS);
    exposeFrame(dAng,L);
    exposed+=dAng*180/Math.PI;
    if(exposed>=P.exposure){exposed=P.exposure;complete=true;develop=1.2;}  /* 显影 */
  }
  develop*=0.985;

  ctx.clearRect(0,0,W,H);
  ctx.drawImage(bgc,0,0,W,H);

  /* 恒星本体（闪烁点彩） */
  if(L.st>0.02){
    var px=pole.x*W,py=pole.y*H;
    for(var i=0;i<stars.length;i++){
      var s=stars[i];
      if(s.mag<0.16)continue;
      var sx=px+Math.cos(s.ang)*s.rad,sy=py+Math.sin(s.ang)*s.rad;
      if(sx<-10||sx>W+10||sy<-10||sy>H*0.7)continue;
      var tw=(0.4+0.6*Math.abs(Math.sin(t*s.ts+s.tw)))*L.st;
      ctx.fillStyle=starColor(s.tmp,tw*(0.4+s.mag*0.6));
      ctx.beginPath();ctx.arc(sx,sy,0.6+s.mag*2.1,0,6.29);ctx.fill();
    }
  }
  /* 底片 */
  ctx.drawImage(acc,0,0,W,H);
  /* 显影 bloom：底片完成的一刻，弧光整体亮起来再落回去 */
  if(develop>0.02){
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=develop*0.55;
    ctx.filter='blur(6px)';
    ctx.drawImage(acc,0,0,W,H);
    ctx.filter='none';ctx.restore();
  }
  drawMeteor(L);
  drawFireflies(L);

  /* 天极标记 + 曝光环 */
  var pxx=pole.x*W,pyy=pole.y*H;
  ctx.strokeStyle=hsla(C.mur[0],C.mur[1],C.mur[2],0.75);ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(pxx-7,pyy);ctx.lineTo(pxx+7,pyy);
  ctx.moveTo(pxx,pyy-7);ctx.lineTo(pxx,pyy+7);
  ctx.stroke();
  ctx.strokeStyle=hsla(C.loin[0],C.loin[1],C.loin[2],0.3);
  ctx.beginPath();ctx.arc(pxx,pyy,16,0,6.29);ctx.stroke();
  ctx.strokeStyle=hsla(C.mur[0],C.mur[1],C.mur[2],0.95);ctx.lineWidth=1.6;
  ctx.beginPath();ctx.arc(pxx,pyy,16,-Math.PI/2,-Math.PI/2+(exposed/P.exposure)*Math.PI*2);ctx.stroke();

  /* 纸纹 + 颗粒 + 暗角 */
  ctx.save();ctx.globalAlpha=0.4;ctx.globalCompositeOperation='overlay';
  ctx.drawImage(paper,0,0,W,H);ctx.restore();
  grainTick++;
  if(grainTick%5===0){
    ctx.save();ctx.globalAlpha=0.05;
    for(var gN=0;gN<380;gN++){
      ctx.fillStyle=Math.random()<0.5?'#fff':'#000';
      ctx.fillRect(Math.random()*W,Math.random()*H,1.2,1.2);
    }
    ctx.restore();
  }
  var vg=ctx.createRadialGradient(W/2,H*0.44,H*0.28,W/2,H*0.44,W*0.72);
  vg.addColorStop(0,hsla(252,24,16,0));vg.addColorStop(1,hsla(252,24,16,0.42));
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);

  /* 虫鸣调度 */
  if(AC&&soundOn&&L.st>0.4){
    cricketClock-=0.016;
    if(cricketClock<0){cricket();cricketClock=R(0.8,4);}
    windGain.gain.value=0.03+L.st*0.03;
  }
  requestAnimationFrame(frame);
}

size();
/* 底片已曝了三分之一：首屏即有弧光在生长 */
(function(){
  var L0=lightAt(((heure%24)+24)%24);
  var pre=P.exposure*0.35*Math.PI/180;
  var steps=60;
  for(var i=0;i<steps;i++)exposeFrame(pre/steps,L0);
  exposed=P.exposure*0.35;
})();
if(window.innerWidth<700){panel.classList.add('notrans');togglePanel();requestAnimationFrame(function(){panel.classList.remove('notrans');});}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
