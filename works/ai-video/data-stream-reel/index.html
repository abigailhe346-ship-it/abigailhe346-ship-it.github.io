<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data Stream Reel — 潮汐信号台 · Atelier MIRA N°038</title>
<!--
  调色板家族：⑥ 潮汐 Marée（诺曼底海岸，冷灰调）
  #E3E0D5 贝壳白 · #B5C2C4 浅滩 · #7E9399 海水 · #4F666E 深潮 · #C8B89A 湿沙 · #D97B5A 浮标锈红（点缀 ≤10%）
  概念：数据流不是终端，是海边信号台的一天——珐琅仪表记潮位，潮汐尺记信号，
  日志是守台人的手记。告警不是红色代码，是一场来临的风暴。
-->
<style>
:root{
  --paper:#E3E0D5; --sand:#C8B89A; --shallow:#B5C2C4; --sea:#7E9399; --deep:#4F666E; --rust:#D97B5A;
  --ink:#3B484D; --ink-soft:rgba(59,72,77,.62);
  --serif:Didot,"Bodoni MT",Georgia,"Songti SC",serif;
  --mono:"SF Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC",sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);overflow:hidden}
::selection{background:var(--deep);color:var(--paper)}
a{color:inherit;text-decoration:none}
#veil{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}

header{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;
  border-bottom:1px solid rgba(59,72,77,.25);font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase}
header .lft{display:flex;gap:14px;align-items:center}
header .no{font-family:var(--serif);font-size:15px;letter-spacing:.04em;text-transform:none}
header a{opacity:.6;transition:opacity .3s}
header a:hover{opacity:1}
#hState{display:flex;align-items:center;gap:8px;color:var(--ink-soft)}
#hState .dot{width:7px;height:7px;border-radius:50%;background:var(--sea);transition:background .5s}
body.storm #hState .dot{background:var(--rust);animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}

main{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:0;height:calc(100vh - 52px)}
.left{padding:20px 26px 86px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;min-width:0}
.title-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(22px,2.8vw,34px);letter-spacing:.02em}
h1 em{font-style:italic;color:var(--deep)}
.statusline{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-soft)}
.statusline b{color:var(--deep);font-weight:400}
body.storm .statusline b{color:var(--rust)}
.epig{font-family:var(--serif);font-style:italic;font-size:14.5px;color:var(--ink-soft);margin-top:2px}

.frame{position:relative;border:1px solid rgba(59,72,77,.4);background:#EAE7DB;
  box-shadow:3px 3px 0 rgba(59,72,77,.08)}
.frame .tag{position:absolute;top:-1px;left:-1px;font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;
  background:var(--deep);color:var(--paper);padding:3px 9px;z-index:2}
body.storm .frame .tag{background:var(--rust)}
.frame canvas{display:block;width:100%}
#gauges{height:min(30vh,280px);min-height:200px}
#wave{height:min(24vh,200px);min-height:140px}
.hintline{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}

.right{border-left:1px solid rgba(59,72,77,.25);display:flex;flex-direction:column;min-height:0;background:rgba(255,255,255,.22)}
.right .loghead{padding:12px 18px;border-bottom:1px solid rgba(59,72,77,.25);font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;display:flex;justify-content:space-between;color:var(--ink-soft)}
#log{flex:1;overflow-y:auto;padding:10px 18px;scrollbar-width:thin;scrollbar-color:rgba(59,72,77,.3) transparent}
#log::-webkit-scrollbar{width:4px}
#log::-webkit-scrollbar-thumb{background:rgba(59,72,77,.3)}
#log .entry{display:flex;gap:12px;align-items:baseline;padding:6px 0;border-bottom:1px dashed rgba(59,72,77,.18);
  animation:entryin .6s var(--ease)}
@keyframes entryin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
#log .t{font-family:var(--mono);font-size:9px;color:var(--ink-soft);flex:0 0 auto;letter-spacing:.06em}
#log .m{font-family:var(--serif);font-size:13.5px;color:var(--ink);line-height:1.5}
#log .entry.warn .m{color:#7A6A4A}
#log .entry.crit .m{color:var(--rust);font-style:italic}

.panel{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;max-width:calc(100vw - 28px);
  background:rgba(227,224,213,.88);backdrop-filter:blur(10px);border:1px solid rgba(59,72,77,.4);
  padding:12px 18px;transition:all .5s var(--ease);box-shadow:4px 4px 0 rgba(59,72,77,.1)}
.panel.hidden{transform:translateX(-50%) translateY(14px);opacity:0;pointer-events:none}
.panel.noanim,.paneltab.noanim{transition:none}
.panel .prow{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;justify-content:center}
.ctl{display:flex;flex-direction:column;gap:6px}
.ctl label{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-soft);display:flex;justify-content:space-between;gap:12px}
.ctl label output{color:var(--deep)}
input[type=range]{-webkit-appearance:none;appearance:none;width:110px;height:18px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:rgba(59,72,77,.5)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:10px;height:10px;margin-top:-4.5px;background:var(--paper);border:1.5px solid var(--deep);border-radius:50%}
input[type=range]::-webkit-slider-thumb:hover{background:var(--deep)}
input[type=range]::-moz-range-track{height:1px;background:rgba(59,72,77,.5)}
input[type=range]::-moz-range-thumb{width:9px;height:9px;background:var(--paper);border:1.5px solid var(--deep);border-radius:50%}
input[type=range].timerule::-webkit-slider-runnable-track{height:5px;border-radius:3px;
  background:linear-gradient(90deg,#3E4A50 0%,#7E9399 22%,#E3E0D5 45%,#E8D9B8 62%,#C8B89A 75%,#3E4A50 100%)}
input[type=range].timerule::-moz-range-track{height:5px;border-radius:3px;
  background:linear-gradient(90deg,#3E4A50 0%,#7E9399 22%,#E3E0D5 45%,#E8D9B8 62%,#C8B89A 75%,#3E4A50 100%)}
.etudes{display:flex;gap:6px}
.etudes button,.act{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:8px 11px;
  background:transparent;color:var(--ink);border:1px solid rgba(59,72,77,.45);cursor:pointer;transition:all .25s var(--ease)}
.etudes button:hover,.act:hover{border-color:var(--deep);color:var(--deep)}
.etudes button.on{background:rgba(79,102,110,.14);border-color:var(--deep);color:var(--deep)}
.etudes button.on.stormy{background:rgba(217,123,90,.16);border-color:var(--rust);color:var(--rust)}
.paneltab{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;font-family:var(--mono);font-size:9px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-soft);border:1px solid rgba(59,72,77,.4);background:rgba(227,224,213,.85);
  padding:7px 14px;cursor:pointer;opacity:0;pointer-events:none;transition:all .5s var(--ease)}
.paneltab.show{opacity:1;pointer-events:auto}

.colophon{position:fixed;left:26px;bottom:20px;z-index:55;display:flex;align-items:center;gap:9px;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;opacity:.62;cursor:pointer;user-select:none}
.colophon:hover{opacity:.9}
.secret{position:fixed;left:26px;bottom:46px;z-index:55;max-width:300px;font-family:var(--serif);font-style:italic;font-size:14px;line-height:1.7;
  color:var(--ink);opacity:0;transform:translateY(6px);transition:all .8s var(--ease);pointer-events:none}
.secret.show{opacity:.9;transform:translateY(0)}
.sndbtn{position:fixed;top:64px;right:26px;z-index:60;width:34px;height:34px;border:1px solid rgba(59,72,77,.45);background:rgba(227,224,213,.7);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s var(--ease);color:var(--ink)}
.sndbtn:hover{border-color:var(--deep)}
.sndbtn.on{background:rgba(79,102,110,.16);border-color:var(--deep)}
.sndbtn svg{stroke:var(--ink)}

@media(max-width:860px){
  header>span:nth-child(2){display:none}
  main{grid-template-columns:1fr;height:auto;overflow-y:auto}
  body{overflow:auto}
  .right{border-left:none;border-top:1px solid rgba(59,72,77,.25)}
  #log{max-height:260px}
  .left{padding:16px 16px 120px}
  .sndbtn{right:16px}
  .colophon{left:16px}
  .secret{left:16px}
  .panel{bottom:12px;padding:10px 12px;width:calc(100vw - 20px)}
  .panel .prow{gap:10px;justify-content:flex-start}
  input[type=range]{width:84px}
  .paneltab{bottom:44px}
}
</style>

<body>
<canvas id="veil"></canvas>

<header>
  <div class="lft"><span class="no">N°038</span><span>AI·VIDEO</span><a href="../../../index.html#work">← Archive</a></div>
  <span>Sémaphore · 潮汐信号台</span>
  <span id="hState"><span class="dot"></span><span id="hStateTxt">平潮 · 信号正常</span></span>
</header>

<main>
  <div class="left">
    <div class="title-row">
      <div>
        <h1>Data <em>/</em> Stream <em>Reel</em> · 数据潮汐</h1>
        <div class="epig">潮水退去的地方，沙子记得每一道波纹。数据也是。</div>
      </div>

<div class="colophon" id="colophon">

             C 14 20, 6 22, 2 28 C 10 26, 18 26, 25 26
             C 27 30, 30 34, 34 36 C 33 32, 33 28, 34 25
             C 42 22, 52 16, 62 4 C 54 10, 44 16, 36 19
             C 35 17, 33 17, 32 20 Z"/>

</div>
<div class="secret" id="secret">老守台人退休那天在日志末页写：<br>「四十二年，我没见过两次<br>一模一样的潮。」</div>

<div class="sndbtn" id="sndBtn" title="环境声（默认关闭）" role="button" aria-label="toggle sound">
  <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke-width="1.3" stroke-linecap="round">

      <input type="range" id="sNoise" min="0" max="100" value="18"></div>

      <input type="range" id="sHeure" class="timerule" min="0" max="24" step="0.05" value="10"></div>
    <button class="act" id="bNow">此刻</button>

    <button class="act" id="bDown">收下这一页</button>
  </div>
</div>
<div class="paneltab" id="paneltab">画具 · H</div>

<script>
(function(){
"use strict";
/* ================================================================
   潮汐信号台 — 数据流的印象主义
   珐琅仪表 + 潮汐尺 + 守台日志 + 风暴模式 + heure 灯光
   ================================================================ */
var t=0,frameN=0,seed=Math.random()*999;
function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
function R(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,k){return a+(b-a)*k;}

/* ---------- HSL→rgb 工具 ---------- */
function hex2hsl(hex){
  var r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  var mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,h=0,s=0;
  if(mx!==mn){var d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);
    if(mx===r)h=((g-b)/d+(g<b?6:0));else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;}
  return [h,s*100,l*100];
}
function hsl2rgb(h,s,l){
  h=((h%360)+360)%360;s=clamp(s,0,100)/100;l=clamp(l,0,100)/100;
  var c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2,r=0,g=0,b=0;
  if(h<60){r=c;g=x;}else if(h<120){r=x;g=c;}else if(h<180){g=c;b=x;}
  else if(h<240){g=x;b=c;}else if(h<300){r=x;b=c;}else{r=c;b=x;}
  return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)];
}
function rgba(h,s,l,a){var c=hsl2rgb(h,s,l);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function lerpHsl(c1,c2,k){
  var dh=c2[0]-c1[0];if(dh>180)dh-=360;if(dh<-180)dh+=360;
  return [c1[0]+dh*k,lerp(c1[1],c2[1],k),lerp(c1[2],c2[2],k)];
}
var FAM={paper:hex2hsl('#E3E0D5'),sand:hex2hsl('#C8B89A'),shallow:hex2hsl('#B5C2C4'),
         sea:hex2hsl('#7E9399'),deep:hex2hsl('#4F666E'),rust:hex2hsl('#D97B5A')};

/* ---------- heure：信号台的灯 ---------- */
var heure=(new Date().getHours())+(new Date().getMinutes())/60;
var heureTarget=heure,heureAuto=true;
function lightAt(h){
  var K=[
    [0.0,{tint:[220,18,32],tintA:0.20,lamp:1.00,dim:0.30}],
    [5.0,{tint:[220,18,32],tintA:0.20,lamp:1.00,dim:0.30}],
    [7.0,{tint:[205,14,60],tintA:0.16,lamp:0.25,dim:0.16}],
    [10.0,{tint:[200,10,80],tintA:0.05,lamp:0.0,dim:0.05}],
    [15.0,{tint:[200,10,82],tintA:0.04,lamp:0.0,dim:0.05}],
    [17.5,{tint:[35,40,70],tintA:0.10,lamp:0.35,dim:0.14}],
    [19.5,{tint:[30,35,55],tintA:0.20,lamp:0.85,dim:0.30}],
    [21.5,{tint:[222,20,34],tintA:0.19,lamp:1.00,dim:0.28}],
    [24.0,{tint:[220,18,32],tintA:0.20,lamp:1.00,dim:0.30}]
  ];
  for(var i=0;i<K.length-1;i++){
    if(h>=K[i][0]&&h<=K[i+1][0]){
      var k=(h-K[i][0])/(K[i+1][0]-K[i][0]);k=k*k*(3-2*k);
      var A=K[i][1],B=K[i+1][1];
      return {tint:lerpHsl(A.tint,B.tint,k),tintA:lerp(A.tintA,B.tintA,k),
              lamp:lerp(A.lamp,B.lamp,k),dim:lerp(A.dim,B.dim,k)};
    }
  }
  return K[0][1];
}

/* ---------- 状态 ---------- */
var rate=1.0,noise=0.18,storm=0,stormOn=false;
var ETUDES={calme:{rate:0.8,noise:0.10,storm:false},montee:{rate:2.2,noise:0.32,storm:false},orage:{rate:3.2,noise:0.5,storm:true}};

/* ---------- 画布 ---------- */
var gc=document.getElementById('gauges'),gx=gc.getContext('2d');
var wc=document.getElementById('wave'),wx=wc.getContext('2d');
var veil=document.getElementById('veil'),vx=veil.getContext('2d');
var GW=0,GH=0,WW=0,WH=0,VW=0,VH=0,dpr=1;
function size(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  GW=Math.min(gc.clientWidth,window.innerWidth-32);GH=gc.clientHeight;gc.width=GW*dpr;gc.height=GH*dpr;gx.setTransform(dpr,0,0,dpr,0,0);
  WW=Math.min(wc.clientWidth,window.innerWidth-32);WH=wc.clientHeight;wc.width=WW*dpr;wc.height=WH*dpr;wx.setTransform(dpr,0,0,dpr,0,0);
  VW=window.innerWidth;VH=window.innerHeight;veil.width=VW*dpr;veil.height=VH*dpr;vx.setTransform(dpr,0,0,dpr,0,0);
  buildPaper();buildFaceSpecks();
}
window.addEventListener('resize',size);

/* ---------- 纸纹（veil 层用） ---------- */
var paper=document.createElement('canvas');
function buildPaper(){
  paper.width=Math.max(2,Math.floor(VW/2));paper.height=Math.max(2,Math.floor(VH/2));
  var p=paper.getContext('2d');
  for(var i=0;i<4200;i++){
    p.fillStyle='rgba('+(rnd()<0.5?'255,255,255':'60,70,74')+','+R(0.02,0.055).toFixed(3)+')';
    p.fillRect(rnd()*paper.width,rnd()*paper.height,R(0.5,1.8),R(0.5,1.8));
  }
  for(var f=0;f<46;f++){
    p.strokeStyle='rgba(255,255,255,'+R(0.008,0.02).toFixed(3)+')';
    p.lineWidth=R(0.3,0.8);
    var x=rnd()*paper.width,y=rnd()*paper.height,a=rnd()*6.28,Ln=R(20,90);
    p.beginPath();p.moveTo(x,y);p.lineTo(x+Math.cos(a)*Ln,y+Math.sin(a)*Ln);p.stroke();
  }
}

/* ---------- 珐琅仪表 ---------- */
var gauges=[
  {label:'潮位 MARÉE',unit:'m',mode:0,val:0.62,tgt:0.62,specks:[]},
  {label:'信号 SIGNAL',unit:'dB',mode:0,val:0.38,tgt:0.38,specks:[]},
  {label:'风 VENT',unit:'kt',mode:0,val:0.30,tgt:0.30,specks:[]}
];
var modes=['流速','峰值','差分'];
function buildFaceSpecks(){
  gauges.forEach(function(g){
    g.specks=[];
    for(var i=0;i<130;i++)g.specks.push({a:rnd()*6.28,r:rnd(),l:R(-4,5),al:R(0.05,0.16)});
  });
}
var needleTremble=[0,0,0];

function drawGauges(){
  gx.clearRect(0,0,GW,GH);
  var n=gauges.length,cw=GW/n;
  for(var i=0;i<n;i++){
    var g=gauges[i],cx=cw*i+cw/2,cy=GH*0.58,Rd=Math.min(cw,GH)*0.34;
    if(rnd()<0.02*rate)g.tgt=clamp(g.tgt+(rnd()-0.5)*(stormOn?0.5:0.2),0.08,0.99);
    if(stormOn&&rnd()<0.012*rate)g.tgt=clamp(g.tgt+0.1,0.08,0.99);
    g.val+=(g.tgt-g.val)*0.06+(rnd()-0.5)*(0.012+storm*0.06);
    needleTremble[i]*=0.9;

    /* 铜圈 */
    gx.lineWidth=5;gx.strokeStyle=rgba(FAM.sand[0],FAM.sand[1],FAM.sand[2]-8,0.9);
    gx.beginPath();gx.arc(cx,cy,Rd+7,0,6.29);gx.stroke();
    gx.lineWidth=1.4;gx.strokeStyle=rgba(FAM.deep[0],FAM.deep[1],FAM.deep[2],0.5);
    gx.beginPath();gx.arc(cx,cy,Rd+11,0,6.29);gx.stroke();
    /* 珐琅面：贝壳白底 + 碎色釉点 */
    gx.fillStyle=rgba(FAM.paper[0],FAM.paper[1],FAM.paper[2]+3,1);
    gx.beginPath();gx.arc(cx,cy,Rd+4,0,6.29);gx.fill();
    for(var s=0;s<g.specks.length;s++){
      var sp=g.specks[s];
      var px=cx+Math.cos(sp.a)*sp.r*Rd,py=cy+Math.sin(sp.a)*sp.r*Rd;
      gx.fillStyle=rgba(FAM.shallow[0],FAM.shallow[1],FAM.shallow[2]+sp.l,sp.al);
      gx.fillRect(px,py,R(0.8,2),R(0.8,2));
    }
    /* 刻度：手刻抖动 */
    gx.lineWidth=1;gx.strokeStyle=rgba(FAM.deep[0],FAM.deep[1],FAM.deep[2],0.65);
    var a0=Math.PI*0.75;
    for(var k=0;k<=20;k++){
      var ta=a0+(Math.PI*1.5)*k/20+(rnd()-0.5)*0.006;
      var r1=Rd-2,r2=Rd-(k%5===0?10:6);
      gx.beginPath();
      gx.moveTo(cx+Math.cos(ta)*r1,cy+Math.sin(ta)*r1);
      gx.lineTo(cx+Math.cos(ta)*r2,cy+Math.sin(ta)*r2);gx.stroke();
    }
    /* 风暴红区（锈红点缀） */
    if(storm>0.03){
      gx.lineWidth=3;gx.strokeStyle=rgba(FAM.rust[0],FAM.rust[1],FAM.rust[2],0.3+storm*0.5);
      gx.beginPath();gx.arc(cx,cy,Rd-4,a0+Math.PI*1.5*0.82,a0+Math.PI*1.5);gx.stroke();
    }
    /* 指针 */
    var a1=a0+(Math.PI*1.5)*clamp(g.val,0,1)+needleTremble[i]*Math.sin(t*13+i*7)*0.05;
    gx.strokeStyle=rgba(FAM.deep[0],FAM.deep[1],FAM.deep[2]-4,0.95);gx.lineWidth=1.8;
    gx.beginPath();gx.moveTo(cx,cy);
    gx.lineTo(cx+Math.cos(a1)*Rd*0.8,cy+Math.sin(a1)*Rd*0.8);gx.stroke();
    gx.fillStyle=rgba(FAM.rust[0],FAM.rust[1],FAM.rust[2],1);
    gx.beginPath();gx.arc(cx,cy,2.6,0,6.29);gx.fill();
    /* 读数 */
    gx.fillStyle=rgba(FAM.deep[0],FAM.deep[1],FAM.deep[2],0.95);
    gx.font='12px "SF Mono",Menlo,monospace';gx.textAlign='center';
    gx.fillText((g.val*(i===0?8:i===1?40:60)).toFixed(1)+' '+g.unit,cx,cy+Rd*0.52);
    gx.font='8.5px "SF Mono",Menlo,monospace';gx.fillStyle=rgba(FAM.deep[0],FAM.deep[1],FAM.deep[2],0.6);
    gx.fillText(g.label,cx,cy-Rd-16);
    gx.fillStyle=rgba(FAM.rust[0],FAM.rust[1],FAM.rust[2],0.9);
    gx.fillText('['+modes[g.mode]+']',cx,cy+Rd*0.72);
    if(i>0){gx.strokeStyle=rgba(FAM.deep[0],FAM.deep[1],FAM.deep[2],0.15);
      gx.beginPath();gx.moveTo(cw*i+.5,14);gx.lineTo(cw*i+.5,GH-14);gx.stroke();}
  }
}
gc.addEventListener('click',function(e){
  var r=gc.getBoundingClientRect();
  var idx=Math.floor((e.clientX-r.left)/r.width*gauges.length);
  if(gauges[idx]){gauges[idx].mode=(gauges[idx].mode+1)%modes.length;
    gauges[idx].tgt=rnd();needleTremble[idx]=1;}
});
gc.addEventListener('pointermove',function(e){
  var r=gc.getBoundingClientRect();
  var idx=Math.floor((e.clientX-r.left)/r.width*gauges.length);
  if(gauges[idx])needleTremble[idx]=Math.min(1,needleTremble[idx]+0.15);
});

/* ---------- 潮汐尺（波形） ---------- */
var trace=[],TRACE_N=420;
var ripples=[];
function drawWave(){
  wx.clearRect(0,0,WW,WH);
  wx.strokeStyle=rgba(FAM.deep[0],FAM.deep[1],FAM.deep[2],0.1);wx.lineWidth=1;wx.beginPath();
  for(var gy=0;gy<WH;gy+=Math.max(18,WH/6)){wx.moveTo(0,gy+.5);wx.lineTo(WW,gy+.5);}
  for(var gx2=0;gx2<WW;gx2+=Math.max(26,WW/16)){wx.moveTo(gx2+.5,0);wx.lineTo(gx2+.5,WH);}
  wx.stroke();
  var amp=1+storm*1.6;
  var base=(Math.sin(t*1.3)*0.3+Math.sin(t*3.7)*0.18+Math.sin(t*0.31)*0.22)*amp;
  if(storm>0.1)base+=Math.sin(t*7.3)*0.14*storm;
  var n1=(rnd()-0.5)*noise*2*(1+storm);
  var spike=(stormOn&&rnd()<0.05)?(rnd()-0.5)*1.4:0;
  trace.push(base+n1+spike);
  if(trace.length>TRACE_N)trace.shift();
  for(var layer=0;layer<3;layer++){
    var col=layer===0?FAM.deep:FAM.sea;
    wx.strokeStyle=rgba(col[0],col[1],col[2],layer===0?0.9:0.3-layer*0.07);
    wx.lineWidth=layer===0?1.7:1;
    wx.beginPath();
    for(var i=0;i<trace.length;i++){
      var x=i/(TRACE_N-1)*WW;
      var y=WH*0.52+trace[i]*WH*0.3+layer*3;
      if(i===0)wx.moveTo(x,y);else wx.lineTo(x,y);
    }
    wx.stroke();
  }
  /* 浪沫：风暴时峰顶的点彩白沫 */
  if(storm>0.05){
    for(var j=0;j<trace.length;j+=3){
      var v=trace[j];
      if(v>0.55){
        var fx2=j/(TRACE_N-1)*WW,fy=WH*0.52+v*WH*0.3;
        wx.fillStyle=rgba(FAM.paper[0],FAM.paper[1],FAM.paper[2]+4,R(0.3,0.8)*storm);
        wx.fillRect(fx2+R(-3,3),fy+R(-4,2),R(1,2.4),R(1,2));
      }
    }
  }
  /* 风暴警戒线：锈红虚线 */
  if(storm>0.03){
    wx.strokeStyle=rgba(FAM.rust[0],FAM.rust[1],FAM.rust[2],0.25+storm*0.35);
    wx.setLineDash([4,5]);wx.beginPath();
    wx.moveTo(0,WH*0.18);wx.lineTo(WW,WH*0.18);
    wx.moveTo(0,WH*0.86);wx.lineTo(WW,WH*0.86);wx.stroke();wx.setLineDash([]);
  }
}
wc.addEventListener('pointerdown',function(e){
  var r=wc.getBoundingClientRect();
  ripples.push({x:e.clientX-r.left,y:e.clientY-r.top,r:0,a:1});
});
function drawRipples(){
  for(var i=ripples.length-1;i>=0;i--){
    var w=ripples[i];w.r+=3.4;w.a*=0.955;
    wx.strokeStyle=rgba(FAM.sea[0],FAM.sea[1],FAM.sea[2],w.a*0.5);
    wx.lineWidth=1.1;
    wx.beginPath();wx.arc(w.x,w.y,w.r,0,6.29);wx.stroke();
    if(w.a<0.03)ripples.splice(i,1);
  }
}

/* ---------- 守台日志 ---------- */
var logEl=document.getElementById('log'),logCount=0,logPause=false;
logEl.addEventListener('mouseenter',function(){logPause=true;});
logEl.addEventListener('mouseleave',function(){logPause=false;});
var okMsg=['潮位稳，灯器完好','东南风三级，帆影两点','信号清晰，抄收无误','渔船早出，午后归','缆绳检查过，都服帖','海平线干净，无云脚','给灯添了油，火苗正','抄到邻台问候，回了'];
var warnMsg=['气压回落，云脚压低','浪比早上高了半米','信号偶尔发涩，留意','缆绳又紧了一道','风里带腥，要变天'];
var critMsg=['风增至九级，百叶窗已闩','浪越过防波堤','灯器转弱，有人守着','信号断续，改用旗语','雨横着下，关紧门窗'];
function addLog(){
  logCount++;
  var d=new Date();
  var ts=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
  var roll=rnd(),cls='',msg;
  if(stormOn){
    if(roll<0.4){cls='crit';msg=critMsg[Math.floor(rnd()*critMsg.length)];}
    else if(roll<0.72){cls='warn';msg=warnMsg[Math.floor(rnd()*warnMsg.length)];}
    else{msg=okMsg[Math.floor(rnd()*okMsg.length)];}
  }else{
    if(roll<0.06){cls='warn';msg=warnMsg[Math.floor(rnd()*warnMsg.length)];}
    else{msg=okMsg[Math.floor(rnd()*okMsg.length)];}
  }
  var el=document.createElement('div');el.className='entry '+cls;
  el.innerHTML='<span class="t">'+ts+'</span><span class="m">'+msg+'</span>';
  logEl.appendChild(el);
  while(logEl.children.length>120)logEl.removeChild(logEl.firstChild);
  if(!logPause)logEl.scrollTop=logEl.scrollHeight;
  document.getElementById('lCount').textContent=String(logCount).padStart(4,'0');
}
var logTimer=0;

/* ---------- 风暴 ---------- */
var etudeBtns=document.querySelectorAll('#etudes button');
function setStorm(on){
  stormOn=on;
  document.body.classList.toggle('storm',on);
  document.getElementById('hStateTxt').textContent=on?'风暴 · 全员值守':'平潮 · 信号正常';
  if(AC&&soundOn)stormWhoosh();
}
window.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT')return;
  if(e.key==='a'||e.key==='A')setStorm(!stormOn);
  if(e.key==='h'||e.key==='H')togglePanel();
  if(e.key==='1')applyEtude('calme');if(e.key==='2')applyEtude('montee');if(e.key==='3')applyEtude('orage');
});

/* ---------- 声景：风 / 雨 / 远鸥（克制） ---------- */
var AC=null,master=null,windGain=null,windBP=null,rainGain=null,soundOn=false;
function initAudio(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=0;master.connect(AC.destination);
  var len=AC.sampleRate*3,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0),last=0;
  for(var i=0;i<len;i++){var w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.2;}
  var src=AC.createBufferSource();src.buffer=buf;src.loop=true;
  windBP=AC.createBiquadFilter();windBP.type='bandpass';windBP.frequency.value=520;windBP.Q.value=1;
  windGain=AC.createGain();windGain.gain.value=0.04;
  src.connect(windBP);windBP.connect(windGain);windGain.connect(master);src.start();
  var wbuf=AC.createBuffer(1,len,AC.sampleRate),wd=wbuf.getChannelData(0);
  for(var j=0;j<len;j++)wd[j]=Math.random()*2-1;
  var wsrc=AC.createBufferSource();wsrc.buffer=wbuf;wsrc.loop=true;
  var hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=1200;
  rainGain=AC.createGain();rainGain.gain.value=0;
  wsrc.connect(hp);hp.connect(rainGain);rainGain.connect(master);wsrc.start();
}
function gull(){
  if(!AC||!soundOn||storm>0.5)return;
  var now=AC.currentTime,o=AC.createOscillator(),m=AC.createOscillator(),mg=AC.createGain(),g=AC.createGain();
  var f0=R(1800,2600);
  o.frequency.setValueAtTime(f0,now);
  o.frequency.exponentialRampToValueAtTime(f0*0.72,now+0.28);
  m.frequency.value=R(60,110);mg.gain.value=f0*0.3;
  m.connect(mg);mg.connect(o.frequency);
  g.gain.setValueAtTime(0,now);
  g.gain.linearRampToValueAtTime(0.02,now+0.03);
  g.gain.exponentialRampToValueAtTime(0.0001,now+0.4);
  o.connect(g);g.connect(master);o.start(now);m.start(now);o.stop(now+0.5);m.stop(now+0.5);
}
function stormWhoosh(){
  if(!AC)return;
  var now=AC.currentTime;
  windBP.frequency.cancelScheduledValues(now);
  windBP.frequency.setValueAtTime(windBP.frequency.value,now);
  windBP.frequency.exponentialRampToValueAtTime(900,now+2.2);
}
var sndBtn=document.getElementById('sndBtn');
function setSound(on){
  soundOn=on;sndBtn.classList.toggle('on',on);
  try{localStorage.setItem('atelier-mira-sound',on?'1':'0');}catch(e){}
  if(on&&!AC)initAudio();
  if(AC){if(AC.state==='suspended')AC.resume();
    var now=AC.currentTime;master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(master.gain.value,now);
    master.gain.linearRampToValueAtTime(on?0.75:0,now+(on?1.5:0.4));}
}
sndBtn.addEventListener('click',function(){setSound(!soundOn);});
try{if(localStorage.getItem('atelier-mira-sound')==='1'){
  soundOn=true;sndBtn.classList.add('on');
  var arm=function(){setSound(true);window.removeEventListener('pointerdown',arm);};
  window.addEventListener('pointerdown',arm);}}catch(e){}

/* ---------- 控件 ---------- */
var oRate=document.getElementById('oRate'),oNoise=document.getElementById('oNoise'),oHeure=document.getElementById('oHeure');
var sHeure=document.getElementById('sHeure');
document.getElementById('sRate').addEventListener('input',function(){
  rate=+this.value/100;oRate.textContent=rate.toFixed(1)+'×';markCustom();});
document.getElementById('sNoise').addEventListener('input',function(){
  noise=+this.value/100;oNoise.textContent=this.value+'%';markCustom();});
sHeure.addEventListener('input',function(){heureTarget=+this.value;heureAuto=false;});
document.getElementById('bNow').addEventListener('click',function(){heureAuto=true;});
document.getElementById('bRegen').addEventListener('click',function(){
  seed=Math.random()*999;gauges.forEach(function(g){g.tgt=0.1+rnd()*0.8;});
  trace=[];buildPaper();buildFaceSpecks();});
document.getElementById('bDown').addEventListener('click',function(){
  var out=document.createElement('canvas');out.width=gc.width;out.height=gc.height+wc.height;
  var o=out.getContext('2d');
  o.fillStyle='#EAE7DB';o.fillRect(0,0,out.width,out.height);
  o.drawImage(gc,0,0);o.drawImage(wc,0,gc.height);
  var a=document.createElement('a');a.download='atelier-mira-n038-semaphore.png';
  a.href=out.toDataURL('image/png');a.click();});
function markCustom(){etudeBtns.forEach(function(b){b.classList.remove('on');});}
function applyEtude(name){
  var e=ETUDES[name];if(!e)return;
  rate=e.rate;noise=e.noise;
  document.getElementById('sRate').value=e.rate*100;
  document.getElementById('sNoise').value=e.noise*100;
  oRate.textContent=e.rate.toFixed(1)+'×';oNoise.textContent=Math.round(e.noise*100)+'%';
  setStorm(e.storm);
  etudeBtns.forEach(function(b){b.classList.toggle('on',b.dataset.e===name);});
}
etudeBtns.forEach(function(b){b.addEventListener('click',function(){applyEtude(b.dataset.e);});});

var panel=document.getElementById('panel'),paneltab=document.getElementById('paneltab'),panelHidden=false;
function togglePanel(){
  panelHidden=!panelHidden;
  panel.classList.toggle('hidden',panelHidden);
  paneltab.classList.toggle('show',panelHidden);
}
paneltab.addEventListener('click',togglePanel);

var colClicks=0,colTimer=null;
document.getElementById('colophon').addEventListener('click',function(){
  colClicks++;clearTimeout(colTimer);
  colTimer=setTimeout(function(){colClicks=0;},900);
  if(colClicks>=3){document.getElementById('secret').classList.toggle('show');colClicks=0;}
});

/* ---------- veil：环境光 / 灯下暖光 / 雨痕 / 纸纹 / 颗粒 ---------- */
var rainStreaks=[];
function drawVeil(L){
  vx.clearRect(0,0,VW,VH);
  vx.fillStyle=rgba(L.tint[0],L.tint[1],L.tint[2],L.tintA);
  vx.fillRect(0,0,VW,VH);
  var vg=vx.createRadialGradient(VW/2,VH*0.45,VH*0.3,VW/2,VH*0.45,VW*0.72);
  vg.addColorStop(0,rgba(215,20,22,0));vg.addColorStop(1,rgba(215,20,22,L.dim));
  vx.fillStyle=vg;vx.fillRect(0,0,VW,VH);
  /* 灯下暖光：入夜后，信号台的灯亮起来（光源在视口之上，光池洒下） */
  if(L.lamp>0.03){
    var flick=L.lamp*(0.94+0.06*Math.sin(t*9)+(storm>0.3?0.05*Math.sin(t*31):0));
    var lg=vx.createRadialGradient(VW*0.84,-VH*0.06,10,VW*0.84,-VH*0.06,VH*0.85);
    lg.addColorStop(0,rgba(FAM.sand[0]+4,FAM.sand[1]+12,64,flick*0.28));
    lg.addColorStop(1,rgba(40,40,60,0));
    vx.fillStyle=lg;vx.fillRect(0,0,VW,VH);
  }
  /* 风暴雨痕：斜扫过整页 */
  if(storm>0.03){
    var want=Math.floor(storm*130);
    while(rainStreaks.length<want)rainStreaks.push({x:R(0,VW),y:R(-VH*0.2,VH),sp:R(10,18)});
    rainStreaks.length=Math.min(rainStreaks.length,want);
    vx.strokeStyle=rgba(FAM.deep[0],FAM.deep[1]+4,FAM.deep[2]-6,0.5);
    vx.lineWidth=1;
    for(var i=0;i<rainStreaks.length;i++){
      var d2=rainStreaks[i];
      d2.y+=d2.sp;d2.x+=2.2;
      if(d2.y>VH){d2.y=-12;d2.x=R(0,VW);}
      vx.beginPath();vx.moveTo(d2.x,d2.y);vx.lineTo(d2.x-5,d2.y+R(14,26));vx.stroke();
    }
  }
  /* 纸纹 */
  vx.save();vx.globalAlpha=0.4;vx.globalCompositeOperation='multiply';
  vx.drawImage(paper,0,0,VW,VH);vx.restore();
  /* 颗粒 12fps */
  if(frameN%5===0){
    vx.save();vx.globalAlpha=0.04;
    for(var g2=0;g2<300;g2++){
      vx.fillStyle=Math.random()<0.5?'#fff':'#3B484D';
      vx.fillRect(Math.random()*VW,Math.random()*VH,1.2,1.2);
    }
    vx.restore();
  }
}

/* ---------- 时钟与状态 ---------- */
setInterval(function(){
  var d=new Date();
  document.getElementById('sClock').textContent=
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
  document.getElementById('sBuf').textContent=Math.floor(50+rnd()*30)+'%';
  document.getElementById('sWind').textContent=stormOn?'九级':['二级','三级','四级'][Math.floor(rnd()*3)];
},1000);

/* ---------- 主循环 ---------- */
var gullTimer=5;
function fmtHeure(h){
  var hh=Math.floor(h)%24,mm=Math.floor((h%1)*60);
  return (hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;
}
function frame(){
  t+=0.016*rate;frameN++;
  if(heureAuto)heureTarget=(new Date().getHours())+(new Date().getMinutes())/60;
  var dh=heureTarget-heure;
  if(Math.abs(dh)>0.0004)heure+=dh*0.06;
  sHeure.value=heure;oHeure.textContent=fmtHeure(heure);
  storm+=((stormOn?1:0)-storm)*0.02;
  logTimer+=0.016*rate;
  var interval=stormOn?0.35:1.1;
  if(logTimer>interval){logTimer=0;addLog();}
  drawGauges();
  drawWave();
  drawRipples();
  drawVeil(lightAt(((heure%24)+24)%24));
  if(AC&&soundOn){
    windGain.gain.value=0.03+storm*0.06;
    rainGain.gain.value=storm*0.05;
    gullTimer-=0.016;
    if(gullTimer<0){gullTimer=R(4,11);gull();}
  }
  requestAnimationFrame(frame);
}

size();
try{if(location.hash.indexOf('orage')>=0){applyEtude('orage');storm=1;}}catch(e){}
for(var pi=0;pi<TRACE_N;pi++){
  var pamp=1+storm*1.6;
  trace.push((Math.sin(pi*0.02*1.3)*0.3+Math.sin(pi*0.02*3.7)*0.18+Math.sin(pi*0.02*0.31)*0.22)*pamp+(rnd()-0.5)*noise*2);
}
for(var i=0;i<7;i++)addLog();
if(window.innerWidth<860){
  panel.classList.add('noanim');paneltab.classList.add('noanim');
  togglePanel();
  setTimeout(function(){panel.classList.remove('noanim');paneltab.classList.remove('noanim');},60);
}
requestAnimationFrame(frame);
})();
</script>
