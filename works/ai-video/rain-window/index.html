<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rain Window — 雨窗 · Atelier MIRA N°026</title>
<!--
  调色板家族：② 金色时刻 Heure Dorée —— 暖，≈3200K。
  #F4E3C2 蜜光 · #E8B96F 金 · #D98E4A 琥珀 · #A85B3C 焦赭 · #5E6E7E 阴影补色蓝
  铁律执行：受光面走金→琥珀，所有阴影与夜色落蓝紫系（#5E6E7E 一族），无黑无灰。
  面积配比：街景暖色 ≈55% · 蓝紫影 ≈35% · 蜜光高光 ≈10%。
-->
<style>
:root{
  --miel:#F4E3C2; --or:#E8B96F; --ambre:#D98E4A; --ocre:#A85B3C; --ombre:#5E6E7E;
  --nuit:#3E4A58; --ink:#2E3844;
  --serif:Didot,"Bodoni MT",Georgia,"Songti SC",serif;
  --mono:"SF Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC",sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--nuit);color:var(--miel);font-family:var(--sans);overflow:hidden}
::selection{background:var(--or);color:var(--ink)}
canvas#glass{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}

.nameplate{position:fixed;top:26px;left:30px;pointer-events:none;text-shadow:0 1px 14px rgba(46,56,68,.55)}
.nameplate .no{font-family:var(--mono);font-size:10px;letter-spacing:.22em;opacity:.72}
.nameplate h1{font-family:var(--serif);font-weight:400;font-size:clamp(24px,3.2vw,38px);letter-spacing:.02em;margin-top:7px;color:var(--miel)}
.nameplate h1 em{font-style:italic;color:var(--or)}
.nameplate .epig{font-family:var(--serif);font-style:italic;font-size:14.5px;opacity:.82;margin-top:8px;max-width:320px;line-height:1.6}
.nameplate .coord{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;opacity:.5;margin-top:10px}

.colophon{position:fixed;left:30px;bottom:22px;display:flex;align-items:center;gap:9px;pointer-events:auto;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;opacity:.66;text-shadow:0 1px 8px rgba(46,56,68,.6);cursor:pointer;user-select:none}
.colophon:hover{opacity:.9}
.secret{position:fixed;left:30px;bottom:48px;max-width:300px;font-family:var(--serif);font-style:italic;font-size:14px;line-height:1.7;
  color:var(--miel);opacity:0;transform:translateY(6px);transition:all .8s var(--ease);pointer-events:none;text-shadow:0 1px 10px rgba(46,56,68,.7)}
.secret.show{opacity:.92;transform:translateY(0)}

.topright{position:fixed;top:26px;right:30px;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.sndbtn{width:34px;height:34px;border:1px solid rgba(244,227,194,.4);background:rgba(62,74,88,.35);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s var(--ease)}
.sndbtn:hover{border-color:var(--or)}
.sndbtn.on{background:rgba(232,185,111,.2);border-color:var(--or)}
.sndbtn svg{stroke:var(--miel)}
.hintline{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;opacity:.55;text-align:right;line-height:1.9;pointer-events:none;text-shadow:0 1px 8px rgba(46,56,68,.6)}

.panel{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:calc(100vw - 28px);
  background:rgba(62,74,88,.6);backdrop-filter:blur(12px);border:1px solid rgba(244,227,194,.22);
  padding:13px 20px 14px;transition:all .5s var(--ease)}
.panel.hidden{transform:translateX(-50%) translateY(14px);opacity:0;pointer-events:none}
.panel.notrans{transition:none}
.panel .prow{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap;justify-content:center}
.ctl{display:flex;flex-direction:column;gap:7px}
.ctl label{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:rgba(244,227,194,.62);display:flex;justify-content:space-between;gap:12px}
.ctl label output{color:var(--or)}
input[type=range]{-webkit-appearance:none;appearance:none;width:124px;height:18px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:rgba(244,227,194,.4)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:10px;height:10px;margin-top:-4.5px;background:var(--nuit);border:1px solid var(--or);border-radius:50%}
input[type=range]::-webkit-slider-thumb:hover{background:var(--or)}
input[type=range]::-moz-range-track{height:1px;background:rgba(244,227,194,.4)}
input[type=range]::-moz-range-thumb{width:9px;height:9px;background:var(--nuit);border:1px solid var(--or);border-radius:50%}
input[type=range].timerule::-webkit-slider-runnable-track{height:5px;border-radius:3px;
  background:linear-gradient(90deg,#3E4A58 0%,#5E6E7E 16%,#C8B69A 32%,#F4E3C2 46%,#E8B96F 60%,#A85B3C 76%,#3E4A58 100%)}
input[type=range].timerule::-moz-range-track{height:5px;border-radius:3px;
  background:linear-gradient(90deg,#3E4A58 0%,#5E6E7E 16%,#C8B69A 32%,#F4E3C2 46%,#E8B96F 60%,#A85B3C 76%,#3E4A58 100%)}
.etudes{display:flex;gap:6px}
.etudes button,.act{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;padding:8px 12px;
  background:transparent;color:var(--miel);border:1px solid rgba(244,227,194,.35);cursor:pointer;transition:all .25s var(--ease)}
.etudes button:hover,.act:hover{border-color:var(--or);color:var(--or)}
.etudes button.on{background:rgba(232,185,111,.18);border-color:var(--or);color:var(--or)}
.paneltab{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);font-family:var(--mono);font-size:9px;letter-spacing:.18em;
  text-transform:uppercase;color:rgba(244,227,194,.6);border:1px solid rgba(244,227,194,.3);background:rgba(62,74,88,.5);
  padding:7px 14px;cursor:pointer;opacity:0;pointer-events:none;transition:all .5s var(--ease)}
.paneltab.show{opacity:1;pointer-events:auto}
.paneltab:hover{color:var(--or);border-color:var(--or)}

@media(max-width:700px){
  .nameplate{top:18px;left:18px}
  .nameplate .epig{font-size:13px;max-width:230px}
  .topright{top:18px;right:18px}
  .hintline{display:none}
  .colophon{left:18px;bottom:16px;font-size:9px}
  .panel{bottom:14px;padding:11px 12px;width:calc(100vw - 24px);max-height:44vh;overflow-y:auto}
  .panel .prow{gap:10px;justify-content:flex-start}
  input[type=range]{width:82px}
  .etudes button,.act{padding:7px 9px}
  .paneltab{bottom:44px}
}
</style>
</head>
<body>
<canvas id="glass"></canvas>

<div class="nameplate">
  <div class="no">N°026 · AI·VIDEO</div>
  <h1>Rain <em>Window</em> · 雨窗</h1>
  <div class="epig">玻璃先知道雨要来，城市后知道。</div>
  <div class="coord">金色时刻 · 一块起雾的玻璃</div>
</div>

<div class="topright">
  <div class="sndbtn" id="sndBtn" title="环境声（默认关闭）" role="button" aria-label="toggle sound">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke-width="1.3" stroke-linecap="round">
      <path d="M2 6.5v3h2.5L8 12.5v-9L4.5 6.5H2z" fill="currentColor" stroke="none" opacity=".85"/>
      <path class="w1" d="M10.5 5.5c1.4 1.4 1.4 3.6 0 5"/>
      <path class="w2" d="M12.5 3.5c2.6 2.6 2.6 6.4 0 9"/>
    </svg>
  </div>
  <div class="hintline">拖动 · 擦开雾气<br>按住 · 唤一场骤雨<br>点击 · 落一滴雨 · H 收起画具</div>
</div>

<div class="colophon" id="colophon">
  <svg width="22" height="14" viewBox="0 0 64 40" fill="#F4E3C2" aria-hidden="true">
    <path d="M32 20 C 26 12, 14 6, 4 8 C 12 12, 18 18, 24 21
             C 14 20, 6 22, 2 28 C 10 26, 18 26, 25 26
             C 27 30, 30 34, 34 36 C 33 32, 33 28, 34 25
             C 42 22, 52 16, 62 4 C 54 10, 44 16, 36 19
             C 35 17, 33 17, 32 20 Z"/>
  </svg>
  <span>Atelier MIRA · N°026 · 金色时刻 Heure Dorée</span>
</div>
<div class="secret" id="secret">擦玻璃的时候，<br>其实是在擦亮自己这边的世界。</div>

<div class="panel" id="panel">
  <div class="prow">
    <div class="etudes" id="etudes">
      <button data-e="brume">晨雨</button><button data-e="soir" class="on">暮雨</button><button data-e="averse">骤雨</button>
    </div>
    <div class="ctl"><label>雨强 Pluie <output id="oRain">55%</output></label>
      <input type="range" id="sRain" min="0" max="100" value="55"></div>
    <div class="ctl"><label>雾气 Buée <output id="oFog">60%</output></label>
      <input type="range" id="sFog" min="0" max="100" value="60"></div>
    <div class="ctl"><label>时刻 Heure <output id="oHeure">—</output></label>
      <input type="range" id="sHeure" class="timerule" min="0" max="24" step="0.05" value="18"></div>
    <button class="act" id="bNow">此刻</button>
    <button class="act" id="bScene">换一条街 ↻</button>
    <button class="act" id="bDown">收下这扇窗</button>
  </div>
</div>
<div class="paneltab" id="paneltab">画具 · H</div>

<script>
(function(){
"use strict";
/* ================================================================
   Rain Window — 金色时刻的雨窗写生
   heure 时间系统 · 碎色街景 · 真雨痕 · 骤雨 wow · WebAudio 雨声
   ================================================================ */
var cv=document.getElementById('glass'),ctx=cv.getContext('2d');
var bg=document.createElement('canvas'),bctx=bg.getContext('2d');     /* 街景（heure 缓存） */
var fog=document.createElement('canvas'),fctx=fog.getContext('2d');   /* 雾气层 */
var trl=document.createElement('canvas'),tctx=trl.getContext('2d');   /* 雨痕层 */
var W=0,H=0,dpr=1,t=0,frameN=0;
function R(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,k){return a+(b-a)*k;}

/* ---------- HSL 工具 ---------- */
function hex2hsl(hex){
  var r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  var mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,h=0,s=0;
  if(mx!==mn){var d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);
    if(mx===r)h=((g-b)/d+(g<b?6:0));else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;}
  return [h,s*100,l*100];
}
function hsl2rgb(h,s,l){
  h=((h%360)+360)%360;s=clamp(s,0,100)/100;l=clamp(l,0,100)/100;
  var c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2,r=0,g=0,b=0;
  if(h<60){r=c;g=x;}else if(h<120){r=x;g=c;}else if(h<180){g=x;b=x;}
  else if(h<240){g=x;b=c;}else if(h<300){r=x;b=c;}else{r=c;b=x;}
  return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)];
}
function hsla(h,s,l,a){var c=hsl2rgb(h,s,l);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function lerpHsl(c1,c2,k){
  var dh=c2[0]-c1[0];if(dh>180)dh-=360;if(dh<-180)dh+=360;
  return [c1[0]+dh*k,lerp(c1[1],c2[1],k),lerp(c1[2],c2[2],k)];
}
var C={miel:hex2hsl('#F4E3C2'),or:hex2hsl('#E8B96F'),ambre:hex2hsl('#D98E4A'),
       ocre:hex2hsl('#A85B3C'),ombre:hex2hsl('#5E6E7E')};

/* ---------- heure：一天的光 ----------
   晨（冷灰金）→ 午（白蜜光）→ 暮（长影金光、灯亮）→ 夜（蓝紫 + 灯海） */
var heure=(new Date().getHours())+(new Date().getMinutes())/60;
var heureTarget=heure,heureAuto=true;
function lightAt(h){
  var K=[
    [0.0, {top:[222,14,16],hor:[214,16,24],lamp:1.00,warm:0.25,sun:0.00}],
    [5.0, {top:[222,14,16],hor:[214,16,24],lamp:0.85,warm:0.25,sun:0.00}],
    [7.0, {top:[216,12,52],hor:[40,18,72], lamp:0.25,warm:0.55,sun:0.30}],   /* 晨 */
    [10.0,{top:[212,12,68],hor:[44,24,80], lamp:0.00,warm:0.70,sun:0.75}],
    [13.0,{top:[210,14,74],hor:[46,30,84], lamp:0.00,warm:0.85,sun:1.00}],   /* 午 */
    [16.5,{top:[38,26,66], hor:[34,44,72], lamp:0.10,warm:1.00,sun:0.80}],   /* 下午金 */
    [18.5,{top:[24,34,52], hor:[22,52,62], lamp:0.55,warm:1.00,sun:0.45}],   /* 金色时刻 */
    [20.5,{top:[226,18,26],hor:[18,30,38], lamp:0.95,warm:0.70,sun:0.10}],   /* 暮 */
    [22.5,{top:[224,16,18],hor:[214,16,24],lamp:1.00,warm:0.30,sun:0.00}],
    [24.0,{top:[222,14,16],hor:[214,16,24],lamp:1.00,warm:0.25,sun:0.00}]
  ];
  for(var i=0;i<K.length-1;i++){
    if(h>=K[i][0]&&h<=K[i+1][0]){
      var k=(h-K[i][0])/(K[i+1][0]-K[i][0]);k=k*k*(3-2*k);
      var A=K[i][1],B=K[i+1][1];
      return {top:lerpHsl(A.top,B.top,k),hor:lerpHsl(A.hor,B.hor,k),
              lamp:lerp(A.lamp,B.lamp,k),warm:lerp(A.warm,B.warm,k),sun:lerp(A.sun,B.sun,k)};
    }
  }
  return {top:K[0][1].top,hor:K[0][1].hor,lamp:1,warm:0.25,sun:0};
}

/* ---------- 参数与练习曲 ---------- */
var P={rain:0.55,fogAmt:0.60};
var ETUDES={brume:{rain:0.30,fog:0.78,h:8},soir:{rain:0.55,fog:0.60,h:18.2},averse:{rain:0.92,fog:0.35,h:19.5}};
var gust=0,gustV=0;      /* 骤雨能量（按住积累，松手惯性衰减） */

/* ---------- 街景生成（种子化） ---------- */
var seed=Math.random()*999;
function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
var lamps=[],shops=[],skyline=[];
function buildStreet(){
  lamps=[];shops=[];skyline=[];
  var nL=2+Math.floor(rnd()*2);
  for(var i=0;i<nL;i++) lamps.push({x:0.14+i*0.22+rnd()*0.08,h:0.30+rnd()*0.06,ph:rnd()*7});
  var x=0.52;
  while(x<0.97){
    var w=0.09+rnd()*0.12;
    shops.push({x:x,w:w,y:0.60+rnd()*0.06,glow:0.5+rnd()*0.5,ph:rnd()*7});
    x+=w+0.015+rnd()*0.03;
  }
  var bx=0;
  while(bx<1){
    var bw=0.08+rnd()*0.16;
    skyline.push({x:bx,w:bw,h:0.10+rnd()*0.16,chim:rnd()<0.5});
    bx+=bw+0.01;
  }
}

/* ---------- 碎色笔触 ---------- */
function brokenFill(c,x0,y0,x1,y1,baseHsl,n,ang,ln,a0,a1){
  for(var i=0;i<n;i++){
    var px=x0+Math.random()*(x1-x0),py=y0+Math.random()*(y1-y0);
    var h=baseHsl[0]+R(-8,8),s=baseHsl[1]+R(-6,6),l=baseHsl[2]+R(-5,5);
    c.strokeStyle=hsla(h,s,l,R(a0,a1));
    c.lineWidth=R(1,2.4);
    var a=ang+R(-0.4,0.4),L=R(ln*0.5,ln*1.5);
    c.beginPath();c.moveTo(px,py);c.lineTo(px+Math.cos(a)*L,py+Math.sin(a)*L);c.stroke();
  }
}
/* 点彩混色：两色交替点，让眼睛自己混 */
function stipple(c,cx,cy,rad,c1,c2,density,r0,r1){
  var n=Math.floor(rad*rad*density);
  for(var i=0;i<n;i++){
    var a=Math.random()*6.283,rr=Math.sqrt(Math.random())*rad;
    var col=Math.random()<0.62?c1:c2;
    var fade=1-rr/rad;
    c.fillStyle=hsla(col[0]+R(-6,6),col[1],col[2]+R(-4,4),(0.10+fade*0.55)*(0.5+Math.random()*0.5));
    c.beginPath();c.arc(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr,R(r0,r1),0,6.29);c.fill();
  }
}

/* ---------- 街景绘制（heure 改变时重画一次） ---------- */
var cacheDirty=true;
function rebuildStreet(L){
  bg.width=W*dpr;bg.height=H*dpr;bctx.setTransform(dpr,0,0,dpr,0,0);
  var horizon=H*0.62;
  /* 天空基底 */
  var g=bctx.createLinearGradient(0,0,0,horizon);
  g.addColorStop(0,hsla(L.top[0],L.top[1],L.top[2],1));
  g.addColorStop(1,hsla(L.hor[0],L.hor[1],L.hor[2],1));
  bctx.fillStyle=g;bctx.fillRect(0,0,W,horizon+2);
  /* 天空碎色 */
  brokenFill(bctx,0,0,W,horizon,L.top,Math.floor(W*H/1800),0.15,26,0.20,0.42);
  brokenFill(bctx,0,horizon*0.55,W,horizon,L.hor,Math.floor(W*H/3200),0.05,30,0.18,0.38);
  /* 太阳/天光位置（随 heure 过顶） */
  var sunX=W*(0.15+0.7*clamp((heure-5)/14,0,1)),sunY=horizon-H*0.34*Math.sin(Math.PI*clamp((heure-5.5)/14,0,1));
  if(L.sun>0.03){
    stipple(bctx,sunX,sunY,H*0.10*L.sun+8,C.miel,C.or,0.010,1.2,2.6);
  }
  /* 远：屋顶天际线（大气透视，向地平线色收敛） */
  for(var i=0;i<skyline.length;i++){
    var b=skyline[i];
    var bx0=b.x*W,bw=b.w*W,bh=b.h*H;
    var fogK=0.55;
    var col=lerpHsl(C.ombre,L.hor,fogK);
    bctx.fillStyle=hsla(col[0],col[1],col[2],0.92);
    bctx.fillRect(bx0,horizon-bh,bw,bh+2);
    if(b.chim)bctx.fillRect(bx0+bw*0.2,horizon-bh-H*0.025,6,H*0.025);
    /* 体块不做平涂：clip 后碎色，明度抖动给体积 */
    bctx.save();
    bctx.beginPath();bctx.rect(bx0,horizon-bh,bw,bh+2);bctx.clip();
    brokenFill(bctx,bx0,horizon-bh,bx0+bw,horizon,col,Math.floor(bw*bh/240),0.6,16,0.16,0.4);
    var litEdge=lerpHsl(col,L.hor,0.5);
    brokenFill(bctx,bx0+bw*0.6,horizon-bh,bx0+bw,horizon,litEdge,Math.floor(bw*bh/2600),0.6,14,0.14,0.3);
    bctx.restore();
    /* 屋顶受光缘 */
    var lit=lerpHsl(col,L.hor,0.35+L.warm*0.3);
    brokenFill(bctx,bx0,horizon-bh-2,bx0+bw,horizon-bh+4,lit,Math.floor(bw/7),0,8,0.3,0.6);
  }
  /* 中：街道立面阴影（蓝紫系，绝不黑灰） */
  var shade=lerpHsl(C.ombre,L.top,0.25);
  bctx.fillStyle=hsla(shade[0],shade[1],shade[2]*0.8,1);
  bctx.fillRect(0,horizon,W,H-horizon);
  brokenFill(bctx,0,horizon,W,H,shade,Math.floor(W*H/950),1.5,22,0.16,0.38);
  /* 湿的街面：竖向反光碎色 */
  var refl=lerpHsl(L.hor,C.ombre,0.35);
  brokenFill(bctx,0,horizon+4,W,H,refl,Math.floor(W*H/750),1.5708,30,0.14,0.36);
  /* 中：店铺暖窗（点彩金光） */
  for(i=0;i<shops.length;i++){
    var s=shops[i];
    var sx=s.x*W,sw=s.w*W,sy=s.y*H,sh=H*0.16;
    var glowAmt=(0.25+L.lamp*0.75)*s.glow;
    /* 窗洞：夜是亮光源，昼是暗洞；低 alpha 收形 + 点彩破边 */
    var holeL=lerp(14,52,L.lamp),hole=lerpHsl(C.ocre,C.or,L.lamp*0.6);
    bctx.fillStyle=hsla(hole[0],hole[1]*0.7,holeL,0.55);
    bctx.fillRect(sx,sy,sw,sh);
    brokenFill(bctx,sx,sy,sx+sw,sy+sh,hole,Math.floor(sw*sh/300),0.9,12,0.2,0.45);
    /* 暖光点彩：金与蜜光交替 */
    stipple(bctx,sx+sw/2,sy+sh/2,Math.min(sw,sh)*0.7,C.or,C.miel,0.10*glowAmt+0.006,1,2.4);
    /* 光晕渗出窗框 */
    if(glowAmt>0.3)stipple(bctx,sx+sw/2,sy+sh/2,Math.min(sw,sh)*1.15,C.or,C.ambre,0.02*glowAmt,1,2.6);
    /* 窗内人影（一两个剪影） */
    if(rnd()<0.6){
      bctx.fillStyle=hsla(C.ocre[0],30,12,0.75);
      var fx=sx+sw*(0.3+rnd()*0.4);
      bctx.fillRect(fx,sy+sh*0.35,sw*0.09,sh*0.65);
      bctx.beginPath();bctx.arc(fx+sw*0.045,sy+sh*0.28,sw*0.05,0,6.29);bctx.fill();
    }
    /* 街面反光 */
    stipple(bctx,sx+sw/2,horizon+(H-horizon)*0.35,sw*0.4,C.or,C.ambre,0.014*glowAmt,1,2.2);
  }
  /* 近：街灯（左三分线，非对称主体） */
  for(i=0;i<lamps.length;i++){
    var lp=lamps[i];
    var lx=lp.x*W,ltop=H*(0.62-lp.h),lbase=H*0.88;
    bctx.strokeStyle=hsla(C.ombre[0],C.ombre[1],C.ombre[2]*0.55,0.95);
    bctx.lineWidth=3;
    bctx.beginPath();bctx.moveTo(lx,lbase);bctx.lineTo(lx,ltop);bctx.stroke();
    bctx.beginPath();bctx.moveTo(lx,ltop);bctx.quadraticCurveTo(lx+14,ltop-8,lx+20,ltop+2);bctx.stroke();
    var lampGlow=0.2+L.lamp*0.8;
    stipple(bctx,lx+20,ltop+4,H*0.055*lampGlow+4,C.miel,C.or,0.10*lampGlow+0.006,0.9,2.2);
    if(lampGlow>0.3)stipple(bctx,lx+20,ltop+4,H*0.12*lampGlow,C.or,C.ambre,0.014*lampGlow,1,2.8);
    /* 灯光在湿街的拉光 */
    if(lampGlow>0.3){
      var rg=bctx.createLinearGradient(0,horizon,0,H*0.98);
      rg.addColorStop(0,hsla(C.or[0],C.or[1],C.or[2],0.22*lampGlow));
      rg.addColorStop(1,hsla(C.or[0],C.or[1],C.or[2],0));
      bctx.fillStyle=rg;
      bctx.fillRect(lx+8,horizon,26,H*0.36);
    }
  }
  cacheDirty=false;
}

/* ---------- 纸纹 ---------- */
var paper=document.createElement('canvas');
function buildPaper(){
  paper.width=Math.max(2,Math.floor(W/2));paper.height=Math.max(2,Math.floor(H/2));
  var p=paper.getContext('2d');
  p.clearRect(0,0,paper.width,paper.height);
  for(var i=0;i<4200;i++){
    p.fillStyle='rgba('+(Math.random()<0.5?'255,255,255':'0,0,0')+','+R(0.02,0.06).toFixed(3)+')';
    p.fillRect(R(0,paper.width),R(0,paper.height),R(0.5,1.8),R(0.5,1.8));
  }
  for(var f=0;f<60;f++){
    p.strokeStyle='rgba(255,255,255,'+R(0.008,0.02).toFixed(3)+')';
    p.lineWidth=R(0.3,0.8);
    var x=R(0,paper.width),y=R(0,paper.height),a=R(0,6.28),Ln=R(20,90);
    p.beginPath();p.moveTo(x,y);p.lineTo(x+Math.cos(a)*Ln,y+Math.sin(a)*Ln);p.stroke();
  }
}

/* ---------- 雾气（雾色随 heure：夜的雾是蓝灰的暗，不是白纱） ---------- */
var fogCol=[220,10,75];
function fogStr(a){return hsla(fogCol[0],fogCol[1],fogCol[2],a);}
function seedFog(){
  fctx.setTransform(dpr,0,0,dpr,0,0);
  fctx.clearRect(0,0,W,H);
  fctx.fillStyle=fogStr(.22);
  fctx.fillRect(0,0,W,H);
  for(var i=0;i<260;i++){
    fctx.fillStyle=fogStr(R(.015,.06));
    fctx.beginPath();fctx.arc(R(0,W),R(0,H),R(6,42),0,6.29);fctx.fill();
  }
  tctx.setTransform(dpr,0,0,dpr,0,0);
  tctx.clearRect(0,0,W,H);
}

/* ---------- 雨滴 ---------- */
var drops=[],statics=[];
function spawnStatic(x,y,r){
  statics.push({x:x!==undefined?x:R(0,W),y:y!==undefined?y:R(0,H),r:r!==undefined?r:R(.5,1.6),grow:R(.002,.011)});
}
function spawnRunner(x,y,r,big){
  drops.push({x:x!==undefined?x:R(0,W),y:y!==undefined?y:R(-20,-4),
    r:r!==undefined?r:R(2.2,4.6)*(big?1.5:1),vy:0,wob:R(0,6.28),wobF:R(1.2,3.2)});
}
function wipeAt(px,py,rad,amt){
  fctx.globalCompositeOperation='destination-out';
  var g=fctx.createRadialGradient(px,py,0,px,py,rad);
  g.addColorStop(0,'rgba(0,0,0,'+amt+')');g.addColorStop(1,'rgba(0,0,0,0)');
  fctx.fillStyle=g;
  fctx.beginPath();fctx.arc(px,py,rad,0,6.29);fctx.fill();
}

var holding=false,holdT=0;
function update(dt){
  var rainEff=clamp(P.rain+gust*1.4,0,2.2);
  if(Math.random()<.22+P.fogAmt*.45&&statics.length<520)spawnStatic();
  if(Math.random()<rainEff*.5)spawnRunner(undefined,undefined,undefined,gust>0.3);
  var i,d,s;
  for(i=statics.length-1;i>=0;i--){
    s=statics[i];
    s.r+=s.grow*(0.5+rainEff);
    if(s.r>R(2.4,3.6)){
      statics.splice(i,1);
      drops.push({x:s.x,y:s.y,r:s.r,vy:R(.1,.5),wob:R(0,6.28),wobF:R(1.2,3)});
    }
  }
  for(i=drops.length-1;i>=0;i--){
    d=drops[i];
    d.vy=Math.min(d.vy+d.r*.09*dt*(1+gust),1.1+d.r*.55+gust*2.2);
    d.wob+=d.wobF*.02*dt;
    d.x+=Math.sin(d.wob)*.5*(1.4/d.r)+gust*0.7;   /* 骤雨带风斜 */
    d.y+=d.vy*dt;
    for(var j=statics.length-1;j>=0;j--){
      s=statics[j];
      var dx=s.x-d.x,dy=s.y-d.y;
      if(dx*dx+dy*dy<d.r*d.r*1.15){
        d.r=Math.min(d.r+s.r*.16,7);d.vy*=.985;statics.splice(j,1);
      }
    }
    if(Math.random()<.5)spawnStatic(d.x+R(-1,1),d.y-d.r*R(.6,1.6),R(.35,d.r*.22));
    /* 真雨痕： runners 在玻璃上留下慢慢淡去的水道 */
    tctx.globalCompositeOperation='source-over';
    tctx.strokeStyle='rgba(222,230,238,'+(0.05+gust*0.04)+')';
    tctx.lineWidth=Math.max(1,d.r*0.5);
    tctx.beginPath();tctx.moveTo(d.x,d.y-d.r*1.2);tctx.lineTo(d.x,d.y+d.vy*3);tctx.stroke();
    /* 骤雨时雨滴冲开雾气 */
    if(gust>0.25)wipeAt(d.x,d.y,d.r*3.2,0.10);
    if(d.y>H+20)drops.splice(i,1);
  }
  /* 雨痕缓慢干涸 */
  tctx.globalCompositeOperation='destination-out';
  tctx.fillStyle='rgba(0,0,0,0.006)';
  tctx.fillRect(0,0,W,H);
  /* 雾气重新凝结 */
  if(frameN%2===0){
    fctx.globalCompositeOperation='source-over';
    fctx.fillStyle=fogStr((0.0012+P.fogAmt*.0035)*(1-gust*0.7));
    fctx.fillRect(0,0,W,H);
  }
}

/* ---------- 一滴雨：倒折街景 ---------- */
function drawDrop(d){
  var r=d.r;
  if(r<1.9){
    ctx.fillStyle='rgba(40,50,62,.42)';
    ctx.beginPath();ctx.arc(d.x,d.y,r,0,6.29);ctx.fill();
    ctx.fillStyle='rgba(248,242,228,.72)';
    ctx.beginPath();ctx.arc(d.x-r*.3,d.y-r*.34,Math.max(.5,r*.3),0,6.29);ctx.fill();
    return;
  }
  ctx.save();
  ctx.beginPath();ctx.arc(d.x,d.y,r,0,6.29);ctx.clip();
  var k=1.7;
  ctx.drawImage(bg,(d.x-r*k)*dpr,(d.y-r*k)*dpr,2*r*k*dpr,2*r*k*dpr,d.x-r,d.y+r,2*r,-2*r);
  ctx.restore();
  ctx.strokeStyle='rgba(244,236,222,.30)';ctx.lineWidth=.8;
  ctx.beginPath();ctx.arc(d.x,d.y,r-.4,0,6.29);ctx.stroke();
  ctx.strokeStyle='rgba(248,242,228,.55)';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(d.x,d.y,r*.62,-2.4,-1.1);ctx.stroke();
  ctx.strokeStyle='rgba(46,56,68,.35)';
  ctx.beginPath();ctx.arc(d.x,d.y,r*.86,.5,2.2);ctx.stroke();
}

/* ---------- 声音：雨 + 水滴（默认 OFF） ---------- */
var AC=null,master=null,rainGain=null,soundOn=false;
function initAudio(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=0;master.connect(AC.destination);
  var len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
  var src=AC.createBufferSource();src.buffer=buf;src.loop=true;
  var hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=1200;
  var lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=6800;
  rainGain=AC.createGain();rainGain.gain.value=0.05;
  src.connect(hp);hp.connect(lp);lp.connect(rainGain);rainGain.connect(master);src.start();
}
function drip(){
  if(!AC||!soundOn)return;
  var o=AC.createOscillator(),g=AC.createGain(),now=AC.currentTime;
  o.type='sine';
  o.frequency.setValueAtTime(R(1400,1900),now);
  o.frequency.exponentialRampToValueAtTime(R(500,700),now+0.04);
  g.gain.setValueAtTime(0.0,now);
  g.gain.linearRampToValueAtTime(R(0.015,0.05),now+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001,now+0.09);
  o.connect(g);g.connect(master);o.start(now);o.stop(now+0.1);
}
var sndBtn=document.getElementById('sndBtn');
function setSound(on){
  soundOn=on;sndBtn.classList.toggle('on',on);
  try{localStorage.setItem('atelier-mira-sound',on?'1':'0');}catch(e){}
  if(on&&!AC)initAudio();
  if(AC){if(AC.state==='suspended')AC.resume();
    var now=AC.currentTime;master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(master.gain.value,now);
    master.gain.linearRampToValueAtTime(on?0.8:0,now+(on?1.5:0.4));}
}
sndBtn.addEventListener('click',function(){setSound(!soundOn);});
try{if(localStorage.getItem('atelier-mira-sound')==='1'){
  soundOn=true;sndBtn.classList.add('on');
  var arm=function(){setSound(true);window.removeEventListener('pointerdown',arm);};
  window.addEventListener('pointerdown',arm);}}catch(e){}

/* ---------- 指针 ---------- */
var pdown=null,wiped=false;
function toLocal(e){return {x:e.clientX,y:e.clientY};}
cv.addEventListener('pointerdown',function(e){
  cv.setPointerCapture(e.pointerId);
  pdown=toLocal(e);wiped=false;holding=true;holdT=0;
});
cv.addEventListener('pointermove',function(e){
  if(!pdown)return;
  var p=toLocal(e);
  if(Math.hypot(p.x-pdown.x,p.y-pdown.y)>7){wiped=true;holding=false;}
  if(wiped){
    var steps=Math.ceil(Math.hypot(p.x-pdown.x,p.y-pdown.y)/8)||1;
    for(var i=1;i<=steps;i++)wipeAt(pdown.x+(p.x-pdown.x)*i/steps,pdown.y+(p.y-pdown.y)*i/steps,30,0.55);
    pdown=p;
  }
});
cv.addEventListener('pointerup',function(e){
  var p=toLocal(e);
  if(!wiped&&holdT<0.4){spawnRunner(p.x,p.y,R(4.5,6.5));wipeAt(p.x,p.y,46,0.55);drip();}
  pdown=null;holding=false;
});
window.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT')return;
  if(e.key==='h'||e.key==='H')togglePanel();
  if(e.key==='1')applyEtude('brume');if(e.key==='2')applyEtude('soir');if(e.key==='3')applyEtude('averse');
});

/* ---------- 控件 ---------- */
var oRain=document.getElementById('oRain'),oFog=document.getElementById('oFog'),oHeure=document.getElementById('oHeure');
document.getElementById('sRain').addEventListener('input',function(){P.rain=+this.value/100;oRain.textContent=this.value+'%';markCustom();});
document.getElementById('sFog').addEventListener('input',function(){P.fogAmt=+this.value/100;oFog.textContent=this.value+'%';markCustom();});
var sHeure=document.getElementById('sHeure');
sHeure.addEventListener('input',function(){heureTarget=+this.value;heureAuto=false;});
document.getElementById('bNow').addEventListener('click',function(){heureAuto=true;});
document.getElementById('bScene').addEventListener('click',function(){
  seed=Math.random()*999;buildStreet();buildPaper();cacheDirty=true;
});
document.getElementById('bDown').addEventListener('click',function(){
  var a=document.createElement('a');a.download='atelier-mira-n026-rain-window.png';
  a.href=cv.toDataURL('image/png');a.click();
});
var etudeBtns=document.querySelectorAll('#etudes button');
function markCustom(){etudeBtns.forEach(function(b){b.classList.remove('on');});}
function applyEtude(name){
  var e=ETUDES[name];if(!e)return;
  P.rain=e.rain;P.fogAmt=e.fog;heureTarget=e.h;heureAuto=false;
  document.getElementById('sRain').value=e.rain*100;document.getElementById('sFog').value=e.fog*100;
  oRain.textContent=Math.round(e.rain*100)+'%';oFog.textContent=Math.round(e.fog*100)+'%';
  etudeBtns.forEach(function(b){b.classList.toggle('on',b.dataset.e===name);});
}
etudeBtns.forEach(function(b){b.addEventListener('click',function(){applyEtude(b.dataset.e);});});

var panel=document.getElementById('panel'),paneltab=document.getElementById('paneltab'),panelHidden=false;
function togglePanel(){
  panelHidden=!panelHidden;
  panel.classList.toggle('hidden',panelHidden);
  paneltab.classList.toggle('show',panelHidden);
}
paneltab.addEventListener('click',togglePanel);

var colClicks=0,colTimer=null;
document.getElementById('colophon').addEventListener('click',function(){
  colClicks++;clearTimeout(colTimer);
  colTimer=setTimeout(function(){colClicks=0;},900);
  if(colClicks>=3){document.getElementById('secret').classList.toggle('show');colClicks=0;}
});

/* ---------- 尺寸 ---------- */
function size(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  [cv,bg,fog,trl].forEach(function(c){c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);});
  ctx.setTransform(dpr,0,0,dpr,0,0);
  seedFog();buildPaper();cacheDirty=true;
}
window.addEventListener('resize',size);

/* ---------- 主循环 ---------- */
var grainTick=0;
function fmtHeure(h){
  var hh=Math.floor(h)%24,mm=Math.floor((h%1)*60);
  return (hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;
}
function frame(){
  t+=0.016;frameN++;
  /* heure 缓动 */
  if(heureAuto)heureTarget=(new Date().getHours())+(new Date().getMinutes())/60;
  var dh=heureTarget-heure;
  if(Math.abs(dh)>0.0005){heure+=dh*0.06;cacheDirty=true;}
  sHeure.value=heure;oHeure.textContent=fmtHeure(heure);
  /* 骤雨：按住积蓄，松手余势 */
  if(holding){holdT+=0.016;if(holdT>0.4)gustV=Math.min(gustV+0.03,1);}
  gustV*=holding?1:0.94;
  gust+=(gustV-gust)*0.08;
  /* 雨声随雨强 */
  if(AC&&soundOn)rainGain.gain.value=0.03+P.rain*0.05+gust*0.12;
  if(Math.random()<P.rain*0.05+gust*0.2)drip();

  var L=lightAt(((heure%24)+24)%24);
  /* 雾色 = 天光向白一步：夜的雾是蓝灰的暗 */
  fogCol=lerpHsl(L.top,[220,8,88],0.30+L.sun*0.35);
  if(cacheDirty)rebuildStreet(L);

  ctx.clearRect(0,0,W,H);
  ctx.drawImage(bg,0,0,W,H);
  update(Math.min(3,1));
  ctx.drawImage(trl,0,0,W,H);
  ctx.drawImage(fog,0,0,W,H);
  for(var i=0;i<statics.length;i++)drawDrop(statics[i]);
  for(i=0;i<drops.length;i++)drawDrop(drops[i]);

  /* 全局色温：暮光暖罩 / 夜蓝罩（有色的暗） */
  var warmK=L.warm*0.5+0.15;
  ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=0.22*warmK;
  ctx.fillStyle=hsla(C.ambre[0],C.ambre[1],C.ambre[2],1);ctx.fillRect(0,0,W,H);ctx.restore();
  if(L.lamp>0.5){
    ctx.save();ctx.globalCompositeOperation='multiply';ctx.globalAlpha=(L.lamp-0.5)*0.24;
    ctx.fillStyle=hsla(C.ombre[0],C.ombre[1],C.ombre[2],1);ctx.fillRect(0,0,W,H);ctx.restore();
  }

  /* 纸纹 */
  ctx.save();ctx.globalAlpha=0.4;ctx.globalCompositeOperation='overlay';
  ctx.drawImage(paper,0,0,W,H);ctx.restore();
  /* 颗粒 12fps */
  grainTick++;
  if(grainTick%5===0){
    ctx.save();ctx.globalAlpha=0.05;
    for(var gN=0;gN<380;gN++){
      ctx.fillStyle=Math.random()<0.5?'#fff':'#000';
      ctx.fillRect(Math.random()*W,Math.random()*H,1.2,1.2);
    }
    ctx.restore();
  }
  /* 窗框暗角（蓝紫的暗） */
  var vg=ctx.createRadialGradient(W/2,H*0.46,H*0.3,W/2,H*0.46,W*0.72);
  vg.addColorStop(0,hsla(222,18,20,0));vg.addColorStop(1,hsla(222,18,20,0.5));
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);

  requestAnimationFrame(frame);
}

size();buildStreet();
for(var bi=0;bi<220;bi++)spawnStatic();
if(window.innerWidth<700){panel.classList.add('notrans');togglePanel();requestAnimationFrame(function(){panel.classList.remove('notrans');});}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
