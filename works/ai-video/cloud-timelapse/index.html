<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>云的延时 · Cloud Timelapse — Atelier MIRA N°031</title>
<!--
  调色板家族：② 金色时刻 Heure Dorée（暖，≈3200K）
  #F4E3C2 蜜光 · #E8B96F 金 · #D98E4A 琥珀 · #A85B3C 焦赭 · #5E6E7E 阴影补色蓝
  铁律执行：受光面走金→琥珀，阴影全部落在补色蓝 #5E6E7E 一族，无黑灰阴影。
  结构：WebGL 画天（域扭曲云）+ Canvas 2D 画麦田（碎色笔触）+ 纸纹颗粒。
-->
<style>
:root{
  --miel:#F4E3C2; --or:#E8B96F; --ambre:#D98E4A; --ocre:#A85B3C; --ombre:#5E6E7E;
  --ink:#3A332A;
  --serif:Didot,"Bodoni MT",Georgia,"Songti SC",serif;
  --mono:"SF Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC",sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#2B3550;color:var(--miel);font-family:var(--sans);overflow:hidden}
::selection{background:var(--or);color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#fg{pointer-events:none}
#gl{touch-action:none}

.nameplate{position:fixed;top:26px;left:30px;pointer-events:none;text-shadow:0 1px 14px rgba(58,51,42,.45)}
.nameplate .no{font-family:var(--mono);font-size:10px;letter-spacing:.22em;opacity:.75}
.nameplate h1{font-family:var(--serif);font-weight:400;font-size:clamp(24px,3.2vw,38px);letter-spacing:.02em;margin-top:7px;color:#FBF3DF}
.nameplate h1 em{font-style:italic;color:var(--or)}
.nameplate .epig{font-family:var(--serif);font-style:italic;font-size:14.5px;opacity:.85;margin-top:8px;max-width:320px;line-height:1.6}
.nameplate .coord{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;opacity:.55;margin-top:10px}

.colophon{position:fixed;left:30px;bottom:22px;display:flex;align-items:center;gap:9px;pointer-events:auto;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;opacity:.66;text-shadow:0 1px 8px rgba(58,51,42,.5);cursor:pointer;user-select:none;color:#F4E9D2}
.colophon:hover{opacity:.92}
.secret{position:fixed;left:30px;bottom:48px;max-width:300px;font-family:var(--serif);font-style:italic;font-size:14px;line-height:1.7;
  color:#FBF3DF;opacity:0;transform:translateY(6px);transition:all .8s var(--ease);pointer-events:none;text-shadow:0 1px 10px rgba(58,51,42,.6)}
.secret.show{opacity:.92;transform:translateY(0)}

.topright{position:fixed;top:26px;right:30px;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.sndbtn{width:34px;height:34px;border:1px solid rgba(244,227,194,.45);background:rgba(58,51,42,.3);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s var(--ease);color:var(--miel)}
.sndbtn:hover{border-color:var(--or)}
.sndbtn.on{background:rgba(232,185,111,.22);border-color:var(--or)}
.sndbtn svg{stroke:var(--miel)}
.hintline{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;opacity:.6;text-align:right;line-height:1.9;pointer-events:none;text-shadow:0 1px 8px rgba(58,51,42,.5)}

.clockbig{position:fixed;top:122px;right:30px;text-align:right;pointer-events:none;text-shadow:0 1px 12px rgba(58,51,42,.4)}
.clockbig b{font-family:var(--serif);font-weight:400;font-size:clamp(20px,2.4vw,30px);display:block;color:#FBF3DF}
.clockbig span{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;opacity:.65}

.panel{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:calc(100vw - 28px);
  background:rgba(58,51,42,.55);backdrop-filter:blur(12px);border:1px solid rgba(244,227,194,.28);
  padding:13px 20px 14px;transition:all .5s var(--ease)}
.panel.hidden{transform:translateX(-50%) translateY(14px);opacity:0;pointer-events:none}
.panel.noanim,.paneltab.noanim{transition:none}
.panel .prow{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;justify-content:center}
.ctl{display:flex;flex-direction:column;gap:7px}
.ctl label{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:rgba(244,227,194,.68);display:flex;justify-content:space-between;gap:12px}
.ctl label output{color:var(--or)}
input[type=range]{-webkit-appearance:none;appearance:none;width:110px;height:18px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:rgba(244,227,194,.45)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:10px;height:10px;margin-top:-4.5px;background:#3A332A;border:1px solid var(--or);border-radius:50%}
input[type=range]::-webkit-slider-thumb:hover{background:var(--or)}
input[type=range]::-moz-range-track{height:1px;background:rgba(244,227,194,.45)}
input[type=range]::-moz-range-thumb{width:9px;height:9px;background:#3A332A;border:1px solid var(--or);border-radius:50%}
input[type=range].timerule::-webkit-slider-runnable-track{height:5px;border-radius:3px;
  background:linear-gradient(90deg,#2B3550 0%,#5E6E7E 20%,#F4E3C2 38%,#E8B96F 55%,#D98E4A 72%,#A85B3C 82%,#2B3550 100%)}
input[type=range].timerule::-moz-range-track{height:5px;border-radius:3px;
  background:linear-gradient(90deg,#2B3550 0%,#5E6E7E 20%,#F4E3C2 38%,#E8B96F 55%,#D98E4A 72%,#A85B3C 82%,#2B3550 100%)}
.etudes{display:flex;gap:6px;flex-wrap:wrap}
.etudes button,.act{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;padding:8px 11px;
  background:transparent;color:var(--miel);border:1px solid rgba(244,227,194,.4);cursor:pointer;transition:all .25s var(--ease)}
.etudes button:hover,.act:hover{border-color:var(--or);color:var(--or)}
.etudes button.on{background:rgba(232,185,111,.2);border-color:var(--or);color:var(--or)}
.paneltab{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);font-family:var(--mono);font-size:9px;letter-spacing:.18em;
  text-transform:uppercase;color:rgba(244,227,194,.65);border:1px solid rgba(244,227,194,.35);background:rgba(58,51,42,.5);
  padding:7px 14px;cursor:pointer;opacity:0;pointer-events:none;transition:all .5s var(--ease)}
.paneltab.show{opacity:1;pointer-events:auto}
.paneltab:hover{color:var(--or);border-color:var(--or)}

@media(max-width:700px){
  .nameplate{top:18px;left:18px}
  .nameplate .epig{font-size:13px;max-width:230px}
  .topright{top:18px;right:18px}
  .hintline{display:none}
  .clockbig{top:auto;bottom:64px;right:18px;text-align:right}
  .colophon{left:18px;bottom:16px;font-size:9px}
  .panel{bottom:14px;padding:11px 12px;width:calc(100vw - 24px);max-height:44vh;overflow-y:auto}
  .panel .prow{gap:10px;justify-content:flex-start}
  input[type=range]{width:82px}
  .etudes button,.act{padding:7px 9px}
  .paneltab{bottom:44px}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="fg"></canvas>

<div class="nameplate">
  <div class="no">N°031 · AI·VIDEO</div>
  <h1>云的<em>延时</em> · Cloud Timelapse</h1>
  <div class="epig">我们画的不是云，是云影走过的麦田。</div>
  <div class="coord">49.4°N 0.9°E · 诺曼底的下午</div>
</div>

<div class="clockbig"><b id="clockTime">—</b><span>heure · 本地光</span></div>

<div class="topright">
  <div class="sndbtn" id="sndBtn" title="环境声（默认关闭）" role="button" aria-label="toggle sound">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke-width="1.3" stroke-linecap="round">
      <path d="M2 6.5v3h2.5L8 12.5v-9L4.5 6.5H2z" fill="currentColor" stroke="none" opacity=".85"/>
      <path class="w1" d="M10.5 5.5c1.4 1.4 1.4 3.6 0 5"/>
      <path class="w2" d="M12.5 3.5c2.6 2.6 2.6 6.4 0 9"/>
    </svg>
  </div>
  <div class="hintline">拖动 · 起一阵风<br>滚动 / 按住 · 时间流动<br>H 收起画具</div>
</div>

<div class="colophon" id="colophon">
  <svg width="22" height="14" viewBox="0 0 64 40" fill="#F4E3C2" aria-hidden="true">
    <path d="M32 20 C 26 12, 14 6, 4 8 C 12 12, 18 18, 24 21
             C 14 20, 6 22, 2 28 C 10 26, 18 26, 25 26
             C 27 30, 30 34, 34 36 C 33 32, 33 28, 34 25
             C 42 22, 52 16, 62 4 C 54 10, 44 16, 36 19
             C 35 17, 33 17, 32 20 Z"/>
  </svg>
  <span>Atelier MIRA · N°031 · 金色时刻 Heure Dorée</span>
</div>
<div class="secret" id="secret">看云看了太久，<br>影子从脚边走到了河对岸。<br>农夫收工的时候，光正好。</div>

<div class="panel" id="panel">
  <div class="prow">
    <div class="etudes" id="etudes">
      <button data-e="matin">清晨</button><button data-e="midi">正午</button><button data-e="doree" class="on">金暮</button><button data-e="nuit">入夜</button>
    </div>
    <div class="etudes" id="meteo">
      <button data-m="clair" class="on">晴</button><button data-m="brume">雾</button><button data-m="pluie">雨</button>
    </div>
    <div class="ctl"><label>风 Vent <output id="oWind">1.0×</output></label>
      <input type="range" id="sWind" min="0" max="3" step="0.05" value="1"></div>
    <div class="ctl"><label>云量 Couvert <output id="oCover">62%</output></label>
      <input type="range" id="sCover" min="0.05" max="1" step="0.01" value="0.62"></div>
    <div class="ctl"><label>时刻 Heure <output id="oHeure">—</output></label>
      <input type="range" id="sHeure" class="timerule" min="0" max="24" step="0.05" value="18"></div>
    <button class="act" id="bNow">此刻</button>
    <button class="act" id="bRegen">换一片天 ↻</button>
    <button class="act" id="bDown">收下这片天</button>
  </div>
</div>
<div class="paneltab" id="paneltab">画具 · H</div>

<script>
(function(){
"use strict";
/* ================================================================
   云的延时 — 金色时刻写生
   WebGL 天空 + 2D 麦田碎色 + heure 时间 + 天气 + WebAudio 声景
   ================================================================ */
var glcv=document.getElementById('gl');
var fg=document.getElementById('fg'),fx=fg.getContext('2d');
var W=0,H=0,dpr=1,t=0,frameN=0;
var seed=Math.random()*999;
function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
function R(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,k){return a+(b-a)*k;}

/* ---------- HSL 工具（canvas 只认 rgb 字符串） ---------- */
function hex2hsl(hex){
  var r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  var mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,h=0,s=0;
  if(mx!==mn){var d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);
    if(mx===r)h=((g-b)/d+(g<b?6:0));else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;}
  return [h,s*100,l*100];
}
function hsl2rgb(h,s,l){
  h=((h%360)+360)%360;s=clamp(s,0,100)/100;l=clamp(l,0,100)/100;
  var c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2,r=0,g=0,b=0;
  if(h<60){r=c;g=x;}else if(h<120){r=x;g=c;}else if(h<180){g=c;b=x;}
  else if(h<240){g=x;b=c;}else if(h<300){r=x;b=c;}else{r=c;b=x;}
  return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)];
}
function rgb(h,s,l){var c=hsl2rgb(h,s,l);return 'rgb('+c[0]+','+c[1]+','+c[2]+')';}
function rgba(h,s,l,a){var c=hsl2rgb(h,s,l);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function lerpHsl(c1,c2,k){
  var dh=c2[0]-c1[0];if(dh>180)dh-=360;if(dh<-180)dh+=360;
  return [c1[0]+dh*k,lerp(c1[1],c2[1],k),lerp(c1[2],c2[2],k)];
}
var FAM={miel:hex2hsl('#F4E3C2'),or:hex2hsl('#E8B96F'),ambre:hex2hsl('#D98E4A'),ocre:hex2hsl('#A85B3C'),ombre:hex2hsl('#5E6E7E')};

/* ---------- heure 光系统 ---------- */
function lightAt(h){
  var K=[
    [0.0, {zen:[233,26,15],hor:[232,22,22],clit:[232,18,30],csha:[235,22,12],sun:[45,60,60],sunI:0.0, star:1.0,fl:0.16}],
    [4.5, {zen:[233,26,15],hor:[232,22,22],clit:[232,18,30],csha:[235,22,12],sun:[45,60,60],sunI:0.0, star:1.0,fl:0.16}],
    [6.0, {zen:[224,16,46],hor:[38,35,68], clit:[42,40,80], csha:[222,18,44],sun:[38,70,62], sunI:0.55,star:0.25,fl:0.45}],
    [8.0, {zen:[216,20,60],hor:[46,28,76], clit:[46,32,86], csha:[214,16,52],sun:[45,65,70], sunI:0.8, star:0.0,fl:0.68}],
    [12.0,{zen:[213,24,64],hor:[50,20,84], clit:[48,18,92], csha:[212,14,56],sun:[48,45,80], sunI:1.0, star:0.0,fl:0.85}],
    [16.0,{zen:[215,22,60],hor:[44,26,78], clit:[44,30,88], csha:[213,15,52],sun:[42,60,68], sunI:0.9, star:0.0,fl:0.8}],
    [17.6,{zen:[218,20,52],hor:[38,42,70], clit:[40,52,82], csha:[216,16,46],sun:[38,72,62], sunI:0.95,star:0.0,fl:0.9}],
    [18.8,{zen:[222,18,44],hor:[32,55,62], clit:[35,62,74], csha:[218,18,40],sun:[30,80,58], sunI:1.0, star:0.05,fl:1.0}],
    [19.8,{zen:[226,20,34],hor:[24,48,48], clit:[22,50,60], csha:[222,22,32],sun:[20,72,50], sunI:0.7, star:0.2,fl:0.6}],
    [21.0,{zen:[230,24,20],hor:[228,22,28],clit:[230,20,36],csha:[232,24,16],sun:[45,60,60],sunI:0.1, star:0.7,fl:0.25}],
    [24.0,{zen:[233,26,15],hor:[232,22,22],clit:[232,18,30],csha:[235,22,12],sun:[45,60,60],sunI:0.0, star:1.0,fl:0.16}]
  ];
  for(var i=0;i<K.length-1;i++){
    if(h>=K[i][0]&&h<=K[i+1][0]){
      var k=(h-K[i][0])/(K[i+1][0]-K[i][0]);k=k*k*(3-2*k);
      var A=K[i][1],B=K[i+1][1],o={};
      ['zen','hor','clit','csha','sun'].forEach(function(f){o[f]=lerpHsl(A[f],B[f],k);});
      ['sunI','star','fl'].forEach(function(f){o[f]=lerp(A[f],B[f],k);});
      return o;
    }
  }
  return K[0][1];
}
var heure=(new Date().getHours())+(new Date().getMinutes())/60;
var heureTarget=heure,heureAuto=true;
try{var hm=location.hash.match(/h=([0-9.]+)/);
  if(hm){heure=parseFloat(hm[1])%24;heureTarget=heure;heureAuto=false;}}catch(e){}
var goldenArmed=true;

/* ---------- 状态 ---------- */
var wind=1,cover=0.62,meteo='clair';
var haze=0.12,rain=0;
var gust=0,gustV=0,tmx=0.5,dragging=false,holdT=0;

/* ---------- WebGL 天空 ---------- */
var gl=glcv.getContext('webgl',{antialias:false,preserveDrawingBuffer:true});
var VERT='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
var FRAG=[
'precision highp float;',
'uniform vec2 u_res;uniform float u_time,u_wind,u_cover,u_seed,u_haze,u_rain;',
'uniform vec3 u_zen,u_hor,u_clit,u_csha,u_sunc;uniform vec2 u_sunpos;uniform float u_suni;',
'float hash(vec2 p){p=fract(p*vec2(123.34,456.21)+u_seed*17.7);p+=dot(p,p+45.32);return fract(p.x*p.y);}',
'float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);',
' float a=hash(i),b=hash(i+vec2(1.,0.)),c=hash(i+vec2(0.,1.)),d=hash(i+vec2(1.,1.));',
' return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}',
'float fbm(vec2 p){float v=0.,a=.5;mat2 r=mat2(1.6,1.2,-1.2,1.6);',
' for(int i=0;i<5;i++){v+=a*noise(p);p=r*p;a*=.5;}return v;}',
'void main(){',
' vec2 uv=gl_FragCoord.xy/u_res;',
' float asp=u_res.x/u_res.y;',
' vec2 p=vec2(uv.x*asp,uv.y);',
' float tm=u_time*(.10+.5*u_wind);',
' vec2 q=vec2(fbm(p*1.35+vec2(0.,tm*.35)),fbm(p*1.35+vec2(5.2,tm*.28)));',
' vec2 r=vec2(fbm(p*1.35+2.1*q+vec2(1.7+tm*.9,9.2)),fbm(p*1.35+2.1*q+vec2(8.3,2.8-tm*.7)));',
' float f=fbm(p*1.35+2.3*r);',
' vec3 sky=mix(u_hor,u_zen,pow(clamp(uv.y,0.,1.),.72));',
' sky+=(q.x-.5)*.05;',
' vec2 sun=u_sunpos;',
' float sd=distance(vec2(uv.x*asp,uv.y),sun);',
' sky+=u_sunc*pow(max(0.,1.-sd),5.)*.55*u_suni;',
' sky+=u_sunc*pow(max(0.,1.-sd),26.)*.9*u_suni;',
' float th=1.05-u_cover*.95;',
' float cl=smoothstep(th,th+.5,f);',
' vec2 tosun=normalize(sun-vec2(uv.x*asp,uv.y)+.001);',
' float f2=fbm(p*1.35+2.3*r+tosun*.14);',
' float lit=clamp((f-f2)*7.+.42,0.,1.);',
' vec3 cloud=mix(u_csha,u_clit,lit);',
' vec3 col=mix(sky,cloud,cl*.94);',
' col=mix(col,u_hor,pow(1.-uv.y,5.)*.45);',
' col=mix(col,(u_zen+u_hor)*.5,u_haze*.35);',
' col=mix(col,vec3(.58,.6,.62),u_rain*.18);',
' float vig=1.-.26*pow(distance(uv,vec2(.5,.55)),2.2);',
' col*=vig;',
' gl_FragColor=vec4(col,1.);}'
].join('\n');
var U={};
function initGL(){
  function sh(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){throw new Error(gl.getShaderInfoLog(s));}return s;}
  var prog=gl.createProgram();
  gl.attachShader(prog,sh(gl.VERTEX_SHADER,VERT));
  gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FRAG));
  gl.linkProgram(prog);gl.useProgram(prog);
  var buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  var loc=gl.getAttribLocation(prog,'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  ['u_res','u_time','u_wind','u_cover','u_seed','u_haze','u_rain','u_zen','u_hor','u_clit','u_csha','u_sunc','u_sunpos','u_suni']
    .forEach(function(n){U[n]=gl.getUniformLocation(prog,n);});
}
function v3(hsl){var c=hsl2rgb(hsl[0],hsl[1],hsl[2]);return [c[0]/255,c[1]/255,c[2]/255];}

/* ---------- 麦田（2D 碎色，heure 改变时重画缓存） ---------- */
var field=document.createElement('canvas'),fdx=field.getContext('2d');
var fieldDirty=true;
var HORIZON=0.60;
function buildField(L){
  field.width=W*dpr;field.height=H*dpr;fdx.setTransform(dpr,0,0,dpr,0,0);
  var hy=H*HORIZON;
  fdx.clearRect(0,0,W,H);
  /* 远处树线：蓝灰剪影（不跨色轮混色） */
  var treeBase=[212,15,clamp(L.hor[2]*0.40+6,8,60)];
  fdx.beginPath();fdx.moveTo(0,hy+2);
  for(var x=0;x<=W;x+=14){
    var ty=hy-3-Math.abs(Math.sin(x*0.021+seed)*5+Math.sin(x*0.007+seed*2)*7)-rnd()*3;
    fdx.lineTo(x,ty);
  }
  fdx.lineTo(W,hy+2);fdx.closePath();
  fdx.fillStyle=rgba(treeBase[0],treeBase[1],treeBase[2],0.85);fdx.fill();
  /* 麦田基底：先铺一层暖调，笔触叠在上面 */
  var litCol=L.clit, shaCol=lerpHsl(FAM.ombre,L.csha,0.4);
  var baseG=fdx.createLinearGradient(0,hy,0,H);
  baseG.addColorStop(0,rgba(FAM.ambre[0],FAM.ambre[1]*0.5,clamp(FAM.ambre[2]*L.fl*0.9+8,0,100),1));
  baseG.addColorStop(1,rgba(FAM.ocre[0],FAM.ocre[1]*0.45,clamp(FAM.ocre[2]*L.fl*1.05,0,100),1));
  fdx.fillStyle=baseG;fdx.fillRect(0,hy,W,H-hy);
  /* 碎色笔触：近水平的短划，云影成团 */
  var sunElev=Math.sin(Math.PI*clamp((heure-6)/14,0,1));
  var shaP=0.30+0.30*(1-sunElev);
  var duskK=0.70+0.30*sunElev;
  var rows=30;
  for(var r2=0;r2<rows;r2++){
    var k=r2/rows;
    var y=hy+6+Math.pow(k,1.55)*(H-hy-6);
    var rowH=1.6+k*k*9;
    var n=Math.floor(W/(10-k*5.5));
    for(var i=0;i<n;i++){
      var sx=rnd()*W;
      var ln=(5+k*12)*R(0.7,1.5);
      var ang=R(-0.2,0.2);
      var field_=Math.sin(sx*0.006+seed*3+y*0.011)+Math.sin(sx*0.017-y*0.005+seed);
      var useShadow=field_>(1.6-shaP*2.4);
      var base=useShadow?shaCol:lerpHsl(litCol,FAM.or,0.3);
      var hh=base[0]+R(-7,7),ss=(base[1]*(useShadow?0.8:1)+(1-sunElev)*8)+R(-5,5);
      var ll=useShadow?base[2]*L.fl*0.86*duskK+R(-4,4):base[2]*L.fl*duskK+R(-4,4);
      fdx.strokeStyle=rgba(hh,ss,ll,R(0.55,0.85));
      fdx.lineWidth=Math.max(0.9,rowH*R(0.45,0.85));
      fdx.beginPath();fdx.moveTo(sx,y);
      fdx.lineTo(sx+Math.cos(ang)*ln,y+Math.sin(ang)*ln*0.35);
      fdx.stroke();
    }
  }
  /* 麦芒亮尖：点彩 */
  for(var d=0;d<W*1.2;d++){
    var dx=rnd()*W,dy=hy+8+Math.pow(rnd(),1.4)*(H-hy-8);
    var kk=(dy-hy)/(H-hy);
    fdx.fillStyle=rgba(FAM.miel[0],FAM.miel[1],clamp(FAM.miel[2]*L.fl+8,0,100),R(0.2,0.55)*kk);
    fdx.fillRect(dx,dy,R(1,2.4),R(1,2));
  }
  /* 入夜：树线下三两盏村灯（夜的点光源） */
  if(L.star>0.3){
    var lamps=4;
    for(var li=0;li<lamps;li++){
      var lx=W*(0.18+li*0.21+((seed*7+li*13)%10)/40),ly=hy+4+rnd()*6;
      var lg=fdx.createRadialGradient(lx,ly,0,lx,ly,14);
      lg.addColorStop(0,rgba(FAM.or[0],FAM.or[1],FAM.or[2],0.8*L.star));
      lg.addColorStop(1,rgba(FAM.or[0],FAM.or[1],FAM.or[2],0));
      fdx.fillStyle=lg;fdx.beginPath();fdx.arc(lx,ly,14,0,6.29);fdx.fill();
      fdx.fillStyle=rgba(FAM.miel[0],FAM.miel[1],FAM.miel[2],0.9*L.star);
      fdx.fillRect(lx-0.8,ly-0.8,1.8,1.8);
    }
  }
  fieldDirty=false;
}

/* ---------- 纸纹 ---------- */
var paper=document.createElement('canvas');
function buildPaper(){
  paper.width=Math.max(2,Math.floor(W/2));paper.height=Math.max(2,Math.floor(H/2));
  var p=paper.getContext('2d');
  for(var i=0;i<4200;i++){
    p.fillStyle='rgba('+(rnd()<0.5?'255,255,255':'0,0,0')+','+R(0.02,0.06).toFixed(3)+')';
    p.fillRect(rnd()*paper.width,rnd()*paper.height,R(0.5,1.8),R(0.5,1.8));
  }
  for(var f=0;f<50;f++){
    p.strokeStyle='rgba(255,255,255,'+R(0.008,0.02).toFixed(3)+')';
    p.lineWidth=R(0.3,0.8);
    var x=rnd()*paper.width,y=rnd()*paper.height,a=rnd()*6.28,Ln=R(20,90);
    p.beginPath();p.moveTo(x,y);p.lineTo(x+Math.cos(a)*Ln,y+Math.sin(a)*Ln);p.stroke();
  }
}

/* ---------- 动态 2D 层 ---------- */
var stars=[];
function buildStars(){
  stars=[];var n=Math.floor(W*H/5200);
  for(var i=0;i<n;i++)stars.push({x:rnd()*W,y:rnd()*H*0.55,r:0.4+rnd()*0.9,ph:rnd()*6.28,sp:R(0.4,1.6)});
}
var rainDrops=[];
function drawDynamic(L){
  fx.clearRect(0,0,W,H);
  fx.drawImage(field,0,0,W,H);
  if(L.star>0.03){
    for(var i=0;i<stars.length;i++){
      var s=stars[i];
      var a=(0.3+0.7*Math.abs(Math.sin(t*s.sp+s.ph)))*L.star;
      fx.fillStyle=rgba(48,16,88,a*0.95);
      fx.fillRect(s.x,s.y,s.r,s.r);
    }
  }
  var hy=H*HORIZON;
  var fl=L.fl;
  /* 云影：三团软影在麦田上漂移 */
  for(var c=0;c<3;c++){
    var cx=(((t*(8+wind*14)*(0.6+c*0.35)+c*W*0.7)%(W*1.6))-W*0.3);
    var cy=hy+H*0.16+c*H*0.09;
    var g=fx.createRadialGradient(cx,cy,10,cx,cy,W*0.16);
    g.addColorStop(0,rgba(FAM.ombre[0],FAM.ombre[1],FAM.ombre[2],0.24*cover));
    g.addColorStop(1,rgba(FAM.ombre[0],FAM.ombre[1],FAM.ombre[2],0));
    fx.save();fx.translate(cx,cy);fx.scale(1.9,0.42);fx.translate(-cx,-cy);
    fx.fillStyle=g;fx.beginPath();fx.arc(cx,cy,W*0.16,0,6.29);fx.fill();fx.restore();
  }
  /* 麦浪高光 */
  var swayN=Math.floor(W/6);
  for(var w=0;w<swayN;w++){
    var wx2=(w/swayN)*W;
    var ph=Math.sin(t*(1.2+wind*0.8)+wx2*0.012+w*0.7);
    if(ph>0.55){
      var wy=hy+10+((w*97)%100)/100*(H-hy-16);
      fx.strokeStyle=rgba(FAM.miel[0],FAM.miel[1],clamp(FAM.miel[2]*fl+6,0,100),(ph-0.55)*0.5);
      fx.lineWidth=1.1;
      fx.beginPath();fx.moveTo(wx2,wy);fx.lineTo(wx2+6+wind*4,wy+2);fx.stroke();
    }
  }
  /* 雨 */
  if(rain>0.02){
    var want=Math.floor(rain*160);
    while(rainDrops.length<want)rainDrops.push({x:R(0,W),y:R(-H,0),sp:R(9,16)});
    rainDrops.length=Math.min(rainDrops.length,want);
    fx.strokeStyle=rgba(FAM.ombre[0],FAM.ombre[1]-6,FAM.ombre[2]+22,0.5);
    fx.lineWidth=1;
    var slant=2+wind*3;
    for(var d2=0;d2<rainDrops.length;d2++){
      var dp=rainDrops[d2];
      dp.y+=dp.sp;dp.x+=slant*0.4;
      if(dp.y>H){dp.y=-10;dp.x=R(0,W);}
      fx.beginPath();fx.moveTo(dp.x,dp.y);fx.lineTo(dp.x-slant,dp.y+R(10,18));fx.stroke();
    }
  }
  /* 纸纹 */
  fx.save();fx.globalAlpha=0.42;fx.globalCompositeOperation='overlay';
  fx.drawImage(paper,0,0,W,H);fx.restore();
  /* 颗粒 12fps */
  if(frameN%5===0){
    fx.save();fx.globalAlpha=0.045;
    for(var g2=0;g2<380;g2++){
      fx.fillStyle=Math.random()<0.5?'#fff':'#000';
      fx.fillRect(Math.random()*W,Math.random()*H,1.2,1.2);
    }
    fx.restore();
  }
}

/* ---------- 声景 ---------- */
var AC=null,master=null,windGain=null,windBP=null,rainGain=null,soundOn=false;
function initAudio(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=0;master.connect(AC.destination);
  var len=AC.sampleRate*3,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0),last=0;
  for(var i=0;i<len;i++){var w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.2;}
  var src=AC.createBufferSource();src.buffer=buf;src.loop=true;
  windBP=AC.createBiquadFilter();windBP.type='bandpass';windBP.frequency.value=560;windBP.Q.value=1;
  windGain=AC.createGain();windGain.gain.value=0.06;
  src.connect(windBP);windBP.connect(windGain);windGain.connect(master);src.start();
  var wbuf=AC.createBuffer(1,len,AC.sampleRate),wd=wbuf.getChannelData(0);
  for(var j=0;j<len;j++)wd[j]=Math.random()*2-1;
  var wsrc=AC.createBufferSource();wsrc.buffer=wbuf;wsrc.loop=true;
  var hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=1200;
  rainGain=AC.createGain();rainGain.gain.value=0;
  wsrc.connect(hp);hp.connect(rainGain);rainGain.connect(master);wsrc.start();
}
function birdChirp(){
  if(!AC||!soundOn)return;
  var now=AC.currentTime;
  var o=AC.createOscillator(),m=AC.createOscillator(),mg=AC.createGain(),g=AC.createGain();
  var f0=R(2400,3200);
  o.frequency.setValueAtTime(f0,now);
  o.frequency.exponentialRampToValueAtTime(f0*R(1.1,1.35),now+0.08);
  m.frequency.value=R(80,160);mg.gain.value=f0*R(0.2,0.5);
  m.connect(mg);mg.connect(o.frequency);
  g.gain.setValueAtTime(0,now);
  g.gain.linearRampToValueAtTime(0.028,now+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,now+R(0.2,0.4));
  o.connect(g);g.connect(master);
  o.start(now);m.start(now);o.stop(now+0.5);m.stop(now+0.5);
}
function droplet(){
  if(!AC||!soundOn)return;
  var now=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.frequency.setValueAtTime(R(1500,1900),now);
  o.frequency.exponentialRampToValueAtTime(600,now+0.04);
  g.gain.setValueAtTime(0.015,now);
  g.gain.exponentialRampToValueAtTime(0.0001,now+0.05);
  o.connect(g);g.connect(master);o.start(now);o.stop(now+0.06);
}
function pianoCluster(){
  if(!AC||!soundOn)return;
  var scale=[261.6,293.7,329.6,392,440,523.3];
  var now=AC.currentTime,n=2+Math.floor(Math.random()*2);
  var pick=[];
  while(pick.length<n){var f=scale[Math.floor(Math.random()*scale.length)];
    if(pick.indexOf(f)<0)pick.push(f);}
  pick.forEach(function(f,i){
    [f,f*1.003].forEach(function(ff){
      var o=AC.createOscillator(),g=AC.createGain();
      o.type='sine';o.frequency.value=ff;
      var st=now+i*0.14;
      g.gain.setValueAtTime(0,st);
      g.gain.linearRampToValueAtTime(0.05,st+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001,st+R(3,6));
      o.connect(g);g.connect(master);o.start(st);o.stop(st+6.5);
    });
  });
}
var sndBtn=document.getElementById('sndBtn');
function setSound(on){
  soundOn=on;sndBtn.classList.toggle('on',on);
  try{localStorage.setItem('atelier-mira-sound',on?'1':'0');}catch(e){}
  if(on&&!AC)initAudio();
  if(AC){if(AC.state==='suspended')AC.resume();
    var now=AC.currentTime;master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(master.gain.value,now);
    master.gain.linearRampToValueAtTime(on?0.8:0,now+(on?1.5:0.4));}
}
sndBtn.addEventListener('click',function(){setSound(!soundOn);});
try{if(localStorage.getItem('atelier-mira-sound')==='1'){
  soundOn=true;sndBtn.classList.add('on');
  var arm=function(){setSound(true);window.removeEventListener('pointerdown',arm);};
  window.addEventListener('pointerdown',arm);}}catch(e){}

/* ---------- 交互 ---------- */
glcv.addEventListener('pointermove',function(e){
  var nx=e.clientX/window.innerWidth;
  gustV+=(nx-tmx)*8;
  if(dragging)wind=clamp(wind+(nx-tmx)*0.4,0,3);
  tmx=nx;
});
glcv.addEventListener('pointerdown',function(e){
  dragging=true;holdT=0;tmx=e.clientX/window.innerWidth;
  gustV+=0.9;
});
window.addEventListener('pointerup',function(){dragging=false;});
window.addEventListener('wheel',function(e){
  heureAuto=false;heureTarget=((heureTarget+e.deltaY*0.0035)%24+24)%24;
  e.preventDefault();
},{passive:false});
window.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT')return;
  if(e.key==='h'||e.key==='H')togglePanel();
  if(e.key==='1')applyEtude('matin');if(e.key==='2')applyEtude('midi');
  if(e.key==='3')applyEtude('doree');if(e.key==='4')applyEtude('nuit');
});

/* ---------- 控件 ---------- */
var ETUDES={matin:{h:6.5},midi:{h:12.5},doree:{h:18.6},nuit:{h:22.5}};
var oWind=document.getElementById('oWind'),oCover=document.getElementById('oCover'),oHeure=document.getElementById('oHeure');
var sHeure=document.getElementById('sHeure');
document.getElementById('sWind').addEventListener('input',function(){
  wind=+this.value;oWind.textContent=wind.toFixed(1)+'×';});
document.getElementById('sCover').addEventListener('input',function(){
  cover=+this.value;oCover.textContent=Math.round(cover*100)+'%';});
sHeure.addEventListener('input',function(){heureTarget=+this.value;heureAuto=false;});
document.getElementById('bNow').addEventListener('click',function(){heureAuto=true;});
document.getElementById('bRegen').addEventListener('click',function(){
  seed=Math.random()*999;buildStars();buildPaper();fieldDirty=true;});
document.getElementById('bDown').addEventListener('click',function(){
  var out=document.createElement('canvas');out.width=glcv.width;out.height=glcv.height;
  var o=out.getContext('2d');
  o.drawImage(glcv,0,0);o.drawImage(fg,0,0);
  var a=document.createElement('a');a.download='atelier-mira-n031-heure-doree.png';
  a.href=out.toDataURL('image/png');a.click();});
var etudeBtns=document.querySelectorAll('#etudes button');
function applyEtude(name){
  var e=ETUDES[name];if(!e)return;
  heureAuto=false;heureTarget=e.h;
  etudeBtns.forEach(function(b){b.classList.toggle('on',b.dataset.e===name);});
}
etudeBtns.forEach(function(b){b.addEventListener('click',function(){applyEtude(b.dataset.e);});});
var meteoBtns=document.querySelectorAll('#meteo button');
function applyMeteo(m){
  meteo=m;
  meteoBtns.forEach(function(b){b.classList.toggle('on',b.dataset.m===m);});
}
meteoBtns.forEach(function(b){b.addEventListener('click',function(){applyMeteo(b.dataset.m);});});

var panel=document.getElementById('panel'),paneltab=document.getElementById('paneltab'),panelHidden=false;
function togglePanel(){
  panelHidden=!panelHidden;
  panel.classList.toggle('hidden',panelHidden);
  paneltab.classList.toggle('show',panelHidden);
}
paneltab.addEventListener('click',togglePanel);

var colClicks=0,colTimer=null;
document.getElementById('colophon').addEventListener('click',function(){
  colClicks++;clearTimeout(colTimer);
  colTimer=setTimeout(function(){colClicks=0;},900);
  if(colClicks>=3){document.getElementById('secret').classList.toggle('show');colClicks=0;}
});

/* ---------- 尺寸 ---------- */
function size(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  glcv.width=Math.round(W*dpr);glcv.height=Math.round(H*dpr);
  fg.width=Math.round(W*dpr);fg.height=Math.round(H*dpr);
  fx.setTransform(dpr,0,0,dpr,0,0);
  if(gl)gl.viewport(0,0,glcv.width,glcv.height);
  buildStars();buildPaper();fieldDirty=true;
}
window.addEventListener('resize',size);

/* ---------- 主循环 ---------- */
var birdTimer=2,dropTimer=0;
function fmtHeure(h){
  var hh=Math.floor(h)%24,mm=Math.floor((h%1)*60);
  return (hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;
}
function frame(){
  t+=0.016;frameN++;
  if(dragging){holdT+=0.016;if(holdT>0.4){heureAuto=false;heureTarget=(heureTarget+0.03)%24;}}
  if(heureAuto)heureTarget=(new Date().getHours())+(new Date().getMinutes())/60;
  var dh=heureTarget-heure;
  if(Math.abs(dh)>0.0004){heure+=dh*0.06;fieldDirty=true;}
  sHeure.value=heure;
  var hs=fmtHeure(heure);
  oHeure.textContent=hs;document.getElementById('clockTime').textContent=hs;
  gustV*=0.94;gust+=gustV;gust*=0.95;
  var windEff=clamp(wind+gust*0.6,0,3.4);
  var hazeT=meteo==='brume'?0.75:(meteo==='pluie'?0.35:0.12);
  var rainT=meteo==='pluie'?1:0;
  haze+=(hazeT-haze)*0.02;rain+=(rainT-rain)*0.03;
  var coverEff=meteo==='pluie'?Math.max(cover,0.8):(meteo==='brume'?Math.min(cover,0.4):cover);

  var L=lightAt(((heure%24)+24)%24);

  var golden=heure>17.2&&heure<19.6;
  if(golden&&goldenArmed){goldenArmed=false;pianoCluster();}
  if(!golden)goldenArmed=true;

  gl.uniform2f(U.u_res,glcv.width,glcv.height);
  gl.uniform1f(U.u_time,t);
  gl.uniform1f(U.u_wind,windEff);
  gl.uniform1f(U.u_cover,coverEff);
  gl.uniform1f(U.u_seed,seed%100);
  gl.uniform1f(U.u_haze,haze);
  gl.uniform1f(U.u_rain,rain);
  var z=v3(L.zen),hz=v3(L.hor),cl=v3(L.clit),cs=v3(L.csha),su=v3(L.sun);
  gl.uniform3f(U.u_zen,z[0],z[1],z[2]);
  gl.uniform3f(U.u_hor,hz[0],hz[1],hz[2]);
  gl.uniform3f(U.u_clit,cl[0],cl[1],cl[2]);
  gl.uniform3f(U.u_csha,cs[0],cs[1],cs[2]);
  gl.uniform3f(U.u_sunc,su[0],su[1],su[2]);
  var sx=(heure-6)/14,asp=W/H;
  var sunX=(0.28+0.5*clamp(sx,0,1))*asp;
  var sunY=0.40+0.42*Math.sin(Math.PI*clamp(sx,0,1));
  gl.uniform2f(U.u_sunpos,sunX,sunY);
  gl.uniform1f(U.u_suni,L.sunI*(heure>5.5&&heure<20.5?1:0));
  gl.drawArrays(gl.TRIANGLES,0,3);

  if(fieldDirty)buildField(L);
  drawDynamic(L);

  if(AC&&soundOn){
    windGain.gain.value=0.03+windEff*0.035+gust*0.02;
    windBP.frequency.value=480+windEff*160+Math.sin(t*0.4)*90;
    rainGain.gain.value=rain*0.05;
    birdTimer-=0.016;
    if(birdTimer<0){birdTimer=R(2,9);
      if(heure>5.5&&heure<20&&meteo!=='pluie'&&rain<0.2)birdChirp();}
    dropTimer-=0.016;
    if(dropTimer<0){dropTimer=R(0.05,0.3);if(rain>0.4)droplet();}
  }

  requestAnimationFrame(frame);
}

if(gl){
  initGL();size();
  if(window.innerWidth<700){
    panel.classList.add('noanim');paneltab.classList.add('noanim');
    togglePanel();
    setTimeout(function(){panel.classList.remove('noanim');paneltab.classList.remove('noanim');},60);
  }
  requestAnimationFrame(frame);
}else{
  document.body.insertAdjacentHTML('beforeend','<p style="position:fixed;top:50%;width:100%;text-align:center;font-family:monospace">WebGL unavailable.</p>');
}
})();
</script>
