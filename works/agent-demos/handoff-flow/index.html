<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handoff Flow — 多 Agent 交接潮汐图 · Atelier MIRA N°072 · 潮汐</title>
<!--
  Atelier MIRA · Étude N°072 · 潮汐 MARÉE（诺曼底海岸）
  家族锚点：#E3E0D5 贝壳白 · #B5C2C4 浅滩 · #7E9399 海水 · #4F666E 深潮 · #C8B89A 湿沙 · #D97B5A 浮标锈红
  五位 Agent 是浅滩上的五座栈桥灯桩，消息是潮沟里奔跑的水。
  剧本走到哪，潮就涨到哪里；DELIVER 一刻，万灯皆明。
-->
<style>
  :root{
    --ink:#3F525A; --dim:#71858C; --paper:rgba(227,224,213,.9); --paper-solid:#E3E0D5;
    --line:rgba(79,102,110,.30); --accent:#C45538; --accent-soft:rgba(196,85,56,.12);
    --mono:"SF Mono",Menlo,Consolas,monospace;
    --serif:Didot,"Bodoni MT",Georgia,"Songti SC",serif;
    --sans:-apple-system,"Helvetica Neue","PingFang SC",sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body.booted *{transition:none!important}
  html,body{height:100%}
  body{background:#B5C2C4;color:var(--ink);font-family:var(--sans);overflow:hidden;
       -webkit-font-smoothing:antialiased}
  ::selection{background:var(--accent-soft)}
  button{font-family:inherit;color:inherit}
  canvas#sea{position:fixed;inset:0;width:100%;height:100%;display:block}

  header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:flex-start;
         gap:14px;padding:16px 22px 28px;pointer-events:none;
         background:linear-gradient(rgba(227,224,213,.6),rgba(227,224,213,0))}
  .seal{flex:0 0 auto;pointer-events:auto;opacity:.92}
  .etitle{padding-top:1px}
  .etitle .no{font-family:var(--mono);font-size:9.5px;letter-spacing:.26em;color:var(--accent)}
  .etitle h1{font-family:var(--serif);font-weight:400;font-size:22px;letter-spacing:.02em;margin-top:2px}
  .etitle h1 span{font-family:var(--sans);font-size:12.5px;color:var(--dim);margin-left:9px;letter-spacing:.06em}
  .etitle .epig{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--dim);
                margin-top:4px;letter-spacing:.04em}
  .hdr-right{margin-left:auto;display:flex;gap:8px;align-items:flex-start;pointer-events:auto}
  #scen{display:flex;border:1px solid var(--line);background:var(--paper);backdrop-filter:blur(8px);flex-wrap:wrap}
  #scen button{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--dim);
               background:transparent;border:0;padding:9px 11px;cursor:pointer;transition:all .3s var(--ease)}
  #scen button:hover{color:var(--ink)}
  #scen button.on{color:var(--paper-solid);background:var(--accent)}
  #snd{width:34px;height:34px;border:1px solid var(--line);background:var(--paper);
       backdrop-filter:blur(8px);cursor:pointer;display:flex;align-items:center;justify-content:center;
       transition:border-color .3s var(--ease);flex:0 0 auto}
  #snd:hover{border-color:var(--accent)}
  #snd svg{stroke:var(--dim);transition:stroke .3s}
  #snd.on svg{stroke:var(--accent)}
  #snd .waves{opacity:0;transition:opacity .4s}
  #snd.on .waves{opacity:1}

  /* 潮汐表 */
  #log{position:fixed;right:22px;top:126px;bottom:150px;width:296px;z-index:10;overflow-y:auto;
       background:var(--paper);border:1px solid var(--line);backdrop-filter:blur(10px);
       transition:transform .5s var(--ease),opacity .5s var(--ease)}
  body.hideui #log{transform:translateX(120%);opacity:0;pointer-events:none}
  .phead{position:sticky;top:0;background:var(--paper);padding:10px 13px 8px;border-bottom:1px solid var(--line);
         font-family:var(--mono);font-size:8.5px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase;
         display:flex;justify-content:space-between;z-index:2}
  .ev{padding:7px 13px;border-bottom:1px dashed var(--line);cursor:pointer;display:flex;gap:9px;
      opacity:.38;transition:opacity .4s,background .25s}
  .ev.done{opacity:1}
  .ev.now{background:var(--accent-soft)}
  .ev:hover{background:var(--accent-soft)}
  .ev .no2{font-family:var(--mono);font-size:8px;color:var(--dim);margin-top:2px;flex:0 0 18px}
  .ev .ty{font-family:var(--mono);font-size:8px;letter-spacing:.1em;padding:2px 5px;border:1px solid var(--line);
          color:var(--dim);flex:0 0 auto;height:fit-content;margin-top:1px}
  .ev .ty.handoff,.ev .ty.final{color:var(--accent);border-color:var(--accent)}
  .ev .lb{font-size:11px;line-height:1.45}
  .ev .rt{font-family:var(--mono);font-size:8px;color:var(--dim);margin-top:2px;letter-spacing:.06em}

  /* 事件详情 */
  #detail{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.96);z-index:12;
          width:min(420px,calc(100vw - 40px));background:var(--paper);border:1px solid var(--line);
          backdrop-filter:blur(12px);padding:18px 20px;opacity:0;pointer-events:none;
          transition:all .4s var(--ease)}
  #detail.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
  #detail .dh{display:flex;align-items:baseline;gap:9px;margin-bottom:8px}
  #detail .dt{font-family:var(--serif);font-size:19px}
  #detail .dx{margin-left:auto;cursor:pointer;color:var(--dim);font-family:var(--mono)}
  #detail .dx:hover{color:var(--accent)}
  #detail .dd{font-size:12.5px;line-height:1.75;color:var(--ink);margin-bottom:10px}
  #detail .dp{font-family:var(--mono);font-size:9px;line-height:1.7;color:var(--dim);
              border-top:1px dashed var(--line);padding-top:9px;white-space:pre-wrap}

  /* Transport：潮位计 */
  #transport{position:fixed;left:22px;bottom:64px;z-index:10;width:min(400px,calc(100vw - 360px));
             min-width:270px;background:var(--paper);border:1px solid var(--line);
             backdrop-filter:blur(10px);padding:11px 14px 12px;
             transition:transform .5s var(--ease),opacity .5s var(--ease)}
  body.hideui #transport{transform:translateY(20px);opacity:0;pointer-events:none}
  #transport .trow{display:flex;gap:7px;align-items:center}
  .tbtn{width:34px;height:30px;border:1px solid var(--line);background:transparent;cursor:pointer;
        display:flex;align-items:center;justify-content:center;transition:all .25s var(--ease)}
  .tbtn:hover{border-color:var(--accent)}
  .tbtn svg{stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .tbtn:hover svg{stroke:var(--accent)}
  #steplab{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--dim);margin-left:5px}
  #speedlab{font-family:var(--mono);font-size:9.5px;color:var(--accent);margin-left:auto;font-variant-numeric:tabular-nums}
  #gauge{position:relative;height:34px;margin-top:9px;cursor:ew-resize;touch-action:none}
  #gauge canvas{width:100%;height:100%;display:block}
  #gaugetip{position:absolute;top:-2px;width:1.5px;height:38px;background:var(--accent);pointer-events:none}

  /* time ruler */
  #timer{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:10;
         width:min(400px,52vw);background:var(--paper);border:1px solid var(--line);
         backdrop-filter:blur(10px);padding:8px 14px 10px;cursor:ew-resize;user-select:none;
         transition:opacity .5s var(--ease)}
  body.hideui #timer{opacity:0;pointer-events:none}
  #timer .face{position:relative;height:16px}
  #timer .track{position:absolute;left:0;right:0;top:8px;height:1px;background:var(--line)}
  #timer .tick{position:absolute;top:5px;width:1px;height:7px;background:var(--line)}
  #timer .sun{position:absolute;top:1px;width:14px;height:14px;margin-left:-7px;border-radius:50%;
      border:1.5px solid var(--accent);background:var(--paper-solid);pointer-events:none}
  #timer .sun::after{content:"";position:absolute;inset:3.5px;border-radius:50%;background:var(--accent);opacity:.85}
  #timer .lab{display:flex;justify-content:space-between;margin-top:5px;
      font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:var(--dim)}
  #timer .lab b{color:var(--accent);font-weight:400;font-variant-numeric:tabular-nums}

  #colo{position:fixed;right:22px;bottom:14px;z-index:10;display:flex;align-items:center;gap:8px;
        font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--ink);opacity:.68;cursor:pointer;
        transition:opacity .5s var(--ease)}
  #note{position:fixed;right:22px;bottom:44px;z-index:11;width:240px;background:var(--paper);
        border:1px solid var(--line);backdrop-filter:blur(10px);padding:12px 14px;
        font-family:var(--serif);font-style:italic;font-size:13px;line-height:1.7;color:var(--ink);
        opacity:0;transform:translateY(8px);pointer-events:none;transition:all .6s var(--ease)}
  #note.show{opacity:1;transform:none}
  #uibtn{position:fixed;left:22px;bottom:14px;z-index:10;font-family:var(--mono);font-size:9px;
         letter-spacing:.14em;color:var(--dim);background:var(--paper);border:1px solid var(--line);
         padding:6px 10px;cursor:pointer;backdrop-filter:blur(8px)}
  #uibtn:hover{color:var(--accent);border-color:var(--accent)}

  @media (max-width:760px){
    header{padding:12px 14px 20px;gap:10px}
    .seal svg{width:38px;height:38px}
    .etitle h1{font-size:16px}
    .etitle h1 span{font-size:11px}
    .etitle .epig{font-size:12px;max-width:50vw}
    .hdr-right{flex-wrap:wrap;justify-content:flex-end;max-width:46vw}
    #scen button{font-size:9px;padding:7px 8px}
    #log{right:14px;top:118px;bottom:auto;max-height:34vh;width:min(296px,calc(100vw - 28px))}
    #transport{left:14px;bottom:104px;width:calc(100vw - 28px);min-width:0}
    #timer{width:calc(100vw - 110px);bottom:52px}
    body.hideui #timer{opacity:1;pointer-events:auto}
    #timer .lab span:last-child{display:none}
    #colo{right:14px;bottom:12px;font-size:8px}
    #uibtn{left:14px;bottom:12px}
  }
</style>
</head>
<body>

<header>
  <div class="seal">
    <svg width="50" height="50" viewBox="0 0 52 52" aria-label="Atelier MIRA seal">
      <circle cx="26" cy="26" r="24.6" fill="none" stroke="#C45538" stroke-width="1"/>
      <circle cx="26" cy="26" r="14.2" fill="none" stroke="#C45538" stroke-width=".55" opacity=".55"/>
      <path d="M18.4 33.4 V20.1 L25.9 29.9 L33.7 20.4 V33.1" fill="none" stroke="#C45538"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="etitle">
    <div class="no">ÉTUDE N°072 · AGENT-DEMOS</div>
    <h1>Handoff Flow<span>交接潮汐图</span></h1>
    <div class="epig">「潮水退去的地方，沙子记得每一次交接。」</div>
  </div>
  <div class="hdr-right">
    <div id="scen" role="group" aria-label="Scénario"></div>
    <button id="snd" aria-label="环境声开关" title="环境声（默认关闭）">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke-width="1.3" stroke-linecap="round">
        <path d="M2 6.5v3h2.4L8 12.6V3.4L4.4 6.5H2z"/>
        <path class="waves" d="M10.2 5.2a4 4 0 0 1 0 5.6M12 3.4a6.4 6.4 0 0 1 0 9.2"/>

    </button>

</header>

<canvas id="sea"></canvas>

<aside id="log" aria-label="Table des marées">
  <div class="phead"><span>TIDE TABLE · 潮汐表</span><span id="evcount">—</span></div>

</aside>

<div id="detail" role="dialog">
  <div class="dh"><span class="dt" id="d-t">—</span><span class="dx" id="d-x">×</span></div>

</div>

<section id="transport" aria-label="Transport">
  <div class="trow">
    <button class="tbtn" id="b-prev" title="上一拍 (←)"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M8 2L4 6l4 4M4 6h7"/></svg></button>
    <button class="tbtn" id="b-play" title="播放/暂停 (空格)"><svg width="12" height="12" viewBox="0 0 12 12" id="playico"><path d="M3.5 2.2v7.6L10 6z"/></svg></button>
    <button class="tbtn" id="b-next" title="下一拍 (→)"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M4 2l4 4-4 4M1 6h7"/></svg></button>
    <button class="tbtn" id="b-re" title="退回初潮"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 6a3.5 3.5 0 1 1 1 2.5M2.5 6V3.5M2.5 6H5"/></svg></button>
    <span id="steplab">STEP 0 / 14</span>
    <span id="speedlab">1.0×</span>
  </div>
  <div id="gauge" title="潮位计：拖动刮擦时间"><canvas id="gaugec"></canvas><div id="gaugetip"></div></div>
</section>

<div id="timer" aria-label="时间轴">
  <div class="face" id="timerface">
    <div class="track"></div>
    <div class="sun" id="sundot"></div>
  </div>
  <div class="lab"><span id="t-phase">午后 MARÉE</span><b id="t-clock">15:00</b><span>光的时间 · 拖动</span></div>
</div>

<button id="uibtn" title="收起/展开面板 (H)">H · 面板</button>

<div id="note">灯桩之间不交谈，灯桩只把光交给水。水到的那天，远岸就懂了。——画室手记 N°072</div>

<footer id="colo">
  <svg width="22" height="14" viewBox="0 0 64 40" fill="#4F666E" aria-hidden="true">
    <path d="M32 20 C 26 12, 14 6, 4 8 C 12 12, 18 18, 24 21
             C 14 20, 6 22, 2 28 C 10 26, 18 26, 25 26
             C 27 30, 30 34, 34 36 C 33 32, 33 28, 34 25
             C 42 22, 52 16, 62 4 C 54 10, 44 16, 36 19
             C 35 17, 33 17, 32 20 Z"/>
  </svg>
  <span>ATELIER MIRA · N°072 · 潮汐 MARÉE</span>
</footer>

<script>
"use strict";
const $=id=>document.getElementById(id);
const canvas=$("sea"),ctx=canvas.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  sizeGauge();}
addEventListener("resize",resize);

/* ================= seed & hash ================= */
const hashParams=new URLSearchParams(location.hash.slice(1));
let seed=parseInt(hashParams.get("seed"),10);
if(!Number.isFinite(seed))seed=(Math.random()*8999+1000)|0;
let heure=hashParams.get("h")!==null?+hashParams.get("h"):(new Date().getHours()+new Date().getMinutes()/60);
if(!Number.isFinite(heure)||heure<0||heure>24)heure=15;
let scenId=["weekly","release","research"].includes(hashParams.get("s"))?hashParams.get("s"):"weekly";
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function writeHash(){
  history.replaceState(null,"","#"+new URLSearchParams({seed:String(seed),h:heure.toFixed(1),s:scenId}).toString());
}

/* ================= colour helpers ================= */
function hx(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function rgb2hsl(c){const[r,g,b]=c.map(v=>v/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
  let h=0,s=0;const l=(mx+mn)/2;const d=mx-mn;
  if(d){s=d/(1-Math.abs(2*l-1));if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}
  return[h,s,l]}
function hsl2rgb(h,s,l){const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;
  let r,g,b;if(h<60){r=c;g=x;b=0}else if(h<120){r=x;g=c;b=0}else if(h<180){r=0;g=c;b=x}
  else if(h<240){r=0;g=x;b=c}else if(h<300){r=x;g=0;b=c}else{r=c;g=0;b=x}
  return[Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)]}
function lerpHSL(a,b,k){const A=rgb2hsl(a),B=rgb2hsl(b);let dh=B[0]-A[0];
  if(dh>180)dh-=360;if(dh<-180)dh+=360;
  return hsl2rgb(A[0]+dh*k,A[1]+(B[1]-A[1])*k,A[2]+(B[2]-A[2])*k)}
function fade(col,target,k){const A=rgb2hsl(col),B=rgb2hsl(target);
  return hsl2rgb(A[0],A[1]+(B[1]-A[1])*k*.8,A[2]+(B[2]-A[2])*k)}
const rgb=(c,a)=>a===undefined?`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`:`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

/* ================= 潮汐家族 + heure ================= */
const FAM={coquille:hx("#E3E0D5"),plat:hx("#B5C2C4"),mer:hx("#7E9399"),prof:hx("#4F666E"),
           sable:hx("#C8B89A"),rouille:hx("#D97B5A")};
const KEYS=[
  {h:0,   sky:hx("#4F666E"),hor:hx("#6E828A"),far:hx("#5E747C"),near:hx("#6E7A72"),warm:.15},
  {h:5,   sky:hx("#7E8C96"),hor:hx("#B8AE9E"),far:hx("#86969C"),near:hx("#968E7C"),warm:.3},
  {h:7,   sky:hx("#A6B6C0"),hor:hx("#E0D8C4"),far:hx("#A0B4B8"),near:hx("#B0A888"),warm:.5},
  {h:10,  sky:hx("#A2B8C2"),hor:hx("#E6E2D4"),far:hx("#ACC0C2"),near:hx("#BEB18E"),warm:.35},
  {h:13,  sky:hx("#9CB4C0"),hor:hx("#EAE6DA"),far:hx("#B5C2C4"),near:hx("#C4B490"),warm:.3},
  {h:16,  sky:hx("#A0AEBA"),hor:hx("#E8DDBC"),far:hx("#AEBAB6"),near:hx("#C4AC7E"),warm:.6},
  {h:18.2,sky:hx("#B09C92"),hor:hx("#E8C49A"),far:hx("#AC9E94"),near:hx("#C09E6E"),warm:.9},
  {h:19.8,sky:hx("#7E7672"),hor:hx("#B08E74"),far:hx("#8A807A"),near:hx("#968064"),warm:.6},
  {h:21,  sky:hx("#5E7076"),hor:hx("#7E8884"),far:hx("#6A7A7C"),near:hx("#78766A"),warm:.25},
  {h:24,  sky:hx("#4F666E"),hor:hx("#6E828A"),far:hx("#5E747C"),near:hx("#6E7A72"),warm:.15},
];
function sampleLight(h){
  h=((h%24)+24)%24;
  let i=0;while(i<KEYS.length-2&&KEYS[i+1].h<h)i++;
  const a=KEYS[i],b=KEYS[i+1],k=Math.min(1,Math.max(0,(h-a.h)/(b.h-a.h)));
  const e=k*k*(3-2*k);
  return{sky:lerpHSL(a.sky,b.sky,e),hor:lerpHSL(a.hor,b.hor,e),
         far:lerpHSL(a.far,b.far,e),near:lerpHSL(a.near,b.near,e),
         warm:a.warm+(b.warm-a.warm)*e};
}
function phaseName(h){
  if(h<4.5||h>=21.5)return"夜 LA NUIT";
  if(h<6)return"拂晓 AVANT L'AUBE";
  if(h<9)return"清晨 L'AUBE";
  if(h<11.5)return"上午 LE MATIN";
  if(h<15)return"正午 MIDI";
  if(h<17.5)return"午后 L'APRÈS-MIDI";
  if(h<19.8)return"暮光 · 灯初上";
  return"入夜 LA TOMBÉE";
}
function sunPos(){
  const day=heure>=5.5&&heure<=19.8;
  const k=day?(heure-5.5)/14.3:((heure+24-20.5)%24)/9;
  return{x:W*(.14+.72*Math.min(1,Math.max(0,k))),y:H*(.28-Math.sin(Math.PI*Math.min(1,Math.max(0,k)))*.2),day};
}

/* ================= 剧本数据（沿用，未改逻辑） ================= */
const AGENTS={
  user:{name:'USER',role:'需求方',code:'US'},
  coordinator:{name:'COORDINATOR',role:'调度',code:'CO'},
  researcher:{name:'RESEARCHER',role:'检索',code:'RE'},
  coder:{name:'CODER',role:'执行',code:'EX'},
  critic:{name:'CRITIC',role:'评审',code:'CT'},
};
const TYPE_LABEL={submit:'SUBMIT',plan:'PLAN',handoff:'HANDOFF',tool:'TOOL CALL',response:'RESPONSE',final:'DELIVER'};

let EVENTS=[],T_MAX=21,R=mulberry32(seed);
function genScenario(){
  R=mulberry32(seed);
  const beats=SCEN[scenId].beats;
  let t=0.5+R()*0.4;
  EVENTS=beats.map(b=>{
    t+=1.0+R()*0.85;
    const li=R()*b.l.length|0,di=R()*b.d.length|0;
    return{t:+t.toFixed(1),from:b.f,to:b.t,type:b.y,label:b.l[li],detail:b.d[di],payload:b.p()};
  });
  T_MAX=Math.ceil(EVENTS[EVENTS.length-1].t+2);
}

const POS={user:[.09,.44],coordinator:[.52,.50],researcher:[.22,.64],coder:[.67,.67],critic:[.44,.83]};
function pier(id){return{x:POS[id][0]*W,y:POS[id][1]*H}}
function pathBetween(a,b){
  const A=pier(a),B=pier(b);
  const mx=(A.x+B.x)/2,my=(A.y+B.y)/2;
  const dx=B.x-A.x,dy=B.y-A.y,len=Math.hypot(dx,dy)||1;
  const off=Math.min(60,len*.22);
  return{A,B,C:{x:mx-dy/len*off,y:my+dx/len*off+Math.abs(dy)*.1}};
}
function pathPoint(P,k){
  const u=1-k;
  return{x:u*u*P.A.x+2*u*k*P.C.x+k*k*P.B.x,
         y:u*u*P.A.y+2*u*k*P.C.y+k*k*P.B.y};
}

    const i=+d.dataset.i;
    d.classList.toggle("done",EVENTS[i].t<=scenT);
    const cur=i===currentStep()-1;
    d.classList.toggle("now",cur);
    if(cur)d.scrollIntoView({block:"nearest"});
  });
}

  $("d-p").textContent=Object.entries(ev.payload).map(([k,v])=>k+": "+(Array.isArray(v)?v.join(", "):v)).join("\n");

/* ================= transport ================= */
function currentStep(){let s=0;while(s<EVENTS.length&&EVENTS[s].t<=scenT)s++;return s}
function syncTransport(){
  $("steplab").textContent="STEP "+currentStep()+" / "+EVENTS.length;
  syncLog();drawGauge();
}
function fireEvents(){
  EVENTS.forEach(ev=>{
    const key=ev.t+"|"+ev.label;
    if(ev.t<=scenT&&!(flares[key+"_fired"])){
      flares[key+"_fired"]=1;
      pulses.push({ev,t0:ev.t});
    }
  });
}
$("b-play").addEventListener("click",togglePlay);
function togglePlay(){
  if(scenT>=T_MAX&& !playing){resetScenario()}
  playing=!playing;
  $("playico").innerHTML=playing?'<path d="M3 2.2v7.6M9 2.2v7.6"/>':'<path d="M3.5 2.2v7.6L10 6z"/>';
}
$("b-prev").addEventListener("click",()=>stepTo(currentStep()-1));
$("b-next").addEventListener("click",()=>stepTo(currentStep()+1));
$("b-re").addEventListener("click",resetScenario);
function stepTo(n){
  n=Math.max(0,Math.min(EVENTS.length,n));
  scenT=n===0?0:EVENTS[n-1].t+.01;
  pulses=[];flares={};
  /* 重放到当前 */
  EVENTS.forEach(ev=>{if(ev.t<=scenT)flares[ev.t+"|"+ev.label+"_fired"]=1});
  syncTransport();
}
document.addEventListener("keydown",e=>{
  const tag=document.activeElement&&document.activeElement.tagName;
  if(tag==="INPUT"||tag==="TEXTAREA")return;
  const k=e.key.toLowerCase();
  if(e.key===" "){e.preventDefault();togglePlay()}
  else if(e.key==="ArrowRight")stepTo(currentStep()+1);
  else if(e.key==="ArrowLeft")stepTo(currentStep()-1);
  else if(k==="h")document.body.classList.toggle("hideui");
  else if(e.key==="["){heure=((heure-0.5)+24)%24;writeHash()}
  else if(e.key==="]"){heure=(heure+0.5)%24;writeHash()}
  else if(e.key>="1"&&e.key<="4"){heure=[7,13,18.2,22][+e.key-1];writeHash()}
  else if(k==="+")speed=Math.min(3,speed+.5),$("speedlab").textContent=speed.toFixed(1)+"×";
  else if(k==="-")speed=Math.max(.5,speed-.5),$("speedlab").textContent=speed.toFixed(1)+"×";
});

/* ================= 潮位计（canvas 刮擦条） ================= */
const gaugeEl=$("gauge"),gaugeC=$("gaugec"),gctx=gaugeC.getContext("2d");
function sizeGauge(){
  const r=gaugeEl.getBoundingClientRect();
  gaugeC.width=r.width*DPR;gaugeC.height=34*DPR;
  gctx.setTransform(DPR,0,0,DPR,0,0);
}
function drawGauge(){
  const w=gaugeC.width/DPR,h=34;
  gctx.clearRect(0,0,w,h);
  /* 潮位曲线 */
  gctx.strokeStyle="rgba(79,102,110,.4)";gctx.lineWidth=1;
  gctx.beginPath();
  for(let x=0;x<=w;x+=3){
    const k=x/w,y=h*.62-Math.sin(k*9+1.3)*h*.16-k*h*.2;
    x===0?gctx.moveTo(x,y):gctx.lineTo(x,y);
  }
  gctx.stroke();
  /* 已涨部分 */
  const prog=Math.min(1,scenT/T_MAX);
  const grad=gctx.createLinearGradient(0,0,w*prog,0);
  grad.addColorStop(0,"rgba(126,147,153,.55)");grad.addColorStop(1,"rgba(196,85,56,.55)");
  gctx.fillStyle=grad;
  gctx.beginPath();gctx.moveTo(0,h);
  for(let x=0;x<=w*prog;x+=3){
    const k=x/w,y=h*.62-Math.sin(k*9+1.3)*h*.16-k*h*.2;
    gctx.lineTo(x,y);
  }
  gctx.lineTo(w*prog,h);gctx.closePath();gctx.fill();
  /* 事件刻度 */
  EVENTS.forEach(ev=>{
    const x=ev.t/T_MAX*w;
    gctx.strokeStyle=ev.t<=scenT?"#C45538":"rgba(79,102,110,.4)";
    gctx.beginPath();gctx.moveTo(x,h*.72);gctx.lineTo(x,h*.94);gctx.stroke();
  });
  $("gaugetip").style.left=(prog*100)+"%";
}
let gScrub=false;

  const r=gaugeEl.getBoundingClientRect();

  EVENTS.forEach(ev=>{if(ev.t<=scenT)flares[ev.t+"|"+ev.label+"_fired"]=1});

}

/* ================= sound：水 (L5, 默认 OFF) ================= */
const Snd=(()=>{
  let ac=null,master=null,on=false,gullTimer=null,dropTimer=null;
  function build(){
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain();master.gain.value=0;master.connect(ac.destination);
    const len=ac.sampleRate*4,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
    let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+.03*w)/1.03;d[i]=last*2.6}
    const src=ac.createBufferSource();src.buffer=buf;src.loop=true;
    const lp=ac.createBiquadFilter();lp.type="lowpass";lp.frequency.value=420;
    const wg=ac.createGain();wg.gain.value=.2;
    src.connect(lp);lp.connect(wg);wg.connect(master);src.start();
    /* 潮起潮落：极慢幅度 LFO */
    const lfo=ac.createOscillator();lfo.frequency.value=.09;
    const lg=ac.createGain();lg.gain.value=.1;lfo.connect(lg);lg.connect(wg.gain);lfo.start();
  }
  function drop(){
    if(!on)return;
    const t0=ac.currentTime+.02;
    const o=ac.createOscillator(),g=ac.createGain();
    o.type="sine";
    o.frequency.setValueAtTime(1700+Math.random()*300,t0);
    o.frequency.exponentialRampToValueAtTime(560,t0+.04);
    g.gain.setValueAtTime(.03,t0);
    g.gain.exponentialRampToValueAtTime(.0004,t0+.06);
    o.connect(g);g.connect(master);o.start(t0);o.stop(t0+.08);
    dropTimer=setTimeout(drop,(1.5+Math.random()*5)*1000);
  }
  function gull(){
    if(!on)return;
    const t0=ac.currentTime+.05;
    const o=ac.createOscillator(),g=ac.createGain(),m=ac.createOscillator(),mg=ac.createGain();
    o.type="sine";o.frequency.setValueAtTime(1150,t0);
    o.frequency.exponentialRampToValueAtTime(880,t0+.24);
    m.frequency.value=26;mg.gain.value=90;m.connect(mg);mg.connect(o.frequency);
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.02,t0+.04);
    g.gain.exponentialRampToValueAtTime(.0004,t0+.5);
    o.connect(g);g.connect(master);m.start(t0);o.start(t0);o.stop(t0+.55);m.stop(t0+.55);
    gullTimer=setTimeout(gull,(6+Math.random()*14)*1000);
  }
  return{toggle(){
      if(!ac)build();
      if(ac.state==="suspended")ac.resume();
      on=!on;
      master.gain.cancelScheduledValues(ac.currentTime);
      master.gain.linearRampToValueAtTime(on?1:0,ac.currentTime+1.5);
      if(on){drop();gull()}else{clearTimeout(dropTimer);clearTimeout(gullTimer)}
      localStorage.setItem("mira-snd-072",on?"1":"0");
      return on;
    }};
})();
$("snd").addEventListener("click",()=>$("snd").classList.toggle("on",Snd.toggle()));

function makePaper(){
  const c=document.createElement("canvas");c.width=c.height=480;
  const x=c.getContext("2d"),rng=mulberry32(0x71de);
  x.fillStyle="#808080";x.fillRect(0,0,480,480);
  for(let i=0;i<4200;i++){const g=110+rng()*90;
    x.fillStyle=`rgba(${g|0},${g|0},${g|0},${.02+rng()*.04})`;
    x.fillRect(rng()*480,rng()*480,1+rng()*2,1+rng()*2)}
  x.strokeStyle="rgba(140,145,145,.05)";
  for(let i=0;i<46;i++){x.beginPath();
    const px=rng()*480,py=rng()*480,a=rng()*Math.PI,l=8+rng()*26;
    x.moveTo(px,py);x.lineTo(px+Math.cos(a)*l,py+Math.sin(a)*l);x.stroke()}
  return c;
}
const paperC=makePaper();let paperPat=null;

/* ================= 海与沙的碎笔触 ================= */
let waterStrokes=[],sandStrokes=[];
(function layoutStrokes(){
  const rng=mulberry32(seed^0x7eca);
  waterStrokes=[];sandStrokes=[];
  for(let i=0;i<700;i++)waterStrokes.push({nx:rng(),ny:rng(),len:3+rng()*9,hue:rng(),ph:rng()*7});
  for(let i=0;i<500;i++)sandStrokes.push({nx:rng(),ny:rng(),len:2+rng()*7,hue:rng(),ph:rng()*7});

/* ================= physics ================= */
let t=0,finalFlare=0;
function physics(dt){
  if(playing){
    scenT+=dt*speed;
    if(scenT>=T_MAX){scenT=T_MAX;playing=false;
      $("playico").innerHTML='<path d="M3.5 2.2v7.6L10 6z"/>';
      finalFlare=1.6;}
    fireEvents();syncTransport();
  }
  /* 脉冲推进 & 到达 */
  for(let i=pulses.length-1;i>=0;i--){
    const p=pulses[i];
    const k=(scenT-p.t0)/FLY;
    if(k>=1){
      const B=pier(p.ev.to);
      for(let r=0;r<3;r++)ripples.push({x:B.x,y:B.y+6,r:4+r*8,life:1-r*.2});
      flares[p.ev.to]=1.4;
      if(p.ev.type==='final')finalFlare=2.2;
      pulses.splice(i,1);
    }
  }
  for(let i=ripples.length-1;i>=0;i--){
    const r=ripples[i];r.life-=dt*.9;r.r+=dt*34;
    if(r.life<=0)ripples.splice(i,1);
  }
  Object.keys(flares).forEach(k=>{
    if(k.endsWith("_fired"))return;
    flares[k]-=dt;if(flares[k]<=0)delete flares[k];
  });
  finalFlare=Math.max(0,finalFlare-dt*.5);
}

/* ================= draw ================= */
function pierDraw(id,L,dayF){
  const P=pier(id),a=AGENTS[id];
  const flare=(flares[id]||0)+finalFlare;
  const ink=fade(FAM.prof,L.hor,.15);
  /* 倒影 */
  ctx.strokeStyle=rgb(fade(FAM.prof,L.near,.3),.25);
  ctx.lineWidth=3;
  for(let k=0;k<3;k++){
    ctx.beginPath();
    ctx.moveTo(P.x-8+k*8+Math.sin(t*2+k)*2,P.y+8);
    ctx.lineTo(P.x-8+k*8+Math.sin(t*2+k+1)*3,P.y+22+k*4);
    ctx.stroke();
  }
  /* 桩 */
  ctx.strokeStyle=rgb(ink,.9);ctx.lineWidth=3.4;
  ctx.beginPath();ctx.moveTo(P.x-9,P.y);ctx.lineTo(P.x-9,P.y-26);ctx.stroke();
  ctx.beginPath();ctx.moveTo(P.x+9,P.y);ctx.lineTo(P.x+9,P.y-26);ctx.stroke();
  /* 横梁 */
  ctx.lineWidth=2.6;
  ctx.beginPath();ctx.moveTo(P.x-14,P.y-24);ctx.lineTo(P.x+14,P.y-24);ctx.stroke();
  /* 灯室 */
  ctx.fillStyle=rgb(ink,.92);
  ctx.fillRect(P.x-6,P.y-38,12,13);
  /* 灯：昼为玻璃，暮后燃灯（锈红暖光） */
  const lampGlow=Math.max(flare,(1-dayF)*.9);
  const lampC=lerpHSL(FAM.rouille,hx("#F2C98A"),.4);
  if(lampGlow>.05){
    const lg=ctx.createRadialGradient(P.x,P.y-31,0,P.x,P.y-31,26+lampGlow*26);
    lg.addColorStop(0,rgb(lampC,.65*Math.min(1,lampGlow)));lg.addColorStop(1,rgb(lampC,0));
    ctx.fillStyle=lg;ctx.beginPath();ctx.arc(P.x,P.y-31,26+lampGlow*26,0,7);ctx.fill();
  }
  ctx.fillStyle=rgb(lampGlow>.1?lampC:FAM.coquille,.95);
  ctx.fillRect(P.x-3,P.y-35,6,7);
  /* 顶 */
  ctx.strokeStyle=rgb(ink,.9);ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(P.x-8,P.y-38);ctx.lineTo(P.x,P.y-45);ctx.lineTo(P.x+8,P.y-38);ctx.stroke();
  /* 名牌 */
  ctx.font="9px 'SF Mono',Menlo,monospace";ctx.textAlign="center";
  ctx.fillStyle=rgb(fade(FAM.prof,L.near,.1),.85);
  ctx.fillText(a.name,P.x,P.y+26);
  ctx.fillStyle=rgb(fade(FAM.prof,L.near,.2),.6);
  ctx.font="8px 'SF Mono',Menlo,monospace";
  ctx.fillText(a.role,P.x,P.y+37);
}
function draw(now){
  const L=sampleLight(heure);
  const sun=sunPos();
  const horizonY=H*.32;
  const dayF=Math.min(1,Math.max(0,Math.min((heure-5.2)/1.6,(20.6-heure)/1.6,1)));
  /* --- 天空 --- */
  const g=ctx.createLinearGradient(0,0,0,horizonY);
  g.addColorStop(0,rgb(L.sky));g.addColorStop(1,rgb(L.hor));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,horizonY+1);
  const sg=ctx.createRadialGradient(sun.x,sun.y,0,sun.x,sun.y,H*.36);
  sg.addColorStop(0,rgb(FAM.coquille,.4*L.warm+.1));sg.addColorStop(1,rgb(FAM.coquille,0));
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,horizonY+2);
  if(sun.day){
    const low=1-Math.min(1,Math.abs(sun.y-horizonY)/(H*.3));
    const sr=H*(.022+.024*low);
    ctx.fillStyle=rgb(lerpHSL(FAM.coquille,FAM.rouille,low*.4),.9);
    ctx.beginPath();ctx.arc(sun.x,sun.y,sr,0,7);ctx.fill();
  }
  /* 远海平线 + 帆影一点 */
  ctx.fillStyle=rgb(fade(FAM.mer,L.hor,.5),.8);
  ctx.fillRect(0,horizonY-1,W,1.5);
  const sailX=W*.78+Math.sin(t*.05)*10;
  ctx.fillStyle=rgb(fade(FAM.prof,L.hor,.4),.55);
  ctx.beginPath();ctx.moveTo(sailX,horizonY-2);ctx.lineTo(sailX+7,horizonY-2);ctx.lineTo(sailX+2,horizonY-13);ctx.closePath();ctx.fill();
  /* --- 海面（远） --- */
  const seaG=ctx.createLinearGradient(0,horizonY,0,H*.62);
  seaG.addColorStop(0,rgb(fade(FAM.mer,L.hor,.35)));seaG.addColorStop(1,rgb(FAM.mer));
  ctx.fillStyle=seaG;ctx.fillRect(0,horizonY,W,H*.62-horizonY);
  /* 海面碎笔触 */
  waterStrokes.forEach(s=>{
    const y=horizonY+4+s.ny*(H*.6-horizonY);
    const depth=(y-horizonY)/(H*.6-horizonY);
    const x=s.nx*W;
    const base=lerpHSL(fade(FAM.mer,L.hor,.35),FAM.mer,depth);
    const c=s.hue>.6?fade(base,FAM.coquille,.3+.2*s.hue):fade(base,FAM.prof,.25);
    const wave=Math.sin(t*1.2+s.nx*8+s.ny*18)*depth*2;
    ctx.strokeStyle=rgb(c,.42+.22*depth);
    ctx.lineWidth=Math.max(.7,1.4*depth);
    ctx.beginPath();ctx.moveTo(x-s.len*.8,y+wave);ctx.lineTo(x+s.len*.8,y+wave*.6);ctx.stroke();
  });
  /* 太阳/灯在水面的碎金光路 */
  if(sun.day&&L.warm>.2){
    for(let k=0;k<26;k++){
      const y=horizonY+6+k*(H*.5-horizonY)/26;
      const spread=6+k*2.2;
      const xx=sun.x+Math.sin(t*1.6+k*1.7)*spread*.4;
      ctx.strokeStyle=rgb(lerpHSL(FAM.coquille,FAM.rouille,.25),(L.warm*.4)*(1-k/30));
      ctx.lineWidth=1.4;
      ctx.beginPath();ctx.moveTo(xx-spread*.4,y);ctx.lineTo(xx+spread*.4,y);ctx.stroke();
    }
  }
  /* --- 浅滩湿沙（近，蛇形潮线） --- */
  const sandG=ctx.createLinearGradient(0,H*.56,0,H);
  sandG.addColorStop(0,rgb(fade(FAM.sable,FAM.mer,.35)));sandG.addColorStop(1,rgb(L.near));
  ctx.fillStyle=sandG;
  ctx.beginPath();ctx.moveTo(0,H);
  ctx.lineTo(0,H*.60);
  for(let x=0;x<=W;x+=14){
    ctx.lineTo(x,H*.585+Math.sin(x*.006+1.2)*H*.014+Math.sin(x*.017)*H*.006);
  }
  ctx.lineTo(W,H);ctx.closePath();ctx.fill();
  /* 潮线一线亮 */
  ctx.strokeStyle=rgb(FAM.coquille,.4);ctx.lineWidth=1.2;
  ctx.beginPath();
  for(let x=0;x<=W;x+=14){
    const y=H*.585+Math.sin(x*.006+1.2)*H*.014+Math.sin(x*.017)*H*.006;
    x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.stroke();
  /* 潮池：沙上的天空碎片 */
  [[.16,.88,90],[.36,.94,120],[.62,.90,80],[.86,.95,100]].forEach(([px,py,pr],pi)=>{
    const cx=px*W,cy=py*H;
    ctx.fillStyle=rgb(fade(FAM.mer,L.sky,.45),.5);
    ctx.beginPath();ctx.ellipse(cx,cy,pr,pr*.22,0,0,7);ctx.fill();
    for(let k=0;k<5;k++){
      ctx.strokeStyle=rgb(FAM.coquille,.3+.1*Math.sin(t*1.5+k+pi));
      ctx.lineWidth=1;
      const wy=cy-pr*.14+k*pr*.07;
      ctx.beginPath();ctx.moveTo(cx-pr*.6+Math.sin(t+k)*4,wy);ctx.lineTo(cx+pr*.5+Math.sin(t+k+2)*4,wy);ctx.stroke();
    }
  });
  sandStrokes.forEach(s=>{
    const y=H*.58+6+s.ny*(H*.42-6);
    const depth=(y-H*.58)/(H*.42);
    const x=s.nx*W;
    const base=lerpHSL(fade(FAM.sable,FAM.mer,.35),L.near,depth);
    const c=s.hue>.5?fade(base,FAM.coquille,.28+.2*s.hue):fade(base,FAM.prof,.2);
    ctx.strokeStyle=rgb(c,.3+.25*depth);
    ctx.lineWidth=Math.max(.7,1.5*depth);
    const wave=Math.sin(t*.8+s.nx*6+s.ph)*depth*1.4;
    ctx.beginPath();ctx.moveTo(x-s.len*.8,y+wave);ctx.lineTo(x+s.len*.8,y+wave*.5);ctx.stroke();
  });
  /* --- 潮沟（连接灯桩的水道） --- */
  const links=[["user","coordinator"],["coordinator","researcher"],["researcher","critic"],
               ["coordinator","coder"],["coder","critic"],["critic","coordinator"]];
  links.forEach(([a,b])=>{
    const P=pathBetween(a,b);
    ctx.strokeStyle=rgb(fade(FAM.mer,FAM.prof,.3),.5);
    ctx.lineWidth=7;
    ctx.beginPath();ctx.moveTo(P.A.x,P.A.y+4);
    ctx.quadraticCurveTo(P.C.x,P.C.y+4,P.B.x,P.B.y+4);ctx.stroke();
    /* 沟内碎光 */
    ctx.strokeStyle=rgb(FAM.coquille,.25);ctx.lineWidth=1.2;
    for(let k=1;k<6;k++){
      const p=pathPoint(P,k/6);
      ctx.beginPath();ctx.moveTo(p.x-5,p.y+4+Math.sin(t*2+k)*1.5);ctx.lineTo(p.x+5,p.y+4+Math.sin(t*2+k+1)*1.5);ctx.stroke();
    }
  });
  /* --- 灯桩 --- */
  Object.keys(AGENTS).forEach(id=>pierDraw(id,L,dayF));
  /* --- 脉冲（奔跑的水） --- */
  pulses.forEach(p=>{
    const k=Math.min(1,(scenT-p.t0)/FLY);
    const P=pathBetween(p.ev.from,p.ev.to);
    const e=k*k*(3-2*k);
    const pos=pathPoint(P,e);
    /* 拖尾三滴 */
    for(let d=1;d<=3;d++){
      const kk=Math.max(0,e-d*.06);
      const tp=pathPoint(P,kk);
      ctx.fillStyle=rgb(FAM.coquille,.5-d*.13);
      ctx.beginPath();ctx.arc(tp.x,tp.y+2,4-d,0,7);ctx.fill();
    }
    /* 主体水珠 */
    const pc=p.ev.type==='final'?lerpHSL(FAM.rouille,hx("#F2C98A"),.4):FAM.coquille;
    const pg=ctx.createRadialGradient(pos.x,pos.y,0,pos.x,pos.y,14);
    pg.addColorStop(0,rgb(pc,.9));pg.addColorStop(1,rgb(pc,0));
    ctx.fillStyle=pg;ctx.beginPath();ctx.arc(pos.x,pos.y,14,0,7);ctx.fill();
    ctx.fillStyle=rgb(pc,.95);
    ctx.beginPath();ctx.arc(pos.x,pos.y,4.2,0,7);ctx.fill();
  });
  /* --- 涟漪 --- */
  ripples.forEach(r=>{
    ctx.strokeStyle=rgb(FAM.coquille,r.life*.5);
    ctx.lineWidth=1.2;
    ctx.beginPath();ctx.ellipse(r.x,r.y,r.r,r.r*.32,0,0,7);ctx.stroke();
  });
  /* --- DELIVER：万灯皆明，金光铺水面 --- */
  if(finalFlare>0){
    const a=Math.min(1,finalFlare)*.22;
    const fg=ctx.createLinearGradient(0,horizonY,0,H);
    fg.addColorStop(0,rgb(FAM.rouille,0));fg.addColorStop(1,rgb(FAM.rouille,a));
    ctx.fillStyle=fg;ctx.fillRect(0,horizonY,W,H-horizonY);
  }
  /* --- 纸纹 + 颗粒 --- */
  if(!paperPat)paperPat=ctx.createPattern(paperC,"repeat");
  ctx.save();ctx.globalAlpha=.07;ctx.globalCompositeOperation="multiply";
  ctx.fillStyle=paperPat;ctx.fillRect(0,0,W,H);ctx.restore();
  updateGrain(now);
  if(!grainPat)grainPat=ctx.createPattern(grainC,"repeat");
  if(grainPat){ctx.save();ctx.globalAlpha=.03;ctx.globalCompositeOperation="overlay";
    ctx.fillStyle=grainPat;ctx.fillRect(0,0,W,H);ctx.restore()}
  syncTimer();
}

/* ================= boot ================= */
resize();
genScenario();renderLog();syncTransport();writeHash();
if(innerWidth<760){document.body.classList.add("hideui","booted");
  setTimeout(()=>document.body.classList.remove("booted"),400)}
/* QA/分享：#st=秒 直接涨到某拍；#play=1 自动播放 */
if(hashParams.get("st")!==null){
  scenT=Math.min(T_MAX,Math.max(0,+hashParams.get("st")||0));
  EVENTS.forEach(ev=>{if(ev.t<=scenT-FLY)flares[ev.t+"|"+ev.label+"_fired"]=1});
  fireEvents(); /* 让最近一拍的水脉冲停在半途 */
  syncTransport();
}
if(hashParams.has("play"))togglePlay();
let last=performance.now();
(function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  t+=dt;
  physics(dt);
  draw(now);
  requestAnimationFrame(loop);
})(last);
</script>
