<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onde — 语音波形实时可视化</title>
<style>
:root{
  --bg:#0A0B0D; --panel:#101216; --line:#1E2229;
  --ph:#3DF08B; --ph-dim:rgba(61,240,139,.35);
  --ink:#E7EAEE; --dim:#8A919B; --faint:#4C525B;
  --mono:"SF Mono","Menlo","Consolas",monospace;
  --sans:-apple-system,"Helvetica Neue","PingFang SC",sans-serif;
  --serif:"Didot","Bodoni MT","Georgia","Songti SC",serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);height:100vh;overflow:hidden;
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
::selection{background:var(--ph);color:#06110a}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
  background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.18) 3px 4px)}

header{display:flex;align-items:center;justify-content:space-between;padding:18px 26px;
  border-bottom:1px solid var(--line);flex-wrap:wrap;gap:10px;z-index:5}
.brand{display:flex;align-items:baseline;gap:16px}
h1{font-family:var(--serif);font-weight:400;font-size:26px}
h1 em{font-style:italic;color:var(--ph)}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
.modes{display:flex;gap:6px}
.mbtn{font-family:var(--mono);font-size:11px;letter-spacing:.1em;padding:8px 14px;border-radius:6px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--dim);transition:all .25s var(--ease)}
.mbtn:hover{color:var(--ink);border-color:var(--faint)}
.mbtn.on{color:var(--ph);border-color:var(--ph);box-shadow:0 0 14px var(--ph-dim)}

#stage{flex:1;position:relative;z-index:2;cursor:crosshair}
canvas{position:absolute;inset:0}

/* ASR ticker */
.asr{height:52px;border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;
  padding:0 26px;font-family:var(--mono);font-size:13px;overflow:hidden;z-index:5;background:rgba(16,18,22,.7)}
.asr .lbl{font-size:9px;letter-spacing:.24em;color:var(--faint);flex-shrink:0}
#phons{display:flex;gap:10px;align-items:center;overflow:hidden;white-space:nowrap}
.ph{color:var(--dim);transition:color .6s}
.ph.new{color:var(--ph);text-shadow:0 0 10px var(--ph-dim)}
.ph sup{font-size:8px;color:var(--faint);margin-left:2px}

/* console */
.console{border-top:1px solid var(--line);background:var(--panel);padding:14px 26px 18px;z-index:5;
  display:flex;align-items:center;gap:clamp(14px,3vw,40px);flex-wrap:wrap}
.play{width:46px;height:46px;border-radius:50%;border:1px solid var(--ph);background:transparent;cursor:pointer;
  display:grid;place-items:center;transition:all .25s var(--ease);flex-shrink:0}
.play:hover{box-shadow:0 0 18px var(--ph-dim);transform:scale(1.06)}
.play svg{width:16px;height:16px;fill:var(--ph)}
.sl{display:flex;flex-direction:column;gap:7px;min-width:120px;flex:1;max-width:190px}
.sl .top{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--dim)}
.sl output{color:var(--ph)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(to right,var(--ph) var(--fill,50%),var(--line) var(--fill,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-5px;border-radius:50%;
  background:var(--bg);border:2px solid var(--ph);transition:transform .2s}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.3)}
input[type=range]::-moz-range-track{height:2px;background:var(--line)}
input[type=range]::-moz-range-progress{height:2px;background:var(--ph)}
input[type=range]::-moz-range-thumb{width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--ph)}
.kbd-hint{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.08em;line-height:1.9;margin-left:auto}
.kbd-hint kbd{border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--dim)}
@media(max-width:720px){.kbd-hint{display:none}.sl{min-width:44%}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>Onde <em>声波</em></h1>
    <span class="tag">AGENT DEMOS / 03 · VOICE WAVE</span>
  </div>
  <div class="modes">
    <button class="mbtn on" data-m="line">线条</button>
    <button class="mbtn" data-m="mirror">镜像</button>
    <button class="mbtn" data-m="ring">圆环</button>
    <button class="mbtn" data-m="dots">粒子</button>
  </div>
</header>

<div id="stage"><canvas id="cv"></canvas></div>

<div class="asr">
  <span class="lbl">LIVE&nbsp;ASR</span>
  <div id="phons"></div>
</div>

<div class="console">
  <button class="play" id="play" title="播放 / 暂停">
    <svg viewBox="0 0 16 16" id="picon"><path d="M3 2h3.5v12H3zM9.5 2H13v12H9.5z"/></svg>
  </button>
  <div class="sl"><div class="top"><label>音高 PITCH</label><output id="oF">132 Hz</output></div>
    <input type="range" id="rF" min="80" max="260" value="132"></div>
  <div class="sl"><div class="top"><label>力度 GAIN</label><output id="oA">0.80</output></div>
    <input type="range" id="rA" min="10" max="100" value="80"></div>
  <div class="sl"><div class="top"><label>气息 NOISE</label><output id="oN">0.14</output></div>
    <input type="range" id="rN" min="0" max="60" value="14"></div>
  <div class="sl"><div class="top"><label>语速 TEMPO</label><output id="oT">1.0×</output></div>
    <input type="range" id="rT" min="30" max="240" value="100"></div>
  <div class="kbd-hint">点击画布 触发音节 · <kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><kbd>F</kbd> 四种元音音色 · <kbd>空格</kbd> 暂停</div>
</div>

<script>
"use strict";
const canvas=document.getElementById("cv"),ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);
let W=0,H=0,DPR=1,t=0,playing=true,mode="line";
const P={f:132,a:.8,n:.14,tempo:1};

/* vowel formants: [f1,f2,f3] relative gains */
const VOWELS={a:[700,1100,2500],e:[400,2000,2600],i:[280,2250,3000],o:[420,800,2700]};
const SYLLS=["ba","de","mi","lo","tu","fa","ré","son","ve","na","jour","moi","la","vie"];
let sylls=[];           /* active syllable envelopes */
let autoTimer=0,trail=[];

function spawnSyllable(vowel,dur,amp){
  sylls.push({v:vowel||"a",t0:t,dur:dur||0.55,amp:amp||1,
    drift:(Math.random()-.5)*14,syl:SYLLS[Math.floor(Math.random()*SYLLS.length)]});
  addPhon(sylls[sylls.length-1]);
}
function addPhon(s){
  const box=$("phons"),el=document.createElement("span");el.className="ph new";
  el.innerHTML=`/${s.vowel=== "a"?"ɑ":s.vowel}${s.syl.slice(1)}/<sup>${(72+Math.random()*25).toFixed(0)}%</sup>`;
  box.appendChild(el);
  requestAnimationFrame(()=>setTimeout(()=>el.classList.remove("new"),500));
  while(box.children.length>26)box.removeChild(box.firstChild);
}

/* instantaneous voice sample at time tt, x in [0,1] for stereo-ish jitter */
function voice(tt){
  let v=0,env=0;
  for(const s of sylls){
    const p=(tt-s.t0)/s.dur;if(p<0||p>1)continue;
    const e=Math.sin(Math.PI*p)**1.6*s.amp;env=Math.max(env,e);
    const f=P.f+s.drift*p;
    const fm=VOWELS[s.v];
    v+=e*(Math.sin(2*Math.PI*f*tt)*.55
        +Math.sin(2*Math.PI*f*2*tt)*.22
        +Math.sin(2*Math.PI*f*3.02*tt)*.1
        +Math.sin(2*Math.PI*fm[1]/18*tt)*.08);
  }
  v+=(Math.random()*2-1)*P.n*Math.max(env,.06);
  return v*P.a;
}

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  const st=document.getElementById("stage");
  W=st.clientWidth;H=st.clientHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;
  canvas.style.width=W+"px";canvas.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  trail=new Array(Math.max(120,Math.floor(W/2))).fill(0);
}
window.addEventListener("resize",resize);resize();

function frame(){
  requestAnimationFrame(frame);
  if(!playing){return;}
  const dt=1/60;t+=dt;
  /* auto utterance */
  autoTimer-=dt*P.tempo;
  if(autoTimer<=0){
    const keys=Object.keys(VOWELS);
    spawnSyllable(keys[Math.floor(Math.random()*4)],0.35+Math.random()*0.5,0.6+Math.random()*0.4);
    autoTimer=0.28+Math.random()*0.9;
  }
  sylls=sylls.filter(s=>(t-s.t0)<s.dur+0.05);
  /* push samples */
  const step=Math.max(1,Math.floor(W/420));
  for(let i=0;i<step;i++)trail.push(voice(t-(step-i)*0.0016));
  while(trail.length>Math.max(120,Math.floor(W/2)))trail.shift();

  ctx.clearRect(0,0,W,H);
  ctx.lineJoin="round";
  if(mode==="ring")drawRing();else if(mode==="dots")drawDots();else drawLine(mode==="mirror");
}

function drawLine(mirror){
  const cy=H/2,n=trail.length,amp=H*0.36;
  /* grid */
  ctx.strokeStyle="rgba(61,240,139,.06)";ctx.lineWidth=1;
  for(let gx=0;gx<W;gx+=Math.max(60,W/16)){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H);ctx.stroke();}
  ctx.beginPath();ctx.moveTo(0,cy);ctx.lineTo(W,cy);ctx.strokeStyle="rgba(61,240,139,.12)";ctx.stroke();
  const passes=[[10,.05],[4,.16],[1.6,1]];
  for(const[lw,al]of passes){
    ctx.beginPath();
    for(let i=0;i<n;i++){const x=i/(n-1)*W,y=cy+trail[i]*amp;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
    ctx.strokeStyle=`rgba(61,240,139,${al})`;ctx.lineWidth=lw;ctx.stroke();
    if(mirror){ctx.beginPath();
      for(let i=0;i<n;i++){const x=i/(n-1)*W,y=cy-trail[i]*amp;
        i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
      ctx.strokeStyle=`rgba(61,240,139,${al*.55})`;ctx.lineWidth=lw;ctx.stroke();}
  }
}
function drawRing(){
  const cx=W/2,cy=H/2,n=trail.length,R=Math.min(W,H)*0.22;
  const passes=[[9,.05],[3.5,.16],[1.4,1]];
  for(const[lw,al]of passes){
    ctx.beginPath();
    for(let i=0;i<=n;i++){
      const a=i/n*Math.PI*2-Math.PI/2,v=trail[i%n];
      const r=R+v*R*0.9;
      const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.strokeStyle=`rgba(61,240,139,${al})`;ctx.lineWidth=lw;ctx.stroke();
  }
  ctx.beginPath();ctx.arc(cx,cy,R*0.42,0,7);ctx.strokeStyle="rgba(61,240,139,.14)";ctx.lineWidth=1;ctx.stroke();
}
function drawDots(){
  const cy=H/2,n=trail.length,amp=H*0.36;
  for(let i=0;i<n;i+=3){
    const x=i/(n-1)*W,v=trail[i];
    const s=Math.min(5,1+Math.abs(v)*7);
    ctx.beginPath();ctx.arc(x,cy+v*amp,s,0,7);
    ctx.fillStyle=`rgba(61,240,139,${.18+Math.abs(v)*.8})`;ctx.fill();
  }
}

/* ---------- controls ---------- */
document.querySelectorAll(".mbtn").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".mbtn").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");mode=b.dataset.m;
}));
function bindRange(id,out,key,fmt,scale){
  const r=$(id),o=$(out);
  const paint=()=>{const p=(r.value-r.min)/(r.max-r.min)*100;r.style.setProperty("--fill",p+"%");
    o.textContent=fmt(r.value*scale);};
  paint();r.addEventListener("input",()=>{paint();P[key]=r.value*scale;});
}
bindRange("rF","oF","f",v=>v.toFixed(0)+" Hz",1);
bindRange("rA","oA","a",v=>v.toFixed(2),0.01);
bindRange("rN","oN","n",v=>v.toFixed(2),0.01);
bindRange("rT","oT","tempo",v=>v.toFixed(1)+"×",0.01);

function togglePlay(){playing=!playing;
  $("picon").innerHTML=playing?'<path d="M3 2h3.5v12H3zM9.5 2H13v12H9.5z"/>':'<path d="M3 1.5v13l11-6.5z"/>';}
$("play").addEventListener("click",togglePlay);

canvas.parentElement.addEventListener("pointerdown",e=>{
  if(e.target.closest("button"))return;
  const keys=Object.keys(VOWELS);
  const k=keys[Math.floor(e.clientX/W*4)]||"a";
  spawnSyllable(k,0.5,1);
});
document.addEventListener("keydown",e=>{
  if(e.key===" "){e.preventDefault();togglePlay();return;}
  const map={a:"a",s:"e",d:"i",f:"o"};
  if(map[e.key]&&!e.repeat)spawnSyllable(map[e.key],0.45,1);
});

/* opening phrase so first paint is alive */
["a","e","i","o"].forEach((v,i)=>setTimeout(()=>spawnSyllable(v,.5,.9),i*260));
frame();
</script>
</body>
</html>
