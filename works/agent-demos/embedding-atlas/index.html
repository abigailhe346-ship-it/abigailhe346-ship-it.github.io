<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Embedding Atlas — 词向量空间地图</title>
<style>
  :root{
    --bg:#07080D; --panel:#0C0E16; --line:rgba(255,255,255,.08);
    --ink:#E9E7F0; --dim:#666B80; --faint:#23263A;
    --gold:#F2C14E; --teal:#43D9B8; --rose:#F2739A;
    --mono:"SF Mono",Menlo,Consolas,monospace;
    --serif:Didot,"Bodoni MT",Georgia,"Songti SC",serif;
    --sans:-apple-system,"Helvetica Neue","PingFang SC",sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;
       -webkit-font-smoothing:antialiased}
  ::selection{background:rgba(242,193,78,.3)}

  header{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;
         gap:16px;padding:0 22px;z-index:6;pointer-events:none;
         background:linear-gradient(rgba(7,8,13,.85),transparent)}
  .brand{display:flex;align-items:baseline;gap:12px;white-space:nowrap}
  .brand .no{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.12em}
  .brand .name{font-family:var(--serif);font-size:19px}
  .brand .sub{font-size:10px;color:var(--dim);letter-spacing:.22em;text-transform:uppercase}
  .meta{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.1em}
  .meta b{color:var(--teal);font-weight:500}

  canvas#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
  canvas#map.drag{cursor:grabbing}

  /* search dock */
  .dock{position:absolute;left:22px;bottom:22px;z-index:6;display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 320px)}
  .searchwrap{position:relative}
  #search{width:230px;background:rgba(12,14,22,.9);border:1px solid var(--line);color:var(--ink);
          font-family:var(--mono);font-size:12px;padding:11px 14px 11px 36px;outline:none;
          backdrop-filter:blur(8px);transition:border-color .3s}
  #search:focus{border-color:rgba(242,193,78,.55)}
  .searchwrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
  #matches{position:absolute;left:0;bottom:calc(100% + 6px);width:100%;background:rgba(12,14,22,.95);
           border:1px solid var(--line);backdrop-filter:blur(8px);display:none;max-height:200px;overflow-y:auto}
  #matches.show{display:block}
  #matches div{font-family:var(--mono);font-size:11.5px;padding:8px 14px;cursor:pointer;
               display:flex;justify-content:space-between;color:var(--dim)}
  #matches div:hover,#matches div.hot{background:rgba(242,193,78,.1);color:var(--ink)}
  #matches div i{font-style:normal;font-size:9px;opacity:.6}
  .btn{font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:11px 16px;cursor:pointer;
       border:1px solid var(--line);background:rgba(12,14,22,.9);color:var(--ink);
       transition:all .25s var(--ease);backdrop-filter:blur(8px)}
  .btn:hover{border-color:rgba(242,193,78,.55);color:var(--gold)}
  .hint{font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.06em;width:100%}

  /* inspector */
  #insp{position:absolute;top:72px;right:22px;width:280px;z-index:6;
        background:rgba(12,14,22,.92);border:1px solid rgba(255,255,255,.12);
        backdrop-filter:blur(10px);transform:translateX(120%);transition:transform .5s var(--ease)}
  #insp.show{transform:none}
  #insp .head{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px}
  #insp .w{font-family:var(--serif);font-size:26px}
  #insp .cl{font-family:var(--mono);font-size:9px;letter-spacing:.2em;padding:3px 8px;border:1px solid}
  #insp .x{margin-left:auto;cursor:pointer;color:var(--dim);font-size:16px;font-family:var(--mono)}
  #insp .x:hover{color:var(--rose)}
  #insp .coords{padding:10px 18px;font-family:var(--mono);font-size:10px;color:var(--dim);
                border-bottom:1px solid var(--line);letter-spacing:.04em}
  #insp .nlabel{padding:12px 18px 6px;font-family:var(--mono);font-size:9px;letter-spacing:.22em;
                color:var(--dim);text-transform:uppercase}
  #insp .nb{padding:5px 18px 14px;display:flex;flex-direction:column;gap:7px}
  .nrow{display:grid;grid-template-columns:64px 1fr 40px;align-items:center;gap:10px;
        font-family:var(--mono);font-size:11px;cursor:pointer}
  .nrow:hover .nw{color:var(--gold)}
  .nrow .bar{height:3px;background:var(--faint);position:relative}
  .nrow .bar i{position:absolute;inset:0;right:auto;background:var(--teal)}
  .nrow .sv{text-align:right;color:var(--dim);font-size:10px;font-variant-numeric:tabular-nums}

  @media (max-width:760px){
    .dock{max-width:calc(100vw - 44px)}
    #insp{width:min(280px,calc(100vw - 44px))}
    .meta{display:none}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="no">No.05</span>
    <span class="name">Embedding Atlas</span>
    <span class="sub">Word Vector Space</span>
  </div>
  <div class="meta">dim 768 → <b>UMAP 2D</b> · 180 terms · 6 semantic fields</div>
</header>

<canvas id="map"></canvas>

<div class="dock">
  <div class="searchwrap">
    <svg width="13" height="13" viewBox="0 0 13 13"><circle cx="5.5" cy="5.5" r="4" fill="none" stroke="#E9E7F0" stroke-width="1.4"/><path d="M8.8 8.8L12 12" stroke="#E9E7F0" stroke-width="1.4"/></svg>
    <input id="search" placeholder="搜索词项… 如「鲸」" autocomplete="off">
    <div id="matches"></div>
  </div>
  <button class="btn" id="roam">RANDOM WALK · 随机漫游</button>
  <button class="btn" id="reset">RESET VIEW</button>
  <div class="hint">DRAG 平移 · WHEEL 缩放 · CLICK 词项查看最近邻</div>
</div>

<div id="insp">
  <div class="head"><span class="w" id="i-w">—</span><span class="cl" id="i-cl">—</span><span class="x" id="i-close">×</span></div>
  <div class="coords" id="i-coord">—</div>
  <div class="nlabel">Nearest Neighbours · cosine sim</div>
  <div class="nb" id="i-nb"></div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const canvas=$("map"),ctx=canvas.getContext("2d");
let W=0,H=0;
function resize(){
  const dpr=Math.min(2,devicePixelRatio||1);
  W=innerWidth;H=innerHeight;
  canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);resize();

/* ================= data ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const CLUSTERS=[
  {name:"动物 FAUNA",c:"#43D9B8",cx:-340,cy:-160,words:"猫 狗 虎 狮 狼 狐 鹿 熊 兔 鲸 鲨 鹰 雀 鹤 蝶 蜂 蚁 蛇 蛙 龟 马 牛 羊 猪 象 猴 熊猫 企鹅 骆驼 松鼠".split(" ")},
  {name:"科技 TECH",c:"#8296F0",cx:60,cy:-320,words:"算法 芯片 模型 向量 张量 编译 缓存 内核 协议 带宽 量子 激光 雷达 卫星 火箭 机器人 传感器 数据库 网络 加密 区块链 神经 梯度 训练 推理 电池 光伏 涡轮 无人机 光纤".split(" ")},
  {name:"情绪 AFFECT",c:"#F2739A",cx:380,cy:-40,words:"喜悦 愤怒 悲伤 恐惧 惊讶 厌恶 焦虑 平静 兴奋 沮丧 孤独 满足 怀念 嫉妒 羞愧 自豪 感激 同情 冷漠 好奇 无聊 尴尬 安心 惆怅 释然 眷恋 忐忑 炽热 麻木 温柔".split(" ")},
  {name:"城市 CITY",c:"#F2C14E",cx:-300,cy:280,words:"北京 上海 广州 深圳 杭州 成都 重庆 西安 南京 武汉 东京 首尔 曼谷 新加坡 伦敦 巴黎 柏林 罗马 纽约 悉尼 开罗 莫斯科 迪拜 香港 台北 昆明 哈尔滨 拉萨 厦门 青岛".split(" ")},
  {name:"食物 FOOD",c:"#9CCB5E",cx:120,cy:240,words:"米饭 面条 饺子 包子 火锅 烧烤 寿司 拉面 披萨 汉堡 沙拉 牛排 咖喱 泡菜 豆腐 芝士 面包 蛋糕 巧克力 咖啡 茶 果汁 啤酒 奶油 蜂蜜 辣椒 大蒜 生姜 柠檬 芒果".split(" ")},
  {name:"抽象 ABSTRACT",c:"#B48CE8",cx:-40,cy:-40,words:"时间 空间 因果 自由 正义 真理 美 熵 无限 存在 意识 记忆 梦境 命运 偶然 必然 秩序 混沌 对称 维度 概率 悖论 隐喻 信仰 虚无 永恒 瞬间 边界 回声 引力".split(" ")},
];
const WORDS=[];
CLUSTERS.forEach((cl,ci)=>{
  const rng=mulberry32(1234+ci*77);
  const gauss=()=> (rng()+rng()+rng()+rng()-2)*52;
  cl.words.forEach(w=>{
    WORDS.push({w,ci,x:cl.cx+gauss(),y:cl.cy+gauss(),
                ph:rng()*Math.PI*2,r:1.6+rng()*1.6});
  });
});
// precompute neighbours (top 8 by world distance)
WORDS.forEach(a=>{
  a.nb=WORDS.filter(b=>b!==a)
    .map(b=>({b,d:Math.hypot(a.x-b.x,a.y-b.y)}))
    .sort((p,q)=>p.d-q.d).slice(0,8);
});

/* ================= camera ================= */
const cam={x:0,y:0,z:1},tgt={x:0,y:0,z:1};
function fitZ(){return Math.min(W,H)/980}
cam.z=tgt.z=fitZ()*1.05;
const w2s=(x,y)=>({x:(x-cam.x)*cam.z+W/2,y:(y-cam.y)*cam.z+H/2});
const s2w=(x,y)=>({x:(x-W/2)/cam.z+cam.x,y:(y-H/2)/cam.z+cam.y});

let drag=null,dragMoved=0,hover=null,selected=null;
canvas.addEventListener("mousedown",e=>{drag={x:e.clientX,y:e.clientY};dragMoved=0;canvas.classList.add("drag")});
addEventListener("mouseup",()=>{drag=null;canvas.classList.remove("drag")});
addEventListener("mousemove",e=>{
  if(drag){
    dragMoved+=Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y);
    tgt.x-=(e.clientX-drag.x)/cam.z;tgt.y-=(e.clientY-drag.y)/cam.z;
    drag={x:e.clientX,y:e.clientY};
  }
  const p=s2w(e.clientX,e.clientY);
  hover=null;let best=12/cam.z;
  WORDS.forEach(wd=>{
    const d=Math.hypot(wd.x-p.x,wd.y-p.y);
    if(d<best){best=d;hover=wd}
  });
  canvas.style.cursor=hover?"pointer":(drag?"grabbing":"grab");
});
canvas.addEventListener("wheel",e=>{
  e.preventDefault();
  const f=Math.exp(-e.deltaY*.0013);
  const p=s2w(e.clientX,e.clientY);
  tgt.z=Math.min(6,Math.max(fitZ()*.6,tgt.z*f));
  // zoom toward cursor
  tgt.x=p.x-(p.x-tgt.x)/f;tgt.y=p.y-(p.y-tgt.y)/f;
},{passive:false});
canvas.addEventListener("click",()=>{
  if(dragMoved>6)return; // was a pan, not a tap
  if(hover){select(hover);flyTo(hover,Math.max(tgt.z,fitZ()*2.4))}
  else{selected=null;$("insp").classList.remove("show")}
});

function flyTo(wd,z){
  tgt.x=wd.x;tgt.y=wd.y;if(z)tgt.z=z;
}
$("reset").addEventListener("click",()=>{tgt.x=0;tgt.y=0;tgt.z=fitZ()*1.05;selected=null;$("insp").classList.remove("show")});

/* ================= selection / inspector ================= */
function select(wd){
  selected=wd;
  const cl=CLUSTERS[wd.ci];
  $("i-w").textContent=wd.w;
  const clEl=$("i-cl");clEl.textContent=cl.name;
  clEl.style.color=cl.c;clEl.style.borderColor=cl.c+"66";
  $("i-coord").textContent=`vec[0..1] ≈ (${wd.x.toFixed(1)}, ${wd.y.toFixed(1)}) · cluster ${wd.ci}`;
  const box=$("i-nb");box.innerHTML="";
  wd.nb.forEach(({b,d})=>{
    const sim=1/(1+d/68);
    const row=document.createElement("div");row.className="nrow";
    row.innerHTML=`<span class="nw">${b.w}</span>
      <span class="bar"><i style="width:${(sim*100).toFixed(0)}%;background:${CLUSTERS[b.ci].c}"></i></span>
      <span class="sv">${sim.toFixed(3)}</span>`;
    row.addEventListener("click",()=>{select(b);flyTo(b)});
    box.appendChild(row);
  });
  $("insp").classList.add("show");
}
$("i-close").addEventListener("click",()=>{selected=null;$("insp").classList.remove("show")});

/* ================= search ================= */
const searchEl=$("search"),matchBox=$("matches");
searchEl.addEventListener("input",()=>{
  const q=searchEl.value.trim();
  matchBox.innerHTML="";
  if(!q){matchBox.classList.remove("show");return}
  const hits=WORDS.filter(wd=>wd.w.includes(q)).slice(0,8);
  if(!hits.length){
    matchBox.innerHTML=`<div><span>无匹配</span><i>0</i></div>`;
  }else hits.forEach(wd=>{
    const d=document.createElement("div");
    d.innerHTML=`<span>${wd.w}</span><i>${CLUSTERS[wd.ci].name}</i>`;
    d.addEventListener("click",()=>{
      select(wd);flyTo(wd,fitZ()*3);
      searchEl.value="";matchBox.classList.remove("show");
    });
    matchBox.appendChild(d);
  });
  matchBox.classList.add("show");
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){matchBox.classList.remove("show");searchEl.blur()}
  if(e.key==="/"&&document.activeElement!==searchEl){e.preventDefault();searchEl.focus()}
});
$("roam").addEventListener("click",()=>{
  const wd=WORDS[Math.floor(Math.random()*WORDS.length)];
  select(wd);flyTo(wd,fitZ()*3);
});

/* ================= draw ================= */
let t=0;
function draw(dt){
  t+=dt;
  // ease camera
  const k=1-Math.pow(1-.12,dt*60);
  cam.x+=(tgt.x-cam.x)*k;cam.y+=(tgt.y-cam.y)*k;cam.z+=(tgt.z-cam.z)*k;

  ctx.clearRect(0,0,W,H);
  // faint starfield
  ctx.fillStyle="rgba(255,255,255,.05)";
  for(let i=0;i<70;i++){
    const sx=(i*137.5)%W,sy=(i*89.3)%H;
    ctx.fillRect(sx,sy,1,1);
  }
  // nebula glows
  ctx.globalCompositeOperation="lighter";
  CLUSTERS.forEach(cl=>{
    const p=w2s(cl.cx,cl.cy);
    const R=170*cam.z;
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,R);
    g.addColorStop(0,cl.c+"14");g.addColorStop(1,cl.c+"00");
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(p.x,p.y,R,0,7);ctx.fill();
  });
  ctx.globalCompositeOperation="source-over";

  // selected constellation lines
  if(selected){
    const a=w2s(selected.x,selected.y);
    selected.nb.forEach(({b,d})=>{
      const q=w2s(b.x,b.y);
      const sim=1/(1+d/68);
      ctx.strokeStyle=`rgba(242,193,78,${sim*.5})`;
      ctx.lineWidth=sim*1.6;
      ctx.setLineDash([4,5]);ctx.lineDashOffset=-t*20;
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(q.x,q.y);ctx.stroke();
      ctx.setLineDash([]);
    });
  }
  // cluster labels when zoomed out
  const showCL=cam.z<fitZ()*1.9;
  ctx.textAlign="center";
  if(showCL)CLUSTERS.forEach(cl=>{
    const p=w2s(cl.cx,cl.cy-95);
    ctx.fillStyle=cl.c+"99";
    ctx.font="10px 'SF Mono',Menlo,monospace";
    ctx.fillText(cl.name,p.x,p.y);
  });
  // words
  const labelZ=cam.z>fitZ()*2.6;
  WORDS.forEach(wd=>{
    const p=w2s(wd.x,wd.y);
    if(p.x<-30||p.x>W+30||p.y<-30||p.y>H+30)return;
    const cl=CLUSTERS[wd.ci];
    const tw=.65+.35*Math.sin(t*1.6+wd.ph);
    const isSel=wd===selected,isNb=selected&&selected.nb.some(n=>n.b===wd);
    ctx.globalAlpha=selected?(isSel||isNb?1:.28):1;
    ctx.fillStyle=cl.c;
    const r=(isSel?wd.r+2.2:isNb?wd.r+1:wd.r)*Math.min(1.6,cam.z*.9)*tw;
    ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fill();
    if(isSel){
      ctx.strokeStyle=cl.c;ctx.globalAlpha=.6;
      ctx.beginPath();ctx.arc(p.x,p.y,r+5+Math.sin(t*3)*1.5,0,7);ctx.stroke();
    }
    ctx.globalAlpha=selected?(isSel||isNb?1:.28):1;
    if(labelZ||isSel||isNb||wd===hover){
      ctx.fillStyle=isSel?"#F2C14E":"rgba(233,231,240,.85)";
      ctx.font=(isSel?"600 ":"")+"11px -apple-system,'PingFang SC',sans-serif";
      ctx.fillText(wd.w,p.x,p.y-r-6);
    }
    ctx.globalAlpha=1;
  });
  // hover crosshair
  if(hover){
    const p=w2s(hover.x,hover.y);
    ctx.strokeStyle="rgba(242,193,78,.4)";ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(p.x-14,p.y);ctx.lineTo(p.x+14,p.y);
    ctx.moveTo(p.x,p.y-14);ctx.lineTo(p.x,p.y+14);ctx.stroke();
  }
}

/* ================= loop ================= */
let last=performance.now();
(function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  draw(dt);
  requestAnimationFrame(loop);
})(last);
</script>
</body>
</html>
