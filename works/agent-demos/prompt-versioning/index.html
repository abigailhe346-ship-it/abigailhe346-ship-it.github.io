<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Versioning — 黄昏校对台 · Atelier MIRA N°078 · 薰衣草</title>
<!--
  Atelier MIRA · Étude N°078 · 薰衣草 LAVANDE（黄昏前一小时，冷灰调，≈6800K）
  家族锚点：#E8E0D0 石灰墙 · #D9C7E0 远紫 · #B9A8C9 花田 · #8E7BA8 中紫 · #6B5B85 深紫 · #4E4A6B 暮影
  跨家族借用 ≤2 色：#D9A85C 灯金（夜灯与“新增”点彩的唯一点缀，≤6% 面积）。
  面积配比：纸 40% / 紫灰桌光 45% / 暮影 10% / 灯金 ≤5%。紫色只许灰调，禁止荧光紫。
  一叠校样在黄昏的窗下：每换一版，改动的字像相纸显影一样，以点彩浮出来。
-->
<style>
  :root{
    --ink:#4A4258; --dim:#7E7490; --paper:rgba(232,224,208,.92); --paper-solid:#EDE6D6;
    --line:rgba(107,91,133,.3); --accent:#6B5B85; --gold:#B08A3E; --accent-soft:rgba(107,91,133,.13);
    --mono:"SF Mono",Menlo,Consolas,monospace;
    --serif:Didot,"Bodoni MT",Georgia,"Songti SC",serif;
    --sans:-apple-system,"Helvetica Neue","PingFang SC",sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#B9A8C9;color:var(--ink);font-family:var(--sans);overflow:hidden;
       -webkit-font-smoothing:antialiased}
  ::selection{background:var(--accent-soft)}
  button{font-family:inherit;color:inherit}
  .snap *{transition:none!important}
  canvas#field{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  canvas#bloom{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:6}

  header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:flex-start;
         gap:14px;padding:18px 22px 30px;pointer-events:none;
         background:linear-gradient(rgba(232,224,208,.5),rgba(232,224,208,0))}
  .seal{flex:0 0 auto;pointer-events:auto;opacity:.92}
  .etitle{padding-top:1px}
  .etitle .no{font-family:var(--mono);font-size:9.5px;letter-spacing:.26em;color:var(--accent)}
  .etitle h1{font-family:var(--serif);font-weight:400;font-size:22px;letter-spacing:.02em;margin-top:2px}
  .etitle h1 span{font-family:var(--sans);font-size:12.5px;color:var(--dim);margin-left:9px;letter-spacing:.06em}
  .etitle .epig{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--dim);
                margin-top:5px;letter-spacing:.04em}
  .hdr-right{margin-left:auto;display:flex;gap:8px;align-items:flex-start;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}

  #snd{width:34px;height:34px;border:1px solid var(--line);background:var(--paper);
       backdrop-filter:blur(8px);cursor:pointer;display:flex;align-items:center;justify-content:center;
       transition:border-color .3s var(--ease);flex:0 0 auto}
  #snd:hover{border-color:var(--accent)}
  #snd svg{stroke:var(--dim);transition:stroke .3s}
  #snd.on svg{stroke:var(--accent)}
  #snd .waves{opacity:0;transition:opacity .4s}
  #snd.on .waves{opacity:1}

  #tabs{display:flex;border:1px solid var(--line);background:var(--paper);backdrop-filter:blur(8px)}
  #tabs button{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--dim);
               background:transparent;border:0;padding:9px 12px;cursor:pointer;transition:all .3s var(--ease)}
  #tabs button:hover{color:var(--ink)}
  #tabs button.on{color:var(--paper-solid);background:var(--accent)}

  /* 版本轨：一叠校样 */
  #rail{position:fixed;left:22px;top:96px;bottom:64px;z-index:10;width:216px;overflow-y:auto;
        transition:transform .5s var(--ease),opacity .5s var(--ease);padding:4px 2px}
  .vsheet{position:relative;background:var(--paper);border:1px solid var(--line);backdrop-filter:blur(8px);
          padding:11px 13px 10px;margin-bottom:9px;cursor:pointer;
          transition:transform .45s var(--ease),box-shadow .45s var(--ease),border-color .3s}
  .vsheet:nth-child(odd){transform:rotate(-.5deg)}
  .vsheet:nth-child(even){transform:rotate(.4deg)}
  .vsheet:hover{transform:translateY(-3px) rotate(0deg);box-shadow:0 10px 24px rgba(74,66,107,.18)}
  .vsheet.on{border-color:var(--accent);box-shadow:0 10px 26px rgba(74,66,107,.22);transform:translateY(-2px)}
  .vsheet .vno{font-family:var(--serif);font-size:19px;color:var(--accent)}
  .vsheet .vno em{font-style:italic;font-size:11px;color:var(--dim);margin-left:6px}
  .vsheet .vlab{font-family:var(--sans);font-size:11.5px;color:var(--ink);margin-top:3px}
  .vsheet .vacc{position:absolute;top:11px;right:12px;font-family:var(--mono);font-size:10px;color:var(--gold)}
  .vsheet .vacc.neg{color:var(--dim)}
  .vsheet .vdate{font-family:var(--mono);font-size:8.5px;color:var(--dim);letter-spacing:.08em;margin-top:4px}
  body.hideui #rail{transform:translateX(-130%);opacity:0;pointer-events:none}

  /* 校样主区 */
  #proof{position:fixed;left:262px;right:22px;top:96px;bottom:64px;z-index:9;
         background:var(--paper);border:1px solid var(--line);backdrop-filter:blur(10px);
         padding:20px 26px;overflow-y:auto;
         transition:transform .55s var(--ease),opacity .4s var(--ease)}
  #proof.slidein{animation:slidein .55s var(--ease)}
  @keyframes slidein{from{transform:translateX(26px);opacity:.2}to{transform:none;opacity:1}}
  .phead{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px}
  .phead .big{font-family:var(--serif);font-size:34px;color:var(--accent)}
  .phead .sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--dim)}
  .phead .meta{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--dim);text-align:right;line-height:1.8}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .cols.unified{grid-template-columns:1fr}
  .colhead{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--dim);margin-bottom:8px;
           display:flex;justify-content:space-between}
  .sheet{font-family:var(--serif);font-size:14px;line-height:2.05;color:var(--ink)}
  .sheet .ln{display:block;min-height:1.4em}
  .sheet .seg{border-radius:1px;padding:0 1px}
  .sheet .seg.add{color:#7A5F22;border-bottom:1px solid rgba(176,138,62,.55)}
  .sheet .seg.del{color:var(--accent);text-decoration:line-through;text-decoration-color:rgba(107,91,133,.7)}
  .sheet .field{color:var(--dim)}
  .diffstat{font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-bottom:12px}
  .diffstat b{color:var(--gold);font-weight:500}
  .diffstat i{color:var(--accent);font-style:normal}
  /* 演进：黄昏地平线上的六粒光 */
  #trend{position:relative;height:300px;margin-top:8px}
  #trend .horizon{position:absolute;left:0;right:0;bottom:64px;height:1px;background:var(--line)}
  .tdot{position:absolute;transform:translate(-50%,50%);text-align:center;cursor:pointer}
  .tdot .dot{width:11px;height:11px;border-radius:50%;background:var(--paper-solid);
             border:2px solid var(--accent);margin:0 auto;transition:all .3s var(--ease)}
  .tdot.on .dot{background:var(--gold);border-color:var(--gold);box-shadow:0 0 14px rgba(176,138,62,.5)}
  .tdot .tv{font-family:var(--mono);font-size:9px;color:var(--dim);margin-top:5px}
  .tdot .ta{font-family:var(--mono);font-size:10px;color:var(--gold)}
  .tdot .ta.neg{color:var(--dim)}
  #trend svg{position:absolute;inset:0;width:100%;height:100%}

  #timer{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:10;width:min(430px,72vw);
         background:var(--paper);border:1px solid var(--line);backdrop-filter:blur(10px);
         padding:9px 14px 8px;cursor:ew-resize;user-select:none;touch-action:none}
  #timer .face{position:relative;height:12px;margin-bottom:5px}
  #timer .track{position:absolute;left:0;right:0;top:5px;height:2px;
                background:linear-gradient(90deg,#4E4A6B,#B9A8C9 22%,#E8E0D0 50%,#D9A85C 74%,#4E4A6B)}
  #timer .tick{position:absolute;top:2px;width:1px;height:8px;background:rgba(107,91,133,.3)}
  #timer .sun{position:absolute;top:1px;width:10px;height:10px;border-radius:50%;
              background:#E8E0D0;border:2px solid var(--accent);transform:translateX(-50%);
              box-shadow:0 0 0 3px rgba(232,224,208,.35)}
  #timer .lab{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;
              letter-spacing:.12em;color:var(--dim)}
  #timer .lab b{color:var(--ink);font-weight:500}

  #uibtn{position:fixed;left:22px;bottom:16px;z-index:11;font-family:var(--mono);font-size:9.5px;
         letter-spacing:.12em;color:var(--dim);background:var(--paper);border:1px solid var(--line);
         padding:8px 12px;cursor:pointer;transition:all .3s var(--ease);backdrop-filter:blur(8px)}
  #uibtn:hover{color:var(--ink);border-color:var(--accent)}

  #note{position:fixed;right:22px;bottom:56px;z-index:11;width:min(320px,80vw);
        font-family:var(--serif);font-style:italic;font-size:13.5px;line-height:1.65;color:var(--ink);
        background:var(--paper);border:1px solid var(--line);padding:16px 18px;
        opacity:0;transform:translateY(8px);pointer-events:none;
        transition:opacity .6s var(--ease),transform .6s var(--ease);backdrop-filter:blur(10px)}
  #note.show{opacity:1;transform:translateY(0)}

  #colo{position:fixed;right:22px;bottom:16px;z-index:10;display:flex;align-items:center;gap:8px;
        font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--ink);opacity:.68;
        cursor:pointer;user-select:none}

  @media (max-width:760px){
    header{padding:12px 14px 22px;gap:10px}
    .etitle h1{font-size:17px}
    .etitle h1 span{display:block;margin:2px 0 0}
    .etitle .epig{font-size:12px}
    #rail{width:150px;left:14px;top:88px;z-index:12}
    #proof{left:14px;right:10px;top:150px;padding:12px 14px}
    .cols{grid-template-columns:1fr}
    .phead .big{font-size:24px}
    #tabs button{padding:8px 8px;font-size:9px}
    #timer{width:calc(100vw - 120px);bottom:12px}
    #timer .lab span:last-child{display:none}
    #colo{right:14px;bottom:12px;font-size:8px}
    #uibtn{left:14px;bottom:12px}
  }
</style>
</head>
<body>

<header>
  <div class="seal">
    <svg width="50" height="50" viewBox="0 0 52 52" aria-label="Atelier MIRA seal">
      <circle cx="26" cy="26" r="24.6" fill="none" stroke="#6B5B85" stroke-width="1"/>
      <circle cx="26" cy="26" r="14.2" fill="none" stroke="#6B5B85" stroke-width=".55" opacity=".55"/>
      <path d="M18.4 33.4 V20.1 L25.9 29.9 L33.7 20.4 V33.1" fill="none" stroke="#6B5B85"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="etitle">
    <div class="no">ÉTUDE N°078 · AGENT-DEMOS</div>
    <h1>Prompt Versioning<span>黄昏校对台</span></h1>
    <div class="epig">「改动的字像相纸显影，一粒一粒浮上来。」</div>
  </div>
  <div class="hdr-right">
    <div id="tabs" role="group" aria-label="对照视图">
      <button data-v="split" class="on">并排 SPLIT</button>
      <button data-v="unified">统一 UNIFIÉ</button>
      <button data-v="trend">演进 MARCHE</button>
    </div>
    <button id="snd" aria-label="环境声开关" title="环境声（默认关闭）">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke-width="1.3" stroke-linecap="round">
        <path d="M2 6.5v3h2.4L8 12.6V3.4L4.4 6.5H2z"/>
        <path class="waves" d="M10.2 5.2a4 4 0 0 1 0 5.6M12 3.4a6.4 6.4 0 0 1 0 9.2"/>
      </svg>
    </button>

</header>

<canvas id="field"></canvas>
<canvas id="bloom"></canvas>

<nav id="rail" aria-label="版本列表"></nav>

<main id="proof" aria-label="校样">
  <div class="phead">
    <span class="big" id="p-vno">v3.0</span>
    <span class="sub" id="p-vlab">加安全护栏，拒答越权请求</span>
    <span class="meta">REPO cs-summarizer<br>BRANCH prod/cn-support<br>COMMITS 6</span>
  </div>
  <div class="diffstat" id="p-stat"></div>
  <div id="p-body"></div>
</main>

<div id="timer" aria-label="时间轴">
  <div class="face" id="timerface">
    <div class="track"></div>
    <div class="sun" id="sundot"></div>
  </div>
  <div class="lab"><span id="t-phase">黄昏 L'HEURE MAUVE</span><b id="t-clock">18:30</b><span>拖动 · 窗光换成灯</span></div>
</div>

<button id="uibtn" title="收起/展开面板 (H)">H · 面板</button>

<div id="note">v2.1 删掉的那三十个字，是六次迭代里最难的一次加法。校对的最高境界，是让读者以为它本来就这么短。——画室手记 N°078</div>

<footer id="colo">
  <svg width="22" height="14" viewBox="0 0 64 40" fill="#4A4258" aria-hidden="true">
    <path d="M32 20 C 26 12, 14 6, 4 8 C 12 12, 18 18, 24 21
             C 14 20, 6 22, 2 28 C 10 26, 18 26, 25 26
             C 27 30, 30 34, 34 36 C 33 32, 33 28, 34 25
             C 42 22, 52 16, 62 4 C 54 10, 44 16, 36 19
             C 35 17, 33 17, 32 20 Z"/>
  </svg>
  <span>ATELIER MIRA · N°078 · 薰衣草 LAVANDE</span>
</footer>

<script>
"use strict";
const $=id=>document.getElementById(id);
const canvas=$("field"),ctx=canvas.getContext("2d");
const bloom=$("bloom"),btx=bloom.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  bloom.width=W*DPR;bloom.height=H*DPR;btx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener("resize",resize);resize();

/* ================= seed & hash ================= */
const hashParams=new URLSearchParams(location.hash.slice(1));
let seed=parseInt(hashParams.get("seed"),10);
if(!Number.isFinite(seed))seed=(Math.random()*8999+1000)|0;
let heure=hashParams.get("h")!==null?+hashParams.get("h"):(new Date().getHours()+new Date().getMinutes()/60);
if(!Number.isFinite(heure)||heure<0||heure>24)heure=18.5;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function writeHash(){
  const p=new URLSearchParams({seed:String(seed),h:heure.toFixed(1),v:cur,view});
  history.replaceState(null,"","#"+p.toString());
}

/* ================= colour helpers ================= */
function hx(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function rgb2hsl(c){const[r,g,b]=c.map(v=>v/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
  let h=0,s=0;const l=(mx+mn)/2;const d=mx-mn;
  if(d){s=d/(1-Math.abs(2*l-1));if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}
  return[h,s,l]}
function hsl2rgb(h,s,l){const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;
  let r,g,b;if(h<60){r=c;g=x;b=0}else if(h<120){r=x;g=c;b=0}else if(h<180){r=0;g=c;b=x}
  else if(h<240){r=0;g=x;b=c}else if(h<300){r=x;g=0;b=c}else{r=c;g=0;b=x}
  return[Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)]}
function lerpHSL(a,b,k){const A=rgb2hsl(a),B=rgb2hsl(b);let dh=B[0]-A[0];
  if(dh>180)dh-=360;if(dh<-180)dh+=360;
  return hsl2rgb(A[0]+dh*k,A[1]+(B[1]-A[1])*k,A[2]+(B[2]-A[2])*k)}
function fade(col,target,k){const A=rgb2hsl(col),B=rgb2hsl(target);
  return hsl2rgb(A[0],A[1]+(B[1]-A[1])*k*.8,A[2]+(B[2]-A[2])*k)}
const rgb=(c,a)=>a===undefined?`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`:`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

/* ================= 薰衣草家族 + heure ================= */
const FAM={chaux:hx("#E8E0D0"),lointain:hx("#D9C7E0"),champ:hx("#B9A8C9"),
           mauve:hx("#8E7BA8"),violet:hx("#6B5B85"),ombre:hx("#4E4A6B"),lampe:hx("#D9A85C")};
/* skyFar（桌上远）, near（桌上近）, paperC, lampK（灯） */
const KEYS=[
  {h:0,   far:hx("#565071"),near:hx("#5E5878"),pap:hx("#C9C2BE"),lamp:1},
  {h:5,   far:hx("#7A7292"),near:hx("#8A809E"),pap:hx("#D8D0C6"),lamp:.6},
  {h:7,   far:hx("#C0B4C6"),near:hx("#CABECB"),pap:hx("#E6DECD"),lamp:.2},
  {h:10,  far:hx("#CFC6CE"),near:hx("#D8CFCF"),pap:hx("#EAE2D0"),lamp:.05},
  {h:13,  far:hx("#D4CBD0"),near:hx("#DED4D0"),pap:hx("#EDE5D3"),lamp:0},
  {h:16,  far:hx("#CFC0CE"),near:hx("#D8C8CC"),pap:hx("#EAE0CC"),lamp:.05},
  {h:17.8,far:hx("#C4AEC4"),near:hx("#CEB4C2"),pap:hx("#E8DAC2"),lamp:.2},
  {h:19.2,far:hx("#9E8CAE"),near:hx("#A890AC"),pap:hx("#DFCDB8"),lamp:.6},
  {h:20.6,far:hx("#6E6284"),near:hx("#786A86"),pap:hx("#D0C2B4"),lamp:.9},
  {h:22,  far:hx("#565071"),near:hx("#5E5878"),pap:hx("#C9C2BE"),lamp:1},
  {h:24,  far:hx("#565071"),near:hx("#5E5878"),pap:hx("#C9C2BE"),lamp:1},
];
function sampleLight(h){
  h=((h%24)+24)%24;
  let i=0;while(i<KEYS.length-2&&KEYS[i+1].h<h)i++;
  const a=KEYS[i],b=KEYS[i+1],k=Math.min(1,Math.max(0,(h-a.h)/(b.h-a.h)));
  const e=k*k*(3-2*k);
  return{far:lerpHSL(a.far,b.far,e),near:lerpHSL(a.near,b.near,e),
         pap:lerpHSL(a.pap,b.pap,e),lamp:a.lamp+(b.lamp-a.lamp)*e};
}
function phaseName(h){
  if(h<4.5||h>=21.5)return"夜 LA NUIT";
  if(h<6)return"拂晓 AVANT L'AUBE";
  if(h<9)return"清晨 L'AUBE";
  if(h<11.5)return"上午 LE MATIN";
  if(h<15)return"正午 MIDI";
  if(h<17)return"午后 L'APRÈS-MIDI";
  if(h<19.8)return"黄昏 L'HEURE MAUVE";
  return"入夜 LA TOMBÉE";
}

/* ================= 六次迭代（固定剧本） ================= */
const VERSIONS=[
 {v:"v0.9",date:"02-04",lab:"初稿上线，能跑就行",acc:null,
  text:"总结这段客服对话。"},
 {v:"v1.0",date:"02-18",lab:"加入角色设定与语气约束",acc:5.3,
  text:"你是资深客服质检员，语气中立客观。\n总结这段客服对话。"},
 {v:"v1.1",date:"03-02",lab:"输出改为结构化字段",acc:3.3,
  text:"你是资深客服质检员，语气中立客观。\n按字段输出：问题 / 处理 / 结果，各不超过 40 字，只陈述事实。\n对话：{{transcript}}"},
 {v:"v2.0",date:"03-21",lab:"补了两条 few-shot 示例",acc:4.8,

/* 字级 LCS diff */
function tokenize(s){return s.match(/[一-鿿]|[a-zA-Z0-9_{}]+|[^\s一-鿿a-zA-Z0-9_{}]|\n/g)||[]}
function diffTok(a,b){
  const A=tokenize(a),B=tokenize(b);
  const m=A.length,n=B.length;
  const dp=Array.from({length:m+1},()=>new Uint16Array(n+1));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)
    dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const out=[];
  let i=0,j=0;
  while(i<m&&j<n){
    if(A[i]===B[j]){out.push({t:A[i],d:"same"});i++;j++}
    else if(dp[i+1][j]>=dp[i][j+1]){out.push({t:A[i],d:"del"});i++}
    else{out.push({t:B[j],d:"add"});j++}
  }
  while(i<m)out.push({t:A[i++],d:"del"});
  while(j<n)out.push({t:B[j++],d:"add"});
  /* 合并同类相邻段 */
  const segs=[];
  out.forEach(o=>{
    if(o.t==="\n"){segs.push(o);return}
    const last=segs[segs.length-1];
    if(last&&last.d===o.d&&last.t!=="\n")last.t+=o.t;
    else segs.push({...o});
  });
  return segs;
}

/* ================= 状态 ================= */
let cur=Math.min(5,Math.max(0,parseInt(hashParams.get("v")||"5",10)||0));
let view=["split","unified","trend"].includes(hashParams.get("view"))?hashParams.get("view"):"split";

/* ================= 版本轨 ================= */
function renderRail(){
  $("rail").innerHTML=VERSIONS.map((v,i)=>
    `<div class="vsheet ${i===cur?"on":""}" data-i="${i}">
      <div class="vno">${v.v}<em>· ${i===0?"INITIAL":"COMMIT"}</em></div>
      ${v.acc===null?"":`<span class="vacc ${v.acc<0?"neg":""}">${v.acc>0?"+":""}${v.acc.toFixed(1)}</span>`}
      <div class="vlab">${v.lab}</div>
      <div class="vdate">${v.date} · ${v.text.replace(/\n/g,"").length} 字</div>
    </div>`).join("");
  $("rail").querySelectorAll(".vsheet").forEach(el=>
    el.addEventListener("click",()=>selectVer(+el.dataset.i)));
}

/* ================= 校样渲染 ================= */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function renderProof(animate){
  const V=VERSIONS[cur],prev=cur>0?VERSIONS[cur-1]:null;
  $("p-vno").textContent=V.v;
  $("p-vlab").textContent=V.lab;
  const body=$("p-body");
  if(view==="trend"){
    renderTrend(body);
  }else if(!prev){
    $("p-stat").innerHTML=`INITIAL COMMIT · ${V.text.replace(/\n/g,"").length} 字 · 无从对照，它是第一束光`;
    body.innerHTML=`<div class="cols unified"><div>
      <div class="colhead"><span>${V.v} · ${V.date}</span><span>BASE</span></div>
      <div class="sheet">${V.text.split("\n").map(l=>`<span class="ln">${esc(l)}</span>`).join("")}</div>
    </div></div>`;
  }else{
    const segs=diffTok(prev.text,V.text);
    const adds=segs.filter(s=>s.d==="add").reduce((n,s)=>n+s.t.length,0);
    const dels=segs.filter(s=>s.d==="del").reduce((n,s)=>n+s.t.length,0);
    $("p-stat").innerHTML=
      `DIFF vs ${prev.v} · <b>+${adds} 字</b> · <i>−${dels} 字</i> · MODE ${view.toUpperCase()} · 点彩显影中`;
    if(view==="split"){
      const oldHtml=segs.filter(s=>s.d!=="add").map(s=>
        s.t==="\n"?"</span><span class='ln'>":
        `<span class="seg ${s.d}">${esc(s.t)}</span>`).join("");
      const newHtml=segs.filter(s=>s.d!=="del").map(s=>
        s.t==="\n"?"</span><span class='ln'>":
        `<span class="seg ${s.d}">${esc(s.t)}</span>`).join("");
      body.innerHTML=`<div class="cols">
        <div><div class="colhead"><span>${prev.v} · ${prev.date}</span><span>BASE</span></div>
          <div class="sheet old"><span class="ln">${oldHtml}</span></div></div>
        <div><div class="colhead"><span>${V.v} · ${V.date}</span><span>CANDIDATE</span></div>
          <div class="sheet new"><span class="ln">${newHtml}</span></div></div>
      </div>`;
    }else{
      const html=segs.map(s=>
        s.t==="\n"?"</span><span class='ln'>":
        `<span class="seg ${s.d}">${esc(s.t)}</span>`).join("");
      body.innerHTML=`<div class="cols unified"><div>
        <div class="colhead"><span>${prev.v} → ${V.v}</span><span>UNIFIÉ</span></div>
        <div class="sheet new"><span class="ln">${html}</span></div></div></div>`;
    }
  }
  if(animate){
    const pr=$("proof");
    pr.classList.remove("slidein");void pr.offsetWidth;pr.classList.add("slidein");
    requestAnimationFrame(()=>requestAnimationFrame(bloomDiff));
  }
}
function renderTrend(body){
  body.innerHTML=`<div id="trend"><div class="horizon"></div></div>`;
  const tr=$("trend");
  const accs=[0];let acc=0;
  VERSIONS.forEach((v,i)=>{acc+=v.acc||0;accs[i]=acc});
  const mn=Math.min(...accs),mx=Math.max(...accs);
  const pts=VERSIONS.map((v,i)=>({
    x:8+i/(VERSIONS.length-1)*84, /* % */
    y:64-((accs[i]-mn)/((mx-mn)||1))*40, /* % from top, 高=分高 */
    v,i,a:accs[i]}));
  /* 黄昏小径：SVG 折线 */
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 100 100");svg.setAttribute("preserveAspectRatio","none");
  const path=document.createElementNS("http://www.w3.org/2000/svg","path");
  path.setAttribute("d","M"+pts.map(p=>`${p.x} ${p.y}`).join(" L"));
  path.setAttribute("fill","none");path.setAttribute("stroke","#8E7BA8");
  path.setAttribute("stroke-width",".5");path.setAttribute("stroke-dasharray","2 1.6");
  svg.appendChild(path);tr.appendChild(svg);
  pts.forEach(p=>{
    const d=document.createElement("div");
    d.className="tdot"+(p.i===cur?" on":"");
    d.style.left=p.x+"%";d.style.top=p.y+"%";
    d.innerHTML=`<div class="dot"></div><div class="tv">${p.v.v}</div>
      <div class="ta ${p.v.acc===null?"":p.v.acc<0?"neg":""}">${p.v.acc===null?"—":(p.v.acc>0?"+":"")+p.v.acc.toFixed(1)}</div>`;
    d.addEventListener("click",()=>selectVer(p.i));
    tr.appendChild(d);
  });
  $("p-stat").innerHTML=`MARCHE · 六次迭代累计 <b>+${accs[5].toFixed(1)}</b> 分 · 曲线在黄昏里往上走`;
}
function selectVer(i){
  if(i===cur)return;
  cur=i;renderRail();renderProof(true);writeHash();Snd.rustle();
}
document.querySelectorAll("#tabs button").forEach(b=>{
  b.addEventListener("click",()=>{
    view=b.dataset.v;
    document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));
    renderProof(true);writeHash();
  });
});

/* ================= 点彩显影（wow：改动的字一粒一粒浮出来） ================= */
let bloomDots=[],bloomT0=0;
function bloomDiff(){
  if(view==="trend")return;
  bloomDots=[];
  const rng=mulberry32((seed^cur*7919)>>>0);
  document.querySelectorAll("#proof .seg.add,#proof .seg.del").forEach(el=>{
    const isAdd=el.classList.contains("add");
    const rects=el.getClientRects();
    for(const r of rects){
      const area=r.width*r.height;
      const n=Math.min(90,Math.max(10,(area/90)|0));
      for(let i=0;i<n;i++){
        bloomDots.push({
          x:r.left+rng()*r.width,y:r.top+rng()*r.height,
          r:1+rng()*1.8,delay:rng()*.8,
          c:isAdd?(rng()<.6?FAM.lampe:FAM.ambre?FAM.lampe:FAM.lampe):(rng()<.6?FAM.violet:FAM.ombre),
          a:.5+rng()*.4});
      }
    }
  });
  bloomT0=performance.now();
}
function drawBloom(now){
  btx.clearRect(0,0,W,H);
  if(!bloomDots.length)return;
  const el=(now-bloomT0)/1000;
  let alive=false;
  bloomDots.forEach(d=>{
    const k=(el-d.delay)/.9;
    if(k<0){alive=true;return}
    if(k>1.6)return;
    alive=true;
    const grow=Math.min(1,k/.3);
    const fadeOut=k>1?1-(k-1)/.6:1;
    btx.fillStyle=rgb(d.c,d.a*grow*fadeOut);
    btx.beginPath();btx.arc(d.x,d.y,d.r*grow,0,7);btx.fill();
  });
  if(!alive)bloomDots=[];
}

/* ================= time ruler ================= */
const timerEl=$("timer"),sundot=$("sundot");
(function(){const face=$("timerface");
  for(let h=0;h<=24;h+=3){const t2=document.createElement("div");t2.className="tick";
    t2.style.left=(h/24*100)+"%";face.appendChild(t2)}})();
let scrubbing=false;
function scrubTo(cx){const r=timerEl.getBoundingClientRect();const pad=14;
  heure=Math.min(1,Math.max(0,(cx-r.left-pad)/(r.width-pad*2)))*24;writeHash()}
timerEl.addEventListener("pointerdown",e=>{scrubbing=true;timerEl.setPointerCapture(e.pointerId);scrubTo(e.clientX)});
timerEl.addEventListener("pointermove",e=>{if(scrubbing)scrubTo(e.clientX)});
timerEl.addEventListener("pointerup",()=>scrubbing=false);
timerEl.addEventListener("pointercancel",()=>scrubbing=false);
function syncTimer(){
  sundot.style.left=(heure/24*100).toFixed(2)+"%";
  const hh=Math.floor(heure),mm=Math.floor((heure-hh)*60);
  $("t-clock").textContent=`${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}`;
  $("t-phase").textContent=phaseName(heure);
}

/* ================= pointer：手心的光池 ================= */
const ptr={x:-999,y:-999,sx:-999,sy:-999,inC:false};
addEventListener("pointermove",e=>{ptr.x=e.clientX;ptr.y=e.clientY;ptr.inC=true;
  if(ptr.sx<-500){ptr.sx=ptr.x;ptr.sy=ptr.y}});

/* ================= keyboard ================= */
$("uibtn").addEventListener("click",()=>document.body.classList.toggle("hideui"));
document.addEventListener("keydown",e=>{
  const tag=document.activeElement&&document.activeElement.tagName;
  if(tag==="INPUT"||tag==="TEXTAREA")return;
  const k=e.key.toLowerCase();
  if(k==="h")document.body.classList.toggle("hideui");
  else if(k==="j"||e.key==="ArrowDown")selectVer(Math.min(5,cur+1));
  else if(k==="k"||e.key==="ArrowUp")selectVer(Math.max(0,cur-1));
  else if(e.key==="["){heure=((heure-0.5)+24)%24;writeHash()}
  else if(e.key==="]"){heure=(heure+0.5)%24;writeHash()}
  else if(e.key>="1"&&e.key<="6")selectVer(+e.key-1);
  else if(e.key==="7")heure=8;
  else if(e.key==="8")heure=13;
  else if(e.key==="9")heure=18.5;
  else if(e.key==="0")heure=22;
});
let coloTap=0,coloTimer=null;
$("colo").addEventListener("click",()=>{
  coloTap++;clearTimeout(coloTimer);
  coloTimer=setTimeout(()=>coloTap=0,900);
  if(coloTap>=3){$("note").classList.toggle("show");coloTap=0}
});

/* ================= sound (L5, 默认 OFF)：低风 + 翻纸 ================= */
const Snd=(()=>{
  let ac=null,master=null,on=false;
  function build(){
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain();master.gain.value=0;master.connect(ac.destination);
    const len=ac.sampleRate*4,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
    let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.2}
    const src=ac.createBufferSource();src.buffer=buf;src.loop=true;
    const bp=ac.createBiquadFilter();bp.type="bandpass";bp.frequency.value=380;bp.Q.value=.8;
    const wg=ac.createGain();wg.gain.value=.07;
    src.connect(bp);bp.connect(wg);wg.connect(master);src.start();
    const lfo=ac.createOscillator();lfo.frequency.value=.05;
    const lg=ac.createGain();lg.gain.value=120;lfo.connect(lg);lg.connect(bp.frequency);lfo.start();
  }
  return{
    toggle(){
      if(!ac)build();
      if(ac.state==="suspended")ac.resume();
      on=!on;
      master.gain.cancelScheduledValues(ac.currentTime);
      master.gain.linearRampToValueAtTime(on?1:0,ac.currentTime+1.5);
      localStorage.setItem("mira-snd-078",on?"1":"0");
      return on;
    },
    rustle(){ /* 翻纸：短促的滤波噪声 */
      if(!ac||!on)return;
      const t0=ac.currentTime;
      const len=ac.sampleRate*.25,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.5);
      const s=ac.createBufferSource();s.buffer=buf;
      const hp=ac.createBiquadFilter();hp.type="highpass";hp.frequency.value=900;
      const g=ac.createGain();g.gain.value=.14;
      s.connect(hp);hp.connect(g);g.connect(master);s.start(t0);
    }};
})();
$("snd").addEventListener("click",()=>$("snd").classList.toggle("on",Snd.toggle()));

/* ================= paper & grain ================= */
function makePaper(){
  const c=document.createElement("canvas");c.width=c.height=480;
  const x=c.getContext("2d"),rng=mulberry32(0x1a78);
  x.fillStyle="#808080";x.fillRect(0,0,480,480);
  for(let i=0;i<4200;i++){const g=110+rng()*90;
    x.fillStyle=`rgba(${g|0},${g|0},${g|0},${.02+rng()*.04})`;
    x.fillRect(rng()*480,rng()*480,1+rng()*2,1+rng()*2)}
  x.strokeStyle="rgba(130,120,140,.05)";
  for(let i=0;i<46;i++){x.beginPath();
    const px=rng()*480,py=rng()*480,a=rng()*Math.PI,l=8+rng()*26;
    x.moveTo(px,py);x.lineTo(px+Math.cos(a)*l,py+Math.sin(a)*l);x.stroke()}
  return c;
}
const paperC=makePaper();let paperPat=null;
const grainC=document.createElement("canvas");grainC.width=grainC.height=128;
const grainX=grainC.getContext("2d");
let grainPat=null,lastGrain=0;
function updateGrain(now){
  if(now-lastGrain<83)return;lastGrain=now;
  const img=grainX.createImageData(128,128),d=img.data;
  for(let i=0;i<d.length;i+=4){const v=118+Math.random()*20;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255}
  grainX.putImageData(img,0,0);grainPat=null;
}

/* ================= draw（氛围层：紫灰桌光、漂移斑、夜灯） ================= */
let t=0;
const dapples=[];(function(){const rng=mulberry32(0xdad1);
  for(let i=0;i<16;i++)dapples.push({nx:rng(),ny:rng(),r:30+rng()*70,ph:rng()*7,sp:(rng()-.5)*.3});
})();
function draw(now){
  const L=sampleLight(heure);
  ptr.sx+=(ptr.x-ptr.sx)*.08;ptr.sy+=(ptr.y-ptr.sy)*.08;
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,rgb(fade(L.far,FAM.chaux,.22)));g.addColorStop(1,rgb(fade(L.near,FAM.chaux,.16)));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  /* 紫灰碎色层 */
  for(let i=0;i<420;i++){
    const sx=(i*37.7)%W,sy=(i*23.9)%H;
    const p=sy/H;
    const c2=fade(lerpHSL(L.far,L.near,p),i%4?FAM.champ:FAM.chaux,(i%7)/7*.3);
    ctx.strokeStyle=rgb(c2,.10+((i*11)%10)/10*.08);
    ctx.lineWidth=1.5;
    const sl=6+((i*13)%18);
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+sl,sy+Math.sin(i*1.3)*1.6);ctx.stroke();
  }
  /* 漂移远紫斑 */
  dapples.forEach(d=>{
    d.nx+=d.sp*.0003;if(d.nx>1.15)d.nx=-.15;if(d.nx<-.15)d.nx=1.15;
    const x=d.nx*W,y=d.ny*H;
    const fl=.5+.5*Math.sin(t*.5+d.ph);
    ctx.fillStyle=rgb(FAM.lointain,.08*fl);
    ctx.beginPath();ctx.ellipse(x,y,d.r,d.r*.5,0,0,7);ctx.fill();
  });
  /* 手心的光池 */
  if(ptr.inC){
    const pg=ctx.createRadialGradient(ptr.sx,ptr.sy,0,ptr.sx,ptr.sy,160);
    pg.addColorStop(0,rgb(FAM.chaux,.12));pg.addColorStop(1,rgb(FAM.chaux,0));
    ctx.fillStyle=pg;ctx.beginPath();ctx.arc(ptr.sx,ptr.sy,160,0,7);ctx.fill();
  }
  /* 夜灯（右上，暖金，黄昏后点起） */
  if(L.lamp>.03){
    const lx=W-90,ly=80;
    const lg=ctx.createRadialGradient(lx,ly,0,lx,ly,260);
    lg.addColorStop(0,rgb(FAM.lampe,.34*L.lamp));lg.addColorStop(1,rgb(FAM.lampe,0));
    ctx.fillStyle=lg;ctx.beginPath();ctx.arc(lx,ly,260,0,7);ctx.fill();
    ctx.fillStyle=rgb(FAM.chaux,.85*L.lamp);
    ctx.beginPath();ctx.arc(lx,ly,3.6,0,7);ctx.fill();
  }
  /* 纸纹 + 颗粒 */
  if(!paperPat)paperPat=ctx.createPattern(paperC,"repeat");
  ctx.save();ctx.globalAlpha=.07;ctx.globalCompositeOperation="multiply";
  ctx.fillStyle=paperPat;ctx.fillRect(0,0,W,H);ctx.restore();
  updateGrain(now*1000);
  if(!grainPat)grainPat=ctx.createPattern(grainC,"repeat");
  if(grainPat){ctx.save();ctx.globalAlpha=.03;ctx.globalCompositeOperation="overlay";
    ctx.fillStyle=grainPat;ctx.fillRect(0,0,W,H);ctx.restore()}
  drawBloom(now*1000);
  syncTimer();
}

/* ================= boot ================= */
renderRail();renderProof(false);writeHash(); /* 首屏直出，不进显影动画 */
if(innerWidth<760){document.body.classList.add("snap","hideui");setTimeout(()=>document.body.classList.remove("snap"),700)}
let last=performance.now(),frameN=0;
(function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  t+=dt;frameN++;
  draw(now/1000);
  requestAnimationFrame(loop);
})(last);
