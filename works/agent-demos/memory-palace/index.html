<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mnemosyne — Agent 记忆池塘 · Atelier MIRA N°069 · 睡莲</title>
<!--
  Atelier MIRA · Étude N°069 · 睡莲 NYMPHÉAS（冷中带暖斑）
  家族锚点：#F2EFE6 水光 · #DCE4DA 浅漪 · #A9BFAD 柳绿 · #5F7D6E 深塘 · #7C8FA6 天光倒影 · #C9A6B4 莲粉
  工作记忆是近岸的七片莲叶，情景记忆漂在塘心，语义记忆沉成水底的星。
  检索是燕子点水：涟漪走到哪里，哪一段记忆就开成粉色。
-->
<style>
  :root{
    --ink:#3E5248; --dim:#6E8175; --paper:rgba(242,239,230,.9); --paper-solid:#F2EFE6;
    --line:rgba(95,125,110,.30); --accent:#9A6E84; --accent-soft:rgba(154,110,132,.12);
    --mono:"SF Mono",Menlo,Consolas,monospace;
    --serif:Didot,"Bodoni MT",Georgia,"Songti SC",serif;
    --sans:-apple-system,"Helvetica Neue","PingFang SC",sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body.booted *{transition:none!important}
  html,body{height:100%}
  body{background:#A9BFAD;color:var(--ink);font-family:var(--sans);overflow:hidden;
       -webkit-font-smoothing:antialiased}
  ::selection{background:var(--accent-soft)}
  button{font-family:inherit;color:inherit}
  canvas#pond{position:fixed;inset:0;width:100%;height:100%;display:block}

  header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:flex-start;
         gap:14px;padding:16px 22px 28px;pointer-events:none;
         background:linear-gradient(rgba(242,239,230,.55),rgba(242,239,230,0))}
  .seal{flex:0 0 auto;pointer-events:auto;opacity:.92}
  .etitle{padding-top:1px}
  .etitle .no{font-family:var(--mono);font-size:9.5px;letter-spacing:.26em;color:var(--accent)}
  .etitle h1{font-family:var(--serif);font-weight:400;font-size:22px;letter-spacing:.02em;margin-top:2px}
  .etitle h1 span{font-family:var(--sans);font-size:12.5px;color:var(--dim);margin-left:9px;letter-spacing:.06em}
  .etitle .epig{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--dim);
                margin-top:4px;letter-spacing:.04em}
  .hdr-right{margin-left:auto;display:flex;gap:8px;align-items:flex-start;pointer-events:auto}
  #snd{width:34px;height:34px;border:1px solid var(--line);background:var(--paper);
       backdrop-filter:blur(8px);cursor:pointer;display:flex;align-items:center;justify-content:center;
       transition:border-color .3s var(--ease);flex:0 0 auto}
  #snd:hover{border-color:var(--accent)}
  #snd svg{stroke:var(--dim);transition:stroke .3s}
  #snd.on svg{stroke:var(--accent)}
  #snd .waves{opacity:0;transition:opacity .4s}
  #snd.on .waves{opacity:1}

  /* 检索面板 */
  #recall{position:fixed;right:22px;top:126px;width:270px;max-height:52vh;overflow-y:auto;z-index:10;
          background:var(--paper);border:1px solid var(--line);backdrop-filter:blur(10px);
          transition:transform .5s var(--ease),opacity .5s var(--ease)}
  body.hideui #recall{transform:translateX(120%);opacity:0;pointer-events:none}
  .phead{position:sticky;top:0;background:var(--paper);padding:10px 13px 8px;border-bottom:1px solid var(--line);
         font-family:var(--mono);font-size:8.5px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase;
         display:flex;justify-content:space-between;z-index:2}
  .mem{padding:8px 13px;border-bottom:1px dashed var(--line);opacity:0;transform:translateY(6px);
       animation:memin .7s var(--ease) forwards}
  @keyframes memin{to{opacity:1;transform:none}}
  .mem .tx{font-size:11.5px;line-height:1.55}
  .mem .st{font-family:var(--mono);font-size:8px;letter-spacing:.12em;color:var(--dim);margin-top:3px}
  .mem .st b{font-weight:400;color:var(--accent)}

  /* 泊位：dock */
  .dock{position:fixed;left:22px;bottom:64px;z-index:10;display:flex;gap:7px;align-items:center;
        flex-wrap:wrap;max-width:min(600px,calc(100vw - 330px));
        transition:opacity .5s var(--ease),transform .5s var(--ease)}
  body.hideui .dock{opacity:0;pointer-events:none;transform:translateY(10px)}
  #q{width:180px;background:var(--paper);border:1px solid var(--line);color:var(--ink);
     font-family:var(--mono);font-size:11.5px;padding:9px 12px;outline:none;
     backdrop-filter:blur(8px);transition:border-color .3s}
  #q:focus{border-color:var(--accent)}
  .btn{font-family:var(--mono);font-size:9px;letter-spacing:.1em;padding:9px 12px;cursor:pointer;
       border:1px solid var(--line);background:var(--paper);color:var(--ink);
       transition:all .25s var(--ease);text-align:center;backdrop-filter:blur(8px)}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
  .sld{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);
       padding:5px 11px;backdrop-filter:blur(8px)}
  .sld .k{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.08em;white-space:nowrap}
  .sld .v{font-family:var(--mono);font-size:9px;color:var(--accent);font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;width:90px;height:16px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:2px;
      background:linear-gradient(90deg,var(--accent) var(--fill,50%),rgba(95,125,110,.28) var(--fill,50%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;margin-top:-4px;
      background:var(--paper-solid);border:2px solid var(--accent);border-radius:50%}
  input[type=range]::-moz-range-track{height:2px;background:rgba(95,125,110,.28)}
  input[type=range]::-moz-range-progress{height:2px;background:var(--accent)}
  input[type=range]::-moz-range-thumb{width:8px;height:8px;background:var(--paper-solid);
      border:2px solid var(--accent);border-radius:50%}

  /* time ruler */
  #timer{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:10;
         width:min(420px,54vw);background:var(--paper);border:1px solid var(--line);
         backdrop-filter:blur(10px);padding:8px 14px 10px;cursor:ew-resize;user-select:none;
         transition:opacity .5s var(--ease)}
  body.hideui #timer{opacity:0;pointer-events:none}
  #timer .face{position:relative;height:16px}
  #timer .track{position:absolute;left:0;right:0;top:8px;height:1px;background:var(--line)}
  #timer .tick{position:absolute;top:5px;width:1px;height:7px;background:var(--line)}
  #timer .sun{position:absolute;top:1px;width:14px;height:14px;margin-left:-7px;border-radius:50%;
      border:1.5px solid var(--accent);background:var(--paper-solid);pointer-events:none}
  #timer .sun::after{content:"";position:absolute;inset:3.5px;border-radius:50%;background:var(--accent);opacity:.85}
  #timer .lab{display:flex;justify-content:space-between;margin-top:5px;
      font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:var(--dim)}
  #timer .lab b{color:var(--accent);font-weight:400;font-variant-numeric:tabular-nums}

  #colo{position:fixed;right:22px;bottom:14px;z-index:10;display:flex;align-items:center;gap:8px;
        font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--ink);opacity:.68;cursor:pointer;
        transition:opacity .5s var(--ease)}
  #note{position:fixed;right:22px;bottom:44px;z-index:11;width:240px;background:var(--paper);
        border:1px solid var(--line);backdrop-filter:blur(10px);padding:12px 14px;
        font-family:var(--serif);font-style:italic;font-size:13px;line-height:1.7;color:var(--ink);
        opacity:0;transform:translateY(8px);pointer-events:none;transition:all .6s var(--ease)}
  #note.show{opacity:1;transform:none}
  #uibtn{position:fixed;left:22px;bottom:14px;z-index:10;font-family:var(--mono);font-size:9px;
         letter-spacing:.14em;color:var(--dim);background:var(--paper);border:1px solid var(--line);
         padding:6px 10px;cursor:pointer;backdrop-filter:blur(8px)}
  #uibtn:hover{color:var(--accent);border-color:var(--accent)}

  @media (max-width:760px){
    header{padding:12px 14px 20px;gap:10px}
    .seal svg{width:38px;height:38px}
    .etitle h1{font-size:16px}
    .etitle h1 span{font-size:11px}
    .etitle .epig{font-size:12px;max-width:56vw}
    #recall{right:14px;top:118px;width:min(270px,calc(100vw - 28px));max-height:32vh}
    .dock{left:14px;bottom:104px;max-width:calc(100vw - 28px)}
    #q{width:140px}
    #timer{width:calc(100vw - 110px);bottom:52px}
    body.hideui #timer{opacity:1;pointer-events:auto}
    #timer .lab span:last-child{display:none}
    #colo{right:14px;bottom:12px;font-size:8px}
    #uibtn{left:14px;bottom:12px}
  }
</style>
</head>
<body>

<header>
  <div class="seal">
    <svg width="50" height="50" viewBox="0 0 52 52" aria-label="Atelier MIRA seal">
      <circle cx="26" cy="26" r="24.6" fill="none" stroke="#9A6E84" stroke-width="1"/>
      <circle cx="26" cy="26" r="14.2" fill="none" stroke="#9A6E84" stroke-width=".55" opacity=".55"/>
      <path d="M18.4 33.4 V20.1 L25.9 29.9 L33.7 20.4 V33.1" fill="none" stroke="#9A6E84"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="etitle">
    <div class="no">ÉTUDE N°069 · AGENT-DEMOS</div>
    <h1>Mnemosyne<span>记忆池塘</span></h1>
    <div class="epig">「记忆沉得越深，越像水底的星。」</div>
  </div>
  <div class="hdr-right">
    <button id="snd" aria-label="环境声开关" title="环境声（默认关闭）">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke-width="1.3" stroke-linecap="round">
        <path d="M2 6.5v3h2.4L8 12.6V3.4L4.4 6.5H2z"/>
        <path class="waves" d="M10.2 5.2a4 4 0 0 1 0 5.6M12 3.4a6.4 6.4 0 0 1 0 9.2"/>
      </svg>
    </button>
  </div>
</header>

<canvas id="pond"></canvas>

<aside id="recall" aria-label="Rappel">
  <div class="phead"><span>RECALL · 捞起的记忆</span><span id="rcount">—</span></div>
  <div id="rlist"><div class="mem" style="opacity:1;animation:none"><div class="tx" style="color:var(--dim)">输入一个词，燕子替你点水。试试「巴黎」「咖啡」「影子」「糯米」。</div></div></div>
</aside>

<div class="dock">
  <input id="q" placeholder="检索记忆…" autocomplete="off" aria-label="检索记忆">
  <button class="btn" id="b-recall">检索 RECALL (C)</button>
  <button class="btn" id="b-encode">编码记忆 ENCODE (E)</button>
  <button class="btn on" id="b-auto">自动巩固 AUTO</button>
  <div class="sld"><span class="k">遗忘 OUBLI</span>
    <input type="range" id="s-decay" min="0" max="100" value="18" aria-label="遗忘速率">
    <span class="v" id="v-decay">慢</span></div>
</div>

<div id="timer" aria-label="时间轴">
  <div class="face" id="timerface">
    <div class="track"></div>
    <div class="sun" id="sundot"></div>
  </div>
  <div class="lab"><span id="t-phase">午后 L'ÉTANG</span><b id="t-clock">15:00</b><span>拖动 · 池塘的两种光</span></div>
</div>

<button id="uibtn" title="收起/展开面板 (H)">H · 面板</button>

<div id="note">塘底的星子都是曾经开过花的。没有什么被忘记，只是换了个深度发光。——画室手记 N°069</div>

<footer id="colo">
  <svg width="22" height="14" viewBox="0 0 64 40" fill="#5F7D6E" aria-hidden="true">
    <path d="M32 20 C 26 12, 14 6, 4 8 C 12 12, 18 18, 24 21
             C 14 20, 6 22, 2 28 C 10 26, 18 26, 25 26
             C 27 30, 30 34, 34 36 C 33 32, 33 28, 34 25
             C 42 22, 52 16, 62 4 C 54 10, 44 16, 36 19
             C 35 17, 33 17, 32 20 Z"/>
  </svg>
  <span>ATELIER MIRA · N°069 · 睡莲 NYMPHÉAS</span>
</footer>

<script>
"use strict";
const $=id=>document.getElementById(id);
const canvas=$("pond"),ctx=canvas.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener("resize",resize);resize();

/* ================= seed & hash ================= */
const hashParams=new URLSearchParams(location.hash.slice(1));
let seed=parseInt(hashParams.get("seed"),10);
if(!Number.isFinite(seed))seed=(Math.random()*8999+1000)|0;
let heure=hashParams.get("h")!==null?+hashParams.get("h"):(new Date().getHours()+new Date().getMinutes()/60);
if(!Number.isFinite(heure)||heure<0||heure>24)heure=15;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function writeHash(){
  history.replaceState(null,"","#"+new URLSearchParams({seed:String(seed),h:heure.toFixed(1)}).toString());
}

/* ================= colour helpers ================= */
function hx(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function rgb2hsl(c){const[r,g,b]=c.map(v=>v/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
  let h=0,s=0;const l=(mx+mn)/2;const d=mx-mn;
  if(d){s=d/(1-Math.abs(2*l-1));if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}
  return[h,s,l]}
function hsl2rgb(h,s,l){const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;
  let r,g,b;if(h<60){r=c;g=x;b=0}else if(h<120){r=x;g=c;b=0}else if(h<180){r=0;g=c;b=x}
  else if(h<240){r=0;g=x;b=c}else if(h<300){r=x;g=0;b=c}else{r=c;g=0;b=x}
  return[Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)]}
function lerpHSL(a,b,k){const A=rgb2hsl(a),B=rgb2hsl(b);let dh=B[0]-A[0];
  if(dh>180)dh-=360;if(dh<-180)dh+=360;
  return hsl2rgb(A[0]+dh*k,A[1]+(B[1]-A[1])*k,A[2]+(B[2]-A[2])*k)}
function fade(col,target,k){const A=rgb2hsl(col),B=rgb2hsl(target);
  return hsl2rgb(A[0],A[1]+(B[1]-A[1])*k*.8,A[2]+(B[2]-A[2])*k)}
const rgb=(c,a)=>a===undefined?`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`:`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

/* ================= 睡莲家族 + heure ================= */
const FAM={eau:hx("#F2EFE6"),rip:hx("#DCE4DA"),saule:hx("#A9BFAD"),prof:hx("#5F7D6E"),
           ciel:hx("#7C8FA6"),rose:hx("#C9A6B4")};
const KEYS=[
  {h:0,   sky:hx("#5F7D6E"),wat:hx("#6E8478"),far:hx("#7A8E8A"),near:hx("#647A6E"),warm:.1},
  {h:5,   sky:hx("#8A98A0"),wat:hx("#94A49E"),far:hx("#9AAEA2"),near:hx("#849A88"),warm:.3},
  {h:7,   sky:hx("#B4C2C4"),wat:hx("#C0CCC2"),far:hx("#C2D2C2"),near:hx("#A2B89E"),warm:.5},
  {h:10,  sky:hx("#AEC2C6"),wat:hx("#C6D2C8"),far:hx("#C4D4C4"),near:hx("#A9BFAD"),warm:.35},
  {h:13,  sky:hx("#A6BEC4"),wat:hx("#CCD6CC"),far:hx("#C8D6C4"),near:hx("#AFC2AE"),warm:.3},
  {h:16,  sky:hx("#AEB8B4"),wat:hx("#C4CAB4"),far:hx("#C2C9AE"),near:hx("#A8B498"),warm:.6},
  {h:18.2,sky:hx("#B4A094"),wat:hx("#C2AC98"),far:hx("#BCA992"),near:hx("#A89878"),warm:.9},
  {h:19.8,sky:hx("#7E766E"),wat:hx("#8A7E72"),far:hx("#8C8272"),near:hx("#7A7260"),warm:.55},
  {h:21,  sky:hx("#66786E"),wat:hx("#707E74"),far:hx("#76847A"),near:hx("#68766A"),warm:.2},
  {h:24,  sky:hx("#5F7D6E"),wat:hx("#6E8478"),far:hx("#7A8E8A"),near:hx("#647A6E"),warm:.1},
];
function sampleLight(h){
  h=((h%24)+24)%24;
  let i=0;while(i<KEYS.length-2&&KEYS[i+1].h<h)i++;
  const a=KEYS[i],b=KEYS[i+1],k=Math.min(1,Math.max(0,(h-a.h)/(b.h-a.h)));
  const e=k*k*(3-2*k);
  return{sky:lerpHSL(a.sky,b.sky,e),wat:lerpHSL(a.wat,b.wat,e),
         far:lerpHSL(a.far,b.far,e),near:lerpHSL(a.near,b.near,e),
         warm:a.warm+(b.warm-a.warm)*e};
}
function phaseName(h){
  if(h<4.5||h>=21.5)return"夜 · 塘底有星";
  if(h<6)return"拂晓 AVANT L'AUBE";
  if(h<9)return"清晨 L'AUBE";
  if(h<11.5)return"上午 LE MATIN";
  if(h<15)return"正午 MIDI";
  if(h<17.5)return"午后 · 水面上的下午";
  if(h<19.8)return"暮光 LE SOIR";
  return"入夜 LA TOMBÉE";
}
function sunPos(){
  const day=heure>=5.5&&heure<=19.8;
  const k=day?(heure-5.5)/14.3:((heure+24-20.5)%24)/9;
  return{x:W*(.16+.68*Math.min(1,Math.max(0,k))),day};
}

/* ================= 记忆数据 ================= */
const POOL=[
  {tx:"用户偏好：咖啡手冲、不加糖",kw:["咖啡","糖","手冲"]},
  {tx:"调试笔记：指针阻尼 0.08 手感最好",kw:["调试","阻尼","手感"]},
  {tx:"巴黎是用户最喜欢的城市",kw:["巴黎","城市"]},
  {tx:"猫的名字叫糯米",kw:["猫","糯米"]},
  {tx:"用户说：影子要用蓝紫，不许用黑",kw:["影子","蓝紫"]},
  {tx:"莫奈《睡莲》展签摘抄：水面上的下午",kw:["莫奈","睡莲","展"]},
  {tx:"常用栈：Canvas 2D，不依赖框架",kw:["栈","Canvas","框架"]},
  {tx:"晨跑路线：河边 6 公里，过两座桥",kw:["跑步","河","桥"]},
  {tx:"灵感：把评测画成麦田，把护栏画成篱笆",kw:["灵感","麦田","篱笆"]},
  {tx:"书单：《艺术与视知觉》读到第四章",kw:["书","艺术"]},
  {tx:"厌恶清单：霓虹蓝紫渐变、synthwave 夕阳",kw:["霓虹","渐变","厌恶"]},
  {tx:"生日在深秋，银杏正好",kw:["生日","深秋","银杏"]},
  {tx:"五道口那家湘菜，剁椒鱼头免辣",kw:["餐厅","湘菜","五道口"]},
  {tx:"燕子母题的 path 已定稿，一百件共用",kw:["燕子","母题"]},
  {tx:"凡尔赛宫外的自行车道，秋天最好",kw:["凡尔赛","自行车","秋天"]},
  {tx:"HSL 插值锁色相，否则远山会发绿",kw:["HSL","插值","发绿"]},
];
let ITEMS=[],incoming=[],pads=[],stones=[],veils=[];
function ringPos(i,n){
  const cx=W*.24,cy=H*.60,R=Math.min(W,H)*.17;
  const a=-Math.PI/2+i/n*Math.PI*2;
  return{x:cx+Math.cos(a)*R,y:cy+Math.sin(a)*R*.82};
}
function layoutPond(){
  const rng=mulberry32(seed^0x11a);
  incoming=POOL.map(x=>({...x})).sort(()=>rng()-.5);
  ITEMS=[];

  if(!incoming.length)return;
  const it={...incoming.pop(),stage:0,decay:1,ph:Math.random()*7,glow:0,bloom:0};
  ITEMS.push(it);
  const p=ringPos(ITEMS.filter(x=>x.stage===0).length-1,7);
  for(let r=0;r<3;r++)ripples.push({x:p.x,y:p.y,r:5+r*9,life:1-r*.2,pink:false});
  const work=ITEMS.filter(x=>x.stage===0);
  if(work.length>7){
    const old=work[0];old.stage=0.5;
    anims.push({it:old,from:itemPos(old)||ringPos(0,7),
      to:{x:W*(.42+Math.random()*.4),y:H*(.38+Math.random()*.34)},t:0,dur:2.2,end:1});

      to:{x:W*(.35+Math.random()*.5),y:H*(.8+Math.random()*.14)},t:0,dur:2.8,end:2});

/* ================= sound：水滴 + 五声音簇 (L5, 默认 OFF) ================= */
const Snd=(()=>{
  let ac=null,master=null,on=false,dropTimer=null;
  function build(){
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain();master.gain.value=0;master.connect(ac.destination);
  }
  function drop(v){
    if(!on)return;
    const t0=ac.currentTime+.02;
    const o=ac.createOscillator(),g=ac.createGain();
    o.type="sine";
    o.frequency.setValueAtTime(1600+Math.random()*400,t0);
    o.frequency.exponentialRampToValueAtTime(520,t0+.045);
    g.gain.setValueAtTime(.04*(v||1),t0);
    g.gain.exponentialRampToValueAtTime(.0004,t0+.09);
    o.connect(g);g.connect(master);o.start(t0);o.stop(t0+.12);
    dropTimer=setTimeout(()=>drop(1),(2+Math.random()*6)*1000);
  }
  return{
    toggle(){
      if(!ac)build();
      if(ac.state==="suspended")ac.resume();
      on=!on;
      master.gain.cancelScheduledValues(ac.currentTime);
      master.gain.linearRampToValueAtTime(on?1:0,ac.currentTime+1.5);
      if(on)drop(1);else clearTimeout(dropTimer);
      localStorage.setItem("mira-snd-069",on?"1":"0");
      return on;
    },
    cluster(){
      if(!on)return;
      const scale=[523.25,587.33,659.25,783.99,880];
      const n=2+(Math.random()*2|0);
      const picks=[];while(picks.length<n)picks.push(scale[Math.random()*scale.length|0]);
      picks.forEach((f,i)=>{
        const t0=ac.currentTime+.1+i*.14;
        const o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain();
        o.type="sine";o.frequency.value=f;o2.type="sine";o2.frequency.value=f*1.004;
        g.gain.setValueAtTime(0,t0);
        g.gain.linearRampToValueAtTime(.05,t0+.05);
        g.gain.exponentialRampToValueAtTime(.0004,t0+3.2);
        o.connect(g);o2.connect(g);g.connect(master);
        o.start(t0);o2.start(t0);o.stop(t0+3.4);o2.stop(t0+3.4);
      });
    }
  };
})();

/* ================= 位置与物理 ================= */
function itemPos(it){
  if(it.stage===0){
    const idx=ITEMS.filter(x=>x.stage===0).indexOf(it);
    const p=ringPos(idx,7);
    return{x:p.x+Math.sin(t*1.1+it.ph)*3,y:p.y+Math.cos(t*.9+it.ph)*2.4};
  }
  if(it.stage===1)return{x:it.x+Math.sin(t*.8+it.ph)*4,y:it.y+Math.cos(t*.7+it.ph)*3};
  if(it.stage===2)return{x:it.x,y:it.y};
  const an=anims.find(a=>a.it===it);
  if(an){
    const k=Math.min(1,an.t/an.dur),e=k*k*(3-2*k);
    return{x:an.from.x+(an.to.x-an.from.x)*e,
           y:an.from.y+(an.to.y-an.from.y)*e};
  }
  return null;
}

let t=0;
function physics(dt){
  ITEMS.forEach(it=>{
    if(it.stage===0)it.decay=Math.max(.25,it.decay-DECAY*dt*.02);
    it.glow=Math.max(0,it.glow-dt*.4);
    if(it.bloom>0)it.bloom=Math.max(0,it.bloom-dt*.25);
  });
  if(auto){autoT-=dt;if(autoT<=0){autoT=9+Math.random()*6;encode()}}
  for(let i=anims.length-1;i>=0;i--){
    const a=anims[i];a.t+=dt;
    if(a.t>=a.dur){
      a.it.stage=a.end;a.it.x=a.to.x;a.it.y=a.to.y;
      for(let r=0;r<2;r++)ripples.push({x:a.to.x,y:a.to.y,r:4+r*8,life:.8-r*.2,pink:false});
      anims.splice(i,1);
    }
  }
  for(let i=ripples.length-1;i>=0;i--){
    const r=ripples[i];r.life-=dt*.75;r.r+=dt*46;
    if(r.life<=0)ripples.splice(i,1);
  }
  if(swallow){
    swallow.t+=dt;
    const sp=W/2.6;
    swallow.x+=sp*dt;
    const dipK=Math.sin(Math.min(1,swallow.t/2.2)*Math.PI);
    swallow.y=H*.3+dipK*dipK*H*.34;
    if(!swallow.dip&&dipK>.96){
      swallow.dip=true;
      const tx=swallow.x,ty=swallow.y;
      for(let r=0;r<4;r++)ripples.push({x:tx,y:ty,r:6+r*12,life:1.2-r*.2,pink:true});
      swallow.hits.forEach(it=>{
        const p=itemPos(it);
        if(!p)return;
        const d=Math.hypot(p.x-tx,p.y-ty);
        setTimeout(()=>{it.bloom=1;it.glow=1;
          ripples.push({x:p.x,y:p.y,r:4,life:.8,pink:true});
        },300+d*1.1);
      });
    }
    if(swallow.x>W+80)swallow=null;
  }

/* ================= draw ================= */
function padDraw(x,y,r,ph,notch,L,alpha){
  ctx.globalAlpha=alpha===undefined?1:alpha;
  const c1=fade(FAM.saule,L.near,.25),c2=fade(FAM.prof,L.near,.2);
  for(let k=0;k<8;k++){
    const a=ph+k*.78,rr=r*(.6+((k*37)%10)/22);
    ctx.fillStyle=rgb(k%2?c1:c2,.8);
    ctx.beginPath();
    ctx.ellipse(x+Math.cos(a)*r*.22,y+Math.sin(a)*r*.12,rr*.6,rr*.34,a,0,7);
    ctx.fill();
  }
  ctx.fillStyle=rgb(lerpHSL(L.far,L.near,y/H),.9);
  ctx.beginPath();ctx.moveTo(x,y);
  ctx.arc(x,y,r*.95,notch,notch+.5);ctx.closePath();ctx.fill();
  ctx.fillStyle=rgb(FAM.eau,.4);
  ctx.beginPath();ctx.arc(x-r*.15,y-r*.08,r*.14,0,7);ctx.fill();
  ctx.globalAlpha=1;
}
function budDraw(x,y,it,L){
  const glow=Math.max(it.glow,it.bloom);
  const open=it.bloom;
  const baseC=it.stage===2?fade(FAM.ciel,FAM.prof,.3)
             :open>.15?lerpHSL(FAM.rose,hx("#D9B7C4"),open*.5)
             :fade(FAM.eau,L.wat,.2);
  if(glow>.03){
    const gg=ctx.createRadialGradient(x,y-6,0,x,y-6,26+glow*22);
    const gc=open>.15?FAM.rose:FAM.eau;
    gg.addColorStop(0,rgb(gc,.5*glow));gg.addColorStop(1,rgb(gc,0));
    ctx.fillStyle=gg;ctx.beginPath();ctx.arc(x,y-6,26+glow*22,0,7);ctx.fill();
  }
  ctx.globalAlpha=it.decay;
  if(it.stage===2){
    const tw=.5+.5*Math.sin(t*1.4+it.ph);
    ctx.fillStyle=rgb(baseC,.5+.4*tw);
    ctx.beginPath();ctx.arc(x,y,2.2,0,7);ctx.fill();
    ctx.fillStyle=rgb(FAM.eau,.35*tw);
    ctx.beginPath();ctx.arc(x,y,4.5,0,7);ctx.fill();
  }else{
    const h=6+open*6;
    for(let k=0;k<3;k++){
      const a=it.ph+k*2.1;
      ctx.fillStyle=rgb(k===1?lerpHSL(baseC,FAM.rose,.3):baseC,.9);
      ctx.beginPath();
      ctx.ellipse(x+Math.cos(a)*2.4,y-h*.5+Math.sin(a)*1.4,2.6,h*.52,a*.4,0,7);
      ctx.fill();
    }
    ctx.fillStyle=rgb(FAM.eau,.7);
    ctx.beginPath();ctx.arc(x-1,y-h+1,1,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function draw(now){

  wg.addColorStop(1,rgb(fade(L.near,FAM.prof,.45)));

  /* 日光碎金路 */
  if(sun.day&&L.warm>.15){

  ctx.fillStyle=rgb(inkZone,.62);

  ctx.fillText("语义记忆 · SEMANTIC · 塘底的星",W*.84,H*.93);
  /* 柳枝 */
  ctx.strokeStyle=rgb(fade(FAM.prof,L.sky,.1),.78);
  const sway=Math.sin(t*.9)*8;
  for(let b=0;b<3;b++){

    ctx.moveTo(W*(.86+b*.05),-4);
    ctx.quadraticCurveTo(W*(.84+b*.045)+sway,H*.14+b*H*.05,W*(.79+b*.04)+sway*1.6,H*(.26+b*.07));
    ctx.stroke();

  /* --- 晨雾 --- */
  const mistK=(1-dayF)*.5+(L.warm<.4?.3:.1);
  veils.forEach(v=>{
    v.nx+=v.sp*.0002;if(v.nx>1.3)v.nx=-.3;if(v.nx<-.3)v.nx=1.3;
    const x=v.nx*W,y=v.ny*H;
    const mg=ctx.createRadialGradient(x,y,0,x,y,v.R);
    mg.addColorStop(0,rgb(FAM.eau,.13*mistK));mg.addColorStop(1,rgb(FAM.eau,0));
    ctx.fillStyle=mg;ctx.beginPath();ctx.arc(x,y,v.R,0,7);ctx.fill();
  });
  /* --- 燕子 --- */
  if(swallow){
    ctx.save();
    ctx.translate(swallow.x,swallow.y);
    ctx.scale(.55,.55);
    ctx.rotate(Math.sin(swallow.t*6)*.1);
    const flap=Math.sin(swallow.t*11)*.18;
    ctx.scale(1,1+flap);
    ctx.fillStyle=rgb(fade(FAM.prof,L.near,.2),.9);
    ctx.fill(swallowP2D);
    ctx.restore();
  }
  /* --- 夜：塘面映星 --- */
  if(dayF<.4){
    for(let i=0;i<26;i++){
      const x=((i*97)%100)/100*W,y=((i*57)%42)/100*H;
      const tw=.4+.6*Math.abs(Math.sin(t*.8+i*2.3));
      ctx.fillStyle=rgb(FAM.eau,(.4-dayF)*1.4*tw*.5);
      ctx.fillRect(x,y,1.4,1.4);
    }
  }
  /* --- 纸纹 + 颗粒 --- */
  if(!paperPat)paperPat=ctx.createPattern(paperC,"repeat");
  ctx.save();ctx.globalAlpha=.07;ctx.globalCompositeOperation="multiply";
  ctx.fillStyle=paperPat;ctx.fillRect(0,0,W,H);ctx.restore();
  updateGrain(now);
  if(!grainPat)grainPat=ctx.createPattern(grainC,"repeat");
  if(grainPat){ctx.save();ctx.globalAlpha=.03;ctx.globalCompositeOperation="overlay";
    ctx.fillStyle=grainPat;ctx.fillRect(0,0,W,H);ctx.restore()}
  syncTimer();
}

/* ================= boot ================= */
layoutPond();writeHash();
if(innerWidth<760){document.body.classList.add("hideui","booted");
  setTimeout(()=>document.body.classList.remove("booted"),400)}
/* QA/分享：#q=词 启动即检索（燕子点水） */
if(hashParams.get("q")){$("q").value=hashParams.get("q");setTimeout(recall,500)}
let last=performance.now();
(function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  t+=dt;
  physics(dt);
  draw(now);
  requestAnimationFrame(loop);
})(last);
</script>
