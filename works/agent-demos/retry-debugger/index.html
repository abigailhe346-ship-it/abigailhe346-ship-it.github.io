<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retry Debugger — 风中的退避小径 · Atelier MIRA N°075 · 罂粟田</title>
<!--
  Atelier MIRA · Étude N°075 · 罂粟田 CHAMP DE COQUELICOTS（阿让特伊的夏午，≈5600K）
  家族锚点：#B7C98B 草甸 · #7A9A5B 深草 · #8FA3B8 远天 · #E4D9C2 小径 · #6B5D4F 泥土 · #B43A2E 罂粟红（唯一的纯色，≤8%，只许点状）
  面积配比：草 50% / 天 22% / 小径与泥土 18% / 罂粟 ≤8% 点状。阴影走泥土褐绿，不用黑灰。
  退避曲线是一条穿过草甸的小径：每一次尝试是一根测风杆，失败开一朵罂粟，
  熔断是小径尽头那扇木门。按住 INJECT，风暴就来了。
-->
<style>
  :root{
    --ink:#4A4433; --dim:#7E7660; --paper:rgba(228,217,194,.9); --paper-solid:#E4D9C2;
    --line:rgba(107,93,79,.32); --accent:#6B5D4F; --poppy:#B43A2E; --accent-soft:rgba(107,93,79,.14);
    --mono:"SF Mono",Menlo,Consolas,monospace;
    --serif:Didot,"Bodoni MT",Georgia,"Songti SC",serif;
    --sans:-apple-system,"Helvetica Neue","PingFang SC",sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#B7C98B;color:var(--ink);font-family:var(--sans);overflow:hidden;
       -webkit-font-smoothing:antialiased}
  ::selection{background:var(--accent-soft)}
  button{font-family:inherit;color:inherit}
  .snap *{transition:none!important}
  canvas#field{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:flex-start;
         gap:14px;padding:18px 22px 30px;pointer-events:none;
         background:linear-gradient(rgba(228,217,194,.5),rgba(228,217,194,0))}
  .seal{flex:0 0 auto;pointer-events:auto;opacity:.92}
  .etitle{padding-top:1px}
  .etitle .no{font-family:var(--mono);font-size:9.5px;letter-spacing:.26em;color:var(--accent)}
  .etitle h1{font-family:var(--serif);font-weight:400;font-size:22px;letter-spacing:.02em;margin-top:2px}
  .etitle h1 span{font-family:var(--sans);font-size:12.5px;color:var(--dim);margin-left:9px;letter-spacing:.06em}
  .etitle .epig{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--dim);
                margin-top:5px;letter-spacing:.04em}
  .hdr-right{margin-left:auto;display:flex;gap:8px;align-items:flex-start;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}

  #snd{width:34px;height:34px;border:1px solid var(--line);background:var(--paper);
       backdrop-filter:blur(8px);cursor:pointer;display:flex;align-items:center;justify-content:center;
       transition:border-color .3s var(--ease);flex:0 0 auto}
  #snd:hover{border-color:var(--accent)}
  #snd svg{stroke:var(--dim);transition:stroke .3s}
  #snd.on svg{stroke:var(--accent)}
  #snd .waves{opacity:0;transition:opacity .4s}
  #snd.on .waves{opacity:1}

  #etudes{display:flex;border:1px solid var(--line);background:var(--paper);backdrop-filter:blur(8px)}
  #etudes button{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--dim);
               background:transparent;border:0;padding:9px 12px;cursor:pointer;transition:all .3s var(--ease)}
  #etudes button:hover{color:var(--ink)}
  #etudes button.on{color:var(--paper-solid);background:var(--accent)}

  #desk{position:fixed;left:22px;bottom:64px;z-index:10;width:248px;
        background:var(--paper);border:1px solid var(--line);backdrop-filter:blur(10px);
        padding:14px 16px 15px;transition:transform .5s var(--ease),opacity .5s var(--ease)}
  .desklabel{font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--dim);margin-bottom:10px}
  .srow{margin-bottom:9px}
  .srow .head{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;
              letter-spacing:.06em;color:var(--dim);margin-bottom:3px}
  .srow .head .v{color:var(--ink)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:
      linear-gradient(90deg,var(--accent) var(--fill,50%),rgba(107,93,79,.22) var(--fill,50%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
      background:var(--paper-solid);border:2px solid var(--accent);margin-top:-4.5px;transition:transform .2s var(--ease)}
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.25)}
  input[type=range]::-moz-range-track{height:2px;background:rgba(107,93,79,.22)}
  input[type=range]::-moz-range-progress{height:2px;background:var(--accent)}
  input[type=range]::-moz-range-thumb{width:9px;height:9px;border-radius:50%;
      background:var(--paper-solid);border:2px solid var(--accent)}
  .deskbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .btn{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--dim);
       border:1px solid var(--line);background:transparent;padding:7px 10px;cursor:pointer;
       transition:all .3s var(--ease)}
  .btn:hover{color:var(--ink);border-color:var(--accent)}
  .btn.on{color:var(--paper-solid);background:var(--accent);border-color:var(--accent)}
  .btn.poppy.on{color:var(--paper-solid);background:var(--poppy);border-color:var(--poppy)}
  .btn.full{flex:1 1 100%}
  .metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px 8px;margin-top:11px;
           font-family:var(--mono);font-size:9px;color:var(--dim)}
  .metrics b{display:block;font-size:12px;color:var(--ink);font-weight:500;margin-top:1px}
  body.hideui #desk,body.hideui #log{transform:translateX(-130%);opacity:0;pointer-events:none}

  /* 事件手记 */
  #log{position:fixed;right:22px;bottom:64px;z-index:10;width:280px;
       background:var(--paper);border:1px solid var(--line);backdrop-filter:blur(10px);
       padding:11px 13px;font-family:var(--mono);font-size:9.5px;line-height:1.85;color:var(--dim);
       transition:transform .5s var(--ease),opacity .5s var(--ease);max-height:172px;overflow:hidden}
  #log .llabel{font-size:8.5px;letter-spacing:.22em;margin-bottom:5px}
  #log .ev b{color:var(--ink);font-weight:500}
  #log .ev.bad b{color:var(--poppy)}
  body.hideui #log{transform:translateX(130%)}

  #timer{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:10;width:min(430px,72vw);
         background:var(--paper);border:1px solid var(--line);backdrop-filter:blur(10px);
         padding:9px 14px 8px;cursor:ew-resize;user-select:none;touch-action:none}
  #timer .face{position:relative;height:12px;margin-bottom:5px}
  #timer .track{position:absolute;left:0;right:0;top:5px;height:2px;
                background:linear-gradient(90deg,#6B5D4F,#8FA3B8 22%,#E4D9C2 50%,#E8B96F 74%,#6B5D4F)}
  #timer .tick{position:absolute;top:2px;width:1px;height:8px;background:rgba(107,93,79,.3)}
  #timer .sun{position:absolute;top:1px;width:10px;height:10px;border-radius:50%;
              background:#E4D9C2;border:2px solid var(--accent);transform:translateX(-50%);
              box-shadow:0 0 0 3px rgba(228,217,194,.35)}
  #timer .lab{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;
              letter-spacing:.12em;color:var(--dim)}
  #timer .lab b{color:var(--ink);font-weight:500}

  #uibtn{position:fixed;left:22px;bottom:16px;z-index:11;font-family:var(--mono);font-size:9.5px;
         letter-spacing:.12em;color:var(--dim);background:var(--paper);border:1px solid var(--line);
         padding:8px 12px;cursor:pointer;transition:all .3s var(--ease);backdrop-filter:blur(8px)}
  #uibtn:hover{color:var(--ink);border-color:var(--accent)}

  #note{position:fixed;right:22px;bottom:56px;z-index:11;width:min(320px,80vw);
        font-family:var(--serif);font-style:italic;font-size:13.5px;line-height:1.65;color:var(--ink);
        background:var(--paper);border:1px solid var(--line);padding:16px 18px;
        opacity:0;transform:translateY(8px);pointer-events:none;
        transition:opacity .6s var(--ease),transform .6s var(--ease);backdrop-filter:blur(10px);z-index:12}
  #note.show{opacity:1;transform:translateY(0)}

  #colo{position:fixed;right:22px;bottom:16px;z-index:10;display:flex;align-items:center;gap:8px;
        font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--ink);opacity:.68;
        cursor:pointer;user-select:none}

  @media (max-width:760px){
    header{padding:12px 14px 22px;gap:10px}
    .etitle h1{font-size:17px}
    .etitle h1 span{display:block;margin:2px 0 0}
    .etitle .epig{font-size:12px}
    #desk{width:calc(100vw - 28px);left:14px;bottom:60px}
    #log{display:none}
    #etudes{display:none}
    #timer{width:calc(100vw - 120px);bottom:12px}
    #timer .lab span:last-child{display:none}
    #colo{right:14px;bottom:12px;font-size:8px}
    #uibtn{left:14px;bottom:12px}
  }
</style>
</head>
<body>

<header>
  <div class="seal">
    <svg width="50" height="50" viewBox="0 0 52 52" aria-label="Atelier MIRA seal">
      <circle cx="26" cy="26" r="24.6" fill="none" stroke="#6B5D4F" stroke-width="1"/>
      <circle cx="26" cy="26" r="14.2" fill="none" stroke="#6B5D4F" stroke-width=".55" opacity=".55"/>
      <path d="M18.4 33.4 V20.1 L25.9 29.9 L33.7 20.4 V33.1" fill="none" stroke="#6B5D4F"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="etitle">
    <div class="no">ÉTUDE N°075 · AGENT-DEMOS</div>
    <h1>Retry Debugger<span>风中的退避小径</span></h1>
    <div class="epig">「失败开一朵罂粟，修好一朵，田还是那片田。」</div>
  </div>
  <div class="hdr-right">
    <div id="etudes" role="group" aria-label="Études 练习曲">
      <button data-e="brise" class="on">微风 BRISE</button>
      <button data-e="rafale">阵风 RAFALE</button>
      <button data-e="orage">风暴 ORAGE</button>
    </div>
    <button id="snd" aria-label="环境声开关" title="环境声（默认关闭）">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke-width="1.3" stroke-linecap="round">
        <path d="M2 6.5v3h2.4L8 12.6V3.4L4.4 6.5H2z"/>
        <path class="waves" d="M10.2 5.2a4 4 0 0 1 0 5.6M12 3.4a6.4 6.4 0 0 1 0 9.2"/>
      </svg>
    </button>
  </div>
</header>

<canvas id="field"></canvas>

<aside id="desk" aria-label="Réglage">
  <div class="desklabel">RÉGLAGE · 风与门</div>
  <div class="srow">
    <div class="head"><span class="k">基础退避 BASE</span><span class="v" id="v-base">400 ms</span></div>
    <input type="range" id="s-base" min="100" max="1200" step="50" value="400" aria-label="基础退避">
  </div>
  <div class="srow">
    <div class="head"><span class="k">最大尝试 ESSAIS</span><span class="v" id="v-max">6</span></div>
    <input type="range" id="s-max" min="3" max="8" value="6" aria-label="最大尝试">
  </div>
  <div class="srow">
    <div class="head"><span class="k">故障率 CHAOS</span><span class="v" id="v-chaos">35%</span></div>
    <input type="range" id="s-chaos" min="0" max="90" value="35" aria-label="故障率">
  </div>
  <div class="deskbtns">
    <button class="btn full" id="b-run">出发 RUN · 沿小径走一遍 (空格)</button>
    <button class="btn poppy" id="b-inject">按住风暴 INJECT</button>
    <button class="btn" id="b-reset">重置 R</button>
    <button class="btn" id="b-regen">SEED (G)</button>
    <button class="btn" id="b-png">SAVE PNG (S)</button>
  </div>
  <div class="metrics">
    <div>出发<b id="m-runs">0</b></div>
    <div>抵达<b id="m-ok">0</b></div>
    <div>熔断<b id="m-trip">0</b></div>
  </div>
</aside>

<aside id="log" aria-label="事件手记">
  <div class="llabel">CARNET · 事件手记</div>
  <div id="log-body"></div>
</aside>

<div id="timer" aria-label="时间轴">
  <div class="face" id="timerface">
    <div class="track"></div>
    <div class="sun" id="sundot"></div>
  </div>
  <div class="lab"><span id="t-phase">夏午 L'ÉTÉ</span><b id="t-clock">13:00</b><span>拖动 · 罂粟向光转头</span></div>
</div>

<button id="uibtn" title="收起/展开面板 (H)">H · 面板</button>

<div id="note">退避不是退缩，是风停一下再吹。那扇木门关上的声音，比一百条告警都诚实。——画室手记 N°075</div>

<footer id="colo">
  <svg width="22" height="14" viewBox="0 0 64 40" fill="#4A4433" aria-hidden="true">
    <path d="M32 20 C 26 12, 14 6, 4 8 C 12 12, 18 18, 24 21
             C 14 20, 6 22, 2 28 C 10 26, 18 26, 25 26
             C 27 30, 30 34, 34 36 C 33 32, 33 28, 34 25
             C 42 22, 52 16, 62 4 C 54 10, 44 16, 36 19
             C 35 17, 33 17, 32 20 Z"/>
  </svg>
  <span>ATELIER MIRA · N°075 · 罂粟田 COQUELICOTS</span>
</footer>

<script>
"use strict";
const $=id=>document.getElementById(id);
const canvas=$("field"),ctx=canvas.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);layoutField()}
addEventListener("resize",resize);

/* ================= seed & hash ================= */
const hashParams=new URLSearchParams(location.hash.slice(1));
let seed=parseInt(hashParams.get("seed"),10);
if(!Number.isFinite(seed))seed=(Math.random()*8999+1000)|0;
let heure=hashParams.get("h")!==null?+hashParams.get("h"):(new Date().getHours()+new Date().getMinutes()/60);
if(!Number.isFinite(heure)||heure<0||heure>24)heure=13;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function writeHash(){
  const p=new URLSearchParams({seed:String(seed),h:heure.toFixed(1)});
  history.replaceState(null,"","#"+p.toString());
}

/* ================= colour helpers ================= */
function hx(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function rgb2hsl(c){const[r,g,b]=c.map(v=>v/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
  let h=0,s=0;const l=(mx+mn)/2;const d=mx-mn;
  if(d){s=d/(1-Math.abs(2*l-1));if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}
  return[h,s,l]}
function hsl2rgb(h,s,l){const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;
  let r,g,b;if(h<60){r=c;g=x;b=0}else if(h<120){r=x;g=c;b=0}else if(h<180){r=0;g=c;b=x}
  else if(h<240){r=0;g=x;b=c}else if(h<300){r=x;g=0;b=c}else{r=c;g=0;b=x}
  return[Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)]}
function lerpHSL(a,b,k){const A=rgb2hsl(a),B=rgb2hsl(b);let dh=B[0]-A[0];
  if(dh>180)dh-=360;if(dh<-180)dh+=360;
  return hsl2rgb(A[0]+dh*k,A[1]+(B[1]-A[1])*k,A[2]+(B[2]-A[2])*k)}
function fade(col,target,k){const A=rgb2hsl(col),B=rgb2hsl(target);
  return hsl2rgb(A[0],A[1]+(B[1]-A[1])*k*.8,A[2]+(B[2]-A[2])*k)}
const rgb=(c,a)=>a===undefined?`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`:`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

/* ================= 罂粟田家族 + heure ================= */
const FAM={pre:hx("#B7C98B"),herbe:hx("#7A9A5B"),ciel:hx("#8FA3B8"),
           chemin:hx("#E4D9C2"),terre:hx("#6B5D4F"),pavot:hx("#B43A2E")};
/* sky, hor, far（远草）, near（近草）, warm */
const KEYS=[
  {h:0,   sky:hx("#6E7B78"),hor:hx("#7E8878"),far:hx("#6E7A5E"),near:hx("#6B6A50"),warm:.1},
  {h:5,   sky:hx("#8FA0A8"),hor:hx("#B4B89E"),far:hx("#8A966E"),near:hx("#84905F"),warm:.25},
  {h:7,   sky:hx("#A8B8C4"),hor:hx("#D9D9BC"),far:hx("#A4B47E"),near:hx("#9AAB72"),warm:.45},
  {h:10,  sky:hx("#9FB4C6"),hor:hx("#E4E4CC"),far:hx("#B0C284"),near:hx("#AABD7C"),warm:.35},
  {h:13,  sky:hx("#8FA3B8"),hor:hx("#EAE8D2"),far:hx("#B7C98B"),near:hx("#B0C484"),warm:.3},
  {h:16,  sky:hx("#9AA8B4"),hor:hx("#E8DFC0"),far:hx("#B2C284"),near:hx("#ACBC78"),warm:.5},
  {h:17.8,sky:hx("#C4AE8E"),hor:hx("#EBD2A0"),far:hx("#B4AE72"),near:hx("#ACA668"),warm:.85},
  {h:19.2,sky:hx("#A08468"),hor:hx("#D9AE7E"),far:hx("#948A5C"),near:hx("#8E8456"),warm:.7},
  {h:20.6,sky:hx("#767E7E"),hor:hx("#9A9478"),far:hx("#727C5C"),near:hx("#6E7452"),warm:.35},
  {h:22,  sky:hx("#6E7B78"),hor:hx("#7E8878"),far:hx("#6E7A5E"),near:hx("#6B6A50"),warm:.1},
  {h:24,  sky:hx("#6E7B78"),hor:hx("#7E8878"),far:hx("#6E7A5E"),near:hx("#6B6A50"),warm:.1},
];
function sampleLight(h){
  h=((h%24)+24)%24;
  let i=0;while(i<KEYS.length-2&&KEYS[i+1].h<h)i++;
  const a=KEYS[i],b=KEYS[i+1],k=Math.min(1,Math.max(0,(h-a.h)/(b.h-a.h)));
  const e=k*k*(3-2*k);
  return{sky:lerpHSL(a.sky,b.sky,e),hor:lerpHSL(a.hor,b.hor,e),
         far:lerpHSL(a.far,b.far,e),near:lerpHSL(a.near,b.near,e),
         warm:a.warm+(b.warm-a.warm)*e};
}
function phaseName(h){
  if(h<4.5||h>=21.5)return"夜 LA NUIT";
  if(h<6)return"拂晓 AVANT L'AUBE";
  if(h<9)return"清晨 L'AUBE";
  if(h<11.5)return"上午 LE MATIN";
  if(h<15)return"夏午 L'ÉTÉ";
  if(h<17)return"午后 L'APRÈS-MIDI";
  if(h<19.8)return"暮野 LE SOIR";
  return"入夜 LA TOMBÉE";
}
function sunPos(){
  const day=heure>=5.5&&heure<=19.5;
  const k=day?(heure-5.5)/14:((heure+24-20.5)%24)/9;
  return{x:W*(.16+.68*Math.min(1,Math.max(0,k))),y:H*(.28-Math.sin(Math.PI*Math.min(1,Math.max(0,k)))*.2),day};
}

/* ================= 田地与退避小径 ================= */
let BASE=400,MAXA=6,CHAOS=.35;
let grass=[],poppies=[],clouds=[],stones=[],gate={},windPetals=[];
function pathY(nx){return H*(.62+.10*Math.sin(nx*4.2+1.2)+.04*Math.sin(nx*9.7))}
function delayAt(i){return BASE*Math.pow(2,i)}
function layoutField(){
  const rng=mulberry32(seed^0xf1e1d);
  grass=[];
  const nG=Math.min(1900,(W*H/700)|0);
  for(let i=0;i<nG;i++)grass.push({nx:rng(),ny:rng(),len:4+rng()*12,hue:rng(),ph:rng()*7,tilt:(rng()-.5)*.6});
  poppies=[];
  for(let i=0;i<34;i++)poppies.push({nx:rng(),ny:.35+rng()*.62,s:.7+rng()*.9,ph:rng()*7,dyn:false});
  /* 前景一丛：阿让特伊的那一角 */
  for(let i=0;i<26;i++)poppies.push({nx:.05+rng()*.3,ny:.82+rng()*.17,s:1.2+rng()*1.1,ph:rng()*7,dyn:false});
  clouds=[];
  for(let i=0;i<4;i++)clouds.push({nx:rng(),ny:rng()*.24,r:80+rng()*140,sp:(rng()-.5)*5,ph:rng()*7});
  stones=[];
  for(let i=0;i<8;i++){
    const nx=.18+i*.085;
    stones.push({i,nx,x:nx*W,y:pathY(nx),state:"idle"}); /* idle|trying|fail|ok */
  }
  gate={nx:.18+8*.085+.05,open:1,target:1}; /* 1 全开 0 关 */
  windPetals=[];
}

/* ================= 状态机：沿小径走一遍 ================= */
let runState="idle",runI=-1,waitT=0,walker=null,stats={runs:0,ok:0,trip:0},storm=0,injectHold=false;
let runRng=mulberry32(1);
function log(msg,bad){
  const el=$("log-body");
  const d=document.createElement("div");
  d.className="ev"+(bad?" bad":"");
  const hh=String(Math.floor(heure)).padStart(2,"0"),mm=String(Math.floor((heure%1)*60)).padStart(2,"0");
  d.innerHTML=`[${hh}:${mm}] <b>${msg}</b>`;
  el.prepend(d);
  while(el.children.length>6)el.lastChild.remove();
}
function startRun(){
  if(runState==="running")return;
  if(gate.open<.5){log("门还关着，等冷却");return}
  runRng=mulberry32((seed^(stats.runs*997+1))>>>0);
  runState="running";runI=-1;waitT=.4;walker=null;
  stones.forEach(s=>s.state="idle");
  stats.runs++;syncStats();
  log("出发 · 第 "+stats.runs+" 次沿小径");
}
function stepRun(dt){
  if(runState!=="running")return;
  waitT-=dt;
  if(waitT>0)return;
  runI++;
  if(runI>=MAXA){ /* 尝试用尽 → 熔断 */
    runState="cooldown";waitT=4;gate.target=0;
    stats.trip++;syncStats();
    log("尝试用尽 · 木门关上了",true);
    Snd.gust(.5);
    return;
  }
  const st=stones[runI];
  const chaos=Math.min(.95,CHAOS+storm*.5);
  const fail=runRng()<chaos;
  walker={from:runI-1,to:runI,k:0,dur:.5};
  waitT=.55+Math.min(1.6,delayAt(runI)/1000*.4);
  if(fail){
    st.state="fail";
    poppies.push({nx:st.nx+(runRng()-.5)*.02,ny:.35+((st.y/H)-.35)+.02,s:1+runRng()*.6,ph:runRng()*7,dyn:true,bloom:t});
    log("#"+(runI+1)+" 失败 · 开了一朵罂粟（"+delayAt(runI)+"ms）",true);
  }else{
    st.state="ok";
    runState="done";walker=null;
    stats.ok++;syncStats();
    log("#"+(runI+1)+" 抵达 · 小径亮起来了");
    gate.target=1;
  }
  if(runI===MAXA-1&&fail){ /* 下一次 step 触发熔断 */ }
}
function stepCooldown(dt){
  if(runState!=="cooldown")return;
  waitT-=dt;
  if(waitT<=0){
    runState="halfopen";waitT=1.2;
    gate.target=.5;
    log("半开 · 放一只探路的麻雀过去");
  }
}
function stepHalf(dt){
  if(runState!=="halfopen")return;
  waitT-=dt;
  if(waitT>0)return;
  const chaos=Math.min(.95,CHAOS+storm*.5);
  if(runRng()<chaos*.6){
    runState="cooldown";waitT=4;gate.target=0;
    log("试探失败 · 门又关上了",true);
  }else{
    runState="idle";gate.target=1;
    log("试探通过 · 门开了，风过去了");
    stats.ok++;syncStats();
  }
}
function syncStats(){
  $("m-runs").textContent=stats.runs;
  $("m-ok").textContent=stats.ok;
  $("m-trip").textContent=stats.trip;
}

/* ================= sound (L5, 默认 OFF)：风 + 阵风 + 远鸟 ================= */
const Snd=(()=>{
  let ac=null,master=null,on=false,birdTimer=null,wg=null,bp=null;
  function build(){
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain();master.gain.value=0;master.connect(ac.destination);
    const len=ac.sampleRate*4,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
    let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.2}
    const src=ac.createBufferSource();src.buffer=buf;src.loop=true;
    bp=ac.createBiquadFilter();bp.type="bandpass";bp.frequency.value=500;bp.Q.value=.9;
    wg=ac.createGain();wg.gain.value=.12;
    src.connect(bp);bp.connect(wg);wg.connect(master);src.start();
    const lfo=ac.createOscillator();lfo.frequency.value=.06;
    const lg=ac.createGain();lg.gain.value=180;lfo.connect(lg);lg.connect(bp.frequency);lfo.start();
  }
  function chirp(){
    if(!on)return;
    const t0=ac.currentTime+.05;
    const o=ac.createOscillator(),g=ac.createGain(),m=ac.createOscillator(),mg=ac.createGain();
    o.type="sine";o.frequency.setValueAtTime(2500+Math.random()*300,t0);
    o.frequency.exponentialRampToValueAtTime(3100+Math.random()*400,t0+.08);
    m.frequency.value=40+Math.random()*28;mg.gain.value=320;m.connect(mg);mg.connect(o.frequency);
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.02,t0+.02);
    g.gain.exponentialRampToValueAtTime(.0004,t0+.3);
    o.connect(g);g.connect(master);m.start(t0);o.start(t0);o.stop(t0+.36);m.stop(t0+.36);
    birdTimer=setTimeout(chirp,(3+Math.random()*8)*1000);
  }
  return{
    toggle(){
      if(!ac)build();
      if(ac.state==="suspended")ac.resume();
      on=!on;
      master.gain.cancelScheduledValues(ac.currentTime);
      master.gain.linearRampToValueAtTime(on?1:0,ac.currentTime+1.5);
      if(on)chirp();else clearTimeout(birdTimer);
      localStorage.setItem("mira-snd-075",on?"1":"0");
      return on;
    },
    gust(k){
      if(!ac||!on)return;
      wg.gain.cancelScheduledValues(ac.currentTime);
      wg.gain.linearRampToValueAtTime(.12+k*.22,ac.currentTime+.4);
      wg.gain.linearRampToValueAtTime(.12,ac.currentTime+2.2);
      bp.frequency.linearRampToValueAtTime(500+k*400,ac.currentTime+.5);
      bp.frequency.linearRampToValueAtTime(500,ac.currentTime+2.4);
    }};
})();
$("snd").addEventListener("click",()=>$("snd").classList.toggle("on",Snd.toggle()));

function makePaper(){
  const c=document.createElement("canvas");c.width=c.height=480;
  const x=c.getContext("2d"),rng=mulberry32(0x75ab);
  x.fillStyle="#808080";x.fillRect(0,0,480,480);
  for(let i=0;i<4200;i++){const g=110+rng()*90;
    x.fillStyle=`rgba(${g|0},${g|0},${g|0},${.02+rng()*.04})`;
    x.fillRect(rng()*480,rng()*480,1+rng()*2,1+rng()*2)}
  x.strokeStyle="rgba(140,150,110,.05)";
  for(let i=0;i<46;i++){x.beginPath();
    const px=rng()*480,py=rng()*480,a=rng()*Math.PI,l=8+rng()*26;
    x.moveTo(px,py);x.lineTo(px+Math.cos(a)*l,py+Math.sin(a)*l);x.stroke()}
  return c;
}

}

/* ================= draw ================= */
let t=0;
function draw(now){
  const L=sampleLight(heure);
  const sun=sunPos();
  const hz=H*.30;
  const dayF=Math.min(1,Math.max(0,Math.min((heure-5.2)/1.6,(20.8-heure)/1.6,1)));
  storm+=((injectHold?1:0)-storm)*.05;
  const windBase=1+storm*6;
  ptr.vx*=.9;ptr.vy*=.9;
  /* --- 天空 --- */
  const g=ctx.createLinearGradient(0,0,0,hz);
  g.addColorStop(0,rgb(fade(L.sky,FAM.terre,storm*.25)));
  g.addColorStop(1,rgb(fade(L.hor,FAM.terre,storm*.2)));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,hz+1);
  /* 天空碎色 */
  for(let i=0;i<180;i++){
    const sx=(i*57.7)%W,sy=(i*27.3)%hz;
    const c2=fade(lerpHSL(L.sky,L.hor,sy/hz),FAM.chemin,(i%5)/5*.3);
    ctx.strokeStyle=rgb(c2,.10+((i*13)%10)/10*.07);
    ctx.lineWidth=1.6;
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+8+(i%19),sy+Math.sin(i*1.7)*2);ctx.stroke();
  }
  /* 太阳 */
  if(sun.day&&storm<.5){
    const sg=ctx.createRadialGradient(sun.x,sun.y,0,sun.x,sun.y,H*.34);
    sg.addColorStop(0,rgb(FAM.chemin,(.4*L.warm+.12)*(1-storm)));sg.addColorStop(1,rgb(FAM.chemin,0));
    ctx.fillStyle=sg;ctx.fillRect(0,0,W,hz+2);
    ctx.fillStyle=rgb(lerpHSL(FAM.chemin,FAM.pavot,0),.85*(1-storm));
    ctx.beginPath();ctx.arc(sun.x,sun.y,H*.026,0,7);ctx.fill();
  }
  /* 云 */
  clouds.forEach(c=>{
    c.nx+=c.sp*.00016*(1+storm*2);if(c.nx>1.2)c.nx=-.2;if(c.nx<-.2)c.nx=1.2;
    const cx=c.nx*W,cy=c.ny*H+H*.03;
    for(let k=0;k<9;k++){
      const a=k/9*Math.PI*2+c.ph;
      const px=cx+Math.cos(a)*c.r*.6,py=cy+Math.sin(a)*c.r*.15;
      ctx.fillStyle=rgb(fade(FAM.chemin,L.sky,.3+storm*.4),.15*dayF+.05+storm*.1);
      ctx.beginPath();ctx.ellipse(px,py,c.r*.34,c.r*.09,0,0,7);ctx.fill();
    }
  });
  /* 远山一线 */
  ctx.fillStyle=rgb(fade(FAM.ciel,L.hor,.55),.5);
  ctx.beginPath();ctx.moveTo(0,hz);
  for(let x=0;x<=W;x+=10)ctx.lineTo(x,hz-H*.01*(1+Math.sin(x*.004)*.6)-H*.005*Math.sin(x*.021));
  ctx.lineTo(W,hz);ctx.closePath();ctx.fill();
  /* --- 草地基色 --- */
  const fg=ctx.createLinearGradient(0,hz,0,H);
  fg.addColorStop(0,rgb(L.far));fg.addColorStop(1,rgb(L.near));
  ctx.fillStyle=fg;ctx.fillRect(0,hz,W,H-hz);
  /* --- 小径（先铺土路） --- */
  ctx.strokeStyle=rgb(fade(FAM.chemin,L.near,.18),.95);
  ctx.lineWidth=H*.055;ctx.lineCap="round";ctx.lineJoin="round";
  ctx.beginPath();
  for(let x=0;x<=W;x+=16){
    const y=pathY(x/W);
    x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.stroke();
  /* 路边泥土碎笔触 */
  for(let i=0;i<240;i++){
    const nx=(i*37.3%1000)/1000;
    const x=nx*W,y=pathY(nx)+(((i*53)%40)-20)*H*.0016;
    const side=i%2?1:-1;
    const yy=y+side*H*.028;
    ctx.strokeStyle=rgb(fade(FAM.terre,FAM.chemin,(i%5)/5*.4),.3+((i*7)%10)/10*.15);
    ctx.lineWidth=1.4;
    ctx.beginPath();ctx.moveTo(x-4,yy);ctx.lineTo(x+4+((i*11)%8),yy+((i*7)%3)-1);ctx.stroke();
  }
  /* --- 草（风跟着手，风暴压倒） --- */
  grass.forEach(gr=>{
    const depth=gr.ny;
    const x=gr.nx*W,y=hz+4+depth*(H-hz-4);
    /* 路径附近草稀疏 */
    const pd=Math.abs(y-pathY(gr.nx));
    if(pd<H*.03)return;
    let sway=Math.sin(t*(1.1+gr.hue*.8)+gr.ph)*windBase*(1+depth);
    if(ptr.inC){
      const d=Math.hypot(ptr.x-x,ptr.y-y);
      if(d<120)sway+=ptr.vx*(1-d/120)*.5;
    }
    let c;
    if(gr.hue>.85)c=fade(lerpHSL(L.far,L.near,depth),FAM.chemin,.35*L.warm+.1);
    else if(gr.hue<.34)c=fade(lerpHSL(L.far,L.near,depth),FAM.herbe,.6);
    else c=lerpHSL(L.far,L.near,depth*.75+gr.hue*.2);
    const lean=sway*(2+storm*8);
    const tall=gr.len*(.5+depth*.7)*(1-storm*.35);
    ctx.strokeStyle=rgb(c,.5+.34*depth);
    ctx.lineWidth=Math.max(.8,1.8*depth);
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.quadraticCurveTo(x+gr.tilt*3+lean*.4,y-tall*.6,x+gr.tilt*5+lean,y-tall*(1-Math.min(.6,Math.abs(lean)*.02)));
    ctx.stroke();
  });
  /* --- 罂粟（点状，唯一的纯色） --- */
  poppies.forEach(p=>{
    const x=p.nx*W,y=hz+4+p.ny*(H-hz-4);
    if(Math.abs(y-pathY(p.nx))<H*.032)return;
    const depth=p.ny;
    const sway=Math.sin(t*1.3+p.ph)*windBase*1.4;
    /* 茎 */
    ctx.strokeStyle=rgb(fade(FAM.herbe,FAM.terre,.3),.6);
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+sway,y-8*p.s,x+sway*1.6,y-13*p.s);ctx.stroke();
    /* 花：3-5 个红点，点彩 */
    const bloom=p.bloom?Math.min(1,(t-p.bloom)/.8):1;
    const nb=3+((p.s*2)|0);
    for(let k=0;k<nb;k++){
      const a=k/nb*Math.PI*2+p.ph;
      ctx.fillStyle=rgb(FAM.pavot,(.55+.3*Math.sin(k*2.1))*bloom);
      ctx.beginPath();
      ctx.arc(x+sway*1.6+Math.cos(a)*2.2*p.s*bloom,y-13*p.s+Math.sin(a)*1.6*p.s*bloom,
              1.5*p.s*bloom*(.8+.2*Math.sin(t*2+k)),0,7);
      ctx.fill();
    }
  });
  /* --- 测风杆（尝试 = 杆高 = 退避时长） --- */
  const maxD=delayAt(MAXA-1);
  stones.forEach((st,i)=>{
    if(i>=MAXA){return}
    const x=st.x,y=st.y;
    const hFrac=Math.log2(delayAt(i)/BASE+1)/Math.log2(maxD/BASE+1);
    const poleH=H*(.04+.13*hFrac);
    const sway=Math.sin(t*1.2+i)*windBase*.8;
    /* 杆影（泥土色，背向太阳） */
    const shDir=sun.x<W/2?1:-1;
    ctx.strokeStyle=rgb(fade(FAM.terre,L.near,.3),.25);
    ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(x,y+2);ctx.lineTo(x+shDir*poleH*.5*Math.abs(12-heure)/6,y+4);ctx.stroke();
    /* 杆身 */
    const stC=st.state==="fail"?FAM.pavot:st.state==="ok"?fade(FAM.chemin,FAM.terre,.2):fade(FAM.terre,FAM.chemin,.25);
    ctx.strokeStyle=rgb(stC,.9);ctx.lineWidth=2.6;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+sway,y-poleH);ctx.stroke();
    /* 杆顶旗/光 */
    if(st.state==="ok"){
      const pl=.7+.3*Math.sin(t*3+i);
      ctx.fillStyle=rgb(FAM.chemin,.9*pl);
      ctx.beginPath();ctx.arc(x+sway,y-poleH,4*pl,0,7);ctx.fill();
      ctx.fillStyle=rgb(FAM.chemin,.25*pl);
      ctx.beginPath();ctx.arc(x+sway,y-poleH,10*pl,0,7);ctx.fill();
    }else if(st.state==="fail"){
      ctx.fillStyle=rgb(FAM.pavot,.9);
      ctx.beginPath();ctx.arc(x+sway,y-poleH,3.4,0,7);ctx.fill();
    }else{
      ctx.fillStyle=rgb(FAM.chemin,.8);
      ctx.beginPath();ctx.arc(x+sway,y-poleH,2.4,0,7);ctx.fill();
    }
    /* 标签 */
    ctx.font="8px 'SF Mono',Menlo,monospace";ctx.textAlign="center";
    ctx.fillStyle=rgb(fade(FAM.terre,L.near,(1-dayF)*.4),.75);
    ctx.fillText("#"+(i+1)+" · "+delayAt(i)+"ms",x,y+13);
  });
  /* 虚线缰绳（退避曲线） */
  ctx.strokeStyle=rgb(fade(FAM.terre,FAM.chemin,.3),.5);
  ctx.setLineDash([3,5]);ctx.lineDashOffset=-t*8;ctx.lineWidth=1.1;
  ctx.beginPath();
  let first=true;
  stones.forEach((st,i)=>{
    if(i>=MAXA)return;
    const hFrac=Math.log2(delayAt(i)/BASE+1)/Math.log2(maxD/BASE+1);
    const poleH=H*(.04+.13*hFrac);
    first?ctx.moveTo(st.x,st.y-poleH):ctx.lineTo(st.x,st.y-poleH);
    first=false;
  });
  ctx.stroke();ctx.setLineDash([]);
  /* --- 行走的光（RUN 主角） --- */
  if(walker){
    walker.k+=1/60/walker.dur;
    if(walker.k>1)walker.k=1;
    const a=walker.from<0?{x:stones[0].x-60,y:pathY((stones[0].x-60)/W)}:stones[walker.from];
    const b=stones[walker.to];
    const e=walker.k*walker.k*(3-2*walker.k);
    const wx=a.x+(b.x-a.x)*e,wy=pathY(wx/W)-6-Math.sin(e*Math.PI)*26;
    const pl=.7+.3*Math.sin(t*8);
    ctx.fillStyle=rgb(FAM.chemin,.35*pl);
    ctx.beginPath();ctx.arc(wx,wy,14*pl,0,7);ctx.fill();
    ctx.fillStyle=rgb(fade(FAM.chemin,FAM.terre,.1),.95);
    ctx.beginPath();ctx.arc(wx,wy,4.5*pl,0,7);ctx.fill();
  }
  /* --- 木门（熔断器） --- */
  gate.open+=(gate.target-gate.open)*.06;
  const gx=gate.nx*W,gy=pathY(gate.nx);
  ctx.strokeStyle=rgb(FAM.terre,.9);ctx.lineWidth=3;
  const gh=H*.075;
  ctx.beginPath();ctx.moveTo(gx-14,gy+4);ctx.lineTo(gx-14,gy-gh);
  ctx.moveTo(gx+14,gy+4);ctx.lineTo(gx+14,gy-gh);ctx.stroke();
  /* 门扇：open 决定角度 */
  const sw=(1-gate.open)*1.35;
  ctx.save();ctx.translate(gx-14,gy+2);ctx.rotate(-sw);
  ctx.strokeStyle=rgb(fade(FAM.terre,FAM.chemin,.15),.92);ctx.lineWidth=2.4;
  for(let b=0;b<3;b++){
    ctx.beginPath();ctx.moveTo(0,-b*gh/3-4);ctx.lineTo(28,-b*gh/3-4);ctx.stroke();
  }
  ctx.restore();
  /* 门状态灯：开=小径色，半开=琥珀闪，关=罂粟 */
  const lampC=gate.open>.75?FAM.chemin:gate.open>.25?(Math.sin(t*6)>0?FAM.chemin:FAM.pavot):FAM.pavot;
  ctx.fillStyle=rgb(lampC,.9);
  ctx.beginPath();ctx.arc(gx-14,gy-gh-6,3,0,7);ctx.fill();
  ctx.font="8px 'SF Mono',Menlo,monospace";ctx.textAlign="center";
  ctx.fillStyle=rgb(FAM.terre,.7);
  ctx.fillText(gate.open>.75?"PORTE OUVERTE":gate.open>.25?"ENTROUVERT":"Fermé · 熔断",gx,gy+16);
  /* --- 风暴花瓣 --- */
  if(storm>.3&&Math.random()<.3){
    windPetals.push({x:-10,y:Math.random()*H*.7+H*.15,
      vx:6+Math.random()*5,vy:(Math.random()-.5)*2,life:1,rot:Math.random()*7});
  }
  for(let i=windPetals.length-1;i>=0;i--){
    const p=windPetals[i];
    p.x+=p.vx*(1+storm*2);p.y+=p.vy+Math.sin(t*4+p.rot)*1.4;
    p.vx*=.99;p.rot+=.1;p.life-=.006;
    if(p.life<=0||p.x>W+20){windPetals.splice(i,1);continue}
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    ctx.fillStyle=rgb(FAM.pavot,p.life*.8);
    ctx.beginPath();ctx.ellipse(0,0,3.4,1.6,0,0,7);ctx.fill();
    ctx.restore();
  }
  /* --- 状态机 --- */
  stepRun(1/60);stepCooldown(1/60);stepHalf(1/60);
  /* --- 纸纹 + 颗粒 --- */
  if(!paperPat)paperPat=ctx.createPattern(paperC,"repeat");
  ctx.save();ctx.globalAlpha=.07;ctx.globalCompositeOperation="multiply";
  ctx.fillStyle=paperPat;ctx.fillRect(0,0,W,H);ctx.restore();
  updateGrain(now*1000);
  if(!grainPat)grainPat=ctx.createPattern(grainC,"repeat");
  if(grainPat){ctx.save();ctx.globalAlpha=.03;ctx.globalCompositeOperation="overlay";
    ctx.fillStyle=grainPat;ctx.fillRect(0,0,W,H);ctx.restore()}
  syncTimer();
}

/* ================= boot ================= */
resize();layoutField();writeHash();
log("田已就位 · 空格出发");
if(innerWidth<760){document.body.classList.add("snap","hideui");setTimeout(()=>document.body.classList.remove("snap"),700)}
let last=performance.now(),frameN=0;
(function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  t+=dt;frameN++;
  draw(now/1000);
  requestAnimationFrame(loop);
})(last);
</script>
</body></html>
