<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eval Dashboard — 模型评测麦田 · Atelier MIRA N°064 · 金色时刻</title>
<!--
  Atelier MIRA · Étude N°064 · 金色时刻 HEURE DORÉE（暖，≈3200K）
  家族锚点：#F4E3C2 蜜光 · #E8B96F 金 · #D98E4A 琥珀 · #A85B3C 焦赭 · #5E6E7E 阴影补色蓝
  铁律：受光面走金→琥珀，影子必须是蓝紫系——莫奈不用黑色。
  六个模型是田里的六捆麦子，五个基准是五把量尺；太阳落一分，影子长一丈。
-->
<style>
  :root{
    --ink:#6B4A2E; --dim:#93765A; --paper:rgba(244,227,194,.88); --paper-solid:#F4E3C2;
    --line:rgba(168,91,60,.30); --accent:#A85B3C; --accent-soft:rgba(168,91,60,.14);
    --mono:"SF Mono",Menlo,Consolas,monospace;
    --serif:Didot,"Bodoni MT",Georgia,"Songti SC",serif;
    --sans:-apple-system,"Helvetica Neue","PingFang SC",sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#E8B96F;color:var(--ink);font-family:var(--sans);overflow:hidden;
       -webkit-font-smoothing:antialiased}
  ::selection{background:var(--accent-soft)}
  button{font-family:inherit;color:inherit}
  canvas#field{position:fixed;inset:0;width:100%;height:100%;display:block}

  header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:flex-start;
         gap:14px;padding:18px 22px 30px;pointer-events:none;
         background:linear-gradient(rgba(244,227,194,.62),rgba(244,227,194,0))}
  .seal{flex:0 0 auto;pointer-events:auto;opacity:.92}
  .etitle{padding-top:1px}
  .etitle .no{font-family:var(--mono);font-size:9.5px;letter-spacing:.26em;color:var(--accent)}
  .etitle h1{font-family:var(--serif);font-weight:400;font-size:22px;letter-spacing:.02em;margin-top:2px}
  .etitle h1 span{font-family:var(--sans);font-size:12.5px;color:var(--dim);margin-left:9px;letter-spacing:.06em}
  .etitle .epig{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--dim);
                margin-top:5px;letter-spacing:.04em}
  .hdr-right{margin-left:auto;display:flex;gap:8px;align-items:flex-start;pointer-events:auto}

  #snd{width:34px;height:34px;border:1px solid var(--line);background:var(--paper);
       backdrop-filter:blur(8px);cursor:pointer;display:flex;align-items:center;justify-content:center;
       transition:border-color .3s var(--ease);flex:0 0 auto}
  #snd:hover{border-color:var(--accent)}
  #snd svg{stroke:var(--dim);transition:stroke .3s}
  #snd.on svg{stroke:var(--accent)}
  #snd .waves{opacity:0;transition:opacity .4s}
  #snd.on .waves{opacity:1}

  /* benchmark tabs — 五把量尺 */
  #tabs{display:flex;border:1px solid var(--line);background:var(--paper);backdrop-filter:blur(8px);flex-wrap:wrap}
  #tabs button{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--dim);
               background:transparent;border:0;padding:9px 12px;cursor:pointer;transition:all .3s var(--ease)}
  #tabs button:hover{color:var(--ink)}
  #tabs button.on{color:var(--paper-solid);background:var(--accent)}

  /* field notes — 全矩阵 */
  #notes{position:fixed;left:22px;bottom:64px;z-index:10;width:min(660px,calc(100vw - 44px));
         background:var(--paper);border:1px solid var(--line);backdrop-filter:blur(10px);
         transition:transform .5s var(--ease),opacity .5s var(--ease)}
  body.hideui #notes{transform:translateY(24px);opacity:0;pointer-events:none}
  #notes .nhead{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);
                font-family:var(--mono);font-size:8.5px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
  #notes .nhead .run{margin-left:auto;letter-spacing:.1em;color:var(--accent)}
  #notes .nhead button{border:1px solid var(--line);background:transparent;font-family:var(--mono);
                       font-size:8.5px;letter-spacing:.1em;color:var(--dim);padding:3px 8px;cursor:pointer}
  #notes .nhead button.on{color:var(--accent);border-color:var(--accent)}
  #notes table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:10.5px}
  #notes th{font-size:8.5px;letter-spacing:.12em;color:var(--dim);font-weight:400;text-align:right;
            padding:6px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
  #notes th:first-child{text-align:left;padding-left:14px}
  #notes th.sorted{color:var(--accent)}
  #notes td{text-align:right;padding:4.5px 10px;color:var(--ink);font-variant-numeric:tabular-nums}
  #notes td:first-child{text-align:left;padding-left:14px}
  #notes tr.best td{color:var(--accent)}
  #notes td .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
  #notes td .up{color:var(--accent)} #notes td .dn{color:#5E6E7E}

  /* desk */
  #desk{position:fixed;top:128px;right:22px;width:196px;z-index:10;background:var(--paper);
        border:1px solid var(--line);backdrop-filter:blur(10px);padding:14px 15px 12px;
        transition:transform .5s var(--ease),opacity .5s var(--ease)}
  body.hideui #desk{transform:translateX(130%);opacity:0;pointer-events:none}
  .desklabel{font-family:var(--mono);font-size:8.5px;letter-spacing:.24em;color:var(--dim);
             text-transform:uppercase;display:flex;align-items:center;gap:9px;margin-bottom:13px}
  .desklabel::after{content:"";flex:1;height:1px;background:var(--line)}
  .srow{margin-bottom:13px}
  .srow .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .srow .k{font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.1em}
  .srow .v{font-family:var(--mono);font-size:10px;color:var(--accent);font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:2px;
      background:linear-gradient(90deg,var(--accent) var(--fill,50%),rgba(168,91,60,.25) var(--fill,50%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;margin-top:-4.5px;
      background:var(--paper-solid);border:2px solid var(--accent);border-radius:50%;transition:transform .2s var(--ease)}
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.3)}
  input[type=range]::-moz-range-track{height:2px;background:rgba(168,91,60,.25)}
  input[type=range]::-moz-range-progress{height:2px;background:var(--accent)}
  input[type=range]::-moz-range-thumb{width:9px;height:9px;background:var(--paper-solid);
      border:2px solid var(--accent);border-radius:50%}
  .deskbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:2px}
  .deskbtns .full{grid-column:1/-1}
  .btn{font-family:var(--mono);font-size:9px;letter-spacing:.1em;padding:8px 9px;cursor:pointer;
       border:1px solid var(--line);background:transparent;color:var(--ink);
       transition:all .25s var(--ease);text-align:center}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}

  /* hover chip */
  #chip{position:fixed;z-index:9;pointer-events:none;background:var(--paper);border:1px solid var(--line);
        backdrop-filter:blur(8px);padding:6px 10px;font-family:var(--mono);font-size:10px;color:var(--ink);
        opacity:0;transition:opacity .18s;white-space:nowrap}
  #chip.show{opacity:1}
  #chip .cl{color:var(--accent)}
  #chip .d{color:var(--dim);margin-left:7px}

  /* time ruler */
  #timer{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:10;
         width:min(460px,72vw);background:var(--paper);border:1px solid var(--line);
         backdrop-filter:blur(10px);padding:8px 14px 10px;cursor:ew-resize;user-select:none;
         transition:opacity .5s var(--ease)}
  body.hideui #timer{opacity:0;pointer-events:none}
  #timer .face{position:relative;height:16px}
  #timer .track{position:absolute;left:0;right:0;top:8px;height:1px;background:var(--line)}
  #timer .tick{position:absolute;top:5px;width:1px;height:7px;background:var(--line)}
  #timer .sun{position:absolute;top:1px;width:14px;height:14px;margin-left:-7px;border-radius:50%;
      border:1.5px solid var(--accent);background:var(--paper-solid);pointer-events:none}
  #timer .sun::after{content:"";position:absolute;inset:3.5px;border-radius:50%;background:var(--accent);opacity:.85}
  #timer .lab{display:flex;justify-content:space-between;margin-top:5px;
      font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:var(--dim)}
  #timer .lab b{color:var(--accent);font-weight:400;font-variant-numeric:tabular-nums}

  #colo{position:fixed;right:22px;bottom:14px;z-index:10;display:flex;align-items:center;gap:8px;
        font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--ink);opacity:.68;cursor:pointer;
        transition:opacity .5s var(--ease)}
  #note{position:fixed;right:22px;bottom:44px;z-index:11;width:240px;background:var(--paper);
        border:1px solid var(--line);backdrop-filter:blur(10px);padding:12px 14px;
        font-family:var(--serif);font-style:italic;font-size:13px;line-height:1.7;color:var(--ink);
        opacity:0;transform:translateY(8px);pointer-events:none;transition:all .6s var(--ease)}
  #note.show{opacity:1;transform:none}
  #uibtn{position:fixed;left:22px;bottom:14px;z-index:10;font-family:var(--mono);font-size:9px;
         letter-spacing:.14em;color:var(--dim);background:var(--paper);border:1px solid var(--line);
         padding:6px 10px;cursor:pointer;backdrop-filter:blur(8px)}
  #uibtn:hover{color:var(--accent);border-color:var(--accent)}

  @media (max-width:760px){
    header{padding:12px 14px 22px;gap:10px}
    .seal svg{width:38px;height:38px}
    .etitle h1{font-size:16px}
    .etitle h1 span{font-size:11px}
    .etitle .epig{font-size:12px;max-width:52vw}
    .hdr-right{flex-wrap:wrap;justify-content:flex-end;max-width:46vw}
    #tabs button{font-size:9px;padding:7px 8px}
    #desk{top:auto;bottom:158px;right:14px;width:min(196px,calc(100vw - 28px))}
    #notes{left:14px;bottom:104px;width:calc(100vw - 28px)}
    #notes table{font-size:9.5px}
    #timer{width:calc(100vw - 120px);bottom:52px}
    body.hideui #timer{opacity:1;pointer-events:auto}
    #timer .lab span:last-child{display:none}
    #colo{right:14px;bottom:12px;font-size:8px}
    #uibtn{left:14px;bottom:12px}
  }
</style>
</head>
<body>

<header>
  <div class="seal">
    <svg width="50" height="50" viewBox="0 0 52 52" aria-label="Atelier MIRA seal">
      <circle cx="26" cy="26" r="24.6" fill="none" stroke="#A85B3C" stroke-width="1"/>
      <circle cx="26" cy="26" r="14.2" fill="none" stroke="#A85B3C" stroke-width=".55" opacity=".55"/>
      <path d="M18.4 33.4 V20.1 L25.9 29.9 L33.7 20.4 V33.1" fill="none" stroke="#A85B3C"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="etitle">
    <div class="no">ÉTUDE N°064 · AGENT-DEMOS</div>
    <h1>Eval Dashboard<span>模型评测麦田</span></h1>
    <div class="epig">「我们量的不是分数，是这片田在傍晚的收成。」</div>
  </div>
  <div class="hdr-right">
    <div id="tabs" role="group" aria-label="Benchmark"></div>
    <button id="snd" aria-label="环境声开关" title="环境声（默认关闭）">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke-width="1.3" stroke-linecap="round">
        <path d="M2 6.5v3h2.4L8 12.6V3.4L4.4 6.5H2z"/>
        <path class="waves" d="M10.2 5.2a4 4 0 0 1 0 5.6M12 3.4a6.4 6.4 0 0 1 0 9.2"/>
      </svg>
    </button>
  </div>
</header>

<canvas id="field"></canvas>

<aside id="desk" aria-label="Réglage">
  <div class="desklabel">Réglage · 风与光</div>
  <div class="srow">
    <div class="head"><span class="k">风 VENT</span><span class="v" id="v-vent">3.6 m/s</span></div>
    <input type="range" id="s-vent" min="0" max="100" value="30" aria-label="风速">
  </div>
  <div class="srow">
    <div class="head"><span class="k">样本 N</span><span class="v" id="v-n">1200</span></div>
    <input type="range" id="s-n" min="200" max="2000" step="50" value="1200" aria-label="样本量">
  </div>
  <div class="deskbtns">
    <button class="btn on" id="b-ci">误差棒 CI</button>
    <button class="btn" id="b-norm">归一化</button>
    <button class="btn full" id="b-regen">再种一茬 · RESEED (G)</button>
    <button class="btn" id="b-link">COPY LINK</button>
    <button class="btn" id="b-png">SAVE PNG (S)</button>
  </div>
</aside>

<section id="notes" aria-label="Field notes">
  <div class="nhead">
    <span>Field Notes · 全矩阵</span>
    <span class="run" id="runid">—</span>
    <button id="sortdir" title="排序方向">↓ 降序</button>
  </div>
  <div style="max-height:196px;overflow-y:auto">
    <table id="matrix"><thead></thead><tbody></tbody></table>
  </div>
</section>

<div id="chip"></div>

<div id="timer" aria-label="时间轴">
  <div class="face" id="timerface">
    <div class="track"></div>
    <div class="sun" id="sundot"></div>
  </div>
  <div class="lab"><span id="t-phase">暮色 L'HEURE DORÉE</span><b id="t-clock">17:24</b><span>拖动 · 影子随太阳走路</span></div>
</div>

<button id="uibtn" title="收起/展开面板 (H)">H · 面板</button>

<div id="note">收割那天傍晚，最高的一捆麦子影子最长。庄户人家说：出头的，先被太阳看见。——画室手记 N°064</div>

<footer id="colo">
  <svg width="22" height="14" viewBox="0 0 64 40" fill="#A85B3C" aria-hidden="true">
    <path d="M32 20 C 26 12, 14 6, 4 8 C 12 12, 18 18, 24 21
             C 14 20, 6 22, 2 28 C 10 26, 18 26, 25 26
             C 27 30, 30 34, 34 36 C 33 32, 33 28, 34 25
             C 42 22, 52 16, 62 4 C 54 10, 44 16, 36 19
             C 35 17, 33 17, 32 20 Z"/>
  </svg>
  <span>ATELIER MIRA · N°064 · 金色时刻 HEURE DORÉE</span>
</footer>

<script>
"use strict";
const $=id=>document.getElementById(id);
const canvas=$("field"),ctx=canvas.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener("resize",resize);resize();

/* ================= seed & hash ================= */
const hashParams=new URLSearchParams(location.hash.slice(1));
let seed=parseInt(hashParams.get("seed"),10);
if(!Number.isFinite(seed))seed=(Math.random()*8999+1000)|0;
let heure=hashParams.get("h")!==null?+hashParams.get("h"):(new Date().getHours()+new Date().getMinutes()/60);
if(!Number.isFinite(heure)||heure<0||heure>24)heure=17;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function writeHash(){
  const p=new URLSearchParams({seed:String(seed),h:heure.toFixed(1),b:bench,n:String(nSample)});
  history.replaceState(null,"","#"+p.toString());
}

/* ================= colour helpers ================= */
function hx(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function rgb2hsl(c){const[r,g,b]=c.map(v=>v/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
  let h=0,s=0;const l=(mx+mn)/2;const d=mx-mn;
  if(d){s=d/(1-Math.abs(2*l-1));if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}
  return[h,s,l]}
function hsl2rgb(h,s,l){const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;
  let r,g,b;if(h<60){r=c;g=x;b=0}else if(h<120){r=x;g=c;b=0}else if(h<180){r=0;g=c;b=x}
  else if(h<240){r=0;g=x;b=c}else if(h<300){r=x;g=0;b=c}else{r=c;g=0;b=x}
  return[Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)]}
function lerpHSL(a,b,k){const A=rgb2hsl(a),B=rgb2hsl(b);let dh=B[0]-A[0];
  if(dh>180)dh-=360;if(dh<-180)dh+=360;
  return hsl2rgb(A[0]+dh*k,A[1]+(B[1]-A[1])*k,A[2]+(B[2]-A[2])*k)}
function fade(col,target,k){const A=rgb2hsl(col),B=rgb2hsl(target);
  return hsl2rgb(A[0],A[1]+(B[1]-A[1])*k*.8,A[2]+(B[2]-A[2])*k)}
const rgb=(c,a)=>a===undefined?`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`:`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

/* ================= 金色时刻家族 + heure ================= */
const FAM={miel:hx("#F4E3C2"),or:hx("#E8B96F"),ambre:hx("#D98E4A"),ocre:hx("#A85B3C"),ombre:hx("#5E6E7E")};
/* keyframes：h, sky, hor, fieldFar, fieldNear, ink, shLen（影长系数）, warm, night */
const KEYS=[
  {h:0,   sky:hx("#5E6E7E"),hor:hx("#7E8B98"),far:hx("#6E7880"),near:hx("#75695A"),sh:1.0,warm:.15},
  {h:5,   sky:hx("#8B93A0"),hor:hx("#C4B49E"),far:hx("#9A9684"),near:hx("#A08A64"),sh:1.4,warm:.3},
  {h:7,   sky:hx("#D9CBB2"),hor:hx("#F4E3C2"),far:hx("#D9C49A"),near:hx("#D4AC6E"),sh:1.9,warm:.5},
  {h:10,  sky:hx("#E8DCC4"),hor:hx("#F4E9D2"),far:hx("#E4CD9C"),near:hx("#E0B96E"),sh:1.0,warm:.35},
  {h:13,  sky:hx("#EFE6D0"),hor:hx("#F6EEDB"),far:hx("#EAD49E"),near:hx("#E8B96F"),sh:.42,warm:.3},
  {h:16,  sky:hx("#EBD7B4"),hor:hx("#F4DCAC"),far:hx("#E4C088"),near:hx("#DFA254"),sh:1.1,warm:.6},
  {h:17.8,sky:hx("#E4C39A"),hor:hx("#F4C98E"),far:hx("#DFB288"),near:hx("#D98E4A"),sh:2.4,warm:.95},
  {h:19.2,sky:hx("#B0927E"),hor:hx("#D99E6E"),far:hx("#B0825E"),near:hx("#A87A4E"),sh:3.0,warm:.8},
  {h:20.6,sky:hx("#7E7B84"),hor:hx("#9A8878"),far:hx("#847464"),near:hx("#8A7050"),sh:1.6,warm:.4},
  {h:22,  sky:hx("#5E6E7E"),hor:hx("#7E8B98"),far:hx("#6E7880"),near:hx("#75695A"),sh:1.0,warm:.15},
  {h:24,  sky:hx("#5E6E7E"),hor:hx("#7E8B98"),far:hx("#6E7880"),near:hx("#75695A"),sh:1.0,warm:.15},
];
function sampleLight(h){
  h=((h%24)+24)%24;
  let i=0;while(i<KEYS.length-2&&KEYS[i+1].h<h)i++;
  const a=KEYS[i],b=KEYS[i+1],k=Math.min(1,Math.max(0,(h-a.h)/(b.h-a.h)));
  const e=k*k*(3-2*k);
  return{sky:lerpHSL(a.sky,b.sky,e),hor:lerpHSL(a.hor,b.hor,e),
         far:lerpHSL(a.far,b.far,e),near:lerpHSL(a.near,b.near,e),
         sh:a.sh+(b.sh-a.sh)*e,warm:a.warm+(b.warm-a.warm)*e};
}
function phaseName(h){
  if(h<4.5||h>=21.5)return"夜 LA NUIT";
  if(h<6)return"拂晓 AVANT L'AUBE";
  if(h<9)return["清晨 L'AUBE"][0];
  if(h<11.5)return"上午 LE MATIN";
  if(h<15)return"正午 MIDI";
  if(h<17)return"午后 L'APRÈS-MIDI";
  if(h<19.8)return"金色时刻 L'HEURE DORÉE";
  return"入夜 LA TOMBÉE";
}
function sunPos(){
  const day=heure>=5.5&&heure<=19.5;
  const k=day?(heure-5.5)/14:((heure+24-20.5)%24)/9;
  return{x:W*(.14+.72*Math.min(1,Math.max(0,k))),y:H*(.34-Math.sin(Math.PI*Math.min(1,Math.max(0,k)))*.26),day};
}

function genData(){
  const rng=mulberry32(seed);

      s[b]=+(m.s[b]+j).toFixed(b==="MT-Bench"?2:1);
    });
    return {...m,s,delta:+(m.delta+(rng()*1.2-0.6)).toFixed(1),sd:+(0.8+rng()*1.4).toFixed(2)};
  });

}

/* score → 麦捆高度（0..1） */
function heightOf(m){
  const v=m.s[bench];
  if(norm){
    const vals=MODELS.map(x=>x.s[bench]);
    const mn=Math.min(...vals),mx=Math.max(...vals);
    return mx===mn?.6:.3+(v-mn)/(mx-mn)*.7;
  }
  return isMT(bench)?.25+v/10*.75:.25+v/100*.75;
}

let sheaves=[],fieldStrokes=[],clouds=[];
let growBase=0; /* 生长动画墙钟起点（performance.now，虚拟时间下同样推进） */
function layoutField(){
  growBase=performance.now();
  const rng=mulberry32(seed^0xbeef);
  sheaves=MODELS.map((m,i)=>{
    /* 非对称：中部一列 stagger，一捆离群 */
    const t=i/(MODELS.length-1);
    return{m,x:W*(.18+t*.62)+(rng()-.5)*W*.05,
           y:H*(.60+((i%2)*.05))+rng()*H*.05,
           ph:rng()*7,grow:0,growDelay:i*.14+rng()*.1,
           strokes:Array.from({length:34},()=>({ox:(rng()-.5)*2,len:.7+rng()*.5,
                    hue:rng(),tilt:(rng()-.5)*.22}))};
  });
  /* 单独离群的一捆（最近的，最低分） */
  const worst=sheaves.reduce((a,b)=>heightOf(a.m)<heightOf(b.m)?a:b);
  worst.x=W*.84;worst.y=H*.78;
  fieldStrokes=[];
  for(let i=0;i<1300;i++){
    fieldStrokes.push({nx:rng(),ny:rng(),len:3+rng()*10,hue:rng(),tilt:(rng()-.5)*.3,v:rng()});
  }
  clouds=[];
  for(let i=0;i<4;i++)clouds.push({nx:rng(),ny:rng()*.3,r:80+rng()*160,sp:(rng()-.5)*6,ph:rng()*7});
}

function renderMatrix(){
  const th=document.querySelector("#matrix thead");
  const tb=document.querySelector("#matrix tbody");
  const keys=["MODEL",...BENCH,"Δ RUN"];
  th.innerHTML="<tr>"+keys.map(k=>{
    const sk=k==="MODEL"?"id":k==="Δ RUN"?"delta":k;
    return `<th data-k="${sk}" class="${sortKey===sk?"sorted":""}">${k}${sortKey===sk?(sortDir<0?" ▾":" ▴"):""}</th>`;
  }).join("")+"</tr>";
  /* 排序实现 */
  const sorted=[...MODELS].sort((a,b)=>{
    if(!sortKey)return 0;
    let va,vb;
    if(sortKey==="id"){va=a.id;vb=b.id}
    else if(sortKey==="delta"){va=a.delta;vb=b.delta}
    else{va=a.s[sortKey];vb=b.s[sortKey]}
    return (va<vb?-1:va>vb?1:0)*sortDir;
  });
  const bestBy={};BENCH.forEach(b=>bestBy[b]=Math.max(...MODELS.map(x=>x.s[b])));
  tb.innerHTML=sorted.map(m=>{
    const best=m.s[bench]===bestBy[bench];
    return `<tr class="${best?"best":""}" data-id="${m.id}">
      <td><span class="dot" style="background:${m.id===selectedId?"#A85B3C":"#C9A875"}"></span>${m.id}</td>
      ${BENCH.map(b=>`<td style="${m.s[b]===bestBy[b]?"font-weight:600":""}">${fmt(b,m.s[b])}</td>`).join("")}
      <td><span class="${m.delta>=0?"up":"dn"}">${m.delta>=0?"+":""}${m.delta.toFixed(1)}</span></td></tr>`;
  }).join("");
  tb.querySelectorAll("tr").forEach(tr=>{
    tr.addEventListener("click",()=>{
      selectedId=tr.dataset.id;renderMatrix();
    });
  });
  th.querySelectorAll("th").forEach(h=>{
    h.addEventListener("click",()=>{
      const k=h.dataset.k;
      if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=-1}
      renderMatrix();
    });
  });
  $("runid").textContent=runId+" · n="+nSample;
}

const Snd=(()=>{
  let ac=null,master=null,on=false,birdTimer=null,wg=null;
  function build(){
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain();master.gain.value=0;master.connect(ac.destination);
    const len=ac.sampleRate*4,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
    let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.2}
    const src=ac.createBufferSource();src.buffer=buf;src.loop=true;
    const bp=ac.createBiquadFilter();bp.type="bandpass";bp.frequency.value=480;bp.Q.value=.8;
    wg=ac.createGain();wg.gain.value=.14;
    src.connect(bp);bp.connect(wg);wg.connect(master);src.start();
    const lfo=ac.createOscillator();lfo.frequency.value=.06;
    const lg=ac.createGain();lg.gain.value=160;lfo.connect(lg);lg.connect(bp.frequency);lfo.start();
    /* 麦浪：幅度慢摆 */
    const lfo2=ac.createOscillator();lfo2.frequency.value=.11;
    const lg2=ac.createGain();lg2.gain.value=.05;lfo2.connect(lg2);lg2.connect(wg.gain);lfo2.start();
  }
  function chirp(){
    if(!on)return;
    const t0=ac.currentTime+.05;
    const o=ac.createOscillator(),g=ac.createGain(),m=ac.createOscillator(),mg=ac.createGain();
    o.type="sine";o.frequency.setValueAtTime(2500+Math.random()*300,t0);
    o.frequency.exponentialRampToValueAtTime(3100+Math.random()*400,t0+.08);
    m.frequency.value=40+Math.random()*28;mg.gain.value=320;m.connect(mg);mg.connect(o.frequency);
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.024,t0+.02);
    g.gain.exponentialRampToValueAtTime(.0004,t0+.32);
    o.connect(g);g.connect(master);m.start(t0);o.start(t0);o.stop(t0+.38);m.stop(t0+.38);
    birdTimer=setTimeout(chirp,(3+Math.random()*8)*1000);
  }
  return{toggle(){
      if(!ac)build();
      if(ac.state==="suspended")ac.resume();
      on=!on;
      master.gain.cancelScheduledValues(ac.currentTime);
      master.gain.linearRampToValueAtTime(on?1:0,ac.currentTime+1.5);
      if(on)chirp();else clearTimeout(birdTimer);
      localStorage.setItem("mira-snd-064",on?"1":"0");
      return on;
    }};
})();

}

/* ================= draw ================= */
let t=0;
function sheafH(s){return s.grow*H*.30*heightOf(s.m)}
function draw(now){
  const L=sampleLight(heure);
  const sun=sunPos();
  const horizonY=H*.42;
  const dayF=Math.min(1,Math.max(0,Math.min((heure-5.2)/1.6,(20.8-heure)/1.6,1)));
  /* --- 天空 --- */
  const g=ctx.createLinearGradient(0,0,0,horizonY);
  g.addColorStop(0,rgb(L.sky));g.addColorStop(1,rgb(L.hor));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,horizonY+1);
  /* 太阳光晕 + 低垂的日轮（金色时刻的主角） */
  const sg=ctx.createRadialGradient(sun.x,sun.y,0,sun.x,sun.y,H*.4);
  sg.addColorStop(0,rgb(FAM.miel,.5*L.warm+.12));sg.addColorStop(1,rgb(FAM.miel,0));
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,horizonY+2);
  if(sun.day){
    const low=1-Math.min(1,Math.abs(sun.y-horizonY)/(H*.34)); /* 越贴近地平线越大越红 */
    const sr=H*(.030+.030*low);
    const sunC=lerpHSL(FAM.miel,FAM.ambre,low*.55);
    ctx.fillStyle=rgb(sunC,.92);
    ctx.beginPath();ctx.arc(sun.x,sun.y,sr,0,7);ctx.fill();
    ctx.fillStyle=rgb(FAM.miel,.5);
    ctx.beginPath();ctx.arc(sun.x,sun.y,sr*.55,0,7);ctx.fill();
  }
  /* 云（碎色团） */
  clouds.forEach(c=>{
    c.nx+=c.sp*.00016;if(c.nx>1.2)c.nx=-.2;if(c.nx<-.2)c.nx=1.2;
    const cx=c.nx*W,cy=c.ny*H+H*.04;
    for(let k=0;k<9;k++){
      const a=k/9*Math.PI*2+c.ph;
      const px=cx+Math.cos(a)*c.r*.6,py=cy+Math.sin(a)*c.r*.16;
      ctx.fillStyle=rgb(fade(FAM.miel,L.sky,.3),.16*dayF+.05);
      ctx.beginPath();ctx.ellipse(px,py,c.r*.34,c.r*.10,0,0,7);ctx.fill();
    }
  });
  /* 远景林带（大气透视） */
  ctx.fillStyle=rgb(fade(FAM.ocre,L.hor,.72),.5);
  ctx.beginPath();ctx.moveTo(0,horizonY);
  for(let x=0;x<=W;x+=10){
    ctx.lineTo(x,horizonY-H*.014*(1+Math.sin(x*.006+2)*.5)-H*.008*Math.sin(x*.017));
  }
  ctx.lineTo(W,horizonY);ctx.closePath();ctx.fill();
  /* --- 田地基色 --- */
  const fg=ctx.createLinearGradient(0,horizonY,0,H);
  fg.addColorStop(0,rgb(L.far));fg.addColorStop(1,rgb(L.near));
  ctx.fillStyle=fg;ctx.fillRect(0,horizonY,W,H-horizonY);
  /* 地平一线光 */
  ctx.fillStyle=rgb(FAM.miel,.4*dayF+.1);
  ctx.fillRect(0,horizonY-0.5,W,1);
  /* --- 田里碎色笔触（风在行进的浪） --- */
  const windAmp=VENT*2.2+.3;
  fieldStrokes.forEach(s=>{
    const y=horizonY+6+s.ny*(H-horizonY-6);
    const depth=(y-horizonY)/(H-horizonY);
    const x=((s.nx*W)+Math.sin(t*.9+s.ny*14)*windAmp*depth*3)%W;
    const base=lerpHSL(L.far,L.near,depth);
    const c=s.hue>.6?fade(base,FAM.miel,.3+.3*s.hue*L.warm+.1):fade(base,FAM.ambre,.35*s.v+.1);
    const wave=Math.sin(t*1.4+s.nx*9+s.ny*20)*windAmp*depth;
    ctx.strokeStyle=rgb(c,.46+.3*depth);
    ctx.lineWidth=Math.max(.7,1.6*depth);
    ctx.beginPath();
    ctx.moveTo(x-s.len*depth*.8,y+wave*.4);
    ctx.lineTo(x+s.len*depth*.8,y+wave*.4+s.tilt*2-wave*.8);
    ctx.stroke();
  });
  /* --- 量尺（画在田边的木尺） --- */
  const rulerX=W*.075;
  const rTop=horizonY+H*.06,rBot=H*.78;
  ctx.strokeStyle=rgb(FAM.ocre,.55);ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(rulerX,rTop);ctx.lineTo(rulerX,rBot);ctx.stroke();
  ctx.font="8.5px 'SF Mono',Menlo,monospace";ctx.textAlign="right";ctx.fillStyle=rgb(FAM.ocre,.7);
  for(let v=0;v<=100;v+=25){
    const y=rBot-(rBot-rTop)*v/100;
    ctx.beginPath();ctx.moveTo(rulerX-7,y);ctx.lineTo(rulerX,y);ctx.stroke();
    ctx.fillText(isMT(bench)?(v/10).toFixed(0):String(v),rulerX-10,y+3);
  }
  ctx.save();ctx.translate(rulerX-16,(rTop+rBot)/2);ctx.rotate(-Math.PI/2);
  ctx.textAlign="center";ctx.fillStyle=rgb(FAM.ocre,.6);
  ctx.fillText(bench.toUpperCase()+" · ÉCHELLE",0,0);ctx.restore();
  /* --- 麦捆（先画影，后画捆） --- */
  const sunA=Math.atan2(sun.y-horizonY,sun.x-W/2);
  const shDir=sun.x<W/2?1:-1; /* 影子背向太阳 */
  /* 生长推进：墙钟与帧数取大者（headless 截图下同样能长成） */
  sheaves.forEach(s=>{
    const kw=((now-growBase)/1000-s.growDelay)/.9;
    const kf=(frameN/60-s.growDelay)/.9;
    const k=Math.min(1,Math.max(0,Math.max(kw,kf)));
    s.grow=1-Math.pow(1-k,3);
  });
  const order=[...sheaves].sort((a,b)=>a.y-b.y);
  order.forEach(s=>{
    const h=sheafH(s);if(h<2)return;
    const shLen=h*L.sh*(0.35+0.65*(1-Math.abs(sun.y-horizonY)/(H*.4)));
    /* 影子：蓝紫系碎笔触，禁止黑灰 */
    const shC=fade(FAM.ombre,L.near,.25);
    for(let k=0;k<10;k++){
      const p=k/10;
      ctx.strokeStyle=rgb(shC,.20*(1-p)+.04);
      ctx.lineWidth=7*(1-p*.6);
      ctx.beginPath();
      ctx.moveTo(s.x+shDir*h*.12*p*4+shDir*p*shLen*.5,s.y+3+p*2+((k%3)-1)*2);
      ctx.lineTo(s.x+shDir*(p*shLen+10),s.y+4+p*3+((k%3)-1)*2);
      ctx.stroke();
    }
  });
  order.forEach(s=>{
    const h=sheafH(s);if(h<2)return;
    const isHov=s===hovered,isSel=s.m.id===selectedId;
    const sway=Math.sin(t*1.3+s.ph+s.x*.01)*(VENT*7+1.2)*(isHov?1.8:1);
    /* 捆身：金→琥珀碎笔触，底收顶放的麦捆形 */
    s.strokes.forEach((st,k)=>{
      const visible=k/s.strokes.length<Math.min(1,s.grow*1.15);
      if(!visible)return;
      const sh=h*st.len;
      const bx=s.x+st.ox*9;                     /* 底部收拢 */
      const fan=st.ox*(13+sh*.11);              /* 顶部扇开 */
      const tipX=s.x+fan+sway*(sh/h)+st.tilt*sh*.3;
      const litSide=(st.ox*shDir)<0;            /* 朝太阳的一面受光 */
      const lit=st.hue>.45?litSide:!litSide?st.hue>.7:false;
      const c0=lit?lerpHSL(FAM.or,FAM.miel,L.warm*.35+st.hue*.2)
                 :st.hue>.6?lerpHSL(FAM.ambre,FAM.ocre,.35)
                 :lerpHSL(FAM.ambre,FAM.or,st.hue*.5);
      const c=dayF<.99?fade(c0,FAM.ombre,(1-dayF)*.5):c0; /* 夜色：锁色相，只降明度饱和 */
      ctx.strokeStyle=rgb(c,.88);
      ctx.lineWidth=2.4;
      ctx.beginPath();ctx.moveTo(bx,s.y);ctx.lineTo(tipX,s.y-sh);ctx.stroke();
      /* 点彩穗尖 */
      if(lit){ctx.fillStyle=rgb(FAM.miel,.75);
        ctx.beginPath();ctx.arc(tipX,s.y-sh,1.4,0,7);ctx.fill()}
    });
    /* 束腰：焦赭带 */
    ctx.strokeStyle=rgb(FAM.ocre,.85);ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(s.x-13,s.y-h*.32);ctx.lineTo(s.x+13,s.y-h*.32);ctx.stroke();
    /* 误差棒 */
    if(showCI){
      const ciPx=ci95(s.m)/(isMT(bench)?10:100)*H*.30*(norm?3:1);
      const y=s.y-h;
      ctx.strokeStyle=rgb(FAM.ocre,.8);ctx.lineWidth=1.2;
      ctx.beginPath();ctx.moveTo(s.x+sway,y-ciPx);ctx.lineTo(s.x+sway,y+ciPx);
      ctx.moveTo(s.x+sway-5,y-ciPx);ctx.lineTo(s.x+sway+5,y-ciPx);
      ctx.moveTo(s.x+sway-5,y+ciPx);ctx.lineTo(s.x+sway+5,y+ciPx);ctx.stroke();
    }
    /* Δ 签 */
    const inkC=lerpHSL(FAM.ocre,FAM.miel,(1-dayF)*.55); /* 入暮后标签提亮 */
    ctx.font="9px 'SF Mono',Menlo,monospace";ctx.textAlign="center";
    ctx.fillStyle=s.m.delta>=0?rgb(inkC,.92):rgb(lerpHSL(FAM.ombre,FAM.miel,(1-dayF)*.4),.9);
    ctx.fillText((s.m.delta>=0?"+":"")+s.m.delta.toFixed(1),s.x,s.y+16);
    /* 选中：量绳连到尺 */
    if(isSel){
      ctx.strokeStyle=rgb(inkC,.65);ctx.setLineDash([4,5]);ctx.lineDashOffset=-t*12;
      ctx.beginPath();ctx.moveTo(s.x,s.y-h);
      ctx.lineTo(rulerX,rBot-(rBot-rTop)*Math.min(1,heightOf(s.m)));ctx.stroke();
      ctx.setLineDash([]);
    }
    /* 名字 */
    ctx.font=(isSel||isHov?"600 ":"")+"10.5px 'SF Mono',Menlo,monospace";
    ctx.fillStyle=isSel?rgb(inkC):rgb(inkC,.82);
    ctx.fillText(s.m.id,s.x,s.y+30);
    if(isHov||isSel){
      ctx.fillStyle=rgb(inkC);
      ctx.fillText(fmt(bench,s.m.s[bench]),s.x,s.y-h-10);
    }
  });
  /* --- 夜间灯火（田边一点灯） --- */
  if(dayF<.5){
    const lampX=W*.1,lampY=H*.66;
    const lg=ctx.createRadialGradient(lampX,lampY,0,lampX,lampY,70);
    lg.addColorStop(0,rgb(FAM.or,.5*(.5-dayF)));lg.addColorStop(1,rgb(FAM.or,0));
    ctx.fillStyle=lg;ctx.beginPath();ctx.arc(lampX,lampY,70,0,7);ctx.fill();
    ctx.fillStyle=rgb(FAM.miel,.9);
    ctx.fillRect(lampX-1,lampY-6,2,6);
  }
  /* --- 纸纹 + 颗粒 --- */
  if(!paperPat)paperPat=ctx.createPattern(paperC,"repeat");
  ctx.save();ctx.globalAlpha=.07;ctx.globalCompositeOperation="multiply";
  ctx.fillStyle=paperPat;ctx.fillRect(0,0,W,H);ctx.restore();
  updateGrain(now);
  if(!grainPat)grainPat=ctx.createPattern(grainC,"repeat");
  if(grainPat){ctx.save();ctx.globalAlpha=.03;ctx.globalCompositeOperation="overlay";
    ctx.fillStyle=grainPat;ctx.fillRect(0,0,W,H);ctx.restore()}
  syncTimer();
}

/* ================= boot ================= */
genData();layoutField();renderMatrix();writeHash();
if(hashParams.has("still"))growBase=-1e7; /* QA/分享直出成熟画面 */
if(innerWidth<760)document.body.classList.add("hideui");
let last=performance.now(),frameN=0;
(function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  t+=dt;frameN++;
  draw(now);
  requestAnimationFrame(loop);
})(last);
</script>
</body></html>
