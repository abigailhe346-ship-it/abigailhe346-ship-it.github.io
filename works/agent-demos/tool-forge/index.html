<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N°070 Tool Forge — 金色时刻的铸剑台 · Atelier MIRA</title>
<style>
  /* ============================================================
     Atelier MIRA · N°070 · 金色时刻 Heure Dorée（暖 ≈3200K）
     #F4E3C2 蜜光 · #E8B96F 金 · #D98E4A 琥珀 · #A85B3C 焦赭
     #5E6E7E 阴影补色蓝
     铁律：受光面走金→琥珀；阴影必须是蓝紫系，禁止黑灰。
     ============================================================ */
  :root{
    --serif:Didot,"Bodoni MT",Georgia,"Songti SC",serif;
    --mono:"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:-apple-system,"Helvetica Neue","PingFang SC",sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
    /* 由 JS 按 heure 写入 */
    --bg:#F4E3C2; --frame:#F8ECD2; --ink:#5B4A34; --dim:#9A8468;
    --line:#E2D2B0; --ambre:#D98E4A; --ombre:#5E6E7E; --chip:rgba(248,236,210,.66);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
       -webkit-font-smoothing:antialiased;overflow-x:hidden;
       transition:background-color 1.2s var(--ease),color 1.2s var(--ease)}
  ::selection{background:var(--ambre);color:var(--frame)}
  button{font-family:inherit}
  body:not(.prete),body:not(.prete) *{transition:none!important}

  canvas#papier,canvas#grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  canvas#papier{mix-blend-mode:multiply;opacity:.9;z-index:60}
  canvas#grain{mix-blend-mode:overlay;opacity:.05;z-index:61}
  header,.barre,.stage,#colo,#mot,#indice{position:relative;z-index:2}

  /* ---------- 头部 ---------- */
  header{display:flex;align-items:flex-start;gap:16px;padding:16px 26px 8px;flex-wrap:wrap}
  header h1{font-family:var(--serif);font-weight:400;font-size:clamp(21px,2.5vw,29px);letter-spacing:.1em}
  header h1 i{font-style:italic;color:var(--dim)}
  header .epi{font-family:var(--serif);font-style:italic;font-size:14.5px;color:var(--dim);margin-top:3px}
  header .acts{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .hbtn{appearance:none;background:transparent;border:1px solid var(--dim);color:var(--ink);
        height:30px;min-width:30px;padding:0 9px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
        font-family:var(--mono);font-size:9px;letter-spacing:.14em;cursor:pointer;transition:all .3s var(--ease)}
  .hbtn:hover{border-color:var(--ink)}
  .hbtn.on{background:var(--ink);border-color:var(--ink);color:var(--frame)}
  .hbtn svg{display:block}

  /* ---------- 工具栏 ---------- */
  .barre{display:flex;align-items:flex-end;gap:20px;padding:6px 26px 12px;flex-wrap:wrap}
  .seg{display:flex;border:1px solid var(--dim)}
  .seg button{appearance:none;border:none;background:transparent;color:var(--dim);
    font-family:var(--mono);font-size:9px;letter-spacing:.12em;padding:7px 11px;cursor:pointer;
    border-right:1px solid var(--dim);transition:all .25s var(--ease)}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--ink);color:var(--frame)}
  .seg-cap{font-family:var(--mono);font-size:8px;letter-spacing:.2em;color:var(--dim);
           text-transform:uppercase;margin-right:-12px;align-self:center}
  .etudes{display:flex;gap:6px}
  .etu{appearance:none;background:transparent;border:1px solid var(--dim);color:var(--dim);
       font-family:var(--serif);font-style:italic;font-size:12.5px;padding:6px 11px;cursor:pointer;transition:all .25s var(--ease)}
  .etu:hover{color:var(--ink);border-color:var(--ink)}
  .etu.on{background:var(--ink);border-color:var(--ink);color:var(--frame)}
  .cadran-ctl{display:flex;flex-direction:column;gap:3px;flex:1;min-width:180px;max-width:330px;margin-left:auto}
  .cadran-ctl .crow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:8px;
                    letter-spacing:.18em;color:var(--dim);text-transform:uppercase}
  .cadran-ctl .crow b{font-weight:400;color:var(--ink)}
  #cadcv{width:100%;height:32px;display:block;cursor:ew-resize;touch-action:none}

  /* ---------- 主区 ---------- */
  .stage{max-width:1260px;margin:0 auto;padding:4px 24px 70px;
         display:grid;grid-template-columns:minmax(300px,.9fr) minmax(0,1.3fr);gap:22px}
  @media (max-width:920px){.stage{grid-template-columns:1fr}}

  .carte{background:var(--frame);border:1px solid var(--line);padding:18px 20px 16px;
         transition:background-color 1.2s,border-color 1.2s}
  .carte .ct{font-family:var(--mono);font-size:8.5px;letter-spacing:.24em;color:var(--dim);
             text-transform:uppercase;display:flex;align-items:center;gap:9px;margin-bottom:13px}
  .carte .ct::after{content:"";flex:1;height:1px;background:var(--line)}
  .champ{margin-bottom:12px}
  .champ label{display:block;font-family:var(--mono);font-size:8px;letter-spacing:.2em;
               color:var(--dim);text-transform:uppercase;margin-bottom:4px}
  .champ input[type=text]{width:100%;appearance:none;background:transparent;border:none;
    border-bottom:1px solid var(--line);color:var(--ink);font-family:var(--serif);font-size:17px;
    padding:4px 1px;outline:none;transition:border-color .3s}
  .champ input[type=text]:focus{border-color:var(--ambre)}
  .champ textarea{width:100%;appearance:none;background:transparent;border:none;resize:none;
    border-bottom:1px solid var(--line);color:var(--dim);font-family:var(--serif);font-style:italic;
    font-size:13px;line-height:1.6;padding:3px 1px;outline:none}
  .param{display:grid;grid-template-columns:1fr 84px auto auto;gap:8px;align-items:center;
         padding:7px 0;border-bottom:1px dashed var(--line)}
  .param input[type=text]{appearance:none;background:transparent;border:none;color:var(--ink);
    font-family:var(--mono);font-size:11px;outline:none;border-bottom:1px solid transparent;padding:2px 1px}
  .param input[type=text]:focus{border-color:var(--ambre)}
  .param select{appearance:none;background:transparent;border:1px solid var(--line);color:var(--dim);
    font-family:var(--mono);font-size:9.5px;padding:3px 5px;cursor:pointer;outline:none}
  .param .req{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:8px;
              color:var(--dim);cursor:pointer;letter-spacing:.06em}
  .param .req input{accent-color:var(--ambre)}
  .param .rm{appearance:none;background:transparent;border:none;color:var(--dim);cursor:pointer;
             font-family:var(--mono);font-size:12px;padding:0 2px;transition:color .2s}
  .param .rm:hover{color:var(--ambre)}
  .addrow{appearance:none;background:transparent;border:1px dashed var(--dim);color:var(--dim);
          font-family:var(--mono);font-size:9px;letter-spacing:.14em;padding:7px 10px;cursor:pointer;
          margin-top:11px;transition:all .25s var(--ease)}
  .addrow:hover{color:var(--ink);border-color:var(--ink);border-style:solid}
  #reqPrev{margin-top:14px;font-family:var(--mono);font-size:9px;line-height:1.75;color:var(--dim);
           white-space:pre-wrap;word-break:break-all;border-top:1px solid var(--line);padding-top:10px;
           max-height:130px;overflow:auto}
  #reqPrev b{color:var(--ambre);font-weight:400}

  /* 锻炉 */
  .forge{display:flex;flex-direction:column;min-width:0}
  #enclume{display:block;width:100%;height:430px;cursor:crosshair;touch-action:none;
           border:1px solid var(--line);background:var(--frame);transition:border-color 1.2s,background-color 1.2s}
  @media (max-width:600px){#enclume{height:340px}}
  .frapper{display:flex;gap:10px;align-items:center;padding:12px 0 0;flex-wrap:wrap}
  .gbtn{appearance:none;background:var(--ink);border:1px solid var(--ink);color:var(--frame);
        font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
        padding:11px 22px;cursor:pointer;transition:all .25s var(--ease)}
  .gbtn:hover{background:var(--ambre);border-color:var(--ambre)}
  .frapper .statut{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
  /* 回火条：响应 */
  #reponse{margin-top:14px;border:1px solid var(--line);background:var(--frame);position:relative;
           transition:background-color 1.2s,border-color 1.2s}
  #trempe{position:absolute;left:0;top:0;bottom:0;width:0;pointer-events:none;opacity:.5;
          background:linear-gradient(90deg,var(--ambre),var(--ombre))}
  #repTxt{position:relative;font-family:var(--mono);font-size:9.5px;line-height:1.8;color:var(--ink);
          padding:12px 16px;white-space:pre-wrap;word-break:break-all;min-height:64px;max-height:180px;overflow:auto}
  #repTxt .k{color:var(--ombre)} #repTxt .s{color:var(--ambre)} #repTxt .n{color:#A85B3C}

  /* 落款 / 手记 / 提示 */
  #colo{position:fixed;z-index:70;left:22px;bottom:16px;display:flex;align-items:center;gap:9px;
        font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink);
        background:var(--chip);padding:6px 11px;cursor:default}
  #mot{position:fixed;z-index:71;left:22px;bottom:52px;max-width:280px;background:var(--frame);
       border:1px solid var(--dim);padding:13px 15px;font-family:var(--serif);font-style:italic;
       font-size:13px;line-height:1.75;color:var(--ink);
       opacity:0;transform:translateY(8px);pointer-events:none;
       transition:opacity .6s var(--ease),transform .6s var(--ease)}
  #mot.show{opacity:1;transform:none}
  #indice{position:fixed;z-index:8;right:24px;bottom:16px;font-family:var(--mono);font-size:8.5px;
          letter-spacing:.14em;color:var(--dim);text-align:right;line-height:1.9;
          pointer-events:none;text-transform:uppercase}
  @media (max-width:640px){
    #indice{display:none}
    #colo{position:static;display:inline-flex;margin:0 0 14px 12px;font-size:9px;padding:4px 8px}
    header{padding:12px 14px 4px}
    .barre{padding:4px 14px 10px;gap:12px}
    .stage{padding:2px 14px 24px}
    .cadran-ctl{margin-left:0}
  }
</style>
</head>
<body>

<canvas id="papier"></canvas>
<canvas id="grain"></canvas>

<header>
  <div>
    <h1>金色时刻的<i>铸剑台</i> · Tool Forge</h1>
    <div class="epi">「光线在下午四点开始变得值得原谅。」</div>
  </div>
  <div class="acts">
    <button class="hbtn" id="btnSnd" title="炉火与环境声（默认关闭）" aria-label="声音开关">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
        <path d="M2 6.5v3h2.6L8.4 13V3L4.6 6.5H2z" fill="currentColor" stroke="none"/>
        <path d="M10.5 5.2c1.6 1.5 1.6 4.1 0 5.6M12.4 3.6c2.6 2.6 2.6 6.2 0 8.8"/>
      </svg>
    </button>
  </div>
</header>

<div class="barre">
  <span class="seg-cap">窗外</span>
  <div class="seg" id="wxSeg">
    <button data-w="clair" class="on">晴</button>
    <button data-w="pluie">雨</button>
    <button data-w="brume">雾</button>
    <button data-w="neige">雪</button>
  </div>
  <div class="etudes" id="etudes">
    <button class="etu on" data-e="epee">铸剑</button>
    <button class="etu" data-e="lame">淬刃</button>
    <button class="etu" data-e="tranchant">开锋</button>
  </div>
  <div class="cadran-ctl">
    <div class="crow"><span>日轨 LE CADRAN</span><b id="cadH">--:--</b></div>
    <canvas id="cadcv"></canvas>
  </div>
</div>

<div class="stage">
  <!-- 配方卡 -->
  <div class="carte">
    <div class="ct">配方卡 · Recette</div>
    <div class="champ"><label>工具名 · NOM</label>
      <input type="text" id="tNom" value="get_weather" spellcheck="false"></div>
    <div class="champ"><label>自述 · DESCRIPTION</label>
      <textarea id="tDesc" rows="2" spellcheck="false">查一座城市此刻的天气，报回温度与天色。</textarea></div>
    <div class="ct">锻料 · PARAMÈTRES</div>
    <div id="params"></div>
    <button class="addrow" id="addParam">+ 添一味锻料</button>
    <div id="reqPrev"></div>
  </div>

  <!-- 锻炉 -->
  <div class="forge">
    <canvas id="enclume"></canvas>
    <div class="frapper">
      <button class="gbtn" id="btnFrapper">落锤 · INVOQUER</button>
      <span class="statut" id="statut">炉火正温，等一锤。</span>
    </div>
    <div id="reponse"><div id="trempe"></div><div id="repTxt">—— 回音会在这里慢慢冷却。——</div></div>
  </div>
</div>

<div id="colo" title="连点三下，有一段手记">
  <svg width="22" height="14" viewBox="0 0 64 40" fill="#A85B3C" aria-hidden="true">
    <path d="M32 20 C 26 12, 14 6, 4 8 C 12 12, 18 18, 24 21
             C 14 20, 6 22, 2 28 C 10 26, 18 26, 25 26
             C 27 30, 30 34, 34 36 C 33 32, 33 28, 34 25
             C 42 22, 52 16, 62 4 C 54 10, 44 16, 36 19
             C 35 17, 33 17, 32 20 Z"/>
  </svg>
  <span>Atelier MIRA · N°070 · Heure Dorée</span>
</div>
<div id="mot">铁匠说，好剑不问出炉的时辰。可我知道他在骗人——他总是等到西窗的光斜到第四根窗棂才肯落锤。那十分钟里，连火星都是金色的。——M，铸剑台旁听记</div>

<div id="indice">点砧=试锤 · 落锤=调用（Enter）<br>拖动日轨，等下午四点的光</div>

<script>
(function(){
"use strict";

/* ================= 工具 ================= */
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;var t=Math.imul(a^(a>>>15),1|a);
  t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
var rng=mulberry32(70070);
function lerp(a,b,t){return a+(b-a)*t;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function hsla(h,s,l,a){return "hsla("+h.toFixed(1)+","+s.toFixed(1)+"%,"+l.toFixed(1)+"%,"+a+")";}
function hex2hsl(hex){
  var r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  var mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,h=0,s=0,d=mx-mn;
  if(d>0){s=l>.5?d/(2-mx-mn):d/(mx+mn);
    if(mx===r)h=((g-b)/d+(g<b?6:0));else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;}
  return [h,s*100,l*100];
}
function lerpHSL(c1,c2,t){
  var dh=c2[0]-c1[0];if(dh>180)dh-=360;if(dh<-180)dh+=360;
  return [c1[0]+dh*t,lerp(c1[1],c2[1],t),lerp(c1[2],c2[2],t)];
}
function css2(hsl,a){return hsla(hsl[0],hsl[1],hsl[2],a===undefined?1:a);}

/* ================= heure：金色时刻 ================= */
/* bg 墙 / frame 纸 / ink 墨 / dim 淡墨 / line 线 / ciel 窗外 / or 金光强度 / nuit */
var KEY=[
 [0.0, "#5E6E7E","#68788A","#F4E3C2","#B9C0C8","#4E5C6C","#3E4A5C",0.15,1.0],
 [5.5, "#8A8A90","#94949A","#EDE0C4","#8E94A0","#5E6E7E","#7E8AA0",0.25,0.5],
 [7.0, "#EBDDBE","#F2E6C9","#5B4A34","#9A8468","#E2D2B0","#C9CFD6",0.45,0.1],
 [12.0,"#F4E9CE","#F9F0DA","#54452F","#9A8468","#E6D8B6","#C4CDD8",0.6,0.0],
 [16.0,"#F4E3C2","#F8ECD2","#5B4A34","#9A8468","#E2D2B0","#C2CBD6",0.85,0.05],
 [18.0,"#EFD6AC","#F5E2BC","#5E4A32","#9A7E60","#E0C9A0","#C9BFBE",1.0,0.1],
 [20.5,"#7A7488","#858096","#F0E2C4","#B4AEBE","#565064","#5E6884",0.5,0.65],
 [24.0,"#5E6E7E","#68788A","#F4E3C2","#B9C0C8","#4E5C6C","#3E4A5C",0.15,1.0]
].map(function(k){return [k[0],hex2hsl(k[1]),hex2hsl(k[2]),hex2hsl(k[3]),hex2hsl(k[4]),hex2hsl(k[5]),hex2hsl(k[6]),k[7],k[8]];});
var heure=(function(){var d=new Date();return d.getHours()+d.getMinutes()/60;})();
(function(){var m=(location.hash||"").match(/h=([\d.]+)/);if(m)heure=clamp(parseFloat(m[1]),0,24);})();
function lumiere(h){
  h=((h%24)+24)%24;
  var i=0;while(i<KEY.length-2&&KEY[i+1][0]<h)i++;
  var a=KEY[i],b=KEY[i+1],t=clamp((h-a[0])/Math.max(.001,b[0]-a[0]),0,1);
  t=t*t*(3-2*t);
  return {bg:lerpHSL(a[1],b[1],t),frame:lerpHSL(a[2],b[2],t),ink:lerpHSL(a[3],b[3],t),
          dim:lerpHSL(a[4],b[4],t),line:lerpHSL(a[5],b[5],t),ciel:lerpHSL(a[6],b[6],t),
          or:lerp(a[7],b[7],t),nuit:lerp(a[8],b[8],t)};
}
var OR=hex2hsl("#E8B96F"),AMBRE=hex2hsl("#D98E4A"),OMBRE=hex2hsl("#5E6E7E"),MIEL=hex2hsl("#F4E3C2"),BRULE=hex2hsl("#A85B3C");
function appliquerLumiere(){
  var L=lumiere(heure),st=document.documentElement.style;
  st.setProperty("--bg",css2(L.bg));st.setProperty("--frame",css2(L.frame));
  st.setProperty("--ink",css2(L.ink));st.setProperty("--dim",css2(L.dim));
  st.setProperty("--line",css2(L.line));st.setProperty("--chip",css2(L.frame,0.66));
  document.body.style.backgroundColor=css2(L.bg);
}

/* ================= 画布 ================= */
var cv=document.getElementById("enclume"),ctx=cv.getContext("2d");
var pap=document.getElementById("papier"),pctx=pap.getContext("2d");
var grc=document.getElementById("grain"),gctx=grc.getContext("2d");
var DPR=1,W=0,H=0;
var fondOff=document.createElement("canvas"),fondX=fondOff.getContext("2d");
var fondHeure=-1,meteo="clair";
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  var r=cv.getBoundingClientRect();W=r.width;H=r.height;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  fondOff.width=W*DPR;fondOff.height=H*DPR;fondX.setTransform(DPR,0,0,DPR,0,0);
  pap.width=innerWidth*DPR;pap.height=innerHeight*DPR;pctx.setTransform(DPR,0,0,DPR,0,0);
  grc.width=innerWidth*DPR;grc.height=innerHeight*DPR;gctx.setTransform(DPR,0,0,DPR,0,0);
  peindreFond();peindrePapier();tracerCadran();
}
window.addEventListener("resize",resize);
function peindrePapier(){
  var w=innerWidth,h=innerHeight;
  pctx.clearRect(0,0,w,h);var r=mulberry32(70406);
  var n=Math.floor(w*h/380);
  for(var i=0;i<n;i++){
    var a=0.02+r()*0.04,g=185+((r()*55)|0);
    pctx.fillStyle="rgba("+g+","+(g-6)+","+(g-16)+","+a.toFixed(3)+")";
    pctx.beginPath();pctx.arc(r()*w,r()*h,0.4+r()*1.6,0,6.29);pctx.fill();
  }
  pctx.strokeStyle="rgba(120,95,60,0.05)";pctx.lineWidth=0.5;
  for(var f=0;f<40;f++){
    var x=r()*w,y=r()*h,an=r()*6.29,ln=18+r()*46;
    pctx.beginPath();pctx.moveTo(x,y);
    pctx.quadraticCurveTo(x+Math.cos(an)*ln*0.5,y+Math.sin(an)*ln*0.5+(r()-.5)*7,
                          x+Math.cos(an)*ln,y+Math.sin(an)*ln);pctx.stroke();
  }
}
var grTile=document.createElement("canvas");grTile.width=grTile.height=140;
function grainTick(){
  var gx=grTile.getContext("2d"),id=gx.createImageData(140,140),d=id.data,r=Math.random;
  for(var i=0;i<d.length;i+=4){var v=110+((r()*90)|0);d[i]=d[i+1]=d[i+2]=v;d[i+3]=26;}
  gx.putImageData(id,0,0);
  gctx.clearRect(0,0,innerWidth,innerHeight);
  gctx.fillStyle=gctx.createPattern(grTile,"repeat");gctx.fillRect(0,0,innerWidth,innerHeight);
}

/* ---- 锻炉背景：墙 + 西窗 + 天气 + 光柱 ---- */
var gouttes=[],flocons=[];
function peindreFond(){
  var L=lumiere(heure);fondHeure=heure;
  var x=fondX;x.clearRect(0,0,W,H);
  var r=mulberry32(7000+((heure*4)|0));
  /* 墙：暖纸色碎笔 */
  x.fillStyle=css2(L.frame);x.fillRect(0,0,W,H);
  for(var i=0;i<1800;i++){
    var col=lerpHSL(L.frame,L.bg,r());
    col[0]+=(r()-.5)*10;col[2]+=(r()-.5)*13;col[1]+=(r()-.5)*8;
    x.strokeStyle=css2(col,0.1+r()*0.18);x.lineWidth=1+r()*2.2;
    var xx=r()*W,yy=r()*H,ln=4+r()*10,an=(r()-.5)*0.3;
    x.beginPath();x.moveTo(xx,yy);x.lineTo(xx+Math.cos(an)*ln,yy+Math.sin(an)*ln);x.stroke();
  }
  /* 西窗：左上 */
  var wx=W*0.06,wy=H*0.07,ww=W*0.30,wh=H*0.46;
  /* 窗外天空 */
  x.save();x.beginPath();x.rect(wx,wy,ww,wh);x.clip();
  var g=x.createLinearGradient(0,wy,0,wy+wh);
  g.addColorStop(0,css2(L.ciel));g.addColorStop(1,css2(lerpHSL(L.ciel,L.frame,0.4)));
  x.fillStyle=g;x.fillRect(wx,wy,ww,wh);
  for(var i=0;i<500;i++){
    var col=lerpHSL(L.ciel,L.frame,r()*0.5);
    col[0]+=(r()-.5)*10;col[2]+=(r()-.5)*10;
    x.strokeStyle=css2(col,0.1+r()*0.16);x.lineWidth=1+r()*2;
    var xx=wx+r()*ww,yy=wy+r()*wh,ln=4+r()*10;
    x.beginPath();x.moveTo(xx,yy);x.lineTo(xx+ln,yy+(r()-.5)*3);x.stroke();
  }
  /* 天气 */
  var i2;
  if(meteo==="pluie"){
    x.strokeStyle=css2(lerpHSL(L.ciel,OMBRE,0.4),0.5);x.lineWidth=1;
    for(i2=0;i2<90;i2++){
      var gx2=wx+r()*ww,gy2=wy+r()*wh;
      x.beginPath();x.moveTo(gx2,gy2);x.lineTo(gx2-4,gy2+12+r()*10);x.stroke();
    }
  }else if(meteo==="neige"){
    for(i2=0;i2<70;i2++){
      x.fillStyle=css2(MIEL,0.5+r()*0.4);
      x.beginPath();x.arc(wx+r()*ww,wy+r()*wh,0.8+r()*1.6,0,6.29);x.fill();
    }
  }else if(meteo==="brume"){
    for(i2=0;i2<4;i2++){
      var fg=x.createRadialGradient(wx+ww*r(),wy+wh*r(),0,wx+ww*0.5,wy+wh*0.5,ww*0.7);
      fg.addColorStop(0,css2(L.frame,0.3));fg.addColorStop(1,css2(L.frame,0));
      x.fillStyle=fg;x.fillRect(wx,wy,ww,wh);
    }
  }else{
    /* 晴：一小片云 */
    for(i2=0;i2<20;i2++){
      var cc=lerpHSL(L.ciel,L.frame,0.7);
      x.strokeStyle=css2(cc,0.1+r()*0.1);x.lineWidth=1.5+r()*2;
      var kx=wx+ww*0.3+(r()-.5)*ww*0.4,ky=wy+wh*0.3+(r()-.5)*14,kl=8+r()*20;
      x.beginPath();x.moveTo(kx,ky);x.lineTo(kx+kl,ky+(r()-.5)*3);x.stroke();
    }
  }
  x.restore();
  /* 窗棂：四根——题记里的"第四根窗棂" */
  x.strokeStyle=css2(L.ink,0.75);x.lineWidth=3;
  x.strokeRect(wx,wy,ww,wh);
  x.lineWidth=1.6;
  for(var m=1;m<4;m++){
    x.beginPath();x.moveTo(wx+ww*m/4,wy);x.lineTo(wx+ww*m/4,wy+wh);x.stroke();
  }
  x.beginPath();x.moveTo(wx,wy+wh/2);x.lineTo(wx+ww,wy+wh/2);x.stroke();
  /* 光柱：从窗到砧，金色时刻最盛 */
  if(L.or>0.06){
    var spread=lerp(0.35,1.0,L.or);
    var bx=wx+ww*0.9,by=wy+wh*0.3;
    var tx=W*0.62,ty=H*0.78;
    var grad=x.createLinearGradient(bx,by,tx,ty);
    grad.addColorStop(0,css2(OR,0.28*L.or*spread));
    grad.addColorStop(1,css2(AMBRE,0.05*L.or));
    x.fillStyle=grad;
    x.beginPath();
    x.moveTo(wx+ww*0.25,wy+wh);x.lineTo(wx+ww,wy+wh*0.55);
    x.lineTo(tx+60,ty+40);x.lineTo(tx-90,ty+60);
    x.closePath();x.fill();
    /* 光尘 */
    for(var i=0;i<60;i++){
      var t2=r(),px2=lerp(wx+ww*0.6,tx,t2)+(r()-.5)*60,py2=lerp(wy+wh*0.7,ty,t2)+(r()-.5)*40;
      x.fillStyle=css2(OR,L.or*0.35*r());
      x.beginPath();x.arc(px2,py2,0.6+r()*1.2,0,6.29);x.fill();
    }
  }
  /* 工作台地面 */
  for(var i=0;i<700;i++){
    var yy=H*0.82+r()*H*0.18;
    var col=lerpHSL(L.bg,OMBRE,0.12+r()*0.15);col[2]+=(r()-.5)*8;
    x.strokeStyle=css2(col,0.12+r()*0.16);x.lineWidth=1+r()*2;
    var xx=r()*W,ln=6+r()*14;
    x.beginPath();x.moveTo(xx,yy);x.lineTo(xx+ln,yy+(r()-.5)*3);x.stroke();
  }
}

/* ---- 砧与锭 ---- */
var chaleur=0.55; /* 锭温 0..1 */
var marteau={angle:-0.5,cible:-0.5,v:0};
var etincelles=[];
var ondesF=[];
function dessinerEnclume(now){
  var L=lumiere(heure);
  ctx.clearRect(0,0,W,H);
  ctx.drawImage(fondOff,0,0,W,H);
  var r=mulberry32(707);
  var ax=W*0.56,ay=H*0.68; /* 砧心 */
  /* 砧的影子：蓝色——莫奈不用黑色 */
  for(var i=0;i<160;i++){
    var sx=ax+20+r()*W*0.2,sy=ay+84+(r()-.5)*16;
    var col=lerpHSL(OMBRE,L.bg,r()*0.3);col[2]+=(r()-.5)*8;
    ctx.strokeStyle=css2(col,0.1+r()*0.16*(0.4+L.or*0.6));
    ctx.lineWidth=1+r()*2.4;
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+8+r()*16,sy+2+r()*3);ctx.stroke();
  }
  /* 砧体：补色蓝的剪影，碎笔 + 受光面罩金（分层罩染，不走色相插值） */
  function bloc(x0,y0,x1,y1){
    var base=[OMBRE[0]+6,OMBRE[1]+4,OMBRE[2]-4];
    for(var i=0;i<((x1-x0)*(y1-y0))/20;i++){
      var xx=x0+r()*(x1-x0),yy=y0+r()*(y1-y0);
      var col=[base[0]+(r()-.5)*10,base[1]+(r()-.5)*8,base[2]+(r()-.5)*9];
      ctx.strokeStyle=css2(col,0.42+r()*0.42);
      ctx.lineWidth=1+r()*2;
      ctx.beginPath();ctx.moveTo(xx,yy);ctx.lineTo(xx+3+r()*6,yy+(r()-.5)*2);ctx.stroke();
    }
    /* 罩金：亮面点彩，让眼睛自己混出金 */
    for(var i=0;i<((x1-x0)*(y1-y0))/80*L.or;i++){
      var xx=x0+r()*(x1-x0),yy=y0+r()*(y1-y0);
      var lit=clamp((xx-x0)/(x1-x0)*0.4+(0.6-(yy-y0)/(y1-y0))*0.6,0,1);
      if(r()>lit)continue;
      var g2=[OR[0]+(r()-.5)*10,OR[1],OR[2]+(r()-.5)*12];
      ctx.strokeStyle=css2(g2,0.3+r()*0.35);
      ctx.lineWidth=1+r()*1.6;
      ctx.beginPath();ctx.moveTo(xx,yy);ctx.lineTo(xx+3+r()*5,yy+(r()-.5)*2);ctx.stroke();
    }
    /* 轮廓：一笔深缘 */
    ctx.strokeStyle=css2([base[0],base[1],base[2]-10],0.55);
    ctx.lineWidth=1.4;
    ctx.strokeRect(x0,y0,x1-x0,y1-y0);
  }
  bloc(ax-88,ay-8,ax+95,ay+38);                /* 砧身 */
  bloc(ax+83,ay-20,ax+138,ay+10);              /* 砧角 */
  bloc(ax-58,ay+38,ax+65,ay+80);               /* 砧座 */
  /* 铁锭：蓝底 + 热度罩琥珀（点彩混色） */
  for(var i=0;i<200;i++){
    var xx=ax-55+r()*120,yy=ay-22+r()*14;
    var col=[OMBRE[0]+(r()-.5)*10,OMBRE[1],OMBRE[2]+(r()-.5)*10];
    ctx.strokeStyle=css2(col,0.35+r()*0.4);
    ctx.lineWidth=1+r()*1.8;
    ctx.beginPath();ctx.moveTo(xx,yy);ctx.lineTo(xx+4+r()*7,yy+(r()-.5)*1.6);ctx.stroke();
  }
  for(var i=0;i<240*chaleur;i++){
    var xx=ax-55+r()*120,yy=ay-22+r()*14;
    var col=[AMBRE[0]+(r()-.5)*12,clamp(AMBRE[1]+(r()-.5)*14,10,80),clamp(AMBRE[2]+(r()-.5)*14,20,80)];
    ctx.strokeStyle=css2(col,0.3+r()*0.5);
    ctx.lineWidth=1+r()*1.8;
    ctx.beginPath();ctx.moveTo(xx,yy);ctx.lineTo(xx+4+r()*7,yy+(r()-.5)*1.6);ctx.stroke();
  }
  if(chaleur>0.25){ /* 热光晕 */
    for(var i=0;i<26;i++){
      var an=r()*6.29,rr=18+r()*26;
      ctx.fillStyle=css2(AMBRE,chaleur*0.1);
      ctx.beginPath();ctx.arc(ax+Math.cos(an)*rr,ay-12+Math.sin(an)*rr*0.4,2+r()*3,0,6.29);ctx.fill();
    }
  }
  /* 锤 */
  var hx=ax+6,hy=ay-52;
  ctx.save();ctx.translate(hx,hy);ctx.rotate(marteau.angle);
  /* 锤柄 */
  ctx.strokeStyle=css2(BRULE,0.9);ctx.lineWidth=5;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(74,-48);ctx.stroke();
  /* 锤头：碎笔 */
  var tete=[OMBRE[0]+6,OMBRE[1]+4,OMBRE[2]-4];
  for(var hh2=0;hh2<60;hh2++){
    var tx2=-18+mulberry32(hh2*31)()*36,ty2=-11+mulberry32(hh2*17)()*22;
    ctx.strokeStyle=css2([tete[0],tete[1],tete[2]+(hh2%7)*2],0.6);
    ctx.lineWidth=1.4;
    ctx.beginPath();ctx.moveTo(tx2,ty2);ctx.lineTo(tx2+4,ty2+1);ctx.stroke();
  }
  ctx.strokeStyle=css2(tete,0.9);ctx.lineWidth=1.4;
  ctx.strokeRect(-18,-11,36,22);
  ctx.strokeStyle=css2(OR,0.4+L.or*0.35);ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(-18,-9);ctx.lineTo(18,-9);ctx.stroke();
  ctx.restore();
  /* 火星 */
  for(var i=etincelles.length-1;i>=0;i--){
    var p=etincelles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.14;p.vx*=0.985;p.vie-=0.014;
    if(p.vie<=0||p.y>H){etincelles.splice(i,1);continue;}
    var col=lerpHSL(OR,AMBRE,1-p.vie);
    ctx.strokeStyle=css2(col,p.vie*0.9);
    ctx.lineWidth=p.vie*1.8;
    ctx.beginPath();ctx.moveTo(p.x-p.vx*2.4,p.y-p.vy*2.4);ctx.lineTo(p.x,p.y);ctx.stroke();
  }
  /* 压力波 */
  for(var i=ondesF.length-1;i>=0;i--){
    var w=ondesF[i];w.r+=w.v;w.a*=0.93;
    if(w.a<0.03){ondesF.splice(i,1);continue;}
    for(var k=0;k<22;k++){
      var an=k/22*6.29;
      ctx.fillStyle=css2(AMBRE,w.a*0.5);
      ctx.beginPath();ctx.arc(w.x+Math.cos(an)*w.r,w.y+Math.sin(an)*w.r*0.5,1.3,0,6.29);ctx.fill();
    }
  }
  /* 夜的炉火点光 */
  if(L.nuit>0.3){
    for(var i=0;i<40;i++){
      var fx=W*0.12+r()*W*0.1,fy=H*0.8+r()*H*0.12;
      var fl=0.5+0.5*Math.sin(now*0.006+i);
      ctx.fillStyle=css2(AMBRE,L.nuit*0.25*fl);
      ctx.beginPath();ctx.arc(fx,fy,1+r()*2.4,0,6.29);ctx.fill();
    }
  }
}

/* ================= 锤击 ================= */
function frapper(essai){
  marteau.cible=0.62;
  setTimeout(function(){marteau.cible=-0.5;},260);
  setTimeout(function(){
    var L=lumiere(heure);
    chaleur=Math.min(1,chaleur+0.3);
    var ax=W*0.58,ay=H*0.72;
    for(var i=0;i<(essai?26:64);i++){
      var an=-Math.PI*rSpread(i)+ (rng()-.5)*0.6;
      var sp=2+rng()*(essai?3:6);
      etincelles.push({x:ax+(rng()-.5)*30,y:ay-14,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp*0.8,vie:0.7+rng()*0.5});
    }
    ondesF.push({x:ax,y:ay-6,r:8,v:4.6,a:1});
    sndClink(essai);
  },240);
}
function rSpread(i){return (i%12)/12*Math.PI*0.9+0.1;}

var $=function(id){return document.getElementById(id);};

/* ================= 日轨 ================= */
var cadcv=$("cadcv"),cadX=cadcv.getContext("2d"),cadH=$("cadH");
function tracerCadran(){
  var r=cadcv.getBoundingClientRect();if(r.width<10)return;
  var w=r.width,h=r.height;
  cadcv.width=w*DPR;cadcv.height=h*DPR;cadX.setTransform(DPR,0,0,DPR,0,0);
  cadX.clearRect(0,0,w,h);
  for(var i=0;i<48;i++){
    var L=lumiere(i/48*24),col=lerpHSL(L.bg,OR,L.or*0.4);
    cadX.strokeStyle=css2(col,0.85);cadX.lineWidth=3;
    var xx=6+i/47*(w-12);
    cadX.beginPath();cadX.moveTo(xx,h-12);cadX.lineTo(xx,h-4);cadX.stroke();
  }
  var L0=lumiere(heure);
  cadX.fillStyle=css2(L0.ink,0.7);
  cadX.font="7px 'SF Mono',Menlo,monospace";cadX.textAlign="center";
  [0,6,12,18,24].forEach(function(hh){
    var xx=6+hh/24*(w-12);
    cadX.fillRect(xx-0.5,h-17,1,3);
    cadX.fillText(hh===24?"0":String(hh),xx,h-20);
  });
  var t=heure/24,sx=6+t*(w-12),sy=h-22-Math.sin(t*Math.PI)*9;
  cadX.strokeStyle=css2(L0.ink,0.4);cadX.lineWidth=1;
  cadX.beginPath();cadX.moveTo(sx,h-13);cadX.lineTo(sx,sy+3);cadX.stroke();
  var day=heure>5.5&&heure<20.5;
  cadX.fillStyle=day?css2(OR,0.95):css2(L0.frame,0.9);
  cadX.beginPath();cadX.arc(sx,sy,3,0,6.29);cadX.fill();
  cadH.textContent=String(Math.floor(heure)).padStart(2,"0")+":"+String(Math.floor(heure%1*60)).padStart(2,"0");
}
var cadDrag=false;
function cadranVers(e){
  var r=cadcv.getBoundingClientRect();
  heure=clamp((e.clientX-r.left-6)/(r.width-12),0,1)*24;
  tracerCadran();appliquerLumiere();
}

/* ================= 声景（L5，默认 OFF） ================= */
var Snd={ctx:null,master:null,feu:null,on:false};
function sndInit(){
  if(Snd.ctx)return;
  var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  Snd.ctx=new AC();
  Snd.master=Snd.ctx.createGain();Snd.master.gain.value=0;Snd.master.connect(Snd.ctx.destination);
  /* 炉火：低噪 + 随机爆裂 */
  var len=Snd.ctx.sampleRate*3,buf=Snd.ctx.createBuffer(1,len,Snd.ctx.sampleRate),d=buf.getChannelData(0),last=0;
  for(var i=0;i<len;i++){var w=Math.random()*2-1;last=(last+0.03*w)/1.03;d[i]=last*2.6;}
  var src=Snd.ctx.createBufferSource();src.buffer=buf;src.loop=true;
  var lp=Snd.ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=420;
  var g=Snd.ctx.createGain();g.gain.value=0.12;
  src.connect(lp);lp.connect(g);g.connect(Snd.master);src.start();
  (function crepite(){
    setTimeout(function(){
      if(Snd.on){
        var t=Snd.ctx.currentTime,o=Snd.ctx.createOscillator(),g2=Snd.ctx.createGain();
        o.type="square";o.frequency.value=1400+Math.random()*2200;
        g2.gain.setValueAtTime(0.012+Math.random()*0.014,t);
        g2.gain.exponentialRampToValueAtTime(0.0001,t+0.03);
        o.connect(g2);g2.connect(Snd.master);o.start(t);o.stop(t+0.04);
      }
      crepite();
    },120+Math.random()*900);
  })();
}
function sndClink(essai){if(!Snd.on||!Snd.ctx)return;
  var t=Snd.ctx.currentTime;
  [1780,2690,3340].forEach(function(f,i){
    var o=Snd.ctx.createOscillator(),g=Snd.ctx.createGain();
    o.type="sine";o.frequency.value=f*(essai?0.82:1)+(Math.random()-.5)*30;
    var v=(essai?0.05:0.11)/(i+1);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.5+0.2*i);
    o.connect(g);g.connect(Snd.master);o.start(t);o.stop(t+0.8);
  });}
function sndMeteo(){/* 天气只改画，声音维持炉火的克制 */}

  if(Snd.ctx.state==="suspended")Snd.ctx.resume();
  Snd.master.gain.cancelScheduledValues(Snd.ctx.currentTime);
  Snd.master.gain.setTargetAtTime(Snd.on?1:0,Snd.ctx.currentTime,0.5);
});
