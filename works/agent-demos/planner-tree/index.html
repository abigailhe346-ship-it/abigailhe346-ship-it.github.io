<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planner Tree — 林间规划树 · Atelier MIRA N°071 · 林间光</title>
<!--
  Atelier MIRA · Étude N°071 · 林间光 SOUS-BOIS（穿过叶隙的光，中性偏暖，≈5000K）
  家族锚点：#E8E3CE 光斑 · #B5B98A 亮叶 · #7E8F5E 中绿 · #4E5E42 深叶 · #2F3B2C 林翳（全系列最暗，到此为止）· #D9A85C 金色斑光
  面积配比：光斑纸地 30% / 叶绿三层 55% / 林翳 10% / 金斑 ≤8%。阴影走深绿，禁止黑灰。
  一棵任务树站在林间空地上：搜索是一束会走路的光，被剪掉的枝，落成叶子。
-->
<style>
  :root{
    --ink:#33402C; --dim:#6E7A5E; --paper:rgba(232,227,206,.88); --paper-solid:#E8E3CE;
    --line:rgba(78,94,66,.34); --accent:#4E5E42; --gold:#A8802F; --accent-soft:rgba(78,94,66,.14);
    --mono:"SF Mono",Menlo,Consolas,monospace;
    --serif:Didot,"Bodoni MT",Georgia,"Songti SC",serif;
    --sans:-apple-system,"Helvetica Neue","PingFang SC",sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#B5B98A;color:var(--ink);font-family:var(--sans);overflow:hidden;
       -webkit-font-smoothing:antialiased}
  ::selection{background:var(--accent-soft)}
  button{font-family:inherit;color:inherit}
  .snap *{transition:none!important}
  canvas#field{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  canvas#field.drag{cursor:grabbing}

  header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:flex-start;
         gap:14px;padding:18px 22px 30px;pointer-events:none;
         background:linear-gradient(rgba(232,227,206,.55),rgba(232,227,206,0))}
  .seal{flex:0 0 auto;pointer-events:auto;opacity:.92}
  .etitle{padding-top:1px}
  .etitle .no{font-family:var(--mono);font-size:9.5px;letter-spacing:.26em;color:var(--accent)}
  .etitle h1{font-family:var(--serif);font-weight:400;font-size:22px;letter-spacing:.02em;margin-top:2px}
  .etitle h1 span{font-family:var(--sans);font-size:12.5px;color:var(--dim);margin-left:9px;letter-spacing:.06em}
  .etitle .epig{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--dim);
                margin-top:5px;letter-spacing:.04em}
  .hdr-right{margin-left:auto;display:flex;gap:8px;align-items:flex-start;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}

  #snd{width:34px;height:34px;border:1px solid var(--line);background:var(--paper);
       backdrop-filter:blur(8px);cursor:pointer;display:flex;align-items:center;justify-content:center;
       transition:border-color .3s var(--ease);flex:0 0 auto}
  #snd:hover{border-color:var(--accent)}
  #snd svg{stroke:var(--dim);transition:stroke .3s}
  #snd.on svg{stroke:var(--accent)}
  #snd .waves{opacity:0;transition:opacity .4s}
  #snd.on .waves{opacity:1}

  #algos{display:flex;border:1px solid var(--line);background:var(--paper);backdrop-filter:blur(8px)}
  #algos button{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--dim);
               background:transparent;border:0;padding:9px 12px;cursor:pointer;transition:all .3s var(--ease)}
  #algos button:hover{color:var(--ink)}
  #algos button.on{color:var(--paper-solid);background:var(--accent)}

  /* transport — 林间的放映机 */
  #transport{position:fixed;left:22px;bottom:64px;z-index:10;display:flex;gap:6px;align-items:center;
        background:var(--paper);border:1px solid var(--line);backdrop-filter:blur(10px);padding:9px 10px;
        transition:transform .5s var(--ease),opacity .5s var(--ease)}
  .tbtn{width:34px;height:30px;border:1px solid var(--line);background:transparent;cursor:pointer;
        color:var(--dim);display:flex;align-items:center;justify-content:center;transition:all .3s var(--ease)}
  .tbtn:hover{color:var(--ink);border-color:var(--accent)}
  .tbtn.on{color:var(--paper-solid);background:var(--accent);border-color:var(--accent)}
  .tbtn svg{fill:currentColor}
  #tstatus{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--dim);padding:0 8px;min-width:118px}
  #tstatus b{color:var(--gold);font-weight:500}

  #desk{position:fixed;left:22px;bottom:118px;z-index:10;width:238px;
        background:var(--paper);border:1px solid var(--line);backdrop-filter:blur(10px);
        padding:14px 16px 15px;transition:transform .5s var(--ease),opacity .5s var(--ease)}
  .desklabel{font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--dim);margin-bottom:10px}
  .srow{margin-bottom:9px}
  .srow .head{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;
              letter-spacing:.06em;color:var(--dim);margin-bottom:3px}
  .srow .head .v{color:var(--ink)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:
      linear-gradient(90deg,var(--accent) var(--fill,50%),rgba(78,94,66,.22) var(--fill,50%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
      background:var(--paper-solid);border:2px solid var(--accent);margin-top:-4.5px;transition:transform .2s var(--ease)}
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.25)}
  input[type=range]::-moz-range-track{height:2px;background:rgba(78,94,66,.22)}
  input[type=range]::-moz-range-progress{height:2px;background:var(--accent)}
  input[type=range]::-moz-range-thumb{width:9px;height:9px;border-radius:50%;
      background:var(--paper-solid);border:2px solid var(--accent)}
  .deskbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .btn{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--dim);
       border:1px solid var(--line);background:transparent;padding:7px 10px;cursor:pointer;
       transition:all .3s var(--ease)}
  .btn:hover{color:var(--ink);border-color:var(--accent)}
  .btn.on{color:var(--paper-solid);background:var(--accent);border-color:var(--accent)}
  .btn.full{flex:1 1 100%}
  body.hideui #desk,body.hideui #transport{transform:translateX(-130%);opacity:0;pointer-events:none}

  /* pseudocode — 画框背面的铅笔字 */
  #pseudo{position:fixed;right:22px;top:96px;z-index:10;width:220px;
        background:var(--paper);border:1px solid var(--line);backdrop-filter:blur(10px);
        padding:12px 14px;font-family:var(--mono);font-size:10px;line-height:1.9;color:var(--dim);
        transition:transform .5s var(--ease),opacity .5s var(--ease)}
  #pseudo .plabel{font-size:9px;letter-spacing:.22em;margin-bottom:6px;color:var(--dim)}
  #pseudo .ln{padding-left:8px;border-left:2px solid transparent;transition:all .3s var(--ease)}
  #pseudo .ln.cur{color:var(--ink);border-left-color:var(--gold);background:var(--accent-soft)}
  body.hideui #pseudo{transform:translateX(130%);opacity:0;pointer-events:none}

  #chip{position:fixed;z-index:20;pointer-events:none;background:var(--paper);border:1px solid var(--line);
        padding:8px 11px;font-family:var(--mono);font-size:10px;color:var(--ink);opacity:0;
        transform:translateY(4px);transition:opacity .25s var(--ease),transform .25s var(--ease);
        backdrop-filter:blur(8px);max-width:260px}
  #chip.show{opacity:1;transform:translateY(0)}
  #chip .cl{color:var(--accent);letter-spacing:.08em;display:block;margin-bottom:2px}
  #chip .d{color:var(--dim)}

  #timer{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:10;width:min(430px,72vw);
         background:var(--paper);border:1px solid var(--line);backdrop-filter:blur(10px);
         padding:9px 14px 8px;cursor:ew-resize;user-select:none;touch-action:none}
  #timer .face{position:relative;height:12px;margin-bottom:5px}
  #timer .track{position:absolute;left:0;right:0;top:5px;height:2px;
                background:linear-gradient(90deg,#2F3B2C,#7E8F5E 22%,#E8E3CE 50%,#D9A85C 74%,#2F3B2C)}
  #timer .tick{position:absolute;top:2px;width:1px;height:8px;background:rgba(78,94,66,.3)}
  #timer .sun{position:absolute;top:1px;width:10px;height:10px;border-radius:50%;
              background:#E8E3CE;border:2px solid var(--accent);transform:translateX(-50%);
              box-shadow:0 0 0 3px rgba(232,227,206,.35)}
  #timer .lab{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;
              letter-spacing:.12em;color:var(--dim)}
  #timer .lab b{color:var(--ink);font-weight:500}

  #uibtn{position:fixed;left:22px;bottom:16px;z-index:11;font-family:var(--mono);font-size:9.5px;
         letter-spacing:.12em;color:var(--dim);background:var(--paper);border:1px solid var(--line);
         padding:8px 12px;cursor:pointer;transition:all .3s var(--ease);backdrop-filter:blur(8px)}
  #uibtn:hover{color:var(--ink);border-color:var(--accent)}

  #note{position:fixed;right:22px;bottom:56px;z-index:11;width:min(320px,80vw);
        font-family:var(--serif);font-style:italic;font-size:13.5px;line-height:1.65;color:var(--ink);
        background:var(--paper);border:1px solid var(--line);padding:16px 18px;
        opacity:0;transform:translateY(8px);pointer-events:none;
        transition:opacity .6s var(--ease),transform .6s var(--ease);backdrop-filter:blur(10px)}
  #note.show{opacity:1;transform:translateY(0)}

  #colo{position:fixed;right:22px;bottom:16px;z-index:10;display:flex;align-items:center;gap:8px;
        font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--ink);opacity:.68;
        cursor:pointer;user-select:none}

  @media (max-width:760px){
    header{padding:12px 14px 22px;gap:10px}
    .etitle h1{font-size:17px}
    .etitle h1 span{display:block;margin:2px 0 0}
    .etitle .epig{font-size:12px}
    #desk{width:calc(100vw - 28px);left:14px;bottom:118px}
    #pseudo{display:none}
    #transport{left:14px;bottom:64px}
    #timer{width:calc(100vw - 120px);bottom:12px}
    #timer .lab span:last-child{display:none}
    #colo{right:14px;bottom:12px;font-size:8px}
    #uibtn{left:14px;bottom:12px}
  }
</style>
</head>
<body>

<header>
  <div class="seal">
    <svg width="50" height="50" viewBox="0 0 52 52" aria-label="Atelier MIRA seal">
      <circle cx="26" cy="26" r="24.6" fill="none" stroke="#4E5E42" stroke-width="1"/>
      <circle cx="26" cy="26" r="14.2" fill="none" stroke="#4E5E42" stroke-width=".55" opacity=".55"/>
      <path d="M18.4 33.4 V20.1 L25.9 29.9 L33.7 20.4 V33.1" fill="none" stroke="#4E5E42"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="etitle">
    <div class="no">ÉTUDE N°071 · AGENT-DEMOS</div>
    <h1>Planner Tree<span>林间规划树</span></h1>
    <div class="epig">「搜索是一束会走路的光，被剪掉的枝，落成叶子。」</div>
  </div>
  <div class="hdr-right">
    <div id="algos" role="group" aria-label="搜索算法">
      <button data-a="bfs" class="on">BFS 层访</button>
      <button data-a="dfs">DFS 深访</button>
      <button data-a="greedy">贪心 GOURMAND</button>
    </div>
    <button id="snd" aria-label="环境声开关" title="环境声（默认关闭）">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke-width="1.3" stroke-linecap="round">
        <path d="M2 6.5v3h2.4L8 12.6V3.4L4.4 6.5H2z"/>
        <path class="waves" d="M10.2 5.2a4 4 0 0 1 0 5.6M12 3.4a6.4 6.4 0 0 1 0 9.2"/>
      </svg>
    </button>
  </div>
</header>

<canvas id="field"></canvas>

<aside id="desk" aria-label="Réglage">
  <div class="desklabel">RÉGLAGE · 光与步</div>
  <div class="srow">
    <div class="head"><span class="k">步速 PAS</span><span class="v" id="v-pas">0.9 s/步</span></div>
    <input type="range" id="s-pas" min="15" max="200" value="90" aria-label="步速">
  </div>
  <div class="srow">
    <div class="head"><span class="k">风 VENT</span><span class="v" id="v-vent">3.6 m/s</span></div>
    <input type="range" id="s-vent" min="0" max="100" value="30" aria-label="风速">
  </div>
  <div class="deskbtns">
    <button class="btn" id="b-prune">随机剪枝 · X</button>
    <button class="btn full" id="b-regen">换一片林 · RESEED (G)</button>
    <button class="btn" id="b-link">COPY LINK</button>
    <button class="btn" id="b-png">SAVE PNG (S)</button>
  </div>
</aside>

<div id="transport">
  <button class="tbtn" id="t-prev" title="上一步">
    <svg width="12" height="12" viewBox="0 0 12 12"><path d="M8 1 L3 6 L8 11 M3 6 H11" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
  </button>
  <button class="tbtn" id="t-play" title="播放/暂停 (空格)">
    <svg width="12" height="12" viewBox="0 0 12 12" id="ic-play"><path d="M3 1.5 L10 6 L3 10.5 Z"/></svg>
    <svg width="12" height="12" viewBox="0 0 12 12" id="ic-pause" style="display:none"><path d="M3 1.5 H5 V10.5 H3 Z M7 1.5 H9 V10.5 H7 Z"/></svg>
  </button>
  <button class="tbtn" id="t-next" title="下一步">
    <svg width="12" height="12" viewBox="0 0 12 12"><path d="M4 1 L9 6 L4 11 M1 6 H9" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
  </button>
  <button class="tbtn" id="t-reset" title="重来">
    <svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 1 A5 5 0 1 1 1 6 M1 2 V6 H5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
  </button>
  <span id="tstatus">SEARCH · <b>IDLE</b></span>
</div>

<aside id="pseudo" aria-label="Pseudocode">
  <div class="plabel">PSEUDOCODE · 铅笔字</div>
  <div id="pseudo-body"></div>
</aside>

<div id="chip"></div>

<div id="timer" aria-label="时间轴">
  <div class="face" id="timerface">
    <div class="track"></div>
    <div class="sun" id="sundot"></div>
  </div>
  <div class="lab"><span id="t-phase">上午 LE MATIN</span><b id="t-clock">10:00</b><span>拖动 · 斑光随太阳移位</span></div>
</div>

<button id="uibtn" title="收起/展开面板 (H)">H · 面板</button>

<div id="note">最亮的那块斑光不一定是目标，贪心每次都被它骗一次。深访的那位走得很黑，但它到过所有地方。——画室手记 N°071</div>

<footer id="colo">
  <svg width="22" height="14" viewBox="0 0 64 40" fill="#33402C" aria-hidden="true">
    <path d="M32 20 C 26 12, 14 6, 4 8 C 12 12, 18 18, 24 21
             C 14 20, 6 22, 2 28 C 10 26, 18 26, 25 26
             C 27 30, 30 34, 34 36 C 33 32, 33 28, 34 25
             C 42 22, 52 16, 62 4 C 54 10, 44 16, 36 19
             C 35 17, 33 17, 32 20 Z"/>
  </svg>
  <span>ATELIER MIRA · N°071 · 林间光 SOUS-BOIS</span>
</footer>

<script>
"use strict";
const $=id=>document.getElementById(id);
const canvas=$("field"),ctx=canvas.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);fitCamera()}
addEventListener("resize",resize);

/* ================= seed & hash ================= */
const hashParams=new URLSearchParams(location.hash.slice(1));
let seed=parseInt(hashParams.get("seed"),10);
if(!Number.isFinite(seed))seed=(Math.random()*8999+1000)|0;
let heure=hashParams.get("h")!==null?+hashParams.get("h"):(new Date().getHours()+new Date().getMinutes()/60);
if(!Number.isFinite(heure)||heure<0||heure>24)heure=10;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function writeHash(){
  const p=new URLSearchParams({seed:String(seed),h:heure.toFixed(1),a:algo});
  history.replaceState(null,"","#"+p.toString());
}

/* ================= colour helpers ================= */
function hx(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function rgb2hsl(c){const[r,g,b]=c.map(v=>v/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
  let h=0,s=0;const l=(mx+mn)/2;const d=mx-mn;
  if(d){s=d/(1-Math.abs(2*l-1));if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}
  return[h,s,l]}
function hsl2rgb(h,s,l){const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;
  let r,g,b;if(h<60){r=c;g=x;b=0}else if(h<120){r=x;g=c;b=0}else if(h<180){r=0;g=c;b=x}
  else if(h<240){r=0;g=x;b=c}else if(h<300){r=x;g=0;b=c}else{r=c;g=0;b=x}
  return[Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)]}
function lerpHSL(a,b,k){const A=rgb2hsl(a),B=rgb2hsl(b);let dh=B[0]-A[0];
  if(dh>180)dh-=360;if(dh<-180)dh+=360;
  return hsl2rgb(A[0]+dh*k,A[1]+(B[1]-A[1])*k,A[2]+(B[2]-A[2])*k)}
function fade(col,target,k){const A=rgb2hsl(col),B=rgb2hsl(target);
  return hsl2rgb(A[0],A[1]+(B[1]-A[1])*k*.8,A[2]+(B[2]-A[2])*k)}
const rgb=(c,a)=>a===undefined?`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`:`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

/* ================= 林间光家族 + heure ================= */
const FAM={tache:hx("#E8E3CE"),feuille:hx("#B5B98A"),vert:hx("#7E8F5E"),
           sombre:hx("#4E5E42"),ombre:hx("#2F3B2C"),or:hx("#D9A85C")};
/* bg（林间空地光）, far（远景）, near（地面）, goldK（斑光强度） */
const KEYS=[
  {h:0,   bg:hx("#39443A"),far:hx("#2F3B2C"),near:hx("#3A4536"),goldK:0},
  {h:5,   bg:hx("#5E6A56"),far:hx("#4E5E42"),near:hx("#5E6A50"),goldK:.1},
  {h:7,   bg:hx("#C9CBB0"),far:hx("#8E9674"),near:hx("#A8AC84"),goldK:.5},
  {h:10,  bg:hx("#E0DEC6"),far:hx("#ACB488"),near:hx("#C2C49A"),goldK:.8},
  {h:13,  bg:hx("#E8E3CE"),far:hx("#B5B98A"),near:hx("#CBCDA4"),goldK:1},
  {h:16,  bg:hx("#E4DCC0"),far:hx("#B0B284"),near:hx("#C6C394"),goldK:.9},
  {h:17.8,bg:hx("#E0CEA4"),far:hx("#B0A06E"),near:hx("#C4B382"),goldK:1},
  {h:19.2,bg:hx("#B09A72"),far:hx("#8A7C56"),near:hx("#9A8A62"),goldK:.7},
  {h:20.6,bg:hx("#6A7258"),far:hx("#55624A"),near:hx("#606A50"),goldK:.25},
  {h:22,  bg:hx("#39443A"),far:hx("#2F3B2C"),near:hx("#3A4536"),goldK:0},
  {h:24,  bg:hx("#39443A"),far:hx("#2F3B2C"),near:hx("#3A4536"),goldK:0},
];
function sampleLight(h){
  h=((h%24)+24)%24;
  let i=0;while(i<KEYS.length-2&&KEYS[i+1].h<h)i++;
  const a=KEYS[i],b=KEYS[i+1],k=Math.min(1,Math.max(0,(h-a.h)/(b.h-a.h)));
  const e=k*k*(3-2*k);
  return{bg:lerpHSL(a.bg,b.bg,e),far:lerpHSL(a.far,b.far,e),near:lerpHSL(a.near,b.near,e),
         goldK:a.goldK+(b.goldK-a.goldK)*e};
}
function phaseName(h){
  if(h<4.5||h>=21.5)return"夜 LA NUIT";
  if(h<6)return"拂晓 AVANT L'AUBE";
  if(h<9)return"清晨 L'AUBE";
  if(h<11.5)return"上午 LE MATIN";
  if(h<15)return"正午 MIDI";
  if(h<17)return"午后 L'APRÈS-MIDI";
  if(h<19.8)return"林间金光 L'OR DU SOIR";
  return"入夜 LA TOMBÉE";
}

  {name:"接口设计",h:.52,children:[{name:"写迁移脚本",h:.44},{name:"准备彩排脚本",h:.69}]},

]};
const WW=1500,WH=940; /* 世界坐标 */
let nodes=[],links=[],grass=[],dapples=[],leaves=[],farTrunks=[],fireflies=[];
function countLeaves(d){return d.children?d.children.reduce((s,c)=>s+countLeaves(c),0):1}
function buildTree(){
  const rng=mulberry32(seed^0x5eed);
  nodes=[];links=[];
  let leafX=0;
  const X0=WW*.14,X1=WW*.92;
  function place(d,depth,parent){
    const n={name:d.name,h:Math.max(.05,Math.min(.99,d.h+(rng()-.5)*.08)),goal:!!d.goal,depth,parent,
             children:[],ph:rng()*7,visited:-1,pruned:false,wx:0,wy:0,glowT:-9};
    if(parent){parent.children.push(n);
      links.push({a:parent,b:n,bend:(rng()-.5)*60})}
    if(d.children&&d.children.length){
      d.children.forEach(c=>place(c,depth+1,n));
      n.wx=n.children.reduce((s,c)=>s+c.wx,0)/n.children.length;
    }else{
      n.wx=X0+(leafX++)/(countLeaves(TREE_DATA)-1)*(X1-X0);
    }
    n.wy=WH*.16+depth*WH*.185+(rng()-.5)*14;
    nodes.push(n);
    return n;
  }
  place(TREE_DATA,0,null);
  grass=[];
  for(let i=0;i<900;i++)grass.push({nx:rng(),ny:rng(),len:3+rng()*9,hue:rng(),ph:rng()*7,tilt:(rng()-.5)*.5});
  dapples=[];
  for(let i=0;i<26;i++)dapples.push({nx:rng(),ny:rng(),r:16+rng()*46,sp:(rng()-.5)*.4,ph:rng()*7});
  farTrunks=[];
  for(let i=0;i<7;i++)farTrunks.push({nx:rng(),w:12+rng()*26,lean:(rng()-.5)*.15,hue:rng()});
  fireflies=[];
  for(let i=0;i<18;i++)fireflies.push({nx:rng(),ny:rng(),ph:rng()*7,sp:.3+rng()*.6});
  leaves=[];
}
let cam={x:WW/2,y:WH/2,z:1,tx:WW/2,ty:WH/2,tz:1};
function fitCamera(){
  const z=Math.min(W/WW,H/WH)*1.02;
  cam.z=cam.tz=z;
  cam.x=cam.tx=WW/2;cam.y=cam.ty=WH*.52;
}
const w2s=(x,y)=>({x:W/2+(x-cam.x)*cam.z,y:H/2+(y-cam.y)*cam.z});

/* ================= 搜索 ================= */
let algo=["bfs","dfs","greedy"].includes(hashParams.get("a"))?hashParams.get("a"):"bfs";
let visitOrder=[],step=-1,playing=false,stepTimer=0,PAS=.9,found=false;
function computeOrder(){
  const alive=n=>!n.pruned;
  const root=nodes[0];
  const ord=[];
  if(algo==="bfs"){
    const q=[root];
    while(q.length){const n=q.shift();if(!alive(n))continue;ord.push(n);
      n.children.forEach(c=>q.push(c))}
  }else if(algo==="dfs"){
    (function rec(n){if(!alive(n))return;ord.push(n);n.children.forEach(rec)})(root);
  }else{
    const open=[root];
    while(open.length){
      open.sort((a,b)=>a.h-b.h); /* h 小者优先：h=与目标的距离 */
      const n=open.shift();if(!alive(n))continue;ord.push(n);
      n.children.forEach(c=>open.push(c));
    }
  }
  visitOrder=ord;
}
const PSEUDO={
  bfs:["Q ← {根节点}","while Q 非空:","  n ← 取出队首","  若 n 是目标 → 返回","  子节点依次入队"],
  dfs:["S ← {根节点}","while S 非空:","  n ← 弹出栈顶","  若 n 是目标 → 返回","  子节点逆序压栈"],
  greedy:["open ← {根节点}","while open 非空:","  n ← h 最小者","  若 n 是目标 → 返回","  子节点全部入 open"],
};
function renderPseudo(){
  const cur=step<0?-1:Math.min(4,2+(step%3));
  $("pseudo-body").innerHTML=PSEUDO[algo].map((l,i)=>
    `<div class="ln ${i===cur?"cur":""}">${l}</div>`).join("");
}
function setAlgo(a){
  algo=a;computeOrder();resetSearch();
  document.querySelectorAll("#algos button").forEach(x=>x.classList.toggle("on",x.dataset.a===a));
  renderPseudo();writeHash();
}
document.querySelectorAll("#algos button").forEach(b=>b.addEventListener("click",()=>setAlgo(b.dataset.a)));
function resetSearch(){
  step=-1;playing=false;found=false;stepTimer=0;
  nodes.forEach(n=>n.visited=-1);
  $("ic-play").style.display="";$("ic-pause").style.display="none";
  $("tstatus").innerHTML="SEARCH · <b>IDLE</b>";
  renderPseudo();
}
function doStep(){
  step++;
  if(step>=visitOrder.length){
    playing=false;$("ic-play").style.display="";$("ic-pause").style.display="none";
    $("tstatus").innerHTML=found?"GOAL · <b>TROUVÉ</b>":"END · <b>剪光了</b>";
    renderPseudo();return;
  }
  const n=visitOrder[step];
  n.visited=step;
  n.glowT=t;
  if(n.goal){
    found=true;playing=false;
    $("ic-play").style.display="";$("ic-pause").style.display="none";
    $("tstatus").innerHTML=`GOAL · <b>${n.name}</b> · ${step+1} 步`;
    burstLeaves(n);
  }else{
    $("tstatus").innerHTML=`VISIT ${step+1}/${visitOrder.length} · <b>${n.name.slice(0,8)}</b>`;
  }
  renderPseudo();
}
function togglePlay(){
  if(step>=visitOrder.length)resetSearch();
  playing=!playing;
  $("ic-play").style.display=playing?"none":"";
  $("ic-pause").style.display=playing?"":"none";
}
$("t-play").addEventListener("click",togglePlay);
$("t-next").addEventListener("click",()=>{playing=false;$("ic-play").style.display="";$("ic-pause").style.display="none";doStep()});
$("t-prev").addEventListener("click",()=>{
  const keep=step-1;resetSearch();
  for(let i=0;i<=keep;i++)doStep();
  playing=false;$("ic-play").style.display="";$("ic-pause").style.display="none";
});

function burstLeaves(n){
  for(let i=0;i<46;i++){
    leaves.push({x:n.wx+(Math.random()-.5)*30,y:n.wy+(Math.random()-.5)*20,
      vx:(Math.random()-.5)*2.2,vy:-Math.random()*1.4,rot:Math.random()*7,vr:(Math.random()-.5)*.2,
      life:1,gold:Math.random()<.6});
  }
}
function shedLeaves(n){
  (function rec(m){m.pruned=true;m.children.forEach(rec)})(n);
  for(let i=0;i<26;i++){
    leaves.push({x:n.wx+(Math.random()-.5)*60,y:n.wy+(Math.random()-.5)*40,
      vx:(Math.random()-.5)*1.6,vy:-Math.random()*.8,rot:Math.random()*7,vr:(Math.random()-.5)*.15,
      life:1,gold:Math.random()<.25});
  }
  computeOrder();resetSearch();
}

/* ================= pointer：拖拽平移（惯性）+ 缩放 + 节点 ================= */
const ptr={down:false,moved:0,vx:0,vy:0,lx:0,ly:0};
let hovered=null,lastTap=0,tapNode=null;
function pickNode(sx,sy){
  let best=null,bd=1e9;
  nodes.forEach(n=>{const p=w2s(n.wx,n.wy);const d=Math.hypot(p.x-sx,p.y-sy);
    if(d<24&&d<bd){bd=d;best=n}});
  return best;
}
canvas.addEventListener("pointerdown",e=>{
  ptr.down=true;ptr.moved=0;ptr.lx=e.clientX;ptr.ly=e.clientY;
  canvas.setPointerCapture(e.pointerId);canvas.classList.add("drag");
});
canvas.addEventListener("pointermove",e=>{
  if(ptr.down){
    const dx=e.clientX-ptr.lx,dy=e.clientY-ptr.ly;
    ptr.moved+=Math.abs(dx)+Math.abs(dy);
    cam.tx-=dx/cam.z;cam.ty-=dy/cam.z;
    ptr.vx=-dx/cam.z;ptr.vy=-dy/cam.z;
    ptr.lx=e.clientX;ptr.ly=e.clientY;
    cam.x=cam.tx;cam.y=cam.ty; /* 拖动中跟随，松手后惯性 */
    return;
  }
  hovered=pickNode(e.clientX,e.clientY);
  canvas.style.cursor=hovered?"pointer":"grab";
  const chip=$("chip");
  if(!hovered){chip.classList.remove("show");return}
  chip.innerHTML=`<span class="cl">${hovered.name}</span><span class="d">h=${hovered.h.toFixed(2)} · 深 ${hovered.depth} ${hovered.goal?"· 目标 GOAL":""}${hovered.pruned?" · 已剪":""}${hovered.visited>=0?" · 第 "+(hovered.visited+1)+" 步到访":""}</span>`;
  chip.style.left=Math.min(W-270,e.clientX+16)+"px";
  chip.style.top=Math.max(8,e.clientY-34)+"px";
  chip.classList.add("show");
});
canvas.addEventListener("pointerup",e=>{
  ptr.down=false;canvas.classList.remove("drag");
  if(ptr.moved<6){
    const n=pickNode(e.clientX,e.clientY);
    const now=performance.now();
    if(n&&n===tapNode&&now-lastTap<420&&n.parent){shedLeaves(n);tapNode=null}
    else{
      tapNode=n;lastTap=now;
      if(n&&n.visited<0)n.glowT=t; /* 单击：光跳过去预习一眼 */
    }
  }
});
canvas.addEventListener("pointerleave",()=>{hovered=null;$("chip").classList.remove("show")});
canvas.addEventListener("wheel",e=>{
  e.preventDefault();
  const k=Math.exp(-e.deltaY*.001);
  cam.tz=Math.min(2.6,Math.max(.4,cam.tz*k));
},{passive:false});

/* ================= sound (L5, 默认 OFF)：风穿叶 + 远鸟 ================= */
const Snd=(()=>{
  let ac=null,master=null,on=false,birdTimer=null;
  function build(){
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain();master.gain.value=0;master.connect(ac.destination);
    const len=ac.sampleRate*4,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
    let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.2}
    const src=ac.createBufferSource();src.buffer=buf;src.loop=true;
    const bp=ac.createBiquadFilter();bp.type="bandpass";bp.frequency.value=620;bp.Q.value=.9;
    const wg=ac.createGain();wg.gain.value=.11;
    src.connect(bp);bp.connect(wg);wg.connect(master);src.start();
    const lfo=ac.createOscillator();lfo.frequency.value=.07;
    const lg=ac.createGain();lg.gain.value=220;lfo.connect(lg);lg.connect(bp.frequency);lfo.start();
    const lfo2=ac.createOscillator();lfo2.frequency.value=.13;
    const lg2=ac.createGain();lg2.gain.value=.045;lfo2.connect(lg2);lg2.connect(wg.gain);lfo2.start();
  }
  function chirp(){
    if(!on)return;
    const t0=ac.currentTime+.05;
    const o=ac.createOscillator(),g=ac.createGain(),m=ac.createOscillator(),mg=ac.createGain();
    o.type="sine";o.frequency.setValueAtTime(2600+Math.random()*300,t0);
    o.frequency.exponentialRampToValueAtTime(3200+Math.random()*400,t0+.08);
    m.frequency.value=42+Math.random()*28;mg.gain.value=340;m.connect(mg);mg.connect(o.frequency);
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.022,t0+.02);
    g.gain.exponentialRampToValueAtTime(.0004,t0+.34);
    o.connect(g);g.connect(master);m.start(t0);o.start(t0);o.stop(t0+.4);m.stop(t0+.4);
    birdTimer=setTimeout(chirp,(2+Math.random()*7)*1000);
  }
  return{toggle(){
      if(!ac)build();
      if(ac.state==="suspended")ac.resume();
      on=!on;
      master.gain.cancelScheduledValues(ac.currentTime);
      master.gain.linearRampToValueAtTime(on?1:0,ac.currentTime+1.5);
      if(on)chirp();else clearTimeout(birdTimer);
      localStorage.setItem("mira-snd-071",on?"1":"0");
      return on;
    }};
})();
$("snd").addEventListener("click",()=>$("snd").classList.toggle("on",Snd.toggle()));

/* ================= draw ================= */
let t=0;
function drawBranch(l){
  const A=l.a,B=l.b;
  const a0=w2s(A.wx,A.wy),b0=w2s(B.wx,B.wy);
  const mx=(a0.x+b0.x)/2+l.bend*cam.z,my=(a0.y+b0.y)/2;
  if(B.pruned){
    ctx.strokeStyle=rgb(FAM.sombre,.28);
    ctx.setLineDash([2,6]);ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(a0.x,a0.y);
    ctx.quadraticCurveTo(mx,my,b0.x,b0.y);
    ctx.stroke();ctx.setLineDash([]);
    return;
  }
  const lit=B.visited>=0;
  const segs=7;
  for(let s=0;s<segs;s++){
    const k0=s/segs,k1=(s+1)/segs;
    const px0=(1-k0)*(1-k0)*a0.x+2*(1-k0)*k0*mx+k0*k0*b0.x;
    const py0=(1-k0)*(1-k0)*a0.y+2*(1-k0)*k0*my+k0*k0*b0.y;
    const px1=(1-k1)*(1-k1)*a0.x+2*(1-k1)*k1*mx+k1*k1*b0.x;
    const py1=(1-k1)*(1-k1)*a0.y+2*(1-k1)*k1*my+k1*k1*b0.y;
    const sway=Math.sin(t*1.1+B.ph+s)*VENT*2.2*k1;
    let c;
    if(lit)c=lerpHSL(FAM.or,FAM.tache,.15+.1*Math.sin(s+B.ph));
    else c=s%2?fade(FAM.ombre,FAM.sombre,.25):fade(FAM.sombre,FAM.ombre,.3);
    ctx.strokeStyle=rgb(c,lit?.92:.9);
    ctx.lineWidth=Math.max(1.2,(6-B.depth*1.2)*(1-k1*.5))*cam.z*(lit?1.15:1);
    ctx.beginPath();ctx.moveTo(px0,py0+sway);ctx.lineTo(px1,py1+sway);ctx.stroke();
  }
}
function draw(now){
  const L=sampleLight(heure);
  const dayF=Math.min(1,Math.max(0,Math.min((heure-5.2)/1.6,(20.8-heure)/1.6,1)));
  /* 相机：阻尼 + 惯性 + 静置呼吸 */
  if(!ptr.down){
    cam.tx+=ptr.vx;cam.ty+=ptr.vy;ptr.vx*=.94;ptr.vy*=.94;
    const idle=(performance.now()-lastInteract)/1000;
    if(idle>20){cam.tx+=Math.sin(now*.11)*.12;cam.ty+=Math.cos(now*.09)*.08}
  }
  cam.x+=(cam.tx-cam.x)*.09;cam.y+=(cam.ty-cam.y)*.09;cam.z+=(cam.tz-cam.z)*.09;
  /* --- 林间空地基底 --- */
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,rgb(L.bg));g.addColorStop(1,rgb(L.near));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  /* 天光碎色层：顶部的叶隙笔触 */
  for(let i=0;i<200;i++){
    const sx=(i*61.7)%W,sy=(i*23.3)%(H*.3);
    const c2=fade(lerpHSL(L.bg,FAM.tache,(i%5)/5*.4),FAM.feuille,(i%7)/7*.3);
    ctx.strokeStyle=rgb(c2,.10+((i*13)%10)/10*.07);
    ctx.lineWidth=1.6;
    const sl=8+((i*17)%22);
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+sl,sy+Math.sin(i*1.7)*2);ctx.stroke();
  }
  /* --- 远景树干（大气透视） --- */
  farTrunks.forEach(tr=>{
    const x=tr.nx*W;
    const c=fade(FAM.ombre,L.bg,.62+tr.hue*.14);
    ctx.fillStyle=rgb(c,.5);
    ctx.beginPath();
    ctx.moveTo(x-tr.w/2,H);
    ctx.quadraticCurveTo(x+tr.lean*H,H*.4,x+tr.lean*H*1.4,-10);
    ctx.lineTo(x+tr.lean*H*1.4+tr.w,-10);
    ctx.quadraticCurveTo(x+tr.lean*H+tr.w,H*.4,x+tr.w/2,H);
    ctx.closePath();ctx.fill();
  });
  /* --- 地面碎色草笔触 --- */
  const groundY=H*.30;
  grass.forEach(gr=>{
    const depth=gr.ny;
    const x=gr.nx*W,y=groundY+depth*(H-groundY);
    const sway=Math.sin(t*(1.2+gr.hue)+gr.ph)*(VENT*4+1)*depth;
    let c;
    if(gr.hue>.86)c=fade(L.near,FAM.or,.5*L.goldK+.1);
    else if(gr.hue<.34)c=fade(L.near,FAM.sombre,.55);
    else c=lerpHSL(L.far,L.near,depth*.7+gr.hue*.2);
    ctx.strokeStyle=rgb(c,.5+.32*depth);
    ctx.lineWidth=Math.max(.7,1.5*depth);
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(x+gr.tilt*4+sway,y-gr.len*(.5+depth*.7));
    ctx.stroke();
  });
  /* --- 漂移斑光 --- */
  if(L.goldK>.03){
    dapples.forEach(d=>{
      d.nx+=d.sp*.0004;if(d.nx>1.1)d.nx=-.1;if(d.nx<-.1)d.nx=1.1;
      const x=d.nx*W+Math.sin(t*.3+d.ph)*14;
      const y=groundY+d.ny*(H-groundY)*.94;
      const fl=.6+.4*Math.sin(t*.7+d.ph);
      ctx.fillStyle=rgb(FAM.or,.20*L.goldK*fl);
      ctx.beginPath();ctx.ellipse(x,y,d.r,d.r*.38,0,0,7);ctx.fill();
      ctx.fillStyle=rgb(FAM.tache,.12*L.goldK*fl);
      ctx.beginPath();ctx.ellipse(x-d.r*.2,y-d.r*.06,d.r*.6,d.r*.2,0,0,7);ctx.fill();
    });
  }
  /* --- 枝 --- */
  links.forEach(l=>drawBranch(l));
  /* --- 节点 --- */
  nodes.forEach(n=>{
    const p=w2s(n.wx,n.wy);
    if(p.x<-80||p.x>W+80||p.y<-40||p.y>H+40)return;
    const isHov=n===hovered;
    const glow=Math.max(0,1-(t-n.glowT)/.9);
    if(n.visited>=0){
      const pulse=.7+.3*Math.sin(t*2+n.ph);
      const c=n.goal?FAM.or:fade(FAM.or,FAM.tache,.25);
      ctx.fillStyle=rgb(c,(n.goal?.5:.3)*pulse+glow*.4);
      ctx.beginPath();ctx.ellipse(p.x,p.y,(n.goal?26:16)*cam.z,(n.goal?26:16)*.7*cam.z,0,0,7);ctx.fill();
      ctx.font=`${8.5*Math.max(.8,cam.z)}px 'SF Mono',Menlo,monospace`;
      ctx.textAlign="center";
      ctx.fillStyle=rgb(FAM.ombre,.85);
      ctx.fillText(String(n.visited+1),p.x,p.y+3*cam.z);
    }
    if(step>=0&&step<visitOrder.length&&visitOrder[step]===n){
      const pl=1+.3*Math.sin(t*6);
      ctx.fillStyle=rgb(FAM.or,.5);
      ctx.beginPath();ctx.arc(p.x,p.y-14*cam.z,9*pl*cam.z,0,7);ctx.fill();
      ctx.fillStyle=rgb(FAM.tache,.85);
      ctx.beginPath();ctx.arc(p.x,p.y-14*cam.z,4.5*pl*cam.z,0,7);ctx.fill();
    }
    ctx.strokeStyle=rgb(n.pruned?FAM.sombre:FAM.sombre,n.pruned?.4:.85);
    ctx.lineWidth=1.3;
    ctx.fillStyle=rgb(FAM.tache,.92);
    ctx.beginPath();ctx.arc(p.x,p.y,4.6*cam.z,0,7);ctx.fill();ctx.stroke();
    if(n.goal&&!n.pruned){
      ctx.strokeStyle=rgb(FAM.or,.9);ctx.lineWidth=1.6;
      ctx.beginPath();ctx.arc(p.x,p.y,8.5*cam.z,0,7);ctx.stroke();
    }
    /* 纸签名牌 */
    const fs=9.5*Math.max(.75,Math.min(1.1,cam.z));
    ctx.font=`${fs}px 'SF Mono',Menlo,monospace`;
    ctx.textAlign="center";
    const tw=ctx.measureText(n.name).width+12;
    const ly2=p.y+14*cam.z;
    ctx.fillStyle=rgb(FAM.tache,n.pruned?.5:.85);
    ctx.fillRect(p.x-tw/2,ly2-2,tw,fs+7);
    ctx.strokeStyle=rgb(n.goal?FAM.or:FAM.sombre,.4);ctx.lineWidth=.8;
    ctx.strokeRect(p.x-tw/2,ly2-2,tw,fs+7);
    ctx.fillStyle=rgb(n.pruned?FAM.sombre:isHov?FAM.ombre:FAM.sombre,n.pruned?.4:.95);
    ctx.fillText(n.name,p.x,ly2+fs);
    if(isHov){
      ctx.font=`${8*Math.max(.75,cam.z)}px 'SF Mono',Menlo,monospace`;
      ctx.fillStyle=rgb(FAM.sombre,.7);
      ctx.fillText("h="+n.h.toFixed(2),p.x,ly2+fs+11);
    }
  });
  /* --- 落叶粒子 --- */
  for(let i=leaves.length-1;i>=0;i--){
    const lf=leaves[i];
    lf.vy+=.05;lf.vx*=.985;lf.vy*=.985;
    lf.x+=lf.vx+Math.sin(t*3+lf.rot)*.8*(1+VENT*2);
    lf.y+=lf.vy;lf.rot+=lf.vr;lf.life-=.004;
    if(lf.life<=0){leaves.splice(i,1);continue}
    const p=w2s(lf.x,lf.y);
    const c=lf.gold?FAM.or:fade(FAM.vert,FAM.sombre,.3);
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(lf.rot);
    ctx.fillStyle=rgb(c,lf.life*.85);
    ctx.beginPath();ctx.ellipse(0,0,4.5,2,0,0,7);ctx.fill();
    ctx.restore();
  }
  /* --- 夜：萤火虫 --- */
  if(dayF<.35){
    fireflies.forEach(f=>{
      f.nx+=Math.sin(t*f.sp+f.ph)*.0004;f.ny+=Math.cos(t*f.sp*1.3+f.ph)*.0003;
      const blink=Math.max(0,Math.sin(t*1.7+f.ph*3));
      if(blink<.4)return;
      ctx.fillStyle=rgb(FAM.or,(blink-.4)*.5*(.35-dayF)*3);
      ctx.beginPath();ctx.arc(f.nx*W,f.ny*H,1.8,0,7);ctx.fill();
    });
  }
  /* --- 搜索步进 --- */
  if(playing){
    stepTimer+=1/60;
    if(stepTimer>=PAS){stepTimer=0;doStep()}
  }
  /* --- 纸纹 + 颗粒 --- */
  if(!paperPat)paperPat=ctx.createPattern(paperC,"repeat");
  ctx.save();ctx.globalAlpha=.07;ctx.globalCompositeOperation="multiply";
  ctx.fillStyle=paperPat;ctx.fillRect(0,0,W,H);ctx.restore();
  updateGrain(now*1000);
  if(!grainPat)grainPat=ctx.createPattern(grainC,"repeat");
  if(grainPat){ctx.save();ctx.globalAlpha=.03;ctx.globalCompositeOperation="overlay";
    ctx.fillStyle=grainPat;ctx.fillRect(0,0,W,H);ctx.restore()}
  syncTimer();
}

/* ================= boot ================= */
resize();buildTree();computeOrder();renderPseudo();writeHash();
if(innerWidth<760){document.body.classList.add("snap","hideui");setTimeout(()=>document.body.classList.remove("snap"),700)}
let last=performance.now(),frameN=0;
(function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  t+=dt;frameN++;
  draw(now/1000);
  requestAnimationFrame(loop);
})(last);
</script>
</body></html>
